name: Build and Release PDFs

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || 'release' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Compile LaTeX Books & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (XeLaTeX) & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-lang-chinese \
            fonts-sil-charis \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-dejavu-core \
            fontconfig
          sudo fc-cache -fv

      - name: Verify required fonts
        run: |
          fc-list | grep -iE "Charis SIL|Noto Sans|Noto Serif CJK|DejaVu Sans Mono" | head -n 40

      - name: Compile all PDF books via publish.ps1
        shell: pwsh
        run: |
          ./publish.ps1

      - name: Build interactive practice page
        run: |
          python3 -m pip install --quiet pyyaml
          python3 interactive/build.py

      - name: Stage ASCII-named release assets
        run: |
          mkdir -p release_assets
          cp "dist/practice/index.html" "release_assets/NCD_Practice.html"
          cp "dist/00_新概念丹麦语_总目录与语法大纲.pdf" "release_assets/00_NCD_Syllabus.pdf"
          cp "dist/NCD1_Foerste_Skridt.pdf" "release_assets/NCD1_Foerste_Skridt.pdf"
          cp "dist/NCD2_Fra_Saetning_til_Tekst.pdf" "release_assets/NCD2_Fra_Saetning_til_Tekst.pdf"
          cp "dist/NCD2_DU3_Modul2_Modultest_1_4.pdf" "release_assets/NCD2_DU3_Modul2_Modultest_1_4.pdf"
          cp "dist/NCD3_Hverdag_og_Samfund.pdf" "release_assets/NCD3_Hverdag_og_Samfund.pdf"
          cp "dist/NCD3_DU3_Modul3_Modultest_1_4.pdf" "release_assets/NCD3_DU3_Modul3_Modultest_1_4.pdf"
          cp "dist/NCD4_Holdning_og_Debat.pdf" "release_assets/NCD4_Holdning_og_Debat.pdf"
          cp "dist/NCD4_DU3_Modul4_Modultest_1_4.pdf" "release_assets/NCD4_DU3_Modul4_Modultest_1_4.pdf"
          cp "dist/NCD5_Tanke_og_Perspektiv.pdf" "release_assets/NCD5_Tanke_og_Perspektiv.pdf"
          ls -lh release_assets/

      - name: Upload PDF workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ncd-books-pdf
          path: |
            release_assets/*.pdf
            release_assets/*.html
          retention-days: 30

      - name: Publish or update GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || echo 'v1.6.0')"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing GitHub Release: $TAG"
            gh release upload "$TAG" release_assets/*.pdf release_assets/*.html --clobber
          else
            echo "Creating new GitHub Release: $TAG"
            cat << 'EOF' > release_notes.md
          ## 《新概念丹麦语》（Ny Koncept Dansk）PDF 电子书合集

          由 GitHub Actions (`XeLaTeX`) 自动编译生成，无需配置本地 LaTeX 环境即可直接下载阅读：

          - **00_NCD_Syllabus.pdf** — 《新概念丹麦语 1–5 总目录与螺旋式语法大纲》（104 课全规划 + 30 天 Modul 2 速通路线）
          - **NCD1_Foerste_Skridt.pdf** — 《新概念丹麦语 1 · Første Skridt》（全 6 单元 24 课，对标 NCE 1 / DU3 Modul 1）
          - **NCD2_Fra_Saetning_til_Tekst.pdf** — 《新概念丹麦语 2 · Fra Sætning til Tekst》（全 4 单元 24 课，对标 NCE 2 / DU3 Modul 2）
          - **NCD2_DU3_Modul2_Modultest_1_4.pdf** — 《新概念丹麦语 2 · DU3 Modul 2 全真模考四套卷》（Modultest 1–4 完整试卷 + 评分卡 + 逐题精析 + A2/A2+ 双档范文与口语逐字稿）
          - **NCD3_Hverdag_og_Samfund.pdf** — 《新概念丹麦语 3 · Hverdag og Samfund》（全 4 单元 20 课，对标 NCE 2 后半–NCE 3 前半 / DU3 Modul 3）
          - **NCD3_DU3_Modul3_Modultest_1_4.pdf** — 《新概念丹麦语 3 · DU3 Modul 3 全真模考四套卷》（Modultest 1–4 完整试卷 + 评分卡 + 逐题精析 + B1/B1+ 投诉/推荐/邮件双档范文与口语互动逐字稿）
          - **NCD4_Holdning_og_Debat.pdf** — 《新概念丹麦语 4 · Holdning og Debat》（全 4 单元 20 课，对标 NCE 3 / DU3 Modul 4）
          - **NCD4_DU3_Modul4_Modultest_1_4.pdf** — 《新概念丹麦语 4 · DU3 Modul 4 全真模考四套卷》（Modultest 1–4 完整试卷 + 29 分评分卡 + 逐题精析 + B1+/B2- 邮件/辩论帖双档范文与口语利弊/辩论逐字稿）
          - **NCD5_Tanke_og_Perspektiv.pdf** — 《新概念丹麦语 5 · Tanke og Perspektiv》（全 4 单元 16 课，对标 NCE 4 / PD3 → Studieprøven，B2→C1）
          - **NCD_Practice.html** — 离线交互练习（下载后双击打开；在线版见 GitHub Pages）
          EOF
            gh release create "$TAG" release_assets/*.pdf release_assets/*.html \
              --title "Ny Koncept Dansk ($TAG) — 新概念丹麦语 PDF 电子书合集" \
              --notes-file release_notes.md \
              --latest
          fi

  deploy-practice:
    name: Deploy Interactive Practice to GitHub Pages
    # the github-pages environment only accepts deployments from main; tag runs carry
    # the same content that the preceding main push already deployed
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}practice/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build interactive practice page
        run: |
          python3 -m pip install --quiet pyyaml
          python3 interactive/build.py

      - name: Assemble Pages site
        run: |
          mkdir -p site/practice
          cp dist/practice/index.html site/practice/index.html
          # recorded clips (committed, content-addressed) are served next to the page
          if [ -d dist/practice/audio ]; then cp -r dist/practice/audio site/practice/audio; fi
          cat > site/index.html << 'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=practice/">
          <title>NCD 交互练习</title>
          <a href="practice/">NCD 交互练习</a>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
