book: ncd1
lesson: 3
title_da: På sprogskolen i første pause
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: 第一节课结束，迎来 20 分钟的课间休息。新生 Emma 想喝一杯咖啡，顺便向已经提前转过一圈的同学 Marco 打听食堂、洗手间和自习室的位置。
  paras:
  - zh: 啊，终于课间休息了！我真需要一杯咖啡。咖啡机在哪儿？
    note: endelig ˈɛnəli（d 和 g 都不发音！）；pause ˈpʰɑʊ̯sə；en kop kaffe eŋ ˈkʰʌb ˈkʰafə（en 在 k 前常同化成 eŋ）。
    segs:
    - id: dialog-1
      who: Emma
      da: Åh, endelig pause! Jeg har virkelig brug for en kop kaffe. Hvor er kaffemaskinen?
  - zh: 食堂那边有一台咖啡机。跟我来吧！
    note: der dɛɐ̯（在存在句开头常弱读成轻短的 dɑ 或 dɛ）；kantinen kʰanˈtʰiːnən（重音在第二音节）；mig ˈmɑɪ̯（g 滑成 i 音）。
    segs:
    - id: dialog-2
      who: Marco
      da: Der står en kaffemaskine henne ved kantinen. Kom med mig!
  - zh: 谢谢！食堂到底在哪儿呀？是在二楼吗？
    note: ligger ˈleɡɐ（短元音 e，gg 读 ɡ）；egentlig ˈeːˀənli（中间 g 和 t 均完全脱落！）；første sal ˈfɶɐ̯sdə ˈsæːˀl（注意在丹麦指“二楼”）。
    segs:
    - id: dialog-3
      who: Emma
      da: Tak! Hvor ligger kantinen egentlig? Er det på første sal?
  - zh: 不是，食堂在一楼，就在前台旁边。你看，墙上挂着一块指示牌。
    note: stueetagen ˈsduːəˌetʰæːɕən（-ge- 读作接近“西”的 ɕ）；receptionen ʁesɛbˈɕoːˀnən；væggen ˈvɛɡən（短元音双写 g）。
    segs:
    - id: dialog-4
      who: Marco
      da: Nej, kantinen ligger i stueetagen ved siden af receptionen. Se, der hænger et skilt på væggen.
  - zh: 太好了！我包里有一瓶水，不过认识一下咖啡机在哪儿也挺好。
    note: vand ˈvanˀ（d 不发音，n 带喉塞音）；tasken ˈtʰasgən；kende ˈkʰɛnə（nd 中的 d 不发音）。
    segs:
    - id: dialog-5
      who: Emma
      da: Fint! Jeg har en flaske vand i tasken, men kaffemaskinen er god at kende.
  - zh: 是呀，不过小心点：自动贩卖机出的杯子非常烫！
    note: pas på ˈpʰas ˈpʰɔːˀ；koppen ˈkʰʌbən（对比 en kop ˈkʰʌb，双写 p 保持前面的短元音）；automaten ɑʊ̯tʰoˈmæːˀdən；meget ˈmɑɪ̯əð（g 滑成 ɪ̯，t 读软 d）。
    segs:
    - id: dialog-6
      who: Marco
      da: 'Ja, men pas på: koppen fra automaten er meget varm!'
  - zh: 谢谢提醒！那这一层哪里有洗手间？
    note: rådet ˈʁɔːˀðəð（råd 的 d 与词尾 -et 均读软 ð）；et toilet ed tʰoɑˈlɛd；etagen eˈtʰæːˀɕən。
    segs:
    - id: dialog-7
      who: Emma
      da: Tak for rådet! Og hvor er der et toilet her på etagen?
  - zh: 洗手间就在过了那扇门往左拐的地方。这儿也有自习室吗？
    note: toilettet tʰoɑˈlɛdəð（重点！中性定指后缀 -et 永远读弱弱的 əð，绝不要读出硬 t）；til venstre tʰe ˈvɛnsdʁə；døren ˈdɶɐ̯ˀən。
    segs:
    - id: dialog-8
      who: Marco
      da: Toilettet ligger lige til venstre efter døren. Er der også et studierum her?
  - zh: 有的。这儿有一间教室，里面有一台电脑、一张桌子和很多椅子。
    note: det er der de ˈæɐ̯ dɑ（简短回答重音在 er 上）；lokale loˈkʰæːlə；et bord ed ˈboɐ̯ˀ（d 不发音）；stole ˈsdoːlə（复数时单数词里的喉塞音消失）。
    segs:
    - id: dialog-9
      who: Emma
      da: Ja, det er der. Der er et lokale med en computer, et bord og mange stole.
  - zh: 太棒了！走，趁着下节课还没重新开始，我们把咖啡端进教室里吧。
    note: lokalet loˈkʰæːləð（词尾 -et 读 əð）；timen ˈtʰiːmən；igen iˈɡɛn（g 读不送气清音 ɡ）。
    segs:
    - id: dialog-10
      who: Marco
      da: Perfekt! Kom, vi tager kaffen med ind i lokalet, før timen starter igen.
