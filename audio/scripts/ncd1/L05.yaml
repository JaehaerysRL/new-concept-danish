book: ncd1
lesson: 5
title_da: Hvornår går bussen?
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: 周一早上八点零五分，Emma 站在公交站台查看电子站牌，向一旁同样等车的本地通勤者 Henrik 打听 4A 路公交车的发车时间与车程。
  paras:
  - zh: 打扰一下，开往市中心的 4A 路公交车几点开？
    note: hvornår vɒˈnɒːˀ（词首 h 不发音）；går ˈɡɒːˀ（长圆唇音 + 喉塞音）；mod ˈmoːðˀ（软 ð + 喉塞音）。
    segs:
    - id: dialog-1
      who: Emma
      da: Undskyld, hvornår går bus 4A mod centrum?
  - zh: 现在是八点零五分。下一班车八点一刻开。
    note: klokken ˈkʰlʌɡən（口语常略去中间元音读如 kʰlʌɡŋ）；fem minutter over ˈfɛmˀ miˈnudɐ ˈʌʊ̯ˀɐ；kvart ˈkvɑːd（r 融进长元音 ɑː）。
    segs:
    - id: dialog-2
      who: Henrik
      da: Lige nu er klokken fem minutter over otte. Den næste bus går kvart over otte.
  - zh: 太好了！这儿的公交车早上多久发一班？
    note: hvor tit vɒ ˈtʰid（频率疑问“多久一次”）；kører ˈkʰøːɐ（r 弱化融尾）；om morgenen ʌm ˈmɒːnən（g 完全不发音！）。
    segs:
    - id: dialog-3
      who: Emma
      da: Super! Hvor tit kører bussen her om morgenen?
  - zh: 早上每十分钟一班，但周末每小时才一班。
    note: tiende ˈtʰiːənə（d 不发音）；hvert ˈvɛɐ̯ˀd（h 不发音）；weekenden ˈviːɡɛndən；én gang ˈeːˀn ˈɡaŋˀ（én 带重音表示数量“一”）。
    segs:
    - id: dialog-4
      who: Henrik
      da: Om morgenen kører den hvert tiende minut, men i weekenden kører den kun én gang i timen.
  - zh: 好的，知道这个太有用了。坐到中心火车站需要多长时间？
    note: at vide ad ˈviːðə（软 ð）；hvor lang tid vɒ ˈlaŋˀ ˈtʰiːðˀ；banegården ˈbæːnəˌɡɒːˀən（gård 的 d 不发音）。
    segs:
    - id: dialog-5
      who: Emma
      da: Okay, det er godt at vide. Hvor lang tid tager turen ind til banegården?
  - zh: 从这儿出发大约要二十分钟。你是要去语言学校还是去上班？
    note: herfra ˈheɐ̯ˀˌfʁɑ；cirka ˈsiɐ̯ɡa；arbejde ˈɑːbɑɪ̯ˀdə（ar- 读长音 ɑː，-ej- 读 ɑɪ̯）。
    segs:
    - id: dialog-6
      who: Henrik
      da: Herfra tager det cirka tyve minutter. Skal du på sprogskole eller på arbejde?
  - zh: 我今天去上班。不过下周一我的新班就要在学校开课了。
    note: på arbejde pʰɔ ˈɑːbɑɪ̯ˀdə；mandag ˈmanˀda（nd 的 d 和 dag 的 g 均不发音！）。
    segs:
    - id: dialog-7
      who: Emma
      da: Jeg skal på arbejde i dag. Men på mandag starter mit nye hold på skolen.
  - zh: 真让人期待！你每周一几点到学校上课？
    note: spændende ˈsbɛnənə（nd 中的 d 不发音，常简读为 ˈsbɛnə）；om mandagen ʌm ˈmanˀdæːˀən（加 -en 表示“每周一”）。
    segs:
    - id: dialog-8
      who: Henrik
      da: Spændende! Hvornår møder du på skolen om mandagen?
  - zh: 每周一我八点半上课，所以我七点五十五分坐公交车。不过这周五我七点四十五分有个早会！
    note: halv ni ˈhalˀ ˈniːˀ（重要！v 永远不发音，l 带喉塞音）；fredag ˈfʁɛːˀda（g 静音）；tidligt ˈtʰiːðli（g 和 t 均静音）。
    segs:
    - id: dialog-9
      who: Emma
      da: Om mandagen møder jeg klokken halv ni, så jeg tager bussen fem minutter i otte. Men på fredag har jeg et tidligt møde kvart i otte!
  - zh: 看，公交车这不就来了！正好八点十分整。祝你工作顺利！
    note: faktisk ˈfaɡdisg；præcis pʰʁɛˈsiːˀs；arbejdsdag ˈɑːbɑɪ̯dsˌdæːˀ（d 音极弱，整体听起来像 ˈɑːbɑɪ̯sˌdæːˀ）。
    segs:
    - id: dialog-10
      who: Henrik
      da: Se, nu kommer bussen faktisk! Klokken er ti minutter over otte præcis. God arbejdsdag!
