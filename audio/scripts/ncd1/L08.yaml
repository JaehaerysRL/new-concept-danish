book: ncd1
lesson: 8
title_da: Fra morgen til aften
blocks:
- id: del1
  title: Del 1：第一人称连贯独白（95 词 · 作息描述标准母版）
  tab: Del 1
  kind: prose
  paras:
  - segs:
    - id: m1-1
      who: Kursist
      da: '**På en almindelig hverdag** [[vågner jeg]] klokken halv syv. **Først** [[står jeg]] op, vasker mig og klæder mig på. **Derefter** [[spiser jeg]] morgenmad og drikker en kop kaffe. **Klokken
        otte** [[tager jeg]] metroen og møder på arbejde klokken ni.'
    zh: 在普通的工作日，我六点半醒来。首先我起床、洗漱并穿好衣服。然后我吃早饭，喝一杯咖啡。八点整我坐地铁，九点到公司上班。
  - segs:
    - id: m1-2
      who: Kursist
      da: '**Om formiddagen** [[arbejder jeg]] ved computeren og holder møder med mine kolleger. **Ved tolvtiden** [[holder vi]] frokostpause i kantinen. **Klokken fire** [[får jeg]] fri.'
    zh: 上午我在电脑前工作，并和同事们开会。十二点左右我们在食堂休午休吃午饭。四点我下班。
  - segs:
    - id: m1-3
      who: Kursist
      da: '**Bagefter** [[handler jeg]] ind i supermarkedet og laver aftensmad derhjemme. **Så** [[slapper jeg]] af med en god bog eller ser lidt tv. **Til sidst** [[går jeg]] i seng klokken halv elleve.'
    zh: 之后我去超市买菜，回家做晚饭。接着我看看好书放松一下，或者看一会儿电视。最后我在十点半上床睡觉。
- id: del2
  title: Del 2：5 轮模拟口试追问与示范回答（Eksaminator ↔ Kursist）
  tab: Del 2
  kind: dialog
  paras:
  - zh: 【第 1 轮 · 早起习惯】你六点半起得挺早的。冬天的时候醒来对你来说很难吗？
    note: svært ˈsvɛɐ̯ˀd；vinteren ˈvenˀdɐn（-en 融化短收）。
    segs:
    - id: del2-1
      who: Eksaminator
      da: Du står tidligt op klokken halv syv. Er det svært for dig at vågne om vinteren?
  - zh: 是的，冬天常常又黑又冷，所以我总是立刻喝一杯热咖啡提神。
    note: mørkt ˈmɶɐ̯gd；koldt ˈkʰʌlˀd（注意：en varm kop kaffe 中 varm 修饰共性名词 kop，不加 -t）。
    segs:
    - id: del2-2
      who: Kursist
      da: Ja, om vinteren er det tit mørkt og koldt, så jeg drikker altid en varm kop kaffe med det samme.
  - zh: 【第 2 轮 · 午餐内容】你说你们十二点左右午休。你在食堂一般吃什么？
    note: frokostpause ˈfʁoɡʌsdˌpʰɑʊ̯sə；ved tolvtiden ve ˈtʰʌlˀˌtʰiːðˀən。
    segs:
    - id: del2-3
      who: Eksaminator
      da: Du siger, at I holder frokostpause ved tolvtiden. Hvad spiser du i kantinen?
  - zh: 我通常吃配鱼肉或奶酪的黑麦面包，之后和同事们聊一会儿天。
    note: som regel sʌm ˈʁeːˀəl（地道高频短语“通常/一般”，g 静音）；rugbrød ˈʁuˌbʁøðˀ（丹麦黑麦面包，g 不发音，d 软读）。
    segs:
    - id: del2-4
      who: Kursist
      da: Jeg spiser som regel rugbrød med fisk eller ost, og bagefter snakker jeg lidt med mine kolleger.
  - zh: 【第 3 轮 · 下班采购与做饭】你下班后多久逛一次超市买菜？你喜欢做晚饭吗？
    note: handler ind ˈhanlɐ ˈenˀ（d 不发音）；aftensmad ˈafdənˌsmað。
    segs:
    - id: del2-5
      who: Eksaminator
      da: Hvor tit handler du ind efter arbejde, og kan du godt lide at lave aftensmad?
  - zh: 我每周采购两三次。是的，我非常喜欢在家做饭。
    note: mad ˈmað（软 ð）；rigtig godt lide ˈʁɛgdi ˈɡʌd ˈliːˀ（lide 尾音 de 常弱化脱落，读似 liːˀ）。
    segs:
    - id: del2-6
      who: Kursist
      da: Jeg handler ind to eller tre gange om ugen. Ja, jeg kan rigtig godt lide at lave mad derhjemme.
  - zh: 【第 4 轮 · 晚间放松】你晚上一般看些什么书，或者在电视上看什么节目？
    note: bøger ˈbøːˀɐ（注意 g 不发音）；om aftenen ʌm ˈafdənən。
    segs:
    - id: del2-7
      who: Eksaminator
      da: Hvilke bøger læser du om aftenen, eller hvad ser du på tv?
  - zh: 我经常读一本简单的丹麦语书来练语言，或者看带丹麦语字幕的新闻节目。
    note: nyhederne ˈnyːˌheðˀɐnə；undertekster ˈʌnɐˌtʰɛgsdɐ（under 中 d 不发音）。
    segs:
    - id: del2-8
      who: Kursist
      da: Jeg læser ofte en let dansk bog for at øve sproget, eller også ser jeg nyhederne med danske undertekster.
  - zh: 【第 5 轮 · 周末对比】你的周末是什么样的？周六周日你会睡得晚一些吗？
    note: hvordan ser... ud vɒˈdan seɐ̯... ˈuːðˀ（问“……是什么样的？”）；lørdagen ˈlɶɐ̯ˌdæːˀən；søndagen ˈsønˌdæːˀən。
    segs:
    - id: del2-9
      who: Eksaminator
      da: Hvordan ser din weekend ud? Sover du længere om lørdagen og søndagen?
  - zh: 是的，周末我九点才起床！然后我去散很长一段步，或者和朋友们聚聚。
    note: står jeg først op（这里 først 放在动词+主语后，表示“直到九点才……”）；mødes ˈmøːðəs（“碰面/聚会”）。
    segs:
    - id: del2-10
      who: Kursist
      da: Ja, i weekenden står jeg først op klokken ni! Derefter går jeg en lang tur eller mødes med mine venner.
