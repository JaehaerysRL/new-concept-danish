book: ncd1
lesson: 9
title_da: En ny lejlighed til leje
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: 艾玛（Emma）在哥本哈根看上一套新挂牌出租的公寓，房东亨里克（Henrik）带她实地看房。艾玛仔细询问了面积、房间配置、楼层、月租以及周边超市与交通情况。
  paras:
  - zh: 嗨，亨里克！谢谢你今天让我们来看这套新公寓。
    note: fordi fɒˈdiːˀ（末尾 d 不发音）；den nye dɛn ˈnyːə（定指形容词加 -e，发清晰的央元音 ə）；lejlighed ˈlɑɪ̯liˌheðˀ（中间 -ig- 中的 g 不发音，词尾软 d 带轻微喉塞音）。
    segs:
    - id: dialog-1
      who: Emma
      da: Hej Henrik! Tak fordi vi må se den nye lejlighed i dag.
  - zh: 欢迎进来！是的，这是一套明亮又舒适的公寓，在（丹麦的）二楼（即地面三层）。
    note: indenfor ˈenənˌfɒː（-nd- 中的 d 不发音）；lys ˈlyːˀs（长圆唇音 y + 喉塞音）；dejlig ˈdɑɪ̯li（词尾 -ig 中 g 不发音）；på anden sal pʰɔ ˈanən ˈsæːˀl（注意丹麦语“二楼 anden sal”等于中国的三楼！）。
    segs:
    - id: dialog-2
      who: Henrik
      da: Velkommen indenfor! Ja, det er en lys og dejlig lejlighed på anden sal.
  - zh: 这套公寓有多大，有几个房间呢？
    note: stor ˈsdoɐ̯ˀ（o 偏向 o，r 弱化成 ɐ̯）；lejligheden ˈlɑɪ̯liˌheðˀən；værelser ˈvɛːɐlsɐ（词首 v，中间 -el- 轻弱，词尾 -er 读 ɐ）。
    segs:
    - id: dialog-3
      who: Emma
      da: Hvor stor er lejligheden, og hvor mange værelser har den?
  - zh: 面积是 65 平方米。里面有一间大客厅、一间小卧室、一个新厨房和一间老浴室。
    note: 65 ˈfɛmˀɔˌtʰʁɛs（65 读作 femogtres）；kvadratmeter kʰvaˈdʁɑːˀdˌmeːˀdɐ；nyt ˈnyd（短元音，没有喉塞音）；køkken ˈkʰøɡən；gammelt ˈɡaməld（末尾 l 清晰，t 轻读接近 d）。
    segs:
    - id: dialog-4
      who: Henrik
      da: Den er 65 kvadratmeter. Der er en stor stue, et lille soveværelse, et nyt køkken og et gammelt badeværelse.
  - zh: 客厅真亮堂啊！大窗户真是太棒了。这套公寓带阳台吗？
    note: stuen ˈsduːən；store ˈsdoːɐ（加了 -e 后长音不变，r 读 ɐ）；vinduer ˈvenduɐ（-nd- 中 d 不发音）；altan alˈtʰæːˀn（重音在第二音节）。
    segs:
    - id: dialog-5
      who: Emma
      da: Hvor er stuen lys! Store vinduer er virkelig dejlige. Har lejligheden også en altan?
  - zh: 带的，它有一个朝向安静庭院的小阳台。这条街上的老房子都非常安静。
    note: rolig ˈʁoːli（词尾 g 不发音）；gård ˈɡɒːˀ（-rd 中的 d 不发音）；gamle ˈɡamlə（注意 gammel 变复数/定指时少了一个 m 和 e）；stille ˈsdilə（形容词不变形）。
    segs:
    - id: dialog-6
      who: Henrik
      da: Ja, den har en lille altan ud mod en rolig gård. De gamle huse her i gaden er meget stille.
  - zh: 听起来真不错。每月房租多少钱？算便宜吗？
    note: lyder ˈlyːðˀɐ（软 d）；huslejen ˈhuːsˌlɑɪ̯ən；om måneden ʌm ˈmɔːnəðən（词尾软 d 极轻）；billig ˈbili（末尾 g 不发音）。
    segs:
    - id: dialog-7
      who: Emma
      da: Det lyder godt. Hvor meget koster huslejen om måneden? Er den billig?
  - zh: 在哥本哈根算挺便宜的：每月 7500 克朗，另外加暖气费和水费。
    note: 7.500 ˈsyʊ̯ˀ ˈtʰuːˀsən ˈfɛmˀ ˈhunəðə（syv tusind fem hundrede）；varme ˈvɑːmə；vand ˈvanˀ（-nd 中的 d 不发音，带喉塞音）。
    segs:
    - id: dialog-8
      who: Henrik
      da: 'Den er ret billig for København: 7.500 kroner om måneden plus varme og vand.'
  - zh: 周边环境怎么样？附近有超市和公共交通吗？
    note: området ˈʌmˌʁɔːðəð（软 d）；offentlig ˈʌfənli（t 和末尾 g 都不发音！）；tæt på ˈtʰɛd ˈpʰɔːˀ。
    segs:
    - id: dialog-9
      who: Emma
      da: Hvordan er området? Er der et supermarked og offentlig transport tæt på?
  - zh: 有的，拐角处就有两家平价超市，还有一座绿地公园，地铁站离这儿只有五分钟路程。
    note: billige ˈbiliə；hjørnet ˈjɶɐ̯nəð（词首 hj- 中 h 不发音，词尾 -et 读 əð）；minutter miˈnudɐ（重音在第二音节）。
    segs:
    - id: dialog-10
      who: Henrik
      da: Ja, der ligger to billige supermarkeder lige om hjørnet, en grøn park og metroen kun fem minutter herfra.
