book: ncd1
lesson: 10
title_da: Hvor står vaskemaskinen?
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: 艾玛和约纳斯（Jonas）刚把行李搬进新公寓。两人一边拆纸箱，一边商量洗衣机、镜子、毛巾、桌椅和地毯分别应该放在哪里。
  paras:
  - zh: 呼，我们该把这台新洗衣机放到哪儿呢？
    note: stille ˈsdilə（动态动词，双写 l 读作单一清晰 l）；vaskemaskine ˈvasgəmaˌsgiːnə（词尾 -e 轻弱）。
    segs:
    - id: dialog-1
      who: Emma
      da: Puha, hvor skal vi stille den nye vaskemaskine?
  - zh: 它应该放在浴室里洗手池旁边。你看，镜子已经挂在洗手池上方了。
    note: stå ˈsdɔːˀ；ude ˈuːðə（静态长形式，软 d）；spejlet ˈsbɑɪ̯ˀləð；hænger ˈhɛŋˀɐ（ng 读后鼻音 ŋ 带喉塞音）。
    segs:
    - id: dialog-2
      who: Jonas
      da: Den skal stå ude på badeværelset ved siden af vasken. Se, spejlet hænger allerede over vasken.
  - zh: 太好了！那我把盘子放到哪儿？咖啡机又放在哪儿呢？
    note: tallerkenerne tʰaˈlɛɐ̯ɡnənə（常吞减中间音节，重点重音在第二音节 -ler-）；kaffemaskinen ˈkʰafəmaˌsgiːnən。
    segs:
    - id: dialog-3
      who: Emma
      da: Godt! Hvor stiller jeg tallerkenerne, og hvor står kaffemaskinen?
  - zh: 咖啡机立在厨房台面上。你可以把盘子放进橱柜里面去。挂钟挂在墙上。
    note: køkkenbordet ˈkʰøɡənˌboɐ̯ˀð（-rd 中的 d 不发音！bord 读 ˈboɐ̯ˀ）；ind ˈenˀ（-nd 中的 d 不发音）；væggen ˈvɛɡˀən。
    segs:
    - id: dialog-4
      who: Jonas
      da: Kaffemaskinen står på køkkenbordet. Du kan stille tallerkenerne ind i skabet. Uret hænger på væggen.
  - zh: 棒极了！那干净的毛巾放在哪儿？沙发又要放哪儿？
    note: ligger ˈleɡɐ（短元音 e，与动态动词 lægger 区分！）；håndklæder ˈhʌnˌklɛːðɐ（hånd 中 -nd 的 d 不发音！）。
    segs:
    - id: dialog-5
      who: Emma
      da: Super! Hvor ligger de rene håndklæder, og hvor skal sofaen stå?
  - zh: 毛巾叠放在卧室里面的架子上。沙发立在客厅里面靠窗的位置。
    note: hylden ˈhylən（-ld 中的 d 不发音）；inde ˈenə（-nd 中的 d 不发音，静态长形）；vinduet ˈvenduəð（-nd- 的 d 不发音）。
    segs:
    - id: dialog-6
      who: Jonas
      da: Håndklæderne ligger på hylden inde i soveværelset. Sofaen står inde i stuen ved vinduet.
  - zh: 你看，钥匙已经插在门锁上了！可是那块新地毯放在哪儿呢？
    note: sidder ˈseðˀɐ（软 d + 喉塞音）；døren ˈdɶɐ̯ˀn；gulvtæppe ˈɡɔlˌtʰɛbə（注意 gulv 末尾的 v 在标准丹麦语中不发音！）。
    segs:
    - id: dialog-7
      who: Emma
      da: Se, nøglen sidder allerede i døren! Men hvor ligger det nye gulvtæppe?
  - zh: 它躺在外面的走廊里。我过一会儿就把它铺进客厅桌子底下，然后再把我们的名牌贴到门上。
    note: lægger ˈlɛɡɐ（注意元音比 ligger ˈleɡɐ 更开！）；sætter ˈsɛdɐ；navneskilt ˈnɑʊ̯nəˌsɡelˀd。
    segs:
    - id: dialog-8
      who: Jonas
      da: Det ligger ude i gangen. Jeg lægger det ind i stuen under bordet lige om lidt, og så sætter jeg vores navneskilt på døren.
  - zh: 谢谢！那那些空纸箱怎么办？它们还留在这上面的公寓里吗？
    note: flyttekasser ˈflydəˌkʰasɐ；heroppe heɐ̯ˈʌbə（复合静态副词，重音在 -oppe）。
    segs:
    - id: dialog-9
      who: Emma
      da: Tak! Hvad med de tomme flyttekasser? Står de stadig heroppe i lejligheden?
  - zh: 是的，我现在就把它们搬到楼下地下室去。之后我再上来，这样我们今晚就可以在家吃饭啦！
    note: ned ˈneðˀ（不是 -nd，这里的软 d 要轻轻发出！）；kælderen ˈkʰɛlɐn（-ld 中的 d 不发音）；hjemme ˈjɛmə（h 不发音）。
    segs:
    - id: dialog-10
      who: Jonas
      da: Ja, jeg går ned i kælderen med dem nu. Bagefter kommer jeg op igen, så vi kan spise hjemme i aften!
