book: ncd1
lesson: 14
title_da: Frokostpause i kantinen
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: 中午十二点半，卢卡斯端着餐盘走进公司食堂（kantinen），在同事玛雅（Maja）对面坐下。两人边吃午饭边聊起食堂菜色、新老板安诺斯（Anders）和部门同事。
  paras:
  - zh: 嗨，玛雅！我可以坐你这儿吗？你觉得今天的午饭怎么样？
    note: hos dig hos ˈdɑɪ̯（介词 hos 后用宾格 dig，词尾 g 滑成 ɪ̯）；synes ˈsynəs；frokosten ˈfʁɔkʰʌsdən。
    segs:
    - id: dialog-1
      who: Lukas
      da: Hej Maja! Må jeg sidde her hos dig? Hvad synes du om frokosten i dag?
  - zh: 当然可以！我特别喜欢这儿食堂的沙拉，不过我对每周四都一样的汤有点吃腻了。
    note: kan... lide kʰan... ˈliːˀ（lide 词尾 d 和 e 几乎不发音，读作“利”带喉塞音！）；salaten saˈlæːˀdən；torsdag ˈtʰɒɐ̯ˀsdæ（g 不发音）。
    segs:
    - id: dialog-2
      who: Maja
      da: Ja, selvfølgelig! Jeg kan rigtig godt lide salaten her i kantinen, men jeg er lidt træt af den samme suppe hver torsdag.
  - zh: 是啊，那汤是有点单调！不过鱼肉很新鲜——我觉得鱼肉挺不错的。
    note: kedelig ˈkʰeːðəli（软 d，词尾 g 不发音）；fisken ˈfesɡən；synes godt om synəs ˈɡʌd ʌmˀ。
    segs:
    - id: dialog-3
      who: Lukas
      da: Ja, den er lidt kedelig! Men fisken er frisk – jeg synes godt om den.
  - zh: 你在新部门其他方面都还顺利吗？你喜欢我们的老板安诺斯吗？
    note: afdeling ˈɑʊ̯ˌdeːˀleŋ（af- 读 ɑʊ̯，重音在首音节）；glad for ˈɡlað ˈfɒː（glad 末尾软 d 极轻，常弱化至消失）。
    segs:
    - id: dialog-4
      who: Maja
      da: Hvordan går det ellers i din nye afdeling? Er du glad for vores chef, Anders?
  - zh: 喜欢，我对他非常满意！每次我向他请教问题，他总是会帮我。
    note: ham ˈham（非重读时常弱读成 am）；mig ˈmɑɪ̯；spørger ˈsbɶɐ̯ˀ（中间 g 彻底静音！）。
    segs:
    - id: dialog-5
      who: Lukas
      da: Ja, jeg er meget glad for ham! Han hjælper mig altid, når jeg spørger ham om noget.
  - zh: 听起来真不错。你认识三楼的同事西格妮吗？你经常跟她聊天吗？
    note: Kender ˈkʰɛnɐ（-nd- 的 d 不发音）；Signe ˈsiːnə（中间 g 静音并拉长前面的 i！）；tredje ˈtʰʁɛðjə；hende ˈhenə（-nd- 的 d 不发音）。
    segs:
    - id: dialog-6
      who: Maja
      da: Det lyder godt. Kender du også vores kollega Signe fra tredje sal? Taler du tit med hende?
  - zh: 认识，她就坐在那边！她人特别好——虽然她语速很快，但我能听懂她的话。
    note: derovre dɛɐ̯ˈʌʊ̯ɐ；forstår fɒˈsdɔːˀ；hurtigt ˈhuɐ̯di（-igt 中的 g 和 t 不发音！）。
    segs:
    - id: dialog-7
      who: Lukas
      da: Ja, hun sidder derovre! Hun er rigtig sød – jeg forstår hende godt, selvom hun taler hurtigt.
  - zh: 是呀，她非常乐于助人。顺便说一句，安诺斯还经常请我们吃周五蛋糕，我们大家都特别开心！
    note: os ˈʌs（注意读短促的 ʌs，不是英语的 us）；for resten fʌ ˈʁɛsdən；alle sammen ˈalə ˈsamˀən。
    segs:
    - id: dialog-8
      who: Maja
      da: Ja, hun er meget hjælpsom. Anders giver os for resten tit fredagskage, og vi er alle sammen glade for det!
  - zh: 太棒了！IT 部门的新同事们今天也和你们一起吃午饭吗？
    note: Fedt! ˈfed（口语高频感叹词“酷/太棒了”）；kolleger kʰoˈleːɐ（中间 g 不发音！）；jer ˈjɛɐ̯。
    segs:
    - id: dialog-9
      who: Lukas
      da: Fedt! Spiser de nye kolleger fra IT også sammen med jer i dag?
  - zh: 不了，他们在开会，所以我们明天才能见到他们。这周五下班后，你要跟我们一起出去聚一下吗？
    note: møde ˈmøːðə（软 d）；dem ˈdɛm；efter arbejde ɛfdɐ ˈɑːbɑɪ̯ˀdə（软 d）。
    segs:
    - id: dialog-10
      who: Maja
      da: Nej, de sidder i et møde, så vi ser dem først i morgen. Vil du med os ud efter arbejde på fredag?
