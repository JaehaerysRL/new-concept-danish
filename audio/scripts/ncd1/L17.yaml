book: ncd1
lesson: 17
title_da: Et medlemskab i fitnesscentret
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: Emma 来到家附近的健身中心前台，向前台工作人员 Mikkel 咨询月卡价格、学生折扣、免费试课以及运动装备要求。
  paras:
  - zh: 你好！我想了解一下，会员卡每月多少钱。
    note: medlemskab ˈmɛðlɛmsˌgæːˀb（第一个 d 为软 d ð，重音在首音节）；vil gerne vide ve ˈɡæɐ̯nə ˈviːðə（vil 弱读，d 为软 d）。
    segs:
    - id: dialog-1
      who: Emma
      da: Hej! Jeg vil gerne vide, hvad et medlemskab koster om måneden.
  - zh: 你好！普通会员每月 299 克朗。你是学生吗？如果是的话你可以享受折扣。
    note: normalt nɒˈmæːˀld；studerende sduˈdeɐ̯ˀnə（重音在第二音节）；få rabat fɔ ʁaˈbad（rabat 重音在第二音节）。
    segs:
    - id: dialog-2
      who: Mikkel
      da: Hej! Et normalt medlemskab koster 299 kroner om måneden. Er du studerende? Så kan du få rabat.
  - zh: 是的，我是学生。我在大学读书。学生折扣价是多少？我能先免费试一次吗？
    note: studierabat ˈsduːdiəʁaˌbad；prøve ˈpʰʁœːvə（注意圆唇音 œː）；gratis ˈɡʁɑːtis（重音在第一音节，非英语读音）。
    segs:
    - id: dialog-3
      who: Emma
      da: Ja, det er jeg. Jeg læser på universitetet. Hvor meget koster det med studierabat, og kan jeg prøve en gang gratis først?
  - zh: 学生折扣价每月只要 199 克朗。而且可以，明天晚上免费试一节团课完全不花钱。
    note: helt ˈheːˀld；at prøve ʌ ˈpʰʁœːvə（不定式标志 at 在口语中弱读为 ʌ，千万不要读成 ad）；holdtime ˈhʌlˌtˢiːmə（hold 末尾 d 不发音）。
    segs:
    - id: dialog-4
      who: Mikkel
      da: Med studierabat koster det kun 199 kroner om måneden. Og ja, det er helt gratis at prøve en holdtime i morgen aften.
  - zh: 听起来真棒！我喜欢锻炼，但我不太擅长游泳或举重。有初学者班吗？
    note: glad for at træne ˈɡlað fʌ ʌ ˈtʰʁɛːnə（for at 连读近乎 fʌ ʌ）；svømme ˈsvømə；tunge ˈtʰoŋə（u 偏 o 音）；begyndere beˈɡønˀɐ。
    segs:
    - id: dialog-5
      who: Emma
      da: Det lyder godt! Jeg er glad for at træne, men jeg er ikke så god til at svømme eller løfte tunge vægte. Er der hold for begyndere?
  - zh: 当然有！你可以选瑜伽或动感单车，我们的教练非常喜欢帮助新会员。
    note: vælge ˈvɛlɡə；cykling ˈsyɡleŋ（c 读 s，y 读长圆唇）；medlemmer ˈmɛðˌlɛmˀɐ（软 d ð）。
    segs:
    - id: dialog-6
      who: Mikkel
      da: Ja, selvfølgelig! Du kan vælge yoga eller cykling, og vores trænere elsker at hjælpe nye medlemmer.
  - zh: 太好了！你们什么时候开门，要穿什么呢？需要带室内运动鞋吗？
    note: åbent ˈɔːbənd；have på ha ˈpʰɔːˀ（have 在口语中常吞掉 v，只读 ha）；indendørssko ˈenəndɶɐ̯sˌsɡoːˀ（nd 中的 d 不发音）。
    segs:
    - id: dialog-7
      who: Emma
      da: Super! Hvornår har I åbent, og hvad skal man have på? Skal man have indendørssko med?
  - zh: 我们每天早上六点到晚上十点开门。你只要穿干净的运动服和室内鞋就行，另外记得带一瓶水和一条毛巾。
    note: sportstøj ˈsbɒːdsˌtʰɔɪ̯；vandflaske ˈvanˌflasɡə（vand 中 d 不发音）；håndklæde ˈhʌnˌkʰlɛːðə（nd 中 d 不发音，后面的 d 为软 d ð）。
    segs:
    - id: dialog-8
      who: Mikkel
      da: Vi har åbent fra klokken seks til toogtyve hver dag. Du skal bare have rent sportstøj og indendørssko på, og husk at tage en vandflaske og et håndklæde med.
  - zh: 谢谢这些信息！如果试课后想继续，要怎么报名呢？
    note: oplysningerne ˈʌbˌlyːˀsneŋɐnə；tilmelder sig ˈtˢelˌmɛlˀɐ sɑɪ̯（ld 中 d 不发音，sig 读 sɑɪ̯）；fortsætte ˈfɒːdˌsɛdə。
    segs:
    - id: dialog-9
      who: Emma
      da: Tak for oplysningerne! Hvordan tilmelder man sig, hvis man vil fortsætte efter prøvetimen?
  - zh: 你可以很方便地在我们的网站上或就在前台这里报名。只记得出示你的学生证就行！
    note: hjemmeside ˈjɛməˌsiːðə（h 不发音，side 软 d）；receptionen ʁesɛbˈɕoːˀnən（ti 读 ɕ）；studiekort ˈsduːdiəˌkʰɒːd。
    segs:
    - id: dialog-10
      who: Mikkel
      da: Du kan nemt tilmelde dig på vores hjemmeside eller her i receptionen. Husk bare at vise dit studiekort!
