book: ncd1
lesson: 19
title_da: En tur i supermarkedet
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: Lukas 从超市购物回家，Maja 一边帮他把东西从袋子里拿出来，一边核对采购清单，结果发现了几件好笑的小插曲。请重点留意对话中出现的不规则动词过去时。
  paras:
  - zh: 嗨，卢卡斯！你刚从超市回来吗？买得怎么样？
    note: kom ˈkʰʌmˀ（与现在时 kommer 不同，短元音 + 喉塞音）；gik ˈɡiɡ（at gå 的过去时）。
    segs:
    - id: dialog-1
      who: Maja
      da: Hej Lukas! Kom du lige hjem fra supermarkedet? Hvordan gik det?
  - zh: 是呀！因为下雨，我坐公交过去的。Netto 超市里人特别多。
    note: tog ˈtʰoːˀ（末尾 g 完全不发音！读作长 oː 带喉塞音）；var ˈvɑː（非重读常弱化为 vɑ）。
    segs:
    - id: dialog-2
      who: Lukas
      da: Ja! Jeg tog bussen derhen, fordi det regnede. Der var rigtig mange mennesker i Netto.
  - zh: 清单上的都买齐了吗？我可写了“两升牛奶、一条黑麦面包和六个鸡蛋”哦。
    note: fandt ˈfanˀd（末尾 t 极轻或近乎不发，核心是喉塞音）；skrev ˈsgʁeʊ̯ˀ（-ev 滑音读 eʊ̯ˀ）；rugbrød ˈʁuˌbʁœðˀ（g 不发音，末尾软 d）。
    segs:
    - id: dialog-3
      who: Maja
      da: Fandt du alt på listen? Jeg skrev jo "to liter mælk, et rugbrød og seks æg".
  - zh: 差不多！我看到咖啡在打特价，就也拿了一袋咖啡。鸡蛋放在很高的架子上，不过我找了个店员帮我拿。
    note: så ˈsɔːˀ；tilbud ˈtˢelˌbuð（软 d）；stod ˈsdoːðˀ（常弱化末尾 d 读 ˈsdoːˀ）；fik ˈfeɡ（at få 的过去时）。
    segs:
    - id: dialog-4
      who: Lukas
      da: Næsten! Jeg så et godt tilbud på kaffe, så jeg tog også en pose kaffe. Æggene stod helt oppe på en høj hylde, men jeg fik en medarbejder til at hjælpe mig.
  - zh: 干得不错！你在收银台一共花了多少钱？
    note: gav ˈɡæːˀ（末尾 v 在口语中通常脱落！读长音 æːˀ）；ved kassen ve ˈkʰasən（ved 末尾 d 不发音）。
    segs:
    - id: dialog-5
      who: Maja
      da: Godt klaret! Hvor meget gav du for det hele ved kassen?
  - zh: 大概花了两百克朗。收银员说我得花三克朗买个塑料袋，因为我没带自己的袋子。
    note: sagde ˈsæːə（g 和 d 全不发音，重读几乎读作“塞-厄”）；måtte ˈmʌdə；havde ˈhɛːðə（v 不发音，d 读软 d）。
    segs:
    - id: dialog-6
      who: Lukas
      da: Jeg gav cirka tohundrede kroner. Ekspedienten sagde, at jeg måtte betale tre kroner for en pose, fordi jeg ikke havde min egen taske med.
  - zh: 哈哈，我早知道了，因为你的布袋子一直还躺在客厅的椅子上呢！
    note: vidste ˈvesdə（d 完全不发音，只读 vesdə）；lå ˈlɔːˀ（at ligge 的过去时）。
    segs:
    - id: dialog-7
      who: Maja
      da: Haha, det vidste jeg godt, for din stoftaske lå stadig på stolen her i stuen!
  - zh: 哎呀！而且你知道吗？后来我坐在外面的长椅上喝了罐汽水。突然看表发现已经五点了，我就一路跑回家了！
    note: sad ˈsaðˀ（短 a + 软 d + 喉塞音）；drak ˈdʁaɡ；pludselig ˈpʰlusli（d 与 -ig 均不发音）；løb ˈløːˀb（长 ø + 喉塞音）。
    segs:
    - id: dialog-8
      who: Lukas
      da: Åh nej! Og ved du hvad? Bagefter sad jeg på en bænk udenfor og drak en sodavand. Pludselig så jeg på uret, at klokken var fem, så jeg løb hele vejen hjem!
  - zh: 可是黄油在哪儿呢？你今天早上不是说我们要买明天的黄油吗？
    note: smørret ˈsmɶɐ̯ˀð；skulle ˈsgu(lə)（快语流常直接吞掉 -lle 读成 sgu）。
    segs:
    - id: dialog-9
      who: Maja
      da: Men hvor er smørret? Sagde du ikke i morges, at vi skulle købe smør til i morgen?
  - zh: 哎呀糟了！我给忘了！我还真尽力了，可我就是想快点回家，因为咱们的小狗自己在家睡觉呢。
    note: gjorde ˈɡjoːɐ（d 不发音，读作“哟-厄”）；ville ˈvi(lə)（常弱读成 vi）；sov ˈsɔʊ̯ˀ（at sove 过去时）。
    segs:
    - id: dialog-10
      who: Lukas
      da: Åh for søren! Det glemte jeg! Jeg gjorde ellers mit bedste, men jeg ville bare hurtigt hjem, fordi vores lille hund sov alene herhjemme.
