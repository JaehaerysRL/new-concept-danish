book: ncd1
lesson: 20
title_da: Min fritidsaktivitet
blocks:
- id: del1
  title: Del 1：Monolog
  tab: Del 1
  kind: prose
  paras:
  - cue: Tekst：Min fritidsaktivitet（第一人称连贯独白 · 94 词）
    segs:
    - id: m1-1
      who: Kursist
      da: Jeg elsker at [[dyrke motion]] i min fritid, så jeg [[går til]] badminton i en lokal klub i Aarhus.
    - id: m1-2
      who: Kursist
      da: Klubben ligger på Vesterbro Torv, ikke langt fra centrum.
    - id: m1-3
      who: Kursist
      da: Jeg træner to gange om ugen, tirsdag og torsdag fra klokken nitten til enogtyve.
    - id: m1-4
      who: Kursist
      da: Det koster tohundrede kroner om måneden, for jeg får studierabat.
    - id: m1-5
      who: Kursist
      da: Jeg spiller ikke alene, men [[spiller badminton]] sammen med ti andre unge fra universitetet.
    - id: m1-6
      who: Kursist
      da: I pausen snakker vi dansk og drikker vand.
    - id: m1-7
      who: Kursist
      da: Jeg cykler altid til klubben, og det tager kun ti minutter. [[Det er både sjovt og sundt at]] spille badminton!
    zh_all: 我非常喜欢在业余时间做运动，所以我在奥胡斯的一家本地俱乐部参加羽毛球运动。这家俱乐部位于 Vesterbro Torv，离市中心不远。我每周训练两次，周二和周四晚上七点到九点。因为我有学生折扣，每月只要两百克朗。我不是一个人打，而是和另外十位来自大学的年轻人一起打羽毛球。休息时我们会用丹麦语聊天、喝水。我总是骑自行车去俱乐部，只要十分钟就到了。打羽毛球既有趣又健康！
- id: del2
  title: Del 2：5 轮模拟口试追问与示范回答（DU3 Opgave 1 现场演练）
  tab: Del 2
  kind: dialog
  paras:
  - cue: 第 1 轮｜节点：sted / by
    segs:
    - id: del2-1q
      who: Eksaminator
      da: Hvad går du til i din fritid, og hvor ligger det?
  - zh: 你业余时间参加什么活动，它在哪里？—— 我在奥胡斯 Vesterbro Torv 的一家本地俱乐部打羽毛球，离市中心很近。
    segs:
    - id: del2-1a
      who: Kursist
      da: Jeg går til badminton i en lokal klub på Vesterbro Torv i Aarhus. Det ligger tæt på centrum.
  - cue: 第 2 轮｜节点：dage / tid
    segs:
    - id: del2-2q
      who: Eksaminator
      da: Hvilke dage træner du, og hvor lang tid varer det?
  - zh: 你周几训练，每次持续多久？—— 我每周练两次，周二和周四 19 点到 21 点，每次持续两小时。
    segs:
    - id: del2-2a
      who: Kursist
      da: Jeg træner to gange om ugen, tirsdag og torsdag fra klokken nitten til enogtyve. Det varer to timer hver gang.
  - cue: 第 3 轮｜节点：pris / gratis
    segs:
    - id: del2-3q
      who: Eksaminator
      da: Er det gratis at spille i klubben, eller hvad koster det?
  - zh: 在俱乐部打球免费吗，还是多少钱？—— 不免费。我每月付 200 克朗，因为我有学生折扣。
    segs:
    - id: del2-3a
      who: Kursist
      da: Nej, det er ikke gratis. Jeg betaler tohundrede kroner om måneden, fordi jeg får studierabat.
  - cue: 第 4 轮｜节点：alene / sammen med & aktiviteter
    segs:
    - id: del2-4q
      who: Eksaminator
      da: Træner du alene, og hvad laver I i pausen?
  - zh: 你一个人练吗，休息时你们做什么？—— 不是，我和大学里另外十位年轻人一起打。休息时我们喝水并用丹麦语聊天。
    segs:
    - id: del2-4a
      who: Kursist
      da: Nej, jeg spiller sammen med ti andre unge fra universitetet. I pausen drikker vi vand og snakker dansk.
  - cue: 第 5 轮｜节点：transport til aktiviteten
    segs:
    - id: del2-5q
      who: Eksaminator
      da: Hvordan kommer du til klubben, og hvorfor kan du godt lide badminton?
  - zh: 你怎么去俱乐部，为什么喜欢羽毛球？—— 我总是骑车过去，只要十分钟。我很喜欢，因为打羽毛球既有趣又健康！
    segs:
    - id: del2-5a
      who: Kursist
      da: Jeg cykler altid derhen, og det tager kun ti minutter. Jeg er glad for det, for det er både sjovt og sundt at spille badminton!
