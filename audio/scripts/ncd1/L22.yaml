book: ncd1
lesson: 22
title_da: En invitation til fødselsdag
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: 下课后，Freja 邀请同学兼朋友 Mikkel 下周六上午来家里参加她的 30 岁丹麦式生日早午餐（fødselsdagsbrunch）。
  paras:
  - zh: 嗨，米克尔！你下周末有空吗？我周六满三十岁，打算办一个小小的生日早午餐聚会！
    note: fylder ˈfylɐ（ld 中 d 不发音）；på lørdag pʰɔ ˈlɶɐ̯dæ（即将到来的周六用 på）；fødselsdag ˈføsəlsˌdæːˀ（第一个 d 与末尾 g 均不发音）。
    segs:
    - id: dialog-1
      who: Freja
      da: Hej, Mikkel! Har du tid næste weekend? Jeg fylder tredive år på lørdag og holder en lille fødselsdagsbrunch!
  - zh: 哇，真令人兴奋！提前祝你生日快乐！听起来太惬意了。几点开始呢？
    note: tillykke tˢeˈlyɡə（祝贺，重音在第二音节）；på forhånd pʰɔ ˈfɒːˌhʌnˀ（提前；nd 中 d 不发音）。
    segs:
    - id: dialog-2
      who: Mikkel
      da: Ej, hvor spændende! Tillykke på forhånd! Det lyder rigtig hyggeligt. Hvad tid begynder det?
  - zh: 我们十点在我家开始。我早上要烤小面包，我妹妹也会过来帮我准备蛋糕。
    note: hos mig hos ˈmɑɪ̯；bage boller ˈbæːə ˈbʌlɐ（bage 中 g 弱化接近脱落）；kagen ˈkʰæːən（g 不发音！）。
    segs:
    - id: dialog-3
      who: Freja
      da: Vi starter klokken ti hjemme hos mig. Jeg skal bage boller om morgenen, og min søster kommer og hjælper mig med kagen.
  - zh: 真香呀，自制面包和生日蛋糕！还有谁会来参加早午餐呀？
    note: hjemmebagte ˈjɛməˌbɑɡdə（h 不发音）；ellers ˈɛlˀɐs（还有谁/另外）。
    segs:
    - id: dialog-4
      who: Mikkel
      da: Mums, hjemmebagte boller og fødselsdagskage! Hvem kommer ellers til brunchen?
  - zh: 大概十位学校和工作上的好朋友。吃完后我们要玩桌游，或者如果天气好就去公园散步。
    note: omkring ʌmˈkʰʁɛŋˀ；brætspil ˈbʁadˌsbel（桌游）；vejret ˈvæɐ̯ˀð（j 不发音，结尾软 d）。
    segs:
    - id: dialog-5
      who: Freja
      da: Omkring ti gode venner fra studiet og arbejdet. Efter maden skal vi spille brætspil eller gå en tur i parken, hvis vejret er godt.
  - zh: 我非常乐意去！我也可以带我女朋友萨拉一起来吗？
    note: vil meget gerne ve ˈmɑːð ˈɡæɐ̯nə（vil 弱读，meget 读作 ˈmɑːð）；kæreste ˈkʰɛːɐsdə（男女朋友/伴侣，男女同词）。
    segs:
    - id: dialog-6
      who: Mikkel
      da: Jeg vil meget gerne komme! Må jeg tage min kæreste, Sara, med også?
  - zh: 当然可以呀！非常欢迎她。她周六也休息吗？
    note: selvfølgelig sɛlˈfølˀəli（v 与词尾 g 均不发音）；velkommen ˈvɛlˌkʰʌmˀən。
    segs:
    - id: dialog-7
      who: Freja
      da: Ja, selvfølgelig! Hun er meget velkommen. Har hun også fri på lørdag?
  - zh: 等一下，我查一下我的日程表……哎呀，真可惜她还是来不了。她周六九点到下午三点得上班。
    note: kalender kʰaˈlɛnˀɐ（nd 中 d 不发音）；desværre desˈvɛɐ̯ɐ（遗憾地）；alligevel aˈliːəˌvɛlˀ（还是/尽管如此）。
    segs:
    - id: dialog-8
      who: Mikkel
      da: Vent lige, jeg tjekker min kalender... Åh, desværre kan hun ikke komme alligevel. Hun skal arbejde fra klokken ni til femten på lørdag.
  - zh: 那太遗憾了！替我向她问好。不过你还是会来的，对吧？你愿意带一瓶果汁过来吗？
    note: ærgerligt ˈɛɐ̯ˀəli（g 与词尾 gt 均不发音！）；hils hende ˈhilˀs henə；juice ˈdʑuːs（英语借词）。
    segs:
    - id: dialog-9
      who: Freja
      da: Det var ærgerligt! Hils hende mange gange fra mig. Men du kommer stadig, ikke? Vil du tage en flaske juice med?
  - zh: 嗯，我当然愿意！我特别期待周六的聚会。我们十点见！
    note: glæder mig til ˈɡlɛːðɐ mɑɪ̯ tˢe（软 d）；Vi ses! vi ˈseːˀs（回头见！）。
    segs:
    - id: dialog-10
      who: Mikkel
      da: Jo, det vil jeg gerne! Jeg glæder mig rigtig meget til på lørdag. Vi ses klokken ti!
