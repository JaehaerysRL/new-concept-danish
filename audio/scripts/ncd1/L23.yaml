book: ncd1
lesson: 23
title_da: Undskyld, kan du gentage det?
blocks:
- id: dialog
  title: Dialog
  tab: 课文
  kind: dialog
  scene: 距丹麦语模块考试还有一周，Jonas 和 Emma 约在咖啡馆一起练习口语对话。过程中 Emma 遇到生词立刻用丹麦语“救场”，两人还发现了不少共同习惯。
  paras:
  - zh: 嗨，艾玛！下周要考丹麦语了，我其实有点紧张。
    note: faktisk ˈfaɡdisg（其实，事实上）；nervøs nɛɐ̯ˈvøːˀs（重音在第二音节）；prøven ˈpʰʁœːvən。
    segs:
    - id: dialog-1
      who: Jonas
      da: Hej Emma! Jeg er faktisk lidt nervøs før danskprøven næste uge.
  - zh: 我也是！不过我们已经练了很多次了。你周日通常做什么来放松呀？
    note: Det er jeg også de ˈæɐ̯ jɑɪ̯ ˈʌsə（også 中 g 不发音）；øvet os ˈøːvəð ʌs；plejer ˈpʰlɑɪ̯ɐ（习惯于/通常）。
    segs:
    - id: dialog-2
      who: Emma
      da: Det er jeg også! Men vi har øvet os meget. Hvad plejer du at lave om søndagen for at slappe af?
  - zh: 我在市中心一家小小的语言咖啡馆做志愿者。下午我不喝咖啡，就是多和人聊聊天。
    note: frivillig ˈfʁiˌvili（词尾 -ig 中 g 不发音！）；sprogcafé ˈsbʁɔʊ̯kʰaˌfeːˀ；midtbyen ˈmedˌbyːˀən（dt 只发轻 d/t）。
    segs:
    - id: dialog-3
      who: Jonas
      da: Jeg arbejder som frivillig i en lille sprogcafé i midtbyen. Jeg drikker ikke kaffe om eftermiddagen, men snakker meget med folk.
  - zh: 抱歉，你能重复一遍吗？你能说得稍微慢一点吗？“som”后面的那个词我没听清。
    note: gentage ˈɡɛnˌtˢæːˀ（重复）；langsommere ˈlɑŋˌsʌmˀɐɐ（更慢一些，双 m 短音）；fangede ˈfaŋəðə（抓住/听清）。
    segs:
    - id: dialog-4
      who: Emma
      da: Undskyld, kan du gentage det? Kan du tale lidt langsommere? Jeg fangede ikke det ord efter "som".
  - zh: 没问题！我说的是我在一家语言咖啡馆做“frivillig”。
    note: Ja da! ja ˈda（语气助词，表示“当然啦/没问题”）。
    segs:
    - id: dialog-5
      who: Jonas
      da: Ja da! Jeg sagde, at jeg arbejder som frivillig i en sprogcafé.
  - zh: “frivillig”是什么意思呀，怎么拼写呢？
    note: betyder beˈtˢyːˀðɐ（be- 轻读，软 d + stød）；staver man det ˈsdæːvɐ man de（拼写）。
    segs:
    - id: dialog-6
      who: Emma
      da: Hvad betyder "frivillig", og hvordan staver man det?
  - zh: 拼写是 F-R-I-V-I-L-L-I-G。意思是无偿（不拿工资）帮助别人。
    note: uden løn ˈuːðən ˈlønˀ（没有报酬；软 d）；注意丹麦字母读音：F ɛf, R ɛɐ̯, I iːˀ, V veːˀ, L ɛl, G ɡeːˀ。
    segs:
    - id: dialog-7
      who: Jonas
      da: Man staver det F-R-I-V-I-L-L-I-G. Det betyder, at man hjælper andre uden løn.
  - zh: 啊哈，现在我懂了！这和“免费帮忙”是一个意思吗？顺便说，我每天早上都喝咖啡，不过周日我不工作。
    note: det samme som de ˈsamə sʌm（和……一样）；forresten fɒˈʁɛsdən（顺便说一句）。
    segs:
    - id: dialog-8
      who: Emma
      da: Aha, nu forstår jeg! Er det det samme som "gratis hjælp"? Forresten drikker jeg kaffe hver morgen, men jeg arbejder ikke om søndagen.
  - zh: 我也是——我是说早上喝咖啡！不过我周日也不上班，所以这点我也不一样（我也不做）。我周日从来不会感到紧张有压力！
    note: altså ˈalˀsʌ（就是说）；heller ikke ˈhɛlˀɐ ˈeɡə（也……不）；stresset ˈsdʁɛsəð（有压力的）。
    segs:
    - id: dialog-9
      who: Jonas
      da: Det gør jeg også — altså drikker kaffe om morgenen! Men jeg arbejder heller ikke om søndagen, så det gør jeg heller ikke. Jeg er aldrig stresset om søndagen!
  - zh: 我也不紧张！谢谢陪我聊天，约纳斯——现在我觉得对考试更有把握了！
    note: snakken ˈsnaɡən（这次聊天）；føler mig ˈføːˀlɐ mɑɪ̯（感到自己……）；klar til ˈkʰlɑːˀ tˢe。
    segs:
    - id: dialog-10
      who: Emma
      da: Det er jeg heller ikke! Tak for snakken, Jonas — nu føler jeg mig meget mere klar til prøven!
- id: gloser
  title: Gloser（生词表 · 点读）
  tab: 生词表
