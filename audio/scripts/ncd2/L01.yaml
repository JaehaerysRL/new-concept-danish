book: ncd2
lesson: 1
title_da: Et postkort fra Rom — og en e-mail hjem
blocks:
- id: tekstA
  title: Tekst A：Et postkort fra Rom（叙事短文 · 约 155 词）
  tab: Tekst A
  kind: prose
  paras:
  - segs:
    - id: a1
      who: narrator
      da: Lukas og hans kæreste, Maja, [[er rejst]] til Rom på ferie.
    - id: a2
      who: narrator
      da: De [[har]] allerede [[været]] i Italien i fem dage, og de [[har oplevet]] utrolig meget.
    zh: 卢卡斯和他的女友玛雅去罗马度假了。他们在意大利已经待了五天，经历了非常多精彩的事情。
  - segs:
    - id: a3
      who: narrator
      da: Før de tog afsted, sagde Lukas altid, at postkort ødelægger en god ferie, fordi man bruger alt for meget tid på at skrive dem.
    - id: a4
      who: narrator
      da: Alligevel gik han ind i en lille butik den første dag og købte tyve smukke postkort.
    zh: 出发之前，卢卡斯总是说，明信片会毁掉一个好假期，因为人会花太多时间去写它们。尽管如此，第一天他还是走进一家小店，买了二十张漂亮的明信片。
  - segs:
    - id: a5
      who: narrator
      da: Hver formiddag [[har]] de [[besøgt]] berømte museer og gamle kirker.
    - id: a6
      who: narrator
      da: Om eftermiddagen [[har]] Lukas [[siddet]] på en hyggelig café i solen og [[drukket]] espresso.
    - id: a7
      who: narrator
      da: Han [[har lagt]] postkortene frem på bordet og [[har prøvet]] at skrive til sin familie og sine kolleger i Danmark.
    - id: a8
      who: narrator
      da: Men indtil nu [[har]] han ikke [[skrevet]] et eneste ord!
    zh: 每天上午，他们都去参观了著名的博物馆和古老的教堂。每天下午，卢卡斯都坐在阳光下一家惬意的咖啡馆里喝意式浓缩咖啡。他把明信片摆在桌面上，试着给丹麦的家人和同事写点什么。可是直到现在，他一个字也还没写出来！
  - segs:
    - id: a9
      who: narrator
      da: Maja [[har]] derimod allerede [[sendt]] mange billeder til sine venner på telefonen, og i går skrev hun en lang e-mail tilbage til sin ven Daniel.
    - id: a10
      who: narrator
      da: I morgen flyver de hjem til København, og Lukas tager nok de tyve tomme postkort med hjem i kufferten.
    zh: 相反，玛雅已经在手机上给朋友们发了好多照片，而且昨天她还给好朋友丹尼尔回了一封长长的电子邮件。明天他们就要飞回哥本哈根了，卢卡斯大概会把那二十张空白的明信片装在行李箱里带回家。
- id: tekstB
  title: Tekst B：En e-mail fra Daniel — og Majas svar（对标 DU3 Modul 2 Skrivning Opgave 1）
  tab: Tekst B
  kind: prose
  paras:
  - cue: '来信｜Fra: Daniel'
    segs:
    - id: b1
      who: narrator
      da: Hej Maja
    - id: b2
      who: narrator
      da: Jeg har hørt, at du er ude at rejse.
      nl: true
    - id: b3
      who: narrator
      da: Det lyder spændende!
    - id: b4
      who: narrator
      da: Hvor er du henne?
    - id: b5
      who: narrator
      da: Hvem rejser du sammen med?
    - id: b6
      who: narrator
      da: Hvad laver I?
    - id: b7
      who: narrator
      da: Og hvordan er vejret?
    - id: b8
      who: narrator
      da: Mange hilsner
      nl: true
    - id: b9
      who: narrator
      da: Daniel
      nl: true
  - cue: '高分回信范本（96 词）｜Til: Daniel Emne: Hilsen fra Rom'
    segs:
    - id: b10
      who: narrator
      da: Hej Daniel
  - segs:
    - id: b11
      who: narrator
      da: Tak for din søde mail!
    - id: b12
      who: narrator
      da: Ja, det er rigtigt, at jeg er ude at rejse.
    - id: b13
      who: narrator
      da: Jeg er i Rom sammen med min kæreste, Lukas.
    - id: b14
      who: narrator
      da: Vi ankom i mandags, så vi [[har]] allerede [[været]] her i fem dage.
  - segs:
    - id: b15
      who: narrator
      da: Vi [[har set]] mange spændende museer og gamle kirker.
    - id: b16
      who: narrator
      da: I går gik vi en lang tur gennem byen, og om aftenen spiste vi god pizza på en lille restaurant.
    - id: b17
      who: narrator
      da: Vejret [[har været]] fantastisk med masser af sol, selvom det blæste lidt den første dag.
  - segs:
    - id: b18
      who: narrator
      da: Hvordan går det derhjemme i København?
    - id: b19
      who: narrator
      da: Jeg glæder mig til at se dig, når vi kommer hjem på søndag!
  - segs:
    - id: b20
      who: narrator
      da: Kærlig hilsen
    - id: b21
      who: narrator
      da: Maja
      nl: true
    zh_all: '丹尼尔：嗨，玛雅！我听说你出门旅行了。听起来真棒！你在哪儿呢？你和谁一起旅行？你们在做什么？天气怎么样？祝好，丹尼尔。

      玛雅回信：嗨，丹尼尔！谢谢你亲切的邮件！是的，我确实在外面旅行。我和我男朋友卢卡斯在罗马。我们周一到的，所以已经在这儿待了五天了。我们看了很多有意思的博物馆和老教堂。昨天我们在城里散了很长一段步，晚上在一家小餐馆吃了美味的披萨。天气一直棒极了，阳光充足，虽然第一天有点刮风。哥本哈根家里那边怎么样？我真期待周日回家后见到你！亲切的问候，玛雅。'
