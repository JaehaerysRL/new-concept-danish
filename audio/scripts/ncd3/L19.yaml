      nl: true
      label: F.
    zh_all: '聊天对话（搬离大城市吗？）： 乔纳斯 (0)：嗨萨拉！你有没有抽空看我昨天发给你的锡尔克堡那栋小房子？

      萨拉 (0/Z)：看了，我午休时刚看！带着大花园看起来真的好温馨！

      乔纳斯：是吧？但我还是有点担心距离问题。我每天得往奥胡斯通勤差不多一小时呢。

      萨拉 (1)：[空 1] 乔纳斯：你说得对。而且我老板今天早上还真说了，我每周可以居家办公两天。

      萨拉 (2)：[空 2] 乔纳斯：那是当然！不过另一方面，我们也会有点想念市中心的朋友和咖啡馆。

      萨拉 (3)：[空 3] 乔纳斯：好主意！我现在就给房产中介写信，预约周六去看房。'
