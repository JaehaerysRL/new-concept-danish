lesson: 19
title_da: Udkantsdanmark eller storbydrømme?
blocks:
- id: tekstA
  title: Tekst A：Udkantsdanmark eller storbydrømme?（社会深读 · 约 250 词）
  tab: Tekst A
  kind: prose
  paras:
  - segs:
    - id: a1
      who: narrator
      da: Selvom Danmark geografisk er et lille land, er forskellen mellem de store byer og de såkaldte yderområder — ofte kaldet ”Udkantsdanmark” — blevet tydeligere i de seneste år.
    - id: a2
      who: narrator
      da: Mange unge drømmer om København eller Aarhus på grund af studier og et aktivt byliv, mens børnefamilier og pensionister oftere kigger mod mindre byer og landdistrikter, hvor hverdagen føles mere
        overskuelig.
    zh: 尽管丹麦在地理上是个小国，但大城市与所谓外围地区——常被称为“边缘丹麦（Udkantsdanmark）”——之间的差异近年来变得越来越明显。许多年轻人因为求学和丰富活跃的城市生活而向往哥本哈根或奥胡斯，而有孩子的家庭和退休人员则更常把目光投向日常生活显得更从容可控的中小城镇和乡村地区。
  - segs:
    - id: a3
      who: narrator
      da: '[[På den ene side]] er huslejen og boligpriserne i storbyerne steget så kraftigt, at det kan være svært for almindelige lønmodtagere at købe en større bolig. [[På den anden side]] får man langt
        mere plads for pengene i provinsen eller på små øer, **hvorimod** udvalget af små, centrale lejligheder her kan være begrænset.'
    - id: a4
      who: narrator
      da: Mange flytter netop ud for at få en privat have til børnene.
    zh: 一方面，大城市的房租和房价上涨得如此之快，以至于普通工薪阶层很难买到一套较大的住房。另一方面，在地方城镇或小岛上，同样的钱可以换来大得多的居住空间，不过当地市中心小户型的选择相对有限。许多家庭正是为了给孩子们换取一个私人花园才搬出城市。
  - segs:
    - id: a5
      who: narrator
      da: Når det gælder arbejde og uddannelse, ligger de store universiteter og internationale virksomheder stadig tæt i storbyerne, [[mens]] man i landdistrikterne **derimod** ofte må acceptere en længere
        pendlertid og færre offentlige busser.
    - id: a6
      who: narrator
      da: I de senere år har mere fleksibelt hjemmearbejde dog gjort det lettere for nogle pendlere at bo længere væk fra kontoret, uden at de mister deres karrieremuligheder.
    zh: 至于工作和教育，大型高校和跨国企业依然密集分布在大城市，而在乡村地区则往往不得不接受更长的通勤时间和更少的公共交通班次。不过近年来，更灵活的居家办公方式让一些通勤者即使住得离办公室更远，也不会失去职业发展机会。
  - segs:
    - id: a7
      who: narrator
      da: '[[Sammenlignet med]] storbyens travle tempo tilbyder Udkantsdanmark frisk luft, tæt natur og et stærkt lokalsamfund, hvor naboerne kender hinanden. **Til gengæld** savner nogle tilflyttere storbyens
        brede kulturliv, mange restauranter og internationale miljø.'
    - id: a8
      who: narrator
      da: Valget mellem by og land handler derfor sjældent om, hvad der er ”bedst” for alle, men snarere om, hvilken livsfase man befinder sig i.
    zh: 与大城市忙碌的节奏相比，丹麦乡村地区提供了清新的空气、亲近的自然以及邻里彼此相熟的紧密地方社区。不过相应地，也有一些新搬来的人会怀念大城市丰富的文化生活、众多餐馆和国际化氛围。因此，选择城市还是乡村，很少取决于哪种对所有人来说“最好”，而更多取决于一个人正处于哪个人生阶段。
