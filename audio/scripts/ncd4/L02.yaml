book: ncd4
lesson: 2
title_da: Skal vi lige tage en kop kaffe?
blocks:
- id: tekstA
  title: Tekst A：Lige et øjeblik over kaffen（职场口语对话 · 约 205 词）
  tab: Tekst A
  kind: prose
  paras:
  - cue: 办公室咖啡间协商｜Kasper & Emma
    segs:
    - id: a1
      who: Kasper
      da: Hej Emma!
      label: Kasper
    - id: a2
      who: Kasper
      da: Har du [[egentlig]] travlt lige nu, eller skal vi [[lige]] tage en kop kaffe?
    - id: a3
      who: Emma
      da: Hej Kasper!
      nl: true
      label: Emma
    - id: a4
      who: Emma
      da: Jeg har [[bare]] et par mails tilbage, men en kaffepause lyder dejlig.
    - id: a5
      who: Emma
      da: Hvad tænker du på?
    - id: a6
      who: Kasper
      da: Jeg skal fremlægge vores nye spareplan for bestyrelsen i morgen.
      nl: true
      label: Kasper
    - id: a7
      who: Kasper
      da: Kunne du [[lige]] kigge mine fem slides igennem bagefter?
    - id: a8
      who: Kasper
      da: Det tager **vel** kun ti minutter?
    - id: a9
      who: Emma
      da: Jo, selvfølgelig vil jeg det!
      nl: true
      label: Emma
    - id: a10
      who: Emma
      da: Men hvordan går det **ellers** med tallene?
    - id: a11
      who: Emma
      da: Du virkede lidt presset i går.
    - id: a12
      who: Kasper
      da: Ja, det var lidt stramt, men nu ser det fint ud.
      nl: true
      label: Kasper
    - id: a13
      who: Kasper
      da: Du må [[bare]] sige til, hvis du hellere vil gøre det efter frokost. **Ellers** kan jeg også sende udkastet til dig på mail, så du [[bare]] læser det, når det passer dig.
    - id: a14
      who: Emma
      da: Nej, lad os [[bare]] tage det klokken tolv ved mit skrivebord.
      nl: true
      label: Emma
    - id: a15
      who: Emma
      da: Vi skal [[lige]] sikre, at konklusionen står skarpt, ikke?
    - id: a16
      who: Kasper
      da: Jo, præcis!
      nl: true
      label: Kasper
    - id: a17
      who: Kasper
      da: Det er **vel** heller ikke nødvendigt at tage alle bilagene med i selve præsentationen?
    - id: a18
      who: Emma
      da: Nej, det er det bestemt ikke.
      nl: true
      label: Emma
    - id: a19
      who: Emma
      da: Hent du kaffen, så rydder jeg [[lige]] mit bord imens!
    zh_all: '卡斯珀：嗨，艾玛！你现在其实忙吗，还是我们要不要顺便喝杯咖啡？

      艾玛：嗨，卡斯珀！我只剩几封邮件要处理，不过去喝杯咖啡休息一下听起来很棒。你在想什么事呢？

      卡斯珀：我明天得向理事会汇报我们的新节约方案。待会儿你能稍微帮我看一下我那五页幻灯片吗？大概也就花十分钟吧？

      艾玛：好呀，我当然愿意！不过除此之外，数据那块推进得怎么样？你昨天看起来压力有点大。

      卡斯珀：是啊，当时有点赶，不过现在看上去不错了。如果你更愿意午饭后再看，尽管告诉我。要不然我也可以把草稿邮件发给你，等你方便的时候再看就行。

      艾玛：不用，我们十二点就在我办公桌那儿直接看吧。我们稍微确认一下结论写得够犀利，对吧？

      卡斯珀：对，正是！反正也没必要把所有附件都放进正式演示里吧？

      艾玛：是的，完全没必要。你去倒咖啡吧，我顺便把桌子收拾一下！'
- id: tekstB
  title: Tekst B：Chat om fredagens borgermøde（对标 DU3 Modul 4 社交短信协商 · 约 140 词）
  tab: Tekst B
  kind: prose
  paras:
  - cue: 微信 / 短信对话｜Sofie & Thomas
    segs:
    - id: b1
      who: Thomas
      da: Hej Sofie!
      label: Thomas
    - id: b2
      who: Thomas
      da: Skal vi ikke tage sammen hen til borgermødet om nye cykelstier på fredag?
    - id: b3
      who: Sofie
      da: Hej Thomas!
      nl: true
      label: Sofie
    - id: b4
      who: Sofie
      da: Jeg vil [[egentlig]] gerne med, men mødet slutter **vel** ret sent, gør det ikke?
    - id: b5
      who: Sofie
      da: Jeg skal nemlig tidligt op lørdag morgen.
    - id: b6
      who: Thomas
      da: Det varer vist til omkring klokken ni, men du kan [[bare]] gå i pausen efter første time, hvis du bliver træt. **Ellers** kan vi [[lige]] mødes til en hurtig kop kaffe klokken fem først, så vi
        når at drøfte vores spørgsmål inden mødet.
      nl: true
      label: Thomas
    - id: b7
      who: Sofie
      da: Åh, det er en super idé!
      nl: true
      label: Sofie
    - id: b8
      who: Sofie
      da: Jeg tjekker [[lige]] min kalender, når jeg kommer hjem, og så skriver jeg til dig i aften.
    - id: b9
      who: Sofie
      da: Vi kan [[vel]] mødes ved biblioteket?
    - id: b10
      who: Thomas
      da: Ja da!
      nl: true
      label: Thomas
    - id: b11
      who: Thomas
      da: Sig [[bare]] til, hvis klokken fem bliver for tidligt for dig.
    zh_all: '托马斯：嗨，索菲！这周五我们要不要一起去参加关于新建自行车道的市民会议？

      索菲：嗨，托马斯！我其实很想去，不过会议大概会结束得挺晚的，对吧？我周六一大早还要早起呢。

      托马斯：听说会持续到九点左右，但如果你觉得累，完全可以在第一小时结束后的休息时间先走呀。要不然我们也可以五点先稍微碰头喝杯快咖啡，这样赶在开会前就能讨论好我们的问题。

      索菲：啊，这主意太棒了！我回家后稍微查一下日程表，今晚给你回信。我们大概约在图书馆门口碰面吧？

      托马斯：那当然！如果五点对你来说太早，尽管告诉我一声就行。'
