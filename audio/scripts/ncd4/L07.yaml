book: ncd4
lesson: 7
title_da: 'SU: En investering i fremtiden eller en dyr gavebod?'
blocks:
- id: tekstA
  title: Tekst A：Fri uddannelse til alle — eller en uholdbar udgift?（专题辩论综述 · 约 250 词）
  tab: Tekst A
  kind: prose
  paras:
  - segs:
    - id: a1
      who: narrator
      da: I Danmark får næsten alle studerende på videregående uddannelser hver måned udbetalt SU af staten uden at skulle betale pengene tilbage.
    - id: a2
      who: narrator
      da: Ordningen har i årtier været en hjørnesten i den danske velfærdsmodel.
    - id: a3
      who: narrator
      da: Men i de senere år har politikere og økonomer diskuteret livligt, om støtten til kandidatstuderende bør ændres til et studielån.
    zh: 在丹麦，几乎所有高等教育阶段的学生每月都能从国家领取助学金 SU，且无需偿还。几十年来，这一制度一直是丹麦福利模式的基石。但近年来，政治家和经济学家们热烈讨论，硕士研究生阶段的助学金是否应当改为助学贷款。
  - segs:
    - id: a4
      who: narrator
      da: '[[Tilhængere af den nuværende model fremhæver, at]] gratis uddannelse og SU skaber høj social mobilitet.'
    - id: a5
      who: narrator
      da: Når unge fra alle samfundslag har råd til at studere uden at arbejde tredive timer om ugen ved siden af, kan de koncentrere sig om bøgerne. [[Fortalere argumenterer desuden for, at]] veluddannede
        borgere senere betaler høje skatter tilbage til fællesskabet.
    - id: a6
      who: narrator
      da: Derfor [[betragter de]] ikke SU som en udgift, men som en langsigtet investering i hele samfundets fremtid.
    zh: 现行模式的支持者强调，免费教育和 SU 创造了高度的社会流动性。当来自各个社会阶层的年轻人都能负担得起学业，而不必每周兼职三十小时时，他们就能专心读书。此外，倡导者还论证说，受过良好教育的公民日后会向社会回馈高额税收。因此，他们并不将 SU 视为一笔开销，而是视为对整个社会未来的长期投资。
  - segs:
    - id: a7
      who: narrator
      da: '[[Modstandere indvender derimod, at]] kandidat-SU i praksis fungerer som en dyr gavebod til fremtidens højtlønnede. [[Kritikere peger på, at]] akademikere som regel tjener væsentligt mere end
        faglærte gennem hele arbejdslivet, **hvorimod** de ofte først kommer ud på arbejdsmarkedet sent i tyverne.'
    - id: a8
      who: narrator
      da: Et lån på de sidste to studieår ville **derimod** opmuntre flere studerende til at færdiggøre studiet hurtigere og frigøre milliarder af kroner til folkeskolen eller erhvervsuddannelserne.
    zh: 然而反对者反驳称，硕士阶段 SU 在实践中就像一场昂贵的“免费大派送”，补贴的恰恰是未来的高收入人群。批评者指出，大学毕业生在整个职业生涯中的收入通常显著高于技工群体，而他们往往要到将近三十岁才进入职场。相比之下，最后两年采用贷款方式反而会激励更多学生更快完成学业，并为公立中小学或职业教育释放出数十亿克朗的资金。
  - segs:
    - id: a9
      who: narrator
      da: 'Debatten viser således et klassisk dilemma i velfærdsstaten: Skal fællesskabet sikre helt lige muligheder for alle gennem brede tilskud, eller bør støtten målrettes dem, der har mindst?'
    - id: a10
      who: narrator
      da: Hvor den ene side ser tryghed og retfærdighed, ser den anden side et skævt system, der kræver reformer.
    zh: 因此，这场争论折射出福利国家的一个经典两难困境：社会是应当通过普惠补贴确保所有人完全平等的机会，还是应当将资助精准投向最缺少资源的人？一方看到的是安全感与公平，另一方看到的却是一个亟待改革的失衡体制。
- id: tekstB
  title: Tekst B：To læserbreve i universitetsavisen（观点交锋对读 · 约 140 词）
  tab: Tekst B
  kind: prose
  paras:
  - cue: '校园报刊正反来信｜Emne: Skal kandidat-SU afskaffes?'
    segs:
    - id: b1
      who: Maja
      da: Jeg kommer fra en familie uden akademisk baggrund, og uden SU havde jeg aldrig turdet starte på universitetet. [[Jeg vil gerne fremhæve, at]] støtten giver ro til fordybelse, så også unge uden
        rige forældre kan få en lang uddannelse.
      label: Maja
    - id: b2
      who: Maja
      da: Hvis staten fjerner stipendiet på kandidaten, risikerer vi, at færre tør drømme stort af frygt for gæld.
  - segs:
    - id: b3
      who: Mikkel
      da: Jeg forstår godt Majas pointe, men vi glemmer let prioriteringen. [[Kritikere af systemet indvender]] med rette, at en håndværker via sin skat betaler for en kommende jurists eller læges sidste
        studieår.
      label: Mikkel
    - id: b4
      who: Mikkel
      da: Et rentefrit studielån på kandidaten er **derimod** både rimeligt og solidarisk, fordi de penge i stedet kan styrke daginstitutioner og erhvervsskoler.
    zh_all: '玛雅（支持保留 SU）：我来自一个没有大学学历背景的家庭，如果没有 SU，我当初根本不敢报考大学。我想强调的是，这笔助学金能让人安心钻研学业，让父母并不富裕的年轻人也有机会读长学制学位。如果国家取消硕士阶段的助学金，我们就会面临这样的风险：越来越多人因为害怕背债而不敢胸怀远大梦想。

      米克尔（主张硕士改贷款）：我完全理解玛雅的观点，但我们很容易忽视财政优先次序。制度批评者有理有据地反驳说，一名蓝领技工正在用自己交的税为未来的律师或医生支付最后两年的学业开销。相比之下，硕士阶段实行免息助学贷款既合情合理又体现团结互助，因为省下的资金可以转而用于加强托幼机构和职业学校。'
