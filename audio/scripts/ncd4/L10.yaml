book: ncd4
lesson: 10
title_da: 'Integration og medborgerskab: Hvad kræver det?'
blocks:
- id: tekstA
  title: Tekst A：Integration som et fælles ansvar（社会深度评论 · 约 220 词）
  tab: Tekst A
  kind: prose
  paras:
  - segs:
    - id: a1
      who: narrator
      da: Når politikere og borgere i Danmark diskuterer fremtidens velfærdssamfund, dukker spørgsmålet om integration og aktivt medborgerskab næsten altid op.
    - id: a2
      who: narrator
      da: Alle partier er enige om, at et stærkt samfund bygger på tillid, men der er ofte uenighed om, hvad der kræves af både nyankomne og modtagersamfundet.
    zh: 当丹麦的政治家和公民讨论未来的福利社会时，关于社会融入与积极公民身份的问题几乎总会浮现。所有政党都认同，一个稳固的社会建立在信任之上，但对于新来者和接纳社会双方各自应当承担什么要求，人们却常常存在分歧。
  - segs:
    - id: a3
      who: narrator
      da: På den ene side mener et bredt flertal, at staten må [[stille klare krav om]] danskundervisning og selvforsørgelse fra dag ét.
    - id: a4
      who: narrator
      da: Arbejdsmarkedet og sproget [[spiller]] nemlig [[en afgørende rolle]] for, at man hurtigt lærer de uskrevne regler at kende og bliver uafhængig af offentlig hjælp.
    - id: a5
      who: narrator
      da: Når man har kolleger og faste opgaver, får man lettere et netværk og en følelse af tilhørsforhold.
    zh: 一方面，议会多数派认为国家必须从第一天起就对丹麦语学习与经济自立提出明确要求。因为劳动力市场和语言对于人迅速熟悉不成文的社会规则、摆脱对公共救济的依赖，起着决定性作用。当一个人有了同事和固定工作任务时，就更容易建立人脉并获得归属感。
  - segs:
    - id: a6
      who: narrator
      da: På den anden side peger forskere på, at integration aldrig kan være en ensidig opgave.
    - id: a7
      who: narrator
      da: Hvis lokale virksomheder og nabolag **bærer præg af** lukkede netværk, bliver det svært for udlændinge at få foden indenfor, selvom de gerne vil [[bidrage til fællesskabet]].
    - id: a8
      who: narrator
      da: Derfor bør kommuner og borgere sammen [[tage stilling til]], hvordan man åbner dørene i både arbejdslivet og det lokale foreningsliv.
    zh: 另一方面，学者指出融入绝不可能是一项单方面的任务。如果当地企业和街区充斥着封闭圈子，那么即使外国人很愿意为社会共同体作出贡献，也很难获得踏入其中的机会。因此，各市镇与居民应当共同审视并抉择，如何在职场和当地社团生活中敞开大门。
  - segs:
    - id: a9
      who: narrator
      da: Medborgerskab handler således ikke kun om et pas eller en opholdstilladelse, men om at [[tage ansvar for]] sit eget liv og det samfund, man bor i.
    - id: a10
      who: narrator
      da: Hvis den offentlige debat ikke **bærer præg af** mistillid og hårde overskrifter, men i stedet af gensidig respekt, skaber vi de bedste rammer for alle.
    zh: 由此可见，公民身份并不仅仅关乎一本护照或一张居留许可，更关乎为自己的生活以及自己所居住的社会承担责任。如果公共辩论不再带有不信任与尖锐标题的印记，而是体现出相互尊重，我们就能为所有人创造最好的制度环境。
- id: tekstB
  title: 'Tekst B：Debat på lokalt borgermøde: Rettigheder og pligter（市民大会正反对话 · 约 120 词）'
  tab: Tekst B
  kind: prose
  paras:
  - cue: 市民论坛对话｜Ali (Forældrerepræsentant) & Sofie (Integrationskonsulent)
    segs:
    - id: b1
      who: Ali
      da: Jeg har boet i Danmark i seks år, og for mig [[spiller]] den lokale fodboldklub [[en afgørende rolle]].
      label: Ali
    - id: b2
      who: Ali
      da: Her mødes vi på tværs af baggrund og sprog.
    - id: b3
      who: Ali
      da: Jeg mener, at vi alle skal [[tage ansvar for]] vores bydel, men desværre **bærer** mange jobopslag stadig **præg af**, at man kender nogen på forhånd.
  - segs:
    - id: b4
      who: Sofie
      da: Det har du en vigtig pointe i, Ali.
      label: Sofie
    - id: b5
      who: Sofie
      da: Som kommune skal vi selvfølgelig [[stille tydelige krav om]], at alle lærer dansk og møder til sprogkurser, for det er nøglen til job.
    - id: b6
      who: Sofie
      da: Men vi må samtidig [[tage stilling til]], hvordan virksomhederne kan blive bedre til at invitere nye borgere indenfor.
    - id: b7
      who: Sofie
      da: Først når både rettigheder og pligter følges ad, kan alle for alvor [[bidrage til]] vores fælles hverdag.
    zh_all: '阿里（家长代表）：我在丹麦住了六年，对我来说当地的足球俱乐部起了决定性作用。在那里，拥有不同背景和语言的人们聚在一起。我认为我们每个人都应当为自己的街区承担责任，但遗憾的是，许多招聘启事仍然带有“事先认识熟人”的倾向。

      索菲（融入事务顾问）：阿里，你这点说得很中肯。作为市政厅，我们当然必须对所有人学习丹麦语和参加语言课程提出明确要求，因为这是找到工作的钥匙。但与此同时，我们也必须认真思考并抉择，企业怎样才能更善于接纳新公民。只有当权利与义务并肩同行时，每个人才能真正为我们的共同日常生活作出贡献。'
