book: ncd4
lesson: 19
title_da: Dansk sprog i en engelsktalende verden
blocks:
- id: tekstA
  title: Tekst A：Dansk sprog i en engelsktalende verden（文化与语言思辨专栏 · 约 225 词）
  tab: Tekst A
  kind: prose
  paras:
  - segs:
    - id: a1
      who: narrator
      da: Overalt i det danske samfund vinder engelsk hurtigt frem.
    - id: a2
      who: narrator
      da: På landets universiteter udbydes mange kandidatuddannelser nu udelukkende på engelsk, og i internationale virksomheder i København og Aarhus fungerer engelsk ofte som fast koncernsprog fra dag
        ét.
    - id: a3
      who: narrator
      da: Samtidig blander især unge danskere et væld af engelske låneord ind i både daglig tale og opslag på sociale medier.
    zh: 在丹麦社会的各个角落，英语正在迅速普及。在全国多所大学里，许多硕士专业如今完全用英语授课；而在哥本哈根和奥胡斯的跨国企业中，英语从入职第一天起就常常作为固定的集团工作语言。与此同时，尤其是丹麦年轻人在日常口语和社交媒体发帖中，混用了大量英语借词。
  - segs:
    - id: a4
      who: narrator
      da: '**Det står uden for enhver tvivl, at** stærke engelskkundskaber er en afgørende fordel for et lille land som Danmark.'
    - id: a5
      who: narrator
      da: Uden et fælles internationalt arbejdssprog ville det være langt sværere at tiltrække dygtige forskere, ingeniører og udenlandske investeringer. **Det er netop derfor, at** mange betragter sprogets
        globalisering som en både naturlig og nødvendig udvikling.
    zh: 毫无疑问的是，扎实的英语能力对丹麦这样一个小国来说是一项决定性优势。如果没有一门共通的国际工作语言，吸引优秀的学者、工程师和海外投资就会困难得多。正因如此，许多人将语言的全球化视为一种既自然又必要的发展。
  - segs:
    - id: a6
      who: narrator
      da: '[[Spørgsmålet er imidlertid, hvorvidt]] denne udvikling på længere sigt kan svække det danske sprog gennem såkaldt domænetab.'
    - id: a7
      who: narrator
      da: Hvis forskere kun skriver og underviser på engelsk, mister dansk gradvist de præcise fagtermer, som er nødvendige for at beskrive ny viden og teknologi. [[Det rejser også spørgsmålet om, hvorvidt]]
        alle borgere fortsat kan følge med i den demokratiske samtale, når centrale rapporter og beslutninger ikke længere formuleres på dansk.
    zh: 然而问题在于，从长远来看，这一发展是否会通过所谓的“语域流失”而削弱丹麦语。如果学者们只用英语撰写论文和授课，丹麦语就会逐渐丧失描述新知识与新技术所必需的精确专业术语。这也引发了一个问题：当重要报告与政策决策不再用丹麦语表述时，所有公民是否依然能够跟得上公共民主讨论。
  - segs:
    - id: a8
      who: narrator
      da: '**Det kan ikke understreges nok, at** et sprog hænger uløseligt sammen med kultur og sammenhængskraft.'
    - id: a9
      who: narrator
      da: Løsningen er næppe at lukke døren for engelsk, men derimod at føre en bevidst sprogpolitik, hvor man både udvikler et levende dansk fagsprog og giver internationale medarbejdere reelle muligheder
        for at lære dansk i hverdagen.
    zh: 再怎么强调也不过分的是，一门语言与文化和凝聚力密不可分。解决之道恐怕不是对英语关上大门，而是推行一种自觉的语言政策——既培育充满活力的丹麦语专业术语体系，又为外籍员工提供在日常生活中学习丹麦语的切实机会。
- id: tekstB
  title: Tekst B：Skal arbejdssproget på danske kontorer altid være engelsk?（职场双人对谈 · 约 130 词）
  tab: Tekst B
  kind: prose
  paras:
  - cue: 职场播客对谈｜Kasper（IT-udvikler）& Emma（HR-chef）
    segs:
    - id: b1
      who: Kasper
      da: Hos os taler vi næsten kun engelsk hele dagen, fordi vi har kolleger fra tolv forskellige lande. **Det står uden for enhver tvivl, at** et fælles arbejdssprog skaber et åbent miljø, hvor nye internationale
        medarbejdere føler sig velkomne fra starten.
      label: Kasper
    - id: b2
      who: Emma
      da: Det er jeg helt enig i, Kasper. [[Spørgsmålet er imidlertid, hvorvidt]] engelsk alene er nok, hvis man virkelig vil føle sig hjemme i Danmark.
      nl: true
      label: Emma
    - id: b3
      who: Emma
      da: Hvis internationale ansatte aldrig hører dansk i kantinen, går de let glip af mange kulturelle nuancer.
    - id: b4
      who: Kasper
      da: Det har du måske ret i. [[Hvad betyder det egentlig for]] vores fællesskab, hvis vi aldrig øver dansk sammen?
      nl: true
      label: Kasper
    - id: b5
      who: Emma
      da: '**Det er netop gennem sproget, at** man opbygger dybere tillid.'
      nl: true
      label: Emma
    - id: b6
      who: Emma
      da: Derfor bør virksomheder både bruge engelsk i faglige projekter og give plads til dansk i pauserne.
    zh_all: '卡斯珀（IT 开发工程师）：在我们公司，大家整天几乎只说英语，因为我们有来自十二个不同国家的同事。毫无疑问的是，一种共同的工作语言能够营造开放的氛围，让新来的外籍员工从一开始就感到受欢迎。

      埃玛（人力资源总监）：这一点我完全同意，卡斯珀。然而问题在于，如果一个人真的想在丹麦产生归属感，仅仅靠英语是否足够。如果外籍员工在食堂里从听不到丹麦语，他们就很容易错过许多文化上的细微之处。

      卡斯珀：你也许说得对。如果我们从来不一起练习丹麦语，这对我们的团队凝聚力究竟意味着什么呢？

      埃玛：正是通过语言，人们才能建立起更深层次的信任。因此，企业应当既在专业项目中使用英语，又在休息时间给丹麦语留出空间。'
