book: ncd5
lesson: 1
title_da: 'Demografiens stille revolution: Når samfundet ældes'
blocks:
- id: tekstA
  title: Tekst A：Danmarks alderspyramide vender på hovedet（人口统计与经济分析专栏 · 约 370 词）
  tab: Tekst A
  kind: prose
  paras:
  - segs:
    - id: a1
      who: narrator
      da: 'Når man betragter Danmarks demografiske udvikling fra 2005 frem mod 2045, træder et tydeligt mønster frem: Det danske samfund ældes i et tempo, som grundlæggende forandrer balancen mellem generationerne.'
    - id: a2
      who: narrator
      da: Mens den gennemsnitlige levealder i perioden [[stiger støt til]] godt 84 år i 2045, falder fødselstallene samtidig til et historisk lavt niveau.
    - id: a3
      who: narrator
      da: Resultatet er ikke blot flere ældre borgere, men en gennemgribende forskydning af hele befolkningens alderssammensætning.
    zh: 当我们审视丹麦从 2005 年到 2045 年的人口结构演变时，一个清晰的规律显现出来：丹麦社会正以一种从根本上改变代际平衡的速度老龄化。在这一时期内，平均预期寿命稳步攀升至 2045 年的 84 岁以上，而出生率却同时跌至历史低位。其结果不仅是老年公民数量增多，更是整个人口年龄构成的深刻转移。
  - segs:
    - id: a4
      who: narrator
      da: Et blik på fordelingen mellem unge og ældre illustrerer dette skift med stor tydelighed.
    - id: a5
      who: narrator
      da: I 2005 [[udgjorde]] børn og unge mellem 0 og 17 år [[en andel på]] 22,3 procent af befolkningen, mens borgere på 65 år og derover kun udgjorde 15,1 procent.
    - id: a6
      who: narrator
      da: Der var altså [[en markant forskel mellem]] de to aldersgrupper på 7,2 procentpoint.
    - id: a7
      who: narrator
      da: 'Tyve år senere er billedet imidlertid vendt på hovedet: I 2025 når ældregruppen op på 21,2 procent og **overstiger** dermed for første gang i nyere tid de yngste årgange, som samtidig er faldet
        til 19,1 procent.'
    zh: 只要看一眼年轻群体与老年群体的分布比例，就能非常清楚地说明这一转变。2005 年，0 至 17 岁的儿童及青少年占总人口的 22.3%，而 65 岁及以上公民仅占 15.1%。也就是说，这两个年龄组之间存在着高达 7.2 个百分点的显著差距。然而二十年后，局面却完全倒转：到了 2025 年，老年群体占比达到 21.2%，从而在近代历史上首次超过了同时期已降至 19.1% 的最年轻群体。
  - segs:
    - id: a8
      who: narrator
      da: Endnu mere opsigtsvækkende er udviklingen i væksttempoet frem mod midten af århundredet.
    - id: a9
      who: narrator
      da: Andelen af borgere på 65 år og derover vokser særlig kraftigt mellem 2015 og 2035, hvor tiårsvæksten **topper i** perioden frem mod 2035 med næsten tre procentpoint på blot et årti.
    - id: a10
      who: narrator
      da: Derefter begynder kurven gradvist at **flade ud**, så stigningen fra 2035 til 2045 blot udgør 1,1 procentpoint.
    - id: a11
      who: narrator
      da: Parallelle tendenser ses i den yngste gruppe, hvor faldet ligeledes **aftager** mærkbart og stort set stagnerer omkring 18,2 procent i 2045.
    zh: 更加引人注目的是直至本世纪中叶的增速演变趋势。65 岁及以上人口占比在 2015 年至 2035 年间增长尤为迅猛，其中十年增幅在迈向 2035 年的阶段达到峰值，短短十年内就攀升了近三个百分点。此后，曲线开始逐渐趋平，使得 2035 年至 2045 年间的增幅仅为 1.1 个百分点。类似的趋势也出现在最年轻群体中：其降幅同样明显放缓，到 2045 年基本上在 18.2% 左右停滞下来。
  - segs:
    - id: a12
      who: narrator
      da: Bagsiden af denne udvikling rammer den erhvervsaktive del af befolkningen mellem 18 og 64 år, hvis andel reduceres fra 62,6 procent i 2005 til blot 56,6 procent i 2045.
    - id: a13
      who: narrator
      da: Samtidig mere end fordobles gruppen af borgere over 80 år fra 4,1 til 8,5 procent.
    - id: a14
      who: narrator
      da: For velfærdsstaten betyder det, at færre hænder i arbejde skal finansiere både pensioner, et mere specialiseret sundhedsvæsen og en langt mere ressourcekrævende ældrepleje.
    zh: 这一趋势的另一面则冲击着 18 至 64 岁的劳动年龄人口——其占比从 2005 年的 62.6% 缩减至 2045 年的仅仅 56.6%。与此同时，80 岁以上群体占比翻了一番多，从 4.1% 升至 8.5%。对福利国家而言，这意味着更少在职劳动者必须共同支撑养老金支出、更加专科化的医疗体系以及对资源需求高得多的老年照护。
  - segs:
    - id: a15
      who: narrator
      da: Samlet set peger tallene på en langsigtet udfordring for Danmarks forsørgerbyrde.
    - id: a16
      who: narrator
      da: Selvom væksten blandt de 65-årige på sigt stabiliseres, fortsætter presset på både arbejdsmarkedet og de kommunale budgetter, fordi den ældste del af befolkningen bliver ved med at vokse.
    - id: a17
      who: narrator
      da: Dermed bliver spørgsmålet om, hvordan man fastholder høj beskæftigelse og sikrer kvaliteten i kernevelfærden, en af de mest afgørende politiske opgaver i de kommende årtier.
    zh: 总体而言，这些数字指向了丹麦抚养比面临的一项长期挑战。尽管 65 岁以上群体的整体增速从长远来看会趋于平稳，但劳动力市场和各市镇财政预算承受的压力仍在持续，因为最高龄的那部分人口仍在不断壮大。由此，如何在未来数十年间保持高就业率并守住核心福利服务的质量，正成为最关键的政治课题之一。
- id: tekstB
  title: 'Tekst B：Kommentar: Demografi er ikke skæbne — det er et politisk valg（政策分析短评 · 约 130 词）'
  tab: Tekst B
  kind: prose
  paras:
  - cue: 政策评论｜Af Sofie Lindberg, cheføkonom i Tænketanken Fremtid
    segs:
    - id: b1
      who: narrator
      da: Tallene for Danmarks aldring skaber ofte dramatiske overskrifter om et kommende kollaps i velfærdsstaten.
    - id: b2
      who: narrator
      da: Men en højere levealder bør først og fremmest ses som en sundhedsmæssig succes.
    - id: b3
      who: narrator
      da: Demografi er nemlig ikke en fastlåst skæbne, hvis samfundets rammer tilpasses i tide.
  - segs:
    - id: b4
      who: narrator
      da: Når prognoserne viser en stigende forsørgerbyrde, glemmer debatten tit, at dagens 68-årige generelt er langt sundere end tidligere generationer.
    - id: b5
      who: narrator
      da: Hvis flere seniorer får lyst og mulighed for at blive på arbejdsmarkedet gennem fleksible vilkår, kan en gradvist højere pensionsalder afbøde meget af presset på de offentlige finanser.
  - segs:
    - id: b6
      who: narrator
      da: Samtidig må vi undgå, at politikkerne udelukkende handler om at få folk til at arbejde længere.
    - id: b7
      who: narrator
      da: Løsningen afhænger lige så meget af investeringer i ny teknologi og højere produktivitet i ældreplejen, så færre medarbejdere kan levere høj kvalitet uden at brænde ud.
    zh_all: '有关丹麦人口老龄化的数据，往往会催生出诸如“福利国家即将崩溃”之类的夸张标题。但预期寿命的延长，首先应当被视作公共健康领域的一项成功。只要社会制度框架能够及时调整，人口结构就绝非注定无法改变的宿命。

      当各项预测显示抚养比不断攀升时，公共辩论常常忽略了一个事实：今天的 68 岁老人普遍比以往任何几代人都更加健康。如果通过更灵活的工作条件让更多资深员工既有意愿又有机会留在劳动力市场，循序渐进地提高退休年龄便能够缓冲公共财政面临的大部分压力。

      与此同时，我们必须避免将政策仅仅局限于让人们延长工作年限。解决方案同样取决于向养老照护领域的新技术与更高生产力进行投资，使人数更少的员工也能在避免职业倦怠的前提下提供高质量的服务。'
