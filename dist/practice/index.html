, at jeg måtte købe en pose."}, {"zh": "我的书包当时一直躺在椅子上，所以我不知道它不在我身边。", "answer": "Min taske lå stadig på stolen, så jeg vidste ikke, at den ikke var med mig."}, {"zh": "昨晚我喝了一杯热茶，而且睡了九个小时。", "answer": "I aftes drak jeg en kop varm te og sov i ni timer."}]}, {"id": "A", "type": "drill", "title": "练习 A：不规则动词快问快答——写出下列动词的过去时（Datid）", "items": [{"prompt": "⟦at være⟧ → {{_}}", "kind": "cloze", "blanks": [["var"]]}, {"prompt": "⟦at have⟧ → {{_}}", "kind": "cloze", "blanks": [["havde"]]}, {"prompt": "⟦at gå⟧ → {{_}}", "kind": "cloze", "blanks": [["gik"]]}, {"prompt": "⟦at få⟧ → {{_}}", "kind": "cloze", "blanks": [["fik"]]}, {"prompt": "⟦at tage⟧ → {{_}}", "kind": "cloze", "blanks": [["tog"]]}, {"prompt": "⟦at se⟧ → {{_}}", "kind": "cloze", "blanks": [["så"]]}, {"prompt": "⟦at gøre⟧ → {{_}}", "kind": "cloze", "blanks": [["gjorde"]]}, {"prompt": "⟦at sige⟧ → {{_}}", "kind": "cloze", "blanks": [["sagde"]]}, {"prompt": "⟦at give⟧ → {{_}}", "kind": "cloze", "blanks": [["gav"]]}, {"prompt": "⟦at finde⟧ → {{_}}", "kind": "cloze", "blanks": [["fandt"]]}, {"prompt": "⟦at drikke⟧ → {{_}}", "kind": "cloze", "blanks": [["drak"]]}, {"prompt": "⟦at ligge⟧ → {{_}}", "kind": "cloze", "blanks": [["lå"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战（全面激活不规则过去时）", "items": [{"prompt": "昨天我坐公交去了超市，因为外面在下雨。", "kind": "write", "accept": ["I går tog jeg bussen til supermarkedet, fordi det regnede udenfor."]}, {"prompt": "你在货架上找到那两升牛奶了吗？", "kind": "write", "accept": ["Fandt du de to liter mælk på hylden?"]}, {"prompt": "我一共花了 180 克朗，但收银员说我必须买个袋子。", "kind": "write", "accept": ["Jeg gav 180 kroner i alt, men ekspedienten sagde, at jeg måtte købe en pose."]}, {"prompt": "我的书包当时一直躺在椅子上，所以我不知道它不在我身边。", "kind": "write", "accept": ["Min taske lå stadig på stolen, så jeg vidste ikke, at den ikke var med mig."], "explain": "或 ⟦...så jeg vidste det ikke.⟧"}, {"prompt": "昨晚我喝了一杯热茶，而且睡了九个小时。", "kind": "write", "accept": ["I aftes drak jeg en kop varm te og sov i ni timer."]}]}], "clips": {"hej lukas kom du lige hjem fra supermarkedet hvordan gik det": "f2423eda4240f3e8", "ja jeg tog bussen derhen fordi det regnede der var rigtig mange mennesker i netto": "1caa451d1e0dda6c", "fandt du alt på listen jeg skrev jo to liter mælk et rugbrød og seks æg": "a805f4fe27e3fde6", "næsten jeg så et godt tilbud på kaffe så jeg tog også en pose kaffe æggene stod helt oppe på en høj hylde men jeg fik en medarbejder til at hjælpe mig": "84d504612c145e08", "godt klaret hvor meget gav du for det hele ved kassen": "6a0ad1a840609066", "jeg gav cirka tohundrede kroner ekspedienten sagde at jeg måtte betale tre kroner for en pose fordi jeg ikke havde min egen taske med": "b263bc5432adb59d", "haha det vidste jeg godt for din stoftaske lå stadig på stolen her i stuen": "73d5ba8aaebe596c", "åh nej og ved du hvad bagefter sad jeg på en bænk udenfor og drak en sodavand pludselig så jeg på uret at klokken var fem så jeg løb hele vejen hjem": "8c5ea4c05b7a3986", "men hvor er smørret sagde du ikke i morges at vi skulle købe smør til i morgen": "5654403bfe7f98fc", "åh for søren det glemte jeg jeg gjorde ellers mit bedste men jeg ville bare hurtigt hjem fordi vores lille hund sov alene herhjemme": "b6e514a3c3988823", "et supermarked": "bf2ecedc8d09882e", "et tilbud": "fd8890c4d8c6e5c4", "en liter": "78d396fe6cb235f0", "et rugbrød": "e85cc9ebe2aecada", "et æg": "84eca898c447632f", "en hylde": "3b10d2e0cd41325d", "en kasse": "1104fffdfab68564", "en ekspedient": "2baba16a70ce0f27", "en pose": "6fbec09b97af8589", "en stoftaske": "e75e81d4cb7131d6", "smør": "8a6484835449430a", "at finde": "b7f037d1dc5e9620", "at give": "627d386e2af66dc4", "at glemme": "125b71548c7d69f3", "at løbe": "bc23a0df130195c6", "pludselig": "de52280731f6b83f", "næsten": "2eaf3f2ef736cffe", "stadig": "1f136d91bc481a7d"}, "key": "ncd1-L19"}, {"book": "ncd1", "lesson": 20, "title_da": "Min fritidsaktivitet", "title_zh": "我的业余爱好 [独白]", "grammar": "运动与爱好固定搭配（gå til + 活动, spille + 球类/乐器, dyrke + motion/sport） · 形式主语评价句（Det er sjovt / sundt / hyggeligt at...）", "sections": [{"id": "text-del1", "type": "text", "kind": "prose", "tab": "Del 1", "title": "Del 1：Monolog", "scene": null, "paras": [{"cue": "Tekst：Min fritidsaktivitet（第一人称连贯独白 · 94 词）", "segs": [{"id": "m1-1", "who": "Kursist", "da": "Jeg elsker at [[dyrke motion]] i min fritid, så jeg [[går til]] badminton i en lokal klub i Aarhus.", "a": "7598752acd8318d4", "dur": 5.12}, {"id": "m1-2", "who": "Kursist", "da": "Klubben ligger på Vesterbro Torv, ikke langt fra centrum.", "a": "f06593e7b4f56798", "dur": 3.12}, {"id": "m1-3", "who": "Kursist", "da": "Jeg træner to gange om ugen, tirsdag og torsdag fra klokken nitten til enogtyve.", "a": "879be8e3e2ff738f", "dur": 4.68}, {"id": "m1-4", "who": "Kursist", "da": "Det koster tohundrede kroner om måneden, for jeg får studierabat.", "a": "4711fc2646cf0fa6", "dur": 3.12}, {"id": "m1-5", "who": "Kursist", "da": "Jeg spiller ikke alene, men [[spiller badminton]] sammen med ti andre unge fra universitetet.", "a": "1478e1a07926e9b4", "dur": 4.52}, {"id": "m1-6", "who": "Kursist", "da": "I pausen snakker vi dansk og drikker vand.", "a": "ae2f5eb463be1511", "dur": 2.76}, {"id": "m1-7", "who": "Kursist", "da": "Jeg cykler altid til klubben, og det tager kun ti minutter. [[Det er både sjovt og sundt at]] spille badminton!", "a": "68a5700be0833ed3", "dur": 5.64}], "zh_all": "我非常喜欢在业余时间做运动，所以我在奥胡斯的一家本地俱乐部参加羽毛球运动。这家俱乐部位于 Vesterbro Torv，离市中心不远。我每周训练两次，周二和周四晚上七点到九点。因为我有学生折扣，每月只要两百克朗。我不是一个人打，而是和另外十位来自大学的年轻人一起打羽毛球。休息时我们会用丹麦语聊天、喝水。我总是骑自行车去俱乐部，只要十分钟就到了。打羽毛球既有趣又健康！"}]}, {"id": "text-del2", "type": "text", "kind": "dialog", "tab": "Del 2", "title": "Del 2：5 轮模拟口试追问与示范回答（DU3 Opgave 1 现场演练）", "scene": null, "paras": [{"cue": "第 1 轮｜节点：sted / by", "segs": [{"id": "del2-1q", "who": "Eksaminator", "da": "Hvad går du til i din fritid, og hvor ligger det?", "a": "7913636289784032", "dur": 2.76}]}, {"zh": "你业余时间参加什么活动，它在哪里？—— 我在奥胡斯 Vesterbro Torv 的一家本地俱乐部打羽毛球，离市中心很近。", "segs": [{"id": "del2-1a", "who": "Kursist", "da": "Jeg går til badminton i en lokal klub på Vesterbro Torv i Aarhus. Det ligger tæt på centrum.", "a": "ebc01c1acc51c56c", "dur": 5.44}]}, {"cue": "第 2 轮｜节点：dage / tid", "segs": [{"id": "del2-2q", "who": "Eksaminator", "da": "Hvilke dage træner du, og hvor lang tid varer det?", "a": "b05542d86e93d4d9", "dur": 2.52}]}, {"zh": "你周几训练，每次持续多久？—— 我每周练两次，周二和周四 19 点到 21 点，每次持续两小时。", "segs": [{"id": "del2-2a", "who": "Kursist", "da": "Jeg træner to gange om ugen, tirsdag og torsdag fra klokken nitten til enogtyve. Det varer to timer hver gang.", "a": "77d00d632937c310", "dur": 6.2}]}, {"cue": "第 3 轮｜节点：pris / gratis", "segs": [{"id": "del2-3q", "who": "Eksaminator", "da": "Er det gratis at spille i klubben, eller hvad koster det?", "a": "31753c0ab426a08a", "dur": 3.16}]}, {"zh": "在俱乐部打球免费吗，还是多少钱？—— 不免费。我每月付 200 克朗，因为我有学生折扣。", "segs": [{"id": "del2-3a", "who": "Kursist", "da": "Nej, det er ikke gratis. Jeg betaler tohundrede kroner om måneden, fordi jeg får studierabat.", "a": "5a8a4dc21320f36f", "dur": 5.52}]}, {"cue": "第 4 轮｜节点：alene / sammen med & aktiviteter", "segs": [{"id": "del2-4q", "who": "Eksaminator", "da": "Træner du alene, og hvad laver I i pausen?", "a": "f4ad928a8f72f28f", "dur": 3.8}]}, {"zh": "你一个人练吗，休息时你们做什么？—— 不是，我和大学里另外十位年轻人一起打。休息时我们喝水并用丹麦语聊天。", "segs": [{"id": "del2-4a", "who": "Kursist", "da": "Nej, jeg spiller sammen med ti andre unge fra universitetet. I pausen drikker vi vand og snakker dansk.", "a": "5ef703f63fd63213", "dur": 5.68}]}, {"cue": "第 5 轮｜节点：transport til aktiviteten", "segs": [{"id": "del2-5q", "who": "Eksaminator", "da": "Hvordan kommer du til klubben, og hvorfor kan du godt lide badminton?", "a": "c671d9623f813213", "dur": 3.6}]}, {"zh": "你怎么去俱乐部，为什么喜欢羽毛球？—— 我总是骑车过去，只要十分钟。我很喜欢，因为打羽毛球既有趣又健康！", "segs": [{"id": "del2-5a", "who": "Kursist", "da": "Jeg cykler altid derhen, og det tager kun ti minutter. Jeg er glad for det, for det er både sjovt og sundt at spille badminton!", "a": "317e8cf6bd6a82ba", "dur": 7.04}]}]}, {"id": "text-gloser", "typ entrum."]}, {"prompt": "我每周练两次，星期二和星期四晚上七点到九点。", "kind": "write", "accept": ["Jeg træner to gange om ugen, tirsdag og torsdag fra klokken nitten til enogtyve."]}, {"prompt": "这不是免费的，每月 200 克朗。", "kind": "write", "accept": ["Det er ikke gratis; det koster tohundrede kroner om måneden."]}, {"prompt": "我不是独自练习，我和另外十个人一起打球。", "kind": "write", "accept": ["Jeg træner ikke alene; jeg spiller sammen med ti andre mennesker."]}, {"prompt": "我总是骑车去那里，只需要十分钟。运动既健康又有趣！", "kind": "write", "accept": ["Jeg cykler altid derhen, og det tager kun ti minutter. Det er både sundt og sjovt at dyrke motion!"]}]}], "clips": {"jeg elsker at dyrke motion i min fritid så jeg går til badminton i en lokal klub i aarhus": "7598752acd8318d4", "klubben ligger på vesterbro torv ikke langt fra centrum": "f06593e7b4f56798", "jeg træner to gange om ugen tirsdag og torsdag fra klokken nitten til enogtyve": "879be8e3e2ff738f", "det koster tohundrede kroner om måneden for jeg får studierabat": "4711fc2646cf0fa6", "jeg spiller ikke alene men spiller badminton sammen med ti andre unge fra universitetet": "1478e1a07926e9b4", "i pausen snakker vi dansk og drikker vand": "ae2f5eb463be1511", "jeg cykler altid til klubben og det tager kun ti minutter det er både sjovt og sundt at spille badminton": "68a5700be0833ed3", "hvad går du til i din fritid og hvor ligger det": "7913636289784032", "jeg går til badminton i en lokal klub på vesterbro torv i aarhus det ligger tæt på centrum": "ebc01c1acc51c56c", "hvilke dage træner du og hvor lang tid varer det": "b05542d86e93d4d9", "jeg træner to gange om ugen tirsdag og torsdag fra klokken nitten til enogtyve det varer to timer hver gang": "77d00d632937c310", "er det gratis at spille i klubben eller hvad koster det": "31753c0ab426a08a", "nej det er ikke gratis jeg betaler tohundrede kroner om måneden fordi jeg får studierabat": "5a8a4dc21320f36f", "træner du alene og hvad laver i i pausen": "f4ad928a8f72f28f", "nej jeg spiller sammen med ti andre unge fra universitetet i pausen drikker vi vand og snakker dansk": "5ef703f63fd63213", "hvordan kommer du til klubben og hvorfor kan du godt lide badminton": "c671d9623f813213", "jeg cykler altid derhen og det tager kun ti minutter jeg er glad for det for det er både sjovt og sundt at spille badminton": "317e8cf6bd6a82ba", "en fritidsaktivitet": "0e8b20faac25df64", "fritid": "063eee95a888e88b", "motion": "e02b92b801c56cce", "en klub": "8d44840bfbd0eb87", "et centrum": "55930d6176e7acfc", "en pause": "b550513dd18b756d", "badminton": "01c8f7b4cda5a704", "at dyrke": "4026ca2e498b730e", "at spille": "18fb7bb97681dbc9", "at gå til": "1c373e6dfaa5b83c", "at cykle": "a04fd10ae95f72f4", "at vare": "e12a1eaef70583df", "lokal": "6b6ad108715e11e9", "sjov": "d51c40b921231f84", "sund": "a9a0a50ff77e091e", "alene": "70ad646c010b4f50", "sammen med": "677d830e8d84a84d"}, "key": "ncd1-L20"}, {"book": "ncd1", "lesson": 21, "title_da": "Hos lægen", "title_zh": "看医生", "grammar": "身体部位与疼痛表达（Det gør ondt i..., Jeg har ondt i hovedet/halsen/maven, have feber） · 建议与必要性（Du bør..., Du skal blive hjemme, Det er vigtigt at...）", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "Jonas 一早醒来浑身酸痛且发烧，便预约了家庭医生 Dr. Hansen 就诊，描述症状并询问是否需要开药和请病假。", "paras": [{"zh": "你好，约纳斯！请进，请坐。今天我能帮你看点什么？", "note": "lægen ˈlɛːən（g 完全不发音！）；sæt dig ˈsɛd dɑɪ̯；hjælpe ˈjɛlbə（词首 h 不发音）。", "segs": [{"id": "dialog-1", "who": "Lægen", "da": "Goddag, Jonas! Kom indenfor og sæt dig. Hvad kan jeg hjælpe dig med i dag?", "a": "1de518d0edacb181", "dur": 4.68}]}, {"zh": "谢谢。我今天感觉非常难受。我想我可能是得了流感或者重感冒。", "note": "virkelig ˈviɐ̯ɡəli（-ig 中 g 不发音）；dårligt ˈdɒːli（-igt 中的 g 和 t 均不发音！）；forkølelse fɒˈkʰøːˀləlsə。", "segs": [{"id": "dialog-2", "who": "Jonas", "da": "Tak. Jeg har det virkelig dårligt i dag. Jeg tror, jeg har fået influenza eller en slem forkølelse.", "a": "02b06631ced510d7", "dur": 7.04}]}, {"zh": "听起来不太好。你有什么症状？有哪里痛吗？", "note": "symptomer symˈtˢoːˀmɐ（p 极轻几乎脱落）；ondt ˈʌnˀd（d 不发音，类似 ʌnˀd）；nogen steder ˈnoːən ˈsdɛːðɐ。", "segs": [{"id": "dialog-3", "who": "Lægen", "da": "Det lyder ikke godt. Hvad er dine symptomer? Gør det ondt nogen steder?", "a": "c21eada2a83d19e9", "dur": 3.32}]}, {"zh": "有的，我头非常痛，喉咙也痛。全身都痛，而且我咳嗽得很厉害。", "note": "hovedet ˈhoːðəð（v 完全不发音！两个 d 都是软 d）；halsen ˈhalˀsən；kroppen ˈkʰʁʌbən；hoster ˈhosdɐ。", "segs": [{"id": "dialog-4", "who": "Jonas", "da": "Ja, jeg har meget ondt i hovedet og i halsen. Det gør også ondt i hele kroppen, og jeg hoster meget.", "a": "be4041a98a29755d", "dur": 7.48}]}, {"zh": "你还发烧吗，或者肚子痛吗？", "note": "feber ˈfeːbɐ（长 eː 音）；maven ˈmæːvən（注意不要和中文“马”混淆，a 偏 æː）。", "segs": [{"id": "dialog-5", "who": "Lægen", "da": "Har du også feber, eller har du ondt i maven?", "a": "109f998901cd991d", "dur": 2.44}]}, {"zh": "我肚子不痛，但今天早上我烧到 38.5 度。我昨晚几乎没睡着。", "note": "38,5 丹麦语小数点用逗号，读作 otteogtredive komma fem ˈɔːdʌˌtˢʁaðvə ˈkʰʌma ˈfɛmˀ；i nat i ˈnad（昨晚）。", "segs": [{"id": "dialog-6", "who": "Jonas", "da": "Jeg har ikke ondt i maven, men i morges havde jeg 38,5 i feber. Jeg sov næsten ikke i nat.", "a": "417fff3014b354af", "dur": 6.04}]}, {"zh": "让我看一下你的喉咙，再测一下体温……嗯，你的喉咙红了，也有点发烧。这只是普通病毒感染。", "note": "kigge ˈkʰiɡə；måle ˈmɔːlə；rød ˈʁœðˀ（小舌音 r + 圆唇 œ + 软 d + stød）；virus ˈviːʁus。", "segs": [{"id": "dialog-7", "who": "Lægen", "da": "Lad mig lige kigge i din hals og måle din temperatur... Ja, din hals er rød, og du har lidt feber. Det er bare en virus.", "a": "e71aba274b8e3665", "dur": 8.48}]}, {"zh": "我需要吃药吗？我这周在工作上特别忙。", "note": "medicin mediˈsiːˀn（重音在最后一个音节，c 读 s）；travlt ˈtʰʁɑʊ̯ˀld（非常忙）。", "segs": [{"id": "dialog-8", "who": "Jonas", "da": "Skal jeg tage noget medicin? Jeg har meget travlt på arbejdet i denne uge.", "a": "ed9fd1a124249b5c", "dur": 4.4}]}, {"zh": "你不需要用抗生素，但你应当请假在家休息三天。好好休息、多喝热茶非常关键。", "note": "bør ˈbɶɐ̯；vigtigt ˈveɡdi（-gt 不发音）；hvile sig ˈviːlə sɑɪ̯（hv- 中的 h 不发音！）；masser af ˈmasɐ a。", "segs": [{"id": "dialog-9", "who": "Lægen", "da": "Du behøver ikke antibiotika, men du bør blive hjemme fra arbejde i tre dage. Det er meget vigtigt at hvile sig og drikke masser af varm te.", "a": "55d0dd51da6dcffb", "dur": 8.32}]}, {"zh": "好的，我明白了。那我待会儿给老板打电话请病假。谢谢您的帮助！", "note": "chef ˈɕeːˀf（ch 读 ɕ）；melder sig syg ˈmɛlˀɐ sɑɪ̯ ˈsyːˀ（ld 中 d 不发音，syg 末尾 g 不发音！）。", "segs": [{"id": "dialog-10", "who": "Jonas", "da": "Okay, det forstår jeg godt. Så ringer jeg til min chef og melder mig syg. Tak for hjælpen!", "a": "d1d912e3e55fe03d", "dur": 4.76}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "医生（hos lægen 在诊所/看医生）", "note": "名词 · lægen, læger, lægerne", "segs": [{"id": "g1", "who": "narrator", "da": "en læge", "say": "en læge. lægen, læger, lægerne.", "a": "781ca8259959a54b", "dur": 4.72}]}, {"zh": "感冒", "note": "名词 · forkølelsen, forkølelser, forkølelserne", "segs": [{"id": "g2", "who": "narrator", "da": "en forkølelse", "say": "en forkølelse. forkølelsen, forkølelser, forkølelserne.", "a": "c34de8295b3bbfdf", "dur": 5.32}]}, {"zh": "发烧（共性不可数，have feber）", "note": "名词 · feberen, ingen flertal", "segs": [{"id": "g3", "who": "narrator", "da": "feber", "say": "feber. feberen, ingen flertal.", "a": "bba171912fce56fa", "dur": 3.0}]}, {"zh": "头，脑袋（v 不发音）", "note": "名词 · hovedet, hoveder, hovederne", "segs": [{"id": "g4", "who": "narrator", "da": "et hoved", "say": "et hoved. hovedet, hoveder, hovederne.", "a": "2f7fa862a0b13c8e", "dur": 4.08}]}, {"zh": "喉咙，脖子", "note": "名词 · halsen, halse, halsene", "segs": [{"id": "g5", "who": "narrator", "da": "en hals", "say": "en hals. halsen, halse, halsene.", "a": "b938c7d06690ee94", "dur": 5.48}]}, {"zh": "肚子，胃", "note": "名词 · maven, maver, maverne", "segs": [{"id": "g6", "who": "narrator", "da": "en mave", "say": "en mave. maven, maver, maverne.", "a": "39d26e5230e05991", "dur": 5.32}]}, {"zh": "身体", "note": "名词 · kroppen, kroppe, kroppene", "segs": [{"id": "g7", "who": "narrator", "da": "en krop", "say": "en krop. kroppen, kroppe, kroppene.", "a": "082817169ee55273", "dur": 5.0}]}, {"zh": "背  "zh": "疼痛地 / 难受地，糟糕地", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "我今天感觉非常难受，我头痛而且喉咙痛。", "answer": "Jeg har det virkelig dårligt i dag; jeg har ondt i hovedet og i halsen."}, {"zh": "你发烧了吗？或者肚子痛吗？", "answer": "Har du feber, eller har du ondt i maven?"}, {"zh": "今早我发烧到 38.5 度，昨晚几乎没睡觉。", "answer": "I morges havde jeg 38,5 i feber, og jeg sov næsten ikke i nat."}, {"zh": "你不需要用抗生素，但你应当在家休息两天。", "answer": "Du behøver ikke antibiotika, men du bør blive hjemme og hvile dig i to dage."}]}, {"id": "A", "type": "drill", "title": "练习 A：根据括号内提示词，填入身体部位的正确定冠词形式", "items": [{"prompt": "Jeg har desværre meget ondt i {{_}}. (⟦et hoved⟧)", "kind": "cloze", "blanks": [["hovedet"]]}, {"prompt": "Har du også ondt i {{_}}, når du synker? (⟦en hals⟧)", "kind": "cloze", "blanks": [["halsen"]]}, {"prompt": "Min ven kunne ikke spise morgenmad, for han havde ondt i {{_}}. (⟦en mave⟧)", "kind": "cloze", "blanks": [["maven"]]}, {"prompt": "Hun sidder for meget ved computeren, så nu gør det ondt i {{_}}. (⟦en ryg⟧)", "kind": "cloze", "blanks": [["ryggen"]]}, {"prompt": "Efter fodboldkampen i går havde Lukas ondt i {{_}}. (⟦et ben⟧)", "kind": "cloze", "blanks": [["benet"]]}, {"prompt": "Jeg har ondt i {{_}} i dag, så jeg skal til tandlægen. (⟦en tand⟧)", "kind": "cloze", "blanks": [["tanden"]]}]}, {"id": "B", "type": "drill", "title": "练习 B：用 Du bør...（不加 at）或 Det er vigtigt at...（加 at）完成健康建议", "items": [{"prompt": "Du har 39 i feber. → ⟦Du bør⟧ {{_}} (⟦blive i sengen⟧).", "kind": "cloze", "blanks": [["blive i sengen"]]}, {"prompt": "Din hals er meget rød. → ⟦Det er vigtigt⟧ {{_}} (⟦drikke varm te⟧).", "kind": "cloze", "blanks": [["at drikke varm te"]]}, {"prompt": "Du sov næsten ikke i nat. → ⟦Du bør⟧ {{_}} (⟦hvile dig i dag⟧).", "kind": "cloze", "blanks": [["hvile dig i dag"]]}, {"prompt": "Du har influenza. → ⟦Det er vigtigt⟧ {{_}} (⟦ringe til chefen og melde sig syg⟧).", "kind": "cloze", "blanks": [["at ringe til chefen og melde sig syg"]]}, {"prompt": "Du arbejder alt for meget. → ⟦Du bør ikke⟧ {{_}} (⟦tage på arbejde i morgen⟧).", "kind": "cloze", "blanks": [["tage på arbejde i morgen"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "我今天感觉非常难受，我头痛而且喉咙痛。", "kind": "write", "accept": ["Jeg har det virkelig dårligt i dag; jeg har ondt i hovedet og i halsen."]}, {"prompt": "你发烧了吗？或者肚子痛吗？", "kind": "write", "accept": ["Har du feber, eller har du ondt i maven?"]}, {"prompt": "今早我发烧到 38.5 度，昨晚几乎没睡觉。", "kind": "write", "accept": ["I morges havde jeg 38,5 i feber, og jeg sov næsten ikke i nat."]}, {"prompt": "你不需要用抗生素，但你应当在家休息两天。", "kind": "write", "accept": ["Du behøver ikke antibiotika, men du bør blive hjemme og hvile dig i to dage."]}, {"prompt": "好好休息、多喝水非常重要，我待会儿要给老板请病假。", "kind": "write", "accept": ["Det er meget vigtigt at hvile sig og drikke masser af vand. Jeg ringer til min chef og melder mig syg om lidt."]}]}], "clips": {"goddag jonas kom indenfor og sæt dig hvad kan jeg hjælpe dig med i dag": "1de518d0edacb181", "tak jeg har det virkelig dårligt i dag jeg tror jeg har fået influenza eller en slem forkølelse": "02b06631ced510d7", "det lyder ikke godt hvad er dine symptomer gør det ondt nogen steder": "c21eada2a83d19e9", "ja jeg har meget ondt i hovedet og i halsen det gør også ondt i hele kroppen og jeg hoster meget": "be4041a98a29755d", "har du også feber eller har du ondt i maven": "109f998901cd991d", "jeg har ikke ondt i maven men i morges havde jeg 385 i feber jeg sov næsten ikke i nat": "417fff3014b354af", "lad mig lige kigge i din hals og måle din temperatur ja din hals er rød og du har lidt feber det er bare en virus": "e71aba274b8e3665", "skal jeg tage noget medicin jeg har meget travlt på arbejdet i denne uge": "ed9fd1a124249b5c", "du behøver ikke antibiotika men du bør blive hjemme fra arbejde i tre dage det er meget vigtigt at hvile sig og drikke masser af varm te": "55d0dd51da6dcffb", "okay det forstår jeg godt så ringer jeg til min chef og melder mig syg tak for hjælpen": "d1d912e3e55fe03d", "en læge": "781ca8259959a54b", "en forkølelse": "c34de8295b3bbfdf", "feber": "bba171912fce56fa", "et hoved": "2f7fa862a0b13c8e", "en hals": "b938c7d06690ee94", "en mave": "39d26e5230e05991", "en krop": "082817169ee55273", "en ryg": "1ed502df294369df", "medicin": "ef5c59b7e02f673f", "at fejle": "0261f3ce3382abe0", "at hoste": "f86b490b288fd999", "at hvile sig": "b654a75a0e9673b4", "at melde sig syg": "9c38d96556dfb869", "at burde (情态)": "7d2976aaa04c5056", "syg": "d7ac52185e7afc64", "rød": "7028c9d003701349", "vigtig": "d6b84804fbe64dc9", "ondt": "9c745978e577c659", "dårligt": "5e7baf75056cfed5"}, "key": "ncd1-L21"}, {"book": "ncd1", "lesson": 22, "title_da": "En invitation til fødselsdag", "title_zh": "生日聚会邀请", "grammar": "丹麦语表达“将来”的三种方式（现在时 + 将来时间状语 · skal + 原形表计划安排 · vil + 原形表个人意愿） · 礼貌接受与委婉拒绝套语", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "下课后，Freja 邀请同学兼朋友 Mikkel 下周六上午来家里参加她的 30 岁丹麦式生日早午餐（fødselsdagsbrunch）。", "paras": [{"zh": "嗨，米克尔！你下周末有空吗？我周六满三十岁，打算办一个小小的生日早午餐聚会！", "note": "fylder ˈfylɐ（ld 中 d 不发音）；på lørdag pʰɔ ˈlɶɐ̯dæ（即将到来的周六用 på）；fødselsdag ˈføsəlsˌdæːˀ（第一个 d 与末尾 g 均不发音）。", "segs": [{"id": "dialog-1", "who": "Freja", "da": "Hej, Mikkel! Har du tid næste weekend? Jeg fylder tredive år på lørdag og holder en lille fødselsdagsbrunch!", "a": "b13843238a93e02c", "dur": 7.08}]}, {"zh": "哇，真令人兴奋！提前祝你生日快乐！听起来太惬意了。几点开始呢？", "note": "tillykke tˢeˈlyɡə（祝贺，重音在第二音节）；på forhånd pʰɔ ˈfɒːˌhʌnˀ（提前；nd 中 d 不发音）。", "segs": [{"id": "dialog-2", "who": "Mikkel", "da": "Ej, hvor spændende! Tillykke på forhånd! Det lyder rigtig hyggeligt. Hvad tid begynder det?", "a": "cf25f211ca6307f4", "dur": 4.96}]}, {"zh": "我们十点在我家开始。我早上要烤小面包，我妹妹也会过来帮我准备蛋糕。", "note": "hos mig hos ˈmɑɪ̯；bage boller ˈbæːə ˈbʌlɐ（bage 中 g 弱化接近脱落）；kagen ˈkʰæːən（g 不发音！）。", "segs": [{"id": "dialog-3", "who": "Freja", "da": "Vi starter klokken ti hjemme hos mig. Jeg skal bage boller om morgenen, og min søster kommer og hjælper mig med kagen.", "a": "3c38468372672557", "dur": 6.32}]}, {"zh": "真香呀，自制面包和生日蛋糕！还有谁会来参加早午餐呀？", "note": "hjemmebagte ˈjɛməˌbɑɡdə（h 不发音）；ellers ˈɛlˀɐs（还有谁/另外）。", "segs": [{"id": "dialog-4", "who": "Mikkel", "da": "Mums, hjemmebagte boller og fødselsdagskage! Hvem kommer ellers til brunchen?", "a": "24a2df359d5bda06", "dur": 5.12}]}, {"zh": "大概十位学校和工作上的好朋友。吃完后我们要玩桌游，或者如果天气好就去公园散步。", "note": "omkring ʌmˈkʰʁɛŋˀ；brætspil ˈbʁadˌsbel（桌游）；vejret ˈvæɐ̯ˀð（j 不发音，结尾软 d）。", "segs": [{"id": "dialog-5", "who": "Freja", "da": "Omkring ti gode venner fra studiet og arbejdet. Efter maden skal vi spille brætspil eller gå en tur i parken, hvis vejret er godt.", "a": "12d01456247d7f4a", "dur": 7.92}]}, {"zh": "我非常乐意去！我也可以带我女朋友萨拉一起来吗？", "note": "vil meget gerne ve ˈmɑːð ˈɡæɐ̯nə（vil 弱读，meget 读作 ˈmɑːð）；kæreste ˈkʰɛːɐsdə（男女朋友/伴侣，男女同词）。", "segs": [{"id": "dialog-6", "who": "Mikkel", "da": "Jeg vil meget gerne komme! Må jeg tage min kæreste, Sara, med også?", "a": "a5cfb3130e0e3788", "dur": 3.76}]}, {"zh": "当然可以呀！非常欢迎她。她周六也休息吗？", "note": "selvfølgelig sɛlˈfølˀəli（v 与词尾 g 均不发音）；velkommen ˈvɛlˌkʰʌmˀən。", "segs": [{"id": "dialog-7", "who": "Freja", "da": "Ja, selvfølgelig! Hun er meget velkommen. Har hun også fri på lørdag?", "a": "2d65cd37f69845c6", "dur": 4.12}]}, {"zh": "等一下，我查一下我的日程表……哎呀，真可惜她还是来不了。她周六九点到下午三点得上班。", "note": "kalender kʰaˈlɛnˀɐ（nd 中 d 不发音）；desværre desˈvɛɐ̯ɐ（遗憾地）；alligevel aˈliːəˌvɛlˀ（还是/尽管如此）。", "segs": [{"id": "dialog-8", "who": "Mikkel", "da": "Vent lige, jeg tjekker min kalender... Åh, desværre kan hun ikke komme alligevel. Hun skal arbejde fra klokken ni til femten på lørdag.", "a": "01a828283fe83ce5", "dur": 8.0}]}, {"zh": "那太遗憾了！替我向她问好。不过你还是会来的，对吧？你愿意带一瓶果汁过来吗？", "note": "ærgerligt ˈɛɐ̯ˀəli（g 与词尾 gt 均不发音！）；hils hende ˈhilˀs henə；juice ˈdʑuːs（英语借词）。", "segs": [{"id": "dialog-9", "who": "Freja", "da": "Det var ærgerligt! Hils hende mange gange fra mig. Men du kommer stadig, ikke? Vil du tage en flaske juice med?", "a": "00766f589c28bcb5", "dur": 6.12}]}, {"zh": "嗯，我当然愿意！我特别期待周六的聚会。我们十点见！", "note": "glæder mig til ˈɡlɛːðɐ mɑɪ̯ tˢe（软 d）；Vi ses! vi ˈseːˀs（回头见！）。", "segs": [{"id": "dialog-10", "who": "Mikkel", "da": "Jo, det vil jeg gerne! Jeg glæder mig rigtig meget til på lørdag. Vi ses klokken ti!", "a": "dac910670b574ea6", "dur": 4.28}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "邀请，请柬", "note": "名词 · invitationen, invitationer, invitationerne", "segs": [{"id": "g1", "who": "narrator", "da": "en invitation", "say": "en invitation. invitationen, invitationer, invitationerne.", "a": "d7ead5af4a993937", "dur": 7.28}]}, {"zh": "生日", "note": "名词 · fødselsdagen, fødselsdage, fødselsdagene", "segs": [{"id": "g2", "who": "narrator", "da": "en fødselsdag", "say": "en fødselsdag. fødselsdagen, fødselsdage, fødselsdagene.", "a": "894cd7464b107287", "dur": 6.2}]}, {"zh": "聚会，派对", "note": "名词 · festen, fester, festerne", "segs": [{"id": "g3", "who": "narrator", "da": "en fest", "say": "en fest. festen, fester, festerne.", "a": "8b059961e31f424f", "dur": 4.72}]}, {"zh": "早午餐", "note": "名词 · brunchen, bruncher, bruncherne", "segs": [{"id": "g4", "who": "narrator", "da": "en brunch", "say": "en brunch. brunchen, bruncher, bruncherne.", "a": "fd1f28fd88121a17", "dur": 4.84}]}, {"zh": "小圆面包（丹麦聚会标配）", "note": "名词 · bollen, boller, bollerne", "segs": [{"id": "g5", "who": "narrator", "da": "en bolle", "say": "en bolle. bollen, boller, bollerne.", "a": "4217d9bd808c09c8", "dur": 5.0}]}, {"zh": "蛋糕（fødselsdagskage 生日蛋糕）", "note": "名词 · kagen, kager, kagerne", "segs": [{"id": "g6", "who": "narrator", "da": "en kage", "say": "en kage. kagen, kager, kagerne.", "a": "3ea821443abe657a", "dur": 4.4}]}, {"zh": "桌游，棋盘游戏（单复同形）", "note": "名词 · brætspillet, brætspil, brætspillene", "segs": [{"id": "g7", "who": "narrator", "da": "et brætspil", "say": "et brætspil. brætspillet, brætspil, brætspillene.", "a": "f2fb2c0b9e4eaa25", "dur": 5.16}]}, {"zh": "公园", "note": "名词 · parken, parker, parkerne", "segs": [{"id": "g8", "who": "narrator", "da": "en park", "say": "en park. parken, parker, parkerne.", "a": "fb25ded7ba1f89bf", "dur": 4.72}]}, {"zh": "满（岁）；装满", "note": "动词 · fylder, fyldte, har fyldt", "segs": [{"id": "g9", "who": "narrator", "da": "at fylde", "say": "at fylde. fylder, fyldte, har fyldt.", "a": "b33c897504c9006d", "dur": 4.28}]}, {"zh": "举办（聚会）；拿，保持", "note": "动词 · holder, holdt, har holdt", "segs": [{"id": "g10", "who": "narrator", "da": "at holde", "say": "at holde. holder, holdt, har holdt.", "a": "32f89e0fcd013222", "dur": 4.32}]}, {"zh": "烘焙，烤（第 2 类规则）", "note": "动词 · bager, bagte, har bagt", "segs": [{"id": "g11", "who": "narrator", "da": "at bage", "say": "at bage. bager, bagte, har bagt.", "a": "616d27fb2e23e2a5", "dur": 4.56}]}, {"zh": "邀请（invitere nogen til...）", "note": "动词 · inviterer, inviterede, har inviteret", "segs": [{"id": "g12", "who": "narrator", "da": "at invitere", "say": "at invitere. inviterer, inviterede, har inviteret.", "a": "d44e77a7560a7a3f", "dur": 5.96}]}, {"zh": "期待……（反身动词）", "note": "动词 · glæder sig til, glædede sig til, har glædet sig til", "segs": [{"id": "g13", "who": "narrator", "da": "at glæde sig til", "say": "at glæde sig til. glæder sig til, glædede sig til, har glædet sig til.", "a": "24d49c8218512b00", "dur": 7.16}]}, {"zh": "受欢迎的", "note": "形容词 · velkomment, velkomne", "segs": [{"id": "g14", "who": "narrator", "da": "velkommen", "say": "velkommen. velkomment, velkomne.", "a": "84e6fb18a5bc8597", "dur": 4.36}]}, {"zh": "令人遗憾的，可惜的", "note": "形容词 · ærgerligt, ærgerlige", "segs": [{"id": "g15", "who": "narrator", "da": "ærgerlig", "say": "ærgerlig. ærgerligt, ærgerlige.", "a": "7fe5c8934676a3e6", "dur": 3.96}]}, {"zh": "遗憾地，可惜", "note": "副词", "segs": [{"id": "g16", "who": "narrator", "da": "desværre", "a": "bef698cae6feaf54", "dur": 0.96}]}, {"zh": "仍然，还是", "note": "副词", "segs": [{"id": "g17", "who": "narrator", "da": "alligevel", "a": "50aaf442b436d362", "dur": 0.96}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en invitation", "zh": "邀请，请柬", "forms": "invitationen, invitationer, invitationerne"}, {"pos": "名词", "da": "en fødselsdag", "zh": "生日", "forms": "fødselsdagen, fødselsdage, fødselsdagene"}, {"pos": "名词", "da": "en fest", "zh": "聚会，派对", "forms": "festen, fester, festerne"}, {"pos": "名词", "da": "en brunch", "zh": "早午餐", "forms": "brunchen, bruncher, bruncherne"}, {"pos": "名词", "da": "en bolle", "zh": "小圆面包（丹麦聚会标配）", "forms": "bollen, boller, bollerne"}, {"pos": "名词", "da": "en kage", "zh": "蛋糕（fødselsdagskage 生日蛋糕）", "forms": "kagen, kager, kagerne"}, {"pos": "名词", "da": "et brætspil", "zh": "桌游，棋盘游戏（单复同形）", "forms": "brætspillet, brætspil, brætspillene"}, {"pos": "名词", "da": "en park", "zh": "公园", "forms": "parken, parker, parkerne"}, {"pos": "动词", "da": "at fylde", "zh": "满（岁）；装满", "forms": "fylder, fyldte, har fyldt"}, {"pos": "动词", "da": "at holde", "zh": "举办（聚会）；拿，保持", "forms": "holder, holdt, har holdt"}, {"pos": "动词", "da": "at bage", "zh": "烘焙，烤（第 2 类规则）", "forms": "bager, bagte, har bagt"}, {"pos": "动词", "da": "at invitere", "zh": "邀请（invitere nogen til...）", "forms": "inviterer, inviterede, har inviteret"}, {"pos": "动词", "da": "at glæde sig til", "zh": "期待……（反身动词）", "forms": "glæder sig til, glædede sig til, har glædet sig til"}, {"pos": "形容词", "da": "velkommen", "zh": "受欢迎的", "forms": "velkomment, velkomne"}, {"pos": "形容词", "da": "ærgerlig", "zh": "令人遗憾的，可惜的", "forms": "ærgerligt, ærgerlige"}, {"pos": "副词", "da": "desværre / alligevel", "zh": "遗憾地，可惜 / 仍然，还是", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "提前祝你生日快乐！聚会几点开始？", "answer": "Tillykke på forhånd! Hvad tid begynder festen?"}, {"zh": "早上我要烤面包，然后下午我们要去公园散步。", "answer": "Om morgenen skal jeg bage boller, og om eftermiddagen skal vi gå en tur i parken."}, {"zh": "我非常愿意来，请问我可以带一位朋友一起来吗？", "answer": "Jeg vil meget gerne komme! Må jeg tage en ven med?"}, {"zh": "谢谢你的邀请，但可惜我周六不能来，因为我必须学习。", "answer": "Tak for invitationen, men desværre kan jeg ikke komme på lørdag, for jeg skal studere."}]}, {"id": "A", "type": "drill", "title": "练习 A：用现在时、skal 或 vil 选出最地道的将来表达完成句子", "items": [{"prompt": "Jeg {{_}} (⟦skal / vil⟧) meget gerne komme til din fest på fredag!", "kind": "cloze", "blanks": [["vil"]], "explain": "表个人非常愿意"}, {"prompt": "På søndag {{_}} (⟦besøger / vil besøge⟧) vi mine forældre i Odense.", "kind": "cloze", "blanks": [["besøger"]], "explain": "或 ⟦skal besøge⟧，表已定日程绝不用 ⟦vil⟧"}, {"prompt": "Se på vejrudsigten: det {{_}} (⟦regner / vil regne⟧) hele dagen i morgen.", "kind": "cloze", "blanks": [["regner"]], "explain": "客观天气不用 ⟦vil⟧！"}, {"prompt": "Hvad {{_}} (⟦skal / vil⟧) I lave i sommerferien? Har I allerede bestilt billetter?", "kind": "cloze", "blanks": [["skal"]], "explain": "询问已经计划好的假期安排"}, {"prompt": "{{_}} (⟦Vil / Fylder⟧) du ikke hjælpe mig med at bage kagen?", "kind": "cloze", "blanks": [["Vil"]], "explain": "礼貌请求别人帮忙用 ⟦Vil du...?⟧"}, {"prompt": "Min kæreste kan ikke komme i aften, for hun {{_}} (⟦skal / vil⟧) arbejde til klokken tyve.", "kind": "cloze", "blanks": [["skal"]], "explain": "排班义务/日程"}, {"prompt": "Næste torsdag {{_}} (⟦fylder / vil fylde⟧) min søster tyve år.", "kind": "cloze", "blanks": [["fylder"]], "explain": "客观到来的生日用现在时"}]}, {"id": "B", "type": "drill", "title": "练习 B：星期介词填空——在横线上填入 i lørdags、på lørdag 或 om lørdagen", "items": [{"prompt": "{{_}} holdt Emma en stor fødselsdagsfest, og vi spiste dejlig kage.", "kind": "cloze", "blanks": [["I lørdags"]], "explain": "过去时 ⟦holdt⟧"}, {"prompt": "Jeg har aldrig undervisning {{_}}, så jeg slapper altid af i weekenden.", "kind": "cloze", "blanks": [["om lørdagen"]], "explain": "习惯频率 ⟦aldrig / altid⟧"}, {"prompt": "Kommer du til vores brunch {{_}}? Vi begynder klokken ti.", "kind": "cloze", "blanks": [["på lørdag"]], "explain": "即将到来的周六"}, {"prompt": "Hvad lavede du {{_}}? Ringede du til din familie?", "kind": "cloze", "blanks": [["i lørdags"]], "explain": "过去时 ⟦lavede⟧"}, {"prompt": "Jeg kan desværre ikke komme {{_}}, for jeg skal på arbejde.", "kind": "cloze", "blanks": [["på lørdag"]], "explain": "即将到来的周六计划"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "下周六我满二十五岁，我要在家里办一个小聚会！", "kind": "write", "accept": ["På lørdag om en uge / Næste lørdag fylder jeg femogtyve år, og jeg holder en lille fest hjemme hos mig!"]}, {"prompt": "提前祝你生日快乐！聚会几点开始？", "kind": "write", "accept": ["Tillykke på forhånd! Hvad tid begynder festen?"]}, {"prompt": "早上我要烤面包，然后下午我们要去公园散步。", "kind": "write", "accept": ["Om morgenen skal jeg bage boller, og om eftermiddagen skal vi gå en tur i parken."]}, {"prompt": "我非常愿意来，请问我可以带一位朋友一起来吗？", "kind": "write", "accept": ["Jeg vil meget gerne komme! Må jeg tage en ven med?"]}, {"prompt": "谢谢你的邀请，但可惜我周六不能来，因为我必须学习。", "kind": "write", "accept": ["Tak for invitationen, men desværre kan jeg ikke komme på lørdag, for jeg skal studere."]}]}], "clips": {"hej mikkel har du tid næste weekend jeg fylder tredive år på lørdag og holder en lille fødselsdagsbrunch": "b13843238a93e02c", "ej hvor spændende tillykke på forhånd det lyder rigtig hyggeligt hvad tid begynder det": "cf25f211ca6307f4", "vi starter klokken ti hjemme hos mig jeg skal bage boller om morgenen og min søster kommer og hjælper mig med kagen": "3c38468372672557", "mums hjemmebagte boller og fødselsdagskage hvem kommer ellers til brunchen": "24a2df359d5bda06", "omkring ti gode venner fra studiet og arbejdet efter maden skal vi spille brætspil eller gå en tur i parken hvis vejret er godt": "12d01456247d7f4a", "jeg vil meget gerne komme må jeg tage min kæreste sara med også": "a5cfb3130e0e3788", "ja selvfølgelig hun er meget velkommen har hun også fri på lørdag": "2d65cd37f69845c6", "vent lige jeg tjekker min kalender åh desværre kan hun ikke komme alligevel hun skal arbejde fra klokken ni til femten på lørdag": "01a828283fe83ce5", "det var ærgerligt hils hende mange gange fra mig men du kommer stadig ikke vil du tage en flaske juice med": "00766f589c28bcb5", "jo det vil jeg gerne jeg glæder mig rigtig meget til på lørdag vi ses klokken ti": "dac910670b574ea6", "en invitation": "d7ead5af4a993937", "en fødselsdag": "894cd7464b107287", "en fest": "8b059961e31f424f", "en brunch": "fd1f28fd88121a17", "en bolle": "4217d9bd808c09c8", "en kage": "3ea821443abe657a", "et brætspil": "f2fb2c0b9e4eaa25", "en park": "fb25ded7ba1f89bf", "at fylde": "b33c897504c9006d", "at holde": "32f89e0fcd013222", "at bage": "616d27fb2e23e2a5", "at invitere": "d44e77a7560a7a3f", "at glæde sig til": "24d49c8218512b00", "velkommen": "84e6fb18a5bc8597", "ærgerlig": "7fe5c8934676a3e6", "desværre": "bef698cae6feaf54", "alligevel": "50aaf442b436d362"}, "key": "ncd1-L22"}, {"book": "ncd1", "lesson": 23, "title_da": "Undskyld, kan du gentage det?", "title_zh": "抱歉，能重复一遍吗？", "grammar": "交际救场元语言（Metasprog）（kan du gentage det? / tale lidt langsommere? / hvad betyder...? / hvordan staver man det? / er det det samme som...?） · 肯定与否定简短附和句（Det gør jeg også / Det er jeg også vs Det gør jeg heller ikke / Det er jeg heller ikke）", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "距丹麦语模块考试还有一周，Jonas 和 Emma 约在咖啡馆一起练习口语对话。过程中 Emma 遇到生词立刻用丹麦语“救场”，两人还发现了不少共同习惯。", "paras": [{"zh": "嗨，艾玛！下周要考丹麦语了，我其实有点紧张。", "note": "faktisk ˈfaɡdisg（其实，事实上）；nervøs nɛɐ̯ˈvøːˀs（重音在第二音节）；prøven ˈpʰʁœːvən。", "segs": [{"id": "dialog-1", "who": "Jonas", "da": "Hej Emma! Jeg er faktisk lidt nervøs før danskprøven næste uge.", "a": "0ca7ade761801959", "dur": 3.24}]}, {"zh": "我也是！不过我们已经练了很多次了。你周日通常做什么来放松呀？", "note": "Det er jeg også de ˈæɐ̯ jɑɪ̯ ˈʌsə（også 中 g 不发音）；øvet os ˈøːvəð ʌs；plejer ˈpʰlɑɪ̯ɐ（习惯于/通常）。", "segs": [{"id": "dialog-2", "who": "Emma", "da": "Det er jeg også! Men vi har øvet os meget. Hvad plejer du at lave om søndagen for at slappe af?", "a": "ac6fc595c134e903", "dur": 6.04}]}, {"zh": "我在市中心一家小小的语言咖啡馆做志愿者。下午我不喝咖啡，就是多和人聊聊天。", "note": "frivillig ˈfʁiˌvili（词尾 -ig 中 g 不发音！）；sprogcafé ˈsbʁɔʊ̯kʰaˌfeːˀ；midtbyen ˈmedˌbyːˀən（dt 只发轻 d/t）。", "segs": [{"id": "dialog-3", "who": "Jonas", "da": "Jeg arbejder som frivillig i en lille sprogcafé i midtbyen. Jeg drikker ikke kaffe om eftermiddagen, men snakker meget med folk.", "a": "bdd8be65857310cf", "dur": 6.56}]}, {"zh": "抱歉，你能重复一遍吗？你能说得稍微慢一点吗？“som”后面的那个词我没听清。", "note": "gentage ˈɡɛnˌtˢæːˀ（重复）；langsommere ˈlɑŋˌsʌmˀɐɐ（更慢一些，双 m 短音）；fangede ˈfaŋəðə（抓住/听清）。", "segs": [{"id": "dialog-4", "who": "Emma", "da": "Undskyld, kan du gentage det? Kan du tale lidt langsommere? Jeg fangede ikke det ord efter \"som\".", "a": "e7094c1a7ff11360", "dur": 6.52}]}, {"zh": "没问题！我说的是我在一家语言咖啡馆做“frivillig”。", "note": "Ja da! ja ˈda（语气助词，表示“当然啦/没问题”）。", "segs": [{"id": "dialog-5", "who": "Jonas", "da": "Ja da! Jeg sagde, at jeg arbejder som frivillig i en sprogcafé.", "a": "564cdf4d287dddd0", "dur": 3.8}]}, {"zh": "“frivillig”是什么意思呀，怎么拼写呢？", "note": "betyder beˈtˢyːˀðɐ（be- 轻读，软 d + stød）；staver man det ˈsdæːvɐ man de（拼写）。", "segs": [{"id": "dialog-6", "who": "Emma", "da": "Hvad betyder \"frivillig\", og hvordan staver man det?", "a": "11483fffc9128c9f", "dur": 3.0}]}, {"zh": "拼写是 F-R-I-V-I-L-L-I-G。意思是无偿（不拿工资）帮助别人。", "note": "uden løn ˈuːðən ˈlønˀ（没有报酬；软 d）；注意丹麦字母读音：F ɛf, R ɛɐ̯, I iːˀ, V veːˀ, L ɛl, G ɡeːˀ。", "segs": [{"id": "dialog-7", "who": "Jonas", "da": "Man staver det F-R-I-V-I-L-L-I-G. Det betyder, at man hjælper andre uden løn.", "a": "8bc4e4d54b05776b", "dur": 8.24}]}, {"zh": "啊哈，现在我懂了！这和“免费帮忙”是一个意思吗？顺便说，我每天早上都喝咖啡，不过周日我不工作。", "note": "det samme som de ˈsamə sʌm（和……一样）；forresten fɒˈʁɛsdən（顺便说一句）。", "segs": [{"id": "dialog-8", "who": "Emma", "da": "Aha, nu forstår jeg! Er det det samme som \"gratis hjælp\"? Forresten drikker jeg kaffe hver morgen, men jeg arbejder ikke om søndagen.", "a": "6abf0fb113dd182f", "dur": 10.68}]}, {"zh": "我也是——我是说早上喝咖啡！不过我周日也不上班，所以这点我也不一样（我也不做）。我周日从来不会感到紧张有压力！", "note": "altså ˈalˀsʌ（就是说）；heller ikke ˈhɛlˀɐ ˈeɡə（也……不）；stresset ˈsdʁɛsəð（有压力的）。", "segs": [{"id": "dialog-9", "who": "Jonas", "da": "Det gør jeg også — altså drikker kaffe om morgenen! Men jeg arbejder heller ikke om søndagen, så det gør jeg heller ikke. Jeg er aldrig stresset om søndagen!", "a": "1771db97dba229bf", "dur": 6.76}]}, {"zh": "我也不紧张！谢谢陪我聊天，约纳斯——现在我觉得对考试更有把握了！", "note": "snakken ˈsnaɡən（这次聊天）；føler mig ˈføːˀlɐ mɑɪ̯（感到自己……）；klar til ˈkʰlɑːˀ tˢe。", "segs": [{"id": "dialog-10", "who": "Emma", "da": "Det er jeg heller ikke! Tak for snakken, Jonas — nu føler jeg mig meget mere klar til prøven!", "a": "e6dd06f61254e69f", "dur": 5.44}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "考试，测试（danskprøve 丹麦语考试）", "note": "名词 · prøven, prøver, prøverne", "segs": [{"id": "g1", "who": "narrator", "da": "en prøve", "say": "en prøve. prøven, prøver, prøverne.", "a": "846182db2a6d321d", "dur": 4.52}]}, {"zh": "工资，薪水", "note": "名词 · lønnen, lønninger, lønningerne", "segs": [{"id": "g2", "who": "narrator", "da": "en løn", "say": "en løn. lønnen, lønninger, lønningerne.", "a": "fa8252e38facbc5f", "dur": 6.24}]}, {"zh": "语言交流咖啡角", "note": "名词 · sprogcaféen, sprogcaféer, sprogcaféerne", "segs": [{"id": "g3", "who": "narrator", "da": "en sprogcafé", "say": "en sprogcafé. sprogcaféen, sprogcaféer, sprogcaféerne.", "a": "2b2c6199363b5b00", "dur": 5.32}]}, {"zh": "市中心区", "note": "名词 · midtbyen, ingen flertal", "segs": [{"id": "g4", "who": "narrator", "da": "en midtby", "say": "en midtby. midtbyen, ingen flertal.", "a": "58af9d7839bf4c80", "dur": 3.8}]}, {"zh": "闲聊，谈话", "note": "名词 · snakken, snakke, snakkene", "segs": [{"id": "g5", "who": "narrator", "da": "en snak", "say": "en snak. snakken, snakke, snakkene.", "a": "3e83a87f8f819b47", "dur": 4.2}]}, {"zh": "重复（不规则变化同 tage）", "note": "动词 · gentager, gentog, har gentaget", "segs": [{"id": "g6", "who": "narrator", "da": "at gentage", "say": "at gentage. gentager, gentog, har gentaget.", "a": "43cb2e2a619af87c", "dur": 5.16}]}, {"zh": "意味着，意思是（不规则变化）", "note": "动词 · betyder, betød, har betydet", "segs": [{"id": "g7", "who": "narrator", "da": "at betyde", "say": "at betyde. betyder, betød, har betydet.", "a": "abd34acec3003ba2", "dur": 4.32}]}, {"zh": "拼写（第 1 类规则变化）", "note": "动词 · staver, stavede, har stavet", "segs": [{"id": "g8", "who": "narrator", "da": "at stave", "say": "at stave. staver, stavede, har stavet.", "a": "230eaf39624181cb", "dur": 4.96}]}, {"zh": "练习（反身或及物：øve dansk）", "note": "动词 · øver, øvede, har øvet", "segs": [{"id": "g9", "who": "narrator", "da": "at øve (sig)", "say": "at øve (sig). øver, øvede, har øvet.", "a": "78b567efa62cd7ba", "dur": 4.72}]}, {"zh": "抓住；听清（口语）", "note": "动词 · fanger, fangede, har fanget", "segs": [{"id": "g10", "who": "narrator", "da": "at fange", "say": "at fange. fanger, fangede, har fanget.", "a": "98d28080cc5b662b", "dur": 4.28}]}, {"zh": "惯常做……（plejer at + inf.）", "note": "动词 · plejer, plejede, har plejet", "segs": [{"id": "g11", "who": "narrator", "da": "at pleje", "say": "at pleje. plejer, plejede, har plejet.", "a": "346fd866c6f6d362", "dur": 4.0}]}, {"zh": "紧张的，焦虑的", "note": "形容词 · nervøst, nervøse", "segs": [{"id": "g12", "who": "narrator", "da": "nervøs", "say": "nervøs. nervøst, nervøse.", "a": "0cccab0361fac6fa", "dur": 3.88}]}, {"zh": "口头的，口语的（d 与 g 不发音）", "note": "形容词 · mundtligt, mundtlige", "segs": [{"id": "g13", "who": "narrator", "da": "mundtlig", "say": "mundtlig. mundtligt, mundtlige.", "a": "cf40892c19c8bbda", "dur": 3.56}]}, {"zh": "自愿的；志愿者的（可作名词）", "note": "形容词 · frivilligt, frivillige", "segs": [{"id": "g14", "who": "narrator", "da": "frivillig", "say": "frivillig. frivilligt, frivillige.", "a": "623f8f061df16276", "dur": 3.88}]}, {"zh": "慢的（比较级 langsommere）", "note": "形容词 · langsomt, langsomme", "segs": [{"id": "g15", "who": "narrator", "da": "langsom", "say": "langsom. langsomt, langsomme.", "a": "783ba9bc8bdf97a8", "dur": 3.96}]}, {"zh": "也（用于肯定）", "note": "副词", "segs": [{"id": "g16", "who": "narrator", "da": "også", "a": "db3cf166597f3e04", "dur": 0.64}]}, {"zh": "也不（用于否定）", "note": "副词", "segs": [{"id": "g17", "who": "narrator", "da": "heller ikke", "a": "8b3d7a59af28ae02", "dur": 1.0}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en prøve", "zh": "考试，测试（danskprøve 丹麦语考试）", "forms": "prøven, prøver, prøverne"}, {"pos": "名词", "da": "en løn", "zh": "工资，薪水", "forms": "lønnen, lønninger, lønningerne"}, {"pos": "名词", "da": "en sprogcafé", "zh": "语言交流咖啡角", "forms": "sprogcaféen, sprogcaféer, sprogcaféerne"}, {"pos": "名词", "da": "en midtby", "zh": "市中心区", "forms": "midtbyen, ingen flertal"}, {"pos": "名词", "da": "en snak", "zh": "闲聊，谈话", "forms": "snakken, snakke, snakkene"}, {"pos": "动词", "da": "at gentage", "zh": "重复（不规则变化同 tage）", "forms": "gentager, gentog, har gentaget"}, {"pos": "动词", "da": "at betyde", "zh": "意味着，意思是（不规则变化）", "forms": "betyder, betød, har betydet"}, {"pos": "动词", "da": "at stave", "zh": "拼写（第 1 类规则变化）", "forms": "staver, stavede, har stavet"}, {"pos": "动词", "da": "at øve (sig)", "zh": "练习（反身或及物：øve dansk）", "forms": "øver, øvede, har øvet"}, {"pos": "动词", "da": "at fange", "zh": "抓住；听清（口语）", "forms": "fanger, fangede, har fanget"}, {"pos": "动词", "da": "at pleje", "zh": "惯常做……（plejer at + inf.）", "forms": "plejer, plejede, har plejet"}, {"pos": "形容词", "da": "nervøs", "zh": "紧张的，焦虑的", "forms": "nervøst, nervøse"}, {"pos": "形容词", "da": "mundtlig", "zh": "口头的，口语的（d 与 g 不发音）", "forms": "mundtligt, mundtlige"}, {"pos": "形容词", "da": "frivillig", "zh": "自愿的；志愿者的（可作名词）", "forms": "frivilligt, frivillige"}, {"pos": "形容词", "da": "langsom", "zh": "慢的（比较级 langsommere）", "forms": "langsomt, langsomme"}, {"pos": "副词", "da": "også / heller ikke", "zh": "也（用于肯定） / 也不（用于否定）", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "抱歉，你能再重复一遍吗？我没听清最后一个词。", "answer": "Undskyld, kan du gentage det? Jeg fangede ikke det sidste ord."}, {"zh": "你能稍微说慢一点吗？ : 2.28}, {"id": "m1-7", "who": "Kursist", "da": "Jeg [[bor]] i en hyggelig lejlighed sammen med min veninde Sofie, og jeg [[er]] rigtig glad for at bo her.", "a": "0dcbc6ef1180725b", "dur": 4.8}, {"id": "m1-8", "who": "Kursist", "da": "Om formiddagen [[studerer]] jeg på universitetet, og to gange om ugen [[går]] jeg til badminton.", "a": "23c32a2c224e6b7b", "dur": 4.48}, {"id": "m1-9", "who": "Kursist", "da": "I går [[besøgte]] vi et stort supermarked og [[lavede]] dejlig mad sammen.", "a": "56587a17bc8f6dbb", "dur": 3.96}, {"id": "m1-10", "who": "Kursist", "da": "Næste måned [[skal]] jeg tage modulprøven, og bagefter [[vil]] jeg gerne rejse rundt i Jylland!", "a": "d381cd55a89f269a", "dur": 4.68}], "zh_all": "六个月前，我从中国来到丹麦。一开始有点困难，因为对我来说一切都是陌生的。当丹麦人说话很快时，我听不懂他们。因此，我在奥胡斯的一所语言学校开始学习。每个周二和周四我都骑车去上课，周末则在家里练习发音。\n现在我的丹麦语已经说得好多了！我和我的好朋友索菲合租在一套温馨的公寓里，我非常喜欢住在这里。上午我在大学读书，每周打两次羽毛球。昨天我们去了一家大超市，还一起做了美味的饭菜。下个月我要参加模块考试，考完以后我想去日德兰半岛各地旅游！"}]}, {"id": "text-del2", "type": "text", "kind": "dialog", "tab": "Del 2", "title": "Del 2：6 轮综合问答示范（第一册结业口试模拟）", "scene": null, "paras": [{"cue": "第 1 轮｜过去时间 Hvornår", "segs": [{"id": "del2-1q", "who": "Eksaminator", "da": "Hvornår kom du til Danmark, og hvorfor var det svært i begyndelsen?", "a": "4a0bd6a8f3fe8e3c", "dur": 3.88}]}, {"segs": [{"id": "del2-1a", "who": "Kursist", "da": "Jeg kom til Danmark for seks måneder siden. Det var lidt svært, fordi alt var nyt, og jeg ikke forstod danskerne.", "a": "8b34a0ac43bf769f", "dur": 8.08}]}, {"cue": "第 2 轮｜语言学习 Hvor & Hvilke dage", "segs": [{"id": "del2-2q", "who": "Eksaminator", "da": "Hvor gik du på sprogskole, og hvilke dage havde du undervisning?", "a": "b94061073eb2d11a", "dur": 3.8}]}, {"segs": [{"id": "del2-2a", "who": "Kursist", "da": "Jeg gik på sprogskole i Aarhus. Jeg havde undervisning hver tirsdag og torsdag, og jeg cyklede altid derhen.", "a": "f416663e56439055", "dur": 5.88}]}, {"cue": "第 3 轮｜居住与合租 Hvem", "segs": [{"id": "del2-3q", "who": "Eksaminator", "da": "Hvem bor du sammen med st rundt.", "a": "f78edb00171567fc", "dur": 5.64}]}, {"zh": "困难的，难的", "note": "形容词 · svært, svære", "segs": [{"id": "g12", "who": "narrator", "da": "svær", "say": "svær. svært, svære.", "a": "27def98937259b3d", "dur": 2.76}]}, {"zh": "快的（作副词 hurtigt 快速地）", "note": "形容词 · hurtigt, hurtige", "segs": [{"id": "g13", "who": "narrator", "da": "hurtig", "say": "hurtig. hurtigt, hurtige.", "a": "ac7a175699f509d9", "dur": 4.12}]}, {"zh": "下一个的（常零冠词：næste måned）", "note": "形容词 · næste, næste", "segs": [{"id": "g14", "who": "narrator", "da": "næste", "say": "næste. næste, næste.", "a": "8e568107f7be7944", "dur": 3.24}]}, {"zh": "已经", "note": "副词", "segs": [{"id": "g15", "who": "narrator", "da": "allerede", "a": "6234fdbc7cce1ce8", "dur": 1.12}]}, {"zh": "因此（放句首必倒装！）", "note": "副词", "segs": [{"id": "g16", "who": "narrator", "da": "derfor", "a": "b90c9fb2a94fc972", "dur": 1.04}]}, {"zh": "四处，周围（rejse rundt i...）", "note": "副词", "segs": [{"id": "g17", "who": "narrator", "da": "rundt", "a": "980f9246ae796b59", "dur": 0.92}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en begyndelse", "zh": "开始，起初（i begyndelsen 起初）", "forms": "begyndelsen, begyndelser, begyndelserne"}, {"pos": "名词", "da": "en udtale", "zh": "发音，读音", "forms": "udtalen, udtaler, udtalerne"}, {"pos": "名词", "da": "en modulprøve", "zh": "模块考试（DU3 升级考试）", "forms": "modulprøven, modulprøver, modulprøverne"}, {"pos": "名词", "da": "en måned", "zh": "月，月份", "forms": "måneden, måneder, månederne"}, {"pos": "名词", "da": "en veninde", "zh": "女性朋友，闺蜜", "forms": "veninden, veninder, veninderne"}, {"pos": "名词", "da": "en dansker", "zh": "丹麦人", "forms": "danskeren, danskere, danskerne"}, {"pos": "专名", "da": "Jylland", "zh": "日德兰半岛（奥胡斯所在地）", "forms": "intetkøn, ingen flertal"}, {"pos": "动词", "da": "at forstå", "zh": "理解，听懂（不规则变化）", "forms": "forstår, forstod, har forstået"}, {"pos": "动词", "da": "at øve (sig)", "zh": "练习，操练", "forms": "øver, øvede, har øvet"}, {"pos": "动词", "da": "a ": "⟦*På lørdags var jeg til fødselsdag.⟧ → {{_}}", "kind": "cloze", "blanks": [["I lørdags var jeg til fødselsdag"]], "explain": "刚过去的周六用 ⟦i lørdags⟧，即将到来的周六才用 ⟦på lørdag⟧！"}]}, {"id": "B", "type": "drill", "title": "练习 B：全套 hv- 疑问词总检阅——选词填空", "items": [{"prompt": "{{_}} kom du til Danmark? — For seks måneder siden.", "kind": "cloze", "blanks": [["Hvornår"]]}, {"prompt": "{{_}} begyndte du på sprogskole? — Fordi jeg ville lære dansk.", "kind": "cloze", "blanks": [["Hvorfor"]]}, {"prompt": "{{_}} bus tager du til universitetet? — Bus 2A.", "kind": "cloze", "blanks": [["Hvilken"]]}, {"prompt": "{{_}} hold går du på? — Modul 1, hold 3.", "kind": "cloze", "blanks": [["Hvilket"]]}, {"prompt": "{{_}} går du til badminton? — To gange om ugen.", "kind": "cloze", "blanks": [["Hvor tit"]]}, {"prompt": "{{_}} bor du sammen med? — Min veninde Sofie.", "kind": "cloze", "blanks": [["Hvem"]]}, {"prompt": "{{_}} kursister er der i din klasse? — Cirka femten.", "kind": "cloze", "blanks": [["Hvor mange"]], "explain": "可数复数 ⟦kursister⟧"}, {"prompt": "{{_}} kommer man til klubben? — Man kan cykle eller tage bussen.", "kind": "cloze", "blanks": [["Hvordan"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：毕业综合翻译（过去、现在、将来三时态串联）", "items": [{"prompt": "一年前我来到丹麦，一开始我听不懂丹麦人说话。", "kind": "write", "accept": ["For et år siden kom jeg til Danmark, og i begyndelsen forstod jeg ikke danskerne."]}, {"prompt": "因此我每周二和周四骑车去语言学校，并经常在家练习发音。", "kind": "write", "accept": ["Derfor cyklede jeg til sprogskole hver tirsdag og torsdag og øvede ofte udtale derhjemme."]}, {"prompt": "现在我住在一套大公寓里，也很喜欢在俱乐部打羽毛球。", "kind": "write", "accept": ["Nu bor jeg i en stor lejlighed, og jeg er også glad for at spille badminton i en klub."]}, {"prompt": "昨天我和朋友去了超市，买了一公斤苹果和两升牛奶。", "kind": "write", "accept": ["I går gik jeg i supermarkedet med min ven og købte et kilo æbler og to liter mælk."]}, {"prompt": "下周我要参加考试，之后我想去哥本哈根看望我的哥哥。", "kind": "write", "accept": ["Næste uge skal jeg tage en prøve, og bagefter vil jeg gerne besøge min bror i København."]}]}], "clips": {"for seks måneder siden kom jeg til danmark fra kina": "f0d085881bc5f126", "i begyndelsen var det lidt svært fordi alt var nyt for mig": "47fe6973962ea632", "jeg forstod ikke danskerne når de snakkede hurtigt": "b1f52aa9977c203c", "derfor begyndte jeg på sprogskole i aarhus": "2e6558944cf6f8f1", "hver tirsdag og torsdag cyklede jeg til undervisning og i weekenderne øvede jeg udtale derhjemme": "9641c0a6bdec025f", "nu taler jeg allerede meget bedre dansk": "53e4afcc904226a4", "jeg bor i en hyggelig lejlighed sammen med min veninde sofie og jeg er rigtig glad for at bo her": "0dcbc6ef1180725b", "om formiddagen studerer jeg på universitetet og to gange om ugen går jeg til badminton": "23c32a2c224e6b7b", "i går besøgte vi et stort supermarked og lavede dejlig mad sammen": "56587a17bc8f6dbb", "næste måned skal jeg tage modulprøven og bagefter vil jeg gerne rejse rundt i jylland": "d381cd55a89f269a", "hvornår kom du til danmark og hvorfor var det svært i begyndelsen": "4a0bd6a8f3fe8e3c", "jeg kom til danmark for seks måneder siden det var lidt svært fordi alt var nyt og jeg ikke forstod danskerne": "8b34a0ac43bf769f", "hvor gik du på sprogskole og hvilke dage havde du undervisning": "b94061073eb2d11a", "jeg gik på sprogskole i aarhus jeg havde undervisning hver tirsdag og torsdag og jeg cyklede altid derhen": "f416663e56439055", "hvem bor du sammen med nu og er du glad for din lejlighed": "7c76a2fffde2411b", "jeg bor i en hyggelig lejlighed sammen med min veninde sofie ja jeg er rigtig glad for at bo her": "e802f7e776441aac", "hvad laver du om formiddagen og hvor tit dyrker du motion": "c3420bd3b0f1405c", "om formiddagen studerer jeg på universitetet to gange om ugen går jeg til badminton for det er sundt og sjovt": "9ca707df1fdbbf14", "hvad lavede du og sofie i går": "381b3feff1750bb1", "i går besøgte vi et stort supermarked købte ind og lavede dejlig mad sammen derhjemme": "ef151460604ef7ce", "hvad skal du lave næste måned og har du planer efter prøven": "bf61a0bbeab6450e", "en begyndelse": "16ffabb107e3d285", "en udtale": "c1fd397692ff812f", "en modulprøve": "518a641e40588f7d", "en måned": "4b2341f729b85c2d", "en veninde": "8b03173900c66d68", "en dansker": "42ccd33bab4d32cc", "jylland": "22457c7588bb058e", "at forstå": "d43fb0bbe5ce4b8b", "at øve (sig)": "78b567efa62cd7ba", "at studere": "242b38bc3688795f", "at rejse rundt": "f78edb00171567fc", "svær": "27def98937259b3d", "hurtig": "ac7a175699f509d9", "næste": "8e568107f7be7944", "allerede": "6234fdbc7cce1ce8", "derfor": "b90c9fb2a94fc972", "rundt": "980f9246ae796b59"}, "key": "ncd1-L24"}, {"book": "ncd2", "lesson": 1, "title_da": "Et postkort fra Rom — og en e-mail hjem", "title_zh": "来自罗马的明信片——以及一封寄回家的邮件", "grammar": "现在完成时（Førnutid）助动词 har vs er · 现在完成时 vs 一般过去时（Datid）切换法则 · Modul 2 邮件写作四步模板", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Et postkort fra Rom（叙事短文 · 约 155 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Lukas og hans kæreste, Maja, [[er rejst]] til Rom på ferie.", "a": "79392057360be379", "dur": 3.48}, {"id": "a2", "who": "narrator", "da": "De [[har]] allerede [[været]] i Italien i fem dage, og de [[har oplevet]] utrolig meget.", "a": "8bcfab58f2de9f82", "dur": 4.28}], "zh": "卢卡斯和他的女友玛雅去罗马度假了。他们在意大利已经待了五天，经历了非常多精彩的事情。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Før de tog afsted, sagde Lukas altid, at postkort ødelægger en god ferie, fordi man bruger alt for meget tid på at skrive dem.", "a": "f09fc02f00af6ca9", "dur": 7.04}, {"id": "a4", "who": "narrator", "da": "Alligevel gik han ind i en lille butik den første dag og købte tyve smukke postkort.", "a": "8e6a413a443e432f", "dur": 5.16}], "zh": "出发之前，卢卡斯总是说，明信片会毁掉一个好假期，因为人会花太多时间去写它们。尽管如此，第一天他还是走进一家小店，买了二十张漂亮的明信片。"}, {"segs": [{"id": "a5", "who": "narrator", "da": "Hver formiddag [[har]] de [[besøgt]] berømte museer og gamle kirker.", "a": "b97674eeb83a693d", "dur": 3.36}, {"id": "a6", "who": "narrator", "da": "Om eftermiddagen [[har]] Lukas [[siddet]] på en hyggelig café i solen og [[drukket]] espresso.", "a": "fbb1e007cac50fcd", "dur": 4.88}, {"id": "a7", "who": "narrator", "da": "Han [[har lagt]] postkortene frem på bordet og [[har prøvet]] at skrive til sin familie og sine kolleger i Danmark.", "a": "12c901eb25194d9c", "dur": 4.84}, {"id": "a8", "who": "narrator", "da": "Men indtil nu [[har]] han ikke [[skrevet]] et eneste ord!", "a": "c4b2d16c2fa8afb2", "dur": 2.84}], "zh": "每天上午，他们都去参观了著名的博物馆和古老的教堂。每天下午，卢卡斯都坐在阳光下一家惬意的咖啡馆里喝意式浓缩咖啡。他把明信片摆在桌面上，试着给丹麦的家人和同事写点什么。可是直到现在，他一个字也还没写出来！"}, {"segs": [{"id": "a9", "who": "narrator", "da": "Maja [[har]] derimod allerede [[sendt]] mange billeder til sine venner på telefonen, og i går skrev hun en lang e-mail tilbage til sin ven Daniel.", "a": "0fad0afccb2cb3ef", "dur": 7.4}, {"id": "a10", "who": "narrator", "da": "I morgen flyver de hjem til København, og Lukas tager nok de tyve tomme postkort med hjem i kufferten.", "a": "6056e597a6bab770", "dur": 5.6}], "zh": "相反，玛雅已经在手机上给朋友们发了好多照片，而且昨天她还给好朋友丹尼尔回了一封长长的电子邮件。明天他们就要飞回哥本哈根了，卢卡斯大概会把那二十张空白的明信片装在行李箱里带回家。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：En e-mail fra Daniel — og Majas svar（对标 DU3 Modul 2 Skrivning Opgave 1）", "scene": null, "paras": [{"cue": "来信｜Fra: Daniel", "segs": [{"id": "b1", "who": "narrator", "da": "Hej Maja", "a": "261f4497d0647921", "dur": 1.04}, {"id": "b2", "who": "narrator", "da": "Jeg har hørt, at du er ude at rejse.", "nl": true, "a": "8fe70d48800d0181", "dur": 1.8}, {"id": "b3", "who": "narrator", "da": "Det lyder spændende!", "a": "b8f32e18f466a093", "dur": 1.28}, {"id": "b4", "who": "narrator", "da": "Hvor er du henne?", "a": "6ad6a8ad4c6b901a", "dur": 1.2}, {"id": "b5", "who": "narrator", "da": "Hvem rejser du sammen med?", "a": "256acc9485021126", "dur": 1.52}, {"id": "b6", "who": "narrator", "da": "Hvad laver I?", "a": "1e37dc9877eb7024", "dur": 1.12}, {"id": "b7", "who": "narrator", "da": "Og hvordan er vejret?", "a": "ddedb9eb87c879f4", "dur": 1.52}, {"id": "b8", "who": "narrator", "da": "Mange hilsner", "nl": true, "a": "54bef3a12cf1eb63", "dur": 1.2}, {"id": "b9", "who": "narrator", "da": "Daniel", "nl": true, "a": "70efc4b8b231be0c", "dur": 0.92}]}, {"cue": "高分回信范本（96 词）｜Til: Daniel Emne: Hilsen fra Rom", "segs": [{"id": "b10", "who": "narrator", "da": "Hej Daniel", "a": "f575aea1aca71d3a", "dur": 0.96}]}, {"segs": [{"id": "b11", "who": "narrator", "da": "Tak for din søde mail!", "a": "b97085c93f69d5eb", "dur": 1.88}, {"id": "b12", "who": "narrator", "da": "Ja, det er rigtigt, at jeg er ude at rejse.", "a": "9b6bf77302e0fd32", "dur": 2.64}, {"id": "b13", "who": "narrator", "da": "Jeg er i Rom sammen med min kæreste, Lukas.", "a": "792a60440a033955", "dur": 2.6}, {"id": "b14", "who": "narrator", "da": "Vi ankom i mandags, så vi [[har]] allerede [[været]] her i fem dage.", "a": "46714af7f834391f", "dur": 3.04}]}, {"segs": [{"id": "b15", "who": "narrator", "da": "Vi [[har set]] mange spændende museer og gamle kirker.", "a": "dc873adc081dfa90", "dur": 3.2}, {"id": "b16", "who": "narrator", "da": "I går gik vi en lang tur gennem byen, og om aftenen spiste vi god pizza på en lille restaurant.", "a": "c7ac9822762d7c62", "dur": 5.6}, {"id": "b17", "who": "narrator", "da": "Vejret [[har været]] fantastisk med masser af sol, selvom det blæste lidt den første dag.", "a": "925af04528b967b2", "dur": 5.16}]}, {"segs": [{"id": "b18", "who": "narrator", "da": "Hvordan går det derhjemme i København?", "a": "16a7d8f88f4a17ee", "dur": 2.2}, {"id": "b19", "who": "narrator", "da": "Jeg glæder mig til at se dig, når vi kommer hjem på søndag!", "a": "fc2ca5eb40b0a6c5", "dur": 2.88}]}, {"segs": [{"id": "b20", "who": "narrator", "da": "Kærlig hilsen", "a": "cb4d30c4f5968c22", "dur": 1.28}, {"id": "b21", "who": "narrator", "da": "Maja", "nl": true, "a": "f5a00c2695a6970d", "dur": 0.88}], "zh_all": "丹尼尔：嗨，玛雅！我听说你出门旅行了。听起来真棒！你在哪儿呢？你和谁一起旅行？你们在做什么？天气怎么样？祝好，丹尼尔。\n玛雅回信：嗨，丹尼尔！谢谢你亲切的邮件！是的，我确实在外面旅行。我和我男朋友卢卡斯在罗马。我们周一到的，所以已经在这儿待了五天了。我们看了很多有意思的博物馆和老教堂。昨天我们在城里散了很长一段步，晚上在一家小餐馆吃了美味的披萨。天气一直棒极了，阳光充足，虽然第一天有点刮风。哥本哈根家里那边怎么样？我真期待周日回家后见到你！亲切的问候，玛雅。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "旅行；出发前往", "note": "动词 · rejser, rejste, er rejst", "segs": [{"id": "g1", "who": "narrator", "da": "at rejse", "say": "at rejse. rejser, rejste, er rejst.", "a": "9ce5f85b6ce89985", "dur": 4.04}]}, {"zh": "到达，抵达", "note": "动词 · ankommer, ankom, er ankommet", "segs": [{"id": "g2", "who": "narrator", "da": "at ankomme", "say": "at ankomme. ankommer, ankom, er ankommet.", "a": "89050dffa893c7ba", "dur": 4.32}]}, {"zh": "出发，动身", "note": "动词 · tager, tog, er taget afsted", "segs": [{"id": "g3", "who": "narrator", "da": "at tage afsted", "say": "at tage afsted. tager, tog, er taget afsted.", "a": "c557e95a2a505008", "dur": 5.32}]}, {"zh": "飞，乘飞机", "note": "动词 · flyver, fløj, er fløjet", "segs": [{"id": "g4", "who": "narrator", "da": "at flyve", "say": "at flyve. flyver, fløj, er fløjet.", "a": "7907331e5cdd547f", "dur": 4.56}]}, {"zh": "走；去（见语法辨析）", "note": "动词 · går, gik, er gået / har gået", "segs": [{"id": "g5", "who": "narrator", "da": "at gå", "say": "at gå. går, gik, er gået eller har gået.", "a": "c4820ea4c0321a46", "dur": 5.28}]}, {"zh": "经历，体验", "note": "动词 [har] · oplever, oplevede, har oplevet", "segs": [{"id": "g6", "who": "narrator", "da": "at opleve", "say": "at opleve. oplever, oplevede, har oplevet.", "a": "c9071e22a8689fd1", "dur": 5.6}]}, {"zh": "参观；拜访", "note": "动词 [har] · besøger, besøgte, har besøgt", "segs": [{"id": "g7", "who": "narrator", "da": "at besøge", "say": "at besøge. besøger, besøgte, har besøgt.", "a": "75df316366b16f38", "dur": 4.2}]}, {"zh": "坐着（静态，必用 har）", "note": "动词 [har] · sidder, sad, har siddet", "segs": [{"id": "g8", "who": "narrator", "da": "at sidde", "say": "at sidde. sidder, sad, har siddet.", "a": "30bd179d80cd5cae", "dur": 4.32}]}, {"zh": "放，摆（动作使平放）", "note": "动词 [har] · lægger, lagde, har lagt", "segs": [{"id": "g9", "who": "narrator", "da": "at lægge", "say": "at lægge. lægger, lagde, har lagt.", "a": "b5ab4a8c871e755a", "dur": 4.36}]}, {"zh": "写", "note": "动词 [har] · skriver, skrev, har skrevet", "segs": [{"id": "g10", "who": "narrator", "da": "at skrive", "say": "at skrive. skriver, skrev, har skrevet.", "a": "85c2418ec792f3cf", "dur": 4.4}]}, {"zh": "发送；寄送", "note": "动词 [har] · sender, sendte, har sendt", "segs": [{"id": "g11", "who": "narrator", "da": "at sende", "say": "at sende. sender, sendte, har sendt.", "a": "0451fd2cb4603748", "dur": 4.68}]}, {"zh": "破坏，毁掉", "note": "动词 [har] · ødelægger, ødelagde, har ødelagt", "segs": [{"id": "g12", "who": "narrator", "da": "at ødelægge", "say": "at ødelægge. ødelægger, ødelagde, har ødelagt.", "a": "ed535a24331970b1", "dur": 5.08}]}, {"zh": "明信片", "note": "名词 · postkortet, postkort, postkortene", "segs": [{"id": "g13", "who": "narrator", "da": "et postkort", "say": "et postkort. postkortet, postkort, postkortene.", "a": "0493f7eaf4999d99", "dur": 4.92}]}, {"zh": "假期", "note": "名词 · ferien, ferier, ferierne", "segs": [{"id": "g14", "who": "narrator", "da": "en ferie", "say": "en ferie. ferien, ferier, ferierne.", "a": "d6aaf0a992cb93c4", "dur": 4.52}]}, {"zh": "教堂", "note": "名词 · kirken, kirker, kirkerne", "segs": [{"id": "g15", "who": "narrator", "da": "en kirke", "say": "en kirke. kirken, kirker, kirkerne.", "a": "ac6a10478d9b46c3", "dur": 5.72}]}, {"zh": "行李箱", "note": "名词 · kufferten, kufferter, kufferterne", "segs": [{"id": "g16", "who": "narrator", "da": "en kuffert", "say": "en kuffert. kufferten, kufferter, kufferterne.", "a": "747ac8213dc6412a", "dur": 4.88}]}, {"zh": "令人兴奋的", "note": "形容词", "segs": [{"id": "g17", "who": "narrator", "da": "spændende", "a": "442506e22ee293bd", "dur": 1.04}]}, {"zh": "极好的", "note": "形容词 · -, -e", "segs": [{"id": "g18", "who": "narrator", "da": "fantastisk", "say": "fantastisk.", "a": "ef5eb286800345ff", "dur": 1.72}]}, {"zh": "唯一的（et eneste ord）", "note": "形容词", "segs": [{"id": "g19", "who": "narrator", "da": "eneste", "a": "5dc441b1f90e9bc1", "dur": 1.12}]}, {"zh": "空的", "note": "形容词 · tomt, tomme", "segs": [{"id": "g20", "who": "narrator", "da": "tom", "say": "tom. tomt, tomme.", "a": "4d9b49f22b4e06a0", "dur": 3.04}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "动词 [er]", "da": "at rejse", "zh": "旅行；出发前往", "forms": "rejser, rejste, er rejst"}, {"pos": "动词 [er]", "da": "at ankomme", "zh": "到达，抵达", "forms": "ankommer, ankom, er ankommet"}, {"pos": "动词 [er]", "da": "at tage afsted", "zh": "出发，动身", "forms": "tager, tog, er taget afsted"}, {"pos": "动词 [er]", "da": "at flyve", "zh": "飞，乘飞机", "forms": "flyver, fløj, er fløjet"}, {"pos": "动词 [er]", "da": "at gå", "zh": "走；去（见语法辨析）", "forms": "går, gik, er gået / har gået"}, {"pos": "动词 [har]", "da": "at opleve", "zh": "经历，体验", "forms": "oplever, oplevede, har oplevet"}, {"pos": "动词 [har]", "da": "at besøge", "zh": "参观；拜访", "forms": "besøger, besøgte, har besøgt"}, {"pos": "动词 [har]", "da": "at sidde", "zh": "坐着（静态，必用 har）", "forms": "sidder, sad, har siddet"}, {"pos": "动词 [har]", "da": "at lægge", "zh": "放，摆（动作使平放）", "forms": "lægger, lagde, har lagt"}, {"pos": "动词 [har]", "da": "at skrive", "zh": "写", "forms": "skriver, skrev, har skrevet"}, {"pos": "动词 [har]", "da": "at sende", "zh": "发送；寄送", "forms": "sender, sendte, har sendt"}, {"pos": "动词 [har]", "da": "at ødelægge", "zh": "破坏，毁掉", "forms": "ødelægger, ødelagde, har ødelagt"}, {"pos": "名词", "da": "et postkort", "zh": "明信片", "forms": "postkortet, postkort, postkortene"}, {"pos": "名词", "da": "en ferie", "zh": "假期", "forms": "ferien, ferier, ferierne"}, {"pos": "名词", "da": "en kirke", "zh": "教堂", "forms": "kirken, kirker, kirkerne"}, {"pos": "名词", "da": "en kuffert", "zh": "行李箱", "forms": "kufferten, kufferter, kufferterne"}, {"pos": "形容词", "da": "spændende / fantastisk", "zh": "令人兴奋的 / 极好的", "forms": "spændende (不变) / fantastisk (-, -e"}, {"pos": "形容词", "da": "eneste / tom", "zh": "唯一的（et eneste ord）/ 空的", "forms": "eneste (不变) / tom (tomt, tomme"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "把时间状语提前到句首（注意 V2 倒装）：Vi ankom til Rom i mandags. → I mandags...", "answer": "I mandags ankom vi til Rom."}, {"zh": "把句子改为否定完成时（注意 ikke 的位置）：Han har skrevet postkortet. →", "answer": "Han har ikke skrevet postkortet."}, {"zh": "用 selvom 连接两句话（注意从句副词位置）：Vejret har været rigtig godt. Det blæste lidt i går. →", "answer": "Vejret har været rigtig godt, selvom det blæste lidt i går."}]}, {"id": "A", "type": "drill", "title": "练习 A：用 har 或 er + 括号内动词的正确过去分词填空", "items": [{"prompt": "Lukas og Maja {{_}} allerede {{_}} til Italien. (⟦at rejse⟧)", "kind": "cloze", "blanks": [["er"], ["rejst"]], "explain": "⟦rejse⟧ 表示位移 → ⟦er⟧"}, {"prompt": "De {{_}} {{_}} på mange museer i Rom. (⟦at være⟧)", "kind": "cloze", "blanks": [["har"], ["været"]], "explain": "⟦være⟧ 静态存在 → ⟦har⟧"}, {"prompt": "Lukas {{_}} endnu ikke {{_}} et eneste postkort. (⟦at skrive⟧)", "kind": "cloze", "blanks": [["har"], ["skrevet"]], "explain": "⟦ikke⟧ 放在助动词与分词之间"}, {"prompt": "Hvornår {{_}} I {{_}} hjem fra ferie? (⟦at komme⟧)", "kind": "cloze", "blanks": [["er"], ["kommet"]], "explain": "⟦komme⟧ 位移 → ⟦er⟧"}, {"prompt": "I eftermiddags {{_}} vi {{_}} kaffe i solen. (⟦at drikke⟧)", "kind": "cloze", "blanks": [["har"], ["drukket"]], "explain": "及物动作 → ⟦har⟧；注意 ⟦drikke → har drukket⟧"}, {"prompt": "Min søster {{_}} lige {{_}} til en ny lejlighed i Aarhus. (⟦at flytte⟧)", "kind": "cloze", "blanks": [["er"], ["flyttet"]], "explain": "搬家属于位置/状态改变 → ⟦er⟧"}, {"prompt": "Jeg {{_}} allerede {{_}} mange billeder til min familie. (⟦at sende⟧)", "kind": "cloze", "blanks": [["har"], ["sendt"]], "explain": "及物动作 → ⟦har⟧"}, {"prompt": "Det {{_}} {{_}} meget varmere i denne uge. (⟦at blive⟧)", "kind": "cloze", "blanks": [["er"], ["blevet"]], "explain": "状态变化动词 ⟦blive⟧ → ⟦er⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：现在完成时 vs 一般过去时实战选填", "items": [{"prompt": "Jeg {{_}} (⟦har boet / boede⟧) i Danmark i to år nu, og jeg er rigtig glad for det.", "kind": "cloze", "blanks": [["har boet"]], "explain": "⟦i to år nu⟧ 持续到现在"}, {"prompt": "Sidste sommer {{_}} (⟦har vi rejst / rejste vi⟧) til Frankrig med tog.", "kind": "cloze", "blanks": [["rejste vi"]], "explain": "⟦Sidste sommer⟧ 已结束，过去时 + 句首 V2 倒装"}, {"prompt": "I går {{_}} (⟦har det regnet / regnede det⟧) hele dagen, men i dag skinner solen.", "kind": "cloze", "blanks": [["regnede det"]], "explain": "⟦I går⟧ 已结束，过去时 + 倒装"}, {"prompt": "{{_}} du allerede {{_}} (⟦Har... læst / Læste⟧) Daniels nye e-mail?", "kind": "cloze", "blanks": [["Har"], ["læst"]], "explain": "⟦allerede⟧ 询问到现在为止的结果"}, {"prompt": "Da vi {{_}} (⟦er ankommet / ankom⟧) til hotellet i mandags, var vi meget trætte.", "kind": "cloze", "blanks": [["ankom"]], "explain": "⟦i mandags⟧ 具体过去时间点"}, {"prompt": "Lukas {{_}} (⟦har glemt / glemte⟧) at købe frimærker indtil nu.", "kind": "cloze", "blanks": [["har glemt"]], "explain": "⟦indtil nu⟧ 到目前为止"}]}, {"id": "C", "type": "drill", "title": "练习 C：句型改写（练熟 V2 倒装与从句语序）", "items": [{"prompt": "把时间状语提前到句首（注意 V2 倒装）：⟦Vi ankom til Rom i mandags.⟧ → ⟦I mandags...⟧", "kind": "write", "accept": ["I mandags ankom vi til Rom."], "explain": "主句 V2 倒装：⟦ankom⟧ 必须在第 2 位"}, {"prompt": "把句子改为否定完成时（注意 ⟦ikke⟧ 的位置）：⟦Han har skrevet postkortet.⟧ →", "kind": "write", "accept": ["Han har ikke skrevet postkortet."]}, {"prompt": "用 ⟦selvom⟧ 连接两句话（注意从句副词位置）：⟦Vejret har været rigtig godt. Det blæste lidt i går.⟧ →", "kind": "write", "accept": ["Vejret har været rigtig godt, selvom det blæste lidt i går."], "explain": "若 ⟦selvom⟧ 从句放句首，则主句倒装：⟦Selvom det blæste lidt i går, har vejret været rigtig godt.⟧"}]}], "clips": {"lukas og hans kæreste maja er rejst til rom på ferie": "79392057360be379", "de har allerede været i italien i fem dage og de har oplevet utrolig meget": "8bcfab58f2de9f82", "før de tog afsted sagde lukas altid at postkort ødelægger en god ferie fordi man bruger alt for meget tid på at skrive dem": "f09fc02f00af6ca9", "alligevel gik han ind i en lille butik den første dag og købte tyve smukke postkort": "8e6a413a443e432f", "hver formiddag har de besøgt berømte museer og gamle kirker": "b97674eeb83a693d", "om eftermiddagen har lukas siddet på en hyggelig café i solen og drukket espresso": "fbb1e007cac50fcd", "han har lagt postkortene frem på bordet og har prøvet at skrive til sin familie og sine kolleger i danmark": "12c901eb25194d9c", "men indtil nu har han ikke skrevet et eneste ord": "c4b2d16c2fa8afb2", "maja har derimod allerede sendt mange billeder til sine venner på telefonen og i går skrev hun en lang e-mail tilbage til sin ven daniel": "0fad0afccb2cb3ef", "i morgen flyver de hjem til københavn og lukas tager nok de tyve tomme postkort med hjem i kufferten": "6056e597a6bab770", "hej maja": "261f4497d0647921", "jeg har hørt at du er ude at rejse": "8fe70d48800d0181", "det lyder spændende": "b8f32e18f466a093", "hvor er du henne": "6ad6a8ad4c6b901a", "hvem rejser du sammen med": "256acc9485021126", "hvad laver i": "1e37dc9877eb7024", "og hvordan er vejret": "ddedb9eb87c879f4", "mange hilsner": "54bef3a12cf1eb63", "daniel": "70efc4b8b231be0c", "hej daniel": "f575aea1aca71d3a", "tak for din søde mail": "b97085c93f69d5eb", "ja det er rigtigt at jeg er ude at rejse": "9b6bf77302e0fd32", "jeg er i rom sammen med min kæreste lukas": "792a60440a033955", "vi ankom i mandags så vi har allerede været her i fem dage": "46714af7f834391f", "vi har set mange spændende museer og gamle kirker": "dc873adc081dfa90", "i går gik vi en lang tur gennem byen og om aftenen spiste vi god pizza på en lille restaurant": "c7ac9822762d7c62", "vejret har været fantastisk med masser af sol selvom det blæste lidt den første dag": "925af04528b967b2", "hvordan går det derhjemme i københavn": "16a7d8f88f4a17ee", "jeg glæder mig til at se dig når vi kommer hjem på søndag": "fc2ca5eb40b0a6c5", "kærlig hilsen": "cb4d30c4f5968c22", "maja": "f5a00c2695a6970d", "at rejse": "9ce5f85b6ce89985", "at ankomme": "89050dffa893c7ba", "at tage afsted": "c557e95a2a505008", "at flyve": "7907331e5cdd547f", "at gå": "c4820ea4c0321a46", "at opleve": "c9071e22a8689fd1", "at besøge": "75df316366b16f38", "at sidde": "30bd179d80cd5cae", "at lægge": "b5ab4a8c871e755a", "at skrive": "85c2418ec792f3cf", "at sende": "0451fd2cb4603748", "at ødelægge": "ed535a24331970b1", "et postkort": "0493f7eaf4999d99", "en ferie": "d6aaf0a992cb93c4", "en kirke": "ac6a10478d9b46c3", "en kuffert": "747ac8213dc6412a", "spændende": "442506e22ee293bd", "fantastisk": "ef5eb286800345ff", "eneste": "5dc441b1f90e9bc1", "tom": "4d9b49f22b4e06a0"}, "key": "ncd2-L01"}, {"book": "ncd2", "lesson": 2, "title_da": "En ny lille hund i familien", "title_zh": "家里新来的小狗", "grammar": "原因从句 fordi vs 并列连词 for · 从句核心语序（Ledsætningsordstilling：连词 + 主语 + ikke/altid/også/ofte + 变位动词） · 用 Fordi... 回答 Hvorfor...?", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：En ny lille hund i familien（叙事短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Lukas og Maja har lige fået en lille hvalp, som hedder Charlie.", "a": "a11256ce296c7fb2", "dur": 3.32}, {"id": "a2", "who": "narrator", "da": "Han er kun tre måneder gammel, men han fylder allerede hele lejligheden med energi.", "a": "c3d75f7515e4c78d", "dur": 4.36}], "zh": "卢卡斯和玛雅刚养了一只叫查理的小奶狗。它只有三个月大，但已经让整套公寓充满了活力。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "De ønskede sig længe en hund, [[fordi]] de **gerne ville** gå flere ture i skoven.", "a": "81f512aa3a80b5d9", "dur": 3.96}, {"id": "a4", "who": "narrator", "da": "I begyndelsen var alt roligt, [[for]] Charlie **sov altid** næsten hele formiddagen.", "a": "0975c45810e8ddbb", "dur": 4.16}, {"id": "a5", "who": "narrator", "da": "Men nu vågner han klokken fem hver morgen, [[fordi]] han **ikke vil** vente længere på sin morgenmad.", "a": "f35fa8bb93764d82", "dur": 4.36}], "zh": "他们一直很想养狗，因为他们很喜欢多去树林里散步。一开始家里一切都很安静，因为查理上午几乎总是在睡觉。但现在它每天早上五点就醒了，因为它不愿意再多等哪怕一会儿才吃早饭。"}, {"segs": [{"id": "a6", "who": "narrator", "da": "I går måtte Lukas købe nye løbesko, [[for]] Charlie **ødelagde også** hans gamle sko ude i gangen.", "a": "40677720dc931d3e", "dur": 5.28}, {"id": "a7", "who": "narrator", "da": "Når gæster spørger: ”Hvorfor står alle skoene oppe på bordet?”, svarer Maja med et smil: ”[[Fordi]] Charlie **altid bider** i dem!”", "a": "c992c118508b8f9b", "dur": 7.8}], "zh": "昨天卢卡斯不得不买新跑鞋，因为查理也把他的旧鞋在门厅里咬坏了。每当客人问：“为什么所有鞋子都摆在桌子上呀？”玛雅都会笑着回答：“因为查理总是去咬它们！”"}, {"segs": [{"id": "a8", "who": "narrator", "da": "Det er hårdt arbejde at have en hvalp, [[fordi]] man **ofte skal** tørre gulvet og rydde op.", "a": "41f342aa1dc2a35f", "dur": 4.24}, {"id": "a9", "who": "narrator", "da": "Alligevel fortryder de det aldrig, [[for]] den lille hund **er altid** så glad, når de kommer trætte hjem fra arbejde.", "a": "eb13ce72743f1ef6", "dur": 5.32}], "zh": "养小狗是一件辛苦的事，因为人经常得擦地板、收拾房间。尽管如此，他们从来没有后悔过，因为每当他们下班疲惫地回到家时，这只小狗总是那么开心。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：En e-mail fra Paul — og svaret om den nye hund（对标 DU3 Modul 2 Skrivning 3_2_skrive_A）", "scene": null, "paras": [{"cue": "来信｜Fra: Paul", "segs": [{"id": "b1", "who": "narrator", "da": "Hej", "a": "51d9c5359c868463", "dur": 0.88}, {"id": "b2", "who": "narrator", "da": "Jeg har hørt, at du har fået en lille hund.", "nl": true, "a": "0e5d4b052451212f", "dur": 2.04}, {"id": "b3", "who": "narrator", "da": "Det lyder hyggeligt.", "a": "6ec390e3fb48108b", "dur": 1.24}, {"id": "b4", "who": "narrator", "da": "Hvad er det for en hund?", "a": "444dce47bbe57368", "dur": 1.16}, {"id": "b5", "who": "narrator", "da": "Hvorfor ville du egentlig have en hund?", "a": "2ac61f1ddef78aa8", "dur": 1.68}, {"id": "b6", "who": "narrator", "da": "Kan du også fortælle lidt om, hvordan det er at have hund?", "a": "99e2ffd6efeb1f95", "dur": 2.28}, {"id": "b7", "who": "narrator", "da": "Og hvad med dit arbejde – kan hunden være alene hjemme?", "a": "e059a82ce98a411c", "dur": 3.6}, {"id": "b8", "who": "narrator", "da": "Mange hilsner", "nl": true, "a": "54bef3a12cf1eb63", "dur": 1.2}, {"id": "b9", "who": "narrator", "da": "Paul", "nl": true, "a": "d4f2096a328d78d0", "dur": 0.96}]}, {"cue": "高分回信范本（104 词）｜Til: Paul Emne: Hund", "segs": [{"id": "b10", "who": "narrator", "da": "Hej Paul", "a": "d6d9c843693a8350", "dur": 0.76}]}, {"segs": [{"id": "b11", "who": "narrator", "da": "Tak for din søde mail!", "a": "b97085c93f69d5eb", "dur": 1.88}, {"id": "b12", "who": "narrator", "da": "Ja, vi har lige fået en lille golden retriever på tre måneder, som hedder Charlie.", "a": "2bb07f00671a644d", "dur": 4.44}, {"id": "b13", "who": "narrator", "da": "Jeg ville rigtig gerne have en hund, [[fordi]] jeg **ofte sidder** foran computeren og **gerne vil** ud i naturen hver dag.", "a": "a51b1aa98290bc33", "dur": 5.12}]}, {"segs": [{"id": "b14", "who": "narrator", "da": "Det er dejligt at have hund, [[fordi]] han **altid gør** os glade, selvom det er hårdt at stå op klokken seks om morgenen.", "a": "68c69260e3bf4877", "dur": 5.36}, {"id": "b15", "who": "narrator", "da": "Heldigvis går det fint med mit arbejde, [[for]] jeg **arbejder ofte** hjemme, og min kæreste kommer tidligt hjem, så Charlie er aldrig alene i lang tid.", "a": "3aed1dac44a30177", "dur": 6.88}]}, {"segs": [{"id": "b16", "who": "narrator", "da": "Hvornår kommer du på besøg og hilser på ham?", "a": "659097ba5ec41c88", "dur": 2.24}]}, {"segs": [{"id": "b17", "who": "narrator", "da": "Mange hilsner", "a": "54bef3a12cf1eb63", "dur": 1.2}, {"id": "b18", "who": "narrator", "da": "Maja", "nl": true, "a": "f5a00c2695a6970d", "dur": 0.88}], "zh_all": "保罗来信：嗨！我听说你养了一只小狗。听起来真温馨。它是一只什么狗呀？你当初为什么想养狗呢？你还能讲讲养狗是什么感受吗？那你的工作怎么办——狗狗能独自待在家里吗？祝好，保罗。\n玛雅回信：嗨，保罗！谢谢你亲切的邮件！是的，我们刚养了一只三个月大的小金毛犬，名字叫查理。我当时特别想养一条狗，因为我经常坐在电脑前，而且很想每天去大自然里走走。养狗非常美好，因为他总是让我们开心，虽然早上六点起床很辛苦。好在我的工作这边完全没问题，因为我经常在家办公，而且我男朋友回家也早，所以查理从来不会独自待太久。你什么时候来家里做客并认识一下他呢？祝好，玛雅。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "因为（后接从句语序）", "note": "连词 · 从属连词，引导原因从句", "segs": [{"id": "g1", "who": "narrator", "da": "fordi", "say": "fordi.", "a": "cd2c25ef0a25df82", "dur": 0.76}]}, {"zh": "因为（后接主句语序）", "note": "连词 · 并列连词，引导独立分句", "segs": [{"id": "g2", "who": "narrator", "da": "for", "say": "for.", "a": "3bb451a6a7bd6bed", "dur": 0.72}]}, {"zh": "得到；养（宠物）；收到", "note": "动词 · får, fik, har fået", "segs": [{"id": "g3", "who": "narrator", "da": "at få", "say": "at få. får, fik, har fået.", "a": "28401cd3fbb71859", "dur": 4.16}]}, {"zh": "想要，渴望得到", "note": "动词 · ønsker, ønskede, har ønsket sig", "segs": [{"id": "g4", "who": "narrator", "da": "at ønske sig", "say": "at ønske sig. ønsker, ønskede, har ønsket sig.", "a": "a8f1b82074c33137", "dur": 5.2}]}, {"zh": "醒来，苏醒", "note": "动词 · vågner, vågnede, er vågnet", "segs": [{"id": "g5", "who": "narrator", "da": "at vågne", "say": "at vågne. vågner, vågnede, er vågnet.", "a": "928384abf8f744c0", "dur": 5.2}]}, {"zh": "等待（vente på 等候……）", "note": "动词 · venter, ventede, har ventet", "segs": [{"id": "g6", "who": "narrator", "da": "at vente", "say": "at vente. venter, ventede, har ventet.", "a": "c9f6dbad755a8f28", "dur": 4.84}]}, {"zh": "咬，啃（bide i 咬……）", "note": "动词 · bider, bed, har bidt", "segs": [{"id": "g7", "who": "narrator", "da": "at bide", "say": "at bide. bider, bed, har bidt.", "a": "3b19271e9930e457", "dur": 4.48}]}, {"zh": "擦干，擦拭", "note": "动词 · tørrer, tørrede, har tørret", "segs": [{"id": "g8", "who": "narrator", "da": "at tørre", "say": "at tørre. tørrer, tørrede, har tørret.", "a": "937863b42d998d52", "dur": 5.0}]}, {"zh": "后悔，感到遗憾", "note": "动词 · fortryder, fortrød, har fortrudt", "segs": [{"id": "g9", "who": "narrator", "da": "at fortryde", "say": "at fortryde. fortryder, fortrød, har fortrudt.", "a": "139f202f54e80b51", "dur": 5.28}]}, {"zh"
