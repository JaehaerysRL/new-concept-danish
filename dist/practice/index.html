⟦I weekenden arbejder Freja på kontoret.⟧ (⟦aldrig⟧) →", "kind": "write", "accept": ["I weekenden arbejder Freja aldrig på kontoret."], "explain": "XVS 倒装：紧跟主语 ⟦Freja⟧ 后"}], "example": "Jeg spiser morgenmad. (aldrig) → Jeg spiser aldrig morgenmad."}, {"id": "B", "type": "drill", "title": "练习 B：填入正确的反身代词（mig, dig, sig, os, jer），并注意 5–6 题中心状语位置", "items": [{"prompt": "Jeg vasker {{_}} i badeværelset klokken syv.", "kind": "cloze", "blanks": [["mig"]]}, {"prompt": "Lukas og Peter skynder {{_}} til bussen.", "kind": "cloze", "blanks": [["sig"]], "explain": "第三人称复数也用 ⟦sig⟧"}, {"prompt": "Har I travlt? Så skal I klæde {{_}} hurtigt på!", "kind": "cloze", "blanks": [["jer"]]}, {"prompt": "Freja klæder {{_}} altid på, før hun spiser morgenmad.", "kind": "cloze", "blanks": [["sig"]]}, {"prompt": "改错（插队规则）：*⟦Jeg skynder altid mig om mandagen.⟧ →", "kind": "write", "accept": ["Jeg skynder mig altid om mandagen."], "explain": "轻读反身代词 ⟦mig⟧ 在中心状语 ⟦altid⟧ 之前"}, {"prompt": "改错（插队规则）：*⟦Han vasker ikke sig om morgenen.⟧ →", "kind": "write", "accept": ["Han vasker sig ikke om morgenen."], "explain": "轻读反身代词 ⟦sig⟧ 在 ⟦ikke⟧ 之前"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "我每天早上总是八点半到公司。", "kind": "write", "accept": ["Jeg møder altid på arbejde klokken halv ni om morgenen."]}, {"prompt": "周一早上我从不喝茶，我只喝咖啡。", "kind": "write", "accept": ["Mandag morgen drikker jeg aldrig te; jeg drikker kun kaffe."]}, {"prompt": "你经常骑车去语言学校吗？（注意 ⟦tit⟧ 的位置）", "kind": "write", "accept": ["Cykler du tit til sprogskolen?"]}, {"prompt": "每天早上安娜洗漱并马上穿好衣服。（用 ⟦Om morgenen⟧ 开头）", "kind": "write", "accept": ["Om morgenen vasker Anna sig og klæder sig på med det samme."]}, {"prompt": "抓紧时间！你难道今天早上不也赶时间吗？（用 ⟦ikke også⟧ 提问）", "kind": "write", "accept": ["Skynd dig! Har du ikke også travlt her til morgen?"]}]}], "clips": {"lukas vågn op klokken er allerede syv og du ligger stadig i sengen": "f59e48b67d6c1f7a", "åh nej jeg glemmer altid at tjekke uret om mandagen har jeg kun femten minutter": "d14c1587dc288119", "ja du skal skynde dig jeg vasker mig hurtigt i badeværelset nu": "e9c56ff02d1b6f8c", "okay jeg klæder mig på med det samme men jeg spiser aldrig morgenmad uden kaffe": "6a084efcc9d21598", "du har ikke tid til kaffe i dag om mandagen kommer bussen ofte for tidligt": "58dd81ea91a33816", "hvor er mine nøgler jeg mister altid mine nøgler om morgenen": "6cd5f33967ab96f6", "de ligger på bordet ved døren glemmer du ikke også din telefon": "68c3ee0c6ae6a89c", "jo tak men hvor er min cykelhjelm tager du tit min hjelm": "11a0d8882d9e2052", "nej jeg tager aldrig din hjelm den hænger lige ved døren skynd dig nu": "09744aae6ff250ad", "ja nu ser jeg den min nabo peter skynder sig også ned ad trappen — vent på mig": "00efaee6cef7bf02", "altid": "78878561ea0da60e", "aldrig": "c9320f699a2409f5", "tit": "a7342352df93c013", "ofte": "890b3558c671eb11", "kun": "88ee3f02c1c2c182", "stadig": "1f136d91bc481a7d", "sig": "e1319ccae61541f6", "at skynde sig": "14c8f66119e7d847", "at vaske sig": "62d9a3b41369b410", "at klæde sig på": "1c2260f9f2f65c4d", "at vågne": "928384abf8f744c0", "at glemme": "125b71548c7d69f3", "at miste": "de9bf510c04ac52d", "at vente": "c9f6dbad755a8f28", "et ur": "70b3abb7686a759a", "et badeværelse": "7f080e3cd16fbe79", "en morgenmad": "78a4ac02e2694a29", "en nøgle": "4d3279c809f68be2", "en cykelhjelm": "b12793abad43e91a", "travl": "610d1fc8b6e00b24", "hurtig": "86f47d35e32abc06"}, "key": "ncd1-L06"}, {"book": "ncd1", "lesson": 7, "title_da": "Cykel eller metro til arbejde?", "title_zh": "骑车还是坐地铁去上班？", "grammar": "五大情态动词（kan, skal, vil, må, bør + 不带 at 的动词原形）与中心状语夹心位置 · 交通方式固定介词搭配（med bus/tog/metro, på cykel, i bil, til fods）", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "工作日清晨，窗外下着大雨还刮着风。Emma 和同事兼合租邻居 Jonas 站在玄关窗边，商量今天改用哪种交通方式去上班。", "paras": [{"zh": "艾玛，看看窗外！雨下得好大，而且还在刮风。今天我们没法骑车去上班了。", "note": "vinduet ˈvenduːˀəð（词尾 -et 读 əð）；regner ˈʁɑɪ̯nɐ（eg 读 ɑɪ̯）；kraftigt ˈkʰʁafdi（g 和 t 不发音）；kan ikke 在快速口语里常缩读为 kʰa eg（kan 吞掉 n）。", "segs": [{"id": "dialog-1", "who": "Jonas", "da": "Se ud ad vinduet, Emma! Det regner kraftigt, og vinden blæser. Vi kan ikke tage på arbejde på cykel i dag.", "a": "fd6aac95ab2acd3e", "dur": 5.8}]}, {"zh": "哎呀，要不然我其实最想骑车，因为那样能锻炼身体。不过你说得对——我们还是坐公共交通吧。", "note": "cykle ˈsyɡlə（c 读 s，y 圆唇）；motion moˈɕoːˀn（-ti- 读 ɕ）；offentlig ˈʌfənli（t 和 g 均不发音！）。", "segs": [{"id": "dialog-2", "who": "Emma", "da": "Øv, jeg vil ellers helst cykle, for så får jeg motion. Men du har ret — vi må hellere tage offentlig transport.", "a": "450d83713d8a52f8", "dur": 7.0}]}, {"zh": "咱们坐地铁去，还是你更想坐公交或者火车？", "note": "skal vi 在句中常弱读为 sga vi（l 脱落）；metro ˈmeːtʁo（重音在第一音节）；tog ˈtʰɔʊ̯ˀ（g 滑化成 ʊ̯）。", "segs": [{"id": "dialog-3", "who": "Jonas", "da": "Skal vi køre med metro, eller vil du hellere med bus eller tog?", "a": "c28d90ed6a6a74f6", "dur": 3.48}]}, {"zh": "高峰期咱们不应该坐公交车，因为它经常堵在路上。", "note": "bør ˈbɶɐ̯（短促圆唇，带微卷收尾）；myldretiden ˈmylʁəˌtʰiːðˀən（d in myldre 静音）；trafikken tʰʁaˈfiɡən（重音在第二音节）。", "segs": [{"id": "dialog-4", "who": "Emma", "da": "Vi bør ikke tage bussen i myldretiden, for den sidder ofte fast i trafikken.", "a": "5e0d8856ebc427f8", "dur": 4.36}]}, {"zh": "同意！那咱们坐地铁！地铁开得快，而且途中不用换乘。", "note": "enig ˈeːni（词尾 g 静音！）；metroen ˈmeːtʁoən；skifte ˈsgifdə；undervejs ʌnɐˈvɑɪ̯ˀs（d 不发音）。", "segs": [{"id": "dialog-5", "who": "Jonas", "da": "Enig! Så tager vi metroen! Den kører hurtigt, og vi skal ikke skifte undervejs.", "a": "313fe21909760a4c", "dur": 4.6}]}, {"zh": "到地铁站有多远？我们步行十分钟能走到吗？", "note": "langt ˈlaŋˀd；til fods tʰel ˈfoːˀs（d 不发音，带喉塞音 ˀ）。", "segs": [{"id": "dialog-6", "who": "Emma", "da": "Hvor langt er der til metrostationen? Kan vi gå til fods på ti minutter?", "a": "1166ff01f1880d27", "dur": 4.8}]}, {"zh": "可以，打把伞完全能走过去。只需要八分钟。", "note": "kan godt kʰa ˈɡʌd（注意 kan 弱读，重音放在 godt 上，godt 读 ɡʌd 表示“完全可以”）；paraply pʰɑʁɑˈpʰlyːˀ（重音在最后）。", "segs": [{"id": "dialog-7", "who": "Jonas", "da": "Ja, vi kan godt gå til fods med en paraply. Det tager kun otte minutter.", "a": "dd84955f8eec7dca", "dur": 3.52}]}, {"zh": "我邻居萨拉呢？她总是开车去上班，但市中心那边不准免费停车呀。", "note": "i bil i ˈbiːˀl；må ikke mɔ ˈeɡə；parkere pʰɑˈkʰeːˀɐ；gratis ˈɡʁæːtis（重音在第一音节）。", "segs": [{"id": "dialog-8", "who": "Emma", "da": "Hvad med min nabo Sara? Hun kører altid i bil til arbejde, men man må ikke parkere gratis derinde.", "a": "f997af8d44900b78", "dur": 5.68}]}, {"zh": "没错！所以天气不好的时候，应该有更多人坐火车或地铁。好了，咱们现在真的得走了！", "note": "derfor ˈdɛɐ̯ˌfɒ（注意重音在第一音节，触发 V2 倒装）；vejret ˈvɛɐ̯ˀð（j 融于元音中，尾音软 ð）；altså ˈalˀsɔ（t 不发音）。", "segs": [{"id": "dialog-9", "who": "Jonas", "da": "Præcis! Derfor bør flere tage toget eller metroen, når vejret er dårligt. Nu må vi altså gå!", "a": "ba8c80bbe26dc776", "dur": 6.16}]}, {"zh": "好，穿上你的外套，咱们跑着去车站吧！", "note": "tag... på ˈtʰæː... ˈpʰɔːˀ（祈使句中 tag 常丢掉 g）；jakke ˈjaɡə；løber ˈløːˀbɐ。", "segs": [{"id": "dialog-10", "who": "Emma", "da": "Ja, tag din jakke på, så løber vi ned til stationen!", "a": "fe92b42960ab60dd", "dur": 3.2}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "能，会，可以（能力/可能）", "note": "情态动词 · kan, kunne, har kunnet", "segs": [{"id": "g1", "who": "narrator", "da": "at kunne", "say": "at kunne.", "a": "651b39b00f699277", "dur": 0.92}]}, {"zh": "必须；打算，将要", "note": "情态动词 · skal, skulle, har skullet", "segs": [{"id": "g2", "who": "narrator", "da": "at skulle", "say": "at skulle. skal, skulle, har skullet.", "a": "b059314ec0b0429b", "dur": 4.04}]}, {"zh": "想要，愿意", "note": "情态动词 · vil, ville, har villet", "segs": [{"id": "g3", "who": "narrator", "da": "at ville", "say": "at ville. vil, ville, har villet.", "a": "e6b0b70f584a87bb", "dur": 3.84}]}, {"zh": "可以（允许）；必须（må ikke 禁止）", "note": "情态动词 · må, måtte, har måttet", "segs": [{"id": "g4", "who": "narrator", "da": "at måtte", "say": "at måtte. må, måtte, har måttet.", "a": "b25fee4dd4dfce53", "dur": 4.08}]}, {"zh": "应该，应当（客观建议）", "note": "情态动词 · bør, burde, har burdet", "segs": [{"id": "g5", "who": "narrator", "da": "at burde", "say": "at burde. bør, burde, har burdet.", "a": "67fac74ac4097c11", "dur": 3.8}]}, {"zh": "下雨（Det regner.）", "note": "动词 · regner, regnede, har regnet", "segs": [{"id": "g6", "who": "narrator", "da": "at regne", "say": "at regne. regner, regnede, har regnet.", "a": "d0c0089c8336e35e", "dur": 4.48}]}, {"zh": "刮风（Det blæser.）", "note": "动词 · blæser, blæste, har blæst", "segs": [{"id": "g7", "who": "narrator", "da": "at blæse", "say": "at blæse. blæser, blæste, har blæst.", "a": "1218ebcfda50e81d", "dur": 4.76}]}, {"zh": "骑自行车（到某地用 er）", "note": "动词 · cykler, cyklede, er cyklet / har cyklet", "segs": [{"id": "g8", "who": "narrator", "da": "at cykle", "say": "at cykle. cykler, cyklede, er cyklet eller har cyklet.", "a": "d90ae8ce8bd48a17", "dur": 6.08}]}, {"zh": "换乘；更换", "note": "动词 · skifter, skiftede, har skiftet", "segs": [{"id": "g9", "who": "narrator", "da": "at skifte", "say": "at skifte. skifter, skiftede, har skiftet.", "a": "b646344fdde1c9b7", "dur": 5.24}]}, {"zh": "停车，泊车", "note": "动词 · parkerer, parkerede, har parkeret", "segs": [{"id": "g10", "who": "narrator", "da": "at parkere", "say": "at parkere. parkerer, parkerede, har parkeret.", "a": "81f55543938363ec", "dur": 5.32}]}, {"zh": "自行车（变形时省去 -e-）", "note": "名词 · cyklen, cykler, cyklerne", "segs": [{"id": "g11", "who": "narrator", "da": "en cykel", "say": "en cykel. cyklen, cykler, cyklerne.", "a": "5b6218e7d4c16408", "dur": 4.96}]}, {"zh": "地铁", "note": "名词 · metroen, metroer, metroerne", "segs": [{"id": "g12", "who": "narrator", "da": "en metro", "say": "en metro. metroen, metroer, metroerne.", "a": "150623f121816ad9", "dur": 5.0}]}, {"zh": "汽车，私家车", "note": "名词 · bilen, biler, bilerne", "segs": [{"id": "g13", "who": "narrator", "da": "en bil", "say": "en bil. bilen, biler, bilerne.", "a": "bddf464c01553738", "dur": 5.64}]}, {"zh": "天气", "note": "名词 · vejret, 不可数", "segs": [{"id": "g14", "who": "narrator", "da": "et vejr", "say": "et vejr.", "a": "4f56b867420c1a44", "dur": 1.56}]}, {"zh": "交通高峰期", "note": "名词 · myldretiden, 不可数", "segs": [{"id": "g15", "who": "narrator", "da": "en myldretid", "say": "en myldretid.", "a": "795272b914f3cc11", "dur": 1.4}]}, {"zh": "雨伞", "note": "名词 · paraplyen, paraplyer, paraplyerne", "segs": [{"id": "g16", "who": "narrator", "da": "en paraply", "say": "en paraply. paraplyen, paraplyer, paraplyerne.", "a": "c788ec93d58084cd", "dur": 5.84}]}, {"zh": "窗户", "note": "名词 · vinduet, vinduer, vinduerne", "segs": [{"id": "g17", "who": "narrator", "da": "et vindue", "say": "et vindue. vinduet, vinduer, vinduerne.", "a": "4476e39a7272b9d2", "dur": 4.8}]}, {"zh": "运动，身体锻炼", "note": "名词 · motionen, 不可数", "segs": [{"id": "g18", "who": "narrator", "da": "en motion", "say": "en motion.", "a": "1ae7e7918d2b971d", "dur": 1.4}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "情态动词", "da": "at kunne", "zh": "能，会，可以（能力/可能）", "forms": "kan, kunne, har kunnet"}, {"pos": "情态动词", "da": "at skulle", "zh": "必须；打算，将要", "forms": "skal, skulle, har skullet"}, {"pos": "情态动词", "da": "at ville", "zh": "想要，愿意", "forms": "vil, ville, har villet"}, {"pos": "情态动词", "da": "at måtte", "zh": "可以（允许）；必须（må ikke 禁止）", "forms": "må, måtte, har måttet"}, {"pos": "情态动词", "da": "at burde", "zh": "应该，应当（客观建议）", "forms": "bør, burde, har burdet"}, {"pos": "动词", "da": "at regne", "zh": "下雨（Det regner.）", "forms": "regner, regnede, har regnet"}, {"pos": "动词", "da": "at blæse", "zh": "刮风（Det blæser.）", "forms": "blæser, blæste, har blæst"}, {"pos": "动词 [er]", "da": "at cykle", "zh": "骑自行车（到某地用 er）", "forms": "cykler, cyklede, er cyklet / har cyklet"}, {"pos": "动词", "da": "at skifte", "zh": "换乘；更换", "forms": "skifter, skiftede, har skiftet"}, {"pos": "动词", "da": "at parkere", "zh": "停车，泊车", "forms": "parkerer, parkerede, har parkeret"}, {"pos": "名词", "da": "en cykel", "zh": "自行车（变形时省去 -e-）", "forms": "cyklen, cykler, cyklerne"}, {"pos": "名词", "da": "en metro", "zh": "地铁", "forms": "metroen, metroer, metroerne"}, {"pos": "名词", "da": "en bil", "zh": "汽车，私家车", "forms": "bilen, biler, bilerne"}, {"pos": "名词", "da": "et vejr", "zh": "天气", "forms": "vejret, 不可数"}, {"pos": "名词", "da": "en myldretid", "zh": "交通高峰期", "forms": "myldretiden, 不可数"}, {"pos": "名词", "da": "en paraply", "zh": "雨伞", "forms": "paraplyen, paraplyer, paraplyerne"}, {"pos": "名词", "da": "et vindue", "zh": "窗户", "forms": "vinduet, vinduer, vinduerne"}, {"pos": "名词", "da": "en motion", "zh": "运动，身体锻炼", "forms": "motionen, 不可数"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "今天我们不能骑自行车去上班。（用 I dag 开头触发倒装）", "answer": "I dag kan vi ikke tage på arbejde på cykel."}, {"zh": "坐地铁我们不用换乘。（用 skal ikke）", "answer": "Med metroen skal vi ikke skifte."}, {"zh": "高峰期大家不应该开车去市中心。", "answer": "I myldretiden bør man ikke køre i bil til centrum."}, {"zh": "你更想坐火车还是坐地铁？", "answer": "Vil du hellere køre med tog eller med metro?"}, {"zh": "在这里不准免费停车，所以很多人坐公交车。", "answer": "Man må ikke parkere gratis her, så mange tager bussen."}]}, {"id": "A", "type": "drill", "title": "练习 A：用正确的情态动词（kan, skal, vil, må, bør）与括号内动词的正确形式填空", "items": [{"prompt": "Man {{_}} ikke {{_}} (⟦at parkere⟧) her — det er forbudt!（禁止）", "kind": "cloze", "blanks": [["må"], ["parkere"]], "explain": "表示“不准/禁止”，必须用 ⟦må ikke⟧，且后接原形不加 ⟦at⟧"}, {"prompt": "Vejret er dårligt, så vi {{_}} hellere {{_}} (⟦at tage⟧) metroen.（建议/最好）", "kind": "cloze", "blanks": [["bør", "må"], ["tage"]], "explain": "接 ⟦hellere⟧ 时两词都地道，常说 ⟦må hellere tage⟧ 或 ⟦bør tage⟧"}, {"prompt": "Jeg {{_}} godt {{_}} (⟦at tale⟧) lidt dansk nu.（能力）", "kind": "cloze", "blanks": [["kan"], ["tale"]]}, {"prompt": "{{_}} du {{_}} (⟦at køre⟧) med bus eller gå til fods?（意愿）", "kind": "cloze", "blanks": [["Vil"], ["køre"]], "explain": "问对方个人偏好与意愿用 ⟦Vil du...?⟧"}, {"prompt": "Om mandagen {{_}} Emma {{_}} (⟦at møde⟧) klokken halv ni.（计划/义务）", "kind": "cloze", "blanks": [["skal"], ["møde"]]}]}, {"id": "B", "type": "drill", "title": "练习 B：交通介词与冠词实战选填（med, på, i, til 或判断是否加 -en/-et）", "items": [{"prompt": "Om sommeren tager jeg næsten altid på arbejde {{_}} cykel.", "kind": "cloze", "blanks": [["på"]], "explain": "⟦på cykel⟧ 骑车"}, {"prompt": "Min bror bor langt væk, så han kører altid {{_}} bil.", "kind": "cloze", "blanks": [["i"]], "explain": "⟦i bil⟧ 坐/开汽车"}, {"prompt": "Når det regner, tager jeg {{_}} (⟦tog / toget⟧) i stedet for at cykle.", "kind": "cloze", "blanks": [["toget"]], "explain": "动词 ⟦tage⟧ 直接带具体交通工具时要加定冠词后缀！"}, {"prompt": "Kører du {{_}} metro eller {{_}} bus til sprogskolen?", "kind": "cloze", "blanks": [["med"], ["med"]], "explain": "介词 ⟦med⟧ 后接零冠词公共交通"}, {"prompt": "Metrostationen ligger lige her, så vi kan gå {{_}} fods.", "kind": "cloze", "blanks": [["til"]], "explain": "⟦til fods⟧ 步行"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战（注意 V2 倒装、情态动词与 ikke 位置）", "items": [{"prompt": "今天我们不能骑自行车去上班。（用 ⟦I dag⟧ 开头触发倒装）", "kind": "write", "accept": ["I dag kan vi ikke tage på arbejde på cykel."], "explain": "⟦I dag⟧ 放句首引发 V2 倒装，⟦ikke⟧ 夹在 ⟦vi⟧ 和 ⟦tage⟧ 之间"}, {"prompt": "坐地铁我们不用换乘。（用 ⟦skal ikke⟧）", "kind": "write", "accept": ["Med metroen skal vi ikke skifte.", "Vi skal ikke skifte med metroen."]}, {"prompt": "高峰期大家不应该开车去市中心。", "kind": "write", "accept": ["I myldretiden bør man ikke køre i bil til centrum."]}, {"prompt": "你更想坐火车还是坐地铁？", "kind": "write", "accept": ["Vil du hellere køre med tog eller med metro?"]}, {"prompt": "在这里不准免费停车，所以很多人坐公交车。", "kind": "write", "accept": ["Man må ikke parkere gratis her, så mange tager bussen."]}]}], "clips": {"se ud ad vinduet emma det regner kraftigt og vinden blæser vi kan ikke tage på arbejde på cykel i dag": "fd6aac95ab2acd3e", "øv jeg vil ellers helst cykle for så får jeg motion men du har ret — vi må hellere tage offentlig transport": "450d83713d8a52f8", "skal vi køre med metro eller vil du hellere med bus eller tog": "c28d90ed6a6a74f6", "vi bør ikke tage bussen i myldretiden for den sidder ofte fast i trafikken": "5e0d8856ebc427f8", "enig så tager vi metroen den kører hurtigt og vi skal ikke skifte undervejs": "313fe21909760a4c", "hvor langt er der til metrostationen kan vi gå til fods på ti minutter": "1166ff01f1880d27", "ja vi kan godt gå til fods med en paraply det tager kun otte minutter": "dd84955f8eec7dca", "hvad med min nabo sara hun kører altid i bil til arbejde men man må ikke parkere gratis derinde": "f997af8d44900b78", "præcis derfor bør flere tage toget eller metroen når vejret er dårligt nu må vi altså gå": "ba8c80bbe26dc776", "ja tag din jakke på så løber vi ned til stationen": "fe92b42960ab60dd", "at kunne": "651b39b00f699277", "at skulle": "b059314ec0b0429b", "at ville": "e6b0b70f584a87bb", "at måtte": "b25fee4dd4dfce53", "at burde": "67fac74ac4097c11", "at regne": "d0c0089c8336e35e", "at blæse": "1218ebcfda50e81d", "at cykle": "d90ae8ce8bd48a17", "at skifte": "b646344fdde1c9b7", "at parkere": "81f55543938363ec", "en cykel": "5b6218e7d4c16408", "en metro": "150623f121816ad9", "en bil": "bddf464c01553738", "et vejr": "4f56b867420c1a44", "en myldretid": "795272b914f3cc11", "en paraply": "c788ec93d58084cd", "et vindue": "4476e39a7272b9d2", "en motion": "1ae7e7918d2b971d"}, "key": "ncd1-L07"}, {"book": "ncd1", "lesson": 8, "title_da": "Fra morgen til aften", "title_zh": "从早到晚的一天 [独白]", "grammar": "顺序连接词（først, derefter, bagefter, så, til sidst）引导的连续主句 V2 倒装 · 日常作息核心短语动词（vågne, stå op, spise morgenmad, møde på arbejde, holde pause, få fri, gå i seng）", "sections": [{"id": "text-del1", "type": "text", "kind": "prose", "tab": "Del 1", "title": "Del 1：第一人称连贯独白（95 词 · 作息描述标准母版）", "scene": null, "paras": [{"segs": [{"id": "m1-1", "who": "Kursist", "da": "**På en almindelig hverdag** [[vågner jeg]] klokken halv syv. **Først** [[står jeg]] op, vasker mig og klæder mig på. **Derefter** [[spiser jeg]] morgenmad og drikker en kop kaffe. **Klokken otte** [[tager jeg]] metroen og møder på arbejde klokken ni.", "a": "e9112f39cc50202d", "dur": 11.56}], "zh": "在普通的工作日，我六点半醒来。首先我起床、洗漱并穿好衣服。然后我吃早饭，喝一杯咖啡。八点整我坐地铁，九点到公司上班。"}, {"segs": [{"id": "m1-2", "who": "Kursist", "da": "**Om formiddagen** [[arbejder jeg]] ved computeren og holder møder med mine kolleger. **Ved tolvtiden** [[holder vi]] frokostpause i kantinen. **Klokken fire** [[får jeg]] fri.", "a": "ca2133c530ebcb92", "dur": 8.96}], "zh": "上午我在电脑前工作，并和同事们开会。十二点左右我们在食堂休午休吃午饭。四点我下班。"}, {"segs": [{"id": "m1-3", "who": "Kursist", "da": "**Bagefter** [[handler jeg]] ind i supermarkedet og laver aftensmad derhjemme. **Så** [[slapper jeg]] af med en god bog eller ser lidt tv. **Til sidst** [[går jeg]] i seng klokken halv elleve.", "a": "cee6d87e7f5cdbe1", "dur": 8.24}], "zh": "之后我去超市买菜，回家做晚饭。接着我看看好书放松一下，或者看一会儿电视。最后我在十点半上床睡觉。"}]}, {"id": "text-del2", "type": "text", "kind": "dialog", "tab": "Del 2", "title": "Del 2：5 轮模拟口试追问与示范回答（Eksaminator ↔ Kursist）", "scene": null, "paras": [{"zh": "【第 1 轮 · 早起习惯】你六点半起得挺早的。冬天的时候醒来对你来说很难吗？", "note": "svært ˈsvɛɐ̯ˀd；vinteren ˈvenˀdɐn（-en 融化短收）。", "segs": [{"id": "del2-1", "who": "Eksaminator", "da": "Du står tidligt op klokken halv syv. Er det svært for dig at vågne om vinteren?", "a": "352d13d4f62afb74", "dur": 5.08}]}, {"zh": "是的，冬天常常又黑又冷，所以我总是立刻喝一杯热咖啡提神。", "note": "mørkt ˈmɶɐ̯gd；koldt ˈkʰʌlˀd（注意：en varm kop kaffe 中 varm 修饰共性名词 kop，不加 -t）。", "segs": [{"id": "del2-2", "who": "Kursist", "da": "Ja, om vinteren er det tit mørkt og koldt, så jeg drikker altid en varm kop kaffe med det samme.", "a": "2d89753e41fa3e6d", "dur": 5.44}]}, {"zh": "【第 2 轮 · 午餐内容】你说你们十二点左右午休。你在食堂一般吃什么？", "note": "frokostpause ˈfʁoɡʌsdˌpʰɑʊ̯sə；ved tolvtiden ve ˈtʰʌlˀˌtʰiːðˀən。", "segs": [{"id": "del2-3", "who": "Eksaminator", "da": "Du siger, at I holder frokostpause ved tolvtiden. Hvad spiser du i kantinen?", "a": "030a5c19b5220c8b", "dur": 5.68}]}, {"zh": "我通常吃配鱼肉或奶酪的黑麦面包，之后和同事们聊一会儿天。", "note": "som regel sʌm ˈʁeːˀəl（地道高频短语“通常/一般”，g 静音）；rugbrød ˈʁuˌbʁøðˀ（丹麦黑麦面包，g 不发音，d 软读）。", "segs": [{"id": "del2-4", "who": "Kursist", "da": "Jeg spiser som regel rugbrød med fisk eller ost, og bagefter snakker jeg lidt med mine kolleger.", "a": "cbbd048fe6541d5c", "dur": 5.44}]}, {"zh": "【第 3 轮 · 下班采购与做饭】你下班后多久逛一次超市买菜？你喜欢做晚饭吗？", "note": "handler ind ˈhanlɐ ˈenˀ（d 不发音）；aftensmad ˈafdənˌsmað。", "segs": [{"id": "del2-5", "who": "Eksaminator", "da": "Hvor tit handler du ind efter arbejde, og kan du godt lide at lave aftensmad?", "a": "6f62208f443d71a2", "dur": 4.24}]}, {"zh": "我每周采购两三次。是的，我非常喜欢在家做饭。", "note": "mad ˈmað（软 ð）；rigtig godt lide ˈʁɛgdi ˈɡʌd ˈliːˀ（lide 尾音 de 常弱化脱落，读似 liːˀ）。", "segs": [{"id": "del2-6", "who": "Kursist", "da": "Jeg handler ind to eller tre gange om ugen. Ja, jeg kan rigtig godt lide at lave mad derhjemme.", "a": "b8a43513bbb541cf", "dur": 7.68}]}, {"zh": "【第 4 轮 · 晚间放松】你晚上一般看些什么书，或者在电视上看什么节目？", "note": "bøger ˈbøːˀɐ（注意 g 不发音）；om aftenen ʌm ˈafdənən。", "segs": [{"id": "del2-7", "who": "Eksaminator", "da": "Hvilke bøger læser du om aftenen, eller hvad ser du på tv?", "a": "76eb52cc79babc83", "dur": 3.6}]}, {"zh": "我经常读一本简单的丹麦语书来练语言，或者看带丹麦语字幕的新闻节目。", "note": "nyhederne ˈnyːˌheðˀɐnə；undertekster ˈʌnɐˌtʰɛgsdɐ（under 中 d 不发音）。", "segs": [{"id": "del2-8", "who": "Kursist", "da": "Jeg læser ofte en let dansk bog for at øve sproget, eller også ser jeg nyhederne med danske undertekster.", "a": "1d02d8b7da1596e9", "dur": 5.88}]}, {"zh": "【第 5 轮 · 周末对比】你的周末是什么样的？周六周日你会睡得晚一些吗？", "note": "hvordan ser... ud vɒˈdan seɐ̯... ˈuːðˀ（问“……是什么样的？”）；lørdagen ˈlɶɐ̯ˌdæːˀən；søndagen ˈsønˌdæːˀən。", "segs": [{"id": "del2-9", "who": "Eksaminator", "da": "Hvordan ser din weekend ud? Sover du længere om lørdagen og søndagen?", "a": "804956473082c4c4", "dur": 4.76}]}, {"zh": "是的，周末我九点才起床！然后我去散很长一段步，或者和朋友们聚聚。", "note": "står jeg først op（这里 først 放在动词+主语后，表示“直到九点才……”）；mødes ˈmøːðəs（“碰面/聚会”）。", "segs": [{"id": "del2-10", "who": "Kursist", "da": "Ja, i weekenden står jeg først op klokken ni! Derefter går jeg en lang tur eller mødes med mine venner.", "a": "d3f1fb5bd67acef9", "dur": 7.0}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "首先", "note": "连接副词 ": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "艾玛（Emma）在哥本哈根看上一套新挂牌出租的公寓，房东亨里克（Henrik）带她实地看房。艾玛仔细询问了面积、房间配置、楼层、月租以及周边超市与交通情况。", "paras": [{"zh": "嗨，亨里克！谢谢你今天让我们来看这套新公寓。", "note": "fordi fɒˈdiːˀ（末尾 d 不发音）；den nye dɛn ˈnyːə（定指形容词加 -e，发清晰的央元音 ə）；lejlighed ˈlɑɪ̯liˌheðˀ（中间 -ig- 中的 g 不发音，词尾软 d 带轻微喉塞音）。", "segs": [{"id": "dialog-1", "who": "Emma", "da": "Hej Henrik! Tak fordi vi må se den nye lejlighed i dag.", "a": "5bea06ff5fe55572", "dur": 3.52}]}, {"zh": "欢迎进来！是的，这是一套明亮又舒适的公寓，在（丹麦的）二楼（即地面三层）。", "note": "indenfor ˈenənˌfɒː（-nd- 中的 d 不发音）；lys ˈlyːˀs（长圆唇音 y + 喉塞音）；dejlig ˈdɑɪ̯li（词尾 -ig 中 g 不发音）；på anden sal pʰɔ ˈanən ˈsæːˀl（注意丹麦语“二楼 anden sal”等于中国的三楼！）。", "segs": [{"id": "dialog-2", "who": "Henrik", "da": "Velkommen indenfor! Ja, det er en lys og dejlig lejlighed på anden sal.", "a": "6052412924277508", "dur": 3.96}]}, {"zh": "这套公寓有多大，有几个房间呢？", "note": "stor ˈsdoɐ̯ˀ（o 偏向 o，r 弱化成 ɐ̯）；lejligheden ˈlɑɪ̯liˌheðˀən；værelser ˈvɛːɐlsɐ（词首 v，中间 -el- 轻弱，词尾 -er 读 ɐ）。", "segs": [{"id": "dialog-3", "who": "Emma", "da": "Hvor stor er lejligheden, og hvor mange værelser har den?", "a": "c82bd5b772514eea", "dur": 3.12}]}, {"zh": "面积是 65 平方米。里面有一间大客厅、一间小卧室、一个新厨房和一间老浴室。", "note": "65 ˈfɛmˀɔˌtʰʁɛs（65 读作 femogtres）；kvadratmeter kʰvaˈdʁɑːˀdˌmeːˀdɐ；nyt ˈnyd（短元音，没有喉塞音）；køkken ˈkʰøɡən；gammelt ˈɡaməld（末尾 l 清晰，t 轻读接近 d）。", "segs": [{"id": "dialog-4", "who": "Henrik", "da": "Den er 65 kvadratmeter. Der er en stor stue, et lille soveværelse, et nyt køkken og et gammelt badeværelse.", "a": "dabfa74e4386a299", "dur": 7.4}]}, {"zh": "客厅真亮堂啊！大窗户真是太棒了。这套公寓带阳台吗？", "note": "stuen ˈsduːən；store ˈsdoːɐ（加了 -e 后长音不变，r 读 ɐ）；vinduer ˈvenduɐ（-nd- 中 d 不发音）；altan alˈtʰæːˀn（重音在第二音节）。", "segs": [{"id": "dialog-5", "who": "Emma", "da": "Hvor er stuen lys! Store vinduer er virkelig dejlige. Har lejligheden også en altan?", "a": "224db9632dd55c07", "dur": 5.84}]}, {"zh": "带的，它有一个朝向安静庭院的小阳台。这条街上的老房子都非常安静。", "note": "rolig ˈʁoːli（词尾 g 不发音）；gård ˈɡɒːˀ（-rd 中的 d 不发音）；gamle ˈɡamlə（注意 gammel 变复数/定指时少了一个 m 和 e）；stille ˈsdilə（形容词不变形）。", "segs": [{"id": "dialog-6", "who": "Henrik", "da": "Ja, den har en lille altan ud mod en rolig gård. De gamle huse her i gaden er meget stille.", "a": "9d9273d404a2c17a", "dur": 6.52}]}, {"zh": "听起来真不错。每月房租多少钱？算便宜吗？", "note": "lyder ˈlyːðˀɐ（软 d）；huslejen ˈhuːsˌlɑɪ̯ən；om måneden ʌm ˈmɔːnəðən（词尾软 d 极轻）；billig ˈbili（末尾 g 不发音）。", "segs": [{"id": "dialog-7", "who": "Emma", "da": "Det lyder godt. Hvor meget koster huslejen om måneden? Er den billig?", "a": "434f8a45c58bf9d4", "dur": 4.28}]}, {"zh": "在哥本哈根算挺便宜的：每月 7500 克朗，另外加暖气费和水费。", "note": "7.500 ˈsyʊ̯ˀ ˈtʰuːˀsən ˈfɛmˀ ˈhunəðə（syv tusind fem hundrede）；varme ˈvɑːmə；vand ˈvanˀ（-nd 中的 d 不发音，带喉塞音）。", "segs": [{"id": "dialog-8", "who": "Henrik", "da": "Den er ret billig for København: 7.500 kroner om måneden plus varme og vand.", "a": "109de979e0d9d1f0", "dur": 5.0}]}, {"zh": "周边环境怎么样？附近有超市和公共交通吗？", "note": "området ˈʌmˌʁɔːðəð（软 d）；offentlig ˈʌfənli（t 和末尾 g 都不发音！）；tæt på ˈtʰɛd ˈpʰɔːˀ。", "segs": [{"id": "dialog-9", "who": "Emma", "da": "Hvordan er området? Er der et supermarked og offentlig transport tæt på?", "a": "45f127e23f403ee1", "dur": 4.92}]}, {"zh": "有的，拐角处就有两家平价超市，还有一座绿地公园，地铁站离这儿只有五分钟路程。", "note": "billige ˈbiliə；hjørnet ˈjɶɐ̯nəð（词首 hj- 中 h 不发音，词尾 -et 读 əð）；minutter miˈnudɐ（重音在第二音节）。", "segs": [{"id": "dialog-10", "who": "Henrik", "da": "Ja, der ligger to billige supermarkeder lige om hjørnet, en grøn park og metroen kun fem minutter herfra.", "a": "ca88f4530dffa384", "dur": 5.76}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "公寓", "note": "名词 · lejligheden, lejligheder, lejlighederne", "segs": [{"id": "g1", "who": "narrator", "da": "en lejlighed", "say": "en lejlighed. lejligheden, lejligheder, lejlighederne.", "a": "31ba3561eff35c15", "dur": 5.76}]}, {"zh": "客厅", "note": "名词 · stuen, stuer, stuerne", "segs": [{"id": "g2", "who": "narrator", "da": "en stue", "say": "en stue. stuen, stuer, stuerne.", "a": "f0862a0e9b56141a", "dur": 4.76}]}, {"zh": "卧室", "note": "名词 · soveværelset, soveværelser, soveværelserne", "segs": [{"id": "g3", "who": "narrator", "da": "et soveværelse", "say": "et soveværelse. soveværelset, soveværelser, soveværelserne.", "a": "176668df1d8a841a", "dur": 6.68}]}, {"zh": "厨房", "note": "名词 · køkkenet, køkkener, køkkenerne", "segs": [{"id": "g4", "who": "narrator", "da": "et køkken", "say": "et køkken. køkkenet, køkkener, køkkenerne.", "a": "593a206e9960e448", "dur": 4.64}]}, {"zh": "浴室，卫生间", "note": "名词 · badeværelset, badeværelser, badeværelserne", "segs": [{"id": "g5", "who": "narrator", "da": "et badeværelse", "say": "et badeværelse. badeværelset, badeværelser, badeværelserne.", "a": "7f080e3cd16fbe79", "dur": 6.04}]}, {"zh": "阳台", "note": "名词 · altanen, altaner, altanerne", "segs": [{"id": "g6", "who": "narrator", "da": "en altan", "say": "en altan. altanen, altaner, altanerne.", "a": "9769849f5a63dea6", "dur": 5.88}]}, {"zh": "房租", "note": "名词 · huslejen, huslejer, huslejerne", "segs": [{"id": "g7", "who": "narrator", "da": "en husleje", "say": "en husleje. huslejen, huslejer, huslejerne.", "a": "fbf54ac23f30d0de", "dur": 5.16}]}, {"zh": "窗户", "note": "名词 · vinduet, vinduer, vinduerne", "segs": [{"id": "g8", "who": "narrator", "da": "et vindue", "say": "et vindue. vinduet, vinduer, vinduerne.", "a": "4476e39a7272b9d2", "dur": 4.8}]}, {"zh": "区域，周边地带", "note": "名词 · området, områder, områderne", "segs": [{"id": "g9", "who": "narrator", "da": "et område", "say": "et område. området, områder, områderne.", "a": "0a8908accaccbddb", "dur": 5.32}]}, {"zh": "租，租赁（til leje 出租）", "note": "动词 · lejer, lejede, har lejet", "segs": [{"id": "g10", "who": "narrator", "da": "at leje", "say": "at leje. lejer, lejede, har lejet.", "a": "425e62eb2e88f739", "dur": 4.76}]}, {"zh": "位于；躺着（静态）", "note": "动词 · ligger, lå, har ligget", "segs": [{"id": "g11", "who": "narrator", "da": "at ligge", "say": "at ligge. ligger, lå, har ligget.", "a": "4524b48bfc9ab5ad", "dur": 3.84}]}, {"zh": "花费，价钱为", "note": "动词 · koster, kostede, har kostet", "segs": [{"id": "g12", "who": "narrator", "da": "at koste", "say": "at koste. koster, kostede, har kostet.", "a": "befaf0bad89f7628", "dur": 4.12}]}, {"zh": "听起来", "note": "动词 · lyder, lød, har lydt", "segs": [{"id": "g13", "who": "narrator", "da": "at lyde", "say": "at lyde. lyder, lød, har lydt.", "a": "88475d7df198f782", "dur": 4.32}]}, {"zh": "新的", "note": "形容词 · nyt, nye", "segs": [{"id": "g14", "who": "narrator", "da": "ny", "say": "ny. nyt, nye.", "a": "2f6f52ec12fca31d", "dur": 3.12}]}, {"zh": "老的，旧的（不规则缩音）", "note": "形容词 · gammelt, gamle", "segs": [{"id": "g15", "who": "narrator", "da": "gammel", "say": "gammel. gammelt, gamle.", "a": "4357b00d724173a1", "dur": 2.68}]}, {"zh": "小的（复数完全变形为 små）", "note": "形容词 · lille, små", "segs": [{"id": "g16", "who": "narrator", "da": "lille", "say": "lille. lille, små.", "a": "343f33bce189adc4", "dur": 3.16}]}, {"zh": "大的", "note": "形容词 · stort, store", "segs": [{"id": "g17", "who": "narrator", "da": "stor", "say": "stor. stort, store.", "a": "ff4cfecb56aa3529", "dur": 4.16}]}, {"zh": "明亮的", "note": "形容词 · lyst, lyse", "segs": [{"id": "g18", "who": "narrator", "da": "lys", "say": "lys. lyst, lyse.", "a": "b397464a93850630", "dur": 3.84}]}, {"zh": "便宜的", "note": "形容词 · billigt, billige", "segs": [{"id": "g19", "who": "narrator", "da": "billig", "say": "billig. billigt, billige.", "a": "9b70798506f9f2d7", "dur": 3.36}]}, {"zh": "安静的", "note": "形容词 · roligt, rolige", "segs": [{"id": "g20", "who": "narrator", "da": "rolig", "say": "rolig. roligt, rolige.", "a": "c527e59f69adce24", "dur": 2.88}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en lejlighed", "zh": "公寓", "forms": "lejligheden, lejligheder, lejlighederne"}, {"pos": "名词", "da": "en stue", "zh": "客厅", "forms": "stuen, stuer, stuerne"}, {"pos": "名词", "da": "et soveværelse", "zh": "卧室", "forms": "soveværelset, soveværelser, soveværelserne"}, {"pos": "名词", "da": "et køkken", "zh": "厨房", "forms": "køkkenet, køkkener, køkkenerne"}, {"pos": "名词", "da": "et badeværelse", "zh": "浴室，卫生间", "forms": "badeværelset, badeværelser, badeværelserne"}, {"pos": "名词", "da": "en altan", "zh": "阳台", "forms": "altanen, altaner, altanerne"}, {"pos": "名词", "da": "en husleje", "zh": "房租", "forms": "huslejen, huslejer, huslejerne"}, {"pos": "名词", "da": "et vindue", "zh": "窗户", "forms": "vinduet, vinduer, vinduerne"}, {"pos": "名词", "da": "et område", "zh": "区域，周边地带", "forms": "området, områder, områderne"}, {"pos": "动词", "da": "at leje", "zh": "租，租赁（til leje 出租）", "forms": "lejer, lejede, har lejet"}, {"pos": "动词", "da": "at ligge", "zh": "位于；躺着（静态）", "forms": "ligger, lå, har ligget"}, {"pos": "动词", "da": "at koste", "zh": "花费，价钱为", "forms": "koster, kostede, har kostet"}, {"pos": "动词", "da": "at lyde", "zh": "听起来", "forms": "lyder, lød, har lydt"}, {"pos": "形容词", "da": "ny", "zh": "新的", "forms": "nyt, nye"}, {"pos": "形容词", "da": "gammel", "zh": "老的，旧的（不规则缩音）", "forms": "gammelt, gamle"}, {"pos": "形容词", "da": "lille", "zh": "小的（复数完全变形为 små）", "forms": "lille, små"}, {"pos": "形容词", "da": "stor / lys", "zh": "大的 / 明亮的", "forms": "stor (stort, store) / lys (lyst, lyse"}, {"pos": "形容词", "da": "billig / rolig", "zh": "便宜的 / 安静的", "forms": "billig (billigt, billige) / rolig (roligt, rolige"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "这套明亮的新公寓在二楼（按丹麦楼层说法），有 65 平方米。", "answer": "Den nye, lyse lejlighed ligger på anden sal og er 65 kvadratmeter."}, {"zh": "公寓里有一间大客厅、一个新厨房和两间小卧室。", "answer": "Der er en stor stue, et nyt køkken og to små soveværelser i lejligheden."}, {"zh": "拐角处有一家便宜的超市和一个安静的小公园。", "answer": "Der ligger et billigt supermarked og en stille, lille park lige om hjørnet."}, {"zh": "这套公寓每月房租多少钱？（用 om måneden）", "answer": "Hvor meget koster huslejen i lejligheden om måneden?"}, {"zh": "那些老房子很安静，但我更喜欢这套新公寓。", "answer": "De gamle huse er meget stille, men jeg kan bedre lide den nye lejlighed."}]}, {"id": "A", "type": "drill", "title": "练习 A：用括号内形容词的正确形式填空（注意 en/et、复数与定指）", "items": [{"prompt": "Lejligheden har en {{_}} stue og et {{_}} køkken. (⟦stor⟧, ⟦ny⟧)", "kind": "cloze", "blanks": [["stor"], ["nyt"]], "explain": "⟦en stue⟧ 为共性词，原形）（⟦et køkken⟧ 为中性词，加 ⟦-t⟧"}, {"prompt": "Mit soveværelse er meget {{_}}, men det er {{_}}. (⟦lille⟧, ⟦rolig⟧)", "kind": "cloze", "blanks": [["lille"], ["roligt"]], "explain": "⟦lille⟧ 在中性词后不加 ⟦-t⟧）（⟦det = soveværelse⟧ 为中性词，加 ⟦-t⟧"}, {"prompt": "Husene i denne gade er ret {{_}}, men vinduerne er {{_}}. (⟦gammel⟧, ⟦stor⟧)", "kind": "cloze", "blanks": [["gamle"], ["store"]], "explain": "主语 ⟦Husene⟧ 是复数）（主语 ⟦vinduerne⟧ 是复数"}, {"prompt": "Vi vil gerne se {{_}} altan ud mod gården. (⟦the + lille⟧)", "kind": "cloze", "blanks": [["den lille"]], "explain": "⟦en altan⟧ 定指单数用 ⟦den⟧ + ⟦lille⟧"}, {"prompt": "Der ligger to {{_}} supermarkeder lige om hjørnet. (⟦billig⟧)", "kind": "cloze", "blanks": [["billige"]], "explain": "复数名词前加 ⟦-e⟧"}, {"prompt": "Parkerne i København er altid {{_}} om foråret. (⟦grøn⟧)", "kind": "cloze", "blanks": [["grønne"]], "explain": "复数主语 ⟦Parkerne⟧，单辅音 n 双写再加 ⟦-e⟧"}, {"prompt": "Kan du lide {{_}} badeværelse? (⟦the + ny⟧)", "kind": "cloze", "blanks": [["det nye"]], "explain": "⟦et badeværelse⟧ 定指用 ⟦det⟧ + ⟦nye⟧"}, {"prompt": "Området er meget {{_}} om aftenen. (⟦stille⟧)", "kind": "cloze", "blanks": [["stille"]], "explain": "以 ⟦-e⟧ 结尾，在中性主语 ⟦Området⟧ 后仍不变形"}]}, {"id": "B", "type": "drill", "title": "练习 B：按示范将不定指词组改写为定指词组（注意去掉名词后缀并调整形容词！）", "items": [{"prompt": "⟦en stor stue⟧ → {{_}}", "kind": "cloze", "blanks": [["den store stue"]]}, {"prompt": "⟦et lyst værelse⟧ → {{_}}", "kind": "cloze", "blanks": [["det lyse værelse"]]}, {"prompt": "⟦et lille køkken⟧ → {{_}}", "kind": "cloze", "blanks": [["det lille køkken"]]}, {"prompt": "⟦to små soveværelser⟧ → {{_}}（改写为“那些小卧室”）", "kind": "cloze", "blanks": [["de små soveværelser"]], "explain": "复数定指用 ⟦de⟧，⟦lille⟧ 变 ⟦små⟧，名词还原为不定指复数 ⟦soveværelser⟧"}, {"prompt": "⟦et billigt supermarked⟧ → {{_}}", "kind": "cloze", "blanks": [["det billige supermarked"]]}], "example": "en ny lejlighed → den nye lejlighed et gammelt hus → det gamle hus"}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "这套明亮的新公寓在二楼（按丹麦楼层说法），有 65 平方米。", "kind": "write", "accept": ["Den nye, lyse lejlighed ligger på anden sal og er 65 kvadratmeter."]}, {"prompt": "公寓里有一间大客厅、一个新厨房和两间小卧室。", "kind": "write", "accept": ["Der er en stor stue, et nyt køkken og to små soveværelser i lejligheden."]}, {"prompt": "拐角处有一家便宜的超市和一个安静的小公园。", "kind": "write", "accept": ["Der ligger et billigt supermarked og en stille, lille park lige om hjørnet."]}, {"prompt": "这套公寓每月房租多少钱？（用 ⟦om måneden⟧）", "kind": "write", "accept": ["Hvor meget koster huslejen i lejligheden om måneden?"]}, {"prompt": "那些老房子很安静，但我更喜欢这套新公寓。", "kind": "write", "accept": ["De gamle huse er meget stille, men jeg kan bedre lide den nye lejlighed."]}]}], "clips": {"hej henrik tak fordi vi må se den nye lejlighed i dag": "5bea06ff5fe55572", "velkommen indenfor ja det er en lys og dejlig lejlighed på anden sal": "6052412924277508", "hvor stor er lejligheden og hvor mange værelser har den": "c82bd5b772514eea", "den er 65 kvadratmeter der er en stor stue et lille soveværelse et nyt køkken og et gammelt badeværelse": "dabfa74e4386a299", "hvor er stuen lys store vinduer er virkelig dejlige har lejligheden også en altan": "224db9632dd55c07", "ja den har en lille altan ud mod en rolig gård de gamle huse her i gaden er meget stille": "9d9273d404a2c17a", "det lyder godt hvor meget koster huslejen om måneden er den billig": "434f8a45c58bf9d4", "den er ret billig for københavn 7500 kroner om måneden plus varme og vand": "109de979e0d9d1f0", "hvordan er området er der et supermarked og offentlig transport tæt på": "45f127e23f403ee1", "ja der ligger to billige supermarkeder lige om hjørnet en grøn park og metroen kun fem minutter herfra": "ca88f4530dffa384", "en lejlighed": "31ba3561eff35c15", "en stue": "f0862a0e9b56141a", "et soveværelse": "176668df1d8a841a", "et køkken": "593a206e9960e448", "et badeværelse": "7f080e3cd16fbe79", "en altan": "9769849f5a63dea6", "en husleje": "fbf54ac23f30d0de", "et vindue": "4476e39a7272b9d2", "et område": "0a8908accaccbddb", "at leje": "425e62eb2e88f739", "at ligge": "4524b48bfc9ab5ad", "at koste": "befaf0bad89f7628", "at lyde": "88475d7df198f782", "ny": "2f6f52ec12fca31d", "gammel": "4357b00d724173a1", "lille": "343f33bce189adc4", "stor": "ff4cfecb56aa3529", "lys": "b397464a93850630", "billig": "9b70798506f9f2d7", "rolig": "c527e59f69adce24"}, "key": "ncd1-L09"}, {"book": "ncd1", "lesson": 10, "title_da": "Hvor står vaskemaskinen?", "title_zh": "洗衣机放在哪儿？", "grammar": "四大静态位置动词（ligger, står, hænger, sidder）与动态放置动词（lægger, stiller, hænger, sætter）对比 · 方位介词 · 动/静态方位副词（ind/inde, ud/ude, op/oppe, ned/nede, hjem/hjemme）· -ld / -nd / -rd 不发音 d", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "艾玛和约纳斯（Jonas）刚把行李搬进新公寓。两人一边拆纸箱，一边商量洗衣机、镜子、毛巾、桌椅和地毯分别应该放在哪里。", "paras": [{"zh": "呼，我们该把这台新洗衣机放到哪儿呢？", "note": "stille ˈsdilə（动态动词，双写 l 读作单一清晰 l）；vaskemaskine ˈvasgəmaˌsgiːnə（词尾 -e 轻弱）。", "segs": [{"id": "dialog-1", "who": "Emma", "da": "Puha, hvor skal vi stille den nye vaskemaskine?", "a": "01293e9eb4de8ec4", "dur": 3.6}]}, {"zh": "它应该放在浴室里洗手池旁边。你看，镜子已经挂在洗手池上方了。", "note": "stå ˈsdɔːˀ；ude ˈuːðə（静态长形式，软 d）；spejlet ˈsbɑɪ̯ˀləð；hænger ˈhɛŋˀɐ（ng 读后鼻音 ŋ 带喉塞音）。", "segs": [{"id": "dialog-2", "who": "Jonas", "da": "Den skal stå ude på badeværelset ved siden af vasken. Se, spejlet hænger allerede over vasken.", "a": "7814d57e3568f12a", "dur": 4.52}]}, {"zh": "太好了！那我把盘子放到哪儿？咖啡机又放在哪儿呢？", "note": "tallerkenerne tʰaˈlɛɐ̯ɡnənə（常吞减中间音节，重点重音在第二音节 -ler-）；kaffemaskinen ˈkʰafəmaˌsgiːnən。", "segs": [{"id": "dialog-3", "who": "Emma", "da": "Godt! Hvor stiller jeg tallerkenerne, og hvor står kaffemaskinen?", "a": "fc2765d5a0e602ff", "dur": 4.04}]}, {"zh": "咖啡机立在厨房台面上。你可以把盘子放进橱柜里面去。挂钟挂在墙上。", "note": "køkkenbordet ˈkʰøɡənˌboɐ̯ˀð（-rd 中的 d 不发音！bord 读 ˈboɐ̯ˀ）；ind ˈenˀ（-nd 中的 d 不发音）；væggen ˈvɛɡˀən。", "segs": [{"id": "dialog-4", "who": "Jonas", "da": "Kaffemaskinen står på køkkenbordet. Du kan stille tallerkenerne ind i skabet. Uret hænger på væggen.", "a": "413318dbc9f0f26a", "dur": 7.2}]}, {"zh": "棒极了！那干净的毛巾放在哪儿？沙发又要放哪儿？", "note": "ligger ˈleɡɐ（短元音 e，与动态动词 lægger 区分！）；håndklæder ˈhʌnˌklɛːðɐ（hånd 中 -nd 的 d 不发音！）。", "segs": [{"id": "dialog-5", "who": "Emma", "da": "Super! Hvor ligger de rene håndklæder, og hvor skal sofaen stå?", "a": "da9b9cb58cb3f838", "dur": 4.56}]}, {"zh": "毛巾叠放在卧室里面的架子上。沙发立在客厅里面靠窗的位置。", "note": "hylden ˈhylən（-ld 中的 d 不发音）；inde ˈenə（-nd 中的 d 不发音，静态长形）；vinduet ˈvenduəð（-nd- 的 d 不发音）。", "segs": [{"id": "dialog-6", "who": "Jonas", "da": "Håndklæderne ligger på hylden inde i soveværelset. Sofaen står inde i stuen ved vinduet.", "a": "48e6ad5c2ec48f50", "dur": 5.52}]}, {"zh": "你看，钥匙已经插在门锁上了！可是那块新地毯放在哪儿呢？", "note": "sidder ˈseðˀɐ（软 d + 喉塞音）；døren ˈdɶɐ̯ˀn；gulvtæppe ˈɡɔlˌtʰɛbə（注意 gulv 末尾的 v 在标准丹麦语中不发音！）。", "segs": [{"id": "dialog-7", "who": "Emma", "da": "Se, nøglen sidder allerede i døren! Men hvor ligger det nye gulvtæppe?", "a": "ea2170b6affc14b7", "dur": 4.76}]}, {"zh": "它躺在外面的走廊里。我过一会儿就把它铺进客厅桌子底下，然后再把我们的名牌贴到门上。", "note": "lægger ˈlɛɡɐ（注意元音比 ligger ˈleɡɐ 更开！）；sætter ˈsɛdɐ；navneskilt ˈnɑʊ̯nəˌsɡelˀd。", "segs": [{"id": "dialog-8", "who": "Jonas", "da": "Det ligger ude i gangen. Jeg lægger det ind i stuen under bordet lige om lidt, og så sætter jeg vores navneskilt på døren.", "a": "f88b039a03b37e5f", "dur": 5.64}]}, {"zh": "谢谢！那那些空纸箱怎么办？它们还留在这上面的公寓里吗？", "note": "flyttekasser ˈflydəˌkʰasɐ；heroppe heɐ̯ˈʌbə（复合静态副词，重音在 -oppe）。", "segs": [{"id": "dialog-9", "who": "Emma", "da": "Tak! Hvad med de tomme flyttekasser? Står de stadig heroppe i lejligheden?", "a": "c170de32f5c94c7c", "dur": 5.08}]}, {"zh": "是的，我现在就把它们搬到楼下地下室去。之后我再上来，这样我们今晚就可以在家吃饭啦！", "note": "ned ˈneðˀ（不是 -nd，这里的软 d 要轻轻发出！）；kælderen ˈkʰɛlɐn（-ld 中的 d 不发音）；hjemme ˈjɛmə（h 不发音）。", "segs": [{"id": "dialog-10", "who": "Jonas", "da": "Ja, jeg går ned i kælderen med dem nu. Bagefter kommer jeg op igen, så vi kan spise hjemme i aften!", "a": "a35ebc07f2d7c333", "dur": 5.72}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "躺着，平放着（静态）", "note": "动词 · ligger, lå, har ligget", "segs": [{"id": "g1", "who": "narrator", "da": "at ligge", "say": "at ligge. ligger, lå, har ligget.", "a": "4524b48bfc9ab5ad", "dur": 3.84}]}, {"zh": "平放，铺放（动态动作）", "note": "动词 · lægger, lagde, har lagt", "segs": [{"id": "g2", "who": "narrator", "da": "at lægge", "say": "at lægge. lægger, lagde, har lagt.", "a": "b5ab4a8c871e755a", "dur": 4.36}]}, {"zh": "站立，竖放着（静态）", "note": "动词 · står, stod, har stået", "segs": [{"id": "g3", "who": "narrator", "da": "at stå", "say": "at stå. står, stod, har stået.", "a": "a7678af7c935cb0b", "dur": 4.36}]}, {"zh": "竖放，摆放（动态动作）", "note": "动词 · stiller, stillede, har stillet", "segs": [{"id": "g4", "who": "narrator", "da": "at stille", "say": "at stille. stiller, stillede, har stillet.", "a": "ce2a40484e03c880", "dur": 4.88}]}, {"zh": "挂着（过去时静态 hang / 动态 hængte）", "note": "动词 · hænger, hang/hængte, har hængt", "segs": [{"id": "g5", "who": "narrator", "da": "at hænge", "say": "at hænge. hænger, hang eller hængte, har hængt.", "a": "fe9bdd6518cc1876", "dur": 4.96}]}, {"zh": "坐着；卡在/附着在（静态）", "note": "动词 · sidder, sad, har siddet", "segs": [{"id": "g6", "who": "narrator", "da": "at sidde", "say": "at sidde. sidder, sad, har siddet.", "a": "30bd179d80cd5cae", "dur": 4.32}]}, {"zh": "放置，贴上，安放（动态动作）", "note": "动词 · sætter, satte, har sat", "segs": [{"id": "g7", "who": "narrator", "da": "at sætte", "say": "at sætte. sætter, satte, har sat.", "a": "28c2b88f25872735", "dur": 4.36}]}, {"zh": "走；去某处（表位移用 er）", "note": "动词 · går, gik, er gået / har gået", "segs": [{"id": "g8", "who": "narrator", "da": "at gå", "say": "at gå. går, gik, e , "zh": "往上 / 在上，往下 / 在下（hjem/hjemme 回家/在家）", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "洗衣机放在浴室里洗手池旁边。", "answer": "Vaskemaskinen står ude på badeværelset ved siden af vasken."}, {"zh": "我把地毯铺进客厅的桌子下面。", "answer": "Jeg lægger gulvtæppet ind i stuen under bordet."}, {"zh": "钥匙在门上（插着），毛巾在卧室的架子上。", "answer": "Nøglen sidder i døren, og håndklæderne ligger på hylden i soveværelset."}, {"zh": "挂钟挂在门上方的墙上。", "answer": "Uret hænger på væggen over døren."}, {"zh": "约纳斯拿着空纸箱下楼去地下室，晚上我们待在家吃饭。", "answer": "Jonas går ned i kælderen med de tomme kasser, og om aftenen spiser vi hjemme."}]}, {"id": "A", "type": "drill", "title": "练习 A：根据物体姿态，选填静态动词（ligger / står / hænger / sidder）或动态动词（lægger / stiller / hænger / sætter）", "items": [{"prompt": "De rene tallerkener {{_}} inde i skabet.", "kind": "cloze", "blanks": [["står"]], "explain": "盘子立/叠放在柜子里，用 ⟦står⟧"}, {"prompt": "Du kan {{_}} din nye kaffemaskine på køkkenbordet.", "kind": "cloze", "blanks": [["stille"]], "explain": "情态动词 ⟦kan⟧ 后用动态原形：将有底座的咖啡机立放在台面上"}, {"prompt": "Vores store spejl {{_}} på væggen over vasken.", "kind": "cloze", "blanks": [["hænger"]], "explain": "镜子挂在墙上"}, {"prompt": "Nøglen {{_}} allerede i døren, når du kommer hjem.", "kind": "cloze", "blanks": [["sidder"]], "explain": "钥匙插在/卡在门锁里，固定用 ⟦sidder⟧"}, {"prompt": "Jeg {{_}} de våde håndklæder ud på altanen.", "kind": "cloze", "blanks": [["lægger"]], "explain": "把平放折叠的毛巾放到阳台上，动态动作"}, {"prompt": "Hvorfor {{_}} flyttekasserne stadig midt på gulvet?", "kind": "cloze", "blanks": [["står"]], "explain": "箱子有底部立在地上"}, {"prompt": "Kan du ikke {{_}} det lille skilt på vores postkasse?", "kind": "cloze", "blanks": [["sætte"]], "explain": "把名牌贴/安放到信箱上，与 ⟦sidder⟧ 对应"}]}, {"id": "B", "type": "drill", "title": "练习 B：用“短动长静”原则选填方位副词（ind/inde, ud/ude, op/oppe, ned/nede, hjem/hjemme）", "items": [{"prompt": "Vi går {{_}} i kælderen med de tomme kasser.", "kind": "cloze", "blanks": [["ned"]], "explain": "⟦går⟧ 表位移向下 → 短形 ⟦ned⟧"}, {"prompt": "Vaskemaskinen står {{_}} på badeværelset.", "kind": "cloze", "blanks": [["ude"]], "explain": "⟦står⟧ 静态位置 → 长形 ⟦ude⟧"}, {"prompt": "Kom {{_}} i stuen og se vores nye sofa!", "kind": "cloze", "blanks": [["ind"]], "explain": "⟦Kom⟧ 表进入客厅的动态 → 短形 ⟦ind⟧"}, {"prompt": "Jeg er meget træt i aften, så jeg bliver {{_}}.", "kind": "cloze", "blanks": [["hjemme"]], "explain": "⟦bliver⟧ 原地停留不移动 → 静态 ⟦hjemme⟧"}, {"prompt": "Er Emma stadig {{_}} på anden sal, eller går hun {{_}} på gaden nu?", "kind": "cloze", "blanks": [["oppe"], ["ned"]], "explain": "⟦er⟧ 静态在楼上）（⟦går⟧ 往下走到街上"}, {"prompt": "Om sommeren sidder vi tit {{_}} på altanen.", "kind": "cloze", "blanks": [["ude"]], "explain": "⟦sidder⟧ 静态坐在户外阳台上"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "洗衣机放在浴室里洗手池旁边。", "kind": "write", "accept": ["Vaskemaskinen står ude på badeværelset ved siden af vasken."]}, {"prompt": "我把地毯铺进客厅的桌子下面。", "kind": "write", "accept": ["Jeg lægger gulvtæppet ind i stuen under bordet."]}, {"prompt": "钥匙在门上（插着），毛巾在卧室的架子上。", "kind": "write", "accept": ["Nøglen sidder i døren, og håndklæderne ligger på hylden i soveværelset."]}, {"prompt": "挂钟挂在门上方的墙上。", "kind": "write", "accept": ["Uret hænger på væggen over døren."]}, {"prompt": "约纳斯拿着空纸箱下楼去地下室，晚上我们待在家吃饭。", "kind": "write", "accept": ["Jonas går ned i kælderen med de tomme kasser, og om aftenen spiser vi hjemme."]}]}], "clips": {"puha hvor skal vi stille den nye vaskemaskine": "01293e9eb4de8ec4", "den skal stå ude på badeværelset ved siden af vasken se spejlet hænger allerede over vasken": "7814d57e3568f12a", "godt hvor stiller jeg tallerkenerne og hvor står kaffemaskinen": "fc2765d5a0e602ff", "kaffemaskinen står på køkkenbordet du kan stille tallerkenerne ind i skabet uret hænger på væggen": "413318dbc9f0f26a", "super hvor ligger de rene håndklæder og hvor skal sofaen stå": "da9b9cb58cb3f838", "håndklæderne ligger på hylden inde i soveværelset sofaen står inde i stuen ved vinduet": "48e6ad5c2ec48f50", "se nøglen sidder allerede i døren men hvor ligger det nye gulvtæppe": "ea2170b6affc14b7", "det ligger ude i gangen jeg lægger det ind i stuen under bordet lige om lidt og så sætter jeg vores navneskilt på døren": "f88b039a03b37e5f", "tak hvad med de tomme flyttekasser står de stadig heroppe i lejligheden": "c170de32f5c94c7c", "ja jeg går ned i kælderen med dem nu bagefter kommer jeg op igen så vi kan spise hjemme i aften": "a35ebc07f2d7c333", "at ligge": "4524b48bfc9ab5ad", "at lægge": "b5ab4a8c871e755a", "at stå": "a7678af7c935cb0b", "at stille": "ce2a40484e03c880", "at hænge": "fe9bdd6518cc1876", "at sidde": "30bd179d80cd5cae", "at sætte": "28c2b88f25872735", "at gå": "c4820ea4c0321a46", "en vaskemaskine": "84ee1e68ef222bfc", "et bord": "d370e59c3ae519c3", "en hylde": "3b10d2e0cd41325d", "et spejl": "f0dc12278058d4f7", "et gulvtæppe": "bc2eb2a1eed680a1", "en kælder": "fae26ccb92fcdb40", "en nøgle": "4d3279c809f68be2", "ind": "0f2de541cbeb7003", "inde ud": "13915d5e01e8157a", "ude": "7d54cc018f218364", "op": "54424d7fab6e2103", "oppe ned": "8552de21c3b9afea", "nede": "441d28e5545e6168"}, "key": "ncd1-L10"}, {"book": "ncd1", "lesson": 11, "title_da": "Er der nogen hjemme?", "title_zh": "有人在家吗？", "grammar": "不定代词 nogen / noget / nogle 精确区分 · 否定替代词 ingen / intet（= ikke nogen / ikke noget）· 借物与公寓公用设施询问", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "刚搬来不久的艾玛需要把画和挂钟装好，于是敲响了隔壁邻居卡斯珀（Kasper）家的门，顺便了解这栋公寓楼的公共洗衣房和自行车棚。", "paras": [{"zh": "打扰一下，您好！有人在家吗？", "note": "goddag ɡoˈdæːˀ（两个 d 在口语里常常彻底吞掉或极大弱化，词尾 g 不发音）；nogen ˈnoːən（g 几乎完全静音，听起来像“诺恩”）。", "segs": [{"id": "dialog-1", "who": "Emma", "da": "Undskyld, goddag! Er der nogen hjemme?", "a": "ddea8d28c495f378", "dur": 2.44}]}, {"zh": "在的，嗨！快请进！你一定是我们的新邻居吧。", "note": "bare ˈbɑːɑ；ind ˈenˀ（-nd 的 d 不发音）；nabo ˈnæːbo（重音在第一音节）。", "segs": [{"id": "dialog-2", "who": "Kasper", "da": "Ja, hej! Kom bare ind! Du må være vores nye nabo.", "a": "ea111a046519e8dd", "dur": 3.2}]}, {"zh": "是的，我叫艾玛。请问一下，你有锤子或者什么工具可以借我用一下吗？", "note": "Sig mig ˈsiː ˈmɑɪ̯（sig 词尾 g 在此变音成延长 i）；noget ˈnɔːð（t 不发音，g 脱落，带软 d）；værktøj ˈvɛɐ̯ɡˌtʰʌɪ̯。", "segs": [{"id": "dialog-3", "who": "Emma", "da": "Ja, jeg hedder Emma. Sig mig, har du en hammer eller noget værktøj, jeg må låne?", "a": "2040d5e7605817fd", "dur": 4.52}]}, {"zh": "真不巧，我没有锤子，也没有钉子。不过我这儿有几把螺丝刀！", "note": "desværre deˈsvɛːɐ；ingen ˈeŋən（ng 读后鼻音）；søm ˈsømˀ；nogle ˈnoːlən / 口语常弱读为 ˈnoːən；skruetrækkere ˈsɡʁuːəˌtʰʁɛɡɐə。", "segs": [{"id": "dialog-4", "who": "Kasper", "da": "Jeg har desværre ingen hammer, og jeg har heller ikke nogen søm. Men jeg har nogle skruetrækkere her!", "a": "9c5814163864187b", "dur": 4.12}]}, {"zh": "太感谢了！你真热心。你还有胶带或者胶水吗？", "note": "Tusind tak ˈtʰuːˀsən ˈtʰaɡ（tusind 末尾 -nd 的 d 不发音）；hjælpsomt ˈjɛlˀbsʌmˀd（hj- 中 h 不发音）；tape ˈtʰɛɪ̯b（英语借词）。", "segs": [{"id": "dialog-5", "who": "Emma", "da": "Tusind tak! Det er meget hjælpsomt. Har du også noget tape eller noget lim?", "a": "8ca4b52b4cbef3a9", "dur": 4.64}]}, {"zh": "没有，我现在刚好一点胶带都没有。不过我现在正煮新鲜咖啡呢——你要喝点咖啡、吃几块小饼干吗？", "note": "intet ˈendəð（末尾 t 读轻柔的软 d ð）；småkager ˈsmɔˌkʰæːɐ（注意 kager 中间 g 不发音！）。", "segs": [{"id": "dialog-6", "who": "Kasper", "da": "Nej, jeg har desværre intet tape lige nu. Men jeg laver frisk kaffe nu – vil du have noget kaffe og nogle småkager?", "a": "43fcba9c46f7112c", "dur": 5.56}]}, {"zh": "谢谢，也许过会儿吧！顺便问一下，你了解公共洗衣房的情况吗？", "note": "senere ˈseːnɐə；Ved du ˈveðˀ du（常连读成 ˈveːdu）；for resten fʌ ˈʁɛsdən；fælles ˈfɛlˀəs。", "segs": [{"id": "dialog-7", "who": "Emma", "da": "Mange tak, måske lidt senere! Ved du for resten noget om den fælles vaskekælder?", "a": "2b216459e7ca4d7e", "dur": 5.16}]}, {"zh": "了解！下面放着两台大洗衣机。今天已经没有空时段了，不过明天晚上还有几个空档。", "note": "dernede dɛɐ̯ˈneːðə；ledige ˈleːðiə（g 不发音）；tider ˈtʰiːðɐ（软 d）；nogle tider ˈnoːən ˈtʰiːðɐ。", "segs": [{"id": "dialog-8", "who": "Kasper", "da": "Ja! Der står to store maskiner dernede. I dag er der ingen ledige tider, men i morgen er der nogle tider om aftenen.", "a": "9b3473ecdeddf705", "dur": 7.52}]}, {"zh": "太好了！院子里难道没有自行车棚吗？", "note": "Perfekt pʰæɐ̯ˈfɛɡd（重音在第二音节）；cykelskur ˈsyɡəlˌsɡuɐ̯ˀ（u 清晰圆唇）。", "segs": [{"id": "dialog-9", "who": "Emma", "da": "Perfekt! Er der ikke noget cykelskur her i gården?", "a": "442303530ea838fb", "dur": 3.44}]}, {"zh": "有的呀，就在垃圾房旁边有一个很大的自行车棚！如果你还缺别的东西，千万别客气尽管说。", "note": "affaldet ˈɑʊ̯ˌfalˀəð（-ld 中 d 不发音）；endelig ˈɛnəli（d 和 g 都不发音！）；mangler ˈmɑŋlɐ。", "segs": [{"id": "dialog-10", "who": "Kasper", "da": "Jo, der er et stort cykelskur lige ved siden af affaldet! Sig endelig til, hvis du mangler noget andet.", "a": "71598d164ee1292f", "dur": 5.12}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "有人", "note": "代词", "segs": [{"id": "g1", "who": "narrator", "da": "nogen", "a": "e26318d52e186d0e", "dur": 1.04}]}, {"zh": "任何；某事", "note": "代词", "segs": [{"id": "g2", "who": "narrator", "da": "noget", "a": "ad04b6cda4634528", "dur": 1.04}]}, {"zh": "一点；一些", "note": "代词", "segs": [{"id": "g3", "who": "narrator", "da": "nogle", "a": "3fc2d325685b61f1", "dur": 1.32}]}, {"zh": "没有（人/个）；没有（一点/东西）", "note": "代词 · = ikke nogen", "segs": [{"id": "g4", "who": "narrator", "da": "ingen", "say": "ingen. = ikke nogen.", "a": "aa56582f86e19023", "dur": 2.36}]}, {"zh": "没有（人/个）；没有（一点/东西）", "note": "代词 · ikke noget", "segs": [{"id": "g5", "who": "narrator", "da": "intet", "say": "intet. ikke noget.", "a": "bea6f4f142206a39", "dur": 2.0}]}, {"zh": "邻居", "note": "名词 · naboen, naboer, naboerne", "segs": [{"id": "g6", "who": "narrator", "da": "en nabo", "say": "en nabo. naboen, naboer, naboerne.", "a": "e75ce8ccc3db40e8", "dur": 4.96}]}, {"zh": "锤子（复数缩音且单写 m）", "note": "名词 · hammeren, hamre, hamrene", "segs": [{"id": "g7", "who": "narrator", "da": "en hammer", "say": "en hammer. hammeren, hamre, hamrene.", "a": "80c2c2333b23df70", "dur": 4.88}]}, {"zh": "工具（集合概念常用 noget værktøj）", "note": "名词 · værktøjet, værktøjer, værktøjerne", "segs": [{"id": rrator", "da": "at vide", "say": "at vide. ved, vidste, har vidst.", "a": "2b54e91351c3dfdb", "dur": 4.32}]}, {"zh": "遗憾地/不巧 / 务必，请尽管（祈使语气）", "note": "副词", "segs": [{"id": "g18", "who": "narrator", "da": "desværre", "a": "bef698cae6feaf54", "dur": 0.96}]}, {"zh": "遗憾地/不巧 / 务必，请尽管（祈使语气）", "note": "副词", "segs": [{"id": "g19", "who": "narrator", "da": "endelig", "a": "d0c3d000b48a8caf", "dur": 0.8}]}, {"zh": "公共的，共有的", "note": "形容词", "segs": [{"id": "g20", "who": "narrator", "da": "fælles", "a": "50901e6bd9c13152", "dur": 0.96}]}, {"zh": "乐于助人的", "note": "形容词 · -t, -me", "segs": [{"id": "g21", "who": "narrator", "da": "hjælpsom", "say": "hjælpsom.", "a": "eae3b95ac300e217", "dur": 1.16}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "代词", "da": "nogen / noget / nogle", "zh": "有人/任何；某事/一点；一些", "forms": "不可数/单/复不同用法"}, {"pos": "代词", "da": "ingen / intet", "zh": "没有（人/个）；没有（一点/东西）", "forms": "= ikke nogen / ikke noget"}, {"pos": "名词", "da": "en nabo", "zh": "邻居", "forms": "naboen, naboer, naboerne"}, {"pos": "名词", "da": "en hammer", "zh": "锤子（复数缩音且单写 m）", "forms": "hammeren, hamre, hamrene"}, {"pos": "名词", "da": "et værktøj", "zh": "工具（集合概念常用 noget værktøj）", "forms": "værktøjet, værktøjer, værktøjerne"}, {"pos": "名词", "da": "en skruetrækker", "zh": "螺丝刀", "forms": "skruetrækkeren, skruetrækkere, skruetrækkerne"}, {"pos": "名词", "da": "et søm", "zh": "钉子（中性单复同形）", "forms": "sømmet, søm, sømmene"}, {"pos": "名词", "da": "en småkage", "zh": "小饼干，曲奇", "forms": "småkagen, småkager, småkagerne"}, {"pos": "名词", "da": "en vaskekælder", "zh": "（公寓楼）公共洗衣房", "forms": "vaskekælderen, vaskekældre, vaskekældrene"}, {"pos": "名词", "da": "et cykelskur", "zh": "自行车棚", "forms": "cykelskuret, cykelskure, cykelskurene"}, {"pos": "名词", "da": "et affald", "zh": "垃圾（不可数）", "forms": "affaldet, kun ental"}, {"pos": "动词", "da": "at låne", "zh": "借入；借出", "forms": "låner, lånte, har lånt"}, {"pos": "动词", "da": "at mangle", "zh": "缺少，缺乏", "forms": "mangler, manglede, har manglet"}, {"pos": "动词", "da": "at vide", "zh": "知道（不规则现在时 ved！）", "forms": "ved, vidste, har vidst"}, {"pos": "副词", "da": "desværre / endelig", "zh": "遗憾地/不巧 / 务必，请尽管（祈使语气）", "forms": "—"}, {"pos": "形容词", "da": "fælles / hjælpsom", "zh": "公共的，共有的 / 乐于助人的", "forms": "fælles (不变) / hjælpsom (-t, -me"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "请问，有人在家吗？我可以向你借一把螺丝刀吗？", "answer": "Undskyld, er der nogen hjemme? Må jeg låne en skruetrækker af dig?"}, {"zh": "真不巧，我家里没有锤子，也没有任何钉子。", "answer": "Desværre har jeg ingen hammer og heller ikke nogen søm derhjemme."}, {"zh": "你需要一些咖啡吗？我这里还有几块小饼干。", "answer": "Vil du have noget kaffe? Jeg har også nogle småkager her."}, {"zh": "公共洗衣房今天没有空时段，但明天有一些时间。", "answer": "Der er ingen ledige tider i vaskekælderen i dag, men i morgen er der nogle tider."}, {"zh": "如果你还需要什么别的，请千万告诉我！", "answer": "Sig endelig til, hvis du mangler noget andet!"}]}, {"id": "A", "type": "drill", "title": "练习 A：精确选填 nogen、noget 或 nogle", "items": [{"prompt": "Er der {{_}} hjemme i lejligheden?", "kind": "cloze", "blanks": [["nogen"]], "explain": "疑问句中指“任何人”"}, {"prompt": "Jeg har {{_}} gode venner på Nørrebro.", "kind": "cloze", "blanks": [["nogle"]], "explain": "肯定句 + 复数可数名词 ⟦venner⟧"}, {"prompt": "Har du {{_}} værktøj, jeg kan låne i ti minutter?", "kind": "cloze", "blanks": [["noget"]], "explain": "疑问句 + 中性词/集合词 ⟦et værktøj⟧"}, {"prompt": "Vi har desværre ikke {{_}} ledige stole i stuen.", "kind": "cloze", "blanks": [["nogen"]], "explain": "否定句 + 复数可数名词 ⟦stole⟧"}, {"prompt": "Vil du have {{_}} vand eller kaffe?", "kind": "cloze", "blanks": [["noget"]], "explain": "不可数物质名词 ⟦vand/kaffe⟧ 一律用 ⟦noget⟧"}, {"prompt": "Kan du fortælle mig {{_}} om området her?", "kind": "cloze", "blanks": [["noget"]], "explain": "指“任何信息/某事”"}, {"prompt": "I dag er der ikke {{_}} tid til at vaske tøj.", "kind": "cloze", "blanks": [["noget"]], "explain": "⟦tid⟧ 表抽象不可数时间概念“没有时间”用 ⟦noget⟧；注意 ⟦en tid⟧ 表“一个预约时段”可数复数 ⟦tider⟧ 时才用 ⟦nogen tider⟧！"}, {"prompt": "Hun køber {{_}} friske blomster til sin nabo.", "kind": "cloze", "blanks": [["nogle"]], "explain": "肯定句 + 复数可数名词 ⟦blomster⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：句型互换（将 ikke nogen / ikke noget 改写为 ingen / intet，或反向改写）", "items": [{"prompt": "⟦Jeg har ikke nogen hammer.⟧ → {{_}}", "kind": "cloze", "blanks": [["Jeg har ingen hammer"]]}, {"prompt": "⟦Der er ikke noget cykelskur i vores gård.⟧ → {{_}}", "kind": "cloze", "blanks": [["Der er intet cykelskur i vores gård"]]}, {"prompt": "⟦Jeg har ingen søskende.⟧ → {{_}}", "kind": "cloze", "blanks": [["Jeg har ikke nogen søskende"]]}, {"prompt": "⟦Hun ved intet om vaskekælderen.⟧ → {{_}}", "kind": "cloze", "blanks": [["Hun ved ikke noget om vaskekælderen"]]}, {"prompt": "⟦Der er ikke nogen ledige tider i dag.⟧ → {{_}}", "kind": "cloze", "blanks": [["Der er ingen ledige tider i dag"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "请问，有人在家吗？我可以向你借一把螺丝刀吗？", "kind": "write", "accept": ["Undskyld, er der nogen hjemme? Må jeg låne en skruetrækker af dig?"]}, {"prompt": "真不巧，我家里没有锤子，也没有任何钉子。", "kind": "write", "accept": ["Desværre har jeg ingen hammer og heller ikke nogen søm derhjemme."]}, {"prompt": "你需要一些咖啡吗？我这里还有几块小饼干。", "kind": "write", "accept": ["Vil du have noget kaffe? Jeg har også nogle småkager her."]}, {"prompt": "公共洗衣房今天没有空时段，但明天有一些时间。", "kind": "write", "accept": ["Der er ingen ledige tider i vaskekælderen i dag, men i morgen er der nogle tider."]}, {"prompt": "如果你还需要什么别的，请千万告诉我！", "kind": "write", "accept": ["Sig endelig til, hvis du mangler noget andet!"]}]}], "clips": {"undskyld goddag er der nogen hjemme": "ddea8d28c495f378", "ja hej kom bare ind du må være vores nye nabo": "ea111a046519e8dd", "ja jeg hedder emma sig mig har du en hammer eller noget værktøj jeg må låne": "2040d5e7605817fd", "jeg har desværre ingen hammer og jeg har heller ikke nogen søm men jeg har nogle skruetrækkere her": "9c5814163864187b", "tusind tak det er meget hjælpsomt har du også noget tape eller noget lim": "8ca4b52b4cbef3a9", "nej jeg har desværre intet tape lige nu men jeg laver frisk kaffe nu – vil du have noget kaffe og nogle småkager": "43fcba9c46f7112c", "mange tak måske lidt senere ved du for resten noget om den fælles vaskekælder": "2b216459e7ca4d7e", "ja der står to store maskiner dernede i dag er der ingen ledige tider men i morgen er der nogle tider om aftenen": "9b3473ecdeddf705", "perfekt er der ikke noget cykelskur her i gården": "442303530ea838fb", "jo der er et stort cykelskur lige ved siden af affaldet sig endelig til hvis du mangler noget andet": "71598d164ee1292f", "nogen": "e26318d52e186d0e", "noget": "ad04b6cda4634528", "nogle": "3fc2d325685b61f1", "ingen": "aa56582f86e19023", "intet": "bea6f4f142206a39", "en nabo": "e75ce8ccc3db40e8", "en hammer": "80c2c2333b23df70", "et værktøj": "8a1693a3eda19cde", "en skruetrækker": "309aa6239d502dde", "et søm": "2c64f832a649e96a", "en småkage": "d6064048c290db38", "en vaskekælder": "17eaab60e1eca5ba", "et cykelskur": "29dcdbd6926debb3", "et affald": "68d55a45e4206112", "at låne": "6c57340a111bfc30", "at mangle": "23cfea2fb8ecc0a8", "at vide": "2b54e91351c3dfdb", "desværre": "bef698cae6feaf54", "endelig": "d0c3d000b48a8caf", "fælles": "50901e6bd9c13152", "hjælpsom": "eae3b95ac300e217"}, "key": "ncd1-L11"}, {"book": "ncd1", "lesson": 12, "title_da": "Min bolig og mine naboer", "title_zh": "我的住处与邻居 [独白]", "grammar": "物主代词全表（min/mit/mine, din/dit/dine, vores, jeres, deres）· 第三人称 sin/sit/sine vs hans/hendes 基础判定原则 · DU3 口试主题陈述与追问", "sections": [{"id": "text-del1", "type": "text", "kind": "prose", "tab": "Del 1", "title": "Del 1：第一人称独白范本（95 词）", "scene": null, "paras": [{"segs": [{"id": "m1-1", "who": "Kursist", "da": "Jeg bor i en hyggelig lejlighed på Nørrebro i København. [[Min]] lejlighed ligger på anden sal, og den er 65 kvadratmeter stor.", "a": "b7827dcd992980e6", "dur": 7.72}, {"id": "m1-2", "who": "Kursist", "da": "Vi har en lys stue, et lille køkken og to soveværelser. [[Mit]] værelse er roligt, og [[mine]] vinduer vender ud mod gården.", "a": "c4c25674785e2d32", "dur": 8.08}], "zh": "我住在哥本哈根诺雷布罗区（Nørrebro）一套很温馨的公寓里。我的公寓位于（丹麦的）二楼，面积有 65 平方米。我们有一间明亮的客厅、一个小厨房和两间卧室。我的房间很安静，我的窗户朝向庭院。"}, {"segs": [{"id": "m1-3", "who": "Kursist", "da": "Jeg bor sammen med [[min]] veninde Sofie.", "a": "d96d6adc03a25223", "dur": 2.08}, {"id": "m1-4", "who": "Kursist", "da": "Vi deler [[vores]] husarbejde: jeg gør [[vores]] køkken rent, og Sofie støvsuger gulvet og vasker **sit** tøj.", "a": "6a053a93df373c45", "dur": 5.6}], "zh": "我和我的女性朋友索菲娅住在一起。我们分担家务：我负责打扫厨房卫生，索菲娅负责用吸尘器吸地板并洗她自己的衣服。"}, {"segs": [{"id": "m1-5", "who": "Kursist", "da": "[[Vores]] nabo hedder Kasper.", "a": "a57f651db530dac7", "dur": 1.96}, {"id": "m1-6", "who": "Kursist", "da": "Han bor med **sin** kat og passer **sine** planter i **sin** lejlighed.", "a": "b7f2a800445ea726", "dur": 3.72}, {"id": "m1-7", "who": "Kursist", "da": "I weekenden besøger vi ham ofte og drikker kaffe i **hans** stue.", "a": "b752a7a6aadfa16a", "dur": 3.84}], "zh": "我们的邻居叫卡斯珀。他和他的猫一起住在他的公寓里，还照料他自己的植物。周末我们经常去他家做客，在他的客厅里喝咖啡。"}]}, {"id": "text-del2", "type": "text", "kind": "dialog", "tab": "Del 2", "title": "Del 2：考官追问与高分示范回答（5 轮模拟互动）", "scene": null, "paras": [{"zh": "你说你住在诺雷布罗。那里的周边环境怎么样？", "note": "Du siger, at... du ˈsiːɐ ad（siger 中 g 弱化消失）。", "segs": [{"id": "del2-1", "who": "Examinator", "da": "Du siger, at du bor på Nørrebro. Hvordan er området der?", "a": "31bf73b2998a0a43", "dur": 3.16}]}, {"zh": "周边环境非常热闹又惬意。我们街附近有很多平价超市、咖啡馆和一个地铁站。", "note": "livligt ˈliʊ̯li（词尾 -igt 中 g 和 t 都不发音）。", "segs": [{"id": "del2-2", "who": "Svar (Emma)", "da": "Området er meget livligt og hyggeligt. Der ligger mange billige supermarkeder, caféer og en metrostation tæt på vores gade.", "a": "82bf4ab506acae46", "dur": 7.68}]}, {"zh": "关于你自己的公寓，你最喜欢哪一点？", "note": "egen ˈɑɪ̯ən（注意 g 滑化为 ɪ̯）。", "segs": [{"id": "del2-3", "who": "Examinator", "da": "Hvad kan du bedst lide ved din egen lejlighed?", "a": "d87d2448008fafb9", "dur": 2.32}]}, {"zh": "我尤其喜欢我们明亮的客厅和我安静的卧室。窗户朝向院子里，所以夜里一点噪音都没有。", "note": "især iˈsɛɐ̯ˀ（重音在第二音节）；larm ˈlɑːˀm。", "segs": [{"id": "del2-4", "who": "Svar (Emma)", "da": "Jeg er især glad for vores lyse stue og mit rolige soveværelse. Vinduerne vender ud mod gården, så der er ingen larm om natten.", "a": "76465a24f7c2c20b", "dur": 7.72}]}, {"zh": "你们两个人合住时，家务方面配合得怎么样？", "note": "fungerer fɔŋˈɡeːˀɐ（重音在 -ge-）。", "segs": [{"id": "del2-5", "who": "Examinator", "da": "Hvordan fungerer det med husarbejdet, når I bor to sammen?", "a": "1588a692c7f27e92", "dur": 2.88}]}, {"zh": "配合得非常好！我们有一份固定的分工表：我周三打扫厨房，索菲娅周末吸尘扫地。", "note": "om onsdagen ʌm ˈonˀsdæːən（-dag- 中的 g 不发音，重音在 ons-）。", "segs": [{"id": "del2-6", "who": "Svar (Emma)", "da": "Det fungerer rigtig godt! Vi har en fast plan: jeg gør køkkenet rent om onsdagen, og Sofie støvsuger gulvet i weekenden.", "a": "c0a6d1c9e3ea6039", "dur": 7.8}]}, {"zh": "你提到了你们的邻居卡斯珀。你们还认识这栋楼里的其他邻居吗？", "note": "nævner ˈnɛʊ̯nɐ；jeres ˈjɛɐ̯s（或 ˈjɛɐ̯ɐs）。", "segs": [{"id": "del2-7", "who": "Examinator", "da": "Du nævner jeres nabo Kasper. Kender I også andre naboer i bygningen?", "a": "1a88c36bc8d94117", "dur": 4.04}]}, {"zh": "认识的，我们在楼梯上总是跟邻居们打招呼；我们楼上一户友好的家庭在我们去度假时还会帮我们照看植物。", "note": "hilser ˈhelˀsɐ；trappen ˈtʰʁabən。", "segs": [{"id": "del2-8", "who": "Svar (Emma)", "da": "Ja, vi hilser altid på vores naboer på trappen, og en sød familie over os passer vores planter, når vi er på ferie.", "a": "89e1ffac725cc0b6", "dur": 6.84}]}, {"zh": "你们去卡斯珀的公寓做客时都会做些什么呢？", "note": "besøger beˈsøːˀɐ（be- 轻读，中间 g 不发音）。", "segs": [{"id": "del2-9", "who": "Examinator", "da": "Hvad laver I, når I besøger Kasper i hans lejlighed?", "a": "b7726015ff7a1104", "dur": 3.2}]}, {"zh": "我们会喝杯咖啡或者茶，聊聊这一周的事，还会逗逗他可爱的猫咪。", "note": "snakker ˈsnaɡɐ；leger ˈlɑɪ̯ɐ（中间 g 滑化为 ɪ̯）。", "segs": [{"id": "del2-10", "who": "Svar (Emma)", "da": "Vi drikker en kop kaffe eller te, snakker om ugen og leger med hans søde kat.", "a": "4de289cd660c5208", "dur": 5.92}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "我们的", "note": "代词", "segs": [{"id": "g1", "who": "narrator", "da": "vores", "a": "730c147e905c1fed", "dur": 1.12}]}, {"zh": "你们的", "note": "代词", "segs": [{"id": "g2", "who": "narrator", "da": "jeres", "a": "a909904600d31203", "dur": 1.36}]}, {"zh": "他们的", "note": "代词", "segs": [{"id": "g3", "who": "narrator", "da": "deres", "a": "ee4c64bff640255c", "dur": 1.04}]}, {"zh": "他自己的 / 她自己的（反身）", "note": "代词", "segs": [{"id": "g4", "who": "narrator", "da": "sin", "a": "1ed14b8530647efd", "dur": 0.88}]}, {"zh": "他自己的 / 她自己的（反身）", "note": "代词", "segs": [{"id": "g5", "who": "narrator", "da": "sit", "a": "e3bf34d563c4ed77", "dur": 0.8}]}, {"zh": "他自己的 / 她自己的（反身）", "note": "代词", "segs": [{"id": "g6", "who": "narrator", "da": "sine", "a": "fa0d11082e4f6fed", "dur": 1.2}]}, {"zh": "建筑物，大楼", "note": "名词 · bygningen, bygninger, bygningerne", "segs": [{"id": "g7", "who": "narrator", "da": "en bygning", "say": "en bygning. bygningen, bygninger, bygningerne.", "a": "2b504f1360dc82a1", "dur": 4.92}]}, {"zh": "房间", "note": "名词 · værelset, værelser, værelserne", "segs": [{"id": "g8", "who": "narrator", "da": "et værelse", "say": "et værelse. værelset, værelser, værelserne.", "a": "41785e16e018d0c7", "dur": 5.04}]}, {"zh": "女性朋友，闺蜜", "note": "名词 · veninden, veninder, veninderne", "segs": [{"id": "g9", "who": "narrator", "da": "en veninde", "say": "en veninde. veninden, veninder, veninderne.", "a": "8b03173900c66d68", "dur": 5.24}]}, {"zh": "家务活（不可数）", "note": "名词 · husarbejdet, kun ental", "segs": [{"id": "g10", "who": "narrator", "da": "et husarbejde", "say": "et husarbejde.", "a": "c5c27645887f5346", "dur": 1.88}]}, {"zh": "衣服，衣物（不可数）", "note": "名词 · tøjet, kun ental", "segs": [{"id": "g11", "who": "narrator", "da": "et tøj", "say": "et tøj.", "a": "1176e4fd172818c6", "dur": 0.96}]}, {"zh": "地板", "note": "名词 · gulvet, gulve, gulvene", "segs": [{"id": "g12", "who": "narrator", ，按正确语序拼出句子。", "items": [{"zh": "我和我妹妹住在奥胡斯一套明亮的公寓里。", "answer": "Jeg bor sammen med min lillesøster i en lys lejlighed i Aarhus."}, {"zh": "我的房间很小，但我的窗户朝向一座安静的庭院。", "answer": "Mit værelse er meget lille, men mine vinduer vender ud mod en rolig gård."}, {"zh": "我们分担家务：我负责打扫厨房，她洗她自己的衣服。", "answer": "Vi deler vores husarbejde: jeg gør køkkenet rent, og hun vasker sit eget tøj."}, {"zh": "我们的邻居和她自己的两条狗住在同一栋楼里。", "answer": "Vores nabo bor med sine to hunde i den samme bygning."}, {"zh": "她的小狗很可爱，我们经常跟她的狗玩。", "answer": "Hendes hunde er meget søde, og vi leger tit med hendes hunde."}]}, {"id": "A", "type": "drill", "title": "练习 A：填出正确的物主代词（min/mit/mine, din/dit/dine, vores, jeres, deres）", "items": [{"prompt": "Jeg har en hyggelig lejlighed. {{_}} lejlighed ligger på Nørrebro.", "kind": "cloze", "blanks": [["Min"]]}, {"prompt": "Du har et meget roligt soveværelse. Hvor stort er {{_}} værelse?", "kind": "cloze", "blanks": [["dit"]]}, {"prompt": "Jeg har to små altaner. {{_}} altaner vender ud mod gården.", "kind": "cloze", "blanks": [["Mine"]], "explain": "复数 ⟦altaner⟧"}, {"prompt": "Sofie og jeg deler arbejdet. Vi gør {{_}} køkken rent sammen.", "kind": "cloze", "blanks": [["vores"]], "explain": "主语为 ⟦Vi⟧"}, {"prompt": "Mikkel og Sara bor sammen. Hvornår besøger vi dem i {{_}} nye hus?", "kind": "cloze", "blanks": [["deres"]], "explain": "指代复数 Mikkel og Sara 的房子"}, {"prompt": "Emma og Jonas, hvor ligger {{_}} kælder?", "kind": "cloze", "blanks": [["jeres"]], "explain": "直接称呼对方二人“你们的”"}]}, {"id": "B", "type": "drill", "title": "练习 B：黄金二选一（sin / sit / sine 还是 hans / hendes / deres？）", "items": [{"prompt": "Kasper bor med {{_}} (sin / hans) søde kat i en lille lejlighed.", "kind": "cloze", "blanks": [["sin"]], "explain": "主语为单数 ⟦Kasper⟧，他自己的猫，⟦en kat⟧"}, {"prompt": "Emma besøger tit Kasper og leger med {{_}} (sin / hans) kat.", "kind": "cloze", "blanks": [["hans"]], "explain": "主语为 ⟦Emma⟧，猫是 Kasper 的不是 Emma 自己的！"}, {"prompt": "Sofie støvsuger altid {{_}} (sit / hendes) eget v 703ac1645a7cef24", "egen": "f75dd6ea74dedb19", "alene": "70ad646c010b4f50", "sammen med": "677d830e8d84a84d"}, "key": "ncd1-L12"}, {"book": "ncd1", "lesson": 13, "title_da": "Første dag i bageriet", "title_zh": "面包店上班第一天", "grammar": "祈使句（Imperativ：去 -e 词根）与礼貌指令（Vær sød at... / Husk at...）· 泛指代词 man · 职责与禁令表达（man skal, man må ikke, man behøver ikke）· 喉塞音 stød 基础感知", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "卢卡斯（Lukas）第一天到一家丹麦手工面包店打工，店主梅特（Mette）带他换上工作服，交代厨房卫生规范、收银台服务礼仪以及手机管理规定。", "paras": [{"zh": "欢迎来到你上班的第一天，卢卡斯！来厨房里面，穿上一件干净的围裙。", "note": "Kom ˈkʰʌmˀ（祈使句触发喉塞音 ˀ）；tag ˈtʰæːˀ（祈使句，末尾 g 不发音）；forklæde ˈfɒːˌklɛːðə（软 d）。", "segs": [{"id": "dialog-1", "who": "Mette", "da": "Velkommen til din første dag, Lukas! Kom ind i køkkenet, og tag et rent forklæde på.", "a": "6c368d1ec288f8ca", "dur": 5.28}]}, {"zh": "谢谢，梅特！在这家面包店里，大家最先必须记住什么呢？", "note": "man man（泛指代词轻读，无喉塞音，区别于 mand ˈmanˀ）；allerførst ˈalɐˌfɶɐ̯sd；bageriet bæːɐˈʁiːˀəð。", "segs": [{"id": "dialog-2", "who": "Lukas", "da": "Tak, Mette! Hvad skal man huske allerførst her i bageriet?", "a": "063ae6980f82a310", "dur": 3.48}]}, {"zh": "永远要先彻底洗手！工作时必须穿干净的衣服，而且不准戴戒指或手表。", "note": "Vask ˈvasɡ（短元音 + 清辅音，无喉塞音）；hænderne ˈhɛnˀɐnə（-nd- 的 d 不发音）；grundigt ˈɡʁɔnˀdi（词尾 -gt 不发音）。", "segs": [{"id": "dialog-3", "who": "Mette", "da": "Vask altid hænderne grundigt først! Man skal have rent tøj på, og man må ikke have ringe eller ur på.", "a": "7219831dc3d07968", "dur": 6.8}]}, {"zh": "明白了！那我今天需要烤面包吗？", "note": "Forstået fɒˈsdɔːˀð（重音在 -stå-，长音带喉塞音）；Behøver beˈhøːˀvɐ；brødet ˈbʁœðˀəð（软 d）。", "segs": [{"id": "dialog-4", "who": "Lukas", "da": "Forstået! Behøver jeg så at bage brødet i dag?", "a": "73abc0fc9a08c9d0", "dur": 3.32}]}, {"zh": "不用，你还不需要烤面包。请帮忙照看一下柜台，把新鲜的小圆面包打包好。", "note": "Vær ˈvɛɐ̯ˀ（单音节祈使词，带喉塞音）；hjælpe ˈjɛlbə（h 不发音）；pak ˈpʰaɡ；rundstykker ˈʁɔnˌsdøɡɐ（rund- 中 d 不发音）。", "segs": [{"id": "dialog-5", "who": "Mette", "da": "Nej, du behøver ikke at bage endnu. Vær sød at hjælpe ved disken, og pak de friske rundstykker.", "a": "cf14d344bacd0375", "dur": 6.0}]}, {"zh": "没问题！大家打包面包和糕点的时候必须戴手套吗？", "note": "Selvfølgelig seˈfølˀəli（注意 v 和两个 g 均不发音！）；handsker ˈhansgɐ（-nd- 的 d 不发音）。", "segs": [{"id": "dialog-6", "who": "Lukas", "da": "Selvfølgelig! Skal man bruge handsker, når man pakker brød og kager?", "a": "5e022409d3cfe177", "dur": 3.48}]}, {"zh": "是的，永远要用面包夹或手套。还有，记得面带微笑友善地面对顾客！", "note": "brug ˈbʁuːˀ（祈使句，g 静音且带喉塞音！）；tang ˈtʰaŋˀ；venligt ˈvɛnli（-igt 的 g 和 t 均不发音）。", "segs": [{"id": "dialog-7", "who": "Mette", "da": "Ja, brug altid en tang eller handsker. Og husk at smile venligt til kunderne!", "a": "e809a7f6793f6832", "dur": 4.8}]}, {"zh": "没问题！大家可以把手机放在口袋里吗？", "note": "mobiltelefon moˈbiːˀlˌtʰeləfoːˀn；lommen ˈlʌmən（双写 m 读单一清晰鼻音）。", "segs": [{"id": "dialog-8", "who": "Lukas", "da": "Intet problem! Må man have sin mobiltelefon i lommen?", "a": "e17df0cd1231ada6", "dur": 3.36}]}, {"zh": "不行，不可以在柜台边使用手机。请把它关掉放进柜子里！动作稍微快一点，我们五分钟后就开门营业了。", "note": "slukke ˈslɔɡə；lægge ˈlɛɡə；Skynd dig ˈsgønˀ dɑɪ̯（-nd 的 d 不发音，带喉塞音）。", "segs": [{"id": "dialog-9", "who": "Mette", "da": "Nej, man må ikke bruge mobilen ved disken. Vær sød at slukke den og lægge den i skabet! Skynd dig lidt, vi åbner om fem minutter.", "a": "72f2188d59ae1e33", "dur": 8.12}]}, {"zh": "完全没问题！我现在就关机，马上出来。", "note": "Helt i orden ˈheːˀld i ˈɒːˀdən；med det samme mɛ de ˈsamə（日常口语中 det 轻短弱读）。", "segs": [{"id": "dialog-10", "who": "Lukas", "da": "Helt i orden! Jeg slukker den nu og kommer ud med det samme.", "a": "ef38bad0b6c305d7", "dur": 3.2}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "人们，大家，一个人（泛指）", "note": "代词 · 仅作主语；宾格用 en", "segs": [{"id": "g1", "who": "narrator", "da": "man", "say": "man.", "a": "006ccde349878f65", "dur": 0.76}]}, {"zh": "面包店", "note": "名词 · bageriet, bagerier, bagerierne", "segs": [{"id": "g2", "who": "narrator", "da": "et bageri", "say": "et bageri. bageriet, bagerier, bagerie
