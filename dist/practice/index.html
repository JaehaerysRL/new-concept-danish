 "6cebf438e3c46090", "vi er kommet godt ud på landet og sidder lige nu inde i vores sommerhus med en kop varm kakao": "d6117cb22bab7826", "vejret ude ved kysten er vildt men luften er så frisk": "8df8f346d10e5f0c", "i morges gik vi en lang tur ned langs stranden": "2f73a3ebc04279c6", "i morgen kører vi op til skagen for at se grenen og på lørdag spiser vi frokost hjemme hos mikkels familie som bor ovre i nordjylland": "d7005d53648dd4c9", "vi kommer hjem til aarhus søndag aften": "c04b22a842ee87c5", "kærlig hilsen": "cb4d30c4f5968c22", "emil": "972bafb67ca80289", "et sommerhus": "fb4000683779d8c9", "et stråtag": "62f79dc63262fccc", "et hav": "1bf786b523de0e8a", "en kyst": "8f1b7646404b3bc7", "en strand": "56806b5c1b97b326", "en klit": "d4dc84af9b88c032", "en bølge": "94642a008967446f", "en brændeovn": "e61ff8e0a93cca0b", "en havn": "84c987f098a7933f", "en efterårsferie": "8f620e96b143d329", "et brætspil": "f2fb2c0b9e4eaa25", "at leje": "425e62eb2e88f739", "at tænde (op)": "b6534a246b4d105c", "at blæse": "1218ebcfda50e81d", "at bære": "bc23aa1db53c7aa8", "frisk": "bf9b8a20514359ea", "vild": "601014369841a95e"}, "key": "ncd2-L21"}, {"book": "ncd2", "lesson": 22, "title_da": "Hvordan overlever man den danske vinter?", "title_zh": "如何熬过丹麦的冬天？", "grammar": "分裂强调句初探（Kløvede sætninger）：172 强调名词/代词主宾语：Det er + 被强调成分 + der (主语) / som (宾语) + 从句语序；173 强调时间/地点/原因状语：Det er + 状语 + (at) + 从句语序", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Hvordan overlever man den danske vinter?（文化叙事短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Når december nærmer sig i Danmark, bliver dagene hurtigt meget korte.", "a": "9dcb0e5fab862a8b", "dur": 3.84}, {"id": "a2", "who": "narrator", "da": "Midt om vinteren står solen først op omkring klokken halv ni om morgenen, og den går allerede ned ved halv fire-tiden om eftermiddagen.", "a": "21a11d6cb3876bfc", "dur": 6.28}], "zh": "当丹麦的十二月临近时，白天很快就会变得非常短。隆冬时节，太阳早上八点半左右才升起，下午三点半左右就已经落山了。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "For mange nye udlændinge er det faktisk ikke kulden, [[der]] er det største problem. [[Det er mørket, der]] er sværest at vænne sig til om vinteren. **Det er især i januar og februar, at** mange savner solen og mister energien.", "a": "8aa79eb5527aa44e", "dur": 11.48}], "zh": "对许多新来的外国人来说，其实寒冷并不是最大的问题。冬天里最难适应的，正是黑暗。尤其是到了一月和二月，很多人都会想念阳光并且感到精力不足。"}, {"segs": [{"id": "a4", "who": "narrator", "da": "Heldigvis har danskerne nogle gode tricks til at overleve de mørke måneder.", "a": "1ece200283ac3736", "dur": 4.36}, {"id": "a5", "who": "narrator", "da": "For det første tænder næsten alle stearinlys i stuen for at skabe ægte hygge.", "a": "ccd17f0304a95c06", "dur": 4.6}, {"id": "a6", "who": "narrator", "da": "For det andet anbefaler lægerne, at man spiser D-vitamin hver dag, og nogle modige danskere dyrker endda vinterbadning i det iskolde hav!", "a": "0363b6ca31b82cc9", "dur": 7.72}, {"id": "a7", "who": "narrator", "da": "Til sidst er [[det ofte fællesskabet med venner og familie, som]] man husker bedst, når foråret endelig kommer tilbage.", "a": "b29e261b96c2a8dc", "dur": 5.64}], "zh": "幸好，丹麦人有一些熬过漫长黑夜月份的好妙招。首先，几乎家家户户都会在客厅里点起蜡烛，营造真正的 hygge（温馨惬意）氛围。其次，医生建议每天补充维生素 D，有些勇敢的丹麦人甚至会在冰冷的海水里冬泳！归根结底，当春天终于回来时，人们记得最清楚的往往是和朋友家人相聚的那份陪伴感。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Tre personer om deres vintertips（对标 DU3 Modul 2 Læsning Opgave 4）", "scene": null, "paras": [{"cue": "三人访谈录｜Hvordan klarer du den danske vinter?", "segs": [{"id": "b1", "who": "narrator", "da": "Mette (34 år, sygeplejerske)", "label": "A.", "a": "cb628379a761e7b3", "dur": 3.48}, {"id": "b2", "who": "narrator", "da": "Jeg hadede vinteren førhen, men for to år siden begyndte jeg at vinterbade tre gange om ugen. [[Det er det kolde vand, der]] giver mig masser af ny energi om morgenen!", "nl": true, "a": "f704157c399b550e", "dur": 8.84}, {"id": "b3", "who": "narrator", "da": "Bagefter drikker jeg varm kaffe i saunaen med de andre i klubben. **Det er kun i november, at** jeg stadig synes, det er lidt gråt.", "a": "96fff8c7628cfc69", "dur": 5.96}]}, {"segs": [{"id": "b4", "who": "narrator", "da": "Tariq (29 år, ingeniør fra Jordan)", "label": "B.", "a": "ebae76c09f02f48e", "dur": 3.56}, {"id": "b5", "who": "narrator", "da": "Da jeg kom til Danmark for tre år siden, blev jeg overrasket over, hvor tidligt det blev mørkt.", "nl": true, "a": "63de1efdfce046fe", "dur": 4.68}, {"id": "b6", "who": "narrator", "da": "Men nu ved jeg, at [[det er lys og god mad, som]] man har brug for.", "a": "368f877f7f7f57b8", "dur": 4.4}, {"id": "b7", "who": "narrator", "da": "Jeg har købt en særlig lysterapi-lampe til mit skrivebord, og hver fredag laver jeg varm krydret mad sammen med mine venner.", "a": "17e96008a874ddfa", "dur": 6.92}]}, {"segs": [{"id": "b8", "who": "narrator", "da": "Freja (24 år, studerende)", "label": "C.", "a": "23965b3f85fda3f4", "dur": 2.56}, {"id": "b9", "who": "narrator", "da": "For mig er december faktisk den hyggeligste måned på hele året. **Det er i december, at** hele byen har julelys, og jeg tænder altid mange stearinlys på mit kollegieværelse.", "nl": true, "a": "c2a0f8c3195a39bf", "dur": 9.04}, {"id": "b10", "who": "narrator", "da": "Men i februar bliver det hårdt, fordi jeg skal læse til eksamen.", "a": "58eb20b081002323", "dur": 3.32}, {"id": "b11", "who": "narrator", "da": "Så tager jeg altid et par dage til min families sommerhus eller flyver ned til solen i Spanien!", "a": "5df12c1f25c6abb4", "dur": 4.92}], "zh_all": "A. 梅特（34岁，护士）：我以前讨厌冬天，但两年前我开始每周冬泳三次。正是冰冷的海水在早上给了我满满的新能量！游完后我和俱乐部的其他人在桑拿房喝热咖啡。只有十一月我还是觉得有点灰蒙蒙的。\nB. 塔里克（29岁，来自约旦的工程师）：三年前我刚来丹麦时，对天黑得这么早感到很惊讶。但现在我知道，人们需要的正是光线和美食。我在书桌上买了一台专门的光疗灯，而且每周五我都会和朋友们一起做热腾腾的香料美食。\nC. 芙蕾雅（24岁，大学生）：对我来说，十二月其实是一年中最温馨的一个月。正是在十二月，整座城市都挂满了圣诞灯饰，我在宿舍房间里也总是点很多蜡烛。但到了二月就很难熬了，因为我要准备考试。那时我总会去我家人的度假屋住几天，或者飞去西班牙晒太阳！"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "冬天，冬季（复数去掉 e）", "note": "名词 · vinteren, vintre, vintrene", "segs": [{"id": "g1", "who": "narrator", "da": "en vinter", "say": "en vinter. vinteren, vintre, vintrene.", "a": "978740a2ea012b27", "dur": 4.48}]}, {"zh": "黑暗，昏暗", "note": "名词 · mørket, ingen flertal", "segs": [{"id": "g2", "who": "narrator", "da": "et mørke", "say": "et mørke. mørket, ingen flertal.", "a": "6860938ce2afddc8", "dur": 3.72}]}, {"zh": "寒冷", "note": "名词 · kulden, ingen flertal", "segs": [{"id": "g3", "who": "narrator", "da": "kulde (utælleligt)", "say": "kulde (utælleligt). kulden, ingen flertal.", "a": "3b8b15d6540cdb7d", "dur": 4.24}]}, {"zh": "蜡烛", "note": "名词 · stearinlyset, stearinlys, -ene", "segs": [{"id": "g4", "who": "narrator", "da": "et stearinlys", "say": "et stearinlys.", "a": "23c3ac32c9a252be", "dur": 1.6}]}, {"zh": "日出", "note": "名词 · solopgangen, solopgange, -ene", "segs": [{"id": "g5", "who": "narrator", "da": "en solopgang", "say": "en solopgang.", "a": "6082eb9cef7dc452", "dur": 1.4}]}, {"zh": "日落", "note": "名词 · solnedgangen, solnedgange, -ene", "segs": [{"id": "g6", "who": "narrator", "da": "en solnedgang", "say": "en solnedgang.", "a": "33ef1026fd6ca24f", "dur": 1.64}]}, {"zh": "冬泳（丹麦国民冬季活动）", "note": "名词 · vinterbadningen, ingen flertal", "segs": [{"id": "g7", "who": "narrator", "da": "vinterbadning", "say": "vinterbadning. vinterbadningen, ingen flertal.", "a": "f2da2cd40c44d343", "dur": 4.92}]}, {"zh": "社群，团体陪伴感", "note": "名词 · fællesskabet, fællesskaber, -erne", "segs": [{"id": "g8", "who": "narrator", "da": "et fællesskab", "say": "et fællesskab.", "a": "cf49576dea89e5c6", "dur": 1.56}]}, {"zh": "诀窍，小妙招", "note": "名词 · tricket, trick / tricks, trickene", "segs": [{"id": "g9", "who": "narrator", "da": "et trick", "say": "et trick. tricket, trick eller tricks, trickene.", "a": "da7903c53a2c2004", "dur": 5.56}]}, {"zh": "熬过，幸存", "note": "动词 · overlever, overlevede, har overlevet", "segs": [{"id": "g10", "who": "narrator", "da": "at overleve", "say": "at overleve. overlever, overlevede, har overlevet.", "a": "fa0a0dae2bd9ad4d", "dur": 5.52}]}, {"zh": "（太阳）升起；起床", "note": "动词 · står op, stod op, er stået op", "segs": [{"id": "g11", "who": "narrator", "da": "at stå op [er]", "say": "at stå op [er]. står op, stod op, er stået op.", "a": "a661fb7e7e727576", "dur": 5.96}]}, {"zh": "（太阳）落下；下降", "note": "动词 · går ned, gik ned, er gået ned", "segs": [{"id": "g12", "who": "narrator", "da": "at gå ned [er]", "say": "at gå ned [er]. går ned, gik ned, er gået ned.", "a": "506cca0e5d99a573", "dur": 5.36}]}, {"zh": "创造，营造", "note": "动词 · skaber, skabte, har skabt", "segs": [{"id": "g13", "who": "narrator", "da": "at skabe", "say": "at skabe. skaber, skabte, har skabt.", "a": "3857c0a586e75985", "dur": 3.84}]}, {"zh": "推荐，建议", "note": "动词 · anbefaler, anbefalede, har anbefalet", "segs": [{"id": "g14", "who": "narrator", "da": "at anbefale", "say": "at anbefale. anbefaler, anbefalede, har anbefalet.", "a": "0d8b0c92e1330b8c", "dur": 5.36}]}, {"zh": "失去，丧失", "note": "动词 · mister, mistede, har mistet", "segs": [{"id": "g15", "who": "narrator", "da": "at miste", "say": "at miste. mister, mistede, har mistet.", "a": "de9bf510c04ac52d", "dur": 4.88}]}, {"zh": "勇敢的", "note": "形容词/副词 · -, -e", "segs": [{"id": "g16", "who": "narrator", "da": "modig", "say": "modig.", "a": "0b4558b7fd7806fc", "dur": 1.28}]}, {"zh": "尤其是，特别是", "note": "形容词/副词 · 副词", "segs": [{"id": "g17", "who": "narrator", "da": "især", "say": "især.", "a": "6d57ed9449731159", "dur": 1.12}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en vinter", "zh": "冬天，冬季（复数去掉 e）", "forms": "vinteren, vintre, vintrene"}, {"pos": "名词", "da": "et mørke", "zh": "黑暗，昏暗", "forms": "mørket, ingen flertal"}, {"pos": "名词", "da": "kulde (utælleligt)", "zh": "寒冷", "forms": "kulden, ingen flertal"}, {"pos": "名词", "da": "et stearinlys", "zh": "蜡烛", "forms": "stearinlyset, stearinlys, -ene"}, {"pos": "名词", "da": "en solopgang", "zh": "日出", "forms": "solopgangen, solopgange, -ene"}, {"pos": "名词", "da": "en solnedgang", "zh": "日落", "forms": "solnedgangen, solnedgange, -ene"}, {"pos": "名词", "da": "vinterbadning", "zh": "冬泳（丹麦国民冬季活动）", "forms": "vinterbadningen, ingen flertal"}, {"pos": "名词", "da": "et fællesskab", "zh": "社群，团体陪伴感", "forms": "fællesskabet, fællesskaber, -erne"}, {"pos": "名词", "da": "et trick", "zh": "诀窍，小妙招", "forms": "tricket, trick / tricks, trickene"}, {"pos": "动词", "da": "at overleve", "zh": "熬过，幸存", "forms": "overlever, overlevede, har overlevet"}, {"pos": "动词", "da": "at stå op [er]", "zh": "（太阳）升起；起床", "forms": "står op, stod op, er stået op"}, {"pos": "动词", "da": "at gå ned [er]", "zh": "（太阳）落下；下降", "forms": "går ned, gik ned, er gået ned"}, {"pos": "动词", "da": "at skabe", "zh": "创造，营造", "forms": "skaber, skabte, har skabt"}, {"pos": "动词", "da": "at anbefale", "zh": "推荐，建议", "forms": "anbefaler, anbefalede, har anbefalet"}, {"pos": "动词", "da": "at miste", "zh": "失去，丧失", "forms": "mister, mistede, har mistet"}, {"pos": "形容词/副词", "da": "modig / især", "zh": "勇敢的 / 尤其是，特别是", "forms": "modigt (-, -e) / 副词"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "在丹麦，冬天最难熬的是黑暗，而不是寒冷。", "answer": "I Danmark er det mørket, der er sværest om vinteren, og ikke kulden."}, {"zh": "正是在一月，很多人最想念阳光。", "answer": "Det er især i januar, at mange savner solen mest."}, {"zh": "我最喜欢丹麦冬天的，正是家里点蜡烛的 hygge 氛围。", "answer": "Det er hyggen med stearinlys derhjemme, som jeg bedst kan lide ved den danske vinter."}, {"zh": "是梅特（Mette）每周冬泳三次。（强调主语“是梅特”）", "answer": "Det er Mette, der vinterbader tre gange om ugen."}, {"zh": "我不是在十二月，而是在二月感到疲惫。（Det er ikke..., men...）", "answer": "Det er ikke i december, men i februar, at jeg bliver træt."}]}, {"id": "A", "type": "drill", "title": "练习 A：用 der, som 或 at 填空（如可省略 som/at 请加括号标注；注意区分主语、宾语和状语）", "items": [{"prompt": "Det er det kolde vejr, {{_}} gør det svært at cykle i januar.", "kind": "cloze", "blanks": [["der"]], "explain": "作主语，也可用 ⟦som⟧"}, {"prompt": "Det er især julelysene, {{_}} jeg bedst kan lide ved december.", "kind": "cloze", "blanks": [["(som)"]], "explain": "作 ⟦kan lide⟧ 的宾语，必须用 ⟦som⟧，不可用 ⟦der⟧"}, {"prompt": "Det er om morgenen, {{_}} mange danskere tager D-vitamin.", "kind": "cloze", "blanks": [["(at)"]], "explain": "强调时间状语 ⟦om morgenen⟧，用 ⟦at⟧ 或省略"}, {"prompt": "Det er ikke sneen, {{_}} er problemet, men blæsten og mørket.", "kind": "cloze", "blanks": [["der"]], "explain": "作主语"}, {"prompt": "Det var for to år siden, {{_}} Mette begyndte at vinterbade.", "kind": "cloze", "blanks": [["(at)"]], "explain": "强调过去时间状语，用 ⟦at⟧ 或省略"}, {"prompt": "Det er mine gode venner på sprogskolen, {{_}} hjælper mig mest.", "kind": "cloze", "blanks": [["der"]], "explain": "作主语"}, {"prompt": "Det er varme stearinlys, {{_}} næsten alle tænder i stuen.", "kind": "cloze", "blanks": [["(som)"]], "explain": "作 ⟦tænder⟧ 的宾语"}, {"prompt": "Det er på grund af eksamen, {{_}} Freja bliver træt i februar.", "kind": "cloze", "blanks": [["(at)"]], "explain": "强调原因状语 ⟦på grund af eksamen⟧，用 ⟦at⟧ 或省略"}]}, {"id": "B", "type": "drill", "title": "练习 B：将普通句改写为分裂强调句，突出下划线成分（注意时态和连接词）", "items": [{"prompt": "⟦{{_}} giver mange mennesker mindre energi.⟧ → ⟦Det er...⟧", "kind": "cloze", "blanks": [["Det er mørket, der giver mange mennesker mindre energi."]]}, {"prompt": "⟦Danskerne elsker {{_}} om vinteren.⟧ → ⟦Det er...⟧", "kind": "cloze", "blanks": [["Det er stearinlys og hygge, (som) danskerne elsker om vinteren."]]}, {"prompt": "⟦Jeg savner min familie mest {{_}}.⟧ → ⟦Det er...⟧", "kind": "cloze", "blanks": [["Det er i december, (at) jeg savner min familie mest."]]}, {"prompt": "⟦{{_}} købte en særlig lampe til sit skrivebord i fjor.⟧ → ⟦Det var...⟧", "kind": "cloze", "blanks": [["Det var Tariq, der købte en særlig lampe til sit skrivebord i fjor."]]}, {"prompt": "⟦Hun flyver ikke til Spanien {{_}}.⟧（改成否定强调：“不是在夏天……”）→ ⟦Det er ikke...⟧", "kind": "cloze", "blanks": [["Det er ikke om sommeren, (at) hun flyver til Spanien."]]}, {"prompt": "⟦{{_}} får mig ikke til at fryse.⟧ → ⟦Det er...⟧", "kind": "cloze", "blanks": [["Det er fællesskabet i klubben, der ikke får mig til at fryse."]], "explain": "注意否定词 ⟦ikke⟧ 放在从句动词 ⟦får⟧ 前！"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（使用本课分裂强调句）", "items": [{"prompt": "在丹麦，冬天最难熬的是黑暗，而不是寒冷。", "kind": "write", "accept": ["I Danmark er det mørket, der er sværest om vinteren, og ikke kulden."]}, {"prompt": "正是在一月，很多人最想念阳光。", "kind": "write", "accept": ["Det er især i januar, at mange savner solen mest."]}, {"prompt": "我最喜欢丹麦冬天的，正是家里点蜡烛的 ⟦hygge⟧ 氛围。", "kind": "write", "accept": ["Det er hyggen med stearinlys derhjemme, som jeg bedst kan lide ved den danske vinter."]}, {"prompt": "是梅特（Mette）每周冬泳三次。（强调主语“是梅特”）", "kind": "write", "accept": ["Det er Mette, der vinterbader tre gange om ugen."]}, {"prompt": "我不是在十二月，而是在二月感到疲惫。（⟦Det er ikke..., men...⟧）", "kind": "write", "accept": ["Det er ikke i december, men i februar, at jeg bliver træt."]}]}], "clips": {"når december nærmer sig i danmark bliver dagene hurtigt meget korte": "9dcb0e5fab862a8b", "midt om vinteren står solen først op omkring klokken halv ni om morgenen og den går allerede ned ved halv fire-tiden om eftermiddagen": "21a11d6cb3876bfc", "for mange nye udlændinge er det faktisk ikke kulden der er det største problem det er mørket der er sværest at vænne sig til om vinteren det er især i januar og februar at mange savner solen og mister energien": "8aa79eb5527aa44e", "heldigvis har danskerne nogle gode tricks til at overleve de mørke måneder": "1ece200283ac3736", "for det første tænder næsten alle stearinlys i stuen for at skabe ægte hygge": "ccd17f0304a95c06", "for det andet anbefaler lægerne at man spiser d-vitamin hver dag og nogle modige danskere dyrker endda vinterbadning i det iskolde hav": "0363b6ca31b82cc9", "til sidst er det ofte fællesskabet med venner og familie som man husker bedst når foråret endelig kommer tilbage": "b29e261b96c2a8dc", "mette (34 år sygeplejerske)": "cb628379a761e7b3", "jeg hadede vinteren førhen men for to år siden begyndte jeg at vinterbade tre gange om ugen det er det kolde vand der giver mig masser af ny energi om morgenen": "f704157c399b550e", "bagefter drikker jeg varm kaffe i saunaen med de andre i klubben det er kun i november at jeg stadig synes det er lidt gråt": "96fff8c7628cfc69", "tariq (29 år ingeniør fra jordan)": "ebae76c09f02f48e", "da jeg kom til danmark for tre år siden blev jeg overrasket over hvor tidligt det blev mørkt": "63de1efdfce046fe", "men nu ved jeg at det er lys og god mad som man har brug for": "368f877f7f7f57b8", "jeg har købt en særlig lysterapi-lampe til mit skrivebord og hver fredag laver jeg varm krydret mad sammen med mine venner": "17e96008a874ddfa", "freja (24 år studerende)": "23965b3f85fda3f4", "for mig er december faktisk den hyggeligste måned på hele året det er i december at hele byen har julelys og jeg tænder altid mange stearinlys på mit kollegieværelse": "c2a0f8c3195a39bf", "men i februar bliver det hårdt fordi jeg skal læse til eksamen": "58eb20b081002323", "så tager jeg altid et par dage til min families sommerhus eller flyver ned til solen i spanien": "5df12c1f25c6abb4", "en vinter": "978740a2ea012b27", "et mørke": "6860938ce2afddc8", "kulde (utælleligt)": "3b8b15d6540cdb7d", "et stearinlys": "23c3ac32c9a252be", "en solopgang": "6082eb9cef7dc452", "en solnedgang": "33ef1026fd6ca24f", "vinterbadning": "f2da2cd40c44d343", "et fællesskab": "cf49576dea89e5c6", "et trick": "da7903c53a2c2004", "at overleve": "fa0a0dae2bd9ad4d", "at stå op er": "a661fb7e7e727576", "at gå ned er": "506cca0e5d99a573", "at skabe": "3857c0a586e75985", "at anbefale": "0d8b0c92e1330b8c", "at miste": "de9bf510c04ac52d", "modig": "0b4558b7fd7806fc", "især": "6d57ed9449731159"}, "key": "ncd2-L22"}, {"book": "ncd2", "lesson": 23, "title_da": "Et uventet møde på loppemarkedet", "title_zh": "跳蚤市场上的意外重逢", "grammar": "直接引语转间接引语（Indirekte tale）全面梳理：172 陈述句转 sagde/fortalte, at...；173 是非问句转 spurgte, om...；174 特殊问句转 spurgte, hv-...；175 从句语序（ikke/altid 前置）与时态后移（现在时 → 过去时，现在完成时 → 过去完成时）", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Et uventet møde på loppemarkedet（叙事短文 · 约 150 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "I søndags gik Emma en tur på et stort loppemarked på Ingerslevs Boulevard i Aarhus for at lede efter en gammel bordlampe.", "a": "0bc7df06c1529383", "dur": 6.28}, {"id": "a2", "who": "narrator", "da": "Pludselig hørte hun nogen råbe hendes navn.", "a": "cc01729d6e7d2188", "dur": 2.64}, {"id": "a3", "who": "narrator", "da": "Da hun vendte sig om, fik hun øje på Marco, en tidligere klassekammerat fra sprogskolen, som hun ikke havde set i et helt år!", "a": "688eda9067ad91ff", "dur": 6.76}], "zh": "上周日，艾玛去奥胡斯英格斯莱夫林荫大道上的大型跳蚤市场闲逛，想找一盏旧台灯。突然她听到有人喊她的名字。当她转过身时，她一眼认出了马可——语言学校的一位老同学，她已经整整一年没见过他了！"}, {"segs": [{"id": "a4", "who": "narrator", "da": "De blev begge to meget overraskede, købte to kopper kaffe i en lille bod og snakkede sammen i en halv time.", "a": "b55de346cbbc954b", "dur": 5.64}], "zh": "两人都非常惊喜，在一个小摊位买了两杯咖啡，一起聊了半个小时。"}, {"segs": [{"id": "a5", "who": "narrator", "da": "Da Emma kom hjem, fortalte hun straks sin veninde Sofie om det uventede møde.", "a": "f8d985a1cac16a28", "dur": 4.56}, {"id": "a6", "who": "narrator", "da": "Emma sagde, [[at]] Marco **var flyttet** til Odense for et halvt år siden, fordi han **havde fået** et nyt job som softwareudvikler.", "a": "81ea2f9881d2add3", "dur": 6.16}, {"id": "a7", "who": "narrator", "da": "Han fortalte også, [[at]] han **stadig cyklede** på arbejde hver dag, selvom han **ikke savnede** den stærke blæst i Aarhus.", "a": "8a86bedab8f67287", "dur": 5.52}, {"id": "a8", "who": "narrator", "da": "Til sidst spurgte Marco Emma, [[om]] hun stadig **boede** i den samme lejlighed, og [[hvornår]] hun **skulle** tage sin Modul 2-prøve.", "a": "3836418c93617293", "dur": 6.6}], "zh": "艾玛一回到家，就立刻把这次意外重逢讲给了合租室友索菲听。艾玛说，马可半年前搬去了欧登塞，因为他在那里找到了一份软件开发工程师的新工作。他还说，他现在依然每天骑车上班，尽管他并不想念奥胡斯的大风。最后，马可问艾玛是不是还住在同一套公寓里，以及她什么时候去考 Modul 2。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Direkte tale vs Indirekte tale（对标 DU3 Modul 2 直接/间接引语对比与转换）", "scene": null, "paras": [{"cue": "原文对话 vs 转述对比｜Samtalen på loppemarkedet", "segs": [{"id": "b1", "who": "Marco", "da": "”Jeg er flyttet til Odense, fordi jeg har fået et nyt job.”", "label": "Marco", "a": "adb3fc8f2805797e", "dur": 2.56}, {"id": "b2", "who": "Marco", "da": "”Jeg savner ikke vinden i Aarhus.”", "nl": true, "label": "Marco", "a": "c36aaeac6fe498cc", "dur": 2.56}, {"id": "b3", "who": "Marco", "da": "”Bor du stadig i den samme lejlighed?”", "nl": true, "label": "Marco", "a": "2599b4c9857875ee", "dur": 1.92}, {"id": "b4", "who": "Marco", "da": "”Hvornår skal du tage din Modul 2-prøve?”", "nl": true, "label": "Marco", "a": "8db611926890a12b", "dur": 2.16}, {"id": "b5", "who": "Emma", "da": "”Hvad laver du i fritiden nu?”", "nl": true, "label": "Emma", "a": "7532463309f9d0dd", "dur": 1.76}]}, {"segs": [{"id": "b6", "who": "narrator", "da": "Marco sagde, [[at]] han **var flyttet** til Odense, fordi han **havde fået** et nyt job.", "a": "c7af5df19eadb02f", "dur": 3.52}, {"id": "b7", "who": "narrator", "da": "Han fortalte, [[at]] han **ikke savnede** vinden i Aarhus.", "nl": true, "a": "825cb5312c0051e5", "dur": 3.28}, {"id": "b8", "who": "narrator", "da": "Han spurgte, [[om]] jeg **stadig boede** i den samme lejlighed.", "nl": true, "a": "c8770247b459ed30", "dur": 2.72}, {"id": "b9", "who": "narrator", "da": "Han spurgte, [[hvornår]] jeg **skulle** tage min Modul 2-prøve.", "nl": true, "a": "ed19799c94c4274f", "dur": 2.64}, {"id": "b10", "who": "narrator", "da": "Jeg spurgte ham, [[hvad]] han **lavede** i fritiden nu.", "nl": true, "a": "fbf909ee6657e563", "dur": 2.4}], "zh_all": "直接引语 vs 间接引语对照：\n1. 马可说他搬去欧登塞了，因为他找到了一份新工作。\n2. 他说他并不想念奥胡斯的风。\n3. 他问我是不是还住在同一套公寓里。\n4. 他问我什么时候要参加 Modul 2 考试。\n5. 我问他现在业余时间都在做什么。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "跳蚤市场，二手市集", "note": "名词 · loppemarkedet, -markeder, -erne", "segs": [{"id": "g1", "who": "narrator", "da": "et loppemarked", "say": "et loppemarked.", "a": "03609297435939a9", "dur": 1.52}]}, {"zh": "相遇，会面；会议", "note": "名词 · mødet, møder, møderne", "segs": [{"id": "g2", "who": "narrator", "da": "et møde", "say": "et møde. mødet, møder, møderne.", "a": "ca251e215c11e892", "dur": 4.88}]}, {"zh": "小摊位，货摊（软 d）", "note": "名词 · boden, boder, boderne", "segs": [{"id": "g3", "who": "narrator", "da": "en bod", "say": "en bod. boden, boder, boderne.", "a": "c77c98fb7993906b", "dur": 4.36}]}, {"zh": "台灯", "note": "名词 · bordlampen, bordlamper, -erne", "segs": [{"id": "g4", "who": "narrator", "da": "en bordlampe", "say": "en bordlampe.", "a": "fca4f75125eb1acd", "dur": 1.6}]}, {"zh": "同班同学", "note": "名词 · klassekammeraten, -er, -erne", "segs": [{"id": "g5", "who": "narrator", "da": "en klassekammerat", "say": "en klassekammerat.", "a": "b99f03e84dab6145", "dur": 1.8}]}, {"zh": "软件开发工程师", "note": "名词 · softwareudvikleren, -e, -ne", "segs": [{"id": "g6", "who": "narrator", "da": "en softwareudvikler", "say": "en softwareudvikler.", "a": "e573169669e4d078", "dur": 1.64}]}, {"zh": "说（sagde 读 ˈsæːə）", "note": "动词 · siger, sagde, har sagt", "segs": [{"id": "g7", "who": "narrator", "da": "at sige", "say": "at sige. siger, sagde, har sagt.", "a": "10643526d539af6e", "dur": 4.56}]}, {"zh": "告诉，讲述", "note": "动词 · fortæller, fortalte, har fortalt", "segs": [{"id": "g8", "who": "narrator", "da": "at fortælle", "say": "at fortælle. fortæller, fortalte, har fortalt.", "a": "acab91af7e306e64", "dur": 4.88}]}, {"zh": "询问（spurgte 中 g 不发音）", "note": "动词 · spørger, spurgte, har spurgt", "segs": [{"id": "g9", "who": "narrator", "da": "at spørge", "say": "at spørge. spørger, spurgte, har spurgt.", "a": "fafb41270fea3013", }} der havde ringet på døren om formiddagen.", "kind": "cloze", "blanks": [["hvem"]], "explain": "注意后面已有 ⟦der⟧，⟦hvem der⟧ 一起充当从句主语"}, {"prompt": "Jeg kan ikke huske, {{_}} butikken lukker klokken fem eller seks.", "kind": "cloze", "blanks": [["om"]], "explain": "是否，常配合 ⟦eller⟧"}, {"prompt": "Læreren sagde, {{_}} vi ikke behøvede at købe en ny ordbog.", "kind": "cloze", "blanks": [["at"]], "explain": "陈述内容，注意 ⟦ikke⟧ 在 ⟦behøvede⟧ 前"}, {"prompt": "Marco spurgte, {{_}} Emma havde købt på loppemarkedet.", "kind": "cloze", "blanks": [["hvad"]], "explain": "询问买了什么"}, {"prompt": "Hun spurgte tjeneren, {{_}} kaffen kostede.", "kind": "cloze", "blanks": [["hvad"]], "explain": "注意固定问价表达：⟦Hvad koster...?⟧ → ⟦hvad kaffen kostede⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：将下列直接引语改为以过去时开头的间接引语（注意连词、时态后移与语序）", "items": [{"prompt": "Marco sagde til Emma: ”Jeg arbejder ikke på lørdag.” → ⟦Marco sagde til Emma, at...⟧", "kind": "write", "accept": ["Marco sagde til Emma, at han ikke arbejdede på lørdag."], "explain": "⟦ikke⟧ 前移 + 现在时退一般过去时"}, {"prompt": "Emma spurgte Marco: ”Har du allerede fundet en god lejlighed?” → ⟦Emma spurgte Marco, om...⟧", "kind": "write", "accept": ["Emma spurgte Marco, om han allerede havde fundet en god lejlighed."], "explain": "完成时退过去完成时"}, {"prompt": "Marco spurgte Emma: ”Hvordan går det med dit danskstudie?” → ⟦Marco spurgte Emma, hvordan...⟧", "kind": "write", "accept": ["Marco spurgte Emma, hvordan det gik med hendes danskstudie."], "explain": "注意取消倒装 + ⟦dit⟧ 改 ⟦hendes⟧"}, {"prompt": "Sofie fortalte: ”Jeg har købt to gamle stole på markedet.” → ⟦Sofie fortalte, at...⟧", "kind": "write", "accept": ["Sofie fortalte, at hun havde købt to gamle stole på markedet."]}, {"prompt": "Læreren spurgte os: ”Kan I altid forstå danskerne på gaden?” → ⟦Læreren spurgte os, om...⟧", "kind": "write", "accept": ["Læreren spurgte os, om vi altid kunne forstå danskerne på gaden."], "explain": "⟦altid⟧ 前移 + ⟦kan⟧ 退 ⟦kunne⟧"}, {"prompt": "Peter spurgte sin ven: ”Hvad vil du lave næste sommer?” → ⟦Peter spurgte sin ven, hvad...⟧", "kind": "write", "accept": ["Peter spurgte sin ven, hvad han ville lave næste sommer."]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（转述对话高分句）", "items": [{"prompt": "马可告诉艾玛，他去年搬去欧登塞了。", "kind": "write", "accept": ["Marco fortalte Emma, at han var flyttet (eller flyttede) til Odense sidste år."]}, {"prompt": "他说他现在并不想念旧公寓。", "kind": "write", "accept": ["Han sagde, at han ikke savnede den gamle lejlighed nu."]}, {"prompt": "艾玛问马可是否还经常踢足球。", "kind": "write", "accept": ["Emma spurgte Marco, om han stadig ofte spillede fodbold."]}, {"prompt": "索菲问我昨天在跳蚤市场上买了什么。", "kind": "write", "accept": ["Sofie spurgte mig, hvad jeg havde købt på loppemarkedet i går."]}, {"prompt": "老师问我们什么时候参加 Modul 2 考试。", "kind": "write", "accept": ["Læreren spurgte os, hvornår vi skulle tage Modul 2-prøven."]}]}], "clips": {"i søndags gik emma en tur på et stort loppemarked på ingerslevs boulevard i aarhus for at lede efter en gammel bordlampe": "0bc7df06c1529383", "pludselig hørte hun nogen råbe hendes navn": "cc01729d6e7d2188", "da hun vendte sig om fik hun øje på marco en tidligere klassekammerat fra sprogskolen som hun ikke havde set i et helt år": "688eda9067ad91ff", "de blev begge to meget overraskede købte to kopper kaffe i en lille bod og snakkede sammen i en halv time": "b55de346cbbc954b", "da emma kom hjem fortalte hun straks sin veninde sofie om det uventede møde": "f8d985a1cac16a28", "emma sagde at marco var flyttet til odense for et halvt år siden fordi han havde fået et nyt job som softwareudvikler": "81ea2f9881d2add3", "han fortalte også at han stadig cyklede på arbejde hver dag selvom han ikke savnede den stærke blæst i aarhus": "8a86bedab8f67287", "til sidst spurgte marco emma om hun stadig boede i den samme lejlighed og hvornår hun skulle tage sin modul 2-prøve": "3836418c93617293", "jeg er flyttet til odense fordi jeg har fået et nyt job": "adb3fc8f2805797e", "jeg savner ikke vinden i aarhus": "c36aaeac6fe498c  må sætte ikke efter verbet i en ledsætning.", "a": "4ad1dc62a50d9532", "dur": 9.92}], "zh": "上周，艾玛终于参加了她的 Modul 2 考试，昨天她收到了自己已经通过的通知！半年前刚开始学 Modul 2 时，每当丹麦人说得很快，她几乎什么都听不懂；而且她总是忘记，在从句里不能把 ikke 放在动词后面。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Siden da har hun arbejdet hårdt og lært af [[sine]] fejl.", "a": "17d40b26f3d5e1d6", "dur": 3.44}, {"id": "a4", "who": "narrator", "da": "Nu ved hun, at [[det først og fremmest er daglig øvelse, der]] gør en stor forskel.", "a": "ec6ee00a9c906c99", "dur": 4.44}], "zh": "从那时起，她努力学习并从自己的错误中不断汲取经验。现在她明白，正是每天的坚持练习才带来了巨大的改变。"}, {"segs": [{"id": "a5", "who": "narrator", "da": "I går aftes fejrede Emma og **hendes** veninde Sofie det gode resultat på en hyggelig café, hvor de talte om **deres** planer for fremtiden.", "a": "9da668d7f9d7c048", "dur": 6.8}, {"id": "a6", "who": "narrator", "da": "Emma fortalte, at hun nu føler sig meget mere selvsikker, end hun var for et halvt år siden.", "a": "c12c5abe135fefc6", "dur": 5.28}, {"id": "a7", "who": "narrator", "da": "Næste måned starter hun på Modul 3, hvor der **tales** mere om arbejde og samfund, og hvor sværere regler som passiv **bliver brugt** i teksterne.", "a": "0a6df59282e163bc", "dur": 8.56}, {"id": "a8", "who": "narrator", "da": "Inden det nye hold begynder, vil Emma dog køre en tur [[op til]] Skagen for at slappe af!", "a": "8f5568c94df1ea2e", "dur": 4.68}], "zh": "昨晚，艾玛和她的好朋友索菲在一家温馨的咖啡馆庆祝了这个好成绩，并聊起了她们对未来的规划。艾玛说，与半年前相比，她现在感到自信多了。下个月她就要进入 Modul 3 了，在那里大家会更多地谈论工作与丹麦社会，像被动语态这样更进阶的规则也会被运用到课文中。不过，在新班级开课之前，艾玛想先北上去一趟斯卡恩好好放松一下！"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：DU3 Modul 2 结业模考（117 词毕业邮件 + 十关综合闯关）", "scene": null, "paras": [{"cue": "DU3 Modul 2 结业满分邮件范本（117 词）｜Til: Lærer Mette Emne: Tak for Modul 2 og mine planer", "segs": [{"id": "b1", "who": "narrator", "da": "Kære Mette", "a": "2329950d7e64b5ad", "dur": 1.24}]}, {"segs": [{"id": "b2", "who": "narrator", "da": "Jeg skriver til dig, fordi jeg lige har set, at jeg har bestået min Modul 2-prøve!", "a": "6254d34c1fc4db70", "dur": 3.64}, {"id": "b3", "who": "narrator", "da": "Tusind tak for din tålmodighed og alle de gode timer i klassen.", "a": "539f5e601796bf98", "dur": 3.92}]}, {"segs": [{"id": "b4", "who": "narrator", "da": "Da jeg begyndte på holdet i januar, syntes jeg, at udtale og ledsætninger var sværest. [[Det var især ordstillingen med ikke, som]] jeg kæmpede med i starten.", "a": "e5d7d5546d3e4f23", "dur": 9.6}, {"id": "b5", "who": "narrator", "da": "Men efter at vi havde øvet os så meget på e-mails og samtaler, blev det hele meget lettere.", "a": "c15515df50020966", "dur": 6.28}]}, {"segs": [{"id": "b6", "who": "narrator", "da": "Nu glæder jeg mig til at fortsætte på Modul 3 næste måned.", "a": "d2d53beda4aa4b1b", "dur": 3.36}, {"id": "b7", "who": "narrator", "da": "Jeg håber, at jeg snart kan finde et spændende studiejob, hvor der **bliver talt** dansk hver dag, så jeg kan udvikle mit sprog endnu mere.", "a": "7b5259bdfc683d6e", "dur": 6.56}]}, {"segs": [{"id": "b8", "who": "narrator", "da": "Venlig hilsen", "a": "c764113a98cff49f", "dur": 1.32}, {"id": "b9", "who": "narrator", "da": "Emma", "nl": true, "a": "a18bb2401c908929", "dur": 1.24}], "zh_all": "给梅特老师的结业致谢邮件：亲爱的梅特，我写信给你，是因为我刚刚查到自己通过了 Modul 2 考试！万分感谢你的耐心以及课堂上所有精彩的课程。一月份我刚进这个班时，觉得发音和从句最难。一开始，尤其是带 ikke 的词序让我挣扎了很久。但在我们大量练习了邮件写作与对话之后，一切都变得轻松多了。现在我很期待下个月继续学习 Modul 3。我希望很快能找到一份有趣的实习兼职（studiejob），在那里每天都说丹麦语，这样我就能进一步提升自己的语言水平。诚挚的问候，艾玛。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "回顾，回眸", "note": "名词 · tilbageblikket, tilbageblik, -kene", "segs": [{"id": "g1", "who": "narrator", "da": "et tilbageblik", "say": "et tilbageblik.", "a": "3d5ca0008dd39d89", "dur": 1.56}]}, {"zh": "未来计划，规划", "note": "名词 · fremtidsplanen, -planer, -erne", "segs": [{"id": "g2", "who": "narrator", "da": "en fremtidsplan", "say": "en fremtidsplan.", "a": "0c960e4cea1e23db", "dur": 1.56}]}, {"zh": "差异，区别（ }

    if (!clip || badClips.has(clip)) {

  return h('div', { class: 'kbd' }, ['æ', 'ø', 'å'].map(c => h('button', { type: 'button', tabindex: '-1', 'aria-label': `插入 ${c}`,
    onmousedown: (e) => e.preventDefault(), onclick: () => insert(c) }, c)));
}

/* ---------- state ---------- */
const state = { lesson: null, sid: null, idx: {} };
function section() { return state.lesson.sections.find(s => s.id === state.sid); }
function sectionScore(s) {
  if (s.type === 'text') return '';
  const p = prog(s.id);
  if (s.type === 'flashcards') return `${Object.keys(p.known || {}).length}/${s.cards.length}`;
  return `${Object.values(p.res || {}).filter(Boolean).length}/${s.items.length}`;
}

/* ---------- layout ---------- */
function renderLessonNav() {
  const i = LESSONS.indexOf(state.lesson);
  const select = h('select', { 'aria-label': '选择课程', onchange: (e) => openLesson(e.target.value) },
    Object.keys(BOOK_NAMES).filter(b => LESSONS.some(l => l.book === b)).map(b =>
      h('optgroup', { label: BOOK_NAMES[b] }, LESSONS.filter(l => l.book === b).map(l =>
        h('option', { value: l.key, selected: l === state.lesson }, `L${String(l.lesson).padStart(2, '0')} ${l.title_da}`)))));
  $('#lessonNav').replaceChildren(
    h('button', { type: 'button', 'aria-label': '上一课', disabled: i <= 0, onclick: () => openLesson(LESSONS[i - 1].key) }, '‹'),
    select,
    h('button', { type: 'button', 'aria-label': '下一课', disabled: i >= LESSONS.length - 1, onclick: () => openLesson(LESSONS[i + 1].key) }, '›'),
  );
}
function renderHeader() {
  const L = state.lesson;
  $('#hdr').replaceChildren(...present(
    h('div', { class: 'eyebrow' }, `${BOOK_NAMES[L.book] || L.book.toUpperCase()} · Lektion ${L.lesson}`),
    h('h1', {}, L.title_da),
    L.title_zh ? h('div', { class: 'zh' }, L.title_zh) : null,
    L.grammar ? h('div', { class: 'grammar' }, '本课语法：' + unmark(L.grammar)) : null,
  ));
  document.title = `L${L.lesson} ${L.title_da} · NCD 交互练习`;
}
function tabLabel(s) { return s.tab || s.title.split('：')[0].replace(/（.*$/, ''); }
function renderTabs() {
  $('#tabs').replaceChildren(...state.lesson.sections.map(s =>
    h('button', { role: 'tab', type: 'button', 'aria-selected': String(s.id === state.sid), onclick: () => openSection(s.id) },
      tabLabel(s), h('span', { class: 'score' }, sectionScore(s)))));
}
function openLesson(key) {
  state.lesson = LESSONS.find(l => l.key === key) || LESSONS[0];
  state.idx = {};
  renderLessonNav();
  renderHeader();
  openSection(state.lesson.sections[0].id);
  window.scrollTo(0, 0);
}
function openSection(sid) {
  stopAll();
  state.sid = sid;
  if (state.idx[sid] == null) state.idx[sid] = 0;
  try { localStorage.setItem(STORE_KEY + ':last', `${state.lesson.key}/${sid}`); } catch (e) {}
  renderTabs();
  renderPanel();
}
function renderPanel() {
  const s = section();
  const panel = $('#panel');
  panel.replaceChildren(...present(
    h('h2', {}, ...rich(s.title)),
    s.instruction ? h('p', { class: 'instruction' }, s.instruction) : null,
    s.scene ? h('p', { class: 'instruction' }, s.scene) : null,
    s.example ? h('p', { class: 'example' }, '例：' + unmark(s.example)) : null,
    s.open ? h('p', { class: 'instruction' }, '本组为开放式改写，参考答案不是唯一答案：意思和语法正确即可点“我的答案也对”。') : null,
  ));
  if (s.type === 'text') return renderText(s, panel);
  if (s.type === 'flashcards') return renderFlashcards(s, panel);
  if (s.type === 'order') return renderOrder(s, panel);
  const it = s.items[state.idx[s.id]];
  if (s.type === 'drill' && it.kind === 'cloze') return renderCloze(s, panel);
  return renderTyped(s, panel);
}
function pager(s, panel) {
  const p = prog(s.id).res || {}, n = s.items.length, i = state.idx[s.id];
  const go = (j) => { state.idx[s.id] = Math.max(0, Math.min(n - 1, j)); renderPanel(); };
  panel.append(h('div', { class: 'pager' },
    h('button', { class: 'btn ghost', type: 'button', disabled: i === 0, onclick: () => go(i - 1) }, '← 上一题'),
    h('div', { class: 'dots' }, s.items.map((_, j) =>
      h('button', { type: 'button', 'aria-label': `第 ${j + 1} 题`,
        class: 'dot' + (p[j] === true ? ' ok' : p[j] === false ? ' bad' : '') + (j === i ? ' cur' : ''),
        onclick: () => go(j) }))),
    h('button', { class: 'btn ghost', type: 'button', disabled: i === n - 1, onclick: () => go(i + 1) }, '下一题 →'),
  ));
}
function record(s, i, ok) {
  const p = prog(s.id);
  p.res = p.res || {};
  p.res[i] = ok;
  save();
  renderTabs();
  const dot = document.querySelectorAll('#panel .dot')[i];
  if (dot) { dot.classList.remove('ok', 'bad'); dot.classList.add(ok ? 'ok' : 'bad'); }
}
function next(s) {
  if (state.idx[s.id] < s.items.length - 1) { state.idx[s.id]++; renderPanel(); }
}
const counter = (s) => h('div', { class: 'counter' }, `第 ${state.idx[s.id] + 1} / ${s.items.length} 题`);
const isLast = (s) => state.idx[s.id] === s.items.length - 1;

/* ---------- typed answers: transform / correct / translate / drill-write ---------- */
function typedConfig(s, it) {
  if (s.type === 'transform') return {
    prompt: h('p', { class: 'prompt' }, h('span', { class: 'da' }, it.source), speakBtn(it.source)),
    stem: it.stem, accept: it.accept, hint: it.hint,
  };
  if (s.type === 'correct') return {
    prompt: h('p', { class: 'prompt' }, h('span', { class: 'wrong' }, it.wrong)),
    accept: it.accept, prefill: it.wrong, explain: it.explain,
  };
  if (s.type === 'translate') return {
    prompt: h('p', { class: 'prompt' }, h('span', { class: 'zhq' }, it.zh)),
    accept: it.accept, selfJudge: true,
  };
  return { // drill / write
    prompt: h('p', { class: 'prompt' }, ...rich(it.prompt)),
    accept: it.accept, prefill: it.prefill, explain: it.explain, selfJudge: true,
  };
}
function renderTyped(s, panel) {
  const i = state.idx[s.id], it = s.items[i], cfg = typedConfig(s, it);
  const stem = cfg.stem || null;
  // with a stem, accept either the clause alone or the whole sentence
  const accepts = stem ? cfg.accept.concat(cfg.accept.map(a => `${stem} ${a}`)) : cfg.accept;
  const withStem = (a) => (stem && !norm(a, false).startsWith(norm(stem, false)) ? `${stem} ${a}` : a);

  const input = h('input', { class: 'answer', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', lang: 'da',
    'aria-label': '你的答案', placeholder: stem ? '接着写从句…' : '输入丹麦语…' });
  if (cfg.prefill) input.value = unmark(cfg.prefill);
  const fb = h('div', { class: 'feedback', role: 'status' });
  const hint = cfg.hint ? h('div', { class: 'hint' }, '💡 ' + cfg.hint) : null;
  let checked = false;

  function show(res, gaveUp) {
    checked = true;
    const answer = withStem(res.match);
    input.classList.toggle('is-ok', res.ok); input.classList.toggle('is-bad', !res.ok);
    fb.className = 'feedback show ' + (res.ok ? 'ok' : 'bad');
    const title = res.ok ? (res.self ? '✓ 已记为正确' : res.commaNote ? '✓ 正确（只差逗号）' : '✓ 正确！')
      : (gaveUp ? '参考答案' : (s.open ? '与参考答案不同' : '✗ 还不对'));
    const rows = [h('div', { class: 'title' }, title)];
    if (!res.ok && !gaveUp) {
      const d = diffView(withStem(input.value), answer);
      rows.push(h('div', { class: 'row' }, h('span', { class: 'label' }, '你的答案'), d.mine));
      rows.push(h('div', { class: 'row' }, h('span', { class: 'label' }, '参考答案'), d.ref, speakBtn(answer)));
    } else {
      rows.push(h('div', { class: 'row' }, h('span', { class: 'sent' }, answer), speakBtn(answer)));
    }
    const others = cfg.accept.filter(a => withStem(a) !== answer);
    if (others.length) rows.push(h('div', { class: 'row' }, h('span', { class: 'label' }, '也可以'), h('span', { class: 'sent' }, others.map(withStem).join(' / '))));
    if (cfg.explain) rows.push(h('div', { class: 'explain' }, '📌 ', ...rich(cfg.explain)));
    if (cfg.hint && !res.ok) rows.push(h('div', { class: 'explain' }, '💡 ' + cfg.hint));
    if (!res.ok && !gaveUp && cfg.selfJudge) {
      rows.push(h('button', { class: 'btn self', type: 'button', onclick: () => { record(s, i, true); show({ ...res, ok: true, self: true }, false); } },
        '我的答案也对 ✓'));
    }
    fb.replaceChildren(...rows);
    checkBtn.textContent = isLast(s) ? '本节完成' : '下一题 →';
    checkBtn.disabled = isLast(s);
  }
  function check() {
    if (checked) return next(s);
    if (!input.value.trim()) { input.focus(); return; }
    const res = grade(input.value, accepts);
    record(s, i, res.ok);
    show(res, false);
  }
  const checkBtn = h('button', { class: 'btn primary', type: 'button', onclick: check }, '检查');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  input.addEventListener('input', () => {
    if (!checked) return;
    checked = false; checkBtn.textContent = '检查'; checkBtn.disabled = false;
    input.classList.remove('is-ok', 'is-bad'); fb.className = 'feedback';
  });

  panel.append(...present(
    counter(s),
    cfg.prompt,
    h('div', { class: 'answer-row' }, stem ? h('span', { class: 'stem' }, stem) : null, input),
    letterKeys(),
    hint,
    h('div', { class: 'actions' },
      checkBtn,
      hint ? h('button', { class: 'btn', type: 'button', onclick: () => hint.classList.add('show') }, '提示') : null,
      h('button', { class: 'btn ghost', type: 'button', onclick: () => {
        if (!checked) record(s, i, false);
        show({ ok: false, match: cfg.accept[0] }, true);
      } }, '看答案'),
    ),
    fb,
  ));
  pager(s, panel);
  input.focus();
  if (cfg.prefill) input.setSelectionRange(input.value.length, input.value.length);
}

/* ---------- cloze: inline blanks ---------- */
function renderCloze(s, panel) {
  const i = state.idx[s.id], it = s.items[i];
  const inputs = [];
  const prompt = h('p', { class: 'prompt' }, ...rich(it.prompt, (k) => {
    const longest = Math.max(...it.blanks[k].map(a => a.length), 3);
    const inp = h('input', { class: 'blank', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', lang: 'da',
      'aria-label': `第 ${k + 1} 空`, style: `width:${Math.min(longest + 3, 40)}ch` });
    inputs.push(inp);
    return inp;
  }));
  const fb = h('div', { class: 'feedback', role: 'status' });
  let checked = false;
  const fullAnswer = () => unmark(it.prompt.split(BLANK).reduce((acc, part, k) =>
    acc + part + (k < it.blanks.length ? (NOTHING.includes(it.blanks[k][0]) ? '' : it.blanks[k][0]) : ''), '')).replace(/\s+/g, ' ');

  function show(results, gaveUp) {
    checked = true;
    const ok = !gaveUp && results.every(Boolean);
    inputs.forEach((inp, k) => { inp.classList.toggle('is-ok', !gaveUp && results[k]); inp.classList.toggle('is-bad', gaveUp || !results[k]); });
    fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');
    const ref = h('span', { class: 'sent' }, ...rich(it.prompt, (k) =>
      h('span', { class: 'tok-miss' }, NOTHING.includes(it.blanks[k][0]) ? '（不填）' : it.blanks[k][0])));
    const rows = [
      h('div', { class: 'title' }, ok ? '✓ 全部正确！' : gaveUp ? '参考答案' : `✗ ${results.filter(r => !r).length} 处不对`),
      h('div', { class: 'row' }, ref, speakBtn(fullAnswer())),
    ];
    const alts = it.blanks.map((b, k) => b.length > 1 && !NOTHING.includes(b[0]) ? `第 ${k + 1} 空：${b.join(' / ')}` : null).filter(Boolean);
    if (alts.length) rows.push(h('div', { class: 'row' }, h('span', { class: 'label' }, '可接受'), alts.join('；')));
    if (it.explain) rows.push(h('div', { class: 'explain' }, '📌 ', ...rich(it.explain)));
    fb.replaceChildren(...rows);
    checkBtn.textContent = isLast(s) ? '本节完成' : '下一题 →';
    checkBtn.disabled = isLast(s);
  }
  function check() {
    if (checked) return next(s);
    const empty = inputs.find(inp => !inp.value.trim() && !it.blanks[inputs.indexOf(inp)].some(a => NOTHING.includes(a)));
    if (empty) { empty.focus(); return; }
    const results = inputs.map((inp, k) => blankOk(inp.value, it.blanks[k]));
    record(s, i, results.every(Boolean));
    show(results, false);
  }
  const checkBtn = h('button', { class: 'btn primary', type: 'button', onclick: check }, '检查');
  inputs.forEach((inp, k) => {
    inp.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!checked && k < inputs.length - 1 && !inputs[k + 1].value) inputs[k + 1].focus(); else check();
    });
    inp.addEventListener('input', () => {
      if (!checked) return;
      checked = false; checkBtn.textContent = '检查'; checkBtn.disabled = false;
      inputs.forEach(x => x.classList.remove('is-ok', 'is-bad')); fb.className = 'feedback';
    });
  });

  panel.append(
    counter(s), prompt, letterKeys(),
    h('div', { class: 'actions' }, checkBtn,
      h('button', { class: 'btn ghost', type: 'button', onclick: () => {
        if (!checked) record(s, i, false);
        show(inputs.map(() => false), true);
      } }, '看答案')),
    fb,
  );
  pager(s, panel);
  if (inputs[0]) inputs[0].focus();
}

/* ---------- order (tap words into place) ---------- */
function renderOrder(s, panel) {
  const i = state.idx[s.id], it = s.items[i];
  const words = it.answer.split(/\s+/);
  let pool = shuffle(words.map((w, k) => ({ w, k })));
  if (words.length > 1 && pool.every((t, k) => t.k === k)) pool.push(pool.shift());
  let built = [], done = false;
  const buildEl = h('div', { class: 'build', 'aria-label': '你的句子' });
  const poolEl = h('div', { class: 'pool', 'aria-label': '可选词块' });
  const fb = h('div', { class: 'feedback', role: 'status' });

  function draw() {
    buildEl.replaceChildren(...(built.length
      ? built.map((t, k) => h('button', { class: 'chip', type: 'button', disabled: done,
          onclick: () => { built.splice(k, 1); pool.push(t); draw(); } }, t.w))
      : [h('span', { class: 'placeholder' }, '点击下方词块组成句子')]));
    poolEl.replaceChildren(...pool.map((t, k) => h('button', { class: 'chip', type: 'button', disabled: done,
      onclick: () => { pool.splice(k, 1); built.push(t); draw(); if (!pool.length) check(); } }, t.w)));
  }
  function check() {
    const sentence = built.map(t => t.w).join(' ');
    const ok = norm(sentence) === norm(it.answer);
    done = true;
    record(s, i, ok);
    buildEl.classList.add(ok ? 'is-ok' : 'is-bad');
    fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');
    const ref = ok ? h('span', { class: 'sent' }, it.answer) : diffView(sentence, it.answer).ref;
    fb.replaceChildren(
      h('div', { class: 'title' }, ok ? '✓ 语序正确！' : '✗ 语序不对'),
      h('div', { class: 'row' }, ...present(ok ? null : h('span', { class: 'label' }, '参考答案'), ref, speakBtn(it.answer))),
    );
    actions.replaceChildren(...present(
      ok ? null : h('button', { class: 'btn', type: 'button', onclick: renderPanel }, '重来一次'),
      !isLast(s) ? h('button', { class: 'btn primary', type: 'button', onclick: () => next(s) }, '下一题 →') : null,
    ));
    draw();
  }
  const actions = h('div', { class: 'actions' },
    h('button', { class: 'btn', type: 'button', onclick: () => { pool = pool.concat(built); built = []; draw(); } }, '清空'));
  panel.append(counter(s), h('p', { class: 'prompt' }, h('span', { class: 'zhq' }, unmark(it.zh))), buildEl, poolEl, actions, fb);
  draw();
  pager(s, panel);
}

/* ---------- lesson text reader ---------- */
// **x** = word-order focus (red bold), [[x]] = highlighted connector (navy)
function markup(da) {
  return String(da).split(/(\*\*[^*]+\*\*|\[\[[^\]]+\]\])/).filter(Boolean).map(part =>
    part.startsWith('**') ? h('strong', {}, part.slice(2, -2))
      : part.startsWith('[[') ? h('span', { class: 'hl' }, part.slice(2, -2)) : part);
}
function renderText(s, panel) {
  const segs = s.paras.flatMap(p => p.segs);
  const recorded = segs.filter(g => g.a).length;
  let playingAll = false;
  const allBtn = h('button', { class: 'btn primary', type: 'button' });
  const setAll = (on) => { playingAll = on; allBtn.textContent = on ? '⏸ 停止' : '▶ 全部播放'; };
  setAll(false);
  allBtn.addEventListener('click', () => {
    if (playingAll) { stopAll(); setAll(false); return; }
    setAll(true);
    playSeq(segs, 0, segs.length, () => setAll(false));
  });
  const play = (i) => {
    if (playingAll) playSeq(segs, i, segs.length, () => setAll(false));
    else playSeq(segs, i, i + 1);
  };
  const toggle = (label, key, title, after) => {
    const b = h('button', { type: 'button', title, 'aria-pressed': String(!!prefs[key]) }, label);
    b.addEventListener('click', () => {
      prefs[key] = !prefs[key]; savePrefs(); b.setAttribute('aria-pressed', String(prefs[key]));
      if (after) after();
    });
    return b;
  };
  const body = h('div', { class: s.kind === 'words' ? 'tx-words' : 'tx-body' });
  const syncZh = () => body.classList.toggle('hide-zh', !prefs.zh);
  const rates = h('div', { class: 'seg', role: 'group', 'aria-label': '语速' }, [0.75, 1, 1.25].map(r => {
    const b = h('button', { type: 'button', 'aria-pressed': String(prefs.rate === r) }, `${r}×`);
    b.addEventListener('click', () => {
      prefs.rate = r; savePrefs(); player.defaultPlaybackRate = player.playbackRate = r;
      rates.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    });
    return b;
  }));
  panel.append(
    h('div', { class: 'tx-bar' }, allBtn, rates,
      h('div', { class: 'seg' }, toggle('中文', 'zh', '显示/隐藏中文', syncZh),
        toggle('跟读停顿', 'gap', '连续播放时每句后留出跟读时间'))),
    h('p', { class: 'tx-status' }, recorded === segs.length ? '点击任意句子单独播放；“全部播放”时点击句子可从该处继续。'
      : recorded ? `部分句子（${segs.length - recorded} 句）暂无录音，将使用浏览器朗读。` : '本课暂无录音，使用浏览器朗读（音质取决于系统语音）。'),
    body);
  syncZh();
  let n = 0;
  const sent = (g) => {
    const i = n++;
    return h('span', { class: 's', lang: 'da', 'data-seg': g.id, role: 'button', tabindex: '0',
      onclick: () => play(i), onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(i); } } },
      ...markup(g.da));
  };
  const zh = (t) => t ? h('div', { class: 'tx-zh' }, t) : null;
  for (const p of s.paras) {
    if (s.kind === 'words') {
      const g = p.segs[0];
      body.append(h('div', { class: 'tx-para' },
        h('div', {}, h('p', { class: 'tx-da' }, sent(g)), p.note ? h('div', { class: 'tx-note' }, p.note) : null),
        h('div', { class: 'tx-zh' }, p.zh || '')));
    } else if (s.kind === 'qa') {
      body.append(h('div', { class: 'tx-para' }, ...present(
        p.cue ? h('div', { class: 'tx-cue' }, p.cue) : null,
        ...p.segs.map(g => h('p', { class: 'tx-da tx-line' },
          h('span', { class: 'tx-who' }, g.who.replace(/^Kursist /, '')), h('span', {}, sent(g)))),
        zh(p.zh))));
    } else if (s.kind === 'dialog') {
      body.append(h('div', { class: 'tx-para' }, ...present(
        p.cue ? h('div', { class: 'tx-cue' }, p.cue) : null,
        h('div', { class: 'tx-who' }, p.segs[0].who),
        h('p', { class: 'tx-da' }, ...p.segs.flatMap((g, k) => k ? [' ', sent(g)] : [sent(g)])),
        p.note ? h('details', { class: 'tx-note' }, h('summary', {}, '发音提示'), p.note) : null,
        zh(p.zh))));
    } else {
      // prose / e-mails / notices: nl = new line, label = speaker or "A." marker shown before the line
      const line = h('p', { class: 'tx-da' });
      p.segs.forEach((g, k) => {
        if (g.nl) line.append(h('br'));
        else if (k) line.append(' ');
        if (g.label) line.append(h('span', { class: 'tx-who tx-label' }, g.label));
        line.append(sent(g));
      });
      body.append(h('div', { class: 'tx-para' }, ...present(
        p.cue ? h('div', { class: 'tx-cue' }, p.cue) : null,
        line, zh(p.zh),
        p.zh_all ? h('div', { class: 'tx-zh tx-zh-all' }, p.zh_all) : null)));
    }
  }
}

/* ---------- flashcards ---------- */
const fcState = {};
function renderFlashcards(s, panel) {
  const p = prog(s.id);
  p.known = p.known || {};
  const key = state.lesson.key + '/' + s.id;
  const unknown = () => shuffle(s.cards.map((_, k) => k).filter(k => !p.known[k]));
  const st = fcState[key] = fcState[key] || { dir: 'da', queue: unknown(), flipped: false };
  const knownN = Object.keys(p.known).length;
  const restart = (all) => {
    if (all) { p.known = {}; save(); renderTabs(); }
    st.queue = unknown(); st.flipped = false; renderPanel();
  };
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': '方向' },
    [['da', '丹 → 中'], ['zh', '中 → 丹']].map(([v, label]) =>
      h('button', { type: 'button', 'aria-pressed': String(st.dir === v), onclick: () => { st.dir = v; st.flipped = false; renderPanel(); } }, label)));
  panel.append(h('div', { class: 'fc-bar' }, h('span', {}, `已掌握 ${knownN} / ${s.cards.length} · 本轮剩余 ${st.queue.length}`), seg));

  if (!st.queue.length) {
    panel.append(h('div', { class: 'done' },
      h('div', { class: 'big' }, '🎉'),
      h('p', {}, knownN === s.cards.length ? '本课生词全部掌握！' : '本轮已完成。'),
      h('div', { class: 'actions', style: 'justify-content:center' }, ...present(
        knownN < s.cards.length ? h('button', { class: 'btn primary', type: 'button', onclick: () => restart(false) }, '继续复习未掌握的') : null,
        h('button', { class: 'btn', type: 'button', onclick: () => restart(true) }, '全部重新开始')))));
    return;
  }
  const k = st.queue[0], c = s.cards[k];
  const flip = () => { st.flipped = !st.flipped; card.classList.toggle('flipped', st.flipped); };
  const front = st.dir === 'da'
    ? h('div', { class: 'front' }, c.da, speakBtn(c.da))
    : h('div', { class: 'front zh' }, c.zh);
  const back = st.dir === 'da'
    ? h('div', { class: 'back' }, c.forms ? h('div', { class: 'forms' }, c.forms) : null, h('div', { class: 'meaning' }, c.zh))
    : h('div', { class: 'back' }, h('div', { class: 'word' }, c.da, speakBtn(c.da)), c.forms ? h('div', { class: 'forms' }, c.forms) : null);
  const card = h('div', { class: 'flash' + (st.flipped ? ' flipped' : ''), role: 'button', tabindex: '0', 'aria-label': '翻转卡片',
    onclick: flip, onkeydown: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } } },
    c.pos ? h('div', { class: 'pos' }, c.pos) : null, front, back, h('div', { class: 'tap' }, '点击卡片翻面'));
  const answer = (knew) => {
    st.queue.shift();
    if (knew) { p.known[k] = true; save(); renderTabs(); } else st.queue.push(k);
    st.flipped = false; renderPanel();
  };
  panel.append(card, h('div', { class: 'actions', style: 'justify-content:center' },
    h('button', { class: 'btn', type: 'button', onclick: () => answer(false) }, '还不熟'),
    h('button', { class: 'btn primary', type: 'button', onclick: () => answer(true) }, '记住了 ✓')));
  if (!state.lesson.clips && 'speechSynthesis' in window && !daVoice && speechSynthesis.getVoices().length) {
    panel.append(h('p', { class: 'tts-warn' }, '未检测到丹麦语语音，朗读可能用错口音。Windows 可在“设置 → 时间和语言 → 语音”中添加 Dansk。'));
  }
}

/* ---------- boot ---------- */
$('#reset').addEventListener('click', () => {
  delete store[state.lesson.key]; save();
  for (const key of Object.keys(fcState)) if (key.startsWith(state.lesson.key + '/')) delete fcState[key];
  state.idx = {};
  openSection(state.sid);
});
if (!LESSONS.length) {
  $('#panel').textContent = '没有题库数据，请先运行 python interactive/build.py';
} else {
  let last = '';
  try { last = localStorage.getItem(STORE_KEY + ':last') || ''; } catch (e) {}
  const [lk, sid] = last.split('/');
  state.lesson = LESSONS.find(l => l.key === lk) || LESSONS[0];
  renderLessonNav();
  renderHeader();
  openSection(state.lesson.sections.some(s => s.id === sid) ? sid : state.lesson.sections[0].id);
}
</script>
</body>
</html>
