older vi fællesmiddag": "a62f211d95c66579", "vi skiftes til at lave mad i par så man kun skal lave mad for de andre én gang hver sjette uge": "1fee02c7961503c4", "rundt om det lange spisebord snakker vi griner og hjælper hinanden med både lektier og praktiske ting": "317b750c7edc42fa", "sidste tirsdag hjalp vi for eksempel med at reparere hinandens cykler i gården": "708da80be17a0ad3", "men om søndagen har vi rengøringsdag og det giver desværre tit diskussion": "655d21ce89a7c64a", "nogle gør grundigt rent mens andre glemmer at tørre komfuret af eller tømme skraldespanden": "eddca150c275437d", "sidste søndag blev to beboere faktisk sure på hinanden på grund af nogle beskidte gryder i vasken": "795f354b7ea4cefe", "derfor holder hele gangen et hurtigt køkkenmøde i morgen så vi kan lave en mere retfærdig plan og stadig være glade for at bo tæt på hinanden": "bb5d1c1ea4eed976", "hej alle sammen": "2846c01fda05bbc0", "komfuret var desværre helt fedtet i morges og skraldespanden var fuld": "b9301122f3b0e87b", "kan vi ikke tale om det på søndag": "c661bbec810203e4", "enig": "355e89ac027a39ff", "jeg tror at problemet er at folk har travlt alene": "865538a44171e926", "hvad med at vi altid arbejder to og to sammen og hjælper hinanden med de tunge opgaver": "af9d1568ce45734a", "hvis én er syg eller bortrejst kan man bytte uge med en anden på listen": "e01f38a3b88c95a2", "rigtig god idé sofie": "f3fb5f47e819272a", "så skiftes vi til at tage de store ting og man glemmer ikke sin tur så let": "54d10fd3666447e8", "skal vi mødes i køkkenet på søndag kl 19 for at aftale det": "e03aa0db505e0f19", "ja @emil kan du også komme kl 19 og hvilken opgave vil du helst tage i næste uge": "9be644dabc63bced", "at skiftes (til)": "eff7a11838a9faa4", "at gøre rent": "58e96ebbfbd2b2f7", "at tørre af": "6d4e6a6c42b5d0e3", "at tømme": "a1d963cd579275f9", "at bytte": "e8977ad2068f80e9", "at foreslå": "d0f1edb870b257f7", "at reparere": "f61dfa8207efb5ec", "en fællesmiddag": "9e73e07d55bb9633", "en rengøringsdag": "bf1ced55e5c5fcda", "en beboer": "10f1440d19a40c58", "en gang": "8ca0ee98a12d97f1", "et komfur": "d030300aa9ecb706", "en gryde": "411fcc7f9ec418dd", "skrald": "04e9484175237da2", "fælles": "50901e6bd9c13152", "retfærdig": "cb9056b45b2448a5", "grundig": "f6eca7bff7732967", "beskidt": "07d43b98fa1dc12f", "hinanden": "417262afaeb69498", "hinandens": "e813dbff2916f8a9"}, "key": "ncd2-L16"}, {"book": "ncd2", "lesson": 17, "title_da": "Når familien vokser", "title_zh": "当家庭迎来新成员", "grammar": "反身物主代词 sin / sit / sine vs hans / hendes / deres 进阶排雷（Modul 2 必考压轴点）：172 单数第三人称主语回指；173 复数主语禁用 sin；174 绝不修饰主语或从句主语；175 双人物与从句主语锁定", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Når familien vokser（叙事短文 · 约 155 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "For to måneder siden blev Anders og **hans** kone, Signe, forældre for første gang, da **deres** lille datter Freja blev født.", "a": "451604880651a42b", "dur": 6.48}, {"id": "a2", "who": "narrator", "da": "I den første måned tog Signe [[sin]] barsel derhjemme, mens Anders passede [[sit]] arbejde på kontoret.", "a": "96c394a8f7e4e324", "dur": 5.52}, {"id": "a3", "who": "narrator", "da": "Nu er Signe startet på arbejde igen, og Anders har netop begyndt [[sin]] barselsorlov.", "a": "84ee98c3c948a246", "dur": 4.08}], "zh": "两个月前，当安德斯和他的妻子西格妮的小女儿芙蕾雅出生时，他们第一次成为了父母。第一个月里，西格妮在家休她的育儿假，而安德斯则在办公室处理他的工作。现在西格妮已经重新回去上班了，而安德斯也刚刚开始他的育儿假。"}, {"segs": [{"id": "a4", "who": "narrator", "da": "Hver morgen går Anders en lang tur i parken med [[sin]] datter i barnevognen.", "a": "28f0024731184a21", "dur": 4.64}, {"id": "a5", "who": "narrator", "da": "Han tager altid [[sit]] kamera med og sender billeder til Signe, fordi **hendes** kolleger også gerne vil se den lille pige.", "a": "f8affa304e759c38", "dur": 5.72}, {"id": "a6", "who": "narrator", "da": "Signe smiler, hver gang hun ser på [[sin]] telefon i frokostpausen, selvom hun savner [[sin]] datter meget.", "a": "00804d4091508d3c", "dur": 5.48}], "zh": "每天早上，安德斯都会用婴儿车推着他的女儿在公园里散很长的步。他总是带上他的相机，并把照片发给西格妮，因为她的同事们也很想看看这个小姑娘。西格妮每次在午休时看她的手机都会微笑，尽管她非常想念她的女儿。"}, {"segs": [{"id": "a7", "who": "narrator", "da": "I weekenden inviterede Anders og Signe **deres** forældre til middag, så bedsteforældrene kunne hilse på **deres** nye barnebarn.", "a": "b8166db0ec49c524", "dur": 6.48}, {"id": "a8", "who": "narrator", "da": "Da de ankom, åbnede Signes mor straks [[sin]] store taske og tog en hjemme-strikket trøje frem.", "a": "cfac59afcb958d5b", "dur": 5.2}, {"id": "a9", "who": "narrator", "da": "Alle var glade, og Anders fortalte stolt [[sin]] svigerfar, at **hans** datter allerede sover hele natten.", "a": "7bdc55f0cbdcdfc8", "dur": 5.72}], "zh": "周末，安德斯和西格妮邀请了他们的父母来吃晚饭，这样祖父母就能看看他们的新生外孙女（孙女）。他们一到，西格妮的妈妈就立刻打开她的大包，拿出了一件手工编织的毛衣。大家都很开心，安德斯还自豪地告诉他的岳父，他的女儿现在已经能睡整夜觉了。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：En mail fra Signe & Fejlfinding（对标 DU3 Modul 2 书信语篇与代词排雷）", "scene": null, "paras": [{"cue": "来信示例｜Fra: Signe Emne: Lille Freja er kommet!", "segs": [{"id": "b1", "who": "narrator", "da": "Kære Emma", "a": "923fd8a340f4bf02", "dur": 1.24}]}, {"segs": [{"id": "b2", "who": "narrator", "da": "Tusind tak for [[din]] søde besked og den fine gave!", "a": "a90662578f0208d2", "dur": 3.2}, {"id": "b3", "who": "narrator", "da": "Ja, Anders og jeg [[har fået]] en lille pige, og vi har kaldt hende Freja.", "a": "f1fe02e0ab9b1afa", "dur": 3.84}, {"id": "b4", "who": "narrator", "da": "I begyndelsen var **vores** lejlighed lidt kaotisk, fordi jeg var så træt efter fødslen, og Anders ikke vidste, hvor alle bleerne lå.", "a": "b0fb5bbf3743db41", "dur": 6.0}]}, {"segs": [{"id": "b5", "who": "narrator", "da": "Nu går det meget bedre.", "a": "e2b1c680f245bf73", "dur": 1.64}, {"id": "b6", "who": "narrator", "da": "Anders holder [[sin]] barsel i denne måned, så han går ture med Freja, mens jeg arbejder.", "a": "c8605e0bdb4c0db7", "dur": 4.0}, {"id": "b7", "who": "narrator", "da": "Han nyder [[sit]] nye liv som far, og om aftenen læser han højt for Freja fra [[sine]] gamle børnebøger.", "a": "a718931732b0b617", "dur": 5.0}, {"id": "b8", "who": "narrator", "da": "I søndags kom mine forældre på besøg for at se **deres** barnebarn.", "a": "a3bc51208862e968", "dur": 3.24}, {"id": "b9", "who": "narrator", "da": "Vi skal snart holde en lille navnefest, og jeg håber, at du vil komme!", "a": "4cd74ae3079bb3e2", "dur": 3.84}]}, {"segs": [{"id": "b10", "who": "narrator", "da": "Kærlig hilsen", "a": "cb4d30c4f5968c22", "dur": 1.28}, {"id": "b11", "who": "narrator", "da": "Signe", "nl": true, "a": "25a48892711e2fc6", "dur": 0.8}], "zh_all": "西格妮的邮件：亲爱的艾玛，非常感谢你温馨的留言和精致的礼物！是的，安德斯和我迎来了一个小女孩，我们给她取名叫芙蕾雅。一开始我们的公寓有点乱，因为我生完孩子后太累了，而安德斯又不知道尿布都放在哪儿。现在好多了。安德斯这个月休育儿假，所以我上班的时候他就推着芙蕾雅散步。他很享受自己作为爸爸的新生活，晚上还会从他自己的旧儿童读物里给芙蕾雅大声朗读。上周日我父母来看望他们的外孙女。我们很快要办一个小型命名派对，希望你能来！亲切的问候，西格妮。\n排雷句子译文：(1) 上周六米克尔和他的妻子为他们的儿子举办了一场盛大派对。(2) 米克尔忘了把他的相机带到花园里。(3) 客人们都把他们的礼物带给了小男孩。(4) 米克尔的妹妹很高兴，因为她自己的女儿也能一起玩。(5) 最后，父母感谢了所有朋友的帮助。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "育儿假，产假", "note": "名词 · barslen", "segs": [{"id": "g1", "who": "narrator", "da": "en barsel", "say": "en barsel. barslen.", "a": "9dc98adeb013cb84", "dur": 2.48}]}, {"zh": "育儿假，产假", "note": "名词 · barselsorloven, ingen flertal", "segs": [{"id": "g2", "who": "narrator", "da": "barselsorlov", "say": "barselsorlov. barselsorloven, ingen flertal.", "a": "f5cf45986d6d3001", "dur": 4.92}]}, {"zh": "父母（常作复数）", "note": "名词 · forældrene", "segs": [{"id": "g3", "who": "narrator", "da": "forældre (flertal)", "say": "forældre (flertal). forældrene.", "a": "1fb5c2c250ca2a92", "dur": 3.72}]}, {"zh": "孙辈，外孙/外孙女", "note": "名词 · barnebarnet, børnebørn, børnebørnene", "segs": [{"id": "g4", "who": "narrator", "da": "et barnebarn", "say": "et barnebarn. barnebarnet, børnebørn, børnebørnene.", "a": "669b913e71b86909", "dur": 5.76}]}, {"zh": "女儿（不规则复数 døtre）", "note": "名词 · datteren, døtre, døtrene", "segs": [{"id": "g5", "who": "narrator", "da": "en datter", "say": "en datter. datteren, døtre, døtrene.", "a": "352ccfce078cc74a", "dur": 4.64}]}, {"zh": "岳父；公公", "note": "名词 · svigerfaren, svigerfædre, svigerfædrene", "segs": [{"id": "g6", "who": "narrator", "da": "en svigerfar", "say": "en svigerfar. svigerfaren, svigerfædre, svigerfædrene.", "a": "3210d2f3ef8ae073", "dur": 6.24}]}, {"zh": "婴儿车（g 不发音）", "note": "名词 · barnevognen, barnevogne, barnevognene", "segs": [{"id": "g7", "who": "narrator", "da": "en barnevogn", "say": "en barnevogn. barnevognen, barnevogne, barnevognene.", "a": "23c8af687a0e7d58", "dur": 5.92}]}, {"zh": "尿布，纸尿裤", "note": "名词 · bleen, bleer, bleerne", "segs": [{"id": "g8", "who": "narrator", "da": "en ble", "say": "en ble. bleen, bleer, bleerne.", "a": "5eef433feeffbefe", "dur": 4.52}]}, {"zh": "命名派对（丹麦常见仪式）", "note": "名词 · navnefesten, navnefester, navnefesterne", "segs": [{"id": "g9", "who": "narrator", "da": "en navnefest", "say": "en navnefest. navnefesten, navnefester, navnefesterne.", "a": "8aba15a5d1c417a1", "dur": 6.32}]}, {"zh": "分娩，出生", "note": "名词 · fødslen, fødsler, fødslerne", "segs": [{"id": "g10", "who": "narrator", "da": "en fødsel", "say": "en fødsel. fødslen, fødsler, fødslerne.", "a": "3d63872ad09ef9d2", "dur": 5.12}]}, {"zh": "成长，增长；家庭添丁", "note": "动词 · vokser, voksede, har vokset", "segs": [{"id": "g11", "who": "narrator", "da": "at vokse", "say": "at vokse. vokser, voksede, har vokset.", "a": "d8aa691c1dbf328f", "dur": 4.08}]}, {"zh": "出生（被动常用固定搭配）", "note": "动词 · bliver født, blev født, er blevet født", "segs": [{"id": "g12", "who": "narrator", "da": "at blive født", "say": "at blive født. bliver født, blev født, er blevet født.", "a": "4bd2158fcc346e85", "dur": 5.96}]}, {"zh": "照顾，照看；处理（工作）", "note": "动词 · passer, passede, har passet", "segs": [{"id": "g13", "who": "narrator", "da": "at passe (på)", "say": "at passe (på). passer, passede, har passet.", "a": "22fad294dab50d8b", "dur": 5.08}]}, {"zh": "想念，怀念", "note": "动词 · savner, savnede, har savnet", "segs": [{"id": "g14", "who": "narrator", "da": "at savne", "say": "at savne. savner, savnede, har savnet.", "a": "0d6a9972def6a1c3", "dur": 5.24}]}, {"zh": "微笑", "note": "动词 · smiler, smilede, har smilet", "segs": [{"id": "g15", "who": "narrator", "da": "at smile", "say": "at smile. smiler, smilede, har smilet.", "a": "16e82b2d5c57219d", "dur": 4.96}]}, {"zh": "享受（不规则变化）", "note": "动词 · nyder, nød, har nydt", "segs": [{"id": "g16", "who": "narrator", "da": "at nyde", "say": "at nyde. nyder, nød, har nydt.", "a": "325ebbf4f46acad2", "dur": 3.96}]}, {"zh": "自豪的", "note": "形容词 · -, -e", "segs": [{"id": "g17", "who": "narrator", "da": "stolt", "say": "stolt.", "a": "3250eaf7efa1decd", "dur": 1.08}]}, {"zh": "疲倦的（双写 t）", "note": "形容词 · -, trætte", "segs": [{"id": "g18", "who": "narrator", "da": "træt", "say": "træt. trætte.", "a": "6a9ffeb4dc9935e1", "dur": 2.2}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en barsel / barselsorlov", "zh": "育儿假，产假", "forms": "barslen / barselsorloven, ingen flertal"}, {"pos": "名词", "da": "forældre (flertal)", "zh": "父母（常作复数）", "forms": "forældrene"}, {"pos": "名词", "da": "et barnebarn", "zh": "孙辈，外孙/外孙女", "forms": "barnebarnet, børnebørn, børnebørnene"}, {"pos": "名词", "da": "en datter", "zh": "女儿（不规则复数 døtre）", "forms": "datteren, døtre, døtrene"}, {"pos": "名词", "da": "en svigerfar", "zh": "岳父；公公", "forms": "svigerfaren, svigerfædre, svigerfædrene"}, {"pos": "名词", "da": "en barnevogn", "zh": "婴儿车（g 不发音）", "forms": "barnevognen, barnevogne, barnevognene"}, {"pos": "名词", "da": "en ble", "zh": "尿布，纸尿裤", "forms": "bleen, bleer, bleerne"}, {"pos": "名词", "da": "en navnefest", "zh": "命名派对（丹麦常见仪式）", "forms": "navnefesten, navnefester, navnefesterne"}, {"pos": "名词", "da": "en fødsel", "zh": "分娩，出生", "forms": "fødslen, fødsler, fødslerne"}, {"pos": "动词", "da": "at vokse", "zh": "成长，增长；家庭添丁", "forms": "vokser, voksede, har vokset"}, {"pos": "动词 [er]", "da": "at blive født", "zh": "出生（被动常用固定搭配）", "forms": "bliver født, blev født, er blevet født"}, {"pos": "动词", "da": "at passe (på)", "zh": "照顾，照看；处理（工作）", "forms": "passer, passede, har passet"}, {"pos": "动词", "da": "at savne", "zh": "想念，怀念", "forms": "savner, savnede, har savnet"}, {"pos": "动词", "da": "at smile", "zh": "微笑", "forms": "smiler, smilede, har smilet"}, {"pos": "动词", "da": "at nyde", "zh": "享受（不规则变化）", "forms": "nyder, nød, har nydt"}, {"pos": "形容词", "da": "stolt / træt", "zh": "自豪的 / 疲倦的（双写 t）", "forms": "stolt (-, -e) / træt (-, trætte"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "安德斯和他的妻子非常爱他们的女儿。（提示：注意主语复数！）", "answer": "Anders og hans kone elsker deres datter meget højt."}, {"zh": "西格妮每天都在午休时看她自己的手机。", "answer": "Signe ser på sin telefon i frokostpausen hver dag."}, {"zh": "彼得很高兴，因为他的父母昨天从奥胡斯来看他。", "answer": "Peter er meget glad, fordi hans forældre besøgte ham fra Aarhus i går."}, {"zh": "她打开了自己的包，拿出了给朋友的礼物。", "answer": "Hun åbnede sin taske og tog gaven til sin ven frem."}, {"zh": "祖父母总是自豪地给朋友们展示他们的外孙女。", "answer": "Bedsteforældrene viser altid stolt deres barnebarn frem til deres venner."}]}, {"id": "A", "type": "drill", "title": "练习 A：用 sin, sit, sine, hans, hendes 或 deres 填空", "items": [{"prompt": "Signe og {{_}} mand, Anders, har fået en datter.", "kind": "cloze", "blanks": [["hendes"]], "explain": "并列主语一部分，禁用 ⟦sin⟧"}, {"prompt": "Anders elsker at gå tur med {{_}} lille pige i parken.", "kind": "cloze", "blanks": [["sin"]], "explain": "⟦en pige⟧ 共性，回指主语 ⟦Anders⟧"}, {"prompt": "De inviterede {{_}} familie til en hyggelig navnefest.", "kind": "cloze", "blanks": [["deres"]], "explain": "主语 ⟦De⟧ 复数，必用 ⟦deres⟧"}, {"prompt": "Man skal huske at tage {{_}} kamera med på ferie.", "kind": "cloze", "blanks": [["sit"]], "explain": "⟦man⟧ 为单数泛指主语，⟦et kamera⟧ 为中性 → ⟦sit⟧"}, {"prompt": "Signe savner Freja, når hun sidder på {{_}} kontor.", "kind": "cloze", "blanks": [["sit"]], "explain": "⟦et kontor⟧ 中性，回指 ⟦hun⟧"}, {"prompt": "Anders fortalte, at {{_}} forældre allerede har købt gaver.", "kind": "cloze", "blanks": [["hans"]], "explain": "⟦at⟧-从句的新主语 ⟦hans forældre⟧，禁用 ⟦sin⟧"}, {"prompt": "Bedsteforældrene tager ofte {{_}} barnebarn med i haven.", "kind": "cloze", "blanks": [["deres"]], "explain": "主语 ⟦Bedsteforældrene⟧ 复数 → ⟦deres⟧"}, {"prompt": "Signe pakkede {{_}} ting i tasken, før hun kørte på arbejde.", "kind": "cloze", "blanks": [["sine"]], "explain": "⟦ting⟧ 此处为复数，回指 ⟦Signe⟧ → ⟦sine⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：从句与双人物主语判定（圈出唯一正确的代词）", "items": [{"prompt": "Maja er træt, fordi (⟦sin / hendes⟧) nye baby vågnede tre gange i nat.", "kind": "write", "accept": ["hendes"], "explain": "⟦fordi⟧-从句的新主语"}, {"prompt": "Lukas mødte Peter i byen og så (⟦sit / hans⟧) nye hus for første gang. (指彼得的新房子)", "kind": "write", "accept": ["hans"], "explain": "指彼得的房子，而非主语卢卡斯自己的房子"}, {"prompt": "Forældrene var glade, fordi (⟦deres / sine⟧) venner hjalp med maden.", "kind": "write", "accept": ["deres"], "explain": "主语 ⟦venner⟧ 且原主语 ⟦Forældrene⟧ 也是复数"}, {"prompt": "Emma ringede til (⟦sin / hendes⟧) bror i Kina for at fortælle nyheden.", "kind": "write", "accept": ["sin"], "explain": "⟦en bror⟧ 共性，回指主语 ⟦Emma⟧"}, {"prompt": "Signe spurgte Anders, om han havde fundet (⟦sit / hans⟧) pas i skuffen. (指安德斯自己的护照)", "kind": "write", "accept": ["sit"], "explain": "在 ⟦om⟧-从句中，主语变成了 ⟦han⟧（安德斯），指安德斯自己的护照 ⟦et pas⟧，故用 ⟦sit⟧！"}, {"prompt": "Både Jonas og (⟦sin / hans⟧) kæreste vil gerne have et barn næste år.", "kind": "write", "accept": ["hans"], "explain": "并列主语部分，不能用 ⟦sin⟧"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（重点巩固“反身 vs 非反身物主代词”）", "items": [{"prompt": "安德斯和他的妻子非常爱他们的女儿。（提示：注意主语复数！）", "kind": "write", "accept": ["Anders og hans kone elsker deres datter meget højt."]}, {"prompt": "西格妮每天都在午休时看她自己的手机。", "kind": "write", "accept": ["Signe ser på sin telefon i frokostpausen hver dag."]}, {"prompt": "彼得很高兴，因为他的父母昨天从奥胡斯来看他。", "kind": "write", "accept": ["Peter er meget glad, fordi hans forældre besøgte ham fra Aarhus i går."]}, {"prompt": "她打开了自己的包，拿出了给朋友的礼物。", "kind": "write", "accept": ["Hun åbnede sin taske og tog gaven til sin ven frem."]}, {"prompt": "祖父母总是自豪地给朋友们展示他们的外孙女。", "kind": "write", "accept": ["Bedsteforældrene viser altid stolt deres barnebarn frem til deres venner."]}]}], "clips": {"for to måneder siden blev anders og hans kone signe forældre for første gang da deres lille datter freja blev født": "451604880651a42b", "i den første måned tog signe sin barsel derhjemme mens anders passede sit arbejde på kontoret": "96c394a8f7e4e324", "nu er signe startet på arbejde igen og anders har netop begyndt sin barselsorlov": "84ee98c3c948a246", "hver morgen går anders en lang tur i parken med sin datter i barnevognen": "28f0024731184a21", "han tager altid sit kamera med og sender billeder til signe fordi hendes kolleger også gerne vil se den lille pige": "f8affa304e759c38", "signe smiler hver gang hun ser på sin telefon i frokostpausen selvom hun savner sin datter meget": "00804d4091508d3c", "i weekenden inviterede anders og signe deres forældre til middag så bedsteforældrene kunne hilse på deres nye barnebarn": "b8166db0ec49c524", "da de ankom åbnede signes mor straks sin store taske og tog en hjemme-strikket trøje frem": "cfac59afcb958d5b", "alle var glade og anders fortalte stolt sin svigerfar at hans datter allerede sover hele natten": "7bdc55f0cbdcdfc8", "kære emma": "923fd8a340f4bf02", "tusind tak for din søde besked og den fine gave": "a90662578f0208d2", "ja anders og jeg har fået en lille pige og vi har kaldt hende freja": "f1fe02e0ab9b1afa", "i begyndelsen var vores lejlighed lidt kaotisk fordi jeg var så træt efter fødslen og anders ikke vidste hvor alle bleerne lå": "b0fb5bbf3743db41", "nu går det meget bedre": "e2b1c680f245bf73", "anders holder sin barsel i denne måned så han går ture med freja mens jeg arbejder": "c8605e0bdb4c0db7", "han nyder sit nye liv som far og om aftenen læser han højt for freja fra sine gamle børnebøger": "a718931732b0b617", "i søndags kom mine forældre på besøg for at se deres barnebarn": "a3bc51208862e968", "vi skal snart holde en lille navnefest og jeg håber at du vil komme": "4cd74ae3079bb3e2", "kærlig hilsen": "cb4d30c4f5968c22", "signe": "25a48892711e2fc6", "en barsel": "9dc98adeb013cb84", "barselsorlov": "f5cf45986d6d3001", "forældre (flertal)": "1fb5c2c250ca2a92", "et barnebarn": "669b913e71b86909", "en datter": "352ccfce078cc74a", "en svigerfar": "3210d2f3ef8ae073", "en barnevogn": "23c8af687a0e7d58", "en ble": "5eef433feeffbefe", "en navnefest": "8aba15a5d1c417a1", "en fødsel": "3d63872ad09ef9d2", "at vokse": "d8aa691c1dbf328f", "at blive født": "4bd2158fcc346e85", "at passe (på)": "22fad294dab50d8b", "at savne": "0d6a9972def6a1c3", "at smile": "16e82b2d5c57219d", "at nyde": "325ebbf4f46acad2", "stolt": "3250eaf7efa1decd", "træt": "6a9ffeb4dc9935e1"}, "key": "ncd2-L17"}, {"book": "ncd2", "lesson": 18, "title_da": "En klage over larm i opgangen", "title_zh": "一封关于楼道噪音的投诉信", "grammar": "半正式沟通邮件（给房东/物业/学校行政/客服）四步结构 · 委婉陈述问题（Jeg skriver til dig/jer, fordi... / Desværre har vi oplevet, at...） · 礼貌请求句式（Vil du/I være sød(e) at... / På forhånd tak for hjælpen）", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：En klage over larm i opgangen（叙事短文 · 约 150 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Kasper har boet på anden sal i en rolig ejendom i Aarhus i tre år.", "a": "02e5e9a04825d3b2", "dur": 4.4}, {"id": "a2", "who": "narrator", "da": "Men i de sidste to uger har der været et stort problem med [[larm i opgangen]].", "a": "8689f4e2f576be90", "dur": 4.08}, {"id": "a3", "who": "narrator", "da": "Flere gange om ugen har nogle nye naboer på tredje sal holdt højlydte fester til klokken to om natten på hverdage, og gæsterne har råbt og smækket med dørene på trappen.", "a": "20603196e76c0c53", "dur": 10.36}], "zh": "卡斯珀在奥胡斯一栋安静的公寓楼二楼住了三年。但在过去两周里，楼道噪音成了一个大问题。三楼的几位新邻居每周好几次在工作日开派对喧闹到凌晨两点，客人们还在楼梯间里大喊大叫、猛摔房门。"}, {"segs": [{"id": "a4", "who": "narrator", "da": "Samtidig har nogen stillet tre gamle cykler og store papkasser lige foran hoveddøren, så det er næsten umuligt for de ældre beboere at komme forbi med deres rollatorer.", "a": "e7b01a3b33352b87", "dur": 8.04}], "zh": "与此同时，有人把三辆旧自行车和大纸箱直接堵在大门前面，导致老年住户推着助行车几乎过不去。"}, {"segs": [{"id": "a5", "who": "narrator", "da": "Først prøvede Kasper at snakke pænt med sin nabo, som lovede at tage mere hensyn.", "a": "b50cbdaae4f307d0", "dur": 4.4}, {"id": "a6", "who": "narrator", "da": "Men **desværre** ændrede intet sig.", "a": "4fb513b82fd943d7", "dur": 2.4}, {"id": "a7", "who": "narrator", "da": "I går aftes kunne Kasper slet ikke sove, før klokken blev tre.", "a": "138fcd4740760f24", "dur": 3.28}, {"id": "a8", "who": "narrator", "da": "Derfor satte han sig ved computeren i morges og skrev en [[høflig, men bestemt]] e-mail til boligforeningen, hvor han forklarede situationen og bad dem om hjælp.", "a": "00a21b8c54a0002a", "dur": 7.96}], "zh": "起初，卡斯珀试着和邻居和气地沟通，邻居也答应会多加体谅。但遗憾的是，情况没有任何改变。昨晚卡斯珀直到凌晨三点才勉强睡着。因此，今天早上他坐到电脑前，给公寓物业管理会写了一封礼貌但坚定的电子邮件，说明了情况并请求他们提供帮助。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Husorden og halvformel e-mail til viceværten（对标 DU3 Modul 2 实用公告阅读与半正式邮件写作）", "scene": null, "paras": [{"cue": "小区公告｜Opslag fra Boligforeningen Solbakken", "segs": [{"id": "b1", "who": "narrator", "da": "Kære alle beboere", "a": "8d5f240c32bcf681", "dur": 1.88}]}, {"segs": [{"id": "b2", "who": "narrator", "da": "Husk vores fælles husorden, så alle kan trives i ejendommen:", "a": "0099c6713ef1fe76", "dur": 3.96}]}, {"segs": [{"id": "b3", "who": "narrator", "da": "Der skal være ro i opgangen efter kl. 22.00 på hverdage (søndag–torsdag).", "a": "725adc17a1c46df1", "dur": 5.0}, {"id": "b4", "who": "narrator", "da": "Af hensyn til brandsikkerheden må man ikke stille cykler, barnevogne eller kasser i opgangen.", "nl": true, "a": "a1ba0fbfcd2a2e33", "dur": 4.96}, {"id": "b5", "who": "narrator", "da": "Hvis noget i bygningen er gået i stykker, bedes I kontakte viceværten Henrik på henrik@solbakken.dk.", "nl": true, "a": "bbf44988e2bca520", "dur": 8.48}]}, {"cue": "半正式邮件范本（109 词）｜Til: Henrik (Vicevært) Emne: Ødelagt dørtelefon og larm i opgangen", "segs": [{"id": "b6", "who": "narrator", "da": "Hej Henrik", "a": "6deab38544d4b991", "dur": 1.08}]}, {"segs": [{"id": "b7", "who": "narrator", "da": "[[Jeg skriver til dig, fordi]] jeg bor på 2. sal i nr. 14 og gerne vil fortælle om to problemer i vores opgang.", "a": "332f856cafaacc8b", "dur": 5.72}]}, {"segs": [{"id": "b8", "who": "narrator", "da": "**Desværre har jeg oplevet, at** dørtelefonen ved hoveddøren ikke har virket siden i mandags.", "a": "deb279c0eb997f58", "dur": 4.52}, {"id": "b9", "who": "narrator", "da": "Det er lidt svært, når man venter på gæster eller pakker.", "a": "7ba668c1b97dd7cf", "dur": 3.16}, {"id": "b10", "who": "narrator", "da": "Derudover har der været meget larm om natten fra 3. sal i denne uge, selvom der står i husordenen, at der skal være ro efter kl. 22.00.", "a": "99201e71137ff92d", "dur": 6.8}]}, {"segs": [{"id": "b11", "who": "narrator", "da": "[[Vil du være sød at]] komme og kigge på dørtelefonen, og [[kunne du måske]] sende en venlig påmindelse til alle i opgangen?", "a": "0a9dc7fa82d06813", "dur": 5.12}]}, {"segs": [{"id": "b12", "who": "narrator", "da": "[[På forhånd tak for hjælpen!]]", "a": "642b69296c2bb899", "dur": 1.44}]}, {"segs": [{"id": "b13", "who": "narrator", "da": "Venlig hilsen", "a": "c764113a98cff49f", "dur": 1.32}, {"id": "b14", "who": "narrator", "da": "Kasper Lind", "nl": true, "a": "78b04d472808e2f5", "dur": 1.84}], "zh_all": "小区公告（索尔巴肯住房协会）：亲爱的各位住户，请牢记我们共同的楼栋公约，让每个人都能在楼里舒心生活：工作日（周日至周四）晚上 22:00 以后楼道必须保持安静。出于消防安全考虑，禁止在楼道内停放自行车、婴儿车或堆放纸箱。如果楼内有设施损坏，请联系管理员亨里克（henrik@solbakken.dk）。\n半正式邮件范本：你好，亨里克。我写信给你，是因为我住在 14 号 2 楼，想向你反映我们楼道里的两个问题。很遗憾，我发现大门处的对讲门铃从周一以来就一直失灵，等客人或收包裹时有些不便。此外，本周三楼夜里一直很吵，尽管公约规定 22:00 后应保持安静。能麻烦你过来看看对讲门铃，并顺便给楼道全体住户发一封友善的提醒信吗？提前感谢你的帮助！诚挚的问候，卡斯珀·林德。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "楼道，单元楼梯间", "note": "名词 · opgangen, opgange, opgangene", "segs": [{"id": "g1", "who": "narrator", "da": "en opgang", "say": "en opgang. opgangen, opgange, opgangene.", "a": "5bc8f9e430161123", "dur": 5.2}]}, {"zh": "噪音，喧闹声", "note": "名词 · larmen, ingen flertal", "segs": [{"id": "g2", "who": "narrator", "da": "larm (utælleligt)", "say": "larm (utælleligt). larmen, ingen flertal.", "a": "f193425ce9a7590e", "dur": 5.32}]}, {"zh": "公寓大楼，物业房产", "note": "名词 · ejendommen, ejendomme, ejendommene", "segs": [{"id": "g3", "who": "narrator", "da": "en ejendom", "say": "en ejendom. ejendommen, ejendomme, ejendommene.", "a": "ee0b56f6ad15cb06", "dur": 5.2}]}, {"zh": "住房协会，物业管理处", "note": "名词 · boligforeningen, boligforeninger, -erne", "segs": [{"id": "g4", "who": "narrator", "da": "en boligforening", "say": "en boligforening.", "a": "5b23aef4391c23f5", "dur": 2.2}]}, {"zh": "物业管理员，楼管", "note": "名词 · viceværten, viceværter, viceværterne", "segs": [{"id": "g5", "who": "narrator", "da": "en vicevært", "say": "en vicevært. viceværten, viceværter, viceværterne.", "a": "94fccdc9edab032f", "dur": 6.2}]}, {"zh": "大门，正门", "note": "名词 · hoveddøren, hoveddøre, hoveddørene", "segs": [{"id": "g6", "who": "narrator", "da": "en hoveddør", "say": "en hoveddør. hoveddøren, hoveddøre, hoveddørene.", "a": "5be53f35127fc503", "dur": 6.12}]}, {"zh": "对讲门铃", "note": "名词 · dørtelefonen, dørtelefoner, -erne", "segs": [{"id": "g7", "who": "narrator", "da": "en dørtelefon", "say": "en dørtelefon.", "a": "fe06ae3e7bcd3c40", "dur": 1.48}]}, {"zh": "楼栋住户公约", "note": "名词 · husordenen, husordener, -erne", "segs": [{"id": "g8", "who": "narrator", "da": "en husorden", "say": "en husorden.", "a": "4e197dfaa3cd37cb", "dur": 1.4}]}, {"zh": "提醒，提示", "note": "名词 · påmindelsen, påmindelser, -erne", "segs": [{"id": "g9", "who": "narrator", "da": "en påmindelse", "say": "en påmindelse.", "a": "b1f41b1f73ec94dc", "dur": 1.24}]}, {"zh": "投诉，抱怨（接介词 over）", "note": "动词 · klager, klagede, har klaget", "segs": [{"id": "g10", "who": "narrator", "da": "at klage (over)", "say": "at klage (over). klager, klagede, har klaget.", "a": "434b22454612eb57", "dur": 4.68}]}, {"zh": "起作用；（设备）正常运转", "note": "动词 · virker, virkede, har virket", "segs": [{"id": "g11", "who": "narrator", "da": "at virke", "say": "at virke. virker, virkede, har virket.", "a": "220fd75780d65f4f", "dur": 4.88}]}, {"zh": "打扰，干扰", "note": "动词 · forstyrrer, forstyrrede, har forstyrret", "segs": [{"id": "g12", "who": "narrator", "da": "at forstyrre", "say": "at forstyrre. forstyrrer, forstyrrede, har forstyrret.", "a": "cf3355682ef125cf", "dur": 5.16}]}, {"zh": "修理，维修", "note": "动词 · reparerer, reparerede, har repareret", "segs": [{"id": "g13", "who": "narrator", "da": "at reparere", "say": "at reparere. reparerer, reparerede, har repareret.", "a": "f61dfa8207efb5ec", "dur": 5.04}]}, {"zh": "体谅，顾及（接 til）", "note": "动词 · tager, tog, har taget", "segs": [{"id": "g14", "who": "narrator", "da": "at tage hensyn (til)", "say": "at tage hensyn (til). tager, tog, har taget.", "a": "7c0cc3392c9608cd", "dur": 5.0}]}, {"zh": "损坏，坏掉（固定搭配）", "note": "动词 · går, gik, er gået i stykker", "segs": [{"id": "g15", "who": "narrator", "da": "at gå i stykker", "say": "at gå i stykker. går, gik, er gået i stykker.", "a": "41a82b3133d20291", "dur": 5.16}]}, {"zh": "遗憾的是", "note": "副词/形容词", "segs": [{"id": "g16", "who": "narrator", "da": "desværre", "a": "bef698cae6feaf54", "dur": 0.96}]}, {"zh": "预先，提前", "note": "副词/形容词 · 固定短语", "segs": [{"id": "g17", "who": "narrator", "da": "på forhånd", "say": "på forhånd.", "a": "ee3df5dbe4a09f4c", "dur": 0.84}]}, {"zh": "高声吵闹的", "note": "形容词 · -, -e", "segs": [{"id": "g18", "who": "narrator", "da": "højlydt", "say": "højlydt.", "a": "48c81fdfe501311e", "dur": 1.16}]}, {"zh": "坚定的，明确的", "note": "形容词 · -, -e", "segs": [{"id": "g19", "who": "narrator", "da": "bestemt", "say": "bestemt.", "a": "b2940218c5e1d4b8", "dur": 1.08}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en opgang", "zh": "楼道，单元楼梯间", "forms": "opgangen, opgange, opgangene"}, {"pos": "名词", "da": "larm (utælleligt)", "zh": "噪音，喧闹声", "forms": "larmen, ingen flertal"}, {"pos": "名词", "da": "en ejendom", "zh": "公寓大楼，物业房产", "forms": "ejendommen, ejendomme, ejendommene"}, {"pos": "名词", "da": "en boligforening", "zh": "住房协会，物业管理处", "forms": "boligforeningen, boligforeninger, -erne"}, {"pos": "名词", "da": "en vicevært", "zh": "物业管理员，楼管", "forms": "viceværten, viceværter, viceværterne"}, {"pos": "名词", "da": "en hoveddør", "zh": "大门，正门", "forms": "hoveddøren, hoveddøre, hoveddørene"}, {"pos": "名词", "da": "en dørtelefon", "zh": "对讲门铃", "forms": "dørtelefonen, dørtelefoner, -erne"}, {"pos": "名词", "da": "en husorden", "zh": "楼栋住户公约", "forms": "husordenen, husordener, -erne"}, {"pos": "名词", "da": "en påmindelse", "zh": "提醒，提示", "forms": "påmindelsen, påmindelser, -erne"}, {"pos": "动词", "da": "at klage (over)", "zh": "投诉，抱怨（接介词 over）", "forms": "klager, klagede, har klaget"}, {"pos": "动词", "da": "at virke", "zh": "起作用；（设备）正常运转", "forms": "virker, virkede, har virket"}, {"pos": "动词", "da": "at forstyrre", "zh": "打扰，干扰", "forms": "forstyrrer, forstyrrede, har forstyrret"}, {"pos": "动词", "da": "at reparere", "zh": "修理，维修", "forms": "reparerer, reparerede, har repareret"}, {"pos": "动词", "da": "at tage hensyn (til)", "zh": "体谅，顾及（接 til）", "forms": "tager, tog, har taget"}, {"pos": "动词", "da": "at gå i stykker", "zh": "损坏，坏掉（固定搭配）", "forms": "går, gik, er gået i stykker"}, {"pos": "副词/形容词", "da": "desværre / på forhånd", "zh": "遗憾的是 / 预先，提前", "forms": "— / 固定短语"}, {"pos": "形容词", "da": "højlydt / bestemt", "zh": "高声吵闹的 / 坚定的，明确的", "forms": "højlydt (-, -e) / bestemt (-, -e"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "遗憾的是，从上周五以来一直有很多噪音。", "answer": "Desværre har der været meget larm siden i fredags."}, {"zh": "亨里克，请问你能过来看看二楼的大门吗？", "answer": "Hej Henrik, vil du være sød at komme og kigge på døren på anden sal?"}, {"zh": "住房协会能给所有住户发一封友善的提醒吗？", "answer": "Kunne boligforeningen sende en venlig påmindelse til alle beboerne?"}, {"zh": "提前感谢您的帮助！诚挚的问候，艾玛。", "answer": "På forhånd tak for hjælpen! Venlig hilsen, Emma"}]}, {"id": "A", "type": "drill", "title": "练习 A：用本课高频沟通与半正式邮件表达填空（fordi, desværre, over, virker, sød, søde, forhånd, I, jer）", "items": [{"prompt": "Jeg skriver til {{_}} i boligforeningen, {{_}} vi har et problem med støj.", "kind": "cloze", "blanks": [["jer"], ["fordi"]], "explain": "写给机构/复数 ⟦boligforeningen⟧ 用 ⟦jer⟧"}, {"prompt": "{{_}} er vaskemaskinen i kælderen gået i stykker igen.", "kind": "cloze", "blanks": [["Desværre"]], "explain": "注意句首引发 V2 倒装：⟦Desværre er vaskemaskinen...⟧"}, {"prompt": "Hej Henrik! Vil du være {{_}} at reparere lampen i opgangen?", "kind": "cloze", "blanks": [["sød"]], "explain": "对单人 Henrik 用单数 ⟦sød⟧"}, {"prompt": "Kære kundeservice, vil {{_}} være {{_}} at tjekke min bestilling?", "kind": "cloze", "blanks": [["I"], ["søde"]], "explain": "对复数团队用大写 ⟦I⟧ + 复数形容词 ⟦søde⟧"}, {"prompt": "Beboerne vil gerne klage {{_}} de mange cykler foran hoveddøren.", "kind": "cloze", "blanks": [["over"]], "explain": "固定搭配：⟦klage over noget⟧"}, {"prompt": "På {{_}} tak for hjælpen, og hav en god dag!", "kind": "cloze", "blanks": [["forhånd"]]}, {"prompt": "Dørtelefonen {{_}} slet ikke, så mine gæster kan ikke ringe på.", "kind": "cloze", "blanks": [["virker"]], "explain": "⟦virker slet ikke⟧ 完全不工作"}]}, {"id": "B", "type": "drill", "title": "练习 B：语体升级——把“生硬/命令式”的句子改写为礼貌的半正式丹麦语", "items": [{"prompt": "⟦Fix dørtelefonen nu!⟧ → ⟦Vil du være sød at...⟧", "kind": "write", "accept": ["Vil du være sød at reparere dørtelefonen snarest muligt?"]}, {"prompt": "⟦I skal skrive en besked til naboerne!⟧ → ⟦Kunne I måske...⟧", "kind": "write", "accept": ["Kunne I måske sende en venlig påmindelse til naboerne?"]}, {"prompt": "⟦Min vaskemaskine er dårlig. Den duer ikke.⟧ → ⟦Desværre...⟧", "kind": "write", "accept": ["Desværre har jeg oplevet, at min vaskemaskine ikke virker."]}, {"prompt": "⟦Jeg vil tale med dig om vores naboer.⟧ → ⟦Jeg skriver til dig, fordi...⟧", "kind": "write", "accept": ["Jeg skriver til dig, fordi jeg gerne vil tale om vores naboer."]}, {"prompt": "⟦Tak fordi du hjælper mig i morgen.⟧ → ⟦På...⟧", "kind": "write", "accept": ["På forhånd tak for hjælpen!"]}, {"prompt": "⟦Hilsen, Kasper⟧（发给物业经理的邮件落款升级） →", "kind": "write", "accept": ["Venlig hilsen / Med venlig hilsen, Kasper"]}], "open": true}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（半正式投诉与请求核心句）", "items": [{"prompt": "我写信给你们，是因为楼道里的灯坏了（不亮了）。", "kind": "write", "accept": ["Jeg skriver til jer, fordi lyset i opgangen er gået i stykker / ikke virker."]}, {"prompt": "遗憾的是，从上周五以来一直有很多噪音。", "kind": "write", "accept": ["Desværre har der været meget larm siden i fredags."]}, {"prompt": "亨里克，请问你能过来看看二楼的大门吗？", "kind": "write", "accept": ["Hej Henrik, vil du være sød at komme og kigge på døren på anden sal?"]}, {"prompt": "住房协会能给所有住户发一封友善的提醒吗？", "kind": "write", "accept": ["Kunne boligforeningen sende en venlig påmindelse til alle beboerne?"]}, {"prompt": "提前感谢您的帮助！诚挚的问候，艾玛。", "kind": "write", "accept": ["På forhånd tak for hjælpen! Venlig hilsen, Emma"]}]}], "clips": {"kasper har boet på anden sal i en rolig ejendom i aarhus i tre år": "02e5e9a04825d3b2", "men i de sidste to uger har der været et stort problem med larm i opgangen": "8689f4e2f576be90", "flere gange om ugen har nogle nye naboer på tredje sal holdt højlydte fester til klokken to om natten på hverdage og gæsterne har råbt og smækket med dørene på trappen": "20603196e76c0c53", "samtidig har nogen stillet tre gamle cykler og store papkasser lige foran hoveddøren så det er næsten umuligt for de ældre beboere at komme forbi med deres rollatorer": "e7b01a3b33352b87", "først prøvede kasper at snakke pænt med sin nabo som lovede at tage mere hensyn": "b50cbdaae4f307d0", "men desværre ændrede intet sig": "4fb513b82fd943d7", "i går aftes kunne kasper slet ikke sove før klokken blev tre": "138fcd4740760f24", "derfor satte han sig ved computeren i morges og skrev en høflig men bestemt e-mail til boligforeningen hvor han forklarede situationen og bad dem om hjælp": "00a21b8c54a0002a", "kære alle beboere": "8d5f240c32bcf681", "husk vores fælles husorden så alle kan trives i ejendommen": "0099c6713ef1fe76", "der skal være ro i opgangen efter kl 2200 på hverdage (søndag–torsdag)": "725adc17a1c46df1", "af hensyn til brandsikkerheden må man ikke stille cykler barnevogne eller kasser i opgangen": "a1ba0fbfcd2a2e33", "hvis noget i bygningen er gået i stykker bedes i kontakte viceværten henrik på henrik@solbakkendk": "bbf44988e2bca520", "hej henrik": "6deab38544d4b991", "jeg skriver til dig fordi jeg bor på 2 sal i nr 14 og gerne vil fortælle om to problemer i vores opgang": "332f856cafaacc8b", "desværre har jeg oplevet at dørtelefonen ved hoveddøren ikke har virket siden i mandags": "deb279c0eb997f58", "det er lidt svært når man venter på gæster eller pakker": "7ba668c1b97dd7cf", "derudover har der været meget larm om natten fra 3 sal i denne uge selvom der står i husordenen at der skal være ro efter kl 2200": "99201e71137ff92d", "vil du være sød at komme og kigge på dørtelefonen og kunne du måske sende en venlig påmindelse til alle i opgangen": "0a9dc7fa82d06813", "på forhånd tak for hjælpen": "642b69296c2bb899", "venlig hilsen": "c764113a98cff49f", "kasper lind": "78b04d472808e2f5", "en opgang": "5bc8f9e430161123", "larm (utælleligt)": "f193425ce9a7590e", "en ejendom": "ee0b56f6ad15cb06", "en boligforening": "5b23aef4391c23f5", "en vicevært": "94fccdc9edab032f", "en hoveddør": "5be53f35127fc503", "en dørtelefon": "fe06ae3e7bcd3c40", "en husorden": "4e197dfaa3cd37cb", "en påmindelse": "b1f41b1f73ec94dc", "at klage (over)": "434b22454612eb57", "at virke": "220fd75780d65f4f", "at forstyrre": "cf3355682ef125cf", "at reparere": "f61dfa8207efb5ec", "at tage hensyn (til)": "7c0cc3392c9608cd", "at gå i stykker": "41a82b3133d20291", "desværre": "bef698cae6feaf54", "på forhånd": "ee3df5dbe4a09f4c", "højlydt": "48c81fdfe501311e", "bestemt": "b2940218c5e1d4b8"}, "key": "ncd2-L18"}, {"book": "ncd2", "lesson": 19, "title_da": "En pakke, der aldrig kom frem", "title_zh": "一个从未送达的包裹", "grammar": "时间界限介词与从句连词精析：siden（自从……以来，常配现在完成时） vs indtil（直到……为止） vs inden / før（在……之前） vs i løbet af（在……期间内）", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：En pakke, der aldrig kom frem（叙事短文 · 约 135 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "For ti dage siden bestilte Emil en særlig fødselsdagsgave til sin kæreste, Julie, i en dansk netbutik.", "a": "f360b58dfa83feca", "dur": 5.48}, {"id": "a2", "who": "narrator", "da": "Han bestilte den i god tid, så den kunne komme frem [[inden]] hendes fødselsdag på fredag.", "a": "4631a85207172916", "dur": 3.96}, {"id": "a3", "who": "narrator", "da": "Ifølge ordrebekræftelsen ville pakken ankomme [[i løbet af]] to til tre hverdage.", "a": "926dbf7b1e50080f", "dur": 4.64}], "zh": "十天前，埃米尔在一家丹麦网店为他的女友尤莉娅订购了一份特别的生日礼物。他提前充足的时间下了单，好让包裹能在她周五生日前送到。根据订单确认函，包裹将在两到三个工作日内送达。"}, {"segs": [{"id": "a4", "who": "narrator", "da": "Men der gik fem dage, og der skete ingenting. **Siden** i tirsdags har Emil tjekket pakke-appen ti gange om dagen, men statussen har ikke ændret sig [[siden]] da.", "a": "b6d645d52f492234", "dur": 10.28}, {"id": "a5", "who": "narrator", "da": "Han ventede tålmodigt [[indtil]] torsdag eftermiddag, hvor han endelig ringede til kundeservice.", "a": "29db053972b594ae", "dur": 4.72}], "zh": "然而五天过去了，却毫无动静。从周二以来，埃米尔每天查看十遍包裹追踪软件，但物流状态从那时起就一直没有变化。他耐心地一直等到周四下午，才终于拨通了客服电话。"}, {"segs": [{"id": "a6", "who": "narrator", "da": "En venlig medarbejder tjekkede systemet og opdagede hurtigt fejlen: Chaufføren havde ikke kunnet finde Emils dørklokke i opgangen, så pakken havde faktisk ligget i den lokale pakkeshop [[siden]] onsdag morgen!", "a": "c01fe70b579bfc56", "dur": 11.2}, {"id": "a7", "who": "narrator", "da": "Emil skyndte sig straks ud ad døren og nåede at hente pakken fem minutter, **inden** butikken lukkede klokken atten.", "a": "a93fc65b796ac468", "dur": 5.88}], "zh": "一位友善的员工查询系统后很快发现了问题所在：送货司机在楼道里没能找到埃米尔家的门铃，所以包裹其实从周三早上起就一直躺在当地的包裹代收点里！埃米尔立刻冲出家门，赶在代收点晚上六点关门前五分钟成功取到了包裹。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Ordrebekræftelse & Kundeservice-mail（对标 DU3 Modul 2 实用信息与客服沟通）", "scene": null, "paras": [{"cue": "订单确认单｜Ordrebekræftelse #48291 — Nordisk Gaveshop", "segs": [{"id": "b1", "who": "narrator", "da": "Tak for din bestilling, Emil!", "a": "007abc948df1c6b6", "dur": 1.8}, {"id": "b2", "who": "narrator", "da": "Leveringstid: Din pakke bliver leveret [[i løbet af]] 2–3 hverdage.", "nl": true, "a": "f575f7f964ea3cf6", "dur": 4.48}, {"id": "b3", "who": "narrator", "da": "Afhentning: Hvis du ikke er hjemme, sendes pakken til nærmeste pakkeshop og skal hentes [[inden]] 7 dage.", "nl": true, "a": "99d2aaf040597b7e", "dur": 6.32}, {"id": "b4", "who": "narrator", "da": "Åbningstider i pakkeshop: Mandag–fredag [[indtil]] kl. 18.00.", "nl": true, "a": "91370a29bf9b5be5", "dur": 3.84}]}, {"cue": "客服往来邮件｜Emne: Reklamation — hvor er min pakke?", "segs": [{"id": "b5", "who": "narrator", "da": "Fra: Emil → Til: Kundeservice", "say": "Fra: Emil, Til: Kundeservice", "a": "46a6ef86e8d619f8", "dur": 3.52}, {"id": "b6", "who": "narrator", "da": "Hej!", "nl": true, "a": "0ffa80c59eaee71b", "dur": 1.08}, {"id": "b7", "who": "narrator", "da": "Jeg skriver til jer, fordi jeg bestilte en gave den 4. maj (ordrenr. 48291).", "a": "dc95515ebfbb58e8", "dur": 5.8}, {"id": "b8", "who": "narrator", "da": "Jeg fik besked om, at pakken ville komme [[i løbet af]] 2–3 hverdage, men jeg har stadig ikke modtaget den, og sporingen har ikke flyttet sig [[siden]] i tirsdags.", "a": "a3f964557126eb1f", "dur": 7.56}, {"id": "b9", "who": "narrator", "da": "Kan I hjælpe mig, [[inden]] jeg skal til fødselsdag på fredag?", "a": "834566aa066555cd", "dur": 2.48}, {"id": "b10", "who": "narrator", "da": "Venlig hilsen, Emil.", "a": "8983d1dec5e565ce", "dur": 2.16}]}, {"segs": [{"id": "b11", "who": "narrator", "da": "Fra: Kundeservice → Til: Emil", "say": "Fra: Kundeservice, Til: Emil", "a": "f19b879a3caa2186", "dur": 2.84}, {"id": "b12", "who": "narrator", "da": "Hej Emil!", "nl": true, "a": "a40322507651d1ac", "dur": 0.92}, {"id": "b13", "who": "narrator", "da": "Tak for din henvendelse.", "a": "375bd7a5b422020d", "dur": 1.68}, {"id": "b14", "who": "narrator", "da": "Vi beklager ventetiden!", "a": "4b0ad22e306cddc7", "dur": 1.76}, {"id": "b15", "who": "narrator", "da": "Jeg kan se, at vores chauffør desværre ikke fandt din dørklokke i går.", "a": "73213ff8fad2217b", "dur": 3.04}, {"id": "b16", "who": "narrator", "da": "Din pakke har derfor ligget i Kiosk Hjørnet [[siden]] i går morges, og du kan hente den [[indtil]] den 18. maj.", "a": "410fc82e4387f955", "dur": 4.96}, {"id": "b17", "who": "narrator", "da": "Husk dit pas eller kørekort!", "a": "88d30b0d4d03b64f", "dur": 2.08}, {"id": "b18", "who": "narrator", "da": "Venlig hilsen, Mette, Kundeservice.", "a": "6576e7fe510adb49", "dur": 2.96}], "zh_all": "订单确认单（北欧礼品店）：感谢您的订购，埃米尔！配送时间：您的包裹将在 2–3 个工作日内送达。取件说明：如果您不在家，包裹将送至最近的代收点，必须在 7 天内领取。代收点营业时间：周一至周五营业至 18:00。\n埃米尔致客服：你好！我写信给你们，是因为我在 5 月 4 日订购了一份礼物（订单号 48291）。我收到通知说包裹会在 2–3 个工作日内到达，但我至今仍未收到，而且物流追踪从周二以来就没有更新过。你们能在我周五参加生日聚会前帮我查一下吗？诚挚的问候，埃米尔。\n客服回复：你好，埃米尔！感谢你的来信，很抱歉让你久等！我查到我们的司机昨天遗憾地没找到你的门铃。因此你的包裹从昨天早上起一直存放在“街角便利店”，你可以在 5 月 18 日之前去取件。请记得带上你的护照或驾照！诚挚的问候，梅特，客服部。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "包裹", "note": "名词 · pakken, pakker, pakkerne", "segs": [{"id": "g1", "who": "narrator", "da": "en pakke", "s pt": "Vi bliver nødt til at vente i stuen, {{_}} pakkebuddet kommer.", "kind": "cloze", "blanks": [["indtil"]], "explain": "一直等到快递员到达为止"}, {"prompt": "Kundeservice lovede at sende en ny pakke {{_}} to arbejdsdage.", "kind": "cloze", "blanks": [["i løbet af"]], "explain": "在两个工作日的时间段之内"}, {"prompt": "Supermarkedet ved stationen har åbent {{_}} klokken 21.00 hver aften.", "kind": "cloze", "blanks": [["indtil"]], "explain": "营业持续到 21 点"}, {"prompt": "Emil havde ikke tjekket sin spam-mappe, {{_}} han ringede til butikken.", "kind": "cloze", "blanks": [["inden / før"]], "explain": "在打电话之前一直没查过垃圾邮件箱"}, {"prompt": "{{_}} næste uge skal vi alle sammen aflevere vores opgave.", "kind": "cloze", "blanks": [["I løbet af"]], "explain": "在下周这段期间内；注意句首触发 V2 倒装 ⟦skal vi⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：用括号内的连词合并句子（注意时态衔接与句首从句 V2 倒装）", "items": [{"prompt": "Han bestilte bogen i mandags. Han har ikke hørt noget. （用 ⟦Siden⟧ 放句首）", "kind": "write", "accept": ["Siden han bestilte bogen i mandags, har han ikke hørt noget."], "explain": "从句在句首，主句动词 ⟦har⟧ 倒装到第 2 位"}, {"prompt": "Vi sad på caféen. Regnen stoppede. （用 ⟦indtil⟧ 连接）", "kind": "write", "accept": ["Vi sad på caféen, indtil regnen stoppede."]}, {"prompt": "Hun skal hente pakken. Butikken lukker kl. 18. （用 ⟦inden⟧ 连接）", "kind": "write", "accept": ["Hun skal hente pakken, inden butikken lukker kl. 18."]}, {"prompt": "Det har regnet hver dag. Vi ankom til København. （用 ⟦siden⟧ 连接）", "kind": "write", "accept": ["Det har regnet hver dag, siden vi ankom til København."]}, {"prompt": "Jeg læste ordrebekræftelsen grundigt. Jeg ringede til kundeservice. （用 ⟦Før⟧ 放句首）", "kind": "write", "accept": ["Før jeg ringede til kundeservice, læste jeg ordrebekræftelsen grundigt."], "explain": "注意倒装 ⟦læste jeg⟧"}, {"prompt": "De tjekkede appen hele tiden. De fik en SMS om afhentning. （用 ⟦indtil⟧ 连接）", "kind": "write", "accept": ["De tjekkede appen hele tiden, indtil de fik en SMS om afhentning."]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（网购与时间界限核心表达）", "items": [{"prompt": "从上周一起，我就一直在等我的包裹。", "kind": "write", "accept": ["Siden i mandags har jeg ventet på min pakke.", "Jeg har ventet på min pakke siden i mandags."]}, {"prompt": "根据订单确认，他们将在三天内发货。", "kind": "write", "accept": ["Ifølge ordrebekræftelsen sender de pakken i løbet af tre dage."]}, {"prompt": "我得在商店关门之前去取这件礼物。", "kind": "write", "accept": ["Jeg skal hente gaven, inden butikken lukker."]}, {"prompt": "我们在家一直等到下午四点，但没有人按门铃。", "kind": "write", "accept": ["Vi ventede hjemme indtil klokken seksten (fire om eftermiddagen), men ingen ringede på."]}, {"prompt": "在我打电话给客服之前，我并不知道包裹就在代收点。", "kind": "write", "accept": ["Inden / Før jeg ringede til kundeservice, vidste jeg ikke, at pakken lå i pakkeshoppen."]}]}], "clips": {"for ti dage siden bestilte emil en særlig fødselsdagsgave til sin kæreste julie i en dansk netbutik": "f360b58dfa83feca", "han bestilte den i god tid så den kunne komme frem inden hendes fødselsdag på fredag": "4631a85207172916", "ifølge ordrebekræftelsen ville pakken ankomme i løbet af to til tre hverdage": "926dbf7b1e50080f", "men der gik fem dage og der skete ingenting siden i tirsdags har emil tjekket pakke-appen ti gange om dagen men statussen har ikke ændret sig siden da": "b6d645d52f492234", "han ventede tålmodigt indtil torsdag eftermiddag hvor han endelig ringede til kundeservice": "29db053972b594ae", "en venlig medarbejder tjekkede systemet og opdagede hurtigt fejlen chaufføren havde ikke kunnet finde emils dørklokke i opgangen så pakken havde faktisk ligget i den lokale pakkeshop siden onsdag morgen": "c01fe70b579bfc56", "emil skyndte sig straks ud ad døren og nåede at hente pakken fem minutter inden butikken lukkede klokken atten": "a93fc65b796ac468", "tak for din bestilling emil": "007abc948df1c6b6", "leveringstid din pakke bliver leveret i løbet af 2–3 hverdage": "f575f7f964ea3cf6", "afhentning hvis du ikke er hjemme sendes pakken til nærmeste pakkeshop og skal hentes inden 7 dage": "99d2aaf040597b7e" ": "prose", "tab": "Tekst A", "title": "Tekst A：Samtale med chefen om arbejdstid（叙事短文 · 约 165 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Linnea arbejder på deltid i et bageri i Odense, mens hun går til dansk to gange om ugen.", "a": "25736b077eef1dff", "dur": 6.2}, {"id": "a2", "who": "narrator", "da": "Næste måned skal hun tage sin Modul 2-prøve på en fredag formiddag, og ugen efter kommer hendes forældre på besøg fra udlandet.", "a": "0439b6060cc0f926", "dur": 6.92}, {"id": "a3", "who": "narrator", "da": "Derfor blev hun nødt til at tale med sin chef, Henrik, om sit arbejdsskema.", "a": "26df85a066538662", "dur": 4.12}], "zh": "琳妮娅在欧登塞的一家面包店做兼职，同时每周上两次丹麦语课。下个月的一个周五上午，她要参加 Modul 2 考试，再下一周她的父母还要从国外来看望她。因此，她必须和老板亨里克商量一下自己的排班表。"}, {"segs": [{"id": "a4", "who": "narrator", "da": "Fredag eftermiddag bankede hun lidt nervøst på døren til Henriks kontor.", "a": "e814958de7618b1a", "dur": 4.12}, {"id": "a5", "who": "narrator", "da": "”Undskyld, Henrik, [[kunne]] vi måske snakke i fem minutter?”", "a": "e70223f7ae895fed", "dur": 3.24}, {"id": "a6", "who": "narrator", "da": "spurgte hun.", "a": "c860a4eb74dea480", "dur": 1.08}, {"id": "a7", "who": "narrator", "da": "Henrik nikkede venligt og bad hende om at sætte sig ned.", "a": "d99b712b3c1f4fcb", "dur": 3.68}], "zh": "周五下午，她有些紧张地敲响了亨里克办公室的门。“不好意思，亨里克，我们能聊五分钟吗？”她问道。亨里克友善地点点头，请她坐下。"}, {"segs": [{"id": "a8", "who": "narrator", "da": "Linnea tog en dyb indånding og sagde: ”Jeg [[ville]] gerne spørge, om jeg [[måtte]] bytte vagt næste fredag, fordi jeg har en vigtig danskprøve.", "a": "b42459009fec770c", "dur": 8.64}, {"id": "a9", "who": "narrator", "da": "Og [[ville]] det eventuelt være muligt for mig at arbejde lidt færre timer i næste uge, når mine forældre er her?”", "a": "81a6131f25c63196", "dur": 5.64}], "zh": "琳妮娅深吸一口气说道：“我想问一下，下周五我可不可以换一下班，因为我有一场重要的丹麦语考试。另外，下下周我父母在这里的时候，我有没有可能少上几个小时班呢？”"}, {"segs": [{"id": "a10", "who": "narrator", "da": "Henrik smilede og svarede: ”Selvfølgelig!", "a": "f9f3b0f689c0ccf1", "dur": 3.48}, {"id": "a11", "who": "narrator", "da": "Det [[ville]] være dejligt, hvis du først [[kunne]] spørge Kasper, om han kan tage fredag formiddag.", "a": "dd30c13c4acafb25", "dur": 4.36}, {"id": "a12", "who": "narrator", "da": "Så finder vi ud af resten, og held og lykke med prøven!”", "a": "5ce28ebc779f5372", "dur": 2.68}], "zh": "亨里克微笑着回答道：“当然可以！如果你能先问问卡斯珀他周五上午能不能顶班，那就太好了。剩下的我们再一起协调解决，祝你考试顺利！”"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Mail til chefen om vagtbytte og chefens svar（对标 DU3 Modul 2 职场沟通邮件）", "scene": null, "paras": [{"cue": "员工申请邮件｜Til: Henrik (Chef) Emne: Ønske om vagtbytte og fridage i maj", "segs": [{"id": "b1", "who": "narrator", "da": "Hej Henrik", "a": "6deab38544d4b991", "dur": 1.08}]}, {"segs": [{"id": "b2", "who": "narrator", "da": "Jeg håber, at du har haft en god uge.", "a": "10d2ab0bf9511bc5", "dur": 1.84}, {"id": "b3", "who": "narrator", "da": "Jeg skriver til dig, fordi jeg gerne [[ville]] høre, om det [[kunne]] passe ind i vores skema, at jeg holder tre dages fri fra den 15. til den 17. maj.", "a": "86a97aac06f75a7a", "dur": 6.92}, {"id": "b4", "who": "narrator", "da": "Min søster skal giftes i Tyskland, så hele familien rejser derned.", "a": "5d0e39df2ea8e93a", "dur": 3.72}]}, {"segs": [{"id": "b5", "who": "narrator", "da": "Derudover [[ville]] jeg spørge, om jeg [[måtte]] bytte min torsdagsvagt med Sofie i næste uge.", "a": "2c80d1eb0a7660ce", "dur": 4.84}, {"id": "b6", "who": "narrator", "da": "Hun har allerede sagt ja til det.", "a": "daceb5630ceda37a", "dur": 2.0}, {"id": "b7", "who": "narrator", "da": "Til gengæld tager jeg meget gerne et par ekstra vagter i slutningen af måneden.", "a": "7e159737d8e7674b", "dur": 3.28}]}, {"segs": [{"id": "b8", "who": "narrator", "da": "Det [[ville]] være en stor hjælp, hvis det [[kunne]] lade sig gøre!", "a": "ddf6877d120b76c9", "dur": 2.6}]}, {"segs": [{"id": "b9", "who": "narrator", "da": "Venlig hilsen", "a": "c764113a98cff49f", "dur": 1.32}, {"id": "b10", "who": "narrator", "da": "Mikkel", "nl": true, "a": "6e2397ba62a428d9", "dur": 0.88}]}, {"cue": "老板回复｜Fra: Henrik Emne: Sv: Ønske om vagtbytte og fridage i maj", "segs": [{"id": "b11", "who": "narrator", "da": "Hej Mikkel", "a": "f90aba79b798c0ef", "dur": 0.84}]}, {"segs": [{"id": "b12", "who": "narrator", "da": "Tak for din mail.", "a": "bc22426e7dd6d19f", "dur": 1.56}, {"id": "b13", "who": "narrator", "da": "Det kan vi sagtens finde ud af!", "a": "d1ed70bb59fd9a0e", "dur": 1.8}, {"id": "b14", "who": "narrator", "da": "Det er helt fint, at du bytter torsdagsvagt med Sofie, og du må meget gerne tage tre dages fri i maj.", "a": "2ef32aabf32a95a7", "dur": 4.48}, {"id": "b15", "who": "narrator", "da": "Send mig en påmindelse i kalenderen, så skriver jeg det ind i næste måneds vagtplan.", "a": "8431075c6095b48f", "dur": 4.08}, {"id": "b16", "who": "narrator", "da": "Stort tillykke til din søster!", "a": "601757f1818aab57", "dur": 1.72}]}, {"segs": [{"id": "b17", "who": "narrator", "da": "Venlig hilsen", "a": "c764113a98cff49f", "dur": 1.32}, {"id": "b18", "who": "narrator", "da": "Henrik", "nl": true, "a": "c032e1f5800b9303", "dur": 0.92}], "zh_all": "米克尔的请假邮件：你好，亨里克。希望你这周一切顺利。我写信给你，是因为我想请问一下，5 月 15 日到 17 日我请三天假在排班表上是否合适。我妹妹要在德国结婚，全家人都会过去。此外，我还想问下周四的班我能不能和索菲换一下，她已经答应了。作为回报，我非常乐意在月底多接几个班。如果这能行得通，那就帮了大忙了！诚挚的问候，米克尔。\n亨里克的回复：你好，米克尔。谢谢你的邮件。这完全没问题！你和索菲换周四的班完全可以，五月份你也可以放心休三天假。在日历上给我发个提醒，我就把它写进下个月的排班表里。热烈祝贺你妹妹！诚挚的问候，亨里克。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "谈话，面谈", "note": "名词 · samtalen, samtaler, samtalerne", "segs": [{"id": "g1", "who": "narrator", "da": "en samtale", "say": "en samtale. samtalen, samtaler, samtalerne.", "a": "2255e4cfbbd14ce1", "dur": 5.88}]}, {"zh": "老板，主管，经理", "note": "名词 · chefen, chefer, cheferne", "segs": [{"id": "g2", "who": "narrator", "da": "en chef", "say": "en chef. chefen, chefer, cheferne.", "a": "351 {"id": "g12", "who": "narrator", "da": "at tilbyde", "say": "at tilbyde. tilbyder, tilbød, har tilbudt.", "a": "de3904e097c239ec", "dur": 4.56}]}, {"zh": "适合，契合（排班等）", "note": "动词 · passer, passede, har passet", "segs": [{"id": "g13", "who": "narrator", "da": "at passe ind (i)", "say": "at passe ind (i). passer, passede, har passet.", "a": "ace4db34020051bc", "dur": 5.08}]}, {"zh": "行得通，办得到", "note": "动词 · lader, lod, har ladt sig gøre", "segs": [{"id": "g14", "who": "narrator", "da": "at lade sig gøre", "say": "at lade sig gøre. lader, lod, har ladt sig gøre.", "a": "8963b47b85b40937", "dur": 5.32}]}, {"zh": "可能的", "note": "形容词/副词 · -t, -e", "segs": [{"id": "g15", "who": "narrator", "da": "mulig", "say": "mulig.", "a": "10ccab871f327d9c", "dur": 1.04}]}, {"zh": "酌情，或许（软化语气）", "note": "形容词/副词 · 副词", "segs": [{"id": "g16", "who": "narrator", "da": "eventuelt", "say": "eventuelt.", "a": "338e10c26d048ea5", "dur": 1.48}]}, {"zh": "兼职地", "note": "短语", "segs": [{"id": "g17", "who": "narrator", "da": "på deltid", "a": "6f98132fda8b35a3", "dur": 1.32}]}, {"zh": "作为回报，相对地", "note": "短语", "segs": [{"id": "g18", "who": "narrator", "da": "til gengæld", "a": "7c4ae6fbc71e7762", "dur": 1.08}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en samtale", "zh": "谈话，面谈", "forms": "samtalen, samtaler, samtalerne"}, {"pos": "名词", "da": "en chef", "zh": "老板，主管，经理", "forms": "chefen, chefer, cheferne"}, {"pos": "名词", "da": "en arbejdstid", "zh": "工作时间，工时", "forms": "arbejdstiden, arbejdstider, -erne"}, {"pos": "名词", "da": "en vagt", "zh": "班次，值班", "forms": "vagten, vagter, vagterne"}, {"pos": "名词", "da": "en fridag", "zh": "休息日，休假日", "forms": "fridagen, fridage, fridagene"}, {"pos": "名词", "da": "et skema", "zh": "排班表，日程表", "forms": "skemaet, skemaer, skemaerne"}, {"pos": "名词", "da": "en vagtplan", "zh": "轮班计划表", "forms": "vagtplanen, vagtplaner, -erne"}, {"pos": "名词", "da": "en hjælp", "zh": "帮助（不可数）", "forms": "hjælpen, ingen flertal"}, {"pos": "动词", "da": "at bytte (vagt)", "zh": "交换，调换（班次）", "forms": "bytter, byttede, har byttet"}, {"pos": "动词", "da": "at spørge", "zh": "询问，提问（g 不发音）", "forms": "spørger, spurgte, har spurgt"}, {"pos": "动词", "da": "at banke på", "zh": "敲（门）", "forms": "banker på, bankede på, har banket på"}, {"pos": "动词", "da": "at tilbyde", "zh": "主动提供，提议", "forms": "tilbyder, tilbød, har tilbudt"}, {"pos": "动词", "da": "at passe ind (i)", "zh": "适合，契合（排班等）", "forms": "passer, passede, har passet"}, {"pos": "动词", "da": "at lade sig gøre", "zh": "行得通，办得到", "forms": "lader, lod, har ladt sig gøre"}, {"pos": "形容词/副词", "da": "mulig / eventuelt", "zh": "可能的 / 酌情，或许（软化语气）", "forms": "mulig (-t, -e) / 副词"}, {"pos": "短语", "da": "på deltid / til gengæld", "zh": "兼职地 / 作为回报，相对地", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "不好意思，我能和您聊两分钟吗？", "answer": "Undskyld, kunne vi måske snakke sammen i to minutter?"}, {"zh": "我想请问一下，下周五我可不可以休一天假？", "answer": "Jeg ville gerne spørge, om jeg måtte holde fri næste fredag."}, {"zh": "如果您方便的话，我们能不能把会议改到下周一？", "answer": "Kunne vi eventuelt flytte mødet til næste mandag, hvis det passer dig?"}, {"zh": "如果你能和卡斯珀换班，那就太好了。", "answer": "Det ville være dejligt, hvis du kunne bytte vagt med Kasper."}, {"zh": "作为回报，下周我可以多上几个小时班。", "answer": "Til gengæld kan jeg arbejde nogle ekstra timer i næste uge."}]}, {"id": "A", "type": "drill", "title": "练习 A：用礼貌过去时改写下列直白请求（可适当加入 måske / eventuelt / gerne）", "items": [{"prompt": "⟦Kan du hjælpe mig med at bære kassen?⟧ →", "kind": "write", "accept": ["Kunne du måske hjælpe mig med at bære kassen?"]}, {"prompt": "⟦Jeg vil spørge, om jeg må gå tidligt hjem i dag.⟧ →", "kind": "write", "accept": ["Jeg ville gerne spørge, om jeg måtte gå tidligt hjem i dag."]}, {"prompt": "⟦Er det muligt at få to ugers ferie i juli?⟧ →", "kind": "write", "accept": ["Ville det være muligt at få to ugers ferie i juli?"]}, {"prompt": "⟦Det er dejligt, hvis du kan arbejde på lørdag.⟧ →", "kind": "write", "accept": ["Det ville være dejligt, hvis du kunne arbejde på lørdag."]}, {"prompt": "⟦Kan vi flytte vores møde til klokken ti?⟧ →", "kind": "write", "accept": ["Kunne vi eventuelt flytte vores møde til klokken ti?"]}, {"prompt": "⟦Jeg vil høre, om jeg kan bytte vagt med Emma.⟧ →", "kind": "write", "accept": ["Jeg ville gerne høre, om jeg måtte / kunne bytte vagt med Emma."]}, {"prompt": "⟦Må jeg bruge din computer i fem minutter?⟧ →", "kind": "write", "accept": ["Måtte jeg eventuelt bruge din computer i fem minutter?", "Kunne jeg låne din computer...?"]}], "open": true}, {"id": "B", "type": "drill", "title": "练习 B：选词填空（kunne, ville, måtte, om, hvis, eventuelt, til gengæld, skema）", "items": [{"prompt": "Undskyld Henrik, jeg {{_}} gerne tale med dig om mit nye {{_}}.", "kind": "cloze", "blanks": [["ville"], ["skema"]], "explain": "注意呼语后用陈述语序：⟦jeg ville gerne...⟧"}, {"prompt": "Jeg ville spørge, {{_}} jeg {{_}} få fri næste tirsdag formiddag.", "kind": "cloze", "blanks": [["om"], ["måtte"]]}, {"prompt": "{{_}} vi {{_}} finde en løsning inden i morgen?", "kind": "cloze", "blanks": [["Kunne"], ["eventuelt / måske"]]}, {"prompt": "Det ville være en stor hjælp, {{_}} du kunne tage min aftenarbejdstid i dag.", "kind": "cloze", "blanks": [["hvis"]]}, {"prompt": "Jeg kan hjælpe dig på fredag, og {{_}} kan du tage min vagt på søndag.", "kind": "cloze", "blanks": [["til gengæld"]]}, {"prompt": "{{_}} det være muligt for dig at arbejde på deltid næste måned?", "kind": "cloze", "blanks": [["Ville"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（使用本课 Høflig datid 职场委婉句型）", "items": [{"prompt": "不好意思，我能和您聊两分钟吗？", "kind": "write", "accept": ["Undskyld, kunne vi måske snakke sammen i to minutter?"]}, {"prompt": "我想请问一下，下周五我可不可以休一天假？", "kind": "write", "accept": ["Jeg ville gerne spørge, om jeg måtte holde fri næste fredag."]}, {"prompt": "如果您方便的话，我们能不能把会议改到下周一？", "kind": "write", "accept": ["Kunne vi eventuelt flytte mødet til næste mandag, hvis det passer dig?"]}, {"prompt": "如果你能和卡斯珀换班，那就太好了。", "kind": "write", "accept": ["Det ville være dejligt, hvis du kunne bytte vagt med Kasper."]}, {"prompt": "作为回报，下周我可以多上几个小时班。", "kind": "write", "accept": ["Til gengæld kan jeg arbejde nogle ekstra timer i næste uge."]}]}], "clips": {"linnea arbejder på deltid i et bageri i odense mens hun går til dansk to gange om ugen": "25736b077eef1dff", "næste måned skal hun tage sin modul 2-prøve på en fredag formiddag og ugen efter kommer hendes forældre på besøg fra udlandet": "0439b6060cc0f926", "derfor blev hun nødt til at tale med sin chef henrik om sit arbejdsskema": "26df85a066538662", "fredag eftermiddag bankede hun lidt nervøst på døren til henriks kontor": "e814958de7618b1a", "undskyld henrik kunne vi måske snakke i fem minutter": "e70223f7ae895fed", "spurgte hun": "c860a4eb74dea480", "henrik nikkede venligt og bad hende om at sætte sig ned": "d99b712b3c1f4fcb", "linnea tog en dyb indånding og sagde jeg ville gerne spørge om jeg måtte bytte vagt næste fredag fordi jeg har en vigtig danskprøve": "b42459009fec770c", "og ville det eventuelt være muligt for mig at arbejde lidt færre timer i næste uge når mine forældre er her": "81a6131f25c63196", "henrik smilede og svarede selvfølgelig": "f9f3b0f689c0ccf1", "det ville være dejligt hvis du først kunne spørge kasper om han kan tage fredag formiddag": "dd30c13c4acafb25", "så finder vi ud af resten og held og lykke med prøven": "5ce28ebc779f5372", "hej henrik": "6deab38544d4b991", "jeg håber at du har haft en god uge": "10d2ab0bf9511bc5", "jeg skriver til dig fordi jeg gerne ville høre om det kunne passe ind i vores skema at jeg holder tre dages fri fra den 15 til den 17 maj": "86a97aac06f75a7a", "min søster skal giftes i tyskland så hele familien rejser derned": "5d0e39df2ea8e93a", "derudover ville jeg spørge om jeg måtte bytte min torsdagsvagt med sofie i næste uge": "2c80d1eb0a7660ce", "hun har allerede sagt ja til det": "daceb5630ceda37a", "til gengæld tager jeg meget gerne et par ekstra vagter i slutningen af måneden": "7e159737d8e7674b", "det ville være en stor hjælp hvis det kunne lade sig gøre": "ddf6877d120b76c9", "venlig hilsen": "c764113a98cff49f", "mikkel": "6e2397ba62a428d9", "hej mikkel": "f90aba79b798c0ef", "tak for din mail": "bc22426e7dd6d19f", "det kan vi sagtens finde ud af": "d1ed70bb59fd9a0e", "det er helt fint at du bytter torsdagsvagt med sofie og du må meget gerne tage tre dages fri i maj": "2ef32aabf32a95a7", "send mig en påmindelse i kalenderen så skriver jeg det ind i næste måneds vagtplan": "8431075c6095b48f", "stort tillykke til din søster": "601757f1818aab57", "henrik": "c032e1f5800b9303", "en samtale": "2255e4cfbbd14ce1", "en chef": "351d7545b71935b0", "en arbejdstid": "0d7e2b0bfef75c30", "en vagt": "d5cd42bcb0e203a4", "en fridag": "e8ffe3f38f08f7cf", "et skema": "67e9785394b0c874", "en vagtplan": "083b86f4c3168c74", "en hjælp": "03d43eccc3e1a088", "at bytte (vagt)": "1fdcaaf30887ce7a", "at spørge": "fafb41270fea3013", "at banke på": "218435e547aeaed9", "at tilbyde": "de3904e097c239ec", "at passe ind (i)": "ace4db34020051bc", "at lade sig gøre": "8963b47b85b40937", "mulig": "10ccab871f327d9c", "eventuelt": "338e10c26d048ea5", "på deltid": "6f98132fda8b35a3", "til gengæld": "7c4ae6fbc71e7762"}, "key": "ncd2-L20"}, {"book": "ncd2", "lesson": 21, "title_da": "Sommerhus ved Vesterhavet", "title_zh": "北海边的度假小屋", "grammar": "丹麦语三维空间方位副词组合（op/oppe, ned/nede, ud/ude, ind/inde, hjem/hjemme, over/ovre + 介词 i, på, til, ved, hos） · 地理与心理方向惯用法（去北方 op til、去水边/南方 ned til、去海边/乡下 ud til / ud på、做客 hjemme hos）", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Sommerhus ved Vesterhavet（叙事短文 · 约 140 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "I efterårsferien kørte Emil og tre venner fra Aarhus helt [[ud til]] kysten ved Vesterhavet.", "a": "0f3651bea284a0fb", "dur": 4.76}, {"id": "a2", "who": "narrator", "da": "De havde lejet et traditionelt sommerhus med stråtag, som lå skjult bag nogle høje klitter.", "a": "866ba535fc14f6cc", "dur": 5.28}], "zh": "秋假期间，埃米尔和三位朋友从奥胡斯一路开车来到北海沿岸。他们租了一栋传统的茅草顶度假小屋，掩映在几座高高的沙丘后面。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Da de ankom om eftermiddagen, blæste det kraftigt **ude ved** havet, så de skyndte sig at bære deres tasker [[ind i]] stuen og tænde [[op i]] brændeovnen.", "a": "54c9142987378b23", "dur": 7.48}, {"id": "a4", "who": "narrator", "da": "Hurtigt blev der dejligt varmt **inde i** huset.", "a": "ba2e853e06856b1c", "dur": 3.04}], "zh": "下午抵达时，海边外面风刮得很大，所以他们赶紧把行李提进客厅，点起柴火炉。屋子里面很快就变得暖烘烘的。"}, {"segs": [{"id": "a5", "who": "narrator", "da": "Hver formiddag tog de varme jakker på og gik [[ned til]] stranden for at se på de vilde bølger.", "a": "1cf2e37d92600688", "dur": 4.96}, {"id": "a6", "who": "narrator", "da": "En dag kørte de også [[op til]] den lille havn i Hvide Sande og købte frisk fisk til aftensmad.", "a": "2621095657629039", "dur": 4.96}, {"id": "a7", "who": "narrator", "da": "Når mørket faldt på, sad de alle sammen **inde i** varmen med varm te og brætspil, mens regnen slog mod ruderne.", "a": "6426ca7e6c671351", "dur": 6.48}, {"id": "a8", "who": "narrator", "da": "Ingen af dem havde lyst til at køre [[hjem til]] storbyen igen om søndagen.", "a": "25cbcc91a11d7b44", "dur": 3.6}], "zh": "每天上午，他们都穿上暖和的外套，走下海滩去看汹涌的海浪。有一天，他们还开车北上去到维德桑德的小港口，买了新鲜的鱼当晚餐。夜幕降临时，大家都坐在温暖的屋子里喝热茶、玩桌游，而雨点正敲打着窗玻璃。到了周日，他们谁都不想开车回大城市去了。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Sommerhusannonce & Rejsedagbog pr. e-mail（对标 DU3 Modul 2 租房阅读与旅游日记邮件）", "scene": null, "paras": [{"cue": "度假屋招租简介｜Feriehus til leje: Klithytten ved Blokhus", "segs": [{"id": "b1", "who": "narrator", "da": "Hyggeligt sommerhus med stråtag i Nordjylland!", "a": "c8ad939404dced59", "dur": 3.2}]}, {"segs": [{"id": "b2", "who": "narrator", "da": "Huset ligger kun 300 meter fra Vesterhavet, så I kan hurtigt gå [[ned til]] vandet eller [[op i]] klitterne og nyde solnedgangen.", "a": "d4d8c5e9f1216bc3", "dur": 6.76}, {"id": "b3", "who": "narrator", "da": "Der er en stor træterrasse **ude på** sydsiden og en varm brændeovn **inde i** stuen.", "a": "3f762255528b1ae4", "dur": 4.96}, {"id": "b4", "who": "narrator", "da": "Hvis I vil købe ind, kan I cykle [[ind til]] byen på ti minutter eller tage [[op til]] Skagen på en dagstur!", "a": "2f7a8699506389fc", "dur": 4.52}]}, {"cue": "旅行日记邮件｜Fra: Emil Til: Sofie Emne: Hilsen fra Vesterhavet", "segs": [{"id": "b5", "who": "narrator", "da": "Hej Sofie", "a": "6cebf438e3c46090", "dur": 1.08}]}, {"segs": [{"id": "b6", "who": "narrator", "da": "Vi er kommet godt [[ud på]] landet og sidder lige nu **inde i** vores sommerhus med en kop varm kakao.", "a": "d6117cb22bab7826", "dur": 4.64}, {"id": "b7", "who": "narrator", "da": "Vejret **ude ved** kysten er vildt, men luften er så frisk!", "a": "8df8f346d10e5f0c", "dur": 3.28}, {"id": "b8", "who": "narrator", "da": "I morges gik vi en lang tur [[ned langs]] stranden.", "a": "2f73a3ebc04279c6", "dur": 2.84}, {"id": "b9", "who": "narrator", "da": "I morgen kører vi [[op til]] Skagen for at se Grenen, og på lørdag spiser vi frokost **hjemme hos** Mikkels familie, som bor **ovre i** Nordjylland.", "a": "d7005d53648dd4c9", "dur": 7.28}, {"id": "b10", "who": "narrator", "da": "Vi kommer [[hjem til]] Aarhus søndag aften.", "a": "c04b22a842ee87c5", "dur": 2.16}]}, {"segs": [{"id": "b11", "who": "narrator", "da": "Kærlig hilsen", "a": "cb4d30c4f5968c22", "dur": 1.28}, {"id": "b12", "who": "narrator", "da": "Emil", "nl": true, "a": "972bafb67ca80289", "dur": 1.08}], "zh_all": "度假屋广告（布洛克胡斯附近的沙丘小屋）：位于北日德兰的温馨茅草顶度假屋！房子距离北海仅 300 米，因此你们可以快速走下水边或爬上沙丘欣赏日落。南侧外面有一个大木露台，客厅里面有一个温暖的柴火炉。如果想购物，骑车十分钟即可进镇，或者来一场北上斯卡恩的一日游！\n旅行日记邮件：嗨，索菲！我们已经顺利来到乡下，此刻正坐在我们度假屋的屋子里喝热可可。海边外面的天气很狂野，但空气无比清新！今天早上我们沿着海滩走了好长一段路。明天我们要开车北上去斯卡恩看海角汇流处（Grenen），周六去住在北日德兰那边的米克尔一家人家里吃午饭。我们周日晚上回奥胡斯。亲切的问候，埃米尔。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "度假小屋（海边/乡间）", "note": "名词 · sommerhuset, sommerhuse, -ene", "segs": [{"id": "g1", "who": "narrator", "da": "et sommerhus", "say": "et sommerhus.", "a": "fb4000683779d8c9", "dur": 1.76}]}, {"zh": "茅草屋顶", "note": "名词 · stråtaget, stråtage, stråtagene", "segs": [{"id": "g2", "who": "narrator", "da": "et stråtag", "say": "et stråtag. stråtaget, stråtage, stråtagene.", "a": "62f79dc63262fccc", "dur": 4.88}]}, {"zh": "大海（Vesterhavet 北海）", "note": "名词 · havet, have, havene", "segs": [{"id": "g3", "who": "narrator", "da": "et hav", "say": "et hav. havet, have, havene.", "a": "1bf786b523de0e8a", "dur": 4.0}]}, {"zh": "海岸，海滨", "note": "名词 · kysten, kyster, kysterne", "segs": [{"id": "g4", "who": "narrator", "da": "en kyst", "say": "en kyst. kysten, kyster, kysterne.", "a": "8f1b7646404b3bc7", "dur": 4.72}]}, {"zh": "海滩，沙滩（d 不发音）", "note": "名词 · stranden, strande, strandene", "segs": [{"id": "g5", "who": "narrator", "da": "en strand", "say": "en strand. stranden, strande, strandene.", "a": "56806b5c1b97b326", "dur": 4.52}]}, {"zh": "沙丘（注意双写 t）", "note": "名词 · klitten, klitter, klitterne", "segs": [{"id": "g6", "who": "narrator", "da": "en klit", "say": "en klit. klitten, klitter, klitterne.", "a": "d4dc84af9b88c032", "dur": 4.2}]}, {"zh": "海浪，波浪", "note": "名词 · bølgen, bølger, bølgerne", "segs": [{"id": "g7", "who": "narrator", "da": "en bølge", "say": "en bølge. bølgen, bølger, bølgerne.", "a": "94642a008967446f", "dur": 4.48}]}, {"zh": "柴火炉", "note": "名词 · brændeovnen, brændeovne, -ene", "segs": [{"id": "g8", "who": "narrator", "da": "en brændeovn", "say": "en brændeovn.", "a": "e61ff8e0a93cca0b", "dur": 1.4}]}, {"zh": "港口，码头", "note": "名词 · havnen, havne, havnene", "segs": [{"id": "g9", "who": "narrator", "da": "en havn", "say": "en havn. havnen, havne, havnene.", "a": "84c987f098a7933f", "dur": 5.88}]}, {"zh": "秋假（第 42 周假期）", "note": "名词 · efterårsferien, -ferier, -erne", "segs": [{"id": "g10", "who": "narrator", "da":
