_}} Charlie ødelagde også hans gamle sko.", "kind": "cloze", "blanks": [["for"]], "explain": "⟦også⟧ 在动词 ⟦ødelagde⟧ 后 → 主句语序"}, {"prompt": "Vi går tidligt i seng, {{_}} vi skal altid op klokken seks.", "kind": "cloze", "blanks": [["for"]], "explain": "⟦altid⟧ 在动词 ⟦skal⟧ 后 → 主句语序"}, {"prompt": "Maja bliver hjemme i aften, {{_}} hun ofte er træt om fredagen.", "kind": "cloze", "blanks": [["fordi"]], "explain": "⟦ofte⟧ 在动词 ⟦er⟧ 前 → 从句语序"}, {"prompt": "{{_}} hunden ikke kan være alene hele dagen, kommer jeg hjem til frokost.", "kind": "cloze", "blanks": [["Fordi"]], "explain": "放句首且 ⟦ikke⟧ 在动词 ⟦kan⟧ 前；⟦for⟧ 绝不能放句首！"}, {"prompt": "Jeg kan godt lide at bo her, {{_}} naboerne er altid så venlige.", "kind": "cloze", "blanks": [["for"]], "explain": "⟦altid⟧ 在动词 ⟦er⟧ 后 → 主句语序"}, {"prompt": "Hvorfor drikker du ikke kaffe? – {{_}} jeg ikke kan sove om natten, hvis jeg drikker kaffe.", "kind": "cloze", "blanks": [["Fordi"]], "explain": "回答 ⟦Hvorfor?⟧ 且 ⟦ikke⟧ 在动词 ⟦kan⟧ 前"}]}, {"id": "B", "type": "drill", "title": "练习 B：句型转换——将带 for 的并列句改写为 fordi 从句（注意把副词移到变位动词前面！）", "items": [{"prompt": "⟦Jeg vil have en hund, for jeg vil gerne gå lange ture.⟧ →", "kind": "write", "accept": ["Jeg vil have en hund, fordi jeg gerne vil gå lange ture."]}, {"prompt": "⟦Vi flytter snart, for lejligheden er ikke stor nok.⟧ →", "kind": "write", "accept": ["Vi flytter snart, fordi lejligheden ikke er stor nok."]}, {"prompt": "⟦De elsker hvalpen, for han er altid så sød og sjov.⟧ →", "kind": "write", "accept": ["De elsker hvalpen, fordi han altid er så sød og sjov."]}, {"prompt": "⟦Hun arbejder hjemme, for hun skal ofte passe hunden.⟧ →", "kind": "write", "accept": ["Hun arbejder hjemme, fordi hun ofte skal passe hunden."]}, {"prompt": "⟦Jeg tager ikke toget, for det kommer desværre altid for sent.⟧ →", "kind": "write", "accept": ["Jeg tager ikke toget, fordi det desværre altid kommer for sent."]}, {"prompt": "⟦Vi køber en stor sofa, for Charlie sidder også i stuen.⟧ →", "kind": "write", "accept": ["Vi køber en stor sofa, fordi Charlie også sidder i stuen."]}], "example": "Han vågner tidligt, for han vil ikke vente. → Han vågner tidligt, fordi han ikke vil vente."}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战（精准控制 fordi 从句语序与 for 主句语序）", "items": [{"prompt": "我们养了一只小狗，因为我们很想每天去树林里散步。（用 ⟦fordi... gerne⟧）", "kind": "write", "accept": ["Vi har fået en lille hund, fordi vi gerne vil gå en tur i skoven hver dag."]}, {"prompt": "查理每天早上五点就醒，因为他不想等早饭。（用 ⟦fordi... ikke⟧）", "kind": "write", "accept": ["Charlie vågner klokken fem hver morgen, fordi han ikke vil vente på morgenmad."]}, {"prompt": "你为什么不坐公交车？—— 因为公交车经常晚点！（用 ⟦Fordi... ofte⟧ 简答）", "kind": "write", "accept": ["Hvorfor tager du ikke bussen? – Fordi bussen ofte kommer for sent!"]}, {"prompt": "养小狗很辛苦，但我们从不后悔，因为小狗总是让我们很开心。（用 ⟦for... altid⟧）", "kind": "write", "accept": ["Det er hårdt arbejde at have en hvalp, men vi fortryder det aldrig, for han gør os altid meget glade."]}, {"prompt": "工作没问题，因为我常常在家办公。（用 ⟦for... ofte⟧）", "kind": "write", "accept": ["Det går fint med arbejdet, for jeg arbejder ofte hjemme."]}]}], "clips": {"lukas og maja har lige fået en lille hvalp som hedder charlie": "a11256ce296c7fb2", "han er kun tre måneder gammel men han fylder allerede hele lejligheden med energi": "c3d75f7515e4c78d", "de ønskede sig længe en hund fordi de gerne ville gå flere ture i skoven": "81f512aa3a80b5d9", "i begyndelsen var alt roligt for charlie sov altid næsten hele formiddagen": "0975c45810e8ddbb", "men nu vågner han klokken fem hver morgen fordi han ikke vil vente længere på sin morgenmad": "f35fa8bb93764d82", "i går måtte lukas købe nye løbesko for charlie ødelagde også hans gamle sko ude i gangen": "40677720dc931d3e", "når gæster spørger hvorfor står alle skoene oppe på bordet svarer maja med et smil fordi charlie altid bider i dem": "c992c118508b8f9b", "det er hårdt arbejde at have en hvalp fordi man ofte skal tørre gulvet og rydde op": "41f342aa1dc2a35f", "alligevel fortryder de det aldrig for den lille h t-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：En uforglemmelig koncert（叙事短文 · 约 150 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Emma og Jonas [[har været]] til mange koncerter i deres liv, og de [[har hørt]] både klassisk musik og rock.", "a": "d963063898c896c7", "dur": 5.96}, {"id": "a2", "who": "narrator", "da": "Alligevel [[har]] de aldrig [[oplevet]] en aften som i fredags.", "a": "d9ed27e44c458df5", "dur": 3.04}], "zh": "艾玛和约纳斯这辈子去过很多场音乐会，古典乐和摇滚乐他们都听过。不过，他们从未经历过像上周五那样的夜晚。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "For en måned siden **købte** de billetter til en udendørs sommerkoncert på Plænen i Tivoli.", "a": "0235e5326605b3fb", "dur": 4.72}, {"id": "a4", "who": "narrator", "da": "Da de **ankom** klokken syv, **stod** der allerede tusindvis af glade mennesker foran scenen.", "a": "ee91fdab3e1d1ba3", "dur": 4.8}, {"id": "a5", "who": "narrator", "da": "De **mødte** nogle venner fra sprogskolen, og stemningen **var** helt fantastisk.", "a": "9eab4b0957f5763b", "dur": 4.16}], "zh": "一个月前，他们买了哥本哈根趣伏里公园（Tivoli）草坪露天夏日音乐会的门票。七点钟他们到达时，舞台前已经站了成千上万名兴高采烈的观众。他们还遇到了几个语言学校的朋友，现场气氛简直棒极了。"}, {"segs": [{"id": "a6", "who": "narrator", "da": "Klokken otte **gik** et berømt dansk popband på scenen.", "a": "ac2768f2aa1344fe", "dur": 3.2}, {"id": "a7", "who": "narrator", "da": "De **spillede** deres største hits, og hele publikum **sang** højt med.", "a": "e3633132b43e92fe", "dur": 3.68}, {"id": "a8", "who": "narrator", "da": "Men midt under koncerten **begyndte** det pludselig at regne kraftigt!", "a": "2cf9b3e7ee85b63e", "dur": 3.32}, {"id": "a9", "who": "narrator", "da": "Folk **tog** hurtigt regnjakker på, men ingen **gik** hjem.", "a": "8a5933a4fffc1c20", "dur": 3.2}, {"id": "a10", "who": "narrator", "da": "Til sidst **klappede** alle så længe, at bandet **spillede** to ekstra numre i regnen.", "a": "ae7911153741b9b9", "dur": 4.88}], "zh": "八点钟，一支著名的丹麦流行乐队登上了舞台。他们演奏了自己最红的热门歌曲，全场观众跟着大声合唱。可就在演出进行到一半时，天突然下起了大雨！大家迅速穿上雨衣，却没有一个人回家。最后，全场鼓掌欢呼了太久，以至于乐队在雨中又加演了两首返场曲。"}, {"segs": [{"id": "a11", "who": "narrator", "da": "Emma og Jonas [[har]] stadig billederne på telefonen, og de [[har allerede talt]] om koncerten hele ugen.", "a": "de5d5aa192a733f6", "dur": 5.0}, {"id": "a12", "who": "narrator", "da": "Det [[har]] helt sikkert [[været]] sommerens bedste oplevelse!", "a": "102cf5557d95e442", "dur": 3.32}], "zh": "艾玛和约纳斯的手机里现在还存着当时的照片，他们这一整周也一直在聊那场音乐会。这绝对是整个夏天最棒的一次体验！"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：En e-mail fra Celine — og svaret om koncerten（对标 DU3 Modul 2 Skrivning 3_2_skrive_B）", "scene": null, "paras": [{"cue": "来信｜Fra: Celine", "segs": [{"id": "b1", "who": "narrator", "da": "Hej", "a": "51d9c5359c868463", "dur": 0.88}, {"id": "b2", "who": "narrator", "da": "Jeg har hørt, at du har været til koncert.", "nl": true, "a": "e23e755f1cbfff0d", "dur": 2.44}, {"id": "b3", "who": "narrator", "da": "Hvor spændende!", "a": "43ab9fa2763c662d", "dur": 1.48}, {"id": "b4", "who": "narrator", "da": "Hvad var det for en koncert?", "a": "3cd86e192124861e", "dur": 1.24}, {"id": "b5", "who": "narrator", "da": "Hvor var det henne?", "a": "45c566f91a2879ad", "dur": 0.84}, {"id": "b6", "who": "narrator", "da": "Var du sammen med nogen?", "a": "932e4be3d79c6ea3", "dur": 1.32}, {"id": "b7", "who": "narrator", "da": "Og hvad syntes du om koncerten?", "a": "bf50fd6f628baf47", "dur": 1.92}, {"id": "b8", "who": "narrator", "da": "Og hvad lavede I bagefter?", "a": "31d49c0201175cbb", "dur": 1.56}, {"id": "b9", "who": "narrator", "da": "Mange hilsner", "nl": true, "a": "54bef3a12cf1eb63", "dur": 1.2}, {"id": "b10", "who": "narrator", "da": "Celine", "nl": true, "a": "3e6665db5899f9d7", "dur": 1.08}]}, {"cue": "高分回信范本（101 词）｜Til: Celine Emne: Koncert", "segs": [{"id": "b11", "who": "narrator", "da": "Hej Celine", "a": "e9ff1fbb72c46153", "dur": 1.36}]}, {"segs": [{"id": "b12", "who": "narrator", "da": "Tak for din mail!", "a": "33819081ac2009ff", "dur": 1.28}, {"id": "b13", "who": "narrator", "da": "Ja, jeg [[har været]] til en fantastisk rockkoncert, og det **var** en kæmpe oplevelse.", "a": "093a90bcce528eae", "dur": 4.76}, {"id": "b14", "who": "narrator", "da": "Det **var** et ungt dansk band, som **spillede** på et lille spillested i Aarhus i lørdags.", "a": "9ab6631df909661e", "dur": 4.12}]}, {"segs": [{"id": "b15", "who": "narrator", "da": "Jeg **var** afsted sammen med min bror og to venner fra mit arbejde.", "a": "f182afa13479b04a", "dur": 3.88}, {"id": "b16", "who": "narrator", "da": "Vi **stod** helt tæt på scenen, og lyden **var** virkelig god.", "a": "6e5964b31e072d58", "dur": 3.56}, {"id": "b17", "who": "narrator", "da": "Jeg **syntes**, at stemningen **var** helt i top, fordi hele publikum **sang** med på alle sangene.", "a": "7d3e4822f642c789", "dur": 4.24}, {"id": "b18", "who": "narrator", "da": "Bagefter **gik** vi på en hyggelig café i nærheden og **snakkede** om koncerten indtil midnat.", "a": "cd759209d2da8b6f", "dur": 4.88}]}, {"segs": [{"id": "b19", "who": "narrator", "da": "Har du været til koncert for nylig?", "a": "3cb78530e7ed42d5", "dur": 1.68}]}, {"segs": [{"id": "b20", "who": "narrator", "da": "Kærlig hilsen", "a": "cb4d30c4f5968c22", "dur": 1.28}, {"id": "b21", "who": "narrator", "da": "Jonas", "nl": true, "a": "3c874b55dc7586c4", "dur": 1.16}], "zh_all": "塞琳来信：嗨！我听说你去听音乐会了。真令人兴奋！那是一场什么音乐会？在哪里举办的？你和别人一起去的吗？你觉得这场音乐会怎么样？还有，结束后你们干什么了？祝好，塞琳。\n约纳斯回信：嗨，塞琳！谢谢你的邮件！是的，我去了一场非常棒的摇滚音乐会，那真是一次超赞的体验。上周六，一支年轻的丹麦乐队在奥胡斯一家小演出场地演奏。我是和我哥哥以及两位同事一起去的。我们站得离舞台非常近，音效特别好。我觉得现场气氛绝佳，因为全场观众几乎每首歌都在跟着合唱。演出结束后，我们去附近一家惬意的咖啡馆一直聊到半夜。你最近有去听音乐会吗？亲切的问候，约纳斯。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "听见；听说（Jeg har hørt, at...）", "note": "动词 · hører, hørte, har hørt", "segs": [{"id": "g1", "who": "narrator", "da": "at høre", "say": "at høre. hører, hørte, har hørt.", "a": "49579ea41e5e0c18", "dur": 4.2}]}, {"zh": "演奏 , "title": "练习 A：完成时 vs 一般过去时语篇切换填空（用括号动词的正确时态填空）", "items": [{"prompt": "Jeg {{_}} (⟦være⟧) til mange koncerter i år, men koncerten i fredags {{_}} (⟦være⟧) bedst.", "kind": "cloze", "blanks": [["har været"], ["var"]], "explain": "⟦i år⟧ 未结束至今）（⟦i fredags⟧ 已结束"}, {"prompt": "For to uger siden {{_}} (⟦købe⟧) Emma og Jonas to billetter til Tivoli.", "kind": "cloze", "blanks": [["købte"]], "explain": "⟦For to uger siden⟧ 必配过去时"}, {"prompt": "Vi {{_}} (⟦møde⟧) vores gamle venner foran scenen klokken syv.", "kind": "cloze", "blanks": [["mødte"]], "explain": "⟦klokken syv⟧ 当晚具体过去时刻"}, {"prompt": "Indtil nu {{_}} jeg aldrig {{_}} (⟦høre⟧) så god livemusik!", "kind": "cloze", "blanks": [["har"], ["hørt"]], "explain": "⟦Indtil nu⟧ 至今为止经历 + 句首时间状语触发 V2 倒装：⟦Indtil nu har jeg aldrig hørt...⟧"}, {"prompt": "Midt under koncerten {{_}} (⟦begynde⟧) det pludselig at regne kraftigt.", "kind": "cloze", "blanks": [["begyndte"]], "explain": "叙事中途发生的具体过去事件"}, {"prompt": "Bagefter {{_}} (⟦gå⟧) vi hen til en lille restaurant og {{_}} (⟦drikke⟧) varm chokolade.", "kind": "cloze", "blanks": [["gik"], ["drak"]], "explain": "⟦Bagefter⟧ 接过去叙事动作，触发 V2 倒装"}, {"prompt": "De {{_}} allerede {{_}} (⟦tale⟧) om koncerten mange gange i denne uge.", "kind": "cloze", "blanks": [["har"], ["talt"]], "explain": "⟦allerede... i denne uge⟧ 本周仍在持续"}]}, {"id": "B", "type": "drill", "title": "练习 B：感官与评价动词专练（选填 synes / syntes, tror / troede, lyder, hørte, stod, sang）", "items": [{"prompt": "Hvad {{_}} du om koncerten i lørdags? Var musikken god?", "kind": "cloze", "blanks": [["syntes"]], "explain": "询问对上周六看过的演出的主观评价"}, {"prompt": "Jeg {{_}}, at bandet kommer til Danmark igen næste sommer, men jeg er ikke sikker.", "kind": "cloze", "blanks": [["tror"]], "explain": "对未来不确定事实的猜测"}, {"prompt": "Har du været til jazzfestival? Det {{_}} virkelig hyggeligt!", "kind": "cloze", "blanks": [["lyder"]], "explain": "听起来很惬意"}, {"prompt": "Vi {{_}} helt foran scenen og {{_}} med på alle de kendte sange.", "kind": "cloze", "blanks": [["stod"], ["sang"]], "explain": "站在台前并跟着合唱"}, {"prompt": "Jeg {{_}}, at prisen på billetterne var lidt høj, men oplevelsen var fantastisk.", "kind": "cloze", "blanks": [["syntes"]], "explain": "亲身体验后对票价的主观感觉"}, {"prompt": "Da vi gik ind i salen, {{_}} vi sangeren øve sig på scenen.", "kind": "cloze", "blanks": [["hørte"]], "explain": "⟦høre + 宾语 + 不带 at 的原形 øve sig⟧"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "我去过很多场音乐会，但上周五的演出最棒。", "kind": "write", "accept": ["Jeg har været til mange koncerter, men koncerten i fredags var den bedste."]}, {"prompt": "我哥哥一个月前买了两张门票，我们站得离舞台很近。", "kind": "write", "accept": ["Min bror købte to billetter for en måned siden, og vi stod helt tæt på scenen."]}, {"prompt": "乐队演奏了他们最棒的歌，全场观众一起大声合唱。", "kind": "write", "accept": ["Bandet spillede deres bedste sange, og hele publikum sang højt med."]}, {"prompt": "我觉得现场气氛极佳，虽然中途开始下雨了。", "kind": "write", "accept": ["Jeg syntes, at stemningen var helt fantastisk, selvom det begyndte at regne midt under koncerten."]}, {"prompt": "演出结束后，我们去附近一家咖啡馆聊到半夜。", "kind": "write", "accept": ["Bagefter gik vi på en café i nærheden og snakkede indtil midnat."]}]}], "clips": {"emma og jonas har været til mange koncerter i deres liv og de har hørt både klassisk musik og rock": "d963063898c896c7", "alligevel har de aldrig oplevet en aften som i fredags": "d9ed27e44c458df5", "for en måned siden købte de billetter til en udendørs sommerkoncert på plænen i tivoli": "0235e5326605b3fb", "da de ankom klokken syv stod der allerede tusindvis af glade mennesker foran scenen": "ee91fdab3e1d1ba3", "de mødte nogle venner fra sprogskolen og stemningen var helt fantastisk": "9eab4b0957f5763b", "klokken otte gik et berømt dansk popband på scenen": "ac2768f2aa1344fe", "de spillede deres største hits og hele publikum sang højt med": "e3633132b43e92fe", "men midt under koncerten begyndte det pludselig at regne kraftigt": "2cf9b3e7ee85b63e", "folk tog hurtigt regnjakker på men ingen gik hjem": "8a5933a4fffc1c20", "til sidst klappede alle så længe at bandet spillede to ekstra numre i regnen": "ae7911153741b9b9", "emma og jonas har stadig billederne på telefonen og de har allerede talt om koncerten hele ugen": "de5d5aa192a733f6", "det har helt sikkert været sommerens bedste oplevelse": "102cf5557d95e442", "hej": "51d9c5359c868463", "jeg har hørt at du har været til koncert": "e23e755f1cbfff0d", "hvor spændende": "43ab9fa2763c662d", "hvad var det for en koncert": "3cd86e192124861e", "hvor var det henne": "45c566f91a2879ad", "var du sammen med nogen": "932e4be3d79c6ea3", "og hvad syntes du om koncerten": "bf50fd6f628baf47", "og hvad lavede i bagefter": "31d49c0201175cbb", "mange hilsner": "54bef3a12cf1eb63", "celine": "3e6665db5899f9d7", "hej celine": "e9ff1fbb72c46153", "tak for din mail": "33819081ac2009ff", "ja jeg har været til en fantastisk rockkoncert og det var en kæmpe oplevelse": "093a90bcce528eae", "det var et ungt dansk band som spillede på et lille spillested i aarhus i lørdags": "9ab6631df909661e", "jeg var afsted sammen med min bror og to venner fra mit arbejde": "f182afa13479b04a", "vi stod helt tæt på scenen og lyden var virkelig god": "6e5964b31e072d58", "jeg syntes at stemningen var helt i top fordi hele publikum sang med på alle sangene": "7d3e4822f642c789", "bagefter gik vi på en hyggelig café i nærheden og snakkede om koncerten indtil midnat": "cd759209d2da8b6f", "har du været til koncert for nylig": "3cb78530e7ed42d5", "kærlig hilsen": "cb4d30c4f5968c22", "jonas": "3c874b55dc7586c4", "at høre": "49579ea41e5e0c18", "at spille": "18fb7bb97681dbc9", "at synge": "99ac84c657537e1e", "at stå": "a7678af7c935cb0b", "at møde": "4cbe24d458c61b68", "at regne": "d0c0089c8336e35e", "at klappe": "45814a1a6bf3bce2", "at synes": "e305a50e34468943", "at blive (våd)": "970361664163e421", "en koncert": "30b79fb8e53a6682", "en billet": "fb3b027e4b2848bb", "en scene": "3f9ce7651083e34c", "et spillested": "f4aa7eb541a720f3", "et publikum": "5e6e10cb6dddef34", "en stemning": "26551597772c60dd", "et ekstranummer": "3ccfe92cf427c840", "uforglemmelig": "20ed416e20973c0c", "udendørs": "b12812240b67adbe"}, "key": "ncd2-L03"}, {"book": "ncd2", "lesson": 4, "title_da": "Besøg fra udlandet", "title_zh": "来自国外的访客", "grammar": "时间从句 da（过去一次性事件：“当……那次”）vs når（现在习惯“每当” / 将来确定“当……时”）· “从句在前，主句必 V2 倒装”铁律", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Besøg fra udlandet（叙事短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Sidste uge havde Emma en helt særlig uge, fordi hendes forældre kom på besøg fra udlandet for allerførste gang i deres liv.", "a": "c5625a43ac16af84", "dur": 7.84}], "zh": "上周对艾玛来说是特别的一周，因为她的父母平生第一次从国外来丹麦看望她。"}, {"segs": [{"id": "a2", "who": "narrator", "da": "[[Da]] de ankom til Københavns Lufthavn torsdag morgen, **hentede** Emma dem med toget. [[Da]] de endelig så hinanden i ankomsthallen, **blev** alle tre utrolig glade og krammede hinanden længe.", "a": "9b1e9808b4c7889d", "dur": 9.72}, {"id": "a3", "who": "narrator", "da": "Om eftermiddagen gik de langs kanalen i Nyhavn, og senere viste Emma dem Rundetårn. [[Da]] de tog ud til kunstmuseet Louisiana om lørdagen, **regnede** det lidt, men hendes mor elskede den smukke udsigt over havet.", "a": "01591bca90b94a15", "dur": 11.36}], "zh": "周四早上他们抵达哥本哈根机场时，艾玛坐火车去接了他们。当他们终于在到达大厅见到彼此的那一刻，三个人都高兴极了，紧紧拥抱了很久。下午他们沿着新港的运河散步，之后艾玛又带他们去看了圆塔。周六他们去路易斯安那现代艺术博物馆时，天稍微下了一点雨，但妈妈非常喜欢那片美丽的海景。"}, {"segs": [{"id": "a4", "who": "narrator", "da": "Om aftenen lavede de god mad sammen i Emmas lille køkken og så gamle familiebilleder. [[Når]] Emma arbejder travlt til hverdag, **savner** hun ofte sin familie.", "a": "34e7571dc6829b82", "dur": 8.52}, {"id": "a5", "who": "narrator", "da": "Derfor nød hun hvert eneste minut med dem. [[Når]] hendes forældre kommer tilbage næste sommer, **skal** de leje et hyggeligt sommerhus ved kysten, så de får endnu mere tid sammen.", "a": "cff59286313c6ad4", "dur": 8.8}], "zh": "晚上他们在艾玛的小厨房里一起做了美味的晚餐，还翻看了老家庭照片。每当艾玛平时工作很忙的时候，她总是很想念家人。因此她非常珍惜和他们在一起的每一分钟。明年夏天她父母再来的时候，他们打算在海边租一栋惬意的度假屋，这样就能有更多相聚的时间。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：En e-mail fra Ricki — og svaret om besøget（对标 DU3 Modul 2 Skrivning 3_2_skrive_C）", "scene": null, "paras": [{"cue": "来信｜Fra: Ricki", "segs": [{"id": "b1", "who": "narrator", "da": "Hej", "a": "51d9c5359c868463", "dur": 0.88}, {"id": "b2", "who": "narrator", "da": "Jeg har hørt, at du har haft besøg fra udlandet.", "nl": true, "a": "76a55e114cf45929", "dur": 2.32}, {"id": "b3", "who": "narrator", "da": "Det lyder dejligt.", "a": "e60dea70fb7ff260", "dur": 2.12}, {"id": "b4", "who": "narrator", "da": "Hvem kom på besøg?", "a": "72d3cd232b8df660", "dur": 1.52}, {"id": "b5", "who": "narrator", "da": "Hvor længe havde du besøg?", "a": "e276d7f613d15e55", "dur": 1.52}, {"id": "b6", "who": "narrator", "da": "Hvad lavede I?", "a": "042b996ff4710fa7", "dur": 1.08}, {"id": "b7", "who": "narrator", "da": "Havde I en god tid sammen?", "a": "9aa1b64e0ceca7a3", "dur": 1.56}, {"id": "b8", "who": "narrator", "da": "Og hvad for noget dansk mad prøvede de?", "a": "c33a9f2b27354e9a", "dur": 2.2}, {"id": "b9", "who": "narrator", "da": "Mange hilsner", "nl": true, "a": "54bef3a12cf1eb63", "dur": 1.2}, {"id": "b10", "who": "narrator", "da": "Ricki", "nl": true, "a": "1c40ecbaa4206144", "dur": 0.92}]}, {"cue": "高分回信范本（98 词）｜Til: Ricki Emne: Besøg", "segs": [{"id": "b11", "who": "narrator", "da": "Hej Ricki", "a": "367d9c7d575de82a", "dur": 1.0}]}, {"segs": [{"id": "b12", "who": "narrator", "da": "Tak for din mail!", "a": "33819081ac2009ff", "dur": 1.28}, {"id": "b13", "who": "narrator", "da": "Ja, det var så hyggeligt.", "a": "7e6e1e6bfab64474", "dur": 1.72}, {"id": "b14", "who": "narrator", "da": "Mine forældre kom på besøg i sidste uge, og de blev her i seks dage.", "a": "1ccfe26762f16f08", "dur": 3.72}]}, {"segs": [{"id": "b15", "who": "narrator", "da": "[[Da]] jeg hentede dem i lufthavnen, **var** de lidt trætte, men allerede næste dag gik vi rundt i hele byen.", "a": "b67a3066e1ed10d7", "dur": 5.28}, {"id": "b16", "who": "narrator", "da": "Vi besøgte Nyhavn og flere museer, og om aftenen lavede vi mad sammen.", "a": "cb3681f50bfc3510", "dur": 4.72}, {"id": "b17", "who": "narrator", "da": "De smagte både dansk smørrebrød og friske kanelsnegle, og de syntes, det smagte fantastisk!", "a": "e4f5853e39f798ee", "dur": 5.28}, {"id": "b18", "who": "narrator", "da": "Vi havde en virkelig god tid sammen. [[Når]] de kommer igen næste år, **skal** vi besøge Aarhus.", "a": "2fd0899438f52759", "dur": 5.12}]}, {"segs": [{"id": "b19", "who": "narrator", "da": "Hvordan går det med dig?", "a": "ebde88eb5043de26", "dur": 1.24}]}, {"segs": [{"id": "b20", "who": "narrator", "da": "Mange hilsner", "a": "54bef3a12cf1eb63", "dur": 1.2}, {"id": "b21", "who": "narrator", "da": "Emma", "nl": true, "a": "a18bb2401c908929", "dur": 1.24}], "zh_all": "里基来信：嗨！我听说你接待了来自国外的访客。听起来真棒。谁来看你了？他们住了多久？你们做了些什么？你们一起过得开心吗？还有，他们尝了什么丹麦食物呢？祝好，里基。\n艾玛回信：嗨，里基！谢谢你的邮件！是的，那几天真是太惬意了。上周我父母来拜访我，他们在这里住了六天。我去机场接他们时，他们还有点累，但第二天一早我们就逛遍了整座城市。我们去了新港和几家博物馆，晚上还一起做饭。他们尝了丹麦开放式三明治和新鲜的肉桂卷，觉得味道棒极了！我们度过了一段非常美好的时光。等他们明年再来时，我们要去奥胡斯游玩。你近况如何？祝好，艾玛。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "当……时（过去一次性事件）", "note": "连词 · 时间从属连词", "segs": [{"id": "g1", "who": "narrator", "da": "da", "say": "da.", "a": "7e28bee1c8c62f72", "dur": 0.76}]}, {"zh": "当……时 / 每当（经常性或将来事件）", "note": "连词 · 时间从属连词", "segs": [{"id": "g2", "who": "narrator", "da": "når", "say": "når.", "a": "482bc710ba095972", "dur": 0.56}]}, {"zh": "到达，抵达（ankomme til 抵达某地）", "note": "动词 · ankommer, ankom, er ankommet", "segs": [{"id": "g3", "who": "narrator", "da": "at ankomme", "say": "at ankomme. ankommer, ankom, er ankommet.", "a": "89050dffa893c7ba", "dur": 4.32}]}, {"zh": "停留，留下（blive i seks dage）", "note": "动词 · bliver, blev, er blevet", "se thavn.", "a": "b9630a1329b0048d", "dur": 1.28}]}, {"zh": "客人，来宾", "note": "名词 · gæsten, gæster, gæsterne", "segs": [{"id": "g14", "who": "narrator", "da": "en gæst", "say": "en gæst. gæsten, gæster, gæsterne.", "a": "9df633f1be35ec4f", "dur": 4.92}]}, {"zh": "风景，视野（udsigt over havet）", "note": "名词 · udsigten, udsigter, udsigterne", "segs": [{"id": "g15", "who": "narrator", "da": "en udsigt", "say": "en udsigt. udsigten, udsigter, udsigterne.", "a": "2779b93f4846d9f5", "dur": 4.88}]}, {"zh": "丹麦开放式三明治", "note": "名词 · et smørrebrød, ingen flertal)", "segs": [{"id": "g16", "who": "narrator", "da": "et smørrebrød", "say": "et smørrebrød. et smørrebrød, ingen flertal).", "a": "41db8a59d627924c", "dur": 4.28}]}, {"zh": "肉桂卷", "note": "名词 · (-en, -e, -ene", "segs": [{"id": "g17", "who": "narrator", "da": "en kanelsnegl", "say": "en kanelsnegl.", "a": "b2fe4b8e392f8ff6", "dur": 1.2}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "连词", "da": "da", "zh": "当……时（过去一次性事件）", "forms": "时间从属连词"}, {"pos": "连词", "da": "når", "zh": "当……时 / 每当（经常性或将来事件）", "forms": "时间从属连词"}, {"pos": "动词 [er]", "da": "at ankomme", "zh": "到达，抵达（ankomme til 抵达某地）", "forms": "ankommer, ankom, er ankommet"}, {"pos": "动词 [er]", "da": "at blive", "zh": "停留，留下（blive i seks dage）", "forms": "bliver, blev, er blevet"}, {"pos": "动词", "da": "at hente", "zh": "去接（人）；取回", "forms": "henter, hentede, har hentet"}, {"pos": "动词", "da": "at kramme", "zh": "拥抱", "forms": "krammer, krammede, har krammet"}, {"pos": "动词", "da": "at vise (frem)", "zh": "展示，带某人参观（vise byen frem）", "forms": "viser, viste, har vist"}, {"pos": "动词", "da": "at nyde", "zh": "享受，细品（过去式 nød！）", "forms": "nyder, nød, har nydt"}, {"pos": "动词", "da": "at savne", "zh": "想念，思念；缺少", "forms": "savner, savnede, har savnet"}, {"pos": "动词", "da": "at smage", "zh": "品尝；尝起来……", "forms": "smager, smagte, har smagt"}, {"pos": "名词", "da": "et besøg", "zh": "拜访，探访（单复同形）", "forms": "besøget, besøg, besøgene"}, {"pos": "名词", "da": "udlandet", "zh": "国外（fra udlandet / i udlandet）", "forms": "bestemt ental, ingen flertal"}, {"pos": "名词", "da": "en lufthavn", "zh": "飞机场", "forms": "lufthavnen, lufthavne, -ne"}, {"pos": "名词", "da": "en gæst", "zh": "客人，来宾", "forms": "gæsten, gæster, gæsterne"}, {"pos": "名词", "da": "en udsigt", "zh": "风景，视野（udsigt over havet）", "forms": "udsigten, udsigter, udsigterne"}, {"pos": "名词", "da": "et smørrebrød / en kanelsnegl", "zh": "丹麦开放式三明治 / 肉桂卷", "forms": "et smørrebrød, ingen flertal) / (-en, -e, -ene"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "上周四我父母到达机场时，我坐火车去接了他们。（用 Da 放句首）", "answer": "Da mine forældre ankom til lufthavnen i torsdags, hentede jeg dem med toget."}, {"zh": "他们在哥本哈根待了一个星期，我带他们参观了整座城市。", "answer": "De blev i København i en uge, og jeg viste dem hele byen frem."}, {"zh": "当我们在餐厅吃丹麦开放式三明治时，他们觉得味道非常棒。", "answer": "Da vi spiste dansk smørrebrød på en restaurant, syntes de, at det smagte fantastisk."}, {"zh": "每当我工作很忙的时候，我都很想念我的朋友们。（用 Når 放句首）", "answer": "Når jeg arbejder meget travlt, savner jeg mine venner."}, {"zh": "等他们明年夏天再来丹麦时，我们要一起去奥胡斯。（用 Når 放句首）", "answer": "Når de kommer til Danmark igen næste sommer, skal vi besøge Aarhus sammen."}]}, {"id": "A", "type": "drill", "title": "练习 A：用 da 或 når 填空（注意判断时态与动作是一次性还是习惯/将来）", "items": [{"prompt": "{{_}} mine forældre ankom til lufthavnen i går, stod jeg klar med blomster.", "kind": "cloze", "blanks": [["Da"]], "explain": "⟦i går⟧ 过去一次性抵达"}, {"prompt": "{{_}} jeg har ferie næste måned, rejser jeg til Spanien.", "kind": "cloze", "blanks": [["Når"]], "explain": "⟦næste måned⟧ 将来时间"}, {"prompt": "{{_}} solen skinner i Danmark, sidder alle folk ude i parkerne.", "kind": "cloze", "blanks": [["Når"]], "explain": "现在经常性事实"}, {"prompt": "Vi spiste lækkert smørrebrød, {{_}} min ven besøgte mig sidste år.", "kind": "cloze", "blanks": [["da"]], "explain": "⟦sidste år⟧ 过去那次来访"}, {"prompt": "{{_}} du kommer til Aarhus næste gang, skal vi drikke kaffe sammen.", "kind": "cloze", "blanks": [["Når"]], "explain": "⟦næste gang⟧ 将来"}, {"prompt": "{{_}} jeg var barn, drak jeg aldrig kaffe.（表示“当我小时候”那段已结束的时光）", "kind": "cloze", "blanks": [["Da"]], "explain": "描述人生中过去那一段特定时期“当我还是孩子时”通常用 ⟦Da⟧"}, {"prompt": "Hver gang vi spiser aftensmad, eller {{_}} gæsterne kommer, tænder vi stearinlys.", "kind": "cloze", "blanks": [["når"]], "explain": "现在经常性习惯"}]}, {"id": "B", "type": "drill", "title": "练习 B：句型重组——把时间从句提到句首（务必执行“主句 V2 倒装”，并注意从句内副词位置！）", "items": [{"prompt": "⟦Alle blev meget glade, da de så hinanden i lufthavnen.⟧ →", "kind": "write", "accept": ["Da de så hinanden i lufthavnen, blev alle meget glade."]}, {"prompt": "⟦Jeg savner ofte min familie, når jeg har meget travlt på arbejde.⟧ →", "kind": "write", "accept": ["Når jeg har meget travlt på arbejde, savner jeg ofte min familie."]}, {"prompt": "⟦Vi skal leje et sommerhus, når de kommer tilbage næste sommer.⟧ →", "kind": "write", "accept": ["Når de kommer tilbage næste sommer, skal vi leje et sommerhus."]}, {"prompt": "⟦Vi tog ind på et museum, da det begyndte at regne.⟧ →", "kind": "write", "accept": ["Da det begyndte at regne, tog vi ind på et museum."]}, {"prompt": "⟦Jeg lavede en stor gryde suppe, da mine venner ikke havde spist endnu.⟧ →", "kind": "write", "accept": ["Da mine venner ikke havde spist endnu, lavede jeg en stor gryde suppe."]}, {"prompt": "⟦Vi sidder altid ude på altanen, når vejret er varmt og dejligt.⟧ →", "kind": "write", "accept": ["Når vejret er varmt og dejligt, sidder vi altid ude på altanen."]}], "example": "Jeg hentede dem, da de kom. → Da de kom, hentede jeg dem."}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "上周四我父母到达机场时，我坐火车去接了他们。（用 ⟦Da⟧ 放句首）", "kind": "write", "accept": ["Da mine forældre ankom til lufthavnen i torsdags, hentede jeg dem med toget."]}, {"prompt": "他们在哥本哈根待了一个星期，我带他们参观了整座城市。", "kind": "write", "accept": ["De blev i København i en uge, og jeg viste dem hele byen frem."]}, {"prompt": " blev her i seks dage": "1ccfe26762f16f08", "da jeg hentede dem i lufthavnen var de lidt trætte men allerede næste dag gik vi rundt i hele byen": "b67a3066e1ed10d7", "vi besøgte nyhavn og flere museer og om aftenen lavede vi mad sammen": "cb3681f50bfc3510", "de smagte både dansk smørrebrød og friske kanelsnegle og de syntes det smagte fantastisk": "e4f5853e39f798ee", "vi havde en virkelig god tid sammen når de kommer igen næste år skal vi besøge aarhus": "2fd0899438f52759", "hvordan går det med dig": "ebde88eb5043de26", "emma": "a18bb2401c908929", "da": "7e28bee1c8c62f72", "når": "482bc710ba095972", "at ankomme": "89050dffa893c7ba", "at blive": "c0565ee38687a62b", "at hente": "04cff64ee2fc14fd", "at kramme": "6ebc56e7badb459a", "at vise (frem)": "49acdb9e135d6268", "at nyde": "325ebbf4f46acad2", "at savne": "0d6a9972def6a1c3", "at smage": "35fecede02dfb04b", "et besøg": "caff0c5b9f109823", "udlandet": "ba6c45eb37cb0b05", "en lufthavn": "b9630a1329b0048d", "en gæst": "9df633f1be35ec4f", "en udsigt": "2779b93f4846d9f5", "et smørrebrød": "41db8a59d627924c", "en kanelsnegl": "b2fe4b8e392f8ff6"}, "key": "ncd2-L04"}, {"book": "ncd2", "lesson": 5, "title_da": "Majas nye arbejde på caféen", "title_zh": "玛雅在咖啡馆的新工作", "grammar": "间接疑问从句（Indirekte spørgsmål）：om / hv-词 + 主语 + (ikke) + 动词，严禁倒装", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Majas nye arbejde på caféen（叙事短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Maja har lige fået et nyt deltidsjob på en travl café ved havnen i Aarhus.", "a": "030b9b771a676da1", "dur": 4.84}, {"id": "a2", "who": "narrator", "da": "I mandags var det hendes første arbejdsdag, og hendes venner fra sprogskolen var meget nysgerrige.", "a": "259e4a09d8de9f31", "dur": 5.36}], "zh": "玛雅刚刚在奥胡斯港口边一家忙碌的咖啡馆找到了一份新的兼职工作。上周一是她第一天上班，语言学校的朋友们都非常好奇。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Før hun begyndte, spurgte hendes ven Kasper: ”[[Ved du, hvornår]] **du skal møde** om morgenen, og [[om]] **du også arbejder** i weekenden?”", "a": "86e682d03f3fbea7", "dur": 6.6}, {"id": "a4", "who": "narrator", "da": "Maja smilte og svarede, at hun endnu ikke vidste, [[hvor travlt]] **der bliver** om lørdagen.", "a": "296ec308f2616456", "dur": 4.2}], "zh": "在开工前，她的朋友卡斯珀问她：“你知道你早上几点上班，还有你周末是不是也工作吗？”玛雅笑着回答说，她还不知道周六的时候会忙到什么程度。"}, {"segs": [{"id": "a5", "who": "narrator", "da": "Nu kender hun hele planen.", "a": "0b3788ffa6bea4a6", "dur": 1.88}, {"id": "a6", "who": "narrator", "da": "Hun møder klokken syv om morgenen for at bage friske boller, lave espresso og gøre bordene klar til kunderne.", "a": "3e027dae722697ff", "dur": 6.0}, {"id": "a7", "who": "narrator", "da": "Hendes venner vil også gerne vide, [[hvad]] **hendes timeløn er**, og [[om]] **kollegerne er** søde.", "a": "048e7001b910f872", "dur": 4.52}, {"id": "a8", "who": "narrator", "da": "Maja fortæller glad, at hun tjener hundrede og femogtredive kroner i timen, og at alle på caféen hjælper hinanden.", "a": "ee1bc22319606253", "dur": 6.12}], "zh": "现在她对整个排班已经了如指掌了。她早上七点到店，负责烘烤新鲜面包卷、冲意式浓缩咖啡以及把桌子收拾妥当迎接顾客。她的朋友们还很想知道她的时薪是多少，以及同事们好不好相处。玛雅开心地说，她每小时赚一百三十五克朗，而且咖啡馆里大家都会互相帮忙。"}, {"segs": [{"id": "a9", "who": "narrator", "da": "Om morgenen ved hun stadig ikke, [[hvilke kunder]] **der kommer** ind først, men hun elsker allerede sit nye arbejde ved vandet.", "a": "9ffd6904de875a07", "dur": 6.28}], "zh": "每天早晨，她依然不知道哪些客人会最先走进店里，但她已经深深爱上了这份海边的新工作。"}]}, {"id": "text-tekstB", "type": "text", "kind": "qa", "tab": "Tekst B", "title": "Tekst B：DU3 Modul 2 Opgave 2 (Informationskløft)：Maja arbejder på en café", "scene": null, "paras": [{"cue": "1. Arbejdssted （地点）", "zh": "1. 工作地点：玛雅在哪里工作？/ 你能告诉我玛雅在哪里工作吗？—— 她在奥胡斯的港口咖啡馆工作。", "segs": [{"id": "b1-1", "who": "Kursist A", "da": "Hvor arbejder Maja henne?", "a": "44c3d0bd40e308e4", "dur": 1.88}, {"id": "b1-2", "who": "Kursist A", "da": "Kan du fortælle mig, [[hvor]] **Maja arbejder**?", "a": "d2ecd8cae7998c41", "dur": 2.32}, {"id": "b1-3", "who": "Kursist B", "da": "Hun arbejder på Café Havnen i Aarhus.", "a": "721abdabdf33e6e1", "dur": 2.96}]}, {"cue": "2. Arbejdstid （工时）", "zh": "2. 工作时间：她几点上班，周末工作吗？/ 我很想知道她几点上班，以及她周末是否工作。—— 她早上 7 点上班，隔周六上一次班。", "segs": [{"id": "b2-1", "who": "Kursist A", "da": "Hvornår møder hun, og arbejder hun i weekenden?", "a": "35ea912b602973bb", "dur": 2.88}, {"id": "b2-2", "who": "Kursist A", "da": "Jeg vil gerne vide, [[hvornår]] **hun møder**, og [[om]] **hun arbejder** i weekenden.", "a": "f77036000da5b310", "dur": 4.28}, {"id": "b2-3", "who": "Kursist B", "da": "Hun møder kl. 7 om morgenen, og hun arbejder hver anden lørdag.", "a": "9d43cc633735f626", "dur": 4.0}]}, {"cue": "3. Løn （薪水）", "zh": "3. 薪水：她每小时挣多少钱？/ 你知道她时薪多少吗？—— 她每小时挣 135 克朗。", "segs": [{"id": "b3-1", "who": "Kursist A", "da": "Hvor meget får hun i løn i timen?", "a": "bda28d1eb6af3cd6", "dur": 2.04}, {"id": "b3-2", "who": "Kursist A", "da": "Ved du, [[hvor meget]] **hun tjener** i timen?", "a": "478d6a20a5ea202e", "dur": 2.2}, {"id": "b3-3", "who": "Kursist B", "da": "Hun tjener 135 kroner i timen.", "a": "a2be5c30f3550c18", "dur": 3.04}]}, {"cue": "4. Opgaver （任务）", "zh": "4. 工作任务：她的工作任务是什么？/ 你能跟我说说她在咖啡馆要做什么吗？—— 她烤面包卷、做咖啡并服务顾客。", "segs": [{"id": "b4-1", "who": "Kursist A", "da": "Hvad er hendes arbejdsopgaver?", "a": "f547faa341260099", "dur": 2.32}, {"id": "b4-2", "who": "Kursist A", "da": "Kan du sige mig, [[hvad]] **hun skal lave** på caféen?", "a": "801c43ddfa287d62", "dur": 2.24}, {"id": "b4-3", "who": "Kursist B", "da": "Hun bager boller, laver kaffe og betjener kunderne.", "a": "dec0f63a199936f2", "dur": 3.92}]}, {"cue": "5. Kolleger （同事）", "zh": "5. 同事：她同事多吗，人好不好？/ 我想知道她有没有友善的同事。—— 是的，她有四位同事，大家都非常友善又乐于助人。", "segs": [{"id": "b5-1", "who": "Kursist A", "da": "Har hun mange kolleger, og er de søde?", "a": "27a747fb97c49c80", "dur": 2.64}, {"id": "b5-2", "who": "Kursist A", "da": "Jeg vil gerne vide, [[om]] **hun har** søde kolleger.", "a": "b3bd76d5cdfd6585", "dur": 2.68}, {"id": "b5-3", "who": "Kursist B", "da": "Ja, hun har fire kolleger, og de er rigtig søde og hjælpsomme.", "a": "e82b09571d8e4e10", "dur": 3.88}]}, {"cue": "6. Transport （交通）", "zh": "6. 交通方式：她怎么去上班？/ 你能告诉我她怎么去咖啡馆吗？—— 她沿着港口骑自行车，大概要 15 分钟。", "segs": [{"id": "b6-1", "who": "Kursist A", "da": "Hvordan kommer hun på arbejde?", "a": "59cfa45698bad6b8", "dur": 1.96}, {"id": "b6-2", "who": "Kursist A", "da": "Kan du fortælle mig, [[hvordan]] **hun kommer** hen til caféen?", "a": "25473c3bda0ee830", "dur": 2.68}, {"id": "b6-3", "who": "Kursist B", "da": "Hun cykler langs havnen, og det tager 15 minutter.", "a": "d0e773fd0b403ae1", "dur": 3.52}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "是否（绝不可用 hvis 代替！）", "note": "连词 · 引导间接是非疑问从句", "segs": [{"id": "g1", "who": "narrator", "da": "om", "say": "om.", "a": "ad8662ef8bd68832", "dur": 0.64}]}, {"zh": "知道，了解", "note": "动词 · ved, vidste, har vidst", "segs": [{"id": "g2", "who": "narrator", "da": "at vide", "say": "at vide. ved, vidste, har vidst.", "a": "2b54e91351c3dfdb", "dur": 4.32}]}, {"zh": "询问，提问（spørge om 问关于……）", "note": "动词 · spørger, spurgte, har spurgt", "segs": [{"id": "g3", "who": "narrator", "da": "at spørge", "say": "at spørge. spørger, spurgte, har spurgt.", "a": "fafb41270fea3013", "dur": 4.76}]}, {"zh": "讲述，告诉", "note": "动词 · fortæller, fortalte, har fortalt", "segs": [{"id": "g4", "who": "narrator", "da": "at fortælle", "say": "at fortælle. fortæller, fortalte, har fortalt.", "a": "acab91af7e306e64", "dur": 4.88}]}, {"zh": "（按时）到岗上班；遇见", "note": "动词 · møder, mødte, har mødt", "segs": [{"id": "g5", "who": "narrator", "da": "at møde", "say": "at møde. møder, mødte, har mødt.", "a": "4cbe24d458c61b68", "dur": 4.04}]}, {"zh": "挣（钱），赚取", "note": "动词 · tjener, tjente, har tjent", "segs": [{"id": "g6", "who": "narrator", "da": "at tjene", "say": "at tjene. tjener, tjente, har tjent.", "a": "fe29d5d31c90afb5", "dur": 4.56}]}, {"zh": "烘烤，烘焙", "note": "动词 · bager, ?", "stem": "Jeg vil gerne vide,", "accept": ["hvilke opgaver hun har om eftermiddagen."]}]}, {"id": "B", "type": "correct", "title": "练习 B：火眼金睛纠错", "instruction": "句子里有一处语序或选词错误，请输入改正后的整句。", "items": [{"wrong": "Jeg ved ikke, hvor arbejder Maja henne.", "accept": ["Jeg ved ikke, hvor Maja arbejder henne."], "explain": "取消倒装：hvor + 主语 Maja + 动词 arbejder。"}, {"wrong": "Kan du fortælle mig, hvis hun har fri i weekenden?", "accept": ["Kan du fortælle mig, om hun har fri i weekenden?"], "explain": "“是否”用 om，不用 hvis（hvis = 如果）。"}, {"wrong": "De vil gerne vide, hvorfor kan hun ikke komme i aften.", "accept": ["De vil gerne vide, hvorfor hun ikke kan komme i aften."], "explain": "取消倒装，并且 ikke 放到动词 kan 前面。"}, {"wrong": "Jeg vil gerne høre, hvad laver hun på caféen.", "accept": ["Jeg vil gerne høre, hvad hun laver på caféen."], "explain": "取消倒装：hvad + hun + laver。"}, {"wrong": "Hun spørger, om han arbejder aldrig om aftenen.", "accept": ["Hun spørger, om han aldrig arbejder om aftenen."], "explain": "从句中副词 aldrig 放在动词前。"}, {"wrong": "Jeg ved ikke, hvem kommer ind i butikken.", "accept": ["Jeg ved ikke, hvem der kommer ind i butikken."], "explain": "hvem 作主语要加 der。"}]}, {"id": "C", "type": "translate", "title": "练习 C：中译丹实战", "instruction": "把中文译成丹麦语。答案不止一种时，常见的说法都算对。", "items": [{"zh": "你能告诉我玛雅在哪家咖啡馆工作吗？", "accept": ["Kan du fortælle mig, hvilken café Maja arbejder på?", "Kan du fortælle mig, på hvilken café Maja arbejder?"]}, {"zh": "我想知道她周末是不是也上班。", "accept": ["Jeg vil gerne vide, om hun også arbejder i weekenden.", "Jeg vil gerne vide, om hun også arbejder om weekenden."]}, {"zh": "他知道玛雅一小时挣多少钱吗？", "accept": ["Ved han, hvor meget Maja tjener i timen?", "Ved han, hvor meget Maja får i løn i timen?"]}, {"zh": "我不知道为什么公交车今天没有按时来。", "accept": ["Jeg ved ikke, hvorfor bussen ikke kom til tiden i dag.", "Jeg ved ikke, hvorfor bussen ikke kom til tiden."]}, {"zh": "她朋友问她有哪些同事，以及她怎么去上班。", "accept": ["Hendes venner spørger, hvilke kolleger hun har, og hvordan hun kommer på arbejde." ttede** de endelig ind i en lys treværelses lejlighed på tredje sal.", "a": "827af313e46383b4", "dur": 5.28}, {"id": "a4", "who": "narrator", "da": "Flyttedagen var et stort kaos!", "a": "afb8ec62be0bda54", "dur": 2.56}, {"id": "a5", "who": "narrator", "da": "De bar tyve tunge flyttekasser op ad trapperne [[på tre timer]].", "a": "d74d57d016286bf0", "dur": 4.12}, {"id": "a6", "who": "narrator", "da": "Heldigvis kom to søde naboer ud i opgangen og hjalp dem med at bære den store sofa ind i stuen.", "a": "706b691c9c4c5952", "dur": 5.56}], "zh": "两周前，他们终于搬进了一套位于三楼的明亮三居室公寓。搬家那天简直一团糟！他们花了三个小时才把二十个沉重的搬家纸箱搬上楼梯。好在楼道里出来两位友好的新邻居，帮他们一起把大沙发抬进了客厅。"}, {"segs": [{"id": "a7", "who": "narrator", "da": "Nu **har** Jonas og Sofie allerede **boet** her [[i to uger]], og de elsker deres nye altan med morgensol.", "a": "508a5c0fe27ceabb", "dur": 5.12}, {"id": "a8", "who": "narrator", "da": "De fleste kasser er pakket ud, men der mangler stadig et par lamper. [[Om to uger]] **holder** de en hyggelig indflytningsfest for alle deres venner og nye naboer.", "a": "5e7731a4055c1e89", "dur": 8.64}], "zh": "现在约纳斯和索菲已经在这里住了两周了，他们非常喜欢带着晨光的新阳台。大部分箱子都已经拆完了，不过还缺几盏灯。两周后，他们要为所有朋友和新邻居办一场惬意的乔迁派对。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：En e-mail fra Laura — og svaret om den nye bolig（对标 DU3 Modul 2 Skrivning: Flytning & Bolig）", "scene": null, "paras": [{"cue": "来信｜Fra: Laura", "segs": [{"id": "b1", "who": "narrator", "da": "Hej", "a": "51d9c5359c868463", "dur": 0.88}, {"id": "b2", "who": "narrator", "da": "Jeg har hørt, at I endelig er flyttet!", "nl": true, "a": "660b87adb85b1e94", "dur": 2.56}, {"id": "b3", "who": "narrator", "da": "Tillykke med den nye lejlighed.", "a": "deb468f55ce6b219", "dur": 2.0}, {"id": "b4", "who": "narrator", "da": "Hvornår flyttede I?", "a": "04db8fb97864b6a1", "dur": 1.2}, {"id": "b5", "who": "narrator", "da": "Hvorfor ville I egentlig flytte?", "a": "4a0b075d3b41acf3", "dur": 1.76}, {"id": "b6", "who": "narrator", "da": "Hvordan ser den nye lejlighed ud?", "a": "75b42d4e8059b01f", "dur": 1.88}, {"id": "b7", "who": "narrator", "da": "Og skal I holde en indflytningsfest snart?", "a": "536864563021bbaf", "dur": 2.8}, {"id": "b8", "who": "narrator", "da": "Mange hilsner", "nl": true, "a": "54bef3a12cf1eb63", "dur": 1.2}, {"id": "b9", "who": "narrator", "da": "Laura", "nl": true, "a": "3fe04437f220a9d0", "dur": 1.12}]}, {"cue": "高分回信范本（107 词）｜Til: Laura Emne: Vores nye lejlighed", "segs": [{"id": "b10", "who": "narrator", "da": "Kære Laura", "a": "c3cd3fe5b90191bf", "dur": 1.24}]}, {"segs": [{"id": "b11", "who": "narrator", "da": "Tusind tak for din søde mail og for lykønskningen!", "a": "d3f3b76c52b0e400", "dur": 2.96}, {"id": "b12", "who": "narrator", "da": "Ja, vi **er** endelig **flyttet** efter at have boet i vores lille lejlighed [[i tre år]].", "a": "2d781714b9eb1a9c", "dur": 5.56}]}, {"segs": [{"id": "b13", "who": "narrator", "da": "Vi **flyttede** [[for to uger siden]], fordi vi gerne ville have mere plads og et ekstra værelse til et hjemmekontor.", "a": "16e2dab55c983ba8", "dur": 5.52}, {"id": "b14", "who": "narrator", "da": "Vores nye lejlighed ligger på tredje sal og er meget lys og rummelig.", "a": "bbcaac9e71266677", "dur": 4.44}, {"id": "b15", "who": "narrator", "da": "Den har en stor stue, to gode værelser og en dejlig altan, hvor vi drikker morgenkaffe i solen. [[Om to uger]] **holder** vi indflytningsfest lørdag aften klokken atten, og vi håber virkelig, at du kan komme!", "a": "48e89778a60ff5a5", "dur": 11.2}]}, {"segs": [{"id": "b16", "who": "narrator", "da": "Skriv snart tilbage, om du kan komme.", "a": "9622d1ab1cef1f7b", "dur": 1.92}]}, {"segs": [{"id": "b17", "who": "narrator", "da": "De bedste hilsner", "a": "53860edc0c60211a", "dur": 1.4}, {"id": "b18", "who": "narrator", "da": "Jonas", "nl": true, "a": "3c874b55dc7586c4", "dur": 1.16}], "zh_all": "劳拉来信：嗨！我听说你们终于搬家了！祝贺你们住进新公寓。你们什么时候搬的？当初为什么想搬家呢？新公寓是什么样子的？你们很快要办乔迁派对吗？祝好，劳拉。\n约纳斯回信：亲爱的劳拉！非常感谢你亲切的邮件和祝福！是的，在我们的旧小公寓住了三年之后，我们终于搬家了。我们是两周前搬的，因为我们很想拥有更大的空间以及多一间房间用来做居家办公室。我们的新公寓在三楼，非常明亮宽敞。它有一个大客厅、两间很棒的房间和一个惬意的阳台，我们会在阳台上晒着太阳喝早咖啡。两周后周六晚上六点我们要办乔迁派对，我们真心希望你能来！请尽快回信告诉我们你能不能来。致以最美好的问候，约纳斯。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "搬家；移动（flytte ind 搬入）", "note": "动词 · flytter, flyttede, er flyttet", "segs": [{"id": "g1", "who": "narrator", "da": "at flytte", "say": "at flytte. flytter, flyttede, er flyttet.", "a": "f12663c951664a86", "dur": 4.44}]}, {"zh": "来，到来", "note": "动词 · kommer, kom, er kommet", "segs": [{"id": "g2", "who": "narrator", "da": "at komme", "say": "at komme. kommer, kom, er kommet.", "a": "3aa9fb0126eac67c", "dur": 4.64}]}, {"zh": "拥有", "note": "动词 · ejer, ejede, har ejet", "segs": [{"id": "g3", "who": "narrator", "da": "at eje", "say": "at eje. ejer, ejede, har ejet.", "a": "8cfa8c292c9a9b1d", "dur": 4.4}]}, {"zh": "寻找（lede efter en bolig 找房）", "note": "动词 · leder, ledte, har ledt efter", "segs": [{"id": "g4", "who": "narrator", "da": "at lede efter", "say": "at lede efter. leder, ledte, har ledt efter.", "a": "9000965aa9e7c073", "dur": 4.8}]}, {"zh": "搬运，扛，提（不规则变化！）", "note": "动词 · bærer, bar, har båret", "segs": [{"id": "g5", "who": "narrator", "da": "at bære", "say": "at bære. bærer, bar, har båret.", "a": "bc23aa1db53c7aa8", "dur": 4.12}]}, {"zh": "帮助（hjælpe nogen med at...）", "note": "动词 · hjælper, hjalp, har hjulpet", "segs": [{"id": "g6", "who": "narrator", "da": "at hjælpe", "say": "at hjælpe. hjælper, hjalp, har hjulpet.", "a": "ed2dc8dfb2308628", "dur": 4.4}]}, {"zh": "拆箱，把行李取出", "note": "动词 · pakker ud, pakkede ud, har pakket ud", "segs": [{"id": "g7", "who": "narrator", "da": "at pakke ud", "say": "at pakke ud. pakker ud, pakkede ud, har pakket ud.", "a": "c0df2cac5d94be93", "dur": 5.32}]}, {"zh": "举办（派对/会议）", "note": "动词 · holder, holdt, har holdt", "segs": [{"id": "g8", "who": "narrator", "da": "at holde (fest)", "say": "at holde (fest). holder, holdt, har holdt.", "a": "3c8127a9b94918fa", "dur": 5.52}]}, {"zh": "搬家纸箱", "note": "名词 · flyttekassen, flyttekasser, -ne", "segs": [{"id": "g9", "who": "narrator", "da": "en flyttekasse", "say": "en flyttekasse.", "a": "af62bbf225f19462", "dur": 1.56}]}, {"zh": "住宅楼梯间，单元楼道", "note": "名词 · opgangen, opgange, opgangene", "segs": [{"id": "g10", "who": "narrator", "da": "en opgang", "say": "en opgang. opgangen, opgange, opgangene.", "a": "5bc8f9e430161123", "dur": 5.2}]}, {"zh": "阳台", "note": "名词 · altanen, altaner, altanerne", "segs": [{"id": "g11", "who": "narrator", "da": "en altan", "say": "en altan. altanen, altaner, altanerne.", "a": "9769849f5a63dea6", "dur": 5.88}]}, {"zh": "楼层（på tredje sal）", "note": "名词 · salen, sale, salene", "segs": [{"id": "g12", "who": "narrator", "da": "en sal", "say": "en sal. salen, sale, salene.", "a": "cc0697f31e50f307", "dur": 4.48}]}, {"zh": "空间，地方（mere plads 不可数）", "note": "名词 · pladsen, pladser, pladserne", "segs": [{"id": "g13", "who": "narrator", "da": "en plads", "say": "en plads. pladsen, pladser, pladserne.", "a": "07bb94437dc463b3", "dur": 4.8}]}, {"zh": "乔迁派对，温居聚会", "note": "名词 · indflytningsfesten, -fester, -ne", "segs": [{"id": "g14", "who": "narrator", "da": "en indflytningsfest", "say": "en indflytningsfest.", "a": "1914bfdb5f72f2ab", "dur": 1.68}]}, {"zh": "混乱，一团糟", "note": "名词 · kaosset, ingen flertal", "segs": [{"id": "g15", "who": "narrator", "da": "et kaos", "say": "et kaos. kaosset, ingen flertal.", "a": "eaa2f06040a1601d", "dur": 3.72}]}, {"zh": "拥挤狭小的", "note": "形容词 · trangt, trange", "segs": [{"id": "g16", "who": "narrator", "da": "trang", "say": "trang. trangt, trange.", "a": "56d2f0ea37af95d8", "dur": 3.12}]}, {"zh": "宽敞的", "note": "形容词 · -t, -e", "segs": [{"id": "g17", "who": "narrator", "da": "rummelig", "say": "rummelig.", "a": "6c39daaef3135613", "dur": 1.04}]}, {"zh": "终于", "note": "副词", "segs": [{"id": "g18", "who": "narrator", "da": "endelig", "a": "d0c3d000b48a8caf", "dur": 0.8}]}, {"zh": "渐渐地，随着时间推移", "note": "副词", "segs": [{"id": "g19", "who": "narrator", "da": "efterhånden", "a": "5728f20ed78c25c1", "dur": 0.96}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "动词 [er]", "da": "at flytte", "zh": "搬家；移动（flytte ind 搬入）", "forms": "flytter, flyttede, er flyttet"}, {"pos": "动词 [er]", "da": "at komme", "zh": "来，到来", "forms": "kommer, kom, er kommet"}, {"pos": "动词", "da": "at eje", "zh": "拥有", "forms": "ejer, ejede, har ejet"}, {"pos": "动词", "da": "at lede efter", "zh": "寻找（lede efter en bolig 找房）", "forms": "leder, ledte, har ledt efter"}, {"pos": "动词", "da": "at bære", "zh": "搬运，扛，提（不规则变化！）", "forms": "bærer, bar, har båret"}, {"pos": "动词", "da": "at hjælpe", "zh": "帮助（hjælpe nogen med at...）", "forms": "hjælper, hjalp, har hjulpet"}, {"pos": "动词", "da": "at pakke ud", "zh": "拆箱，把行李取出", "forms": "pakker ud, pakkede ud, har pakket ud"}, {"pos": "动词", "da": "at holde (fest)", "zh": "举办（派对/会议）", "forms": "holder, holdt, har holdt"}, {"pos": "名词", "da": "en flyttekasse", "zh": "搬家纸箱", "forms": "flyttekassen, flyttekasser, -ne"}, {"pos": "名词", "da": "en opgang", "zh": "住宅楼梯间，单元楼道", "forms": "opgangen, opgange, opgangene"}, {"pos": "名词", "da": "en altan", "zh": "阳台", "forms": "altanen, altaner, altanerne"}, {"pos": "名词", "da": "en sal", "zh": "楼层（på tredje sal）", "forms": "salen, sale, salene"}, {"pos": "名词", "da": "en plads", "zh": "空间，地方（mere plads 不可数）", "forms": "pladsen, pladser, pladserne"}, {"pos": "名词", "da": "en indflytningsfest", "zh": "乔迁派对，温居聚会", "forms": "indflytningsfesten, -fester, -ne"}, {"pos": "名词", "da": "et kaos", "zh": "混乱，一团糟", "forms": "kaosset, ingen flertal"}, {"pos": "形容词", "da": "trang / rummelig", "zh": "拥挤狭小的 / 宽敞的", "forms": "trang (trangt, trange) / rummelig (-t, -e"}, {"pos": "副词", "da": "endelig / efterhånden", "zh": "终于 / 渐渐地，随着时间推移", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "我们在那套狭小的旧公寓里住了三年，然后决定搬家。", "answer": "Vi boede i den lille, trange lejlighed i tre år, og så besluttede vi at flytte."}, {"zh": "两周前我们终于搬进了三楼一套明亮的三居室公寓。", "answer": "For to uger siden flyttede vi endelig ind i en lys treværelses lejlighed på tredje sal."}, {"zh": "我们花了三个小时把所有搬家纸箱搬上楼梯，邻居们也帮忙了。", "answer": "Vi bar alle flyttekasserne op ad trapperne på tre timer, og naboerne hjalp os også."}, {"zh": "两周后我们要办一场乔迁派对——你愿意来吗？", "answer": "Om to uger holder vi en indflytningsfest – vil du ikke komme?"}]}, {"id": "A", "type": "drill", "title": "练习 A：时间介词填空（填入 i、for... siden、om 或 på）", "items": [{"prompt": "Vi flyttede ind i vores nye hus {{_}} tre måneder {{_}}.", "kind": "cloze", "blanks": [["for"], ["siden"]], "explain": "过去搬入的时间点"}, {"prompt": "Min søster har boet i Odense {{_}} fem år, og hun elsker byen.", "kind": "cloze", "blanks": [["i"]], "explain": "延续至今的时长"}, {"prompt": "{{_}} to uger holder vi en stor indflytningsfest i haven.", "kind": "cloze", "blanks": [["Om"]], "explain": "两周后的将来计划"}, {"prompt": "Før vi flyttede, boede vi i en meget lille lejlighed {{_}} næsten fire år.", "kind": "cloze", "blanks": [["i"]], "explain": "过去持续了近四年"}, {"prompt": "De dygtige venner hjalp os med at pakke hele køkkenet ud {{_}} to timer!", "kind": "cloze", "blanks": [["på"]], "explain": "仅用两小时就拆完箱子"}, {"prompt": "{{_}} et år skal min kæreste og jeg måske flytte til Aarhus.", "kind": "cloze", "blanks": [["Om"]], "explain": "一年后将要发生"}, {"prompt": "Jeg kom til Danmark {{_}} et halvt år {{_}}, og nu lærer jeg dansk.", "kind": "cloze", "blanks": [["for"], ["siden"]], "explain": "半年前抵达，配过去时 ⟦kom⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：时态与时间介词搭配选择（选出正确动词形式）", "items": [{"prompt": "For to år siden {{_}} (⟦har vi boet / boede vi⟧) i en studiebolig på Nørrebro.", "kind": "cloze", "blanks": [["boede vi"]], "explain": "⟦For to år siden⟧ 必用过去时 + 句首 V2 倒装"}, {"prompt": "Nu {{_}} (⟦har vi boet / boede vi⟧) i vores nye lejlighed i to måneder, og vi trives godt.", "kind": "cloze", "blanks": [["har vi boet"]], "explain": "仍在住着，持续 ⟦i to måneder⟧"}, {"prompt": "Endelig {{_}} (⟦er vi flyttet / har vi flyttet⟧) ind i et større hus!", "kind": "cloze", "blanks": [["er vi flyttet"]], "explain": "⟦flytte⟧ 位移变化完成时用 ⟦er⟧"}, {"prompt": "Om tre dage {{_}} (⟦kommer / kom⟧) vores nye sofa fra butikken.", "kind": "cloze", "blanks": [["kommer"]], "explain": "⟦Om tre dage⟧ 表将来，用现在时"}, {"prompt": "Da de flyttede for en måned siden, {{_}} (⟦hjalp / har hjulpet⟧) naboerne dem med kasserne.", "kind": "cloze", "blanks": [["hjalp"]], "explain": "⟦for en måned siden⟧ 已结束过去时间点"}, {"prompt": "Jeg har lært dansk {{_}} (⟦for seks måneder siden / i seks måneder⟧) nu.", "kind": "cloze", "blanks": [["i seks måneder"]], "explain": "因为主句是现在完成时 ⟦har lært⟧"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "我们在那套狭小的旧公寓里住了三年，然后决定搬家。", "kind": "write", "accept": ["Vi boede i den lille, trange lejlighed i tre år, og så besluttede vi at flytte."]}, {"prompt": "两周前我们终于搬进了三楼一套明亮的三居室公寓。", "kind": "write", "accept": ["For to uger siden flyttede vi endelig ind i en lys treværelses lejlighed på tredje sal."]}, {"prompt": "我们花了三个小时把所有搬家纸箱搬上楼梯，邻居们也帮忙了。", "kind": "write", "accept": ["Vi bar alle flyttekasserne op ad trapperne på tre timer, og naboerne hjalp os også."]}, {"prompt": "现在我们在这里已经住了两周了，我最喜欢带阳光的新阳台。", "kind": "write", "accept": ["Nu har vi boet her i to uger, og jeg er gladest for den nye altan med sol."]}, {"prompt": "两周后我们要办一场乔迁派对——你愿意来吗？", "kind": "write", "accept": ["Om to uger holder vi en indflytningsfest – vil du ikke komme?"]}]}], "clips": {"jonas og sofie boede i en lille etværelses lejlighed i tre år for tre år siden var det fint fordi de ikke ejede så mange ting": "82e24b086d99b2ac", "men efterhånden blev lejligheden alt for trang så i foråret begyndte de at lede efter et større sted": "439a80dbfef2fd69", "for to uger siden flyttede de endelig ind i en lys treværelses lejlighed på tredje sal": "827af313e46383b4", "flyttedagen var et stort kaos": "afb8ec62be0bda54", "de bar tyve tunge flyttekasser op ad trapperne på tre timer": "d74d57d016286bf0", "heldigvis kom to søde naboer ud i opgangen og hjalp dem med at bære den store sofa ind i stuen": "706b691c9c4c5952", "nu har jonas og sofie allerede boet her i to uger og de elsker deres nye altan med morgensol": "508a5c0fe27ceabb", "de fleste kasser er pakket ud men der mangler stadig et par lamper om to uger holder de en hyggelig indflytningsfest for alle deres venner og nye naboer": "5e7731a4055c1e89", "hej": "51d9c5359c868463", "jeg har hørt at i endelig er flyttet": "660b87adb85b1e94", "tillykke med den nye lejlighed": "deb468f55ce6b219", "hvornår flyttede i": "04db8fb97864b6a1", "hvorfor ville i egentlig flytte": "4a0b075d3b41acf3", "hvordan ser den nye lejlighed ud": "75b42d4e8059b01f", "og skal i holde en indflytningsfest snart": "536864563021bbaf", "mange hilsner": "54bef3a12cf1eb63", "laura": "3fe04437f220a9d0", "kære laura": "c3cd3fe5b90191bf", "tusind tak for din søde mail og for lykønskningen": "d3f3b76c52b0e400", "ja vi er endelig flyttet efter at have boet i vores lille lejlighed i tre år": "2d781714b9eb1a9c", "vi flyttede for to uger siden fordi vi gerne ville have mere plads og et ekstra værelse til et hjemmekontor": "16e2dab55c983ba8", "vores nye lejlighed ligger på tredje sal og er meget lys og rummelig": "bbcaac9e71266677", "den har en stor stue to gode værelser og en dejlig altan hvor vi drikker morgenkaffe i solen om to uger holder vi indflytningsfest lørdag aften klokken atten og vi håber virkelig at du kan komme": "48e89778a60ff5a5", "skriv snart tilbage om du kan komme": "9622d1ab1cef1f7b", "de bedste hilsner": "53860edc0c60211a", "jonas": "3c874b55dc7586c4", "at flytte": "f12663c951664a86", "at komme": "3aa9fb0126eac67c", "at eje": "8cfa8c292c9a9b1d", "at lede efter": "9000965aa9e7c073", "at bære": "bc23aa1db53c7aa8", "at hjælpe": "ed2dc8dfb2308628", "at pakke ud": "c0df2cac5d94be93", "at holde (fest)": "3c8127a9b94918fa", "en flyttekasse": "af62bbf225f19462", "en opgang": "5bc8f9e430161123", "en altan": "9769849f5a63dea6", "en sal": "cc0697f31e50f307", "en plads": "07bb94437dc463b3", "en indflytningsfest": "1914bfdb5f72f2ab", "et kaos": "eaa2f06040a1601d", "trang": "56d2f0ea37af95d8", "rummelig": "6c39daaef3135613", "endelig": "d0c3d000b48a8caf", "efterhånden": "5728f20ed78c25c1"}, "key": "ncd2-L06"}, {"book": "ncd2", "lesson": 7, "title_da": "Vi cykler til arbejde i maj", "title_zh": "五月我们骑车上班", "grammar": "目的不定式 for at + 动词原形（与否定 for ikke at）vs 原因从句 fordi · 让步从句 selvom（虽然……但是……，严禁配 men）", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Vi cykler til arbejde i maj（叙事短文 · 约 140 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Hvert år i maj deltager tusindvis af danskere i den store nationale kampagne ”Vi cykler til arbejde”.", "a": "144f5fd46987c56e", "dur": 5.96}, {"id": "a2", "who": "narrator", "da": "I år har et lille it-firma i Odense også dannet et hold på otte kolleger.", "a": "d2a928b12df7f771", "dur": 4.52}], "zh": "每年五月，成千上万的丹麦人都会参加全国性的大型活动“我们骑车去上班”。今年，欧登塞一家小 IT 公司的八位同事也组建了一支队伍。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "De melder sig til kampagnen [[for at få]] mere motion i hverdagen og [[for at spare]] penge på benzin.", "a": "bb0650a9c2f150d4", "dur": 4.8}, {"id": "a4", "who": "narrator", "da": "Flere af dem cykler også [[for ikke at sidde]] i bilkø hver morgen.", "a": "30d230df0f1e6386", "dur": 3.0}, {"id": "a5", "who": "narrator", "da": "Derudover kan holdet vinde flotte præmier, hvis alle registrerer deres cykelture på nettet.", "a": "1ed92698a9d962f2", "dur": 5.2}], "zh": "他们报名参加这个活动，是为了在日常生活中获得更多锻炼，同时为了省下汽油钱。他们中的好几个人骑车也是为了避免每天早上堵在车流里。除此之外，如果大家都把骑行记录登记到网上，团队还有机会赢取丰厚奖品。"}, {"segs": [{"id": "a6", "who": "narrator", "da": "**Selvom** det ofte regner og blæser i det danske forårsvejr, **tager** Henrik og hans kolleger bare regntøj på og cykler afsted med et smil.", "a": "a465460bcddda0ae", "dur": 7.6}, {"id": "a7", "who": "narrator", "da": "Hans kollega Mette bor tolv kilometer fra kontoret, men hun cykler hele vejen hver dag, **selvom** turen **tager** fyrre minutter.", "a": "2258f0c7608b19ac", "dur": 7.16}], "zh": "虽然丹麦春天的天气常常刮风又下雨，亨里克和他的同事们还是照样穿上雨衣，面带微笑骑车出发。他的同事梅特住在离办公室十二公里远的地方，可哪怕单程要花四十分钟，她依然每天骑完一整段路。"}, {"segs": [{"id": "a8", "who": "narrator", "da": "Om fredagen spiser hele holdet gratis morgenmad sammen i kantinen [[for at fejre]] endnu en god uge på cykel.", "a": "5323903961eb3b47", "dur": 6.28}], "zh": "每到周五，全队人都会在食堂里一起吃免费的早餐，庆祝又一个骑行成功的美好一周。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Kampagneopslag & Beskeder fra kolleger（对标 DU3 Modul 2 Læsning Opgave 1）", "scene": null, "paras": [{"cue": "官方活动公告（Kampagneopslag）｜Vi cykler til arbejde – Dansk Cyklistforbund", "segs": [{"id": "b1", "who": "narrator", "da": "Cykl til arbejde hver dag i maj sammen med dine kolleger!", "a": "7f9782f2d0a64ab0", "dur": 3.64}, {"id": "b2", "who": "narrator", "da": "Det er godt for dit helbred og miljøet, og du får masser af frisk luft.", "a": "eaeaa072e066cb3f", "dur": 3.6}, {"id": "b3", "who": "narrator", "da": "Du sparer også penge ved at lade bilen stå.", "a": "4b0b924749ab80f1", "dur": 2.48}, {"id": "b4", "who": "narrator", "da": "Tilmeld dig et hold med mindst tre kolleger [[for at deltage]] i konkurrencer om flotte præmier – både nye elcykler og weekendophold.", "a": "4e505de9ce28b008", "dur": 7.92}, {"id": "b5", "who": "narrator", "da": "Alle kan være med, **selvom** du kun bor få kilometer fra din arbejdsplads!", "a": "3c4e805d3d5c8b36", "dur": 4.28}, {"id": "b6", "who": "narrator", "da": "Læs mere og opret dit hold på cyklistforbundet.dk.", "a": "d08c7d2328663497", "dur": 3.92}]}, {"cue": "公司内网工作群消息（4 条同事留言）", "segs": [{"id": "b7", "who": "Mette", "da": "Hej alle!", "label": "Mette", "a": "5745ce8383147a43", "dur": 1.44}, {"id": "b8", "who": "Mette", "da": "Jeg bor kun 4 km fra kontoret, men mit baghjul er desværre punkteret i morges.", "a": "2d2daf2d282edb93", "dur": 5.48}, {"id": "b9", "who": "Mette", "da": "Har nogen en cykelpumpe på kontoret, så jeg kan cykle hjem efter arbejde?", "a": "42b1aa058192de73", "dur": 4.44}, {"id": "b10", "who": "Ali", "da": "Jeg vil rigtig gerne være med på holdet, men jeg har ikke en cykel endnu.", "nl": true, "label": "Ali", "a": "c025d80c25289b4d", "dur": 3.24}, {"id": "b11", "who": "Ali", "da": "På lørdag tager jeg ud for at købe en god brugt cykel, så jeg kan starte på mandag!", "a": "fbce84ea768601cb", "dur": 3.88}, {"id": "b12", "who": "Sofie", "da": "Husk, at vores chef giver gratis rundstykker og kaffe i kantinen hver fredag kl. 8.15 for alle på holdet – selvom det regner hele ugen!", "nl": true, "label": "Sofie", "a": "1315ac012986bdb4", "dur": 8.64}, {"id": "b13", "who": "Thomas", "da": "Jeg bor 25 km væk, så jeg tager toget ind til Odense Banegård og cykler de sidste 5 km til kontoret på min lille foldecykel.", "nl": true, "label": "Thomas", "a": "bd2e906439846f59", "dur": 7.28}], "zh_all": "官方公告：五月里每天和同事们一起骑车上班吧！这有益于你的健康和环境，而且你能呼吸到大量新鲜空气。不开车还能省钱。至少和三位同事组队报名，就有机会参与抽奖赢取精美奖品——包括全新电动自行车和周末度假住宿。即使你住得离工作地点只有几公里，人人都可以参加！详情及组队请访问 cyklistforbundet.dk。\n同事消息：梅特：大家好！我住得离办公室只有 4 公里，但我的后轮今天早上不幸扎胎了。办公室里谁有打气筒吗，好让我下班能骑回家？ 阿里：我特别想入队，但目前还没有自行车。这周六我去买辆好用的二手车，周一就能开始骑！ 索菲：别忘了，即使一整周都在下雨，每周五早上 8 点 15 分老板也会请所有队员在食堂免费吃小圆面包和喝咖啡！ 托马斯：我住 25 公里外，所以我先坐火车到欧登塞火车站，再用我的小折叠车骑完最后 5 公里去办公室。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "为了……（表目的，否定用 for ikke at）", "note": "连词/结构 · + 动词原形", "segs": [{"id": "g1", "who": "narrator", "da": "for at", "say": "for at.", "a": "a730e0cf925f3c0c", "dur": 1.12}]}, {"zh": "虽然，即使，尽管（后接从句语序）", "note": "连词 · 让步从属连词", "segs": [{"id": "g2", "who": "narrator", "da": "selvom", "say": "selvom.", "a": "a86006f6a0a8dd6a", "dur": 1.12}]}, {"zh": "骑自行车（指明终点用 er）", "note": "动词 · cykler, cyklede, er/har cyklet", "segs": [{"id": "g3", "who": "narrator", "da": "at cykle", "say": "at cykle. cykler, cyklede, er eller har cyklet.", "a": "6092822d9f616629", "dur": 5.0}]}, {"zh": "参加，参与（deltage i en kampagne）", "note": "动词 · deltager, deltog, har deltaget", "segs": [{"id": "g4", "who": "narrator", "da": "at deltage (i)", "say": "at deltage (i). deltager, deltog, har deltaget.", "a": "a8be90cae43a7d10", "dur": 4.6}]}, {"zh": "报名，注册（tilmelde sig et hold）", "note": "动词 · tilmelder, tilmeldte, har tilmeldt sig", "segs": [{"id": "g5", "who": "narrator", "da": "at tilmelde sig", "say": "at tilmelde sig. tilmelder, tilmeldte, har tilmeldt sig.", "a": "baa61d3294ed7d12", "dur": 5.12}]}, {"zh": "节省，省下（钱/时间）", "note": "动词 · sparer, sparede, har sparet", "segs": [{"id": "g6", "who": "narrator", "da": "at spare", "say": "at spare. sparer, sparede, har sparet.", "a": "ac58cada3b52f6a0", "dur": 5.48}]}, {"zh": "赢，获胜（不规则过去时 vandt）", "note": "动词 · vinder, vandt, har vundet", "segs": [{"id": "g7", "who": "narrator", "da": "at vinde", "say": "at vinde. vinder, vandt, har vundet.", "a": "9a3948594d21324a", "dur": 4.2}]}, {"zh": "爱护，照顾，小心保护", "note": "动词 · passer, passede, har passet på", "segs": [{"id": "g8", "who": "narrator", "da": "at passe på", "say": "at passe på. passer, passede, har passet på.", "a": "0712d2f26471ac64", "dur": 5.12}]}, {"zh": "庆祝", "note": "动词 · fejrer, fejrede, har fejret", "segs": [{"id": "g9", "who": "narrator", "da": "at fejre", "say": "at fejre. fejrer, fejrede, har fejret.", "a": "caf4fb6cf5e8c9a3", "dur": 4.88}]}, {"zh": "刮风（Det blæser 在刮风）", "note": "动词 · blæser, blæste, har blæst", "segs": [{"id": "g10", "who": "narrator", "da": "at blæse", "say": "at blæse. blæser, blæste, har blæst.", "a": "1218ebcfda50e81d", "dur": 4.76}]}, {"zh": "社会活动，宣传运动", "note": "名词 · kampagnen, kampagner, -ne", "segs": [{"id": "g11", "who": "narrator", "da": "en kampagne", "say": "en kampagne.", "a": "0bcd4484bac42ee8", "dur": 1.52}]}, {"zh": "公告，启事，帖子（单复同形）", "note": "名词 · opslaget, opslag, opslagene", "segs": [{"id": "g12", "who": "narrator", "da": "et opslag", "say": "et opslag. opslaget, opslag, opslagene.", "a": "be87efc36dfb4bff", "dur": 4.6}]}, {"zh": "团队，队伍；课程班（单复同形）", "note": "名词 · holdet, hold, holdene", "segs": [{"id": "g13", "who": "narrator", "da": "et hold", "say": "et hold. holdet, hold, holdene.", "a": "219e5c7c6b3c0bcc", "dur": 5.12}]}, {"zh": "奖品，奖金", "note": "名词 · præmien, præmier, præmierne", "segs": [{"id": "g14", "who": "narrator", "da": "en præmie", "say": "en præmie. præmien, præmier, præmierne.", "a": "3df9294355236fb2", "dur": 4.8}]}, {"zh": "健康，身体状况", "note": "名词 · helbredet, kun ental", "segs": [{"id": "g15", "who": "narrator", "da": "et helbred", "say": "et helbred.", "a": "b710012a8ae75b6f", "dur": 1.12}]}, {"zh": "环境，生态", "note": "名词 · miljøet, miljøer, miljøerne", "segs": [{"id": "g16", "who": "narrator", "da": "et miljø", "say": "et miljø. miljøet, miljøer, miljøerne.", "a": "e00dd6e3d281ca47", "dur": 5.8}]}, {"zh": "雨衣（不可数）", "note": "名词 · regntøjet, kun ental)", "segs": [{"id": "g17", "who": "narrator", "da": "et regntøj", "say": "et regntøj.", "a": "075beb095b2bffcd", "dur": 1.12}]}, {"zh": "折叠自行车", "note": "名词 · (-cyklen, -cykler", "segs": [{"id": "g18", "who": "narrator", "da": "en foldecykel", "say": "en foldecykel.", "a": "49a279574cc35da5", "dur": 1.8}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "连词/结构", "da": "for at", "zh": "为了……（表目的，否定用 for ikke at）", "forms": "+ 动词原形"}, {"pos": "连词", "da": "selvom", "zh": "虽然，即使，尽管（后接从句语序）", "forms": "让步从属连词"}, {"pos": "动词 [er]", "da": "at cykle", "zh": "骑自行车（指明终点用 er）", "forms": "cykler, cyklede, er/har cyklet"}, {"pos": "动词", "da": "at deltage (i)", "zh": "参加，参与（deltage i en kampagne）", "forms": "deltager, deltog, har deltaget"}, {"pos": "动词", "da": "at tilmelde sig", "zh": "报名，注册（tilmelde sig et hold）", "forms": "tilmelder, tilmeldte, har tilmeldt sig"}, {"pos": "动词", "da": "at spare", "zh": "节省，省下（钱/时间）", "forms": "sparer, sparede, har sparet"}, {"pos": "动词", "da": "at vinde", "zh": "赢，获胜（不规则过去时 vandt）", "forms": "vinder, vandt, har vundet"}, {"pos": "动词", "da": "at passe på", "zh": "爱护，照顾，小心保护", "forms": "passer, passede, har passet på"}, {"pos": "动词", "da": "at fejre", "zh": "庆祝", "forms": "fejrer, fejrede, har fejret"}, {"pos": "动词", "da": "at blæse", "zh": "刮风（Det blæser 在刮风）", "forms": "blæser, blæste, har blæst"}, {"pos": "名词", "da": "en kampagne", "zh": "社会活动，宣传运动", "forms": "kampagnen, kampagner, -ne"}, {"pos": "名词", "da": "et opslag", "zh": "公告，启事，帖子（单复同形）", "forms": "opslaget, opslag, opslagene"}, {"pos": "名词", "da": "et hold", "zh": "团队，队伍；课程班（单复同形）", "forms": "holdet, hold, holdene"}, {"pos": "名词", "da": "en præmie", "zh": "奖品，奖金", "forms": "præmien, præmier, præmierne"}, {"pos": "名词", "da": "et helbred", "zh": "健康，身体状况", "forms": "helbredet, kun ental"}, {"pos": "名词", "da": "et miljø", "zh": "环境，生态", "forms": "miljøet, miljøer, miljøerne"}, {"pos": "名词", "da": "et regntøj / en foldecykel", "zh": "雨衣（不可数）/ 折叠自行车", "forms": "regntøjet, kun ental) / (-cyklen, -cykler"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "我每天骑车上班，为了锻炼身体并省钱。（用 for at）", "answer": "Jeg cykler til arbejde hver dag for at få motion og spare penge."}, {"zh": "她早上提前十五分钟出门，为了不迟到。（用 for ikke at）", "answer": "Hun går hjemmefra femten minutter tidligere om morgenen for ikke at komme for sent."}, {"zh": "尽管五月经常刮风下雨，我们还是骑车去办公室。（用 Selvom 放句首）", "answer": "Selvom det ofte blæser og regner i maj, cykler vi alligevel ind til kontoret."}, {"zh": "即使公司离我家很近，我也想参加这个团队。（用 selvom）", "answer": "Selvom arbejdet ligger tæt på mit hjem, vil jeg gerne være med på holdet."}, {"zh": "我们报名参加活动，因为我们想赢得一辆新电动自行车。（用 fordi）", "answer": "Vi melder os til kampagnen, fordi vi gerne vil vinde en ny elcykel."}]}, {"id": "A", "type": "drill", "title": "练习 A：用 for at、for ikke at、fordi 或 selvom 填空", "items": [{"prompt": "Mange danskere cykler til arbejde {{_}} få frisk luft og motion.", "kind": "cloze", "blanks": [["for at"]], "explain": "后接原形 ⟦få⟧"}, {"prompt": "{{_}} det blæser meget i dag, cykler alle kollegerne alligevel.", "kind": "cloze", "blanks": [["Selvom"]], "explain": "从句与主句构成让步对比，注意主句 ⟦cykler alle kollegerne⟧ 倒装"}, {"prompt": "Jeg tager regntøj på om morgenen {{_}} blive våd på cyklen.", "kind": "cloze", "blanks": [["for ikke at"]], "explain": "“为了不被淋湿”，后接原形 ⟦blive⟧"}, {"prompt": "Ali kan ikke cykle på arbejde i dag, {{_}} han ikke har købt en cykel endnu.", "kind": "cloze", "blanks": [["fordi"]], "explain": "说明不能骑车的原因，且 ⟦ikke⟧ 在 ⟦har⟧ 前"}, {"prompt": "Thomas tager toget først, {{_}} han bor 25 kilometer fra kontoret.", "kind": "cloze", "blanks": [["fordi"]], "explain": "后接从句 ⟦han bor...⟧，表原因"}, {"prompt": "Hele holdet spiser morgenmad sammen {{_}} fejre den gode uge.", "kind": "cloze", "blanks": [["for at"]], "explain": "后接原形 ⟦fejre⟧"}, {"prompt": "Mette elsker at cykle på arbejde, {{_}} hendes tur nogle gange er lidt kold.", "kind": "cloze", "blanks": [["selvom"]], "explain": "“尽管路程有时有点冷”"}]}, {"id": "B", "type": "drill", "title": "练习 B：句型整合与改写（使用指定连词合并句子，注意 for ikke at 位置及句首 Selvom 倒装！）", "items": [{"prompt": "⟦Jeg står tidligt op. Jeg vil ikke komme for sent til mødet.⟧ (⟦for ikke at...⟧) →", "kind": "write", "accept": ["Jeg står tidligt op for ikke at komme for sent til mødet."]}, {"prompt": "⟦Turen tager 40 minutter. Mette cykler alligevel hver dag.⟧ (⟦Selvom...⟧) →", "kind": "write", "accept": ["Selvom turen tager 40 minutter, cykler Mette alligevel hver dag."]}, {"prompt": "⟦Vi melder os til kampagnen. Vi vil gerne spare penge og passe på miljøet.⟧ (⟦for at...⟧) →", "kind": "write", "accept": ["Vi melder os til kampagnen for at spare penge og passe på miljøet."]}, {"prompt": "⟦Vejret er ikke altid godt i maj. Vi er stadig glade for at cykle.⟧ (⟦Selvom...⟧) →", "kind": "write", "accept": ["Selvom vejret ikke altid er godt i maj, er vi stadig glade for at cykle."]}, {"prompt": "⟦Han har en foldecykel. Han kan tage den med i toget.⟧ (⟦for at kunne...⟧) →", "kind": "write", "accept": ["Han har en foldecykel for at kunne tage den med i toget."]}, {"prompt": "⟦Jeg cykler til arbejde, selvom det regner, men jeg bliver ikke sur.⟧（把中式错误 *⟦Selvom det regner, men jeg cykler⟧ 改写正确！）→", "kind": "write", "accept": ["Selvom det regner, cykler jeg til arbejde og bliver ikke sur."], "explain": "删除非法的 ⟦men⟧ 并执行主句倒装！"}], "example": "Det regner. Vi cykler alligevel. (Selvom...) → Selvom det regner, cykler vi alligevel."}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "我每天骑车上班，为了锻炼身体并省钱。（用 ⟦for at⟧）", "kind": "write", "accept": ["Jeg cykler til arbejde hver dag for at få motion og spare penge."]}, {"prompt": "她早上提前十五分钟出门，为了不迟到。（用 ⟦for ikke at⟧）", "kind": "write", "accept": ["Hun går hjemmefra femten minutter tidligere om morgenen for ikke at komme for sent."]}, {"prompt": "尽管五月经常刮风下雨，我们还是骑车去办公室。（用 ⟦Selvom⟧ 放句首）", "kind": "write", "accept": ["Selvom det ofte blæser og regner i maj, cykler vi alligevel ind til kontoret."]}, {"prompt": "即使公司离我家很近，我也想参加这个团队。（用 ⟦selvom⟧）", "kind": "write", "accept": ["Selvom arbejdet ligger tæt på mit hjem, vil jeg gerne være med på holdet."]}, {"prompt": "我们报名参加活动，因为我们想赢得一辆新电动自行车。（用 ⟦fordi⟧）", "kind": "write", "accept": ["Vi melder os til kampagnen, fordi vi gerne vil vinde en ny elcykel."]}]}], "clips": {"hvert år i maj deltager tusindvis af danskere i den store nationale kampagne vi cykler til arbejde": "144f5fd46987c56e", "i år har et lille it-firma i odense også dannet et hold på otte kolleger": "d2a928b12df7f771", "de melder sig til kampagnen for at få mere motion i hverdagen og for at spare penge på benzin": "bb0650a9c2f150d4", "flere af dem cykler også for ikke at sidde i bilkø hver morgen": "30d230df0f1e6386", "derudover kan holdet vinde flotte præmier hvis alle registrerer deres cykelture på nettet": "1ed92698a9d962f2", "selvom det ofte regner og blæser i det danske forårsvejr tager henrik og hans kolleger bare regntøj på og cykler afsted med et smil": "a465460bcddda0ae", "hans kollega mette bor tolv kilometer fra kontoret men hun cykler hele vejen hver dag selvom turen tager fyrre minutter": "2258f0c7608b19ac", "om fredagen spiser hele holdet gratis morgenmad sammen i kantinen for at fejre endnu en god uge på cykel": "5323903961eb3b47", "cykl til arbejde hver dag i maj sammen med dine kolleger": "7f9782f2d0a64ab0", "det er godt for dit helbred og miljøet og du får masser af frisk luft": "eaeaa072e066cb3f", "du sparer også penge ved at lade bilen stå": "4b0b924749ab80f1", "tilmeld dig et hold med mindst tre kolleger for at deltage i konkurrencer om flotte præmier – både nye elcykler og weekendophold": "4e505de9ce28b008", "alle kan være med selvom du kun bor få kilometer fra din arbejdsplads": "3c4e805d3d5c8b36", "læs mere og opret dit hold på cyklistforbundetdk": "d08c7d2328663497", "hej alle": "5745ce8383147a43", "jeg bor kun 4 km fra kontoret men mit baghjul er desværre punkteret i morges": "2d2daf2d282edb93", "har nogen en cykelpumpe på kontoret så jeg kan cykle hjem efter arbejde": "42b1aa058192de73", "jeg vil rigtig gerne være med på holdet men jeg har ikke en cykel endnu": "c025d80c25289b4d", "på lørdag tager jeg ud for at købe en god brugt cykel så jeg kan starte på mandag": "fbce84ea768601cb", "husk at vores chef giver gratis rundstykker og kaffe i kantinen hver fredag kl 815 for alle på holdet – selvom det regner hele ugen": "1315ac012986bdb4", "jeg bor 25 km væk så jeg tager toget ind til odense banegård og cykler de sidste 5 km til kontoret på min lille foldecykel": "bd2e906439846f59", "for at": "a730e0cf925f3c0c", "selvom": "a86006f6a0a8dd6a", "at cykle": "6092822d9f616629", "at deltage (i)": "a8be90cae43a7d10", "at tilmelde sig": "baa61d3294ed7d12", "at spare": "ac58cada3b52f6a0", "at vinde": "9a3948594d21324a", "at passe på": "0712d2f26471ac64", "at fejre": "caf4fb6cf5e8c9a3", "at blæse": "1218ebcfda50e81d", "en kampagne": "0bcd4484bac42ee8", "et opslag": "be87efc36dfb4bff", "et hold": "219e5c7c6b3c0bcc", "en præmie": "3df9294355236fb2", "et helbred": "b710012a8ae75b6f", "et miljø": "e00dd6e3d281ca47", "et regntøj": "075beb095b2bffcd", "en foldecykel": "49a279574cc35da5"}, "key": "ncd2-L07"}, {"book": "ncd2", "lesson": 8, "title_da": "Kajak, karate eller gåklub?", "title_zh": "皮划艇、空手道还是健步走？", "grammar": "形容词与副词比较级（-ere）与最高级（-st / -est） · 多音节词 mere / mest · 6 组必背不规则变化（god → bedre → bedst 等）· 比较词 end", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Kajak, karate eller gåklub?（叙事短文 · 约 160 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Frederik, Sara og Kasper bor i Aarhus, og de vil alle tre gerne dyrke mere motion.", "a": "6839742f2cf9c534", "dur": 4.92}, {"id": "a2", "who": "narrator", "da": "En aften sidder de på en café og sammenligner tre lokale klubber på nettet: Aarhus Kajakklub, Karate for Voksne og Søndags-Gåklubben.", "a": "39742147c1c27849", "dur": 7.84}], "zh": "弗雷德里克、萨拉和卡斯珀都住在奥胡斯，三个人都很想多做运动。一天晚上，他们坐在咖啡馆里，在网上对比当地三家俱乐部：奥胡斯皮划艇俱乐部、成人空手道馆和周日健步走俱乐部。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "”Kajak er [[mest spændende]], fordi man kommer ud på vandet,” siger Sara.", "a": "cc74f73fbc55361b", "dur": 3.76}, {"id": "a4", "who": "narrator", "da": "”Men det er også [[dyrere]] **end** gåklubben, og udstyret koster ekstra.”", "a": "ced41371e68f9895", "dur": 4.2}], "zh": "“皮划艇最刺激，因为能出海划水，”萨拉说，“不过它也比健步走俱乐部更贵，而且装备还要额外花钱。”"}, {"segs": [{"id": "a5", "who": "narrator", "da": "Frederik kigger på karateklubben.", "a": "464bb51258f8a76d", "dur": 2.16}, {"id": "a6", "who": "narrator", "da": "”Karate er **bedst**, hvis man vil blive stærkere og lære selvforsvar,” mener han.", "a": "571365459e422edd", "dur": 4.6}, {"id": "a7", "who": "narrator", "da": "”Den ligger også [[tættere på]] vores gade, men træningen er nok [[sværere]] for en begynder.”", "a": "0b38b526924885ff", "dur": 4.2}], "zh": "弗雷德里克看着空手道馆的介绍。“如果想变得更强壮并学习防身术，空手道是最好的，”他认为，“而且这家离我们住的街更近，但对初学者来说训练可能更难一些。”"}, {"segs": [{"id": "a8", "who": "narrator", "da": "Kasper har været syg hele vinteren og har **mindre** energi end de andre.", "a": "496ea738545d0ed8", "dur": 4.0}, {"id": "a9", "who": "narrator", "da": "”Jeg har brug for noget, der er [[nemmere]] og [[billigere]],” griner han.", "a": "acc48092242984ae", "dur": 4.0}, {"id": "a10", "who": "narrator", "da": "”Gåklubben er faktisk [[billigst]] af dem alle, og der er **flere** medlemmer på min alder.", "a": "eb0fe653ae1034a8", "dur": 4.64}, {"id": "a11", "who": "narrator", "da": "For mig er en lang gåtur **bedre** end kampsport, selvom vejret nogle gange bliver **værre**!”", "a": "697ab95d97efc85c", "dur": 4.96}], "zh": "卡斯珀整个冬天都在生病，精力比另外两个人少。“我需要既更容易又更便宜的项目，”他笑着说，“健步走俱乐部其实是所有里面最便宜的，而且那里跟我同龄的会员更多。对我来说，长途散步比格斗运动更好，哪怕天气有时候会变得更糟！”"}, {"segs": [{"id": "a12", "who": "narrator", "da": "Til sidst vælger Kasper gåklubben, mens Sara og Frederik melder sig til kajak sammen.", "a": "84b1b1c0c39a0810", "dur": 4.92}], "zh": "最后卡斯珀选了健步走俱乐部，而萨拉和弗雷德里克一起报名参加了皮划艇。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Tre klubannoncer i Aarhus（对标 DU3 Modul 2 Læsning Opgave 1 & 4）", "scene": null, "paras": [{"cue": "俱乐部广告对比阅读（A–C）", "segs": [{"id": "b1", "who": "narrator", "da": "Aarhus Kajakklub｜Kom ud på vandet og få masser af frisk luft!", "say": "Aarhus Kajakklub. Kom ud på vandet og få masser af frisk luft!", "label": "A.", "a": "61801b0f0b6d10a4", "dur": 4.2}, {"id": "b2", "who": "narrator", "da": "Kajakroning styrker hele kroppen og er [[mere afstressende]] end indendørs fitness.", "a": "32740ed1064899e5", "dur": 5.04}, {"id": "b3", "who": "narrator", "da": "Vi har begynderhold hver tirsdag og torsdag kl. 17.30.", "a": "5dab5be8a98e4159", "dur": 3.36}, {"id": "b4", "who": "narrator", "da": "Du skal kunne svømme mindst 300 meter, og du skal være mindst 16 år.", "a": "f62178a79d263969", "dur": 3.6}, {"id": "b5", "who": "narrator", "da": "Pris: 280 kr. om måneden (inkl. lån af kajak og redningsvest).", "a": "bd207e9a31ad1b3b", "dur": 6.08}]}, {"segs": [{"id": "b6", "who": "narrator", "da": "Karate for Voksne｜Vil du blive stærkere, få **bedre** balance og lære effektivt selvforsvar?", "say": "Karate for Voksne. Vil du blive stærkere, få bedre balance og lære effektivt selvforsvar?", "label": "B.", "a": "792c79b6f12de04e", "dur": 7.08}, {"id": "b7", "who": "narrator", "da": "Så er karate den **bedste** sport for dig!", "a": "e47e41386f5eec1d", "dur": 2.6}, {"id": "b8", "who": "narrator", "da": "Vi træner i en moderne hal tæt på banegården mandag og onsdag aften.", "a": "50b7c5a7cb9164bd", "dur": 4.64}, {"id": "b9", "who": "narrator", "da": "Alle niveauer er velkomne, og vi har over 90 aktive medlemmer fra 18 til 60 år.", "a": "23f7ff286a501b89", "dur": 6.0}, {"id": "b10", "who": "narrator", "da": "Pris: 220 kr. om måneden.", "a": "4f55bff6984ddc2a", "dur": 3.08}, {"id": "b11", "who": "narrator", "da": "Første prøvetime er gratis.", "a": "06e4593e7a92a786", "dur": 2.04}]}, {"segs": [{"id": "b12", "who": "narrator", "da": "Søndags-Gåklubben｜Den [[nemmeste]] og [[billigste]] måde at komme i form på!", "say": "Søndags-Gåklubben. Den nemmeste og billigste måde at komme i form på!", "label": "C.", "a": "7cd067126e3d9c31", "dur": 4.32}, {"id": "b13", "who": "narrator", "da": "Vi mødes hver søndag kl. 10.00 i Marselisborg Skov og går 6–8 kilometer i et roligt tempo.", "a": "3c58a265c5737025", "dur": 6.16}, {"id": "b14", "who": "narrator", "da": "Ingen krav til alder eller erfaring, og mange af vores 140 medlemmer er **ældre** end 50 år, men unge er også meget velkomne!", "a": "4f9f8d9599a0f631", "dur": 8.24}, {"id": "b15", "who": "narrator", "da": "Pris: Kun 75 kr. om måneden inkl. varm kaffe efter turen.", "a": "393a9953c3097d02", "dur": 5.36}], "zh_all": "A. 奥胡斯皮划艇俱乐部：到水面上来呼吸新鲜空气吧！划皮划艇锻炼全身，比室内健身更解压。每周二、周四 17:30 设有初学者班。你必须至少能游 300 米且年满 16 岁。价格：每月 280 克朗（含租借皮划艇和救生衣）。\nB. 成人空手道：想变得更强壮、拥有更好的平衡感并学习实用防身术吗？那空手道就是最适合你的运动！每周一和周三晚上我们在火车站附近的现代化场馆训练。欢迎各水平学员，我们有超过 90 名 18 到 60 岁的活跃会员。价格：每月 220 克朗。第一节体验课免费。\nC. 周日健步走俱乐部：强身健体最简单也最便宜的方式！每周日上午 10:00 我们在马瑟里斯堡森林集合，以舒缓的速度走 6–8 公里。对年龄或经验没有要求，我们 140 名会员中有不少年龄超过 50 岁，不过也非常欢迎年轻人！价格：每月仅需 75 克朗，含走完后喝热咖啡。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "比……（如 billigere end）", "note": "连词 · 比较级连接词", "segs": [{"id": "g1", "who": "narrator", "da": "end", "say": "end.", "a": "417e9b3906aecb2f", "dur": 0.72}]}, {"zh": "比较，对比", "note": "动词 · sammenligner, sammenlignede, har -t", "segs": [{"id": "g2", "who": "narrator", "da": "at sammenligne", "say": "at sammenligne.", "a": "5dcb65b3b60b78e3", "dur": 1.48}]}, {"zh": "选择，挑选", "note": "动词 · vælger, valgte, har valgt", "segs": [{"id": "g3", "who": "narrator", "da": "at vælge", "say": "at vælge. vælger, valgte, har valgt.", "a": "01ca259caee9a254", "dur": 4.72}]}, {"zh": "增强，强化", "note": "动词 · styrker, styrkede, har styrket", "segs": [{"id": "g4", "who": "narrator", "da": "at styrke", "say": "at styrke. styrker, styrkede, har styrket.", "a": "3ee9fbe0c0834f60", "dur": 5.28}]}, {"zh": "自卫，保护自己", "note": "动词 · forsvarer, forsvarede, har forsvaret sig", "segs": [{"id": "g5", "who": "narrator", "da": "at forsvare sig", "say": "at forsvare sig. forsvarer, forsvarede, har forsvaret sig.", "a": "ccbdb57504ab77b3", "dur": 4.88}]}, {"zh": "报名参加", "note": "动词 · melder, meldte, har meldt sig til", "segs": [{"id": "g6", "who": "narrator", "da": "at melde sig til", "say": "at melde sig til. melder, meldte, har meldt sig til.", "a": "d328f01db2d1ea70", "dur": 5.16}]}, {"zh": "成为（会员）；变得", "note": "动词 · bliver, blev, er blevet", "segs": [{"id": "g7", "who": "narrator", "da": "at blive (medlem)", "say": "at blive (medlem). bliver, blev, er blevet.", "a": "a7d355eec74a7aa2", "dur": 4.64}]}, {"zh": "皮划艇", "note": "名词 · kajakken, kajakker, kajakkerne", "segs": [{"id": "g8", "who": "narrator", "da": "en kajak", "say": "en kajak. kajakken, kajakker, kajakkerne.", "a": "2cab659f764854b0", "dur": 4.88}]}, {"zh": "格斗/武术运动", "note": "名词 · kampsporten, kampsporter, -ne", "segs": [
