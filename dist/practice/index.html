<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCD 交互练习</title>
<style>
:root {
  --navy: #1B365D; --red: #C8102E; --teal: #006D77; --gold: #B45309; --gray: #475569;
  --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0; --text: #0F172A; --muted: #64748B;
  --ok-bg: #ECFDF5; --ok: #047857; --bad-bg: #FDF2F4; --bad: var(--red);
  --chip: #F0F4F8; --chip-border: #CBD5E1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --navy: #93B4E0; --red: #F87171; --teal: #5EC4CC; --gold: #FBBF24; --gray: #94A3B8;
    --bg: #0B1220; --surface: #121B2E; --border: #23304A; --text: #E2E8F0; --muted: #94A3B8;
    --ok-bg: #062A22; --ok: #34D399; --bad-bg: #2A0F16;
    --chip: #1A2540; --chip-border: #334366;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
header { border-left: 4px solid var(--red); padding: 4px 0 4px 14px; margin-bottom: 18px; }
header .eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
header h1 { margin: 2px 0 0; font-size: 24px; line-height: 1.3; color: var(--navy); }
header .zh { color: var(--muted); font-size: 15px; }
header .grammar { margin-top: 8px; font-size: 14px; color: var(--teal); }
.lesson-nav { display: flex; gap: 6px; align-items: center; margin: 0 0 14px; }
.lesson-nav select { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.lesson-nav button { flex: none; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; }
.lesson-nav button:disabled { opacity: .4; cursor: default; }

nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: thin; }
nav.tabs button {
  flex: none; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 6px 12px; border-radius: 999px;
}
nav.tabs button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: var(--bg); }
nav.tabs .score { font-size: 12px; opacity: .75; margin-left: 6px; font-variant-numeric: tabular-nums; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.panel h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.45; color: var(--navy); }
.instruction { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
.example { font-size: 14px; color: var(--muted); margin: 0 0 12px; font-style: italic; }
.counter { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-variant-numeric: tabular-nums; }

.prompt { font-size: 19px; line-height: 1.75; margin: 0 0 14px; overflow-wrap: anywhere; }
.prompt .da, .sent .da, .explain .da { font-style: italic; }
.prompt .wrong { text-decoration: underline wavy var(--red); text-underline-offset: 5px; font-style: italic; }
.prompt .zhq { font-size: 18px; }

.answer-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stem { font-style: italic; color: var(--navy); white-space: nowrap; }
input.answer, input.blank {
  font: inherit; color: var(--text); background: var(--bg);
  border: 1.5px solid var(--border); border-radius: 8px;
}
input.answer { flex: 1 1 260px; min-width: 0; font-size: 17px; padding: 9px 12px; }
input.blank { font-size: 17px; padding: 1px 8px; margin: 0 3px; max-width: 100%; font-style: italic; vertical-align: baseline; }
input.answer:focus, input.blank:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 20%, transparent); }
.is-ok { border-color: var(--ok) !important; }
.is-bad { border-color: var(--bad) !important; }

.kbd { display: flex; gap: 6px; margin-top: 8px; }
.kbd button { font: inherit; font-size: 15px; width: 36px; height: 32px; cursor: pointer; border: 1px solid var(--chip-border); background: var(--chip); color: var(--text); border-radius: 6px; }

.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 15px; cursor: pointer; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--bg); font-weight: 600; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { font: inherit; border: none; background: none; cursor: pointer; padding: 0 4px; font-size: 17px; color: var(--teal); vertical-align: -1px; }

.feedback { margin-top: 14px; border-radius: 8px; padding: 12px 14px; font-size: 15px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--ok-bg); border-left: 3px solid var(--ok); }
.feedback.bad { background: var(--bad-bg); border-left: 3px solid var(--bad); }
.feedback .title { font-weight: 600; margin-bottom: 4px; }
.feedback.ok .title { color: var(--ok); }
.feedback.bad .title { color: var(--bad); }
.feedback .row { margin-top: 4px; }
.feedback .label { color: var(--muted); font-size: 13px; margin-right: 6px; }
.feedback .sent { font-style: italic; }
.feedback .self { margin-top: 8px; font-size: 13px; padding: 4px 10px; }
.tok-bad { color: var(--bad); text-decoration: line-through; }
.tok-miss { color: var(--ok); font-weight: 600; background: color-mix(in srgb, var(--ok) 14%, transparent); border-radius: 3px; padding: 0 2px; }
.explain { margin-top: 6px; color: var(--text); font-size: 14px; }
.hint { margin-top: 10px; font-size: 14px; color: var(--gold); display: none; }
.hint.show { display: block; }

.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); border: none; padding: 0; cursor: pointer; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.dot.cur { outline: 2px solid var(--navy); outline-offset: 2px; }

/* order */
.build, .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; padding: 10px; border-radius: 10px; }
.build { border: 1.5px dashed var(--chip-border); margin-bottom: 10px; }
.build.is-ok { border-style: solid; }
.build.is-bad { border-style: solid; }
.pool { background: var(--bg); }
.chip { font: inherit; font-size: 16px; cursor: pointer; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--chip-border); background: var(--chip); color: var(--text); font-style: italic; }
.chip:hover:not(:disabled) { border-color: var(--teal); }
.chip:disabled { cursor: default; }
.build .chip { background: var(--surface); border-color: var(--teal); }
.placeholder { color: var(--muted); font-size: 14px; align-self: center; }

/* flashcards */
.fc-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; font-size: 14px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; border: none; background: var(--surface); color: var(--text); padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--bg); }
.flash {
  min-height: 210px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 24px 16px; cursor: pointer; user-select: none;
}
.flash .pos { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; margin-bottom: 10px; }
.flash .front { font-size: 26px; font-weight: 600; color: var(--navy); }
.flash .front.zh { font-size: 21px; font-weight: 500; color: var(--text); }
.flash .back { margin-top: 12px; display: none; }
.flash.flipped .back { display: block; }
.flash .back .forms { font-style: italic; color: var(--teal); }
.flash .back .meaning { font-size: 17px; margin-top: 2px; }
.flash .back .word { font-size: 20px; font-weight: 600; color: var(--navy); }
.flash .tap { margin-top: 14px; font-size: 13px; color: var(--muted); }
.flash.flipped .tap { display: none; }
.done { text-align: center; padding: 30px 10px; }
.done .big { font-size: 40px; }

footer { margin-top: 22px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
footer button { font: inherit; font-size: 13px; background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
.tts-warn { font-size: 13px; color: var(--gold); margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lesson-nav" id="lessonNav"></div>
  <header id="hdr"></header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="panel" id="panel"></main>
  <footer>
    <span>进度只保存在本机浏览器中。快捷键：Enter 检查 / 下一题</span>
    <button id="reset" type="button">重置本课进度</button>
  </footer>
</div>

  const el = document.createElement(tag);

    if (v == null || v === false) continue;

    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);

  const a = arr.slice();

  const out = [];

function lcs(a, b) {
  const n = a.length, m = b.length, dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const inA = new Set(), inB = new Set();
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { inA.add(i); inB.add(j); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { len: dp[0][0], inA, inB };
}
function grade(input, accepts) {
  for (const a of accepts) if (norm(input) === norm(a)) return { ok: true, match: a };
  for (const a of accepts) if (norm(input, false) === norm(a, false)) return { ok: true, match: a, commaNote: true };
  const words = input.trim().split(/\s+/).map(tokKey);
  let best = accepts[0], bestLen = -1;
  for (const a of accepts) {
    const l = lcs(words, a.split(/\s+/).map(tokKey)).len;
    if (l > bestLen) { bestLen = l; best = a; }
  }
  return { ok: false, match: best };
}
function blankOk(input, alts) {
  const v = norm(input, false).replace(/[.?!,;:]+$/, '');
  if (alts.some(a => NOTHING.includes(a)) && (v === '' || NOTHING.includes(v))) return true;
  return alts.some(a => norm(a, false).replace(/[.?!,;:]+$/, '') === v);
}
function diffView(input, answer) {
  const uw = input.trim().split(/\s+/).filter(Boolean), aw = answer.split(/\s+/);
  const { inA, inB } = lcs(uw.map(tokKey), aw.map(tokKey));
  const mine = h('span', { class: 'sent' }), ref = h('span', { class: 'sent' });
  uw.forEach((w, i) => mine.append(i ? ' ' : '', inA.has(i) ? w : h('span', { class: 'tok-bad' }, w)));
  aw.forEach((w, i) => ref.append(i ? ' ' : '', inB.has(i) ? w : h('span', { class: 'tok-miss' }, w)));
  return { mine, ref };
}

/* ---------- speech ---------- */
let daVoice = null;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  daVoice = speechSynthesis.getVoices().find(v => /^da(-|_|$)/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(unmark(text));
  u.lang = 'da-DK'; u.rate = 0.9;
  if (daVoice) u.voice = daVoice;
  speechSynthesis.speak(u);
}
const speakBtn = (text) => h('button', { class: 'icon-btn', type: 'button', title: '朗读', 'aria-label': '朗读',
  onclick: (e) => { e.stopPropagation(); speak(text); } }, '🔊');

/* ---------- Danish letters helper ---------- */
let lastInput = null;
document.addEventListener('focusin', (e) => { if (e.target.matches('input.answer, input.blank')) lastInput = e.target; });
function letterKeys() {
  const insert = (ch) => {
    const input = lastInput && document.body.contains(lastInput) ? lastInput : $('#panel input.answer, #panel input.blank');
    if (!input) return;
    const a = input.selectionStart ?? input.value.length, b = input.selectionEnd ?? a;
    input.setRangeText(ch, a, b, 'end'); input.focus(); input.dispatchEvent(new Event('input'));
  };
  return h('div', { class: 'kbd' }, ['æ', 'ø', 'å'].map(c => h('button', { type: 'button', tabindex: '-1', 'aria-label': `插入 ${c}`,
    onmousedown: (e) => e.preventDefault(), onclick: () => insert(c) }, c)));
}

/* ---------- state ---------- */
const state = { lesson: null, sid: null, idx: {} };
function section() { return state.lesson.sections.find(s => s.id === state.sid); }
function sectionScore(s) {
  const p = prog(s.id);
  if (s.type === 'flashcards') return `${Object.keys(p.known || {}).length}/${s.cards.length}`;
  return `${Object.values(p.res || {}).filter(Boolean).length}/${s.items.length}`;
}

/* ---------- layout ---------- */
function renderLessonNav() {
  const i = LESSONS.indexOf(state.lesson);
  const select = h('select', { 'aria-label': '选择课程', onchange: (e) => openLesson(e.target.value) },
    Object.keys(BOOK_NAMES).filter(b => LESSONS.some(l => l.book === b)).map(b =>
      h('optgroup', { label: BOOK_NAMES[b] }, LESSONS.filter(l => l.book === b).map(l =>
        h('option', { value: l.key, selected: l === state.lesson }, `L${String(l.lesson).padStart(2, '0')} ${l.title_da}`)))));
  $('#lessonNav').replaceChildren(
    h('button', { type: 'button', 'aria-label': '上一课', disabled: i <= 0, onclick: () => openLesson(LESSONS[i - 1].key) }, '‹'),
    select,
    h('button', { type: 'button', 'aria-label': '下一课', disabled: i >= LESSONS.length - 1, onclick: () => openLesson(LESSONS[i + 1].key) }, '›'),
  );
}
function renderHeader() {
  const L = state.lesson;
  $('#hdr').replaceChildren(...present(
    h('div', { class: 'eyebrow' }, `${BOOK_NAMES[L.book] || L.book.toUpperCase()} · Lektion ${L.lesson}`),
    h('h1', {}, L.title_da),
    L.title_zh ? h('div', { class: 'zh' }, L.title_zh) : null,
    L.grammar ? h('div', { class: 'grammar' }, '本课语法：' + unmark(L.grammar)) : null,
  ));
  document.title = `L${L.lesson} ${L.title_da} · NCD 交互练习`;
}
function tabLabel(s) { return s.title.split('：')[0].replace(/（.*$/, ''); }
function renderTabs() {
  $('#tabs').replaceChildren(...state.lesson.sections.map(s =>
    h('button', { role: 'tab', type: 'button', 'aria-selected': String(s.id === state.sid), onclick: () => openSection(s.id) },
      tabLabel(s), h('span', { class: 'score' }, sectionScore(s)))));
}
function openLesson(key) {
  state.lesson = LESSONS.find(l => l.key === key) || LESSONS[0];
  state.idx = {};
  renderLessonNav();
  renderHeader();
  openSection(state.lesson.sections[0].id);
  window.scrollTo(0, 0);
}
function openSection(sid) {
  state.sid = sid;
  if (state.idx[sid] == null) state.idx[sid] = 0;
  try { localStorage.setItem(STORE_KEY + ':last', `${state.lesson.key}/${sid}`); } catch (e) {}
  renderTabs();
  renderPanel();
}
function renderPanel() {
  const s = section();
  const panel = $('#panel');
  panel.replaceChildren(...present(
    h('h2', {}, ...rich(s.title)),
    s.instruction ? h('p', { class: 'instruction' }, s.instruction) : null,
    s.example ? h('p', { class: 'example' }, '例：' + unmark(s.example)) : null,
    s.open ? h('p', { class: 'instruction' }, '本组为开放式改写，参考答案不是唯一答案：意思和语法正确即可点“我的答案也对”。') : null,
  ));
  if (s.type === 'flashcards') return renderFlashcards(s, panel);
  if (s.type === 'order') return renderOrder(s, panel);
  const it = s.items[state.idx[s.id]];
  if (s.type === 'drill' && it.kind === 'cloze') return renderCloze(s, panel);
  return renderTyped(s, panel);
}
function pager(s, panel) {
  const p = prog(s.id).res || {}, n = s.items.length, i = state.idx[s.id];
  const go = (j) => { state.idx[s.id] = Math.max(0, Math.min(n - 1, j)); renderPanel(); };
  panel.append(h('div', { class: 'pager' },
    h('button', { class: 'btn ghost', type: 'button', disabled: i === 0, onclick: () => go(i - 1) }, '← 上一题'),
    h('div', { class: 'dots' }, s.items.map((_, j) =>
      h('button', { type: 'button', 'aria-label': `第 ${j + 1} 题`,
        class: 'dot' + (p[j] === true ? ' ok' : p[j] === false ? ' bad' : '') + (j === i ? ' cur' : ''),
        onclick: () => go(j) }))),
    h('button', { class: 'btn ghost', type: 'button', disabled: i === n - 1, onclick: () => go(i + 1) }, '下一题 →'),
  ));
}
function record(s, i, ok) {
  const p = prog(s.id);
  p.res = p.res || {};
  p.res[i] = ok;
  save();
  renderTabs();
  const dot = document.querySelectorAll('#panel .dot')[i];
  if (dot) { dot.classList.remove('ok', 'bad'); dot.classList.add(ok ? 'ok' : 'bad'); }
}
function next(s) {
  if (state.idx[s.id] < s.items.length - 1) { state.idx[s.id]++; renderPanel(); }
}
const counter = (s) => h('div', { class: 'counter' }, `第 ${state.idx[s.id] + 1} / ${s.items.length} 题`);
const isLast = (s) => state.idx[s.id] === s.items.length - 1;

/* ---------- typed answers: transform / correct / translate / drill-write ---------- */
function typedConfig(s, it) {
  if (s.type === 'transform') return {
    prompt: h('p', { class: 'prompt' }, h('span', { class: 'da' }, it.source), speakBtn(it.source)),
    stem: it.stem, accept: it.accept, hint: it.hint,
  };
  if (s.type === 'correct') return {
    prompt: h('p', { class: 'prompt' }, h('span', { class: 'wrong' }, it.wrong)),
    accept: it.accept, prefill: it.wrong, explain: it.explain,
  };
  if (s.type === 'translate') return {
    prompt: h('p', { class: 'prompt' }, h('span', { class: 'zhq' }, it.zh)),
    accept: it.accept, selfJudge: true,
  };
  return { // drill / write
    prompt: h('p', { class: 'prompt' }, ...rich(it.prompt)),
    accept: it.accept, prefill: it.prefill, explain: it.explain, selfJudge: true,
  };
}
function renderTyped(s, panel) {
  const i = state.idx[s.id], it = s.items[i], cfg = typedConfig(s, it);
  const stem = cfg.stem || null;
  // with a stem, accept either the clause alone or the whole sentence
  const accepts = stem ? cfg.accept.concat(cfg.accept.map(a => `${stem} ${a}`)) : cfg.accept;
  const withStem = (a) => (stem && !norm(a, false).startsWith(norm(stem, false)) ? `${stem} ${a}` : a);

  const input = h('input', { class: 'answer', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', lang: 'da',
    'aria-label': '你的答案', placeholder: stem ? '接着写从句…' : '输入丹麦语…' });
  if (cfg.prefill) input.value = unmark(cfg.prefill);
  const fb = h('div', { class: 'feedback', role: 'status' });
  const hint = cfg.hint ? h('div', { class: 'hint' }, '💡 ' + cfg.hint) : null;
  let checked = false;

  function show(res, gaveUp) {
    checked = true;
    const answer = withStem(res.match);
    input.classList.toggle('is-ok', res.ok); input.classList.toggle('is-bad', !res.ok);
    fb.className = 'feedback show ' + (res.ok ? 'ok' : 'bad');
    const title = res.ok ? (res.self ? '✓ 已记为正确' : res.commaNote ? '✓ 正确（只差逗号）' : '✓ 正确！')
      : (gaveUp ? '参考答案' : (s.open ? '与参考答案不同' : '✗ 还不对'));
    const rows = [h('div', { class: 'title' }, title)];
    if (!res.ok && !gaveUp) {
      const d = diffView(withStem(input.value), answer);
      rows.push(h('div', { class: 'row' }, h('span', { class: 'label' }, '你的答案'), d.mine));
      rows.push(h('div', { class: 'row' }, h('span', { class: 'label' }, '参考答案'), d.ref, speakBtn(answer)));
    } else {
      rows.push(h('div', { class: 'row' }, h('span', { class: 'sent' }, answer), speakBtn(answer)));
    }
    const others = cfg.accept.filter(a => withStem(a) !== answer);
    if (others.length) rows.push(h('div', { class: 'row' }, h('span', { class: 'label' }, '也可以'), h('span', { class: 'sent' }, others.map(withStem).join(' / '))));
    if (cfg.explain) rows.push(h('div', { class: 'explain' }, '📌 ', ...rich(cfg.explain)));
    if (cfg.hint && !res.ok) rows.push(h('div', { class: 'explain' }, '💡 ' + cfg.hint));
    if (!res.ok && !gaveUp && cfg.selfJudge) {
      rows.push(h('button', { class: 'btn self', type: 'button', onclick: () => { record(s, i, true); show({ ...res, ok: true, self: true }, false); } },
        '我的答案也对 ✓'));
    }
    fb.replaceChildren(...rows);
    checkBtn.textContent = isLast(s) ? '本节完成' : '下一题 →';
    checkBtn.disabled = isLast(s);
  }
  function check() {
    if (checked) return next(s);
    if (!input.value.trim()) { input.focus(); return; }
    const res = grade(input.value, accepts);
    record(s, i, res.ok);
    show(res, false);
  }
  const checkBtn = h('button', { class: 'btn primary', type: 'button', onclick: check }, '检查');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
  input.addEventListener('input', () => {
    if (!checked) return;
    checked = false; checkBtn.textContent = '检查'; checkBtn.disabled = false;
    input.classList.remove('is-ok', 'is-bad'); fb.className = 'feedback';
  });

  panel.append(...present(
    counter(s),
    cfg.prompt,
    h('div', { class: 'answer-row' }, stem ? h('span', { class: 'stem' }, stem) : null, input),
    letterKeys(),
    hint,
    h('div', { class: 'actions' },
      checkBtn,
      hint ? h('button', { class: 'btn', type: 'button', onclick: () => hint.classList.add('show') }, '提示') : null,
      h('button', { class: 'btn ghost', type: 'button', onclick: () => {
        if (!checked) record(s, i, false);
        show({ ok: false, match: cfg.accept[0] }, true);
      } }, '看答案'),
    ),
    fb,
  ));
  pager(s, panel);
  input.focus();
  if (cfg.prefill) input.setSelectionRange(input.value.length, input.value.length);
}

/* ---------- cloze: inline blanks ---------- */
function renderCloze(s, panel) {
  const i = state.idx[s.id], it = s.items[i];
  const inputs = [];
  const prompt = h('p', { class: 'prompt' }, ...rich(it.prompt, (k) => {
    const longest = Math.max(...it.blanks[k].map(a => a.length), 3);
    const inp = h('input', { class: 'blank', type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', lang: 'da',
      'aria-label': `第 ${k + 1} 空`, style: `width:${Math.min(longest + 3, 40)}ch` });
    inputs.push(inp);
    return inp;
  }));
  const fb = h('div', { class: 'feedback', role: 'status' });
  let checked = false;
  const fullAnswer = () => unmark(it.prompt.split(BLANK).reduce((acc, part, k) =>
    acc + part + (k < it.blanks.length ? (NOTHING.includes(it.blanks[k][0]) ? '' : it.blanks[k][0]) : ''), '')).replace(/\s+/g, ' ');

  function show(results, gaveUp) {
    checked = true;
    const ok = !gaveUp && results.every(Boolean);
    inputs.forEach((inp, k) => { inp.classList.toggle('is-ok', !gaveUp && results[k]); inp.classList.toggle('is-bad', gaveUp || !results[k]); });
    fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');
    const ref = h('span', { class: 'sent' }, ...rich(it.prompt, (k) =>
      h('span', { class: 'tok-miss' }, NOTHING.includes(it.blanks[k][0]) ? '（不填）' : it.blanks[k][0])));
    const rows = [
      h('div', { class: 'title' }, ok ? '✓ 全部正确！' : gaveUp ? '参考答案' : `✗ ${results.filter(r => !r).length} 处不对`),
      h('div', { class: 'row' }, ref, speakBtn(fullAnswer())),
    ];
    const alts = it.blanks.map((b, k) => b.length > 1 && !NOTHING.includes(b[0]) ? `第 ${k + 1} 空：${b.join(' / ')}` : null).filter(Boolean);
    if (alts.length) rows.push(h('div', { class: 'row' }, h('span', { class: 'label' }, '可接受'), alts.join('；')));
    if (it.explain) rows.push(h('div', { class: 'explain' }, '📌 ', ...rich(it.explain)));
    fb.replaceChildren(...rows);
    checkBtn.textContent = isLast(s) ? '本节完成' : '下一题 →';
    checkBtn.disabled = isLast(s);
  }
  function check() {
    if (checked) return next(s);
    const empty = inputs.find(inp => !inp.value.trim() && !it.blanks[inputs.indexOf(inp)].some(a => NOTHING.includes(a)));
    if (empty) { empty.focus(); return; }
    const results = inputs.map((inp, k) => blankOk(inp.value, it.blanks[k]));
    record(s, i, results.every(Boolean));
    show(results, false);
  }
  const checkBtn = h('button', { class: 'btn primary', type: 'button', onclick: check }, '检查');
  inputs.forEach((inp, k) => {
    inp.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!checked && k < inputs.length - 1 && !inputs[k + 1].value) inputs[k + 1].focus(); else check();
    });
    inp.addEventListener('input', () => {
      if (!checked) return;
      checked = false; checkBtn.textContent = '检查'; checkBtn.disabled = false;
      inputs.forEach(x => x.classList.remove('is-ok', 'is-bad')); fb.className = 'feedback';
    });
  });

  panel.append(
    counter(s), prompt, letterKeys(),
    h('div', { class: 'actions' }, checkBtn,
      h('button', { class: 'btn ghost', type: 'button', onclick: () => {
        if (!checked) record(s, i, false);
        show(inputs.map(() => false), true);
      } }, '看答案')),
    fb,
  );
  pager(s, panel);
  if (inputs[0]) inputs[0].focus();
}

/* ---------- order (tap words into place) ---------- */
function renderOrder(s, panel) {
  const i = state.idx[s.id], it = s.items[i];
  const words = it.answer.split(/\s+/);
  let pool = shuffle(words.map((w, k) => ({ w, k })));
  if (words.length > 1 && pool.every((t, k) => t.k === k)) pool.push(pool.shift());
  let built = [], done = false;
  const buildEl = h('div', { class: 'build', 'aria-label': '你的句子' });
  const poolEl = h('div', { class: 'pool', 'aria-label': '可选词块' });
  const fb = h('div', { class: 'feedback', role: 'status' });

  function draw() {
    buildEl.replaceChildren(...(built.length
      ? built.map((t, k) => h('button', { class: 'chip', type: 'button', disabled: done,
          onclick: () => { built.splice(k, 1); pool.push(t); draw(); } }, t.w))
      : [h('span', { class: 'placeholder' }, '点击下方词块组成句子')]));
    poolEl.replaceChildren(...pool.map((t, k) => h('button', { class: 'chip', type: 'button', disabled: done,
      onclick: () => { pool.splice(k, 1); built.push(t); draw(); if (!pool.length) check(); } }, t.w)));
  }
  function check() {
    const sentence = built.map(t => t.w).join(' ');
    const ok = norm(sentence) === norm(it.answer);
    done = true;
    record(s, i, ok);
    buildEl.classList.add(ok ? 'is-ok' : 'is-bad');
    fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');
    const ref = ok ? h('span', { class: 'sent' }, it.answer) : diffView(sentence, it.answer).ref;
    fb.replaceChildren(
      h('div', { class: 'title' }, ok ? '✓ 语序正确！' : '✗ 语序不对'),
      h('div', { class: 'row' }, ...present(ok ? null : h('span', { class: 'label' }, '参考答案'), ref, speakBtn(it.answer))),
    );
    actions.replaceChildren(...present(
      ok ? null : h('button', { class: 'btn', type: 'button', onclick: renderPanel }, '重来一次'),
      !isLast(s) ? h('button', { class: 'btn primary', type: 'button', onclick: () => next(s) }, '下一题 →') : null,
    ));
    draw();
  }
  const actions = h('div', { class: 'actions' },
    h('button', { class: 'btn', type: 'button', onclick: () => { pool = pool.concat(built); built = []; draw(); } }, '清空'));
  panel.append(counter(s), h('p', { class: 'prompt' }, h('span', { class: 'zhq' }, unmark(it.zh))), buildEl, poolEl, actions, fb);
  draw();
  pager(s, panel);
}

/* ---------- flashcards ---------- */
const fcState = {};
function renderFlashcards(s, panel) {
  const p = prog(s.id);
  p.known = p.known || {};
  const key = state.lesson.key + '/' + s.id;
  const unknown = () => shuffle(s.cards.map((_, k) => k).filter(k => !p.known[k]));
  const st = fcState[key] = fcState[key] || { dir: 'da', queue: unknown(), flipped: false };
  const knownN = Object.keys(p.known).length;
  const restart = (all) => {
    if (all) { p.known = {}; save(); renderTabs(); }
    st.queue = unknown(); st.flipped = false; renderPanel();
  };
  const seg = h('div', { class: 'seg', role: 'group', 'aria-label': '方向' },
    [['da', '丹 → 中'], ['zh', '中 → 丹']].map(([v, label]) =>
      h('button', { type: 'button', 'aria-pressed': String(st.dir === v), onclick: () => { st.dir = v; st.flipped = false; renderPanel(); } }, label)));
  panel.append(h('div', { class: 'fc-bar' }, h('span', {}, `已掌握 ${knownN} / ${s.cards.length} · 本轮剩余 ${st.queue.length}`), seg));

  if (!st.queue.length) {
    panel.append(h('div', { class: 'done' },
      h('div', { class: 'big' }, '🎉'),
      h('p', {}, knownN === s.cards.length ? '本课生词全部掌握！' : '本轮已完成。'),
      h('div', { class: 'actions', style: 'justify-content:center' }, ...present(
        knownN < s.cards.length ? h('button', { class: 'btn primary', type: 'button', onclick: () => restart(false) }, '继续复习未掌握的') : null,
        h('button', { class: 'btn', type: 'button', onclick: () => restart(true) }, '全部重新开始')))));
    return;
  }
  const k = st.queue[0], c = s.cards[k];
  const flip = () => { st.flipped = !st.flipped; card.classList.toggle('flipped', st.flipped); };
  const front = st.dir === 'da'
    ? h('div', { class: 'front' }, c.da, speakBtn(c.da))
    : h('div', { class: 'front zh' }, c.zh);
  const back = st.dir === 'da'
    ? h('div', { class: 'back' }, c.forms ? h('div', { class: 'forms' }, c.forms) : null, h('div', { class: 'meaning' }, c.zh))
    : h('div', { class: 'back' }, h('div', { class: 'word' }, c.da, speakBtn(c.da)), c.forms ? h('div', { class: 'forms' }, c.forms) : null);
  const card = h('div', { class: 'flash' + (st.flipped ? ' flipped' : ''), role: 'button', tabindex: '0', 'aria-label': '翻转卡片',
    onclick: flip, onkeydown: (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } } },
    c.pos ? h('div', { class: 'pos' }, c.pos) : null, front, back, h('div', { class: 'tap' }, '点击卡片翻面'));
  const answer = (knew) => {
    st.queue.shift();
    if (knew) { p.known[k] = true; save(); renderTabs(); } else st.queue.push(k);
    st.flipped = false; renderPanel();
  };
  panel.append(card, h('div', { class: 'actions', style: 'justify-content:center' },
    h('button', { class: 'btn', type: 'button', onclick: () => answer(false) }, '还不熟'),
    h('button', { class: 'btn primary', type: 'button', onclick: () => answer(true) }, '记住了 ✓')));
  if ('speechSynthesis' in window && !daVoice && speechSynthesis.getVoices().length) {
    panel.append(h('p', { class: 'tts-warn' }, '未检测到丹麦语语音，朗读可能用错口音。Windows 可在“设置 → 时间和语言 → 语音”中添加 Dansk。'));
  }
}

/* ---------- boot ---------- */
$('#reset').addEventListener('click', () => {
  delete store[state.lesson.key]; save();
  for (const key of Object.keys(fcState)) if (key.startsWith(state.lesson.key + '/')) delete fcState[key];
  state.idx = {};
  openSection(state.sid);
});
if (!LESSONS.length) {
  $('#panel').textContent = '没有题库数据，请先运行 python interactive/build.py';
} else {
  let last = '';
  try { last = localStorage.getItem(STORE_KEY + ':last') || ''; } catch (e) {}
  const [lk, sid] = last.split('/');
  state.lesson = LESSONS.find(l => l.key === lk) || LESSONS[0];
  renderLessonNav();
  renderHeader();
  openSection(state.lesson.sections.some(s => s.id === sid) ? sid : state.lesson.sections[0].id);
}
</script>
</body>
</html>
