ceb", "dur": 2.8}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "连词", "da": "end", "zh": "比……（如 billigere end）", "forms": "比较级连接词"}, {"pos": "动词", "da": "at sammenligne", "zh": "比较，对比", "forms": "sammenligner, sammenlignede, har -t"}, {"pos": "动词", "da": "at vælge", "zh": "选择，挑选", "forms": "vælger, valgte, har valgt"}, {"pos": "动词", "da": "at styrke", "zh": "增强，强化", "forms": "styrker, styrkede, har styrket"}, {"pos": "动词", "da": "at forsvare sig", "zh": "自卫，保护自己", "forms": "forsvarer, forsvarede, har forsvaret sig"}, {"pos": "动词", "da": "at melde sig til", "zh": "报名参加", "forms": "melder, meldte, har meldt sig til"}, {"pos": "动词 [er]", "da": "at blive (medlem)", "zh": "成为（会员）；变得", "forms": "bliver, blev, er blevet"}, {"pos": "名词", "da": "en kajak", "zh": "皮划艇", "forms": "kajakken, kajakker, kajakkerne"}, {"pos": "名词", "da": "en kampsport", "zh": "格斗/武术运动", "forms": "kampsporten, kampsporter, -ne"}, {"pos": "名词", "da": "et selvforsvar", "zh": "防身术，自卫", "forms": "selvforsvaret, ingen flertal"}, {"pos": "名词", "da": "en begynder", "zh": "初学者，新手", "forms": "begynderen, begyndere, begynderne"}, {"pos": "名词", "da": "et medlem", "zh": "会员，成员（注意复数双写 m！）", "forms": "medlemmet, medlemmer, -ne"}, {"pos": "名词", "da": "et medlemskab", "zh": "会员资格，会籍", "forms": "medlemskabet, medlemskaber, -ne"}, {"pos": "名词", "da": "en afstand", "zh": "距离（d 不发音）", "forms": "afstanden, afstande, afstandene"}, {"pos": "名词", "da": "et udstyr / et fællesskab", "zh": "装备，器材（不可数）/ 集体，社群", "forms": "udstyret, kun ental) / (-skabet, -er"}, {"pos": "形容词", "da": "billig / svær / nem", "zh": "便宜的 / 困难的 / 容易的", "forms": "-t, -e) / (-t, -e) / (nemt, nemme"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "健步走俱乐部比皮划艇俱乐部便宜得多。（用 meget billigere end）", "answer": "Gåklubben er meget billigere end kajakklubben."}, {"zh": "哪家俱乐部拥有最多的会员，哪家最便宜？（用 flest 和 billigst）", "answer": "Hvilken klub har flest medlemmer, og hvilken er billigst?"}, {"zh": "我想参加空手道，因为我想拥有更好的平衡感和更多精力。（用 bedre 和 mere）", "answer": "Jeg vil gerne gå til karate, fordi jeg gerne vil have bedre balance og mere energi."}, {"zh": "对我来说，划皮划艇比室内训练更让人兴奋。", "answer": "For mig er kajakroning mere spændende end indendørs træning."}, {"zh": "这位老师比我哥哥年纪大，但他是俱乐部里最好的教练。", "answer": "Denne lærer er ældre end min bror, men han er den bedste træner i klubben."}]}, {"id": "A", "type": "drill", "title": "练习 A：写出括号内形容词或副词的正确比较级或最高级形式", "items": [{"prompt": "Gåklubben er meget {{_}} (⟦billig⟧) end kajakklubben.", "kind": "cloze", "blanks": [["billigere"]], "explain": "比较词 ⟦end⟧ 前用比较级"}, {"prompt": "Hvilken sport synes du er {{_}} (⟦god⟧) for en begynder?", "kind": "cloze", "blanks": [["bedst"]], "explain": "“哪项最好”，最高级"}, {"prompt": "Kajakroning er {{_}} (⟦spændende⟧) end at løbe på et løbebånd.", "kind": "cloze", "blanks": [["mere spændende"]], "explain": "分词形容词用 ⟦mere⟧"}, {"prompt": "I år har vores klub fået {{_}} (⟦mange⟧) nye medlemmer end sidste år.", "kind": "cloze", "blanks": [["flere"]], "explain": "⟦medlemmer⟧ 可数复数 → ⟦flere⟧"}, {"prompt": "Den {{_}} (⟦billig⟧) løsning er altid at gå en tur i skoven! (注意定指形式！)", "kind": "cloze", "blanks": [["billigste"]], "explain": "定冠词 ⟦Den⟧ 后最高级加 ⟦-e⟧"}, {"prompt": "Min bror er fem år {{_}} (⟦gammel⟧) end mig, men jeg har {{_}} (⟦meget⟧) fritid.", "kind": "cloze", "blanks": [["ældre"], ["mere"]], "explain": "年龄“更大”用 ⟦ældre⟧；⟦fritid⟧ 不可数用 ⟦mere⟧"}, {"prompt": "I dag var vejret dårligt, men i morgen bliver det desværre endnu {{_}} (⟦dårlig⟧).", "kind": "cloze", "blanks": [["værre"]], "explain": "更糟"}]}, {"id": "B", "type": "drill", "title": "练习 B：对比句改写与 flere / mere / mindre 专练", "items": [{"prompt": "用比较级 ⟦end⟧ 合并两句：⟦Kajak koster 280 kr. Karate koster 220 kr.⟧ → ⟦Kajak er...⟧", "kind": "write", "accept": ["Kajak er dyrere end karate."]}, {"prompt": "选词填空（⟦flere⟧ vs ⟦mere⟧）：⟦Jeg har brug for⟧ {{_}} ⟦energi og⟧ {{_}} ⟦venner i min hverdag.⟧", "kind": "cloze", "blanks": [["mere"], ["flere"]], "explain": "不可数 ⟦mere⟧；可数复数 ⟦flere⟧"}, {"prompt": "用最高级定指形式填空：⟦Aarhus Kajakklub er den⟧ {{_}} (⟦populær⟧) ⟦klub i byen.⟧", "kind": "cloze", "blanks": [["mest populære"]], "explain": "定冠词 ⟦den⟧ 后加 ⟦-e⟧"}, {"prompt": "用 ⟦mindre⟧ 或 ⟦mindst⟧ 填空：⟦Du skal være⟧ {{_}} ⟦16 år, og kurset koster⟧ {{_}} ⟦end 300 kroner.⟧", "kind": "cloze", "blanks": [["mindst"], ["mindre"]]}, {"prompt": "改错：⟦Min nye lejlighed er mere stor end den gamle, men køkkenet er lillere.⟧ →", "kind": "write", "accept": ["Min nye lejlighed er større end den gamle, men køkkenet er mindre."], "explain": "注意 ⟦stor → større → størst⟧；⟦lille → mindre → mindst⟧！"}, {"prompt": "用 ⟦bedst⟧ 改写：⟦Jeg kan godt lide gåklubben og karate, men jeg kan endnu bedre lide kajak.⟧ → ⟦Jeg kan⟧ {{_}} ⟦lide kajak.⟧", "kind": "cloze", "blanks": [["bedst"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "健步走俱乐部比皮划艇俱乐部便宜得多。（用 ⟦meget billigere end⟧）", "kind": "write", "accept": ["Gåklubben er meget billigere end kajakklubben."]}, {"prompt": "哪家俱乐部拥有最多的会员，哪家最便宜？（用 ⟦flest⟧ 和 ⟦billigst⟧）", "kind": "write", "accept": ["Hvilken klub har flest medlemmer, og hvilken er billigst?"]}, {"prompt": "我想参加空手道，因为我想拥有更好的平衡感和更多精力。（用 ⟦bedre⟧ 和 ⟦mere⟧）", "kind": "write", "accept": ["Jeg vil gerne gå til karate, fordi jeg gerne vil have bedre balance og mere energi."]}, {"prompt": "对我来说，划皮划艇比室内训练更让人兴奋。", "kind": "write", "accept": ["For mig er kajakroning mere spændende end indendørs træning."]}, {"prompt": "这位老师比我哥哥年纪大，但他是俱乐部里最好的教练。", "kind": "write", "accept": ["Denne lærer er ældre end min bror, men han er den bedste træner i klubben."]}]}], "clips": {"frederik sara og kasper bor i aarhus og de vil alle tre gerne dyrke mere motion": "6839742f2cf9c534", "en aften sidder de på en café og sammenligner tre lokale klubber på nettet aarhus kajakklub karate for voksne og søndags-gåklubben": "39742147c1c27849", "kajak er mest spændende fordi man kommer ud på vandet siger sara": "cc74f73fbc55361b", "men det er også dyrere end gåklubben og udstyret koster ekstra": "ced41371e68f9895", "frederik kigger på karateklubben": "464bb51258f8a76d", "karate er bedst hvis man vil blive stærkere og lære selvforsvar mener han": "571365459e422edd", "den ligger også tættere på vores gade men træningen er nok sværere for en begynder": "0b38b526924885ff", "kasper har været syg hele vinteren og har mindre energi end de andre": "496ea738545d0ed8", "jeg har brug for noget der er nemmere og billigere griner han": "acc48092242984ae", "gåklubben er faktisk billigst af dem alle og der er flere medlemmer på min alder": "eb0fe653ae1034a8", "for mig er en lang gåtur bedre end kampsport selvom vejret nogle gange bliver værre": "697ab95d97efc85c", "til sidst vælger kasper gåklubben mens sara og frederik melder sig til kajak sammen": "84b1b1c0c39a0810", "aarhus kajakklub｜kom ud på vandet og få masser af frisk luft": "61801b0f0b6d10a4", "kajakroning styrker hele kroppen og er mere afstressende end indendørs fitness": "32740ed1064899e5", "vi har begynderhold hver tirsdag og torsdag kl 1730": "5dab5be8a98e4159", "du skal kunne svømme mindst 300 meter og du skal være mindst 16 år": "f62178a79d263969", "pris 280 kr om måneden (inkl lån af kajak og redningsvest)": "bd207e9a31ad1b3b", "karate for voksne｜vil du blive stærkere få bedre balance og lære effektivt selvforsvar": "792c79b6f12de04e", "så er karate den bedste sport for dig": "e47e41386f5eec1d", "vi træner i en moderne hal tæt på banegården mandag og onsdag aften": "50b7c5a7cb9164bd", "alle niveauer er velkomne og vi har over 90 aktive medlemmer fra 18 til 60 år": "23f7ff286a501b89", "pris 220 kr om måneden": "4f55bff6984ddc2a", "første prøvetime er gratis": "06e4593e7a92a786", "søndags-gåklubben｜den nemmeste og billigste måde at komme i form på": "7cd067126e3d9c31", "vi mødes hver søndag kl 1000 i marselisborg skov og går 6–8 kilometer i et roligt tempo": "3c58a265c5737025", "ingen krav til alder eller erfaring og mange af vores 140 medlemmer er ældre end 50 år men unge er også meget velkomne": "4f9f8d9599a0f631", "pris kun 75 kr om måneden inkl varm kaffe efter turen": "393a9953c3097d02", "end": "417e9b3906aecb2f", "at sammenligne": "5dcb65b3b60b78e3", "at vælge": "01ca259caee9a254", "at styrke": "3ee9fbe0c0834f60", "at forsvare sig": "ccbdb57504ab77b3", "at melde sig til": "d328f01db2d1ea70", "at blive (medlem)": "a7d355eec74a7aa2", "en kajak": "2cab659f764854b0", "en kampsport": "1a14d00013b664f3", "et selvforsvar": "fcf818a11715f7e9", "en begynder": "5cb7b07bedf7fbf7", "et medlem": "73ee23a99a5f47ab", "et medlemskab": "5a5c4b01fe5334d9", "en afstand": "0fb0d8086b958552", "et udstyr": "9959d638449ec52c", "et fællesskab": "cf49576dea89e5c6", "billig": "5cbf122e02d75ad6", "svær": "897291ae69dbf823", "nem": "5be6a13161130ceb"}, "key": "ncd2-L08"}, {"book": "ncd2", "lesson": 9, "title_da": "Peter Sørensen ringer til politiet", "title_zh": "彼得·索伦森报警记", "grammar": "同时性时间从句 mens（“在……的同时 / 而……”）· 感官动词宾语补足结构（se / høre / mærke + 宾语 + 不带 at 的动词原形）· 语篇衔接与段落逻辑", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Peter Sørensen ringer til politiet（叙事短文 · 约 160 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Klokken var halv tolv en mørk aften, og hele gaden var stille.", "a": "d7e1985fe75a6548", "dur": 4.12}, {"id": "a2", "who": "narrator", "da": "Peter Sørensen lå og læste en krimi, [[mens hans kone allerede sov]].", "a": "d5e177f97f94c663", "dur": 3.96}], "zh": "一个漆黑的晚上十一点半，整条街都静悄悄的。彼得·索伦森正躺在床上读一本侦探小说，而他的妻子已经睡着了。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Pludselig **hørte han nogen gå** rundt ude i haven.", "a": "19461af687f89921", "dur": 2.72}, {"id": "a4", "who": "narrator", "da": "Han slukkede lampen og kiggede ud ad vinduet.", "a": "8607a5b8b74d3cf0", "dur": 2.64}, {"id": "a5", "who": "narrator", "da": "I mørket **så han en skygge bevæge sig** mellem buskene.", "a": "e091cad3026644f7", "dur": 3.76}, {"id": "a6", "who": "narrator", "da": "Lige efter **hørte han en skraldespand vælte** med et brag.", "a": "3755761f61f780e3", "dur": 3.72}], "zh": "突然，他听到有人在外面花园里走动。他关掉台灯，向窗外望去。在黑暗中，他看见一个黑影在灌木丛之间移动。紧接着，他听到一个垃圾桶“砰”地一声倒在了地上。"}, {"segs": [{"id": "a7", "who": "narrator", "da": "[[Mens hans hjerte bankede hurtigt]], ringede Peter til politiet.", "a": "5908c64c2b1f0e39", "dur": 3.64}, {"id": "a8", "who": "narrator", "da": "Han hviskede lavt, at en fremmed mand sikkert var ved at bryde ind.", "a": "e2199fdb2803584a", "dur": 3.28}, {"id": "a9", "who": "narrator", "da": "Betjenten bad ham blive indenfor, [[mens to betjente kørte ud]] til adressen.", "a": "374ca03416eec978", "dur": 4.48}], "zh": "彼得的心怦怦直跳，同时他打电话报了警。他压低声音说，肯定有个陌生男子正准备闯进屋里。警员让他待在室内，与此同时两位警察正开车赶往这个地址。"}, {"segs": [{"id": "a10", "who": "narrator", "da": "Ti minutter senere **så Peter en politibil standse** udenfor.", "a": "4fb17b33942b5760", "dur": 3.88}, {"id": "a11", "who": "narrator", "da": "Betjentene gik stille ind i haven med en stor lommelygte. [[Mens Peter nervøst ventede i gangen]], lyste de ind under buskene — og begyndte pludselig at grine højt!", "a": "f0028757978a37bd", "dur": 9.76}], "zh": "十分钟后，彼得看见一辆警车停在门外。两位警察拿着大手电筒悄悄走进花园。就在彼得在门厅里紧张等待时，他们往灌木丛下照去——然后突然大笑起来！"}, {"segs": [{"id": "a12", "who": "narrator", "da": "Ved den væltede skraldespand sad en hel familie af små pindsvin og spiste gamle æbler.", "a": "32b6eb88b4b71b7d", "dur": 5.52}, {"id": "a13", "who": "narrator", "da": "Peter blev både flov og lettet, og han gav betjentene en kop varm kaffe, før de kørte videre.", "a": "d8d1558c220de1df", "dur": 5.36}], "zh": "在翻倒的垃圾桶旁，蹲着一大家子小刺猬，正啃着旧苹果呢。彼得既不好意思又松了一口气，在警察开车离开前给他们倒了一杯热咖啡。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：En mystisk lyd i carporten（对标 DU3 Modul 2 Læsning Opgave 2：Tekstsammenhæng）", "scene": null, "paras": [{"cue": "Læsning Opgave 2｜Tekstsammenhæng（语篇句子插入）", "segs": [{"id": "b1", "who": "narrator", "da": "Fredag aften kom Mads sent hjem fra arbejde i regnvejr.", "a": "fbb0d81755013dd0", "dur": 4.16}, {"id": "b2", "who": "narrator", "da": "Han stillede sin taske ved døren, men han kunne ikke finde sin husnøgle i lommen. (1) ___ Pludselig **hørte han noget rasle** inde fra sin egen carport.", "say": "Han stillede sin taske ved døren, men han kunne ikke finde sin husnøgle i lommen. Pludselig hørte han noget rasle inde fra sin egen carport.", "a": "99a132a5a9d68b84", "dur": 7.92}]}, {"segs": [{"id": "b3", "who": "narrator", "da": "Mads blev meget forskrækket, for klokken var næsten midnat. (2) ___ [[Mens han langsomt nærmede sig døren]], **mærkede han sine hænder ryste** lidt.", "say": "Mads blev meget forskrækket, for klokken var næsten midnat. Mens han langsomt nærmede sig døren, mærkede han sine hænder ryste lidt.", "a": "f7bda89576765d31", "dur": 7.64}, {"id": "b4", "who": "narrator", "da": "Han tændte lyset på sin telefon og kiggede forsigtigt ind.", "a": "fbe36feb5c7b2911", "dur": 3.64}]}, {"segs": [{"id": "b5", "who": "narrator", "da": "Der stod naboens tiårige søn, Emil, i gummistøvler med en lille kasse i armene! (3) ___ Emil forklarede flovt, at han havde fundet en våd kattekilling på vejen, og at hans forældre ikke var hjemme endnu.", "say": "Der stod naboens tiårige søn, Emil, i gummistøvler med en lille kasse i armene! Emil forklarede flovt, at han havde fundet en våd kattekilling på vejen, og at hans forældre ikke var hjemme endnu.", "a": "21cbe797fe41307c", "dur": 11.0}]}, {"segs": [{"id": "b6", "who": "narrator", "da": "(4) ___ Mads smilede lettet, gav Emil et gammelt håndklæde og ringede til Emils mor, så hun vidste, hvor drengen var.", "say": "Mads smilede lettet, gav Emil et gammelt håndklæde og ringede til Emils mor, så hun vidste, hvor drengen var.", "a": "972767e21095366c", "dur": 5.96}]}, {"segs": [{"id": "b7", "who": "narrator", "da": "Han troede straks, at en tyv prøvede at stjæle hans dyre elcykel.", "label": "A.", "a": "e65b13c1429cdbf4", "dur": 3.56}, {"id": "b8", "who": "narrator", "da": "Derfor havde drengen båret den lille kat ind i Mads' tørre carport for at give den læ for regnen.", "nl": true, "label": "B.", "a": "1fa2a26ecd2126ad", "dur": 5.16}, {"id": "b9", "who": "narrator", "da": "C. [[Mens han ledte]] i tasken efter nøglen, blev hele haven pludselig helt mørk.", "nl": true, "a": "cb25bc1de3106bcb", "dur": 5.84}, {"id": "b10", "who": "narrator", "da": "Drengen så helt våd ud, men han holdt forsigtigt om den lille, frysende kat.", "nl": true, "label": "D.", "a": "895e3a0b8ae4ac1c", "dur": 4.6}, {"id": "b11", "who": "narrator", "da": "I morgen skal Mads købe en ny cykelpumpe på nettet sammen med sin søster.", "nl": true, "label": "E.", "a": "feb6f7e425edba1a", "dur": 4.56}], "zh_all": "周五晚上，马兹冒雨下班很晚才回家。他把包放在门口，但在口袋里找不到家门钥匙。（1）[C] 当他在包里翻找钥匙时，整个院子突然一片漆黑。突然，他听到自己的车棚里传来什么沙沙作响的声音。\n马兹吓了一大跳，因为那时已经快半夜了。（2）[A] 他立刻以为是小偷想偷他那辆昂贵的电动自行车。在他慢慢靠近车棚门时，他感觉到自己的手有点发抖。他打开手机照明灯，小心翼翼地往里看。\n邻居十岁的儿子埃米尔穿着雨靴站在那里，怀里抱着一个小纸箱！（3）[D] 男孩看起来浑身湿透了，但他正小心翼翼地护着那只发抖的小猫。埃米尔不好意思地解释说，他在路上捡到了一只湿漉漉的小奶猫，而他父母还没回家。\n（4）[B] 因此男孩把小猫抱进了马兹干燥的车棚里，让它避避雨。马兹松了口气笑了笑，给了埃米尔一条旧毛巾，并打电话给埃米尔的妈妈，让她知道孩子在哪里。\n（干扰项 E：“明天马兹要和妹妹一起在网上买新打气筒”——时态变为将来且与当前情景完全无关。）"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "打电话；响铃（ringe til politiet 报警）", "note": "动词 [har] · ringer, ringede, har ringet", "segs": [{"id": "g1", "who": "narrator", "da": "at ringe", "say": "at ringe. ringer, ringede, har ringet.", "a": "ca88ed3b9f489077", "dur": 4.0}]}, {"zh": "听见，听到", "note": "动词 [har] · hører, hørte, har hørt", "segs": [{"id": "g2", "who": "narrator", "da": "at høre", "say": "at høre. hører, hørte, har hørt.", "a": "49579ea41e5e0c18", "dur": 4.2}]}, {"zh": "感觉到，摸到", "note": "动词 [har] · mærker, mærkede, har mærket", "segs": [{"id": "g3", "who": "narrator", "da": "at mærke", "say": "at mærke. mærker, mærkede, har mærket.", "a": "65e7bf3570813375", "dur": 4.76}]}, {"zh": "吵闹，发出噪音", "note": "动词 [har] · larmer, larmede, har larmet", "segs": [{"id": "g4", "who": "narrator 装"}, {"prompt": "Jeg lavede aftensmad. Min søster dækkede bord. → ⟦Mens jeg...⟧", "kind": "write", "accept": ["Mens jeg lavede aftensmad, dækkede min søster bord."]}, {"prompt": "Vores nabo var på ferie. Der skete noget mærkeligt i hans hus. → ⟦Mens vores nabo...⟧", "kind": "write", "accept": ["Mens vores nabo var på ferie, skete der noget mærkeligt i hans hus."]}, {"prompt": "Hun hørte musik. Hun {{_}} (⟦ikke hørte / hørte ikke⟧) telefonen ringe.", "kind": "cloze", "blanks": [["ikke hørte"]], "explain": "⟦mens⟧ 为从句，否定词 ⟦ikke⟧ 放在动词之前"}, {"prompt": "{{_}} (⟦Mens / Når⟧) jeg gik tur med hunden i går aftes, begyndte det at regne.", "kind": "cloze", "blanks": [["Mens"]], "explain": "持续动作“昨晚遛狗的过程中”同时下雨"}, {"prompt": "{{_}} (⟦Da / Mens⟧) vi spiste morgenmad i køkkenet, sad katten hele tiden under bordet.", "kind": "cloze", "blanks": [["Mens"]], "explain": "与 ⟦hele tiden⟧ 配合表示两个持续动作同时发生"}]}, {"id": "B", "type": "drill", "title": "练习 B：用感官动词（se / høre / mærke）+ 宾格 + 动词原形改写或填空", "items": [{"prompt": "Jeg så Peter. Han gik ind i haven. → ⟦Jeg så {{_}}.⟧", "kind": "cloze", "blanks": [["Peter gå ind i haven", "ham gå ind i haven"]]}, {"prompt": "Han hørte noget. Skraldespanden væltede. → ⟦Han hørte {{_}}.⟧", "kind": "cloze", "blanks": [["en skraldespand vælte", "en den vælte"]]}, {"prompt": "Mads mærkede sine hænder. De rystede lidt. → ⟦Mads mærkede {{_}}.⟧", "kind": "cloze", "blanks": [["sine hænder ryste lidt"]]}, {"prompt": "Vi hørte vores naboer {{_}} (⟦at synge / synge / synger⟧) højt i haven.", "kind": "cloze", "blanks": [["synge"]], "explain": "感官动词后不加 ⟦at⟧，也不用现在时 ⟦synger⟧"}, {"prompt": "Så du {{_}} (⟦han / ham⟧) {{_}} (⟦at løbe / løbe⟧) hen mod bussen?", "kind": "cloze", "blanks": [["ham"], ["løbe"]], "explain": "代词宾格 + 裸不定式"}, {"prompt": "De så {{_}} (⟦de / dem⟧) {{_}} (⟦køre / kørte⟧) væk i en blå bil.", "kind": "cloze", "blanks": [["dem"], ["køre"]], "explain": "代词宾格 + 过去式不合句法，必须用动词原形 ⟦køre⟧"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（综合运用 mens 与感官动词结构）", "i 的“过去的过去”时间回溯 · 邻里沟通与礼貌化解表达", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：En sur seddel i vaskekælderen（叙事短文 · 约 165 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Lørdag eftermiddag skyndte Emma sig ned i vaskekælderen.", "a": "d9f04e67bcb1a17a", "dur": 3.04}, {"id": "a2", "who": "narrator", "da": "Hun **var kommet** femten minutter for sent, fordi hun [[havde glemt]] at sætte en alarm på sin telefon.", "a": "9f2cfb9167f0fdc9", "dur": 4.48}], "zh": "周六下午，艾玛匆匆忙忙下楼走进洗衣房。她迟到了十五分钟，因为她忘了在手机上定闹钟。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Da hun åbnede døren til vaskemaskinerne, så hun straks, at maskine 2 allerede var tom.", "a": "e4907f1b42aa74a3", "dur": 5.52}, {"id": "a4", "who": "narrator", "da": "Nogen [[havde taget]] hendes våde tøj ud og [[lagt]] det over i en blå plastikkurv.", "a": "65f39892d5c6355f", "dur": 4.44}, {"id": "a5", "who": "narrator", "da": "Oven på håndklæderne lå der en lille, sur seddel: \"Husk tiden!", "a": "22e62de1faaf54b6", "dur": 4.36}, {"id": "a6", "who": "narrator", "da": "Andre skal også vaske!\"", "a": "2f5a17e0e48fcd08", "dur": 1.84}], "zh": "当她推开洗衣机间的门时，立刻看到 2 号洗衣机已经空了。有人把她的湿衣服拿出来，放进了一个蓝色的塑料篮里。毛巾上面压着一张又小又生气的纸条：“记住时间！别人也要洗衣服！”"}, {"segs": [{"id": "a7", "who": "narrator", "da": "Emma blev både ked af det og nysgerrig.", "a": "42e06f95427b8248", "dur": 2.36}, {"id": "a8", "who": "narrator", "da": "Hvem [[havde skrevet]] den sure seddel?", "a": "c54f6a3d0e142e7e", "dur": 2.16}, {"id": "a9", "who": "narrator", "da": "Hun gik hen til vasketavlen på væggen og opdagede, at Henrik fra 3. tv [[havde reserveret]] tiden lige efter hende.", "a": "f3461126a7d27eb2", "dur": 6.32}, {"id": "a10", "who": "narrator", "da": "Maskinen **var** allerede **gået i gang** med hans mørke tøj.", "a": "b81721c824e18228", "dur": 2.84}], "zh": "艾玛既有点难过又觉得好奇。到底是谁写了这张愤怒的纸条呢？她走到墙边的预约登记板前，发现三楼左门（3. tv）的亨里克正好预约了紧接着她后面的时段。洗衣机里已经开始洗他的深色衣服了。"}, {"segs": [{"id": "a11", "who": "narrator", "da": "Om aftenen besluttede Emma at banke på Henriks dør med to nybagte kanelsnegle på en tallerken.", "a": "5b9db89bc948e979", "dur": 5.56}, {"id": "a12", "who": "narrator", "da": "Da han åbnede, sagde hun venligt undskyld for tidligere.", "a": "0a4a5384ff552f6e", "dur": 3.6}, {"id": "a13", "who": "narrator", "da": "Henrik så pludselig meget flov ud.", "a": "366e5135a687d530", "dur": 2.4}, {"id": "a14", "who": "narrator", "da": "Han indrømmede, at han [[havde haft]] en stressende dag på arbejdet, og inviterede hende ind til en kop varm kaffe.", "a": "95c1cbd7ca9d0ea9", "dur": 5.44}], "zh": "那天晚上，艾玛端着盘子，带上两个刚烤好的肉桂卷，决定去敲亨里克的门。他开门时，艾玛友好地为白天迟到的事道了歉。亨里克突然显得很不好意思。他承认自己那天上班压力特别大，并请她进屋喝了杯热咖啡。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Opslag i opgangen & naboernes e-mails（对标 DU3 Modul 2 Hverdagsnoter & Læseforståelse）", "scene": null, "paras": [{"cue": "Opslag 1｜På vasketavlen i kælderen", "segs": [{"id": "b1", "who": "narrator", "da": "Vigtig information om vasketiderne", "a": "e3ab2ed300e9306e", "dur": 2.56}, {"id": "b2", "who": "narrator", "da": "Kære beboere i opgang 14.", "nl": true, "a": "c3a475099f1dbda6", "dur": 2.48}, {"id": "b3", "who": "narrator", "da": "Husk at tømme maskinerne, så snart jeres vasketid er slut.", "a": "b1fb587947d91f42", "dur": 3.48}, {"id": "b4", "who": "narrator", "da": "Hvis man kommer mere end ti minutter for sent, må den næste beboer gerne lægge det våde tøj i en kurv. — Bestyrelsen", "a": "de781eab5ad806ce", "dur": 6.28}]}, {"cue": "Mailudveksling｜Fra: Henrik til Emma (søndag morgen)", "segs": [{"id": "b5", "who": "narrator", "da": "Emne: Tak for i går!", "a": "f8b506d85917b04f", "dur": 2.16}, {"id": "b6", "who": "narrator", "da": "Hej Emma!", "nl": true, "a": "2b2aaa4da2eb6398", "dur": 0.84}, {"id": "b7", "who": "narrator", "da": "Tusind tak for de lækre kanelsnegle i går aftes — og endnu en gang undskyld for den sure seddel.", "a": "5ff9d6201887ac80", "dur": 5.2}, {"id": "b8", "who": "narrator", "da": "Jeg [[havde haft]] en virkelig lang uge og [[havde sovet]] dårligt, men det var selvfølgelig ikke din skyld.", "a": "0b60cbc65dab9579", "dur": 4.44}, {"id": "b9", "who": "narrator", "da": "Næste lørdag har jeg taget vasketid kl. 14, og du må meget gerne vaske før mig, hvis du vil.", "a": "9bd964d5fef2cebe", "dur": 5.24}, {"id": "b10", "who": "narrator", "da": "Skal vi drikke kaffe sammen næste søndag eftermiddag hos mig?", "a": "9d03595c6e7c6989", "dur": 3.08}, {"id": "b11", "who": "narrator", "da": "Bedste hilsner, Henrik", "nl": true, "a": "29353f9fecccbc51", "dur": 2.04}], "zh_all": "公告 1｜地下室预约板旁：关于洗衣时段的重要通知\n亲爱的 14 号楼住户们：请务必在您的洗衣时段结束后立即清空洗衣机。如果迟到超过十分钟，下一位住户可以把湿衣服放进篮子里。——楼委会\n邮件｜亨里克致艾玛（周日早晨）：谢谢昨晚！\n嗨，艾玛！非常感谢昨晚美味的肉桂卷——再次为那张生气的纸条向你道歉。我度过了非常漫长的一周，而且一直没睡好，但这当然不是你的错。下周六我约了下午 2 点的洗衣时段，如果你想的话，非常欢迎你排在我前面洗。下周日下午我们来我家一起喝杯咖啡好吗？致以最诚挚的问候，亨里克。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "洗，清洗", "note": "动词 [har] · vasker, vaskede, har vasket", "segs": [{"id": "g1", "who": "narrator", "da": "at vaske", "say": "at vaske. vasker, vaskede, har vasket.", "a": "a5c2bae2c2f0727a", "dur": 4.12}]}, {"zh": "预订，预约", "note": "动词 [har] · reserverer, reserverede, har reserveret", "segs": [{"id": "g2", "who": "narrator", "da": "at reservere", "say": "at reservere. reserverer, reserverede, har reserveret.", "a": "80005ea2680aaa31", "dur": 5.28}]}, {"zh": "清空，倒空", "note": "动词 [har] · tømmer, tømte, har tømt", "segs": [{"id": "g3", "who": "narrator", "da": "at tømme", "say": "at tømme. tømmer, tømte, har tømt.", "a": "a1d963cd579275f9", "dur": 4.48}]}, {"zh": "忘记", "note": "动词 [har] · glemmer, glemte, har glemt", "segs": [{"id": "g4", "who": "narrator", "da": "at glemme", "say": "at glemme. glemmer, glemte, har glemt.", "a": "125b71548c7d69f3", "dur": 3.8}]}, {"zh": "发现，察觉", "note": "动词 [har] · opdager, opdagede, har opdaget", "segs": [{"id": "g5", "who": "narrator", "da": t undskylde", "zh": "道歉；原谅", "forms": "undskylder, undskyldte, har undskyldt"}, {"pos": "动词 [er]", "da": "at komme for sent", "zh": "迟到", "forms": "kommer, kom, er kommet for sent"}, {"pos": "动词 [er]", "da": "at gå i gang", "zh": "开始运转，开始行动", "forms": "går, gik, er gået i gang"}, {"pos": "名词", "da": "en vaskekælder", "zh": "（公寓共用）洗衣地下室", "forms": "vaskekælderen, vaskekældre, vaskekældrene"}, {"pos": "名词", "da": "en seddel", "zh": "纸条，便条", "forms": "sedlen, sedler, sedlerne"}, {"pos": "名词", "da": "en kurv", "zh": "篮子，筐", "forms": "kurven, kurve, kurvene"}, {"pos": "名词", "da": "en opgang", "zh": "楼门，单元楼道", "forms": "opgangen, opgange, opgangene"}, {"pos": "名词", "da": "et opslag", "zh": "公告，告示", "forms": "opslaget, opslag, opslagene"}, {"pos": "名词", "da": "en skyld", "zh": "过错，责任（ikke din skyld 不是你的错）", "forms": "skylden, ingen flertal"}, {"pos": "形容词", "da": "sur / våd", "zh": "生气的，酸的 / 湿的", "forms": "sur (surt, sure) / våd (vådt, våde"}, {"pos": "形容词", "da": "nysgerrig / stressende", "zh": "好奇的 / 令人紧张有压力的", "forms": "nysgerrig (-t, -e) / stressende (不变"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "当我到达车站时，火车已经开走了。（køre）", "answer": "Da jeg kom til stationen, var toget allerede kørt."}, {"zh": "她昨晚很累，因为她前一天晚上没睡好。（sove）", "answer": "Hun var meget træt i går aftes, fordi hun ikke havde sovet godt natten før."}, {"zh": "幸好他当时还没有把那张纸条扔掉！（ikke smide væk）", "answer": "Heldigvis havde han ikke smidt den seddel væk endnu!"}, {"zh": "在我敲门之前，我已经烤好了几个肉桂卷。（bage）", "answer": "Før jeg bankede på døren, havde jeg allerede bagt nogle kanelsnegle."}, {"zh": "他承认他在超市里忘了拿钱包。（indrømme / glemme）", "answer": "Han indrømmede, at han havde glemt sin pung i supermarkedet."}]}, {"id": "A", "type": "drill", "title": "练习 A：用 havde 或 var + 括号内动词的过去分词填空（构成 Førdatid）", "items": [{"prompt": "Emma {{_}} {{_}} femten minutter for sent ned i kælderen. (⟦at komme⟧)", "kind": "cloze", "blanks": [["var"], ["kommet"]], "explain": "⟦komme⟧ 位移 → ⟦var⟧"}, {"prompt": "Hun {{_}} {{_}} at sætte sin alarm om eftermiddagen. (⟦at glemme⟧)", "kind": "cloze", "blanks": [["havde"], ["glemt"]]}, {"prompt": "Da hun kom ned, {{_}} naboen allerede {{_}} hendes tøj i en kurv. (⟦at lægge⟧)", "kind": "cloze", "blanks": [["havde"], ["lagt"]], "explain": "注意 ⟦lægge → lagt⟧"}, {"prompt": "Vaskemaskinen {{_}} allerede {{_}} i gang med mørkt tøj. (⟦at gå⟧)", "kind": "cloze", "blanks": [["var"], ["gået"]], "explain": "⟦gå i gang⟧ 状态变化/位移 → ⟦var⟧"}, {"prompt": "Henrik {{_}} {{_}} dårligt om natten og havde haft en stressende uge. (⟦at sove⟧)", "kind": "cloze", "blanks": [["havde"], ["sovet"]], "explain": "静态睡觉 → ⟦havde⟧；⟦sove → sovet⟧"}, {"prompt": "Vi kunne ikke gå ind, fordi vi {{_}} {{_}} nøglen derhjemme. (⟦at glemme⟧)", "kind": "cloze", "blanks": [["havde"], ["glemt"]]}, {"prompt": "Da politiet kom, {{_}} tyven allerede {{_}} væk på cykel. (⟦at køre⟧)", "kind": "cloze", "blanks": [["var"], ["kørt"]], "explain": "位移离开 → ⟦var⟧"}, {"prompt": "Familien {{_}} lige {{_}} til Aarhus ugen før. (⟦at flytte⟧)", "kind": "cloze", "blanks": [["var"], ["flyttet"]], "explain": "搬家状态改变 → ⟦var⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：根据时间先后，将两句话用括号里的连词合并（先发生的用 Førdatid，后发生的用 Datid）", "items": [{"prompt": "Først spiste vi aftensmad. Bagefter gik vi i biografen. (⟦efter at⟧) →", "kind": "write", "accept": ["Efter at vi havde spist aftensmad, gik vi i biografen."]}, {"prompt": "Først begyndte det at regne. Derefter tog vi bussen hjem. (⟦fordi⟧) →", "kind": "write", "accept": ["Vi tog bussen hjem, fordi det havde begyndt / var begyndt at regne."], "explain": "注：⟦begynde⟧ 表示状态开始常用 ⟦var begyndt⟧，口语也偶见 ⟦havde begyndt⟧"}, {"prompt": "Først købte jeg en gave. Bagefter kom jeg til festen. (⟦da⟧) →", "kind": "write", "accept": ["Da jeg kom til festen, havde jeg allerede købt en gave."]}, {"prompt": "Først tog han mit tøj ud. Så kom jeg ned i kælderen. (⟦da⟧) →", "kind": "write", "accept": ["Da jeg kom ned i kælderen, havde han allerede taget mit tøj ud."]}, {"prompt": "Først havde hun en lang arbejdsdag. Så blev hun træt. (⟦fordi⟧) →", "kind": "write", "accept": ["Hun blev træt, fordi hun havde haft en lang arbejdsdag."]}, {"prompt": "Først flyttede de ind i lejligheden. To uger efter mødte de naboen. (⟦efter at⟧) →", "kind": "write", "accept": ["Efter at de var flyttet ind i lejligheden, mødte de naboen to uger efter."]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（重点练习 Førdatid 的否定词 ikke 与从句语序）", "items": [{"prompt": "当我到达车站时，火车已经开走了。（⟦køre⟧）", "kind": "write", "accept": ["Da jeg kom til stationen, var toget allerede kørt."]}, {"prompt": "她昨晚很累，因为她前一天晚上没睡好。（⟦sove⟧）", "kind": "write", "accept": ["Hun var meget træt i går aftes, fordi hun ikke havde sovet godt natten før."]}, {"prompt": "幸好他当时还没有把那张纸条扔掉！（⟦ikke smide væk⟧）", "kind": "write", "accept": ["Heldigvis havde han ikke smidt den seddel væk endnu!"]}, {"prompt": "在我敲门之前，我已经烤好了几个肉桂卷。（⟦bage⟧）", "kind": "write", "accept": ["Før jeg bankede på døren, havde jeg allerede bagt nogle kanelsnegle."]}, {"prompt": "他承认他在超市里忘了拿钱包。（⟦indrømme / glemme⟧）", "kind": "write", "accept": ["Han indrømmede, at han havde glemt sin pung i supermarkedet."]}]}], "clips": {"lørdag eftermiddag skyndte emma sig ned i vaskekælderen": "d9f04e67bcb1a17a", "hun var kommet femten minutter for sent fordi hun havde glemt at sætte en alarm på sin telefon": "9f2cfb9167f0fdc9", "da hun åbnede døren til vaskemaskinerne så hun straks at maskine 2 allerede var tom": "e4907f1b42aa74a3", "nogen havde taget hendes våde tøj ud og lagt det over i en blå plastikkurv": "65f39892d5c6355f", "oven på håndklæderne lå der en lille sur seddel husk tiden": "22e62de1faaf54b6", "andre skal også vaske": "2f5a17e0e48fcd08", "emma blev både ked af det og nysgerrig": "42e06f95427b8248", "hvem havde skrevet den sure seddel": "c54f6a3d0e142e7e", "hun gik hen til vasketavlen på væggen og opdagede at henrik fra 3 tv havde reserveret tiden lige efter hende": "f3461126a7d27eb2", "maskinen var allerede gået i gang med hans mørke tøj": "b81721c824e18228", "om aftenen besluttede emma at banke på henriks dør med to nybagte kanelsnegle på en tallerken": "5b9db89bc948e979", "da han åbnede sagde hun venligt undskyld for tidligere": "0a4a5384ff552f6e", "henrik så pludselig meget flov ud": "366e5135a687d530", "han indrømmede at han havde haft en stressende dag på arbejdet og inviterede hende ind til en kop varm kaffe": "95c1cbd7ca9d0ea9", "vigtig information om vasketiderne": "e3ab2ed300e9306e", "kære beboere i opgang 14": "c3a475099f1dbda6", "husk at tømme maskinerne så snart jeres vasketid er slut": "b1fb587947d91f42", "hvis man kommer mere end ti minutter for sent må den næste beboer gerne lægge det våde tøj i en kurv — bestyrelsen": "de781eab5ad806ce", "emne tak for i går": "f8b506d85917b04f", "hej emma": "2b2aaa4da2eb6398", "tusind tak for de lækre kanelsnegle i går aftes — og endnu en gang undskyld for den sure seddel": "5ff9d6201887ac80", "jeg havde haft en virkelig lang uge og havde sovet dårligt men det var selvfølgelig ikke din skyld": "0b60cbc65dab9579", "næste lørdag har jeg taget vasketid kl 14 og du må meget gerne vaske før mig hvis du vil": "9bd964d5fef2cebe", "skal vi drikke kaffe sammen næste søndag eftermiddag hos mig": "9d03595c6e7c6989", "bedste hilsner henrik": "29353f9fecccbc51", "at vaske": "a5c2bae2c2f0727a", "at reservere": "80005ea2680aaa31", "at tømme": "a1d963cd579275f9", "at glemme": "125b71548c7d69f3", "at opdage": "e0686c35e6101529", "at indrømme": "ee9edbd007a8ed17", "at banke på": "218435e547aeaed9", "at undskylde": "cfd5c8437e38e366", "at komme for sent": "2d6b2105a3bc9821", "at gå i gang": "3d908dd86e120adf", "en vaskekælder": "17eaab60e1eca5ba", "en seddel": "ce5c6fa6db190cc2", "en kurv": "cecc8d0e90c9c3cf", "en opgang": "5bc8f9e430161123", "et opslag": "be87efc36dfb4bff", "en skyld": "949d54d4f8524b37", "sur": "89437ffc76464925", "våd": "4b61da6caa98928f", "nysgerrig": "771138665e110a6b", "stressende": "de10abd5f31f7aa9"}, "key": "ncd2-L10"}, {"book": "ncd2", "lesson": 11, "title_da": "Gode råd til en sundere hverdag", "title_zh": "健康日常的好建议", "grammar": "条件从句 hvis（从句否定词前置 + 主句倒装）· 成对连词 både... og... / enten... eller... / hverken... eller...（严禁叠加 ikke）", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Gode råd til en sundere hverdag（生活建议短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "En travl arbejdsuge kan hurtigt tage energien, [[hvis man ikke passer på]] sin krop.", "a": "b9742cb41893a70f", "dur": 3.76}, {"id": "a2", "who": "narrator", "da": "Her er fire enkle råd fra vores sundhedsklinik.", "a": "c0b9b6825de1c67b", "dur": 3.08}], "zh": "如果不好好照顾自己的身体，忙碌的工作周很快就会耗尽你的精力。以下是我们健康诊所的四条简单建议。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "For det første er søvn vigtig. [[Hvis du ikke sover]] syv til otte timer hver nat, bliver du hurtigt træt og mister koncentrationen.", "a": "f61cbe9d84c1647c", "dur": 6.12}, {"id": "a4", "who": "narrator", "da": "Om aftenen er det klogt at lægge telefonen væk en time før sengetid, så man **hverken** tjekker arbejdsmail **eller** ser urolige nyheder i sengen.", "a": "35d6a94253c4bd51", "dur": 8.0}], "zh": "首先，睡眠非常重要。如果你每晚睡不够七到八个小时，就会很快感到疲倦并失去专注力。晚上睡前一小时把手机放到一边是明智的，这样人既不会在床上查看工作邮件，也不会刷令人焦虑的新闻。"}, {"segs": [{"id": "a5", "who": "narrator", "da": "For det andet giver daglig bevægelse overskud. [[Hvis vejret er tørt]], kan du cykle på arbejde i stedet for at tage bilen.", "a": "cd0799d7c2ea9a52", "dur": 6.28}, {"id": "a6", "who": "narrator", "da": "Det er **både** godt for miljøet **og** billigt for din økonomi.", "a": "efd86677986b299a", "dur": 3.16}], "zh": "其次，每天活动身体能带来充沛精力。如果天气干燥，你可以骑车上班而不是开车。这既有利于环境，又对你的钱包很友好。"}, {"segs": [{"id": "a7", "who": "narrator", "da": "For det tredje handler sundhed om madvaner.", "a": "fd31e91f1abcb8ed", "dur": 2.6}, {"id": "a8", "who": "narrator", "da": "Til frokost kan du vælge **enten** mørkt rugbrød med fisk **eller** en stor salat med grøntsager og fuldkorn. [[Hvis du skærer ned på]] sukker og søde drikke om eftermiddagen, holder dit blodsukker sig stabilt hele dagen.", "a": "6621cd8c7a2f062d", "dur": 11.12}], "zh": "第三，健康与饮食习惯息息相关。午餐时你可以选择要么吃配鱼肉的黑麦面包，要么吃一大份蔬菜全谷物沙拉。如果你在下午减少糖分和甜饮料的摄入，你的血糖就能一整天保持平稳。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Spørg lægen — Sundhed i hverdagen（对标 DU3 Modul 2 Læsning：Sundhed & Kost）", "scene": null, "paras": [{"cue": "Spørgsmål fra læserne（读者来信提问 1–3）", "segs": [{"id": "b1", "who": "narrator", "da": "Sofie, 29 år:", "label": "1.", "a": "43ef1e98f4db7ebe", "dur": 2.12}, {"id": "b2", "who": "narrator", "da": "Jeg arbejder på kontor hele dagen og sidder ned i otte timer.", "nl": true, "a": "3932222bc4f5f960", "dur": 4.52}, {"id": "b3", "who": "narrator", "da": "Når jeg kommer hjem, er jeg træt, og jeg gider hverken lave mad eller gå i fitnesscenter.", "a": "3f1589f3a4b1b168", "dur": 4.52}, {"id": "b4", "who": "narrator", "da": "Hvad kan jeg gøre?", "a": "15134fe3f524bf8a", "dur": 1.16}, {"id": "b5", "who": "narrator", "da": "Mikkel, 41 år:", "nl": true, "label": "2.", "a": "730bde9d57c32b12", "dur": 1.72}, {"id": "b6", "who": "narrator", "da": "Jeg drikker ofte fire eller fem kopper kaffe om dagen — nogle gange også kl. 20 om aftenen.", "nl": true, "a": "f0db289810e098cb", "dur": 4.52}, {"id": "b7", "who": "narrator", "da": "Om natten ligger jeg vågen i lang tid, og jeg sover dårligt.", "a": "c3b49f2544eb694a", "dur": 4.12}, {"id": "b8", "who": "narrator", "da": "Ida, 35 år:", "nl": true, "label": "3.", "a": "c10c194f651fc11d", "dur": 1.68}, {"id": "b9", "who": "narrator", "da": "Jeg tjekker altid sociale medier i sengen før sengetid, selvom jeg ved, at det ikke er sundt.", "nl": true, "a": "96ff12e48aed15a8", "dur": 5.44}, {"id": "b10", "who": "narrator", "da": "Om morgenen vågner jeg med hovedpine og uden energi.", "a": "36553b6938dc1050", "dur": 3.44}]}, {"cue": "Lægens svar（医生专栏回复 A–D）", "segs": [{"id": "b11", "who": "narrator", "da": "Hvis du sidder stille hele dagen, har din krop brug for let bevægelse.", "label": "A.", "a": "9cdbda64a58c571a", "dur": 3.92}, {"id": "b12", "who": "narrator", "da": "Du behøver ikke tage i fitnesscenter — gå en rask tur på tyve minutter efter arbejde, eller cykl til kontoret et par gange om ugen.", "a": "f523c7edb2448c03", "dur": 6.76}, {"id": "b13", "who": "narrator", "da": "Blåt lys fra skærme fortæller hjernen, at det stadig er dag.", "nl": true, "label": "B.", "a": "aa1edcce81c49895", "dur": 3.76}, {"id": "b14", "who": "narrator", "da": "Læg mobilen i stuen om aftenen, og læs i stedet en almindelig bog.", "a": "14b0ad8febaaeef5", "dur": 4.24}, {"id": "b15", "who": "narrator", "da": "Hvis du dropper skærmen en time før sengetid, falder du hurtigere i søvn.", "a": "b3bab7629ae11f99", "dur": 4.04}, {"id": "b16", "who": "narrator", "da": "Hvis man vil tabe sig hurtigt, er det en god idé at spise meget protein til morgenmad og undgå hvidt brød og pasta i hverdagene.", "nl": true, "label": "C.", "a": "f8c0741180f33203", "dur": 6.4}, {"id": "b17", "who": "narrator", "da": "Koffein bliver i kroppen i mange timer.", "nl": true, "label": "D.", "a": "496674a05e4b0cc0", "dur": 2.8}, {"id": "b18", "who": "narrator", "da": "Prøv at drikke din sidste kop kaffe før kl. 14.", "a": "4296e658a8aaf3a4", "dur": 3.0}, {"id": "b19", "who": "narrator", "da": "Om eftermiddagen og aftenen kan du vælge enten urtete eller et stort glas vand med citron.", "a": "7897396aec0c5adc", "dur": 5.12}], "zh_all": "读者提问：1. 索菲（29 岁）：我整天在办公室坐八个小时。回到家又累，既不想做饭也不想去健身房。我能怎么办？｜2. 米克尔（41 岁）：我经常一天喝四五杯咖啡——有时晚上八点还在喝。夜里总是醒着睡不着，睡眠很差。｜3. 伊达（35 岁）：我总是在床上睡前刷社交媒体，虽然知道这不健康。早上醒来会头疼、没精神。\n医生回复：A. 整天久坐需要轻度运动。不必去健身房，下班后快走 20 分钟或每周骑车上班几次即可。｜B. 屏幕蓝光会让大脑误以为还是白天。晚上把手机放客厅，改看纸质书。睡前一小时远离屏幕能更快入睡。｜C. （多余干扰项）想快速减肥，早餐多吃蛋白质、工作日少吃白面包和意面。｜D. 咖啡因会在体内停留很多小时。尽量在下午两点前喝完最后一杯咖啡；下午和晚上可以选择草本茶或柠檬水。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "睡觉（falde i søvn **[er]** 入睡）", "note": "动词 [har] · sover, sov, har sovet", "segs": [{"id": "g1", "who": "narrator", "da": "at sove", "say": "at sove. sover, sov, har sovet.", "a": "e74687c3a87e9274", "dur": 4.6}]}, {"zh": "选择", "note": "动词 [har] · vælger, valgte, har valgt", "segs": [{"id": "g2", "who": "narrator", "da": "at vælge", "say": "at vælge. vælger, valgte, har valgt.", "a": "01ca259caee9a254", "dur": 4.72}]}, {"zh": "削减，减少（某物的摄入/开支）", "note": "动词 [har] · skærer, skar, har skåret ned på", "segs": [{"id": "g3", "who": "narrator", "da": "at skære ned på", "say": "at skære ned på. skærer, skar, har skåret ned på.", "a": "e3b715a7d22650a2", "dur": 4.56}]}, {"zh": "放弃，戒掉（口语高频）", "note": "动词 [har] · dropper, droppede, har droppet", "segs": [{"id": "g4", "who": "narrator", "da": "at droppe", "say": "at droppe. dropper, droppede, har droppet.", "a": "ced77d6efc4ecc7a", "dur": 4.4}]}, {"zh": "活动，运动", "note": "动词 [har] · bevæger, bevægede, har bevæget sig", "segs": [{"id": "g5", "who": "narrator", "da": "at bevæge sig", "say": "at bevæge sig. bevæger, bevægede, har bevæget sig.", "a": "efbea5fbc7e04414", "dur": 5.12}]}, {"zh": "关掉（灯、手机、电视等）", "note": "动词 [har] · slukker, slukkede, har slukket", "segs": [{"id": "g6", "who": "narrator", "da": "at slukke", "say": "at slukke. slukker, slukkede, har slukket.", "a": "e1131806955bf792", "dur": 4.6}]}, {"zh": "推荐，建议", "note": "动词 [har] · anbefaler, anbefalede, har anbefalet", "segs": [{"id": "g7", "who": "narrator", "da": "at anbefale", "say": "at anbefale. anbefaler, anbefalede, har anbefalet.", "a": "0d8b0c92e1330b8c", "dur": 5.36}]}, {"zh": "建议，忠告（单复同形）", "note": "名词 · rådet, råd, rådene", "segs": [{"id": "g8", "who": "narrator", "da": "et råd", "say": "et råd. rådet, råd, rådene.", "a": "1f8bb77091b68ee8", "dur": 4.08}]}, {"zh": "工作日，日常生活", "note": "名词 · hverdagen, hverdage, hverdagene", "segs": [{"id": "g9", "who": "narrator", "da": "en hverdag", "say": "en hverdag. hverdagen, hverdage, hverdagene.", "a": "74c6c170ba1a3096", "dur": 6.24}]}, {"zh": "习惯", "note": "名词 · vanen, vaner, vanerne", "segs": [{"id": "g10", "who": "narrator", "da": "en vane", "say": "en vane. vanen, vaner, vanerne.", "a": "d73290fb563af5be", "dur": 5.36}]}, {"zh": "健康（不可数）", "note": "名词 · sundheden, ingen flertal", "segs": [{"id": "g11", "who": "narrator", "da": "sundhed", "say": "sundhed. sundheden, ingen flertal.", "a": "024d7c158e6ebfa5", "dur": 3.76}]}, {"zh": "睡眠（不可数）", "note": "名词 · søvnen, ingen flertal", "segs": [{"id": "g12", "who": "narrator", "da": "søvn", "say": "søvn. søvnen, ingen flertal.", "a": "27fc046a9f9abdec", "dur": 3.44}]}, {"zh": "屏幕使用时间", "note": "名词 · skærmtiden, ingen flertal", "segs": [{"id": "g13", "who": "narrator", "da": "skærmtid", "say": "skærmtid. skærmtiden, ingen flertal.", "a": "d0313aa831df3afe", "dur": 4.52}]}, {"zh": "全谷物，全麦", "note": "名词 · fuldkornet, ingen flertal", "segs": [{"id": "g14", "who": "narrator", "da": "fuldkorn", "say": "fuldkorn. fuldkornet, ingen flertal.", "a": "da6445e8a2a4bfca", "dur": 4.32}]}, {"zh": "头痛", "note": "名词 · hovedpinen, hovedpiner, hovedpinerne", "segs": [{"id": "g15", "who": "narrator", "da": "en hovedpine", "say": "en hovedpine. hovedpinen, hovedpiner, hovedpinerne.", "a": "5a18efdaf8ae50ba", "dur": 5.56}]}, {"zh": "明智的", "note": "形容词 · klogt, kloge", "segs": [{"id": "g16", "who": "narrator", "da": "klog", "say": "klog. klogt, kloge.", "a": "20862b9cc989e86b", "dur": 3.04}]}, {"zh": "忙碌的", "note": "形容词 · travlt, travle", "segs": [{"id": "g17", "who": "narrator", "da": "travl", "say": "travl. travlt, travle.", "a": "0a24298c8fa6bdcc", "dur": 3.2}]}, {"zh": "如果（引导条件从句）", "note": "连词", "segs": [{"id": "g18", "who": "narrator", "da": "hvis", "a": "7f481cf50b5a7f7c", "dur": 1.08}]}, {"zh": "既……又……", "note": "连词", "segs": [{"id": "g19", "who": "narrator", "da": "både... og", "a": "a98019e92cdee2c5", "dur": 1.48}]}, {"zh": "既不……也不……", "note": "连词", "segs": [{"id": "g20", "who": "narrator", "da": "hverken... eller", "a": "8c93fb332601b979", "dur": 1.64}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "动词 [har]", "da": "at sove", "zh": "睡觉（falde i søvn [er] 入睡）", "forms": "sover, sov, har sovet"}, {"pos": "动词 [har]", "da": "at vælge", "zh": "选择", "forms": "vælger, valgte, har valgt"}, {"pos": "动词 [har]", "da": "at skære ned på", "zh": "削减，减少（某物的摄入/开支）", "forms": "skærer, skar, har skåret ned på"}, {"pos": "动词 [har]", "da": "at droppe", "zh": "放弃，戒掉（口语高频）", "forms": "dropper, droppede, har droppet"}, {"pos": "动词 [har]", "da": "at bevæge sig", "zh": "活动，运动", "forms": "bevæger, bevægede, har bevæget sig"}, {"pos": "动词 [har]", "da": "at slukke", "zh": "关掉（灯、手机、电视等）", "forms": "slukker, slukkede, har slukket"}, {"pos": "动词 [har]", "da": "at anbefale", "zh": "推荐，建议", "forms": "anbefaler, anbefalede, har anbefalet"}, {"pos": "名词", "da": "et råd", "zh": "建议，忠告（单复同形）", "forms": "rådet, råd, rådene"}, {"pos": "名词", "da": "en hverdag", "zh": "工作日，日常生活", "forms": "hverdagen, hverdage, hverdagene"}, {"pos": "名词", "da": "en vane", "zh": "习惯", "forms": "vanen, vaner, vanerne"}, {"pos": "名词", "da": "sundhed", "zh": "健康（不可数）", "forms": "sundheden, ingen flertal"}, {"pos": "名词", "da": "søvn", "zh": "睡眠（不可数）", "forms": "søvnen, ingen flertal"}, {"pos": "名词", "da": "skærmtid", "zh": "屏幕使用时间", "forms": "skærmtiden, ingen flertal"}, {"pos": "名词", "da": "fuldkorn", "zh": "全谷物，全麦", "forms": "fuldkornet, ingen flertal"}, {"pos": "名词", "da": "en hovedpine", "zh": "头痛", "forms": "hovedpinen, hovedpiner, hovedpinerne"}, {"pos": "形容词", "da": "klog / travl", "zh": "明智的 / 忙碌的", "forms": "klog (klogt, kloge) / travl (travlt, travle"}, {"pos": "连词", "da": "hvis", "zh": "如果（引导条件从句）", "forms": "不变"}, {"pos": "连词", "da": "både... og / hverken... eller", "zh": "既……又…… / 既不……也不……", "forms": "成对连词，不变"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "如果我每天坐太久，我的背就会疼。（få ondt i ryggen）", "answer": "Hvis jeg sidder ned for længe hver dag, får jeg ondt i ryggen."}, {"zh": "这道菜既健康又便宜。（denne ret）", "answer": "Denne ret er både sund og billig."}, {"zh": "他既不会骑车，也不会游泳。", "answer": "Han kan hverken cykle eller svømme."}, {"zh": "如果你不减少喝咖啡，晚上就睡不好。", "answer": "Hvis du ikke skærer ned på kaffe, sover du ikke godt om natten."}, {"zh": "明天早上我们要么吃鸡蛋，要么吃黑麦面包。", "answer": "I morgen tidlig spiser vi enten æg eller rugbrød."}]}, {"id": "A", "type": "drill", "title": "练习 A：用 hvis 或 om 填空，并调整好从句与主句语序", "items": [{"prompt": "{{_}} du spiser mere frugt og grønt, får du mere energi.", "kind": "cloze", "blanks": [["Hvis"]], "explain": "条件：“如果你多吃蔬果”"}, {"prompt": "Jeg ved ikke, {{_}} lægen har tid i morgen formiddag.", "kind": "cloze", "blanks": [["om"]], "explain": "间接疑问：“我不知道医生明天上午是否有空”"}, {"prompt": "Hvis man {{_}} (⟦dyrker ikke / ikke dyrker⟧) motion, bliver kroppen stiv.", "kind": "cloze", "blanks": [["ikke dyrker"]], "explain": "⟦hvis⟧ 从句内 ⟦ikke⟧ 在动词前"}, {"prompt": "Hvis det regner i morgen tidlig, {{_}} (⟦jeg tager / tager jeg⟧) bussen i stedet for cyklen.", "kind": "cloze", "blanks": [["tager jeg"]], "explain": "从句在前，主句 V2 倒装"}, {"prompt": "Vi kan cykle til stranden, hvis du {{_}} (⟦har / har ikke⟧) travlt.", "kind": "cloze", "blanks": [["har", "ikke har"]], "explain": "依据句意应为 ⟦ikke har⟧：“如果你不忙的话，我们可以骑车去海滩”"}, {"prompt": "Kan du spørge Emma, {{_}} hun vil med ud at gå en tur?", "kind": "cloze", "blanks": [["om"]], "explain": "疑问句转述：“她是否想一起去散步”"}, {"prompt": "Hvis du slukker mobilen kl. 22, {{_}} (⟦sover du / du sover⟧) meget bedre.", "kind": "cloze", "blanks": [["sover du"]], "explain": "主句倒装"}]}, {"id": "B", "type": "drill", "title": "练习 B：选择 både... og...、enten... eller... 或 hverken... eller... 填空，并修改第 5–6 题的病句", "items": [{"prompt": "Cykling giver {{_}} frisk luft {{_}} god motion til benene.", "kind": "cloze", "blanks": [["både"], ["og"]]}, {"prompt": "Om aftenen må du drikke {{_}} urtete {{_}} varmt vand med citron, hvis du vil sove godt.", "kind": "cloze", "blanks": [["enten"], ["eller"]]}, {"prompt": "Peter spiser {{_}} kød {{_}} fisk — han er vegetar.", "kind": "cloze", "blanks": [["hverken"], ["eller"]]}, {"prompt": "Til morgenmad spiser jeg som regel {{_}} havregryn {{_}} rugbrød med ost.", "kind": "cloze", "blanks": [["enten"], ["eller"]]}, {"prompt": "改错：⟦Jeg drikker ikke hverken kaffe og øl før sengetid.⟧ →", "kind": "write", "accept": ["Jeg drikker hverken kaffe eller øl før sengetid."], "prefill": "Jeg drikker ikke hverken kaffe og øl før sengetid.", "explain": "去掉 ⟦ikke⟧，把 ⟦og⟧ 改成 ⟦eller⟧"}, {"prompt": "改错：⟦Hvis du er syg, så du skal blive hjemme i sengen.⟧ →", "kind": "write", "accept": ["Hvis du er syg, skal du blive hjemme i sengen."], "prefill": "Hvis du er syg, så du skal blive hjemme i sengen.", "explain": "从句在前时主句倒装，一般不要在主句前加 ⟦så du skal⟧"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（综合练习条件句与成对连词）", "items": [{"prompt": "如果我每天坐太久，我的背就会疼。（⟦få ondt i ryggen⟧）", "kind": "write", "accept": ["Hvis jeg sidder ned for længe hver dag, får jeg ondt i ryggen."]}, {"prompt": "这道菜既健康又便宜。（⟦denne ret⟧）", "kind": "write", "accept": ["Denne ret er både sund og billig."]}, {"prompt": "他既不会骑车，也不会游泳。", "kind": "write", "accept": ["Han kan hverken cykle eller svømme."]}, {"prompt": "如果你不减少喝咖啡，晚上就睡不好。", "kind": "write", "accept": ["Hvis du ikke skærer ned på kaffe, sover du ikke godt om natten."]}, {"prompt": "明天早上我们要么吃鸡蛋，要么吃黑麦面包。", "kind": "write", "accept": ["I morgen tidlig spiser vi enten æg eller rugbrød."]}]}], "clips": {"en travl arbejdsuge kan hurtigt tage energien hvis man ikke passer på sin krop": "b9742cb41893a70f", "her er fire enkle råd fra vores sundhedsklinik": "c0b9b6825de1c67b", "for det første er søvn vigtig hvis du ikke sover syv til otte timer hver nat bliver du hurtigt træt og mister koncentrationen": "f61cbe9d84c1647c", "om aftenen er det klogt at lægge telefonen væk en time før sengetid så man hverken tjekker arbejdsmail eller ser urolige nyheder i sengen": "35d6a94253c4bd51", "for det andet giver daglig bevægelse overskud hvis vejret er tørt kan du cykle på arbejde i stedet for at tage bilen": "cd0799d7c2ea9a52", "det er både godt for miljøet og billigt for din økonomi": "efd86677986b299a", "for det tredje handler sundhed om madvaner": "fd31e91f1abcb8ed", "til frokost kan du vælge enten mørkt rugbrød med fisk eller en stor salat med grøntsager og fuldkorn hvis du skærer ned på sukker og søde drikke om eftermiddagen holder dit blodsukker sig stabilt hele dagen": "6621cd8c7a2f062d", "sofie 29 år": "43ef1e98f4db7ebe", "jeg arbejder på kontor hele dagen og sidder ned i otte timer": "3932222bc4f5f960", "når jeg kommer hjem er jeg træt og jeg gider hverken lave mad eller gå i fitnesscenter": "3f1589f3a4b1b168", "hvad kan jeg gøre": "15134fe3f524bf8a", "mikkel 41 år": "730bde9d57c32b12", "jeg drikker ofte fire eller fem kopper kaffe om dagen — nogle gange også kl 20 om aftenen": "f0db289810e098cb", "om natten ligger jeg vågen i lang tid og jeg sover dårligt": "c3b49f2544eb694a", "ida 35 år": "c10c194f651fc11d", "jeg tjekker altid sociale medier i sengen før sengetid selvom jeg ved at det ikke er sundt": "96ff12e48aed15a8", "om morgenen vågner jeg med hovedpine og uden energi": "36553b6938dc1050", "hvis du sidder stille hele dagen har din krop brug for let bevægelse": "9cdbda64a58c571a", "du behøver ikke tage i fitnesscenter — gå en rask tur på tyve minutter efter arbejde eller cykl til kontoret et par gange om ugen": "f523c7edb2448c03", "blåt lys fra skærme fortæller hjernen at det stadig er dag": "aa1edcce81c49895", "læg mobilen i stuen om aftenen og læs i stedet en almindelig bog": "14b0ad8febaaeef5", "hvis du dropper skærmen en time før sengetid falder du hurtigere i søvn": "b3bab7629ae11f99", "hvis man vil tabe sig hurtigt er det en god idé at spise meget protein til morgenmad og undgå hvidt brød og pasta i hverdagene": "f8c0741180f33203", "koffein bliver i kroppen i mange timer": "496674a05e4b0cc0", "prøv at drikke din sidste kop kaffe før kl 14": "4296e658a8aaf3a4", "om eftermiddagen og aftenen kan du vælge enten urtete eller et stort glas vand med citron": "7897396aec0c5adc", "at sove": "e74687c3a87e9274", "at vælge": "01ca259caee9a254", "at skære ned på": "e3b715a7d22650a2", "at droppe": "ced77d6efc4ecc7a", "at bevæge sig": "efbea5fbc7e04414", "at slukke": "e1131806955bf792", "at anbefale": "0d8b0c92e1330b8c", "et råd": "1f8bb77091b68ee8", "en hverdag": "74c6c170ba1a3096", "en vane": "d73290fb563af5be", "sundhed": "024d7c158e6ebfa5", "søvn": "27fc046a9f9abdec", "skærmtid": "d0313aa831df3afe", "fuldkorn": "da6445e8a2a4bfca", "en hovedpine": "5a18efdaf8ae50ba", "klog": "20862b9cc989e86b", "travl": "0a24298c8fa6bdcc", "hvis": "7f481cf50b5a7f7c", "både og": "a98019e92cdee2c5", "hverken eller": "8c93fb332601b979"}, "key": "ncd2-L11"}, {"book": "ncd2", "lesson": 12, "title_da": "Da toget stod stille i to timer", "title_zh": "当火车停运两小时", "grammar": "形容词加 -t 变方式副词（hurtigt / langsomt）· -ig 结尾副词语音规律（-igt 中 g/t 均不发音）· 程度副词修饰形容词不加 -t（rigtig god）· 突发事件叙事弧线", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Da toget stod stille i to timer（叙事短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Fredag eftermiddag tog jeg intercitytoget fra Odense til København.", "a": "6cf9d22358aebb97", "dur": 4.96}, {"id": "a2", "who": "narrator", "da": "I begyndelsen kørte toget [[hurtigt]] og [[roligt]], og udsigten over havet var **rigtig god**.", "a": "8f7a8d6dc2c8fe6f", "dur": 5.0}, {"id": "a3", "who": "narrator", "da": "Jeg sad og læste avis, mens folk omkring mig snakkede stille sammen.", "a": "57f7941ef719db28", "dur": 3.76}], "zh": "周五下午，我搭乘城际列车从欧登塞前往哥本哈根。起初列车行驶得又快又平稳，窗外的海景也非常好。我坐在座位上看报，周围的乘客轻声交谈着。"}, {"segs": [{"id": "a4", "who": "narrator", "da": "Pludselig bremsede toget [[langsomt]], og midt ude på Storebæltsbroen standsede det helt.", "a": "9933093c57fce3b6", "dur": 5.32}, {"id": "a5", "who": "narrator", "da": "Efter ti minutter forklarede togføreren [[roligt]] i højttaleren, at der var en teknisk fejl på skinnerne foran os, så vi måtte vente.", "a": "cebe39a2e4f518c9", "dur": 6.72}], "zh": "突然，火车慢慢刹了车，在大贝尔特桥的正中央彻底停了下来。十分钟后，列车长在广播里冷静地解释说，前方铁轨出现了技术故障，因此我们不得不等待。"}, {"segs": [{"id": "a6", "who": "narrator", "da": "Først sukkede mange passagerer utålmodigt, fordi det var fredag og alle gerne ville hurtigt hjem.", "a": "6c5ca8264c3d450f", "dur": 4.72}, {"id": "a7", "who": "narrator", "da": "Men heldigvis havde en ældre dame over for mig en stor termoflaske med varm kaffe og hjemmebagte småkager.", "a": "f66a867acbe22650", "dur": 6.76}, {"id": "a8", "who": "narrator", "da": "Hun smilede og delte dem [[venligt]] ud til hele vores bord.", "a": "a3fcdffc5ae0f37b", "dur": 3.08}, {"id": "a9", "who": "narrator", "da": "En ung studerende fortalte sjove historier, og tiden gik pludselig forbavsende [[hurtigt]].", "a": "512099ee4c3f2307", "dur": 4.84}], "zh": "一开始，许多乘客不耐烦地叹起气来，因为这天是周五，大家都想早点回家。但幸运的是，我对面坐着一位老太太，带了一大保温瓶热咖啡和自制小饼干。她微笑着热情地分给我们整张桌子的人。一位年轻大学生还讲了有趣的故事，时间竟然飞快地过去了。"}, {"segs": [{"id": "a10", "who": "narrator", "da": "To timer senere ankom et erstatningstog, og vi kom [[sikkert]] frem til Hovedbanegården.", "a": "6301e333725e2fc5", "dur": 4.48}, {"id": "a11", "who": "narrator", "da": "Det blev faktisk en **virkelig uforglemmelig** togtur!", "a": "e5d96c2cbb05b484", "dur": 2.76}], "zh": "两小时后，一列接驳替代火车赶到了，我们平安抵达了哥本哈根中央火车站。这竟然成了一次真正难忘的火车之旅！"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Undskyld, jeg bliver forsinket!（对标 DU3 Modul 2 Skrivning Opgave 1：突发状况通知邮件）", "scene": null, "paras": [{"cue": "来信｜Fra: Kasper", "segs": [{"id": "b1", "who": "narrator", "da": "Hej Maja", "a": "261f4497d0647921", "dur": 1.04}, {"id": "b2", "who": "narrator", "da": "Klokken er allerede 16.15, og vi andre sidder klar i caféen.", "nl": true, "a": "dfae5e8f0bed5e59", "dur": 3.48}, {"id": "b3", "who": "narrator", "da": "Hvor er du henne?", "a": "6ad6a8ad4c6b901a", "dur": 1.2}, {"id": "b4", "who": "narrator", "da": "Er der sket noget undervejs?", "a": "6f3cdcb78921d2d4", "dur": 1.68}, {"id": "b5", "who": "narrator", "da": "Hvornår tror du, at du kan være her?", "a": "6f3f75be9aada908", "dur": 2.24}, {"id": "b6", "who": "narrator", "da": "Hilsen Kasper", "nl": true, "a": "ad6d38c13be28546", "dur": 1.4}]}, {"cue": "高分回复示范（92 词）｜Til: Kasper Emne: Forsinket på Storebæltsbroen", "segs": [{"id": "b7", "who": "narrator", "da": "Hej Kasper", "a": "196b3960b9055703", "dur": 0.88}]}, {"segs": [{"id": "b8", "who": "narrator", "da": "Undskyld, at jeg ikke har skrevet før!", "a": "b9e964372c457a98", "dur": 1.84}, {"id": "b9", "who": "narrator", "da": "Jeg tog toget fra Odense i god tid, og det gik [[fint]] i starten.", "a": "fb225c868d30b8b8", "dur": 3.6}, {"id": "b10", "who": "narrator", "da": "Men pludselig standsede toget midt på Storebæltsbroen på grund af en teknisk fejl.", "a": "0cb883e6db7a350c", "dur": 4.72}]}, {"segs": [{"id": "b11", "who": "narrator", "da": "Vi stod stille i næsten to timer, hvilket var **temmelig træls**.", "a": "bb025bf226fd2fcd", "dur": 3.28}, {"id": "b12", "who": "narrator", "da": "Heldigvis havde en sød dame kaffe med, så ventetiden føltes ikke så slem.", "a": "5eecd2d82fac8c0e", "dur": 4.36}, {"id": "b13", "who": "narrator", "da": "Nu er vi lige kørt ind i et erstatningstog, og vi kører [[hurtigt]] mod København.", "a": "2dc6ba75fec3743c", "dur": 3.84}, {"id": "b14", "who": "narrator", "da": "Jeg regner med at være ved caféen omkring klokken 17.30.", "a": "94c3042a3053bb4f", "dur": 3.12}]}, {"segs": [{"id": "b15", "who": "narrator", "da": "I må endelig begynde uden mig!", "a": "6b0043168f75d513", "dur": 2.12}, {"id": "b16", "who": "narrator", "da": "Kh Maja", "nl": true, "a": "6b1b943d9cea7eb6", "dur": 2.08}], "zh_all": "卡斯珀来信：嗨，玛雅！已经四点一刻了，我们其他人都在咖啡馆坐好等着了。你在哪儿呢？路上发生什么事了吗？你觉得什么时候能到？卡斯珀。\n玛雅回信：嗨，卡斯珀！抱歉没有早点给你写信！我提前坐上了从欧登塞出发的火车，一开始还很顺利。但因为技术故障，火车突然在大贝尔特桥正中央停住了。我们一动不动停了将近两小时，真是相当烦人。幸好有位好心的女士带了咖啡，所以等待的时间感觉没那么糟。现在我们刚换上接驳列车，正在飞快地往哥本哈根开。我预计大约五点半能到咖啡馆。你们千万先开始，不用等我！玛雅。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "刹车，减速", "note": "动词 [har] · bremser, bremsede, har bremset", "segs": [{"id": "g1", "who": "narrator", "da": "at bremse", "say": "at bremse. bremser, bremsede, har bremset.", "a": "1d1669807311169d", "dur": 4.76}]}, {"zh": "停下（不及物停住用 er）", "note": "动词 · standser, standsede, er standset / har standset", "segs": [{"id": "g2", "who": "narrator", "da": "at standse", "say": "at standse. standser, standsede, er standset eller har standset.", "a": "d8318eb5fa515df8", "dur": 6.2}]}, {"zh": "解释，说明", "note": "动词 [har] · forklarer, forklarede, har forklaret", "segs": [{"id": "g3", "who": "narrator", "da": "at forklare", "say": "at forklare. forklarer, forklarede, har forklaret.", "a": "d5555189e4d36535", "dur": 5.84}]}, {"zh": "叹气", "note": "动词 [har] · sukker, sukkede, har sukket", "segs": [{"id": "g4", "who": "narrator", "da": "at sukke", "say": "at sukke. sukker, sukkede, har sukket.", "a": "22b8ec09157fde3e", "dur": 4.8}]}, {"zh": "分发，分享", "note": "动词 [har] · deler, delte, har delt ud", "segs": [{"id": "g5", "who": "narrator", "da": "at dele ud", "say": "at dele ud. deler, delte, har delt ud.", "a": "fcca594994894088", "dur": 4.24}]}, {"zh": "到达，抵达", "note": "动词 · ankommer, ankom, er ankommet", "segs": [{"id": "g6", "who": "narrator", "da": "at ankomme", "say": "at ankomme. ankommer, ankom, er ankommet.", "a": "89050dffa893c7ba", "dur": 4.32}]}, {"zh": "晚点，迟到", "note": "动词 · bliver, blev, er blevet forsinket", "segs": [{"id": "g7", "who": "narrator", "da": "at blive forsinket", "say": "at blive forsinket. bliver, blev, er blevet forsinket.", "a": "05ad5a7b21da2ca7", "dur": 4.44}]}, {"zh": "预计，指望（regne med at...）", "note": "动词 [har] · regner, regnede, har regnet med", "segs": [{"id": "g8", "who": "narrator", "da": "at regne med", "say": "at regne med. regner, regnede, har regnet med.", "a": "57eb7dcff35d639e", "dur": 4.76}]}, {"zh": "风景，视野", "note": "名词 · udsigten, udsigter, udsigterne", "segs": [{"id": "g9", "who": "narrator", "da": "en udsigt", "say": "en udsigt. udsigten, udsigter, udsigterne.", "a": "2779b93f4846d9f5", "dur": 4.88}]}, {"zh": "乘客", "note": "名词 · passageren, passagerer, passagererne", "segs": [{"id": "g10", "who": "narrator", "da": "en passager", "say": "en passager. passageren, passagerer, passagererne.", "a": "ccab306b888e3a8d", "dur": 6.4}]}, {"zh": "列车长，火车司机", "note": "名词 · togføreren, togfører, togførerne", "segs": [{"id": "g11", "who": "narrator", "da": "en togfører", "say": "en togfører. togføreren, togfører, togførerne.", "a": "8801901bbe6be8d2", "dur": 4.92}]}, {"zh": "扬声器，广播喇叭", "note": "名词 · højttaleren, højttalere, højttalerne", "segs": [{"id": "g12", "who": "narrator", "da": "en højttaler", "say": "en højttaler. højttaleren, højttalere, højttalerne.", "a": "52605aa276cd6340", "dur": 5.32}]}, {"zh": "技术故障（en fejl 单复同形）", "note": "名词 · fejlen, fejl, fejlene", "segs": [{"id": "g13", "who": "narrator", "da": "en teknisk fejl", "say": "en teknisk fejl. fejlen, fejl, fejlene.", "a": "49a415cae2208e20", "dur": 5.52}]}, {"zh": "延误，晚点", "note": "名词 · forsinkelsen, forsinkelser, forsinkelserne", "segs": [{"id": "g14", "who": "narrator", "da": "en forsinkelse", "say": "en forsinkelse. forsinkelsen, forsinkelser, forsinkelserne.", "a": "4cc6ae3ecdcdb026", "dur": 6.08}]}, {"zh": "替代列车，接驳火车", "note": "名词 · erstatningstoget, erstatningstog, erstatningstogene", "segs": [{"id": "g15", "who": "narrator", "da": "et erstatningstog", "say": "et erstatningstog. erstatningstoget, erstatningstog, erstatningstogene.", "a": "949751a06eea8b2a", "dur": 6.08}]}, {"zh": "快的", "note": "形容词 · -t, -e", "segs": [{"id": "g16", "who": "narrator", "da": "hurtig", "say": "hurtig.", "a": "4edb9f3f55f0de18", "dur": 0.84}]}, {"zh": "平静的，安静的", "note": "形容词 · -t, -e", "segs": [{"id": "g17", "who": "narrator", "da": "rolig", "say": "rolig.", "a": "c7ae218ea26ec4b3", "dur": 1.08}]}, {"zh": "友好的", "note": "形容词 · -t, -e", "segs": [{"id": "g18", "who": "narrator", "da": "venlig", "say": "venlig.", "a": "5f0ac48a1c2a1384", "dur": 1.04}]}, {"zh": "安全的，肯定的", "note": "形容词 · sikkert, sikre", "segs": [{"id": "g19", "who": "narrator", "da": "sikker", "say": "sikker. sikkert, sikre.", "a": "53f1eb376b0f2429", "dur": 2.96}]}, {"zh": "突然", "note": "副词", "segs": [{"id": "g20", "who": "narrator", "da": "pludselig", "a": "de52280731f6b83f", "dur": 1.04}]}, {"zh": "幸运的是", "note": "副词", "segs": [{"id": "g21", "who": "narrator", "da": "heldigvis", "a": "46c201c977e8b043", "dur": 1.16}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "动词 [har]", "da": "at bremse", "zh": "刹车，减速", "forms": "bremser, bremsede, har bremset"}, {"pos": "动词 [er]", "da": "at standse", "zh": "停下（不及物停住用 er）", "forms": "standser, standsede, er standset / har standset"}, {"pos": "动词 [har]", "da": "at forklare", "zh": "解释，说明", "forms": "forklarer, forklarede, har forklaret"}, {"pos": "动词 [har]", "da": "at sukke", "zh": "叹气", "forms": "sukker, sukkede, har sukket"}, {"pos": "动词 [har]", "da": "at dele ud", "zh": "分发，分享", "forms": "deler, delte, har delt ud"}, {"pos": "动词 [er]", "da": "at ankomme", "zh": "到达，抵达", "forms": "ankommer, ankom, er ankommet"}, {"pos": "动词 [er]", "da": "at blive forsinket", "zh": "晚点，迟到", "forms": "bliver, blev, er blevet forsinket"}, {"pos": "动词 [har]", "da": "at regne med", "zh": "预计，指望（regne med at...）", "forms": "regner, regnede, har regnet med"}, {"pos": "名词", "da": "en udsigt", "zh": "风景，视野", "forms": "udsigten, udsigter, udsigterne"}, {"pos": "名词", "da": "en passager", "zh": "乘客", "forms": "passageren, passagerer, passagererne"}, {"pos": "名词", "da": "en togfører", "zh": "列车长，火车司机", "forms": "togføreren, togfører, togførerne"}, {"pos": "名词", "da": "en højttaler", "zh": "扬声器，广播喇叭", "forms": "højttaleren, højttalere, højttalerne"}, {"pos": "名词", "da": "en teknisk fejl", "zh": "技术故障（en fejl 单复同形）", "forms": "fejlen, fejl, fejlene"}, {"pos": "名词", "da": "en forsinkelse", "zh": "延误，晚点", "forms": "forsinkelsen, forsinkelser, forsinkelserne"}, {"pos": "名词", "da": "et erstatningstog", "zh": "替代列车，接驳火车", "forms": "erstatningstoget, erstatningstog, erstatningstogene"}, {"pos": "形容词", "da": "hurtig / rolig", "zh": "快的 / 平静的，安静的", "forms": "hurtig (-t, -e) / rolig (-t, -e"}, {"pos": "形容词", "da": "venlig / sikker", "zh": "友好的 / 安全的，肯定的", "forms": "venlig (-t, -e) / sikker (sikkert, sikre"}, {"pos": "副词", "da": "pludselig / heldigvis", "zh": "突然 / 幸运的是", "forms": "不变"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "火车在桥上开得很慢，因为天气很糟糕。", "answer": "Toget kørte langsomt på broen, fordi vejret var meget dårligt."}, {"zh": "遗憾的是，由于一场故障，我的航班延误了两个小时。（mit fly）", "answer": "Desværre blev mit fly forsinket i to timer på grund af en teknisk fejl."}, {"zh": "幸好我们最后平安到达了机场。（sikkert）", "answer": "Heldigvis kom vi sikkert frem til lufthavnen til sidst."}]}, {"id": "A", "type": "drill", "title": "练习 A：词形二选一（区分形容词、加 -t 方式副词与不加 -t 的程度副词）", "items": [{"prompt": "Toget kørte meget {{_}} (⟦hurtig / hurtigt⟧) mellem Odense og Nyborg.", "kind": "cloze", "blanks": [["hurtigt"]], "explain": "修饰动词 ⟦kørte⟧，加 ⟦-t⟧"}, {"prompt": "Vejret over Storebælt var {{_}} (⟦rigtig / rigtigt⟧) dejligt i fredags.", "kind": "cloze", "blanks": [["rigtig"]], "explain": "程度副词修饰形容词 ⟦dejligt⟧，不加 ⟦-t⟧"}, {"prompt": "Togføreren forklarede problemet {{_}} (⟦rolig / roligt⟧) i højttaleren.", "kind": "cloze", "blanks": [["roligt"]], "explain": "修饰动词 ⟦forklarede⟧，加 ⟦-t⟧"}, {"prompt": "Du svarede {{_}} (⟦rigtig / rigtigt⟧) på alle spørgsmålene i testen!", "kind": "cloze", "blanks": [["rigtigt"]], "explain": "修饰动词 ⟦svarede⟧，表“答对”，必须加 ⟦-t⟧"}, {"prompt": "Passagererne snakkede {{_}} (⟦stille / stillet⟧) sammen, mens de læste.", "kind": "cloze", "blanks": [["stille"]], "explain": "以 ⟦-e⟧ 结尾不变形，绝不加 ⟦-t⟧"}, {"prompt": "Det var en {{_}} (⟦fantastisk / fantastiskt⟧) og uforglemmelig rejse.", "kind": "cloze", "blanks": [["fantastisk"]], "explain": "以 ⟦-sk⟧ 结尾不变形，绝不加 ⟦-t⟧"}, {"prompt": "Den ældre dame smilede og delte småkager {{_}} (⟦venlig / venligt⟧) ud.", "kind": "cloze", "blanks": [["venligt"]], "explain": "修饰动词 ⟦delte ud⟧，加 ⟦-t⟧；注意 ⟦g/t⟧ 不发音"}]}, {"id": "B", "type": "drill", "title": "练习 B：用突发叙事弧线连接词填空（从以下选词，每词只用一次：I begyndelsen, Pludselig, Desværre, Heldigvis, Til sidst, på grund af）", "items": [{"prompt": "{{_}} kørte bussen helt normalt gennem byen.", "kind": "cloze", "blanks": [["I begyndelsen"]], "explain": "或句首后接倒装 ⟦kørte bussen⟧"}, {"prompt": "{{_}} hørte vi en høj lyd fra motoren, og bussen standsede.", "kind": "cloze", "blanks": [["Pludselig"]]}, {"prompt": "Chaufføren sagde, at vi ikke kunne køre videre {{_}} en teknisk fejl.", "kind": "cloze", "blanks": [["på grund af"]]}, {"prompt": "{{_}} kom den næste bus først efter 40 minutter i regnvejr.", "kind": "cloze", "blanks": [["Desværre"]]}, {"prompt": "{{_}} havde jeg taget en varm jakke og en paraply med i tasken!", "kind": "cloze", "blanks": [["Heldigvis"]]}, {"prompt": "{{_}} kom vi alle sammen sikkert frem til skolen.", "kind": "cloze", "blanks": [["Til sidst"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（综合练习副词词尾与旅行叙事）", "items": [{"prompt": "火车在桥上开得很慢，因为天气很糟糕。", "kind": "write", "accept": ["Toget kørte langsomt på broen, fordi vejret var meget dårligt."]}, {"prompt": "她真是个非常友好的人！（用 ⟦rigtig⟧）", "kind": "write", "accept": ["Hun er virkelig / faktisk en rigtig venlig person!"]}, {"prompt": "遗憾的是，由于一场故障，我的航班延误了两个小时。（⟦mit fly⟧）", "kind": "write", "accept": ["Desværre blev mit fly forsinket i to timer på grund af en teknisk fejl."]}, {"prompt": "幸好我们最后平安到达了机场。（⟦sikkert⟧）", "kind": "write", "accept": ["Heldigvis kom vi sikkert frem til lufthavnen til sidst."]}, {"prompt": "请慢一点说，我还在学丹麦语。", "kind": "write", "accept": ["Vil du ikke nok tale lidt langsommere? / Tal venligst lidt langsomt, for jeg lærer stadig dansk."]}]}], "clips": {"fredag eftermiddag tog jeg intercitytoget fra odense til københavn": "6cf9d22358aebb97", "i begyndelsen kørte toget hurtigt og roligt og udsigten over havet var rigtig god": "8f7a8d6dc2c8fe6f", "jeg sad og læste avis mens folk omkring mig snakkede stille sammen": "57f7941ef719db28", "pludselig bremsede toget langsomt og midt ude på storebæltsbroen standsede det helt": "9933093c57fce3b6", "efter ti minutter forklarede togføreren roligt i højttaleren at der var en teknisk fejl på skinnerne foran os så vi måtte vente": "cebe39a2e4f518c9", "først sukkede mange passagerer utålmodigt fordi det var fredag og alle gerne ville hurtigt hjem": "6c5ca8264c3d450f", "men heldigvis havde en ældre dame over for mig en stor termoflaske med varm kaffe og hjemmebagte småkager": "f66a867acbe22650", "hun smilede og delte dem venligt ud til hele vores bord": "a3fcdffc5ae0f37b", "en ung studerende fortalte sjove historier og tiden gik pludselig forbavsende hurtigt": "512099ee4c3f2307", "to timer senere ankom et erstatningstog og vi kom sikkert frem til hovedbanegården": "6301e333725e2fc5", "det blev faktisk en virkelig uforglemmelig togtur": "e5d96c2cbb05b484", "hej maja": "261f4497d0647921", "klokken er allerede 1615 og vi andre sidder klar i caféen": "dfae5e8f0bed5e59", "hvor er du henne": "6ad6a8ad4c6b901a", "er der sket noget undervejs": "6f3cdcb78921d2d4", "hvornår tror du at du kan være her": "6f3f75be9aada908", "hilsen kasper": "ad6d38c13be28546", "hej kasper": "196b3960b9055703", "undskyld at jeg ikke har skrevet før": "b9e964372c457a98", "jeg tog toget fra odense i god tid og det gik fint i starten": "fb225c868d30b8b8", "men pludselig standsede toget midt på storebæltsbroen på grund af en teknisk fejl": "0cb883e6db7a350c", "vi stod stille i næsten to timer hvilket var temmelig træls": "bb025bf226fd2fcd", "heldigvis havde en sød dame kaffe med så ventetiden føltes ikke så slem": "5eecd2d82fac8c0e", "nu er vi lige kørt ind i et erstatningstog og vi kører hurtigt mod københavn": "2dc6ba75fec3743c", "jeg regner med at være ved caféen omkring klokken 1730": "94c3042a3053bb4f", "i må endelig begynde uden mig": "6b0043168f75d513", "kh maja": "6b1b943d9cea7eb6", "at bremse": "1d1669807311169d", "at standse": "d8318eb5fa515df8", "at forklare": "d5555189e4d36535", "at sukke": "22b8ec09157fde3e", "at dele ud": "fcca594994894088", "at ankomme": "89050dffa893c7ba", "at blive forsinket": "05ad5a7b21da2ca7", "at regne med": "57eb7dcff35d639e", "en udsigt": "2779b93f4846d9f5", "en passager": "ccab306b888e3a8d", "en togfører": "8801901bbe6be8d2", "en højttaler": "52605aa276cd6340", "en teknisk fejl": "49a415cae2208e20", "en forsinkelse": "4cc6ae3ecdcdb026", "et erstatningstog": "949751a06eea8b2a", "hurtig": "4edb9f3f55f0de18", "rolig": "c7ae218ea26ec4b3", "venlig": "5f0ac48a1c2a1384", "sikker": "53f1eb376b0f2429", "pludselig": "de52280731f6b83f", "heldigvis": "46c201c977e8b043"}, "key": "ncd2-L12"}, {"book": "ncd2", "lesson": 13, "title_da": "Tre studerende om deres bolig i Aarhus", "title_zh": "三位大学生谈奥胡斯的住处", "grammar": "关系从句代词 som 与 der 的精确法则（主语可互换 vs 宾语及介词句只能用 som）· 关系从句内副词前置语序 · 三人物信息对比定位法", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：At finde en bolig som studerende i Aarhus（叙事说明短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Når nye studerende flytter til Aarhus i august, er det første store projekt ofte at finde et godt sted at bo.", "a": "b8e816f08a98917d", "dur": 6.8}, {"id": "a2", "who": "narrator", "da": "Der findes især tre muligheder i byen.", "a": "3861a673de897642", "dur": 2.64}], "zh": "当新生在八月搬到奥胡斯时，第一项大工程往往就是找一个好住处。城里主要有三种选择。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Mange unge starter på et kollegium, [[der ofte er]] den billigste løsning.", "a": "94007456d7fa322a", "dur": 4.24}, {"id": "a4", "who": "narrator", "da": "Her får man et lille værelse, [[som ligger]] på en gang med ti andre studerende, og et stort fælleskøkken, **som alle deler**.", "a": "92eb0df44db2a7fc", "dur": 6.8}, {"id": "a5", "who": "narrator", "da": "Det er nemt at få nye venner her, fordi man møder naboer, [[der altid hjælper]] hinanden med lektierne.", "a": "51e2d8e8eabce4b2", "dur": 4.32}], "zh": "许多年轻人会从学生宿舍（kollegium）开始，这通常是最便宜的方案。在这里你可以分到一个小房间，它位于和另外十名学生共用的走廊上，还有一个大家共用的大公共厨房。在这里很容易交到新朋友，因为你会遇到总是互相帮忙做作业的邻居。"}, {"segs": [{"id": "a6", "who": "narrator", "da": "Andre foretrækker en delelejlighed i midtbyen sammen med gode venner.", "a": "f3f65ac4a9c438f5", "dur": 4.4}, {"id": "a7", "who": "narrator", "da": "Lejligheden, **som de lejer** sammen, har tit en hyggelig stue og et køkken, **som de ikke behøver at dele** med fremmede.", "a": "549ea93b36916b68", "dur": 5.92}], "zh": "另一些人则更喜欢和好朋友一起在市中心合租一套公寓（delelejlighed）。他们一起租的这套公寓通常带有一个温馨的客厅，以及一间不需要和陌生人共用的厨房。"}, {"segs": [{"id": "a8", "who": "narrator", "da": "Endelig vælger nogle at leje et værelse hos en dansk familie i et roligt kvarter.", "a": "fbdea1d971f46b04", "dur": 5.0}, {"id": "a9", "who": "narrator", "da": "Familien, **som man bor hos**, giver ofte gode råd om livet i Aarhus, selvom husreglerne nogle gange er lidt strengere.", "a": "659e00e5d1520554", "dur": 6.52}], "zh": "最后，还有人选择在安静的街区向一个丹麦家庭租一个房间。寄宿家庭常常会提供许多关于奥胡斯生活的贴心建议，尽管家规有时候会稍微严格一点。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Tre studerende om deres bolig i Aarhus（对标 DU3 Modul 2 Læsning Opgave 4）", "scene": null, "paras": [{"cue": "Tre personer fortæller（三位学生的自述 A / B / C）", "segs": [{"id": "b1", "who": "narrator", "da": "Nicolai", "label": "A.", "a": "a0cabaa0dccacba8", "dur": 1.24}, {"id": "b2", "who": "narrator", "da": "Jeg læser biologi og bor på et stort kollegium, [[der ligger]] ti minutter på cykel fra universitetet.", "nl": true, "a": "92778b5d6f01c0b8", "dur": 4.92}, {"id": "b3", "who": "narrator", "da": "Huslejen, **som jeg betaler** hver måned, er heldigvis ikke så høj.", "a": "eb7aac8a41975b02", "dur": 3.72}, {"id": "b4", "who": "narrator", "da": "Jeg elsker det sociale liv på gangen og vores fredagsbar.", "a": "32d1636a37c0c6c6", "dur": 3.28}, {"id": "b5", "who": "narrator", "da": "Det eneste problem er fælleskøkkenet, [[som ofte er]] ret rodet, fordi nogle af mine naboer glemmer at vaske op efter sig.", "a": "8ddea99114896986", "dur": 5.56}]}, {"segs": [{"id": "b6", "who": "narrator", "da": "Clara", "label": "B.", "a": "fb6b9ff8326590c8", "dur": 0.88}, {"id": "b7", "who": "narrator", "da": "Jeg bor i en lys treværelses delelejlighed midt i Aarhus, **som jeg deler** med to gamle veninder fra gymnasiet.", "nl": true, "a": "f0433e09eb24f446", "dur": 5.92}, {"id": "b8", "who": "narrator", "da": "Vi har en dejlig altan, **som vi spiser morgenmad på**, når solen skinner.", "a": "add10751086ae421", "dur": 3.6}, {"id": "b9", "who": "narrator", "da": "Huslejen er desværre ret dyr, så jeg arbejder i et bageri hver weekend.", "a": "01bc8e87eaf1dfe1", "dur": 3.76}, {"id": "b10", "who": "narrator", "da": "Derudover er jeg lidt træt af støjen fra gaden, [[der ofte holder]] mig vågen om natten.", "a": "bacf647bac176e2b", "dur": 4.12}]}, {"segs": [{"id": "b11", "who": "narrator", "da": "Hassan", "label": "C.", "a": "d9fa806c316006c5", "dur": 1.04}, {"id": "b12", "who": "narrator", "da": "Jeg flyttede til Aarhus for at læse it og fandt et stille værelse hos en sød familie, **som jeg mødte** gennem en bekendt.", "nl": true, "a": "36099bd47c9c9699", "dur": 6.36}, {"id": "b13", "who": "narrator", "da": "Jeg bor i en forstad og tager bussen, [[der kører]] til universitetet på cirka 25 minutter hver morgen.", "a": "4164ca66bf1a30b1", "dur": 5.36}, {"id": "b14", "who": "narrator", "da": "Jeg er rigtig glad for roen, når jeg skal læse til eksamen, og én gang om ugen spiser jeg aftensmad med familien.", "a": "3faffd59acc3b801", "dur": 6.2}, {"id": "b15", "who": "narrator", "da": "Ulempen er bare, at jeg ikke må invitere mange gæster på besøg.", "a": "d721e66c24d0901c", "dur": 3.48}], "zh_all": "A. 尼古拉：我学的是生物学，住在一栋大型学生宿舍里，骑车去大学只要十分钟。幸好我每个月付的房租不算高。我特别喜欢走廊里的社交生活和我们的周五酒吧聚会。唯一的问题是我们共用的公共厨房经常乱糟糟的，因为有些邻居用完后总是忘了洗碗。\nB. 克拉拉：我住在奥胡斯市中心一套明亮的三居室合租公寓里，是和两位高中老闺蜜一起合租的。我们有一个很棒的阳台，出太阳时我们经常在上面吃早饭。遗憾的是房租相当贵，所以我每个周末都要在一家面包店打工。此外，街上的噪音经常在夜里吵得我睡不着，这让我有点烦。\nC. 哈桑：我搬到奥胡斯来学 IT，通过熟人介绍在一个友好的家庭里租到了一间安静的房间。我每天早上坐公交车去大学，大约需要 25 分钟。准备考试的时候能享受这份安静让我很开心，而且每周还有一次我和这家人一起吃晚饭。唯一的缺点是我不能邀请很多朋友来家里做客。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "分享，合租，分担", "note": "动词 [har] · deler, delte, har delt", "segs": [{"id": "g1", "who": "narrator", "da": "at dele", "say": "at dele. deler, delte, har delt.", "a": "7fa1e6be7e33a4c1", "dur": 4.68}]}, {"zh": "租（入），租借", "note": "动词 [har] · lejer, lejede, har lejet", "segs": [{"id": "g2", "who": "narrator", "da": "at leje", "say": "at leje. lejer, lejede, har lejet.", "a": "425e62eb2e88f739", "dur": 4.76}]}, {"zh": "更喜欢，偏爱", "note": "动词 [har] · foretrækker, foretrak, har foretrukket", "segs": [{"id": "g3", "who": "narrator", "da": "at foretrække", "say": "at foretrække. foretrækker, foretrak, har foretrukket.", "a": "af9c267e27d8b53e", "dur": 5.56}]}, {"zh": "需要，必须（多用于否定/疑问）", "note": "动词 [har] · behøver, behøvede, har behøvet", "segs": [{"id": "g4", "who": "narrator", "da": "at behøve", "say": "at behøve. behøver, behøvede, har behøvet.", "a": "6062a7d33d20e21c", "dur": 5.32}]}, {"zh": "洗碗", "note": "动词 [har] · vasker, vaskede, har vasket op", "segs": [{"id": "g5", "who": "narrator", "da": "at vaske op", "say": "at vaske op. vasker, vaskede, har vasket op.", "a": "2ce705d1b100550f", "dur": 5.68}]}, {"zh": "邀请（på besøg 来做客）", "note": "动词 [har] · inviterer, inviterede, har inviteret", "segs": [{"id": "g6", "who": "narrator", "da": "at invitere", "say": "at invitere. inviterer, inviterede, har inviteret.", "a": "d44e77a7560a7a3f", "dur": 5.96}]}, {"zh": "住房，居所", "note": "名词 · boligen, boliger, boligerne", "segs": [{"id": "g7", "who": "narrator", "da": "en bolig", "say": "en bolig. boligen, boliger, boligerne.", "a": "71c6cb8453fc7e42", "dur": 5.28}]}, {"zh": "学生宿舍（复数去 -um 变 -er）", "note": "名词 · kollegiet, ko
