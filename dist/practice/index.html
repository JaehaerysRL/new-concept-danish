<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCD 交互练习</title>
<style>
:root {
  --navy: #1B365D; --red: #C8102E; --teal: #006D77; --gold: #B45309; --gray: #475569;
  --bg: #F8FAFC; --surface: #FFFFFF; --border: #E2E8F0; --text: #0F172A; --muted: #64748B;
  --ok-bg: #ECFDF5; --ok: #047857; --bad-bg: #FDF2F4; --bad: var(--red);
  --chip: #F0F4F8; --chip-border: #CBD5E1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --navy: #93B4E0; --red: #F87171; --teal: #5EC4CC; --gold: #FBBF24; --gray: #94A3B8;
    --bg: #0B1220; --surface: #121B2E; --border: #23304A; --text: #E2E8F0; --muted: #94A3B8;
    --ok-bg: #062A22; --ok: #34D399; --bad-bg: #2A0F16;
    --chip: #1A2540; --chip-border: #334366;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
header { border-left: 4px solid var(--red); padding: 4px 0 4px 14px; margin-bottom: 18px; }
header .eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .02em; }
header h1 { margin: 2px 0 0; font-size: 24px; line-height: 1.3; color: var(--navy); }
header .zh { color: var(--muted); font-size: 15px; }
header .grammar { margin-top: 8px; font-size: 14px; color: var(--teal); }
.lesson-nav { display: flex; gap: 6px; align-items: center; margin: 0 0 14px; }
.lesson-nav select { flex: 1 1 auto; min-width: 0; font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.lesson-nav button { flex: none; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; }
.lesson-nav button:disabled { opacity: .4; cursor: default; }

nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: thin; }
nav.tabs button {
  flex: none; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 6px 12px; border-radius: 999px;
}
nav.tabs button[aria-selected="true"] { background: var(--navy); border-color: var(--navy); color: var(--bg); }
nav.tabs .score { font-size: 12px; opacity: .75; margin-left: 6px; font-variant-numeric: tabular-nums; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.panel h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.45; color: var(--navy); }
.instruction { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
.example { font-size: 14px; color: var(--muted); margin: 0 0 12px; font-style: italic; }
.counter { font-size: 13px; color: var(--muted); margin: 14px 0 6px; font-variant-numeric: tabular-nums; }

.prompt { font-size: 19px; line-height: 1.75; margin: 0 0 14px; overflow-wrap: anywhere; }
.prompt .da, .sent .da, .explain .da { font-style: italic; }
.prompt .wrong { text-decoration: underline wavy var(--red); text-underline-offset: 5px; font-style: italic; }
.prompt .zhq { font-size: 18px; }

.answer-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stem { font-style: italic; color: var(--navy); white-space: nowrap; }
input.answer, input.blank {
  font: inherit; color: var(--text); background: var(--bg);
  border: 1.5px solid var(--border); border-radius: 8px;
}
input.answer { flex: 1 1 260px; min-width: 0; font-size: 17px; padding: 9px 12px; }
input.blank { font-size: 17px; padding: 1px 8px; margin: 0 3px; max-width: 100%; font-style: italic; vertical-align: baseline; }
input.answer:focus, input.blank:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 20%, transparent); }
.is-ok { border-color: var(--ok) !important; }
.is-bad { border-color: var(--bad) !important; }

.kbd { display: flex; gap: 6px; margin-top: 8px; }
.kbd button { font: inherit; font-size: 15px; width: 36px; height: 32px; cursor: pointer; border: 1px solid var(--chip-border); background: var(--chip); color: var(--text); border-radius: 6px; }

.actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 15px; cursor: pointer; border-radius: 8px; padding: 8px 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--bg); font-weight: 600; }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { font: inherit; border: none; background: none; cursor: pointer; padding: 0 4px; font-size: 17px; color: var(--teal); vertical-align: -1px; }

.feedback { margin-top: 14px; border-radius: 8px; padding: 12px 14px; font-size: 15px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--ok-bg); border-left: 3px solid var(--ok); }
.feedback.bad { background: var(--bad-bg); border-left: 3px solid var(--bad); }
.feedback .title { font-weight: 600; margin-bottom: 4px; }
.feedback.ok .title { color: var(--ok); }
.feedback.bad .title { color: var(--bad); }
.feedback .row { margin-top: 4px; }
.feedback .label { color: var(--muted); font-size: 13px; margin-right: 6px; }
.feedback .sent { font-style: italic; }
.feedback .self { margin-top: 8px; font-size: 13px; padding: 4px 10px; }
.tok-bad { color: var(--bad); text-decoration: line-through; }
.tok-miss { color: var(--ok); font-weight: 600; background: color-mix(in srgb, var(--ok) 14%, transparent); border-radius: 3px; padding: 0 2px; }
.explain { margin-top: 6px; color: var(--text); font-size: 14px; }
.hint { margin-top: 10px; font-size: 14px; color: var(--gold); display: none; }
.hint.show { display: block; }

.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); border: none; padding: 0; cursor: pointer; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--bad); }
.dot.cur { outline: 2px solid var(--navy); outline-offset: 2px; }

/* order */
.build, .pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; padding: 10px; border-radius: 10px; }
.build { border: 1.5px dashed var(--chip-border); margin-bottom: 10px; }
.build.is-ok { border-style: solid; }
.build.is-bad { border-style: solid; }
.pool { background: var(--bg); }
.chip { font: inherit; font-size: 16px; cursor: pointer; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--chip-border); background: var(--chip); color: var(--text); font-style: italic; }
.chip:hover:not(:disabled) { border-color: var(--teal); }
.chip:disabled { cursor: default; }
.build .chip { background: var(--surface); border-color: var(--teal); }
.placeholder { color: var(--muted); font-size: 14px; align-self: center; }

/* flashcards */
.fc-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 12px; font-size: 14px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; border: none; background: var(--surface); color: var(--text); padding: 5px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--bg); }
.flash {
  min-height: 210px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 24px 16px; cursor: pointer; user-select: none;
}
.flash .pos { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; margin-bottom: 10px; }
.flash .front { font-size: 26px; font-weight: 600; color: var(--navy); }
.flash .front.zh { font-size: 21px; font-weight: 500; color: var(--text); }
.flash .back { margin-top: 12px; display: none; }
.flash.flipped .back { display: block; }
.flash .back .forms { font-style: italic; color: var(--teal); }
.flash .back .meaning { font-size: 17px; margin-top: 2px; }
.flash .back .word { font-size: 20px; font-weight: 600; color: var(--navy); }
.flash .tap { margin-top: 14px; font-size: 13px; color: var(--muted); }
.flash.flipped .tap { display: none; }
.done { text-align: center; padding: 30px 10px; }
.done .big { font-size: 40px; }

/* text reader */
.tx-bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin: 8px -20px 14px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.tx-bar .btn { padding: 6px 14px; }
.tx-bar .seg button { padding: 6px 10px; }
.tx-status { font-size: 13px; color: var(--muted); margin: -6px 0 12px; }
.tx-para { margin: 0 0 18px; }
.tx-who { font-size: 12px; font-weight: 600; color: var(--teal); letter-spacing: .02em; }
.tx-cue { font-size: 13px; font-weight: 600; color: var(--gold); margin-bottom: 4px; }
.tx-da { font-size: 19px; line-height: 1.85; margin: 0; overflow-wrap: anywhere; }
.tx-line { display: flex; gap: 8px; align-items: baseline; }
.tx-line .tx-who { flex: none; min-width: 18px; }
.s { cursor: pointer; border-radius: 4px; transition: background-color .15s; -webkit-tap-highlight-color: transparent; }
.s:hover { background: color-mix(in srgb, var(--teal) 12%, transparent); }
.s.playing { background: color-mix(in srgb, var(--gold) 30%, transparent); }
.s .hl { color: var(--navy); font-weight: 600; }
.s strong { color: var(--red); }
.tx-zh { font-size: 15px; color: var(--muted); margin-top: 4px; }
.tx-zh-all { white-space: pre-line; margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--border); }
.tx-label { margin-right: 6px; }
.hide-zh .tx-zh { display: none; }
.tx-note { font-size: 13px; color: var(--muted); margin-top: 2px; }
.tx-note summary { cursor: pointer; width: fit-content; }
.tx-words .tx-para { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2px 16px; align-items: baseline;
  margin: 0; padding: 9px 0; border-bottom: 1px solid var(--border); }
.tx-words .tx-da { font-size: 18px; font-weight: 600; color: var(--navy); line-height: 1.5; }
.tx-words .tx-zh { margin: 0; color: var(--text); }
@media (max-width: 520px) { .tx-words .tx-para { grid-template-columns: minmax(0, 1fr); } .tx-bar { margin: 8px -14px 14px; padding: 8px 14px; } }

footer { margin-top: 22px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
footer button { font: inherit; font-size: 13px; background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
.tts-warn { font-size: 13px; color: var(--gold); margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lesson-nav" id="lessonNav"></div>
  <header id="hdr"></header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="panel" id="panel"></main>
  <footer>
    <span>进度只保存在本机浏览器中。快捷键：Enter 检查 / 下一题</span>
    <button id="reset" type="button">重置本课进度</button>
  </footer>
</div>

<script>
const LESSONS = [{"book": "ncd1", "lesson": 1, "title_da": "Undskyld, er det plads 14?", "title_zh": "请问，这是 14 号座吗？", "grammar": "主格人称代词 · 是非问句倒装（动词 + 主语）· Ja / Nej / Jo 应答法则 · 简短回答（Det er det）", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "从哥本哈根开往奥胡斯的 DSB 城际列车上，Emma 拿着车票核对座位号，发现座位上已经坐着一位丹麦男生 Jonas。", "paras": [{"zh": "打扰一下，这是 14 号座吗？", "note": "undskyld ˈɔnsgylˀ（末尾 d 完全不发音，u 读接近 o，末尾带轻微喉塞音 ˀ）；er det 连读弱化为 æɐ̯ dɛ；plads ˈplas（d 不发音）。", "segs": [{"id": "dialog-1", "who": "Emma", "da": "Undskyld, er det plads 14?", "a": "0fda20caf10e0332", "dur": 1.88}]}, {"zh": "是的，是 14 号。你也有 14 号的票吗？", "note": "det er det de ˈæɐ̯ de（det 末尾的 t 永远不发音！重音落在第一个 er 上）；også ˈʌsə（g 不发音）；billet biˈlɛd（法语借词，重音在第二音节）。", "segs": [{"id": "dialog-2", "who": "Jonas", "da": "Ja, det er det. Har du også billet til nummer 14?", "a": "e4244e806c3235ad", "dur": 3.16}]}, {"zh": "是的，我想你坐了我的座位。你看：23 次列车，7 号车厢，14 号座。", "note": "jeg ˈjɑɪ̯；sidder ˈseðɐ（dd 读作软 d ð——舌尖轻抵下齿背，气流从舌两侧轻擦出来，不要读成英文的 d；词尾 -er 弱读成 ɐ）；tog ˈtɔʊ̯ˀ；vogn ˈvʌʊ̯ˀn。", "segs": [{"id": "dialog-3", "who": "Emma", "da": "Ja, jeg tror, du sidder på min plads. Se: tog 23, vogn 7, plads 14.", "a": "38804dea883f29a5", "dur": 5.08}]}, {"zh": "哦，真抱歉！难道这不是 6 号车厢吗？", "note": "ikke ˈeɡə，但在日常语流里常被吞成短促的 eg；er det ikke 连读听起来像 æɐ̯ dɛ eg。", "segs": [{"id": "dialog-4", "who": "Jonas", "da": "Åh, undskyld! Er det ikke vogn 6?", "a": "ee903ad409517737", "dur": 2.4}]}, {"zh": "不，不是的。这是 7 号车厢。这不是你要坐的车厢。", "note": "rigtige ˈʁɛgdiə（小舌音 r 起头，中间 g 弱化，词尾 -e 轻读 ə）；dig ˈdɑɪ̯（词尾 g 滑成 i 音）。", "segs": [{"id": "dialog-5", "who": "Emma", "da": "Nej, det er det ikke. Det er vogn 7. Det er ikke den rigtige vogn for dig.", "a": "a206d6b681b3ebb8", "dur": 4.6}]}, {"zh": "真糊涂！我坐错车厢了。旁边这个座位难道不是空的吗？如果不是的话我就去 6 号车厢。", "note": "hvor ˈvɒːˀ（hv- 开头的词，字母 h 永远不发音！）；dumt ˈdɔmˀd；forkerte fɒˈkʰeɐ̯ˀdə；ved siden af ve ˈsiːðən ˈæːˀ（af 在此 f 脱落）；ledig ˈleːði（词尾 -ig 中的 g 不发音，d 读软 d）。", "segs": [{"id": "dialog-6", "who": "Jonas", "da": "Hvor dumt! Jeg sidder i den forkerte vogn. Er pladsen ved siden af ikke ledig? Ellers går jeg ind i vogn 6.", "a": "2e9a058a9dc864b0", "dur": 5.68}]}, {"zh": "是空的呀！（这）没关系。我叫艾玛。", "note": "Det gør ikke noget de ˈgɶɐ̯ egə ˈnɔːð（整句是丹麦人嘴边的高频固定句，noget 的 t 不发音、g 极弱，听起来接近 nɔːð）；hedder ˈheðɐ（软 d）。", "segs": [{"id": "dialog-7", "who": "Emma", "da": "Jo, det er den! Det gør ikke noget. Jeg hedder Emma.", "a": "fbcb4f1efcd4eca6", "dur": 3.68}]}, {"zh": "谢谢，你人真好！我叫约纳斯。你是哥本哈根人吗？", "note": "sød ˈsøːðˀ（长圆唇音 ø + 喉塞音 + 软 d）；København kʰøbənˈhɑʊ̯ˀn（重音在最后一个音节 -havn）。", "segs": [{"id": "dialog-8", "who": "Jonas", "da": "Tak, hvor er du sød! Jeg hedder Jonas. Kommer du fra København?", "a": "3d9f64d94c471c0e", "dur": 4.32}]}, {"zh": "不是，我来自中国，但我现在住在哥本哈根。我要在奥胡斯站下车。", "note": "skal ˈsgal（句中常弱读为 sga，l 经常被吞掉！）；stå af sdɔ ˈæːˀ（注意 af 读 æːˀ，不要读出 f）；station sdaˈɕoːˀn（ti 读接近汉语“西”的 ɕ）。", "segs": [{"id": "dialog-9", "who": "Emma", "da": "Nej, jeg kommer fra Kina, men jeg bor i København nu. Jeg skal stå af på Aarhus Station.", "a": "989e12f55be53b57", "dur": 5.52}]}, {"zh": "真巧/真棒！我也要在奥胡斯下车。祝你旅途愉快！", "note": "hyggeligt ˈhyɡəli（词尾 -igt 中的 g 和 t 都不发音！只读 i）；God tur! ˈɡoːˀ ˈtʰuɐ̯ˀ（god 的 d 极轻或近乎弱化）。", "segs": [{"id": "dialog-10", "who": "Jonas", "da": "Hvor hyggeligt! Jeg skal også stå af i Aarhus. God tur!", "a": "a474c16e6b1e52ce", "dur": 3.72}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "座位；广场；空间", "note": "名词 · pladsen, pladser, pladserne", "segs": [{"id": "g1", "who": "narrator", "da": "en plads", "say": "en plads. pladsen, pladser, pladserne.", "a": "07bb94437dc463b3", "dur": 4.8}]}, {"zh": "火车（单复数同形）", "note": "名词 · toget, tog, togene", "segs": [{"id": "g2", "who": "narrator", "da": "et tog", "say": "et tog. toget, tog, togene.", "a": "1b7e1e901bfa4dbb", "dur": 4.48}]}, {"zh": "车厢；推车", "note": "名词 · vognen, vogne, vognene", "segs": [{"id": "g3", "who": "narrator", "da": "en vogn", "say": "en vogn. vognen, 发音，重音在第二音节）；staver ˈsdæːvɐ；efternavn ˈɛfdɐˌnɑʊ̯ˀn（注意 -av- 读作双元音 ɑʊ̯）。", "segs": [{"id": "dialog-3", "who": "Mette", "da": "Din lærer hedder Kasper. Hvordan staver du dit efternavn, Emma?", "a": "ec1720991cb6a0af", "dur": 4.24}]}, {"zh": "我拼作 W-A-N-G。我是这里 Modul 1 的新生。", "note": "kursist kʰuɐ̯ˈsisd（重音在第二音节 -sist）；her ˈheɐ̯ˀ（短促清晰带喉塞音）。", "segs": [{"id": "dialog-4", "who": "Emma", "da": "Jeg staver det W-A-N-G. Jeg er ny kursist her på modul 1.", "a": "b18c47dbb8299341", "dur": 6.76}]}, {"zh": "太好了！你从哪里来，会说哪些语言？", "note": "dejligt ˈdɑɪ̯li（g 和 t 均不发音！ej 读 ɑɪ̯）；hvilke ˈvelɡə（h 不发音，k 读不送气清塞音 ɡ）；sprog ˈsbʁɔʊ̯ˀ（-og 读 ɔʊ̯ˀ）。", "segs": [{"id": "dialog-5", "who": "Mette", "da": "Dejligt! Hvor kommer du fra, og hvilke sprog taler du?", "a": "cc591f443c97f3ed", "dur": 4.0}]}, {"zh": "我来自中国，所以我是一名中国人。我说中文、英语和一点儿丹麦语。", "note": "kineser kʰiˈneːˀsɐ、kinesisk kʰiˈneːˀsisg（重音都在第二音节）；engelsk ˈɛŋˀəlsg；lidt dansk led ˈdansg（lidt 末尾的 d 不发音）。", "segs": [{"id": "dialog-6", "who": "Emma", "da": "Jeg kommer fra Kina, så jeg er kineser. Jeg taler kinesisk, engelsk og lidt dansk.", "a": "5764d6e0247e5e23", "dur": 6.04}]}, {"zh": "你现在住在哪里，在奥胡斯做什么工作？", "note": "hvor bor du vɒː ˈboɐ̯ˀ du（hvor 弱读，重音落在 bor 上）；hvad laver du va ˈlæːvɐ du。", "segs": [{"id": "dialog-7", "who": "Mette", "da": "Hvor bor du nu, og hvad laver du i Aarhus?", "a": "2ab30196b1dc29c2", "dur": 2.32}]}, {"zh": "我住在奥胡斯，在一家公司当工程师。", "note": "arbejder ˈɑːˌbɑɪ̯ˀdɐ（第一音节 ar- 读长音 ɑː，-ej- 读 ɑɪ̯）；ingeniør eŋɕəˈnøɐ̯ˀ（法语借词，g 读如“西”的 ɕ，重音在最后）。", "segs": [{"id": "dialog-8", "who": "Emma", "da": "Jeg bor i Aarhus, og jeg arbejder som ingeniør i et firma.", "a": "4c6a5152e95c61e8", "dur": 4.16}]}, {"zh": "嗨！我叫马尔科。我来自意大利，我也在这里学丹麦语。我们哪几天有课？", "note": "Italien iˈtʰæːljən；dage ˈdæːə（中间 g 完全不发音！）；undervisning ˈʌnɐˌviːˀsneŋ（under- 中 d 不发音）。", "segs": [{"id": "dialog-9", "who": "Marco", "da": "Hej! Jeg hedder Marco. Jeg kommer fra Italien, og jeg lærer også dansk her. Hvilke dage har vi undervisning?", "a": "abc55fb17fcb0e00", "dur": 7.2}]}, {"zh": "你们周二和周四上课。欢迎你们两位加入这个班！", "note": "tirsdag ˈtʰiɐ̯ˀsda、torsdag ˈtʰɒːˀsda（星期词尾 -dag 的 g 不发音，弱读为 da）；begge to ˈbɛɡə ˈtʰoːˀ（holdet 读 ˈhʌlˀəð，d 静音）。", "segs": [{"id": "dialog-10", "who": "Mette", "da": "I har undervisning tirsdag og torsdag. Velkommen på holdet, begge to!", "a": "32a87319208f95f9", "dur": 4.16}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "什么", "note": "疑问词", "segs": [{"id": "g1", "who": "narrator", "da": "hvad", "a": "c799639c29cd10ac", "dur": 0.76}]}, {"zh": "谁", "note": "疑问词", "segs": [{"id": "g2", "who": "narrator", "da": "hvem", "a": "a332788229091c85", "dur": 1.0}]}, {"zh": "哪里", "note": "疑问词", "segs": [{"id": "g3", "who": "narrator", "da": "hvor", "a": "2ab6fd54a66e6919", "dur": 0.72}]}, {"zh": "怎么样，如何", "note": "疑问词", "segs": [{"id": "g4", "who": "narrator", "da": "hvordan", "a": "59e5c4e40caff506", "dur": 1.04}]}, {"zh": "哪一个 / 哪些（随名词性数变化）", "note": "疑问词 · hvilket, hvilke", "segs": [{"id": "g5", "who": "narrator", "da": "hvilken", "say": "hvilken. hvilket, hvilke.", "a": "a6335dfecbf01896", "dur": 3.36}]}, {"zh": "老师，教师", "note": "名词 · læreren, lærere, lærerne", "segs": [{"id": "g6", "who": "narrator", "da": "en lærer", "say": "en lærer. læreren, lærere, lærerne.", "a": "0aa7a3e4918ed081", "dur": 5.92}]}, {"zh": "语言学校学员", "note": "名词 · kursisten, kursister, kursisterne", "segs": [{"id": "g7", "who": "narrator", "da": "en kursist", "say": "en kursist. kursisten, kursister, kursisterne.", "a": "a3976ad06ff95d56", "dur": 5.12}]}, {"zh": "姓氏", "note": "名词 · efternavnet, efternavne, efternavnene", "segs": [{"id": "g8", "who": "narrator", "da": "et efternavn", "say": "et efternavn. efternavnet, efternavne, efternavnene.", "a": "d3f1add675ce4867", "dur": 5.6}]}, {"zh": "语言（单复数同形）", "note": "名词 · sproget, sprog, sprogene", "segs": [{"id": "g9", "who": "narrator", "da": "et sprog", "say": "et sprog. sproget, sprog, sprogene.", "a": "2e0b31eefe7f5da6", "dur": 3.72}]}, {"z h": "一点儿（lidt dansk 一点丹麦语）", "note": "副词", "segs": [{"id": "g20", "who": "narrator", "da": "lidt", "a": "5ffedabac1c9f8b0", "dur": 0.76}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "疑问词", "da": "hvad / hvem", "zh": "什么 / 谁", "forms": "—"}, {"pos": "疑问词", "da": "hvor / hvordan", "zh": "哪里 / 怎么样，如何", "forms": "—"}, {"pos": "疑问词", "da": "hvilken", "zh": "哪一个 / 哪些（随名词性数变化）", "forms": "hvilket, hvilke"}, {"pos": "名词", "da": "en lærer", "zh": "老师，教师", "forms": "læreren, lærere, lærerne"}, {"pos": "名词", "da": "en kursist", "zh": "语言学校学员", "forms": "kursisten, kursister, kursisterne"}, {"pos": "名词", "da": "et efternavn", "zh": "姓氏", "forms": "efternavnet, efternavne, efternavnene"}, {"pos": "名词", "da": "et sprog", "zh": "语言（单复数同形）", "forms": "sproget, sprog, sprogene"}, {"pos": "名词", "da": "et hold", "zh": "班级；团队（单复数同形）", "forms": "holdet, hold, holdene"}, {"pos": "名词", "da": "en undervisning", "zh": "教学，课程", "forms": "undervisningen, 不可数"}, {"pos": "名词", "da": "et firma", "zh": "公司，企业", "forms": "firmaet, firmaer, firmaerne"}, {"pos": "动词", "da": "at stave", "zh": "拼写", "forms": "staver, stavede, har stavet"}, {"pos": "动词", "da": "at tale", "zh": "说（语言）；交谈", "forms": "taler, talte, har talt"}, {"pos": "动词", "da": "at bo", "zh": "居住", "forms": "bor, boede, har boet"}, {"pos": "动词", "da": "at lave", "zh": "做，制作（hvad laver du? 你干嘛/从事什么）", "forms": "laver, lavede, har lavet"}, {"pos": "动词", "da": "at arbejde", "zh": "工作", "forms": "arbejder, arbejdede, har arbejdet"}, {"pos": "动词", "da": "at lære", "zh": "学习；学会", "forms": "lærer, lærte, har lært"}, {"pos": "形容词", "da": "ny", "zh": "新的", "forms": "nyt, nye"}, {"pos": "副词", "da": "lidt", "zh": "一点儿（lidt dansk 一点丹麦语）", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "你叫什么名字，你来自哪个国家？（提示：哪个国家 hvilket land）", "answer": "Hvad hedder du, og hvilket land kommer du fra?"}, {"zh": "我是一名中国人，但我住在丹麦。", "answer": "Jeg er kineser, men jeg bor i Danmark."}, {"zh": "他在公司当老师，每周二和周四上课。", "answer": "Han arbejder som lærer i et firma, og han har undervisning tirsdag og torsdag."}, {"zh": "请问，你现在在奥胡斯做什么工作？", "answer": "Undskyld, hvad laver du i Aarhus nu?"}]}, {"id": "A", "type": "drill", "title": "练习 A：用正确的 hv- 疑问词填空（hvad, hvor, hvem, hvordan, hvilke）", "items": [{"prompt": "{{_}} hedder din lærer på sprogskolen?", "kind": "cloze", "blanks": [["Hvad"]], "explain": "问名字固定用 ⟦Hvad hedder...?⟧，不要受英语“Who/How”影响"}, {"prompt": "{{_}} bor du i Danmark, og {{_}} kommer du fra?", "kind": "cloze", "blanks": [["Hvor"], ["hvor"]], "explain": "问居住地与来源地均用 ⟦hvor⟧，后者配合句尾 ⟦fra⟧"}, {"prompt": "{{_}} staver du dit fornavn?", "kind": "cloze", "blanks": [["Hvordan"]], "explain": "问拼写方式“如何拼”"}, {"prompt": "{{_}} sprog taler I på holdet?", "kind": "cloze", "blanks": [["Hvilke"]], "explain": "⟦sprog⟧ 在此指复数“哪些语言”，配 ⟦hvilke⟧"}, {"prompt": "{{_}} er ny kursist på modul 1? — Det er Emma og Marco.", "kind": "cloze", "blanks": [["Hvem"]], "explain": "从回答 ⟦Det er Emma og Marco⟧ 可知问人，用 ⟦hvem⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：将括号内的动词变为现在时，注意国籍与职业的零冠词规则", "items": [{"prompt": "Emma {{_}} (⟦at komme⟧) fra Kina. Hun {{_}} (⟦at være⟧) kineser.", "kind": "cloze", "blanks": [["kommer"], ["er"]], "explain": "⟦at være⟧ 现在时不规则变为 ⟦er⟧"}, {"prompt": "Nu {{_}} (⟦at bo⟧) hun i Aarhus og {{_}} (⟦at arbejde⟧) som ingeniør.", "kind": "cloze", "blanks": [["bor"], ["arbejder"]], "explain": "元音结尾直接加 ⟦-r⟧"}, {"prompt": "Marco {{_}} (⟦at lære⟧) dansk, og han {{_}} (⟦at tale⟧) allerede lidt dansk.", "kind": "cloze", "blanks": [["lærer"], ["taler"]]}, {"prompt": "Hvilke dage {{_}} (⟦at have⟧) I undervisning?", "kind": "cloze", "blanks": [["har"]], "explain": "⟦at have⟧ 现在时变为 ⟦har⟧"}, {"prompt": "Jeg {{_}} (⟦at stave⟧) mit efternavn på dansk.", "kind": "cloze", "blanks": [["staver"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战（注意 hv- 语序、大小写及零冠词）", "items": [{"prompt": "你叫什么名字，你来自哪个国家？（提示：哪个国家 ⟦hvilket land⟧）", "kind": "write", "accept": ["Hvad hedder du, og hvilket land kommer du fra?"]}, {"prompt": "我是一名中国人，但我住在丹麦。", "kind": "write", "accept": ["Jeg er kineser, men jeg bor i Danmark."], "explain": "⟦kineser⟧ 小写且无 ⟦en⟧，⟦Danmark⟧ 大写"}, {"prompt": "你说哪些语言？— 我说中文、英语和一点儿丹麦语。", "kind": "write", "accept": ["Hvilke sprog taler du? — Jeg taler kinesisk, engelsk og lidt dansk."], "explain": "语言全部小写"}, {"prompt": "他在公司当老师，每周二和周四上课。", "kind": "write", "accept": ["Han arbejder som lærer i et firma, og han har undervisning tirsdag og torsdag."]}, {"prompt": "请问，你现在在奥胡斯做什么工作？", "kind": "write", "accept": ["Undskyld, hvad laver du i Aarhus nu?"]}]}], "clips": {"godmorgen og velkommen til aarhus sprogcenter hvad hedder du": "44e9875d524ccb2c", "godmorgen jeg hedder emma wang undskyld hvem er min lærer i dag": "2bc305b72da7e10f", "din lærer hedder kasper hvordan staver du dit efternavn emma": "ec1720991cb6a0af", "jeg staver det w-a-n-g jeg er ny kursist her på modul 1": "b18c47dbb8299341", "dejligt hvor kommer du fra og hvilke sprog taler du": "cc591f443c97f3ed", "jeg kommer fra kina så jeg er kineser jeg taler kinesisk engelsk og lidt dansk": "5764d6e0247e5e23", "hvor bor du nu og hvad laver du i aarhus": "2ab30196b1dc29c2", "jeg bor i aarhus og jeg arbejder som ingeniør i et firma": "4c6a5152e95c61e8", "hej jeg hedder marco jeg kommer fra italien og jeg lærer også dansk her hvilke dage har vi undervisning": "abc55fb17fcb0e00", "i har undervisning tirsdag og torsdag velkommen på holdet begge to": "32a87319208f95f9", "hvad": "c799639c29cd10ac", "hvem": "a332788229091c85", "hvor": "2ab6fd54a66e6919", "hvordan": "59e5c4e40caff506", "hvilken": "a6335dfecbf01896", "en lærer": "0aa7a3e4918ed081", "en kursist": "a3976ad06ff95d56", "et efternavn": "d3f1add675ce4867", "et sprog": "2e0b31eefe7f5da6", "et hold": "219e5c7c6b3c0bcc", "en undervisning": "00cc15b7f8c676c3", "et firma": "35daff38d58bf933", "at stave": "230eaf39624181cb", "at tale": "eaa52f7c35501136", "at bo": "3fe7c2e45c958dae", "at lave": "f8f55ae87d63c3ba", "at arbejde": "635bc87081691fc9", "at lære": "93e88e9a3a932d01", "ny": "2f6f52ec12fca31d", "lidt": "5ffedabac1c9f8b0"}, "key": "ncd1-L02"}, {"book": "ncd1", "lesson": 3, "title_da": "På sprogskolen i første pause", "title_zh": "语言学校的第一次课间休息", "grammar": "名词共性（n-ord en）与中性（t-ord et）· 单数不定冠词 vs 单数定冠词后缀（-en / -et 及双写辅音规则）· Der er... 存在句型", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "第一节课结束，迎来 20 分钟的课间休息。新生 Emma 想喝一杯咖啡，顺便向已经提前转过一圈的同学 Marco 打听食堂、洗手间和自习室的位置。", "paras": [{"zh": "啊，终于课间休息了！我真需要一杯咖啡。咖啡机在哪儿？", "note": "endelig ˈɛnəli（d 和 g 都不发音！）；pause ˈpʰɑʊ̯sə；en kop kaffe eŋ ˈkʰʌb ˈkʰafə（en 在 k 前常同化成 eŋ）。", "segs": [{"id": "dialog-1", "who": "Emma", "da": "Åh, endelig pause! Jeg har virkelig brug for en kop kaffe. Hvor er kaffemaskinen?", "a": "cb17b616322618ef", "dur": 6.12}]}, {"zh": "食堂那边有一台咖啡机。跟我来吧！", "note": "der dɛɐ̯（在存在句开头常弱读成轻短的 dɑ 或 dɛ）；kantinen kʰanˈtʰiːnən（重音在第二音节）；mig ˈmɑɪ̯（g 滑成 i 音）。", "segs": [{"id": "dialog-2", "who": "Marco", "da": "Der står en kaffemaskine henne ved kantinen. Kom med mig!", "a": "f94200296d1b29b2", "dur": 3.28}]}, {"zh": "谢谢！食堂到底在哪儿呀？是在二楼吗？", "note": "ligger ˈleɡɐ（短元音 e，gg 读 ɡ）；egentlig ˈeːˀənli（中间 g 和 t 均完全脱落！）；første sal ˈfɶɐ̯sdə ˈsæːˀl（注意在丹麦指“二楼”）。", "segs": [{"id": "dialog-3", "who": "Emma", "da": "Tak! Hvor ligger kantinen egentlig? Er det på første sal?", "a": "6d431f5a582a7bfd", "dur": 4.92}]}, {"zh": "不是，食堂在一楼，就在前台旁边。你看，墙上挂着一块指示牌。", "note": "stueetagen ˈsduːəˌetʰæːɕən（-ge- 读作接近“西”的 ɕ）；receptionen ʁesɛbˈɕoːˀnən；væggen ˈvɛɡən（短元音双写 g）。", "segs": [{"id": "dialog-4", "who": "Marco", "da": "Nej, kantinen ligger i stueetagen ved siden af receptionen. Se, der hænger et skilt på væggen.", "a": "26bce0271cae9bf8", "dur": 5.32}]}, {"zh": "太好了！我包里有一瓶水，不过认识一下咖啡机在哪儿也挺好。", "note": "vand ˈvanˀ（d 不发音，n 带喉塞音）；tasken ˈtʰasgən；kende ˈkʰɛnə（nd 中的 d 不发音）。", "segs": [{"id": "dialog-5", "who": "Emma", "da": "Fint! Jeg har en flaske vand i tasken, men kaffemaskinen er god at kende.", "a": "92bb3345f51b9284", "dur": 5.04}]}, {"zh": "是呀，不过小心点：自动贩卖机出的杯子非常烫！", "note": "pas på ˈpʰas ˈpʰɔːˀ；koppen ˈkʰʌbən（对比 en kop ˈkʰʌb，双写 p 保持前面的短元音）；automaten ɑʊ̯tʰoˈmæːˀdən；meget ˈmɑɪ̯əð（g 滑成 ɪ̯，t 读软 d）。", "segs": [{"id": "dialog-6", "who": "Marco", "da": "Ja, men pas på: koppen fra automaten er meget varm!", "a": "784e9df3116c8a57", "dur": 3.36}]}, {"zh": "谢谢提醒！那这一层哪里有洗手间？", "note": "rådet ˈʁɔːˀðəð（råd 的 d 与词尾 -et 均读软 ð）；et toilet ed tʰoɑˈlɛd；etagen eˈtʰæːˀɕən。", "segs": [{"id": "dialog-7", "who": "Emma", "da": "Tak for rådet! Og hvor er der et toilet her på etagen?", "a": "5cfecccbe35ee08c", "dur": 3.56}]}, {"zh": "洗手间就在过了那扇门往左拐的地方。这儿也有自习室吗？", "note": "toilettet tʰoɑˈlɛdəð（重点！中性定指后缀 -et 永远读弱弱的 əð，绝不要读出硬 t）；til venstre tʰe ˈvɛnsdʁə；døren ˈdɶɐ̯ˀən。", "segs": [{"id": "dialog-8", "who": "Marco", "da": "Toilettet ligger lige til venstre efter døren. Er der også et studierum her?", "a": "0395bf1fb2cc9ca3", "dur": 4.48}]}, {"zh": "有的。这儿有一间教室，里面有一台电脑、一张桌子和很多椅子。", "note": "det er der de ˈæɐ̯ dɑ（简短回答重音在 er 上）；lokale loˈkʰæːlə；et bord ed ˈboɐ̯ˀ（d 不发音）；stole ˈsdoːlə（复数时单数词里的喉塞音消失）。", "segs": [{"id": "dialog-9", "who": "Emma", "da": "Ja, det er der. Der er et lokale med en computer, et bord og mange stole.", "a": "9dd2a24cb7715f64", "dur": 6.08}]}, {"zh": "太棒了！走，趁着下节课还没重新开始，我们把咖啡端进教室里吧。", "note": "lokalet loˈkʰæːləð（词尾 -et 读 əð）；timen ˈtʰiːmən；igen iˈɡɛn（g 读不送气清音 ɡ）。", "segs": [{"id": "dialog-10", "who": "Marco", "da": "Perfekt! Kom, vi tager kaffen med ind i lokalet, før timen starter igen.", "a": "cf0c4a19f2c98f8d", "dur": 4.2}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "课间休息，暂停", "note": "名词 · pausen, pauser, pauserne", "segs": [{"id": "g1", "who": "narrator", "da": "en pause", "say": "en pause. pausen, pauser, pauserne.", "a": "b550513dd18b756d", "dur": 4.92}]}, {"zh": "杯子（单数定指双写 p）", "note": "名词 · koppen, kopper, kopperne", "segs": [{"id": "g2", "who": "narrator", "da": "en kop", "say": "en kop. koppen, kopper, kopperne.", "a": "20534151a31138a8", "dur": 4.56}]}, {"zh": "咖啡（en kop kaffe 一杯咖啡）", "note": "名词 · kaffen, 不可数", "segs": [{"id": "g3", "who": "narrator", "da": "en kaffe", "say": "en kaffe.", "a": "c77c5bdf6aeda623", "dur": 1.16}]}, {"zh": "食堂，餐厅", "note": "名词 · kantinen, kantiner, kantinerne", "segs": [{"id": "g4", "who": "narrator", "da": "en kantine", "say": "en kantine. kantinen, kantiner, kantinerne.", "a": "836b308828a8661b", "dur": 6.12}]}, {"zh": "前台，接待处", "note": "名词 · receptionen, receptioner, receptionerne", "segs": [{"id": "g5", "who": "narrator", "da": "en reception", "say": "en reception. receptionen, receptioner, receptionerne.", "a": "a59f5e15c25f58e8", "dur": 5.16}]}, {"zh": "楼层（stueetagen 一楼/底层）", "note": "名词 · etagen, etager, etagerne", "segs": [{"id": "g6", "who": "narrator", "da": "en etage", "say": "en etage. etagen, etager, etagerne.", "a": "ed727424c207a825", "dur": 5.48}]}, {"zh": "指示牌，标牌", "note": "名词 · skiltet, skilte, skiltene", "segs": [{"id": "g7", "who": "narrator", "da": "et skilt", "say": "et skilt. skiltet, skilte, skiltene.", "a": "bf4793af023c3ffa", "dur": 5.2}]}, {"zh": "墙壁（单数定指双写 g）", "note": "名词 · væggen, vægge, væggene", "segs": [{"id": "g8", "who": "narrator", "da": "en væg", "say": "en væg. væggen, vægge, væggene.", "a": "79755d623d117663", "dur": 4.44}]}, {"zh": "瓶子（en flaske vand 一瓶水）", "note": "名词 · flasken, flasker, flaskerne", "segs": [{"id": "g9", "who": "narrator", "da": "en flaske", "say": "en flaske. flasken, flasker, flaskerne.", "a": "5dad63f561c0b566", "dur": 4.96}]}, {"zh": "建议，提醒（单复数同形）", "note": "名词 · rådet, råd, rådene", "segs": [{"id": "g10", "who": "narrator", "da": "et råd", "say": "et råd. rådet, råd, rådene.", "a": "1f8bb77091b68ee8", "dur": 4.08}]}, {"zh": "洗手间（定指与复数双写 t）", "note": "名词 · toilettet, toiletter, toiletterne", "segs": [{"id": "g11", "who": "narrator", "da": "et toilet", "say": "et toilet. toilettet, toiletter, toiletterne.", "a": "2411e2c9473b1f67", "dur": 4.68}]}, {"zh": "门", "note": "名词 · døren, døre, dørene", "segs": [{"id": "g12", "who": "narrator", "da": "en dør", "say": "en dør. døren, døre, dørene.", "a": "a82d319d277b7e57", "dur": 4.48}]}, {"zh": "教室，活动室", "note": "名词 · lokalet, lokaler, lokalerne", "segs": [{"id": "g13", "who": "narrator", "da": "et lokale", "say": "et lokale. lokalet, lokaler, lokalerne.", "a": "b0d18fd29964d96f", "dur": 5.2}]}, {"zh": "桌子", "note": "名词 · bordet, borde, bordene", "segs": [{"id": "g14", "who": "narrator", "da": "et bord", "say": "et bord. bordet, borde, bordene.", "a": "d370e59c3ae519c3", "dur": 4.64}]}, {"zh": "椅子", "note": "名词 · stolen, stole, stolene", "segs": [{"id": "g15", "who": "narrator", "da": "en stol", "say": "en stol. stolen, stole, stolene.", "a": "e432f255012e216b", "dur": 5.4}]}, {"zh": "包，背包", "note": "名词 · tasken, tasker, taskerne", "segs": [{"id": "g16", "who": "narrator", "da": "en taske", "say": "en taske. tasken, tasker, taskerne.", "a": "d7433f4bcafab3c6", "dur": 5.36}]}, {"zh": "认识；熟悉（人或地点）", "note": "动词 · kender, kendte, har kendt", "segs": [{"id": "g17", "who": "narrator", "da": "at kende", "say": "at kende. kender, kendte, har kendt.", "a": "72aaae997f59f4cb", "dur": 4.28}]}, {"zh": "悬挂；挂着", "note": "动词 · hænger, hang, har hængt", "segs": [{"id": "g18", "who": "narrator", "da": "at hænge", "say": "at hænge. hænger, hang, har hængt.", "a": "845146b1c1e1ff92", "dur": 5.52}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en pause", "zh": "课间休息，暂停", "forms": "pausen, pauser, pauserne"}, {"pos": "名词", "da": "en kop", "zh": "杯子（单数定指双写 p）", "forms": "koppen, kopper, kopperne"}, {"pos": "名词", "da": "en kaffe", "zh": "咖啡（en kop kaffe 一杯咖啡）", "forms": "kaffen, 不可数"}, {"pos": "名词", "da": "en kantine", "zh": "食堂，餐厅", "forms": "kantinen, kantiner, kantinerne"}, {"pos": "名词", "da": "en reception", "zh": "前台，接待处", "forms": "receptionen, receptioner, receptionerne"}, {"pos": "名词", "da": "en etage", "zh": "楼层（stueetagen 一楼/底层）", "forms": "etagen, etager, etagerne"}, {"pos": "名词", "da": "et skilt", "zh": "指示牌，标牌", "forms": "skiltet, skilte, skiltene"}, {"pos": "名词", "da": "en væg", "zh": "墙壁（单数定指双写 g）", "forms": "væggen, vægge, væggene"}, {"pos": "名词", "da": "en flaske", "zh": "瓶子（en flaske vand 一瓶水）", "forms": "flasken, flasker, flaskerne"}, {"pos": "名词", "da": "et råd", "zh": "建议，提醒（单复数同形）", "forms": "rådet, råd, rådene"}, {"pos": "名词", "da": "et toilet", "zh": "洗手间（定指与复数双写 t）", "forms": "toilettet, toiletter, toiletterne"}, {"pos": "名词", "da": "en dør", "zh": "门", "forms": "døren, døre, dørene"}, {"pos": "名词", "da": "et lokale", "zh": "教室，活动室", "forms": "lokalet, lokaler, lokalerne"}, {"pos": "名词", "da": "et bord", "zh": "桌子", "forms": "bordet, borde, bordene"}, {"pos": "名词", "da": "en stol", "zh": "椅子", "forms": "stolen, stole, stolene"}, {"pos": "名词", "da": "en taske", "zh": "包，背包", "forms": "tasken, tasker, taskerne"}, {"pos": "动词", "da": "at kende", "zh": "认识；熟悉（人或地点）", "forms": "kender, kendte, har kendt"}, {"pos": "动词", "da": "at hænge", "zh": "悬挂；挂着", "forms": "hænger, hang, har hængt"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "食堂在一楼（底层），就在前台旁边。", "answer": "Kantinen ligger i stueetagen ved siden af receptionen."}, {"zh": "我在课间需要一杯咖啡。", "answer": "Jeg har brug for en kop kaffe i pausen."}, {"zh": "小心，杯子非常烫！", "answer": "Pas på, koppen er meget varm!"}, {"zh": "我们把咖啡带进自习室吧。", "answer": "Vi tager kaffen med ind i studierummet."}]}, {"id": "A", "type": "drill", "title": "练习 A：写出下列名词的单数定指形式（注意 -e 结尾与双写辅音规则）", "items": [{"prompt": "⟦en kantine⟧ → {{_}}", "kind": "cloze", "blanks": [["kantinen"]], "explain": "以 ⟦-e⟧ 结尾只加 ⟦-n⟧"}, {"prompt": "⟦et bord⟧ → {{_}}", "kind": "cloze", "blanks": [["bordet"]]}, {"prompt": "⟦en væg⟧ → {{_}}", "kind": "cloze", "blanks": [["væggen"]], "explain": "短元音单辅音双写 ⟦g⟧"}, {"prompt": "⟦en billet⟧ → {{_}}", "kind": "cloze", "blanks": [["billetten"]], "explain": "重读闭音节双写 ⟦t⟧"}, {"prompt": "⟦et lokale⟧ → {{_}}", "kind": "cloze", "blanks": [["lokalet"]], "explain": "以 ⟦-e⟧ 结尾只加 ⟦-t⟧"}, {"prompt": "⟦et toilet⟧ → {{_}}", "kind": "cloze", "blanks": [["toilettet"]], "explain": "短元音重读音节双写 ⟦t⟧"}, {"prompt": "⟦en flaske⟧ → {{_}}", "kind": "cloze", "blanks": [["flasken"]], "explain": "以 ⟦-e⟧ 结尾只加 ⟦-n⟧"}, {"prompt": "⟦et skilt⟧ → {{_}}", "kind": "cloze", "blanks": [["skiltet"]], "explain": "⟦-lt⟧ 双辅音结尾直接加 ⟦-et⟧"}], "example": "en stol → stolen | en kop → koppen"}, {"id": "B", "type": "drill", "title": "练习 B：用 Der er... / Er der...? 完成句子，并写出简短回答", "items": [{"prompt": "教室里有一张桌子和六把椅子。→ {{_}}.", "kind": "cloze", "blanks": [["Der er et bord og seks stole i lokalet"]]}, {"prompt": "这一层有咖啡机吗？（是的，有。）→ A: {{_}}? B: {{_}}.", "kind": "cloze", "blanks": [["Er der en kaffemaskine her på etagen?"], ["Ja, det er der."]]}, {"prompt": "包里有一瓶水吗？（不，没有。）→ A: {{_}}? B: {{_}}.", "kind": "cloze", "blanks": [["Er der en flaske vand i tasken?"], ["Nej, det er der ikke."]]}, {"prompt": "墙上挂着一块指示牌。（用 ⟦hænger⟧）→ {{_}}.", "kind": "cloze", "blanks": [["Der hænger et skilt på væggen"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战（注意定冠词后缀与楼层表达）", "items": [{"prompt": "食堂在一楼（底层），就在前台旁边。", "kind": "write", "accept": ["Kantinen ligger i stueetagen ved siden af receptionen."]}, {"prompt": "我在课间需要一杯咖啡。", "kind": "write", "accept": ["Jeg har brug for en kop kaffe i pausen."]}, {"prompt": "小心，杯子非常烫！", "kind": "write", "accept": ["Pas på, koppen er meget varm!"]}, {"prompt": "洗手间在二楼吗？— 不是，洗手间就在这扇门左边。", "kind": "write", "accept": ["Ligger toilettet på første sal? — Nej, toilettet ligger lige til venstre efter døren."]}, {"prompt": "我们把咖啡带进自习室吧。", "kind": "write", "accept": ["Vi tager kaffen med ind i studierummet."]}]}], "clips": {"åh endelig pause jeg har virkelig brug for en kop kaffe hvor er kaffemaskinen": "cb17b616322618ef", "der står en kaffemaskine henne ved kantinen kom med mig": "f94200296d1b29b2", "tak hvor ligger kantinen egentlig er det på første sal": "6d431f5a582a7bfd", "nej kantinen ligger i stueetagen ved siden af receptionen se der hænger et skilt på væggen": "26bce0271cae9bf8", "fint jeg har en flaske vand i tasken men kaffemaskinen er god at kende": "92bb3345f51b9284", "ja men pas på koppen fra automaten er meget varm": "784e9df3116c8a57", "tak for rådet og hvor er der et toilet her på etagen": "5cfecccbe35ee08c", "toilettet ligger lige til venstre efter døren er der også et studierum her": "0395bf1fb2cc9ca3", "ja det er der der er et lokale med en computer et bord og mange stole": "9dd2a24cb7715f64", "perfekt kom vi tager kaffen med ind i lokalet før timen starter igen": "cf0c4a19f2c98f8d", "en pause": "b550513dd18b756d", "en kop": "20534151a31138a8", "en kaffe": "c77c5bdf6aeda623", "en kantine": "836b308828a8661b", "en reception": "a59f5e15c25f58e8", "en etage": "ed727424c207a825", "et skilt": "bf4793af023c3ffa", "en væg": "79755d623d117663", "en flaske": "5dad63f561c0b566", "et råd": "1f8bb77091b68ee8", "et toilet": "2411e2c9473b1f67", "en dør": "a82d319d277b7e57", "et lokale": "b0d18fd29964d96f", "et bord": "d370e59c3ae519c3", "en stol": "e432f255012e216b", "en taske": "d7433f4bcafab3c6", "at kende": "72aaae997f59f4cb", "at hænge": "845146b1c1e1ff92"}, "key": "ncd1-L03"}, {"book": "ncd1", "lesson": 4, "title_da": "Min sprogskole og mit hold", "title_zh": "我的语言学校和班级 [独白]", "grammar": "名词复数（-er / -e / -r / 不规则复数）与复数定冠词后缀（-erne / -ene）· hvor mange（+可数复数）vs hvor meget（+不可数）· hvilken / hvilket / hvilke 搭配", "sections": [{"id": "text-del1", "type": "text", "kind": "prose", "tab": "Del 1", "title": "Del 1：第一人称连贯独白（约 90 词 · 口试 1–2 分钟陈述模板）", "scene": null, "paras": [{"segs": [{"id": "m1-1", "who": "Kursist", "da": "Jeg går på sprogskole i Aarhus, og skolen ligger i centrum af byen.", "a": "81c1aaf47488220d", "dur": 4.24}, {"id": "m1-2", "who": "Kursist", "da": "Jeg har undervisning to [[dage]] om ugen, tirsdag og torsdag, fra klokken 9 til 12.", "a": "4ce6bcbe1ef5c7e3", "dur": 4.52}], "zh": "我在奥胡斯的语言学校上学，学校就在市中心。我每周上两天课，分别是周二和周四，从早上九点到十二点。"}, {"segs": [{"id": "m1-3", "who": "Kursist", "da": "På mit hold er vi fjorten [[kursister]] fra mange forskellige [[lande]].", "a": "6c4daa97d5282240", "dur": 3.96}, {"id": "m1-4", "who": "Kursist", "da": "Vores lærer hedder Kasper, og han er meget tålmodig.", "a": "33559a60454b99b3", "dur": 3.16}, {"id": "m1-5", "who": "Kursist", "da": "I [[timerne]] læser vi [[tekster]], laver [[øvelser]] og snakker sammen i [[grupper]].", "a": "e91a40c484176f75", "dur": 4.64}, {"id": "m1-6", "who": "Kursist", "da": "Vi har en pause på tyve [[minutter]].", "a": "fb45f02e6d252ac6", "dur": 2.04}, {"id": "m1-7", "who": "Kursist", "da": "I [[pauserne]] drikker [[kursisterne]] kaffe og øver dansk med hinanden.", "a": "f5e3c1c0fe11dbf3", "dur": 3.48}], "zh": "我们班上有十四名来自许多不同国家的学员。我们的老师叫卡斯珀，他非常有耐心。在课上，我们读课文、做练习，并且分组一起聊天练习。我们有二十分钟的课间休息。在休息时间里，学员们喝咖啡，并且互相练习丹麦语。"}, {"segs": [{"id": "m1-8", "who": "Kursist", "da": "Jeg tager altid bussen til sprogskolen, og turen tager kun femten minutter.", "a": "0a3299ba5d9ad92d", "dur": 4.32}], "zh": "我总是坐公交车去语言学校，路程只需要十五分钟。"}]}, {"id": "text-del2", "type": "text", "kind": "dialog", "tab": "Del 2", "title": "Del 2：5 轮模拟口试追问与示范回答（Eksaminator ↔ Kursist）", "scene": null, "paras": [{"zh": "【第 1 轮 · 课时与时长】你说你每周上两天课。你们每周一共有多少课时？", "note": "siger ˈsiːɐ（g 不发音）；hvor mange vɒ ˈmaŋə（mange 的 g 不单独发出，读 ŋə）。", "segs": [{"id": "del2-1", "who": "Eksaminator", "da": "Du siger, at du har undervisning to dage om ugen. Hvor mange timer har I om ugen?", "a": "812b45af385f4aa1", "dur": 4.72}]}, {"zh": "我们每周有六个课时——每周二三个课时，每周四三个课时。", "note": "om tirsdagen ʌm ˈtʰiɐ̯ˀsdæːˀən（om + 星期 + -en 表示“每周二”）。", "segs": [{"id": "del2-2", "who": "Kursist", "da": "Vi har seks timer om ugen — tre timer om tirsdagen og tre timer om torsdagen.", "a": "02bc78bfdefa2d19", "dur": 5.44}]}, {"zh": "【第 2 轮 · 学员构成】你们班上有多少名学员，他们分别来自哪些国家？", "note": "hvilke lande ˈvelɡə ˈlanə（hvilke 词首 h 静音，搭配复数名词 lande）。", "segs": [{"id": "del2-3", "who": "Eksaminator", "da": "Hvor mange kursister er der på dit hold, og hvilke lande kommer de fra?", "a": "19176df38062830b", "dur": 4.24}]}, {"zh": "我们有十四名学员。他们来自很多国家，例如中国、波兰、西班牙和巴西。", "note": "for eksempel fɒ ɛgˈsɛmˀbəl（常用举例套语“例如”）；Polen ˈpʰoːˀlən；Spanien ˈsbæːnjən。", "segs": [{"id": "del2-4", "who": "Kursist", "da": "Vi er fjorten kursister. De kommer fra mange lande, for eksempel Kina, Polen, Spanien og Brasilien.", "a": "347c5a4c3e6189e7", "dur": 7.68}]}, {"zh": "【第 3 轮 · 教材与作业】你们课上用哪本书？你们有多少家庭作业？", "note": "hvilken bog ˈvelɡən ˈbɔʊ̯ˀ（bog 是 en 词，用 hvilken）；hvor meget vɒ ˈmɑɪ̯əð（配不可数名词 hjemmearbejde）。", "segs": [{"id": "del2-5", "who": "Eksaminator", "da": "Hvilken bog bruger I i timerne, og hvor meget hjemmearbejde har I?", "a": "95cfe88de6ba62bd", "dur": 4.2}]}, {"zh": "我们用《通往丹麦语之路》这本书，而且我们的作业不算多——大概每周两小时吧。", "note": "bogen ˈbɔʊ̯ˀən（对比复数 bøger ˈbøːˀɐ）；måske mɔˈsgeːˀ（重音在第二音节）。", "segs": [{"id": "del2-6", "who": "Kursist", "da": "Vi bruger bogen \"På vej til dansk\", og vi har ikke så meget hjemmearbejde — måske to timer om ugen.", "a": "65234c8f7923f2b6", "dur": 5.56}]}, {"zh": "【第 4 轮 · 课堂偏好】在课堂上你最喜欢哪些活动？", "note": "aktiviteter agdiviˈtʰeːˀdɐ（重音在倒数第二音节）；bedst ˈbɛsd（d 不发音）。", "segs": [{"id": "del2-7", "who": "Eksaminator", "da": "Hvilke aktiviteter kan du bedst lide i undervisningen?", "a": "c57552d2307360d5", "dur": 3.0}]}, {"zh": "我最喜欢和其他学员一起说丹麦语，因为我想好好练习我的发音。", "note": "udtale ˈuðˌtʰæːlə（ud 读软 ð）；gerne ˈɡɛɐ̯nə（“乐意/想”，口语极高频）。", "segs": [{"id": "del2-8", "who": "Kursist", "da": "Jeg kan bedst lide at tale dansk med de andre kursister, for jeg vil gerne øve min udtale.", "a": "9b54fc0bde160ace", "dur": 5.2}]}, {"zh": "【第 5 轮 · 交通与课间】下雨的时候你乘坐哪种交通工具？你们在课间都做些什么？", "note": "hvilket ˈvelɡəð（transportmiddel 是 et 词，用 hvilket）；regner ˈʁɑɪ̯nɐ（eg 读 ɑɪ̯）。", "segs": [{"id": "del2-9", "who": "Eksaminator", "da": "Hvilket transportmiddel tager du, når det regner, og hvad laver I i pauserne?", "a": "2b42ae1879cc033e", "dur": 4.2}]}, {"zh": "我总是坐公交车，下雨天也是。课间休息时有些学员会吃水果，我们还会聊聊丹麦的日常生活。", "note": "nogle ˈnoːn / ˈnoːlə（口语常简化读为 noːn）；hverdagen ˈvɛɐ̯ˌdæːˀən（h 和 g 都不发音！）。", "segs": [{"id": "del2-10", "who": "Kursist", "da": "Jeg tager altid bussen, også når det regner. I pauserne spiser nogle kursister frugt, og vi snakker om hverdagen i Danmark.", "a": "d6af8e281d6d260d", "dur": 7.56}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "周，星期（om ugen 每周）", "note": "名词 · ugen, uger, ugerne", "segs": [{"id": "g1", "who": "narrator", "da": "en uge", "say": "en uge. ugen, uger, ugerne.", "a": "2149f71a24329be2", "dur": 3.88}]}, {"zh": "天，日子（复数加 -e）", "note": "名词 · dagen, dage, dagene", "segs": [{"id": "g2", "who": "narrator", "da": "en dag", "say": "en dag. dagen, dage, dagene.", "a": "0fc7f048e450607a", "dur": 4.28}]}, {"zh": "国家（复数加 -e）", "note": "名词 · landet, lande, landene", "segs": [{"id": "g3", "who": "narrator", "da": "et land", "say": "et land. landet, lande, landene.", "a": "657e812b621eb93a", "dur": 4.68}]}, {"zh": "课文，文章", "note": "名词 · teksten, tekster, teksterne", "segs": [{"id": "g4", "who": "narrator", "da": "en tekst", "say": "en tekst. teksten, tekster, teksterne.", "a": "aa1b49ab251610a1", "dur": 4.96}]}, {"zh": "练习（词尾 -e 复数加 -r）", "note": "名词 · øvelsen, øvelser, øvelserne", "segs": [{"id": "g5", "who": "narrator", "da": "en øvelse", "say": "en øvelse. øvelsen, øvelser, øvelserne.", "a": "c341d227534d7571", "dur": 5.04}]}, {"zh": "小组", "note": "名词 · gruppen, grupper, grupperne", "segs": [{"id": "g6", "who": "narrator", "da": "en gruppe", "say": "en gruppe. gruppen, grupper, grupperne.", "a": "00286d8353fc212b", "dur": 4.28}]}, {"zh": "分钟（双写 t）", "note": "名词 · minuttet, minutter, minutterne", "segs": [{"id": "g7", "who": "narrator", "da": "et minut", "say": "et minut. minuttet, minutter, minutterne.", "a": "b11019f7c5ca20f8", "dur": 4.68}]}, {"zh": "书（不规则元音变音）", "note": "名词 · bogen, bøger, bøgerne", "segs": [{"id": "g8", "who": "narrator", "da": "en bog", "say": "en bog. bogen, bøger, bøgerne.", "a": "ed7fdbb9c4022fea", "dur": 4.52}]}, {"zh": "孩子（高频不规则复数）", "note": "名词 · barnet, børn, børnene", "segs": [{"id": "g9", "who": "narrator", "da": "et barn", "say": "et barn. barnet, børn, børnene.", "a": "f4838e85ad0de72b", "dur": 4.72}]}, {"zh": "男人；丈夫（高频不规则复数）", "note": "名词 · manden, mænd, mændene", "segs": [{"id": "g10", "who": "narrator", "da": "en mand", "say": "en mand. manden, mænd, mændene.", "a": "dbfef9ee09ef0238", "dur": 4.28}]}, {"zh": "活动", "note": "名词 · aktiviteten, aktiviteter, aktiviteterne", "segs": [{"id": "g11", "who": "narrator", "da": "en aktivitet", "say": "en aktivitet. aktiviteten, aktiviteter, aktiviteterne.", "a": "ddf365bcff627128", "dur": 6.8}]}, {"zh": "家庭作业（配 hvor meget）", "note": "名词 · hjemmearbejdet, 不可数", "segs": [{"id": "g12", "who": "narrator", "da": "et hjemmearbejde", "say": "et hjemmearbejde.", "a": "b944ed757d445bd6", "dur": 1.64}]}, {"zh": "交通工具（省略词干 d 和 e）", "note": "名词 · transportmidlet, transportmidler, transportmidlerne", "segs": [{"id": "g13", "who": "narrator", "da": "et transportmiddel", "say": "et transportmiddel. transportmidlet, transportmidler, transportmidlerne.", "a": "707fa7e040aeb909", "dur": 6.4}]}, {"zh": "阅读；攻读（专业）", "note": "动词 · læser, læste, har læst", "segs": [{"id": "g14", "who": "narrator", "da": "at læse", "say": "at læse. læser, læste, har læst.", "a": "2eb098652520448c", "dur": 5.16}]}, {"zh": "聊天，说话", "note": "动词 · snakker, snakkede, har snakket", "segs": [{"id": "g15", "who": "narrator", "da": "at snakke", "say": "at snakke. snakker, snakkede, har snakket.", "a": "ae7bc0336f49743e", "dur": 4.36}]}, {"zh": "练习，操练", "note": "动词 · øver, øvede, har øvet", "segs": [{"id": "g16", "who": "narrator", "da": "at øve", "say": "at øve. øver, øvede, har øvet.", "a": "cfe7605d037fbfb4", "dur": 4.52}]}, {"zh": "使用；花费（时间）", "note": "动词 · bruger, brugte, har brugt", "segs": [{"id": "g17", "who": "narrator", "da": "at bruge", "say": "at bruge. bruger, brugte, har brugt.", "a": "6463980b257336f7", "dur": 4.52}]}, {"zh": "多少（+可数复数", "note": "疑问词", "segs": [{"id": "g18", "who": "narrator", "da": "hvor mange", "a": "7fa11ead525ef3d9", "dur": 0.84}]}, {"zh": "+不可数）", "note": "疑问词", "segs": [{"id": "g19", "who": "narrator", "da": "meget", "a": "3fe4cb6f06ebdce9", "dur": 1.08}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en uge", "zh": "周，星期（om ugen 每周）", "forms": "ugen, uger, ugerne"}, {"pos": "名词", "da": "en dag", "zh": "天，日子（复数加 -e）", "forms": "dagen, dage, dagene"}, {"pos": "名词", "da": "et land", "zh": "国家（复数加 -e）", "forms": "landet, lande, landene"}, {"pos": "名词", "da": "en tekst", "zh": "课文，文章", "forms": "teksten, tekster, teksterne"}, {"pos": "名词", "da": "en øvelse", "zh": "练习（词尾 -e 复数加 -r）", "forms": "øvelsen, øvelser, øvelserne"}, {"pos": "名词", "da": "en gruppe", "zh": "小组", "forms": "gruppen, grupper, grupperne"}, {"pos": "名词", "da": "et minut", "zh": "分钟（双写 t）", "forms": "minuttet, minutter, minutterne"}, {"pos": "名词", "da": "en bog", "zh": "书（不规则元音变音）", "forms": "bogen, bøger, bøgerne"}, {"pos": "名词", "da": "et barn", "zh": "孩子（高频不规则复数）", "forms": "barnet, børn, børnene"}, {"pos": "名词", "da": "en mand", "zh": "男人；丈夫（高频不规则复数）", "forms": "manden, mænd, mændene"}, {"pos": "名词", "da": "en aktivitet", "zh": "活动", "forms": "aktiviteten, aktiviteter, aktiviteterne"}, {"pos": "名词", "da": "et hjemmearbejde", "zh": "家庭作业（配 hvor meget）", "forms": "hjemmearbejdet, 不可数"}, {"pos": "名词", "da": "et transportmiddel", "zh": "交通工具（省略词干 d 和 e）", "forms": "transportmidlet, transportmidler, transportmidlerne"}, {"pos": "动词", "da": "at læse", "zh": "阅读；攻读（专业）", "forms": "læser, læste, har læst"}, {"pos": "动词", "da": "at snakke", "zh": "聊天，说话", "forms": "snakker, snakkede, har snakket"}, {"pos": "动词", "da": "at øve", "zh": "练习，操练", "forms": "øver, øvede, har øvet"}, {"pos": "动词", "da": "at bruge", "zh": "使用；花费（时间）", "forms": "bruger, brugte, har brugt"}, {"pos": "疑问词", "da": "hvor mange / meget", "zh": "多少（+可数复数 / +不可数）", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "我们的语言学校位于市中心，班里有十二名学员。", "answer": "Vores sprogskole ligger i centrum af byen, og der er tolv kursister på holdet."}, {"zh": "课间休息时，学员们在食堂喝茶、聊天。", "answer": "I pauserne drikker kursisterne te og snakker sammen i kantinen."}, {"zh": "你坐哪路公交车去语言学校？（用 Hvilken bus...）", "answer": "Hvilken bus tager du til sprogskolen?"}, {"zh": "我非常喜欢我的老师，因为他既友好又很有耐心。", "answer": "Jeg kan rigtig godt lide min lærer, for han er både sød og meget tålmodig."}]}, {"id": "A", "type": "drill", "title": "练习 A：写出下列名词的完整四联形式（单数不定 → 单数定指 → 复数不定 → 复数定指）", "items": [{"prompt": "⟦en pause⟧ → {{_}}, {{_}}, {{_}}", "kind": "cloze", "blanks": [["pausen"], ["pauser"], ["pauserne"]], "explain": "词尾 ⟦-e⟧ 变复数加 ⟦-r⟧"}, {"prompt": "⟦en dag⟧ → {{_}}, {{_}}, {{_}}", "kind": "cloze", "blanks": [["dagen"], ["dage"], ["dagene"]], "explain": "单音节复数加 ⟦-e⟧"}, {"prompt": "⟦et land⟧ → {{_}}, {{_}}, {{_}}", "kind": "cloze", "blanks": [["landet"], ["lande"], ["landene"]], "explain": "复数加 ⟦-e⟧，定指 ⟦-ene⟧"}, {"prompt": "⟦et hold⟧ → {{_}}, {{_}}, {{_}}", "kind": "cloze", "blanks": [["holdet"], ["hold"], ["holdene"]], "explain": "单复数同形，复数定指加 ⟦-ene⟧"}, {"prompt": "⟦en bog⟧ → {{_}}, {{_}}, {{_}}", "kind": "cloze", "blanks": [["bogen"], ["bøger"], ["bøgerne"]], "explain": "不规则变音 ⟦bøger⟧"}, {"prompt": "⟦en lærer⟧ → {{_}}, {{_}}, {{_}}", "kind": "cloze", "blanks": [["læreren"], ["lærere"], ["lærerne"]], "explain": "⟦-er⟧ 结尾表人名词，复数定指省略 ⟦e⟧ 写作 ⟦lærerne⟧"}], "example": "en uge → ugen, uger, ugerne"}, {"id": "B", "type": "drill", "title": "练习 B：选填 hvor mange / hvor meget 与 hvilken / hvilket / hvilke", "items": [{"prompt": "{{_}} (⟦Hvor mange / Hvor meget⟧) timer har I undervisning om ugen?", "kind": "cloze", "blanks": [["Hvor mange"]], "explain": "⟦timer⟧ 是可数复数"}, {"prompt": "{{_}} (⟦Hvor mange / Hvor meget⟧) kaffe drikker du i pauserne?", "kind": "cloze", "blanks": [["Hvor meget"]], "explain": "⟦kaffe⟧ 是不可数物质名词"}, {"prompt": "{{_}} (⟦Hvilken / Hvilket / Hvilke⟧) sprogskole går du på? (⟦en sprogskole⟧)", "kind": "cloze", "blanks": [["Hvilken"]], "explain": "⟦en sprogskole⟧ 为共性单数"}, {"prompt": "{{_}} (⟦Hvilken / Hvilket / Hvilke⟧) hold går Emma på? (⟦et hold⟧)", "kind": "cloze", "blanks": [["Hvilket"]], "explain": "⟦et hold⟧ 为中性单数"}, {"prompt": "{{_}} (⟦Hvilken / Hvilket / Hvilke⟧) opgaver laver I i timerne? (⟦opgaver⟧ 复数)", "kind": "cloze", "blanks": [["Hvilke"]], "explain": "⟦opgaver⟧ 为复数"}]}, {"id": "C", "type": "drill", "title": "练习 C：DU3 Mindmap 句型扩写与中译丹", "items": [{"prompt": "我们的语言学校位于市中心，班里有十二名学员。", "kind": "write", "accept": ["Vores sprogskole ligger i centrum af byen, og der er tolv kursister på holdet."]}, {"prompt": "课间休息时，学员们在食堂喝茶、聊天。", "kind": "write", "accept": ["I pauserne drikker kursisterne te og snakker sammen i kantinen."]}, {"prompt": "你们一周有多少家庭作业？— 不算多，大概两小时。", "kind": "write", "accept": ["Hvor meget hjemmearbejde har I om ugen? — Ikke så meget, cirka to timer."]}, {"prompt": "你坐哪路公交车去语言学校？（用 ⟦Hvilken bus...⟧）", "kind": "write", "accept": ["Hvilken bus tager du til sprogskolen?"]}, {"prompt": "我非常喜欢我的老师，因为他既友好又很有耐心。", "kind": "write", "accept": ["Jeg kan rigtig godt lide min lærer, for han er både sød og meget tålmodig."]}]}], "clips": {"jeg går på sprogskole i aarhus og skolen ligger i centrum af byen": "81c1aaf47488220d", "jeg har undervisning to dage om ugen tirsdag og torsdag fra klokken 9 til 12": "4ce6bcbe1ef5c7e3", "på mit hold er vi fjorten kursister fra mange forskellige lande": "6c4daa97d5282240", "vores lærer hedder kasper og han er meget tålmodig": "33559a60454b99b3", "i timerne læser vi tekster laver øvelser og snakker sammen i grupper": "e91a40c484176f75", "vi har en pause på tyve minutter": "fb45f02e6d252ac6", "i pauserne drikker kursisterne kaffe og øver dansk med hinanden": "f5e3c1c0fe11dbf3", "jeg tager altid bussen til sprogskolen og turen tager kun femten minutter": "0a3299ba5d9ad92d", "du siger at du har undervisning to dage om ugen hvor mange timer har i om ugen": "812b45af385f4aa1", "vi har seks timer om ugen — tre timer om tirsdagen og tre timer om torsdagen": "02bc78bfdefa2d19", "hvor mange kursister er der på dit hold og hvilke lande kommer de fra": "19176df38062830b", "vi er fjorten kursister de kommer fra mange lande for eksempel kina polen spanien og brasilien": "347c5a4c3e6189e7", "hvilken bog bruger i i timerne og hvor meget hjemmearbejde har i": "95cfe88de6ba62bd", "vi bruger bogen på vej til dansk og vi har ikke så meget hjemmearbejde — måske to timer om ugen": "65234c8f7923f2b6", "hvilke aktiviteter kan du bedst lide i undervisningen": "c57552d2307360d5", "jeg kan bedst lide at tale dansk med de andre kursister for jeg vil gerne øve min udtale": "9b54fc0bde160ace", "hvilket transportmiddel tager du når det regner og hvad laver i i pauserne": "2b42ae1879cc033e", "jeg tager altid bussen også når det regner i pauserne spiser nogle kursister frugt og vi snakker om hverdagen i danmark": "d6af8e281d6d260d", "en uge": "2149f71a24329be2", "en dag": "0fc7f048e450607a", "et land": "657e812b621eb93a", "en tekst": "aa1b49ab251610a1", "en øvelse": "c341d227534d7571", "en gruppe": "00286d8353fc212b", "et minut": "b11019f7c5ca20f8", "en bog": "ed7fdbb9c4022fea", "et barn": "f4838e85ad0de72b", "en mand": "dbfef9ee09ef0238", "en aktivitet": "ddf365bcff627128", "et hjemmearbejde": "b944ed757d445bd6", "et transportmiddel": "707fa7e040aeb909", "at læse": "2eb098652520448c", "at snakke": "ae7bc0336f49743e", "at øve": "cfe7605d037fbfb4", "at bruge": "6463980b257336f7", "hvor mange": "7fa11ead525ef3d9", "meget": "3fe4cb6f06ebdce9"}, "key": "ncd1-L04"}, {"book": "ncd1", "lesson": 5, "title_da": "Hvornår går bussen?", "title_zh": "公交车几点开？", "grammar": "钟点表达（klokken..., halv..., kvart i/over..., minutter i/over...）与星期表达（på mandag vs om mandagen）· 时间疑问词（hvornår, hvor tit, hvor lang tid）· 句首时间/地点状语引发的主句 V2 倒装", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "周一早上八点零五分，Emma 站在公交站台查看电子站牌，向一旁同样等车的本地通勤者 Henrik 打听 4A 路公交车的发车时间与车程。", "paras": [{"zh": "打扰一下，开往市中心的 4A 路公交车几点开？", "note": "hvornår vɒˈnɒːˀ（词首 h 不发音）；går ˈɡɒːˀ（长圆唇音 + 喉塞音）；mod ˈmoːðˀ（软 ð + 喉塞音）。", "segs": [{"id": "dialog-1", "who": "Emma", "da": "Undskyld, hvornår går bus 4A mod centrum?", "a": "5df661684aa944d8", "dur": 3.32}]}, {"zh": "现在是八点零五分。下一班车八点一刻开。", "note": "klokken ˈkʰlʌɡən（口语常略去中间元音读如 kʰlʌɡŋ）；fem minutter over ˈfɛmˀ miˈnudɐ ˈʌʊ̯ˀɐ；kvart ˈkvɑːd（r 融进长元音 ɑː）。", "segs": [{"id": "dialog-2", "who": "Henrik", "da": "Lige nu er klokken fem minutter over otte. Den næste bus går kvart over otte.", "a": "e4a1700d188a775f", "dur": 4.76}]}, {"zh": "太好了！这儿的公交车早上多久发一班？", "note": "hvor tit vɒ ˈtʰid（频率疑问“多久一次”）；kører ˈkʰøːɐ（r 弱化融尾）；om morgenen ʌm ˈmɒːnən（g 完全不发音！）。", "segs": [{"id": "dialog-3", "who": "Emma", "da": "Super! Hvor tit kører bussen her om morgenen?", "a": "8ae4d7f739dd217f", "dur": 3.28}]}, {"zh": "早上每十分钟一班，但周末每小时才一班。", "note": "tiende ˈtʰiːənə（d 不发音）；hvert ˈvɛɐ̯ˀd（h 不发音）；weekenden ˈviːɡɛndən；én gang ˈeːˀn ˈɡaŋˀ（én 带重音表示数量“一”）。", "segs": [{"id": "dialog-4", "who": "Henrik", "da": "Om morgenen kører den hvert tiende minut, men i weekenden kører den kun én gang i timen.", "a": "35be4992ea742fba", "dur": 4.68}]}, {"zh": "好的，知道这个太有用了。坐到中心火车站需要多长时间？", "note": "at vide ad ˈviːðə（软 ð）；hvor lang tid vɒ ˈlaŋˀ ˈtʰiːðˀ；banegården ˈbæːnəˌɡɒːˀən（gård 的 d 不发音）。", "segs": [{"id": "dialog-5", "who": "Emma", "da": "Okay, det er godt at vide. Hvor lang tid tager turen ind til banegården?", "a": "b462a4737ef7be14", "dur": 3.8}]}, {"zh": "从这儿出发大约要二十分钟。你是要去语言学校还是去上班？", "note": "herfra ˈheɐ̯ˀˌfʁɑ；cirka ˈsiɐ̯ɡa；arbejde ˈɑːbɑɪ̯ˀdə（ar- 读长音 ɑː，-ej- 读 ɑɪ̯）。", "segs": [{"id": "dialog-6", "who": "Henrik", "da": "Herfra tager det cirka tyve minutter. Skal du på sprogskole eller på arbejde?", "a": "3c0d5c190566c9c2", "dur": 4.56}]}, {"zh": "我今天去上班。不过下周一我的新班就要在学校开课了。", "note": "på arbejde pʰɔ ˈɑːbɑɪ̯ˀdə；mandag ˈmanˀda（nd 的 d 和 dag 的 g 均不发音！）。", "segs": [{"id": "dialog-7", "who": "Emma", "da": "Jeg skal på arbejde i dag. Men på mandag starter mit nye hold på skolen.", "a": "5bfa7a7904c2822a", "dur": 4.56}]}, {"zh": "真让人期待！你每周一几点到学校上课？", "note": "spændende ˈsbɛnənə（nd 中的 d 不发音，常简读为 ˈsbɛnə）；om mandagen ʌm ˈmanˀdæːˀən（加 -en 表示“每周一”）。", "segs": [{"id": "dialog-8", "who": "Henrik", "da": "Spændende! Hvornår møder du på skolen om mandagen?", "a": "8601e58ed750ebc1", "dur": 3.12}]}, {"zh": "每周一我八点半上课，所以我七点五十五分坐公交车。不过这周五我七点四十五分有个早会！", "note": "halv ni ˈhalˀ ˈniːˀ（重要！v 永远不发音，l 带喉塞音）；fredag ˈfʁɛːˀda（g 静音）；tidligt ˈtʰiːðli（g 和 t 均静音）。", "segs": [{"id": "dialog-9", "who": "Emma", "da": "Om mandagen møder jeg klokken halv ni, så jeg tager bussen fem minutter i otte. Men på fredag har jeg et tidligt møde kvart i otte!", "a": "a88de645a6f97596", "dur": 7.88}]}, {"zh": "看，公交车这不就来了！正好八点十分整。祝你工作顺利！", "note": "faktisk ˈfaɡdisg；præcis pʰʁɛˈsiːˀs；arbejdsdag ˈɑːbɑɪ̯dsˌdæːˀ（d 音极弱，整体听起来像 ˈɑːbɑɪ̯sˌdæːˀ）。", "segs": [{"id": "dialog-10", "who": "Henrik", "da": "Se, nu kommer bussen faktisk! Klokken er ti minutter over otte præcis. God arbejdsdag!", "a": "c9468fdd3888f801", "dur": 5.44}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "什么时候（问时间点）", "note": "疑问词", "segs": [{"id": "g1", "who": "narrator", "da": "hvornår", "a": "a590855b461fc009", "dur": 1.0}]}, {"zh": "多久一次（频率）", "note": "疑问词", "segs": [{"id": "g2", "who": "narrator", "da": "hvor tit", "a": "4029e23f7e3bbb8f", "dur": 1.04}]}, {"zh": "多长时间（时长）", "note": "疑问词", "segs": [{"id": "g3", "who": "narrator", "da": "hvor lang tid", "a": "3f292dfe10e87369", "dur": 1.0}]}, {"zh": "公交车（单数定指与复数双写 s）", "note": "名词 · bussen, busser, busserne", "segs": [{"id": "g4", "who": "narrator", "da": "en bus", "say": "en bus. bussen, busser, busserne.", "a": "b1c8857a90ad401f", "dur": 4.28}]}, {"zh": "钟表；klokken... ……点钟", "note": "名词 · klokken, klokker, klokkerne", "segs": [{"id": "g5", "who": "narrator", "da": "en klokke", "say": "en klokke. klokken, klokker, klokkerne.", "a": "634f9365562d082e", "dur": 5.16}]}, {"zh": "一刻钟（15 分钟）", "note": "名词 · kvarteret, kvarter / kvarterer, kvartererne", "segs": [{"id": "g6", "who": "narrator", "da": "et kvarter", "say": "et kvarter. kvarteret, kvarter eller kvarterer, kvartererne.", "a": "4c6a5d1475e78601", "dur": 6.2}]}, {"zh": "一趟行程；散步，出行", "note": "名词 · turen, ture, turene", "segs": [{"id": "g7", "who": "narrator", "da": "en tur", "say": "en tur. turen, ture, turene.", "a": "0bfdf1f82631acbe", "dur": 4.68}]}, {"zh": "火车站（主站）", "note": "名词 · banegården, banegårde, banegårdene", "segs": [{"id": "g8", "who": "narrator", "da": "en banegård", "say": "en banegård. banegården, banegårde, banegårdene.", "a": "27a1669ca09d951a", "dur": 5.8}]}, {"zh": "公交站台（d 常弱化）", "note": "名词 · stoppestedet, stoppesteder, stoppestederne", "segs": [{"id": "g9", "who": "narrator", "da": "et stoppested", "say": "et stoppested. stoppestedet, stoppesteder, stoppestederne.", "a": "2e64443d1e753163", "dur": 4.96}]}, {"zh": "工作（på arbejde 上班）", "note": "名词 · arbejdet, arbejder, arbejderne", "segs": [{"id": "g10", "who": "narrator", "da": "et arbejde", "say": "et arbejde. arbejdet, arbejder, arbejderne.", "a": "0adc3386ff3ea1a0", "dur": 5.2}]}, {"zh": "周末（i weekenden 在周末）", "note": "名词 · weekenden, weekender, weekenderne", "segs": [{"id": "g11", "who": "narrator", "da": "en weekend", "say": "en weekend. weekenden, weekender, weekenderne.", "a": "a60345b48ea5010c", "dur": 4.84}]}, {"zh": "早晨（om morgenen 每天早上）", "note": "名词 · morgenen, morgener, morgenerne", "segs": [{"id": "g12", "who": "narrator", "da": "en morgen", "say": "en morgen. morgenen, morgener, morgenerne.", "a": "84df376e2ab15e87", "dur": 4.0}]}, {"zh": "会议；会面", "note": "名词 · mødet, møder, møderne", "segs": [{"id": "g13", "who": "narrator", "da": "et møde", "say": "et møde. mødet, møder, møderne.", "a": "ca251e215c11e892", "dur": 4.88}]}, {"zh": "知道，了解（高频不规则变化）", "note": "动词 · ved, vidste, har vidst", "segs": [{"id": "g14", "who": "narrator", "da": "at vide", "say": "at vide. ved, vidste, har vidst.", "a": "2b54e91351c3dfdb", "dur": 4.32}]}, {"zh": "走；（车船）发车开行（到达终点用 er）", "note": "动词 · går, gik, er gået / har gået", "segs": [{"id": "g15", "who": "narrator", "da": "at gå", "say": "at gå. går, gik, er gået eller har gået.", "a": "c4820ea4c0321a46", "dur": 5.28}]}, {"zh": "驾驶；行驶（去往某地用 er）", "note": "动词 · kører, kørte, er kørt / har kørt", "segs": [{"id": "g16", "who": "narrator", "da": "at køre", "say": "at køre. kører, kørte, er kørt eller har kørt.", "a": "b11d9943b7583f4c", "dur": 5.64}]}, {"zh": "开始；启动", "note": "动词 · starter, startede, har startet", "segs": [{"id": "g17", "who": "narrator", "da": "at starte", "say": "at starte. starter, startede, har startet.", "a": "62816f3367569f84", "dur": 4.96}]}, {"zh": "到岗，报道上班/上课；遇见", "note": "动词 · møder, mødte, har mødt", "segs": [{"id": "g18", "who": "narrator", "da": "at møde", "say": "at møde. møder, mødte, har mødt.", "a": "4cbe24d458c61b68", "dur": 4.04}]}, {"zh": "大约", "note": "副/形容词", "segs": [{"id": "g19", "who": "narrator", "da": "cirka", "a": "b2d20e8efdb7b53d", "dur": 1.0}]}, {"zh": "下一个的", "note": "副/形容词", "segs": [{"id": "g20", "who": "narrator", "da": "næste", "a": "b09d2d440f7ddb7d", "dur": 1.08}]}, {"zh": "早的", "note": "副/形容词 · -t, -e", "segs": [{"id": "g21", "who": "narrator", "da": "tidlig", "say": "tidlig.", "a": "935f52b3e29b506e", "dur": 1.28}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "疑问词", "da": "hvornår", "zh": "什么时候（问时间点）", "forms": "—"}, {"pos": "疑问词", "da": "hvor tit / hvor lang tid", "zh": "多久一次（频率）/ 多长时间（时长）", "forms": "—"}, {"pos": "名词", "da": "en bus", "zh": "公交车（单数定指与复数双写 s）", "forms": "bussen, busser, busserne"}, {"pos": "名词", "da": "en klokke", "zh": "钟表；klokken... ……点钟", "forms": "klokken, klokker, klokkerne"}, {"pos": "名词", "da": "et kvarter", "zh": "一刻钟（15 分钟）", "forms": "kvarteret, kvarter / kvarterer, kvartererne"}, {"pos": "名词", "da": "en tur", "zh": "一趟行程；散步，出行", "forms": "turen, tur "8ae4d7f739dd217f", "om morgenen kører den hvert tiende minut men i weekenden kører den kun én gang i timen": "35be4992ea742fba", "okay det er godt at vide hvor lang tid tager turen ind til banegården": "b462a4737ef7be14", "herfra tager det cirka tyve minutter skal du på sprogskole eller på arbejde": "3c0d5c190566c9c2", "jeg skal på arbejde i dag men på mandag starter mit nye hold på skolen": "5bfa7a7904c2822a", "spændende hvornår møder du på skolen om mandagen": "8601e58ed750ebc1", "om mandagen møder jeg klokken halv ni så jeg tager bussen fem minutter i otte men på fredag har jeg et tidligt møde kvart i otte": "a88de645a6f97596", "se nu kommer bussen faktisk klokken er ti minutter over otte præcis god arbejdsdag": "c9468fdd3888f801", "hvornår": "a590855b461fc009", "hvor tit": "4029e23f7e3bbb8f", "hvor lang tid": "3f292dfe10e87369", "en bus": "b1c8857a90ad401f", "en klokke": "634f9365562d082e", "et kvarter": "4c6a5d1475e78601", "en tur": "0bfdf1f82631acbe", "en banegård": "27a1669ca09d951a", "et stoppested": "2e64443d1e753163", "et arbejde": "0adc3386ff3ea1a0", "en weekend": "a60345b48ea5010c", "en morgen": "84df376e2ab15e87", "et møde": "ca251e215c11e892", "at vide": "2b54e91351c3dfdb", "at gå": "c4820ea4c0321a46", "at køre": "b11d9943b7583f4c", "at starte": "62816f3367569f84", "at møde": "4cbe24d458c61b68", "cirka": "b2d20e8efdb7b53d", "næste": "b09d2d440f7ddb7d", "tidlig": "935f52b3e29b506e"}, "key": "ncd1-L05"}, {"book": "ncd1", "lesson": 6, "title_da": "En travl mandag morgen", "title_zh": "忙碌的周一早晨", "grammar": "中心状语（Centraladverbier：ikke, altid, aldrig, tit, ofte, også, kun）在普通陈述句、倒装陈述句及疑问句中的精确位置 · 反身代词（mig, dig, sig, os, jer）与高频反身动词初探", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "周一早上七点整，合租室友 Freja 已经起床准备出门了，而 Lukas 还躺在床上没醒。两人展开了一场分秒必争的早晨大作战。", "paras": [{"zh": "卢卡斯，醒醒！已经七点了，你怎么还躺在床上！", "note": "vågn op ˈvʌʊ̯ˀn ˈʌb（g 滑化为 ʊ̯）；allerede aləˈʁɛːðə（软 ð）；stadig ˈsdæːði（词尾 g 不发音，读作 i）。", "segs": [{"id": "dialog-1", "who": "Freja", "da": "Lukas, vågn op! Klokken er allerede syv, og du ligger stadig i sengen!", "a": "f59e48b67d6c1f7a", "dur": 5.16}]}, {"zh": "啊糟糕！我每周一总是忘记看表。我只有十五分钟了吗？", "note": "altid ˈalˀtiðˀ（日常快速口语常省略尾音读成 ˈalˀti）；tjekke ˈtɕɛɡə；uret ˈuɐ̯ˀð（中性定指后缀弱读）。", "segs": [{"id": "dialog-2", "who": "Lukas", "da": "Åh nej! Jeg glemmer altid at tjekke uret om mandagen. Har jeg kun femten minutter?", "a": "d14c1587dc288119", "dur": 5.32}]}, {"zh": "对，你得抓紧了！我现在去浴室快速洗漱一下。", "note": "skynde dig ˈsgønə dɑɪ̯（nd 中的 d 不发音，y 圆唇读接近 ø）；hurtigt ˈhuɐ̯di（词尾 g 和 t 均不发音！）；badeværelset ˈbæːðəˌvæːɐlsəð。", "segs": [{"id": "dialog-3", "who": "Freja", "da": "Ja, du skal skynde dig! Jeg vasker mig hurtigt i badeværelset nu.", "a": "e9c56ff02d1b6f8c", "dur": 3.72}]}, {"zh": "好，我马上穿衣服。但没有咖啡，我从来不吃早饭的。", "note": "klæder mig på ˈkʰlɛːðɐ mɑɪ̯ ˈpʰɔːˀ（d 极轻或近乎脱落）；med det samme mɛ de ˈsamə（det 的 t 静音）；aldrig ˈaldʁi（g 静音）；morgenmad ˈmɒːnˌmað。", "segs": [{"id": "dialog-4", "who": "Lukas", "da": "Okay, jeg klæder mig på med det samme. Men jeg spiser aldrig morgenmad uden kaffe.", "a": "6a084efcc9d21598", "dur": 5.28}]}, {"zh": "你今天没时间喝咖啡了。每周一公交车经常来得太早。", "note": "ikke ˈeɡə（常简读为 eg）；ofte ˈʌfdə；for tidligt fɒ ˈtʰiːðli（tidligt 的 g 和 t 均静音）。", "segs": [{"id": "dialog-5", "who": "Freja", "da": "Du har ikke tid til kaffe i dag. Om mandagen kommer bussen ofte for tidligt.", "a": "58dd81ea91a33816", "dur": 4.72}]}, {"zh": "我的钥匙在哪儿？我每天早上总是丢钥匙！", "note": "nøgler ˈnʌɪ̯lɐ（øg 组合读作双元音 ʌɪ̯）；mister ˈmesdɐ。", "segs": [{"id": "dialog-6", "who": "Lukas", "da": "Hvor er mine nøgler? Jeg mister altid mine nøgler om morgenen!", "a": "6cd5f33967ab96f6", "dur": 3.92}]}, {"zh": "它们就放在门边的桌子上！你难道不也忘拿手机了吗？", "note": "telefon tʰeləˈfoːˀn（重音在最后一个音节）；ikke også eg ˈʌsə（også 中的 g 不发音）。", "segs": [{"id": "dialog-7", "who": "Freja", "da": "De ligger på bordet ved døren! Glemmer du ikke også din telefon?", "a": "68c3ee0c6ae6a89c", "dur": 4.28}]}, {"zh": "对对，谢谢提醒！不过我的自行车头盔呢？你经常拿我的头盔用吗？", "note": "Jo（反驳否定问句“不也忘了吗”→ “是呀谢谢！”）；cykelhjelm ˈsyɡəlˌjɛlˀm（hj- 中的 h 静音）；tit ˈtʰid。", "segs": [{"id": "dialog-8", "who": "Lukas", "da": "Jo, tak! Men hvor er min cykelhjelm? Tager du tit min hjelm?", "a": "11a0d8882d9e2052", "dur": 5.0}]}, {"zh": "才没有，我从不拿你的头盔。它就挂在门旁边。快点吧！", "note": "hænger ˈhɛŋˀɐ；Skynd dig! ˈsgønˀ dɑɪ̯（祈使句同样去掉 d 音，重音在 skynd 上）。", "segs": [{"id": "dialog-9", "who": "Freja", "da": "Nej, jeg tager aldrig din hjelm. Den hænger lige ved døren. Skynd dig nu!", "a": "09744aae6ff250ad", "dur": 4.68}]}, {"zh": "好，我现在看到了！我邻居彼得也正急匆匆往下跑呢——等等我！", "note": "skynder sig også ˈsgønˀɐ sɑɪ̯ ˈʌsə（注意 sig sɑɪ̯ 读法与 jeg 同韵）；ned ad trappen ˈneðˀ a ˈtʰʁabən（ad 的 d 不发音）。", "segs": [{"id": "dialog-10", "who": "Lukas", "da": "Ja, nu ser jeg den! Min nabo Peter skynder sig også ned ad trappen — vent på mig!", "a": "00efaee6cef7bf02", "dur": 5.0}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "总是", "note": "副词", "segs": [{"id": "g1", "who": "narrator", "da": "altid", "a": "78878561ea0da60e", "dur": 1.08}]}, {"zh": "从不（中心状语）", "note": "副词", "segs": [{"id": "g2", "who": "narrator", "da": "aldrig", "a": "c9320f699a2409f5", "dur": 1.08}]}, {"zh": "经常，常常（tit 更口语）", "note": "副词", "segs": [{"id": "g3", "who": "narrator", "da": "tit", "a": "a7342352df93c013", "dur": 0.88}]}, {"zh": "经常，常常（tit 更口语）", "note": "副词", "segs": [{"id": "g4", "who": "narrator", "da": "ofte", "a": "890b3558c671eb11", "dur": 0.72}]}, {"zh": "仅仅，只", "note": "副词", "segs": [{"id": "g5", "who": "narrator", "da": "kun", "a": "88ee3f02c1c2c182", "dur": 0.76}]}, {"zh": "仍然，还", "note": "副词", "segs": [{"id": "g6", "who": "narrator", "da": "stadig", "a": "1f136d91bc481a7d", "dur": 1.16}]}, {"zh": "他/她/它/他们自己", "note": "代词 · 反身系列：mig, dig, sig, os, jer", "segs": [{"id": "g7", "who": "narrator", "da": "sig", "say": "sig.", "a": "e1319ccae61541f6", "dur": 0.96}]}, {"zh": "赶快，抓紧", "note": "动词 · skynder sig, skyndte sig, har skyndt sig", "segs": [{"id": "g8", "who": "narrator", "da or", "da": "en morgenmad", "say": "en morgenmad.", "a": "78a4ac02e2694a29", "dur": 1.44}]}, {"zh": "钥匙", "note": "名词 · nøglen, nøgler, nøglerne", "segs": [{"id": "g18", "who": "narrator", "da": "en nøgle", "say": "en nøgle. nøglen, nøgler, nøglerne.", "a": "4d3279c809f68be2", "dur": 4.96}]}, {"zh": "自行车头盔", "note": "名词 · cykelhjelmen, cykelhjelme, cykelhjelmene", "segs": [{"id": "g19", "who": "narrator", "da": "en cykelhjelm", "say": "en cykelhjelm. cykelhjelmen, cykelhjelme, cykelhjelmene.", "a": "b12793abad43e91a", "dur": 5.04}]}, {"zh": "忙碌的", "note": "形容词 · travlt, travle)", "segs": [{"id": "g20", "who": "narrator", "da": "travl", "say": "travl. travlt, travle).", "a": "610d1fc8b6e00b24", "dur": 3.48}]}, {"zh": "快的", "note": "形容词 · (hurtigt, hurtige", "segs": [{"id": "g21", "who": "narrator", "da": "hurtig", "say": "hurtig. (hurtigt, hurtige.", "a": "86f47d35e32abc06", "dur": 3.68}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "副词", "da": "altid / aldrig", "zh": "总是 / 从不（中心状语）", "forms": "—"}, {"pos": "副词", "da": "tit / ofte", "zh": "经常，常常（tit 更口语）", "forms": "—"}, {"pos": "副词", "da": "kun / stadig", "zh": "仅仅，只 / 仍然，还", "forms": "—"}, {"pos": "代词", "da": "sig", "zh": "他/她/它/他们自己", "forms": "反身系列：mig, dig, sig, os, jer"}, {"pos": "动词", "da": "at skynde sig", "zh": "赶快，抓紧", "forms": "skynder sig, skyndte sig, har skyndt sig"}, {"pos": "动词", "da": "at vaske sig", "zh": "洗漱，洗（自己）", "forms": "vasker sig, vaskede sig, har vasket sig"}, {"pos": "动词", "da": "at klæde sig på", "zh": "穿好衣服", "forms": "klæder sig på, klædte sig på, har klædt sig på"}, {"pos": "动词 [er]", "da": "at vågne", "zh": "醒来（完成时用 er）", "forms": "vågner, vågnede, er vågnet"}, {"pos": "动词", "da": "at glemme", "zh": "忘记", "forms": "glemmer, glemte, har glemt"}, {"pos": "动词", "da": "at miste", "zh": "丢失，失去", "forms": "mister, mistede, har mistet"}, {"pos": "动词", "da": "at vente", "zh": "等待（vente på 等候）", "forms": "venter, ventede, har ventet"}, {"pos": "名词", "da"
