eje", "zh": "房租", "forms": "huslejen, huslejer, huslejerne"}, {"pos": "名词", "da": "en altan", "zh": "阳台", "forms": "altanen, altaner, altanerne"}, {"pos": "名词", "da": "et fælleskøkken", "zh": "公共厨房", "forms": "fælleskøkkenet, fælleskøkkener, -erne"}, {"pos": "名词", "da": "en støj / larm", "zh": "噪音，喧闹声", "forms": "støjen / larmen, ingen flertal"}, {"pos": "名词", "da": "en fordel / en ulempe", "zh": "优点，好处 / 缺点，弊端", "forms": "fordelen, fordele / ulempen, ulemper"}, {"pos": "形容词", "da": "rodet / ryddelig", "zh": "凌乱的 / 整洁的", "forms": "rodet (-, rodede) / ryddelig (-t, -e"}, {"pos": "形容词", "da": "streng / lys", "zh": "严格的 / 明亮的", "forms": "streng (-t, -e) / lys (lyst, lyse"}, {"pos": "代词", "da": "som / der", "zh": "关系从句引导词（……的）", "forms": "关系代词，不变"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "我合租的这套公寓有一个很大的阳台。", "answer": "Delelejligheden, som jeg bor i, har en meget stor altan."}, {"zh": "这就是我每天早上乘坐的那趟公交车。", "answer": "Det er den bus, som jeg tager hver morgen."}, {"zh": "你租的那个房间每个月房租多少钱？（Hvor meget koster værelset, som...?）", "answer": "Hvor meget koster det værelse, som du lejer, om måneden?"}]}, {"id": "A", "type": "drill", "title": "练习 A：填关系代词（判断每空应填 som、der，还是 begge [som/der 皆可]）", "items": [{"prompt": "Jeg bor i en lejlighed, {{_}} ligger tæt på stationen.", "kind": "cloze", "blanks": [["begge"]], "explain": "⟦som / der⟧ 皆可，后接动词 ⟦ligger⟧，作主语"}, {"prompt": "Værelset, {{_}} jeg lejer hos en familie, er meget stille.", "kind": "cloze", "blanks": [["som"]], "explain": "只能用 ⟦som⟧，后接主语 ⟦jeg⟧，作宾语"}, {"prompt": "De har et stort køkken, {{_}} altid er rent og pænt.", "kind": "cloze", "blanks": [["begge"]], "explain": "⟦som / der⟧ 皆可，后接副词 + 动词 ⟦altid er⟧，作主语"}, {"prompt": "Familien, {{_}} Hassan bor hos, laver god mad om søndagen.", "kind": "cloze", "blanks": [["som"]], "explain": "只能用 ⟦som⟧，后接主语 ⟦Hassan⟧，且搭配句尾介词 ⟦hos⟧"}, {"prompt": "Jeg kender en studerende, {{_}} ikke kan lide at bo på kollegium.", "kind": "cloze", "blanks": [["begge"]], "explain": "⟦som / der⟧ 皆可，后接 ⟦ikke kan lide⟧，作主语"}, {"prompt": "Altanen, {{_}} Clara spiser morgenmad på, får masser af sol.", "kind": "cloze", "blanks": [["som"]], "explain": "只能用 ⟦som⟧，后接主语 ⟦Clara⟧，搭配句尾介词 ⟦på⟧"}, {"prompt": "Det er en bus, {{_}} kører direkte til universitetet.", "kind": "cloze", "blanks": [["begge"]], "explain": "⟦som / der⟧ 皆可，后接动词 ⟦kører⟧，作主语"}, {"prompt": "Den nye sofa, {{_}} vi købte i går, står nu i stuen.", "kind": "cloze", "blanks": [["som"]], "explain": "只能用 ⟦som⟧，后接主语 ⟦vi⟧，作宾语"}]}, {"id": "B", "type": "drill", "title": "练习 B：用关系从句合并两个句子（第 3–5 题注意句尾介词，第 6 题注意 ikke/aldrig 位置）", "items": [{"prompt": "Jeg har en roomie. Hun elsker at lave mad. →", "kind": "write", "accept": ["Jeg har en roomie, der / som elsker at lave mad."]}, {"prompt": "Vi bor i en gammel bygning. Jeg fandt den på nettet. →", "kind": "write", "accept": ["Vi bor i en gammel bygning, som jeg fandt på nettet."], "explain": "去掉重复代词 ⟦den⟧"}, {"prompt": "Det er en sød familie. Jeg lejer et værelse hos dem. → ⟦Det er en sød familie, som...⟧", "kind": "write", "accept": ["Det er en sød familie, som jeg lejer et værelse hos."], "explain": "去掉 ⟦dem⟧，保留介词 ⟦hos⟧"}, {"prompt": "Vi har en stor have. Børnene leger altid i den. → ⟦Vi har en stor have, som...⟧", "kind": "write", "accept": ["Vi har en stor have, som børnene altid leger i."], "explain": "保留介词 ⟦i⟧，且 ⟦altid⟧ 放从句动词前"}, {"prompt": "Jeg har fået en ny cykel. Jeg cykler til arbejde på den. → ⟦Jeg har fået en ny cykel, som...⟧", "kind": "write", "accept": ["Jeg har fået en ny cykel, som jeg cykler til arbejde på."]}, {"prompt": "Han har en nabo. Naboen rydder aldrig op i køkkenet. →", "kind": "write", "accept": ["Han har en nabo, der / som aldrig rydder op i køkkenet."], "explain": "注意 ⟦aldrig⟧ 前置！"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（灵活运用 som/der 与住房词汇）", "items": [{"prompt": "我住在一条离市中心很近的安静街道上。（用关系从句）", "kind": "write", "accept": ["Jeg bor på en stille gade, der / som ligger tæt på centrum."]}, {"prompt": "我合租的这套公寓有一个很大的阳台。", "kind": "write", "accept": ["Delelejligheden, som jeg bor i, har en meget stor altan."]}, {"prompt": "这就是我每天早上乘坐的那趟公交车。", "kind": "write", "accept": ["Det er den bus, som jeg tager hver morgen."]}, {"prompt": "我不喜欢那些经常在半夜制造噪音的邻居。", "kind": "write", "accept": ["Jeg kan ikke lide naboer, der / som ofte larmer midt om natten."]}, {"prompt": "你租的那个房间每个月房租多少钱？（⟦Hvor meget koster værelset, som...?⟧）", "kind": "write", "accept": ["Hvor meget koster det værelse, som du lejer, om måneden?"]}]}], "clips": {"når nye studerende flytter til aarhus i august er det første store projekt ofte at finde et godt sted at bo": "b8e816f08a98917d", "der findes især tre muligheder i byen": "3861a673de897642", "mange unge starter på et kollegium der ofte er den billigste løsning": "94007456d7fa322a", "her får man et lille værelse som ligger på en gang med ti andre studerende og et stort fælleskøkken som alle deler": "92eb0df44db2a7fc", "det er nemt at få nye venner her fordi man møder naboer der altid hjælper hinanden med lektierne": "51e2d8e8eabce4b2", "andre foretrækker en delelejlighed i midtbyen sammen med gode venner": "f3f65ac4a9c438f5", "lejligheden som de lejer sammen har tit en hyggelig stue og et køkken som de ikke behøver at dele med fremmede": "549ea93b36916b68", "endelig vælger nogle at leje et værelse hos en dansk familie i et roligt kvarter": "fbdea1d971f46b04", "familien som man bor hos giver ofte gode råd om livet i aarhus selvom husreglerne nogle gange er lidt strengere": "659e00e5d1520554", "nicolai": "a0cabaa0dccacba8", "jeg læser biologi og bor på et stort kollegium der ligger ti minutter på cykel fra universitetet": "92778b5d6f01c0b8", "huslejen som jeg betaler hver måned er heldigvis ikke så høj": "eb7aac8a41975b02", "jeg elsker det sociale liv på gangen og vores fredagsbar": "32d1636a37c0c6c6", "det eneste problem er fælleskøkkenet som ofte er ret rodet fordi nogle af mine naboer glemmer at vaske op efter sig": "8dde pe": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Kærlighed ved første klik — og i løbeklubben（叙事短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "I Danmark bor mange voksne alene, men de fleste drømmer om at møde den rigtige partner.", "a": "d2636eefd6f2ea72", "dur": 5.64}, {"id": "a2", "who": "narrator", "da": "Martin havde været single i næsten to år og arbejdede mange timer på et kontor. [[Derfor]] **oprettede han** en profil på en dansk dating-app, selvom han egentlig var lidt skeptisk.", "a": "b373b0be96db164d", "dur": 8.92}], "zh": "在丹麦，许多成年人独自居住，但大多数人还是梦想着能遇到对的伴侣。马丁已经单身近两年了，而且在办公室工作时间很长。因此，他在一款丹麦约会软件上创建了个人资料，尽管他其实对此有点怀疑。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Den første uge svarede ingen på hans beskeder. [[Desværre]] **tænkte Martin**, at netdating slet ikke virkede for ham.", "a": "bd131f43b6a8f5d1", "dur": 6.56}, {"id": "a4", "who": "narrator", "da": "\"Giv ikke op så hurtigt, [[ellers]] **møder du** jo aldrig nogen!\" sagde hans søster og grinte. [[Alligevel]] **besluttede han** først at slette sin profil efter weekenden.", "a": "a2abefcbfb08ff4c", "dur": 8.92}], "zh": "第一周没有任何人回复他的消息。遗憾的是，马丁心想网上约会根本不适合自己。“别这么快放弃呀，否则你可永远遇不到人！”他妹妹笑着说。尽管如此，他还是决定等周末过完再注销账号。"}, {"segs": [{"id": "a5", "who": "narrator", "da": "Dagen efter skrev Line pludselig til ham!", "a": "d5d5465f7725987b", "dur": 2.4}, {"id": "a6", "who": "narrator", "da": "De elskede begge at lave mad og løbe lange ture. [[Desuden]] **boede de** kun fem minutter fra hinanden i Odense!", "a": "011e85f995ac4202", "dur": 5.64}], "zh": "第二天，莉娜突然给他发了消息！他们俩都喜欢做饭和长跑。此外，他们在欧登塞的住处相距竟然只有五分钟路程！"}, {"segs": [{"id": "a7", "who": "narrator", "da": "Før deres første møde på en lille café var Martin ret nervøs. [[Heldigvis]] **snakkede de** uden pause i tre timer, og bagefter meldte de sig ind i den samme løbeklub.", "a": "076a7548877c8443", "dur": 9.56}], "zh": "在一家小咖啡馆第一次见面前，马丁相当紧张。幸运的是，他们不停地聊了整整三个小时，后来还一起加入了同一家跑步俱乐部。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Danskerne finder kærlighed på nettet（对标 DU3 Modul 2 Læsning Opgave 3：Cloze）", "scene": null, "paras": [{"cue": "Læsning Opgave 3｜Ord i tekst（语篇完形填空）", "segs": [{"id": "b1", "who": "narrator", "da": "Flere og flere danskere bor alene, spiser aftensmad alene og drikker morgenkaffen alene.", "a": "b392a09912d5a54f", "dur": 5.84}, {"id": "b2", "who": "narrator", "da": "Men mange savner en kæreste, og (1) ___ søger de kærligheden på nettet.", "say": "Men mange savner en kæreste, og derfor søger de kærligheden på nettet.", "a": "d345c6b65a4715a7", "dur": 4.28}]}, {"segs": [{"id": "b3", "who": "narrator", "da": "I gamle dage måtte man gå på diskotek eller til fest, hvis man ville møde en sød partner.", "a": "3495edbdb5988d4c", "dur": 5.0}, {"id": "b4", "who": "narrator", "da": "Men sådan er det ikke længere.", "a": "660f338348ad8988", "dur": 1.88}, {"id": "b5", "who": "narrator", "da": "I dag er netdating blevet meget populært, og der findes masser af apps at vælge imellem.", "a": "86ba0bc892eedf07", "dur": 4.52}, {"id": "b6", "who": "narrator", "da": "Der er for eksempel apps for ældre mennesker, for hundeejere (2) ___ for folk, der elsker sport.", "say": "Der er for eksempel apps for ældre mennesker, for hundeejere og for folk, der elsker sport.", "a": "b0458d712f135b77", "dur": 5.4}]}, {"segs": [{"id": "b7", "who": "narrator", "da": "Mange er lidt nervøse før det første møde i virkeligheden. (3) ___ tager de afsted til caféen, fordi man ikke kan mærke ægte kemi gennem en skærm. (4) ___ går snakken rigtig godt over en kop kaffe, selvom man skal huske at være tålmodig. (5) ___ fungerer det første møde ikke altid — men så kan man bare prøve igen. (6) ___ må du ikke skrive usande ting på din profil, for ærlighed er vigtigst!", "say": "Mange er lidt nervøse før det første møde i virkeligheden. Alligevel tager de afsted til caféen, fordi man ikke kan mærke ægte kemi gennem en skærm. Heldigvis går snakken rigtig godt over en kop kaffe, selvom man skal huske at være tålmodig. Desværre fungerer det første møde ikke altid — men så kan man bare prøve igen. Desuden må du ikke skrive usande ting på din profil, for ærlighed er vigtigst!", "a": "411a904052a9f5b7", "dur": 21.36}], "zh_all": "越来越多丹麦人独居、独自吃晚饭、独自喝早咖啡。但许多人想念有个伴侣的生活，因此他们上网寻找爱情。\n过去，如果想认识一位可爱的伴侣，人得去迪厅或参加派对。但如今已不再如此。如今网络约会变得非常流行，而且有大量软件可供选择。例如有面向老年人的、面向狗主人的，以及面向热爱运动人士的应用。\n许多人在现实中第一次见面前都会有点紧张。尽管如此，他们还是会前往咖啡馆，因为隔着屏幕无法感受到真正的默契。幸运的是，喝着咖啡聊起天来往往很顺利，虽然人也得记住保持耐心。遗憾的是，第一次见面并不总是顺利——不过那再试一次就好。此外，千万不要在个人资料上写不真实的信息，因为诚实才是最重要的！"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "创建，开设（账号/资料）", "note": "动词 [har] · opretter, oprettede, har oprettet", "segs": [{"id": "g1", "who": "narrator", "da": "at oprette", "say": "at oprette. opretter, oprettede, har oprettet.", "a": "52646512ac9674ab", "dur": 5.32}]}, {"zh": "删除", "note": "动词 [har] · sletter, slettede, har slettet", "segs": [{"id": "g2", "who": "narrator", "da": "at slette", "say": "at slette. sletter, slettede, har slettet.", "a": "e8b6553bf1b27ba3", "dur": 4.76}]}, {"zh": "报名加入（俱乐部/协会）", "note": "动词 [har] · melder, meldte, har meldt sig ind i", "segs": [{"id": "g3", "who": "narrator", "da": "at melde sig ind i", "say": "at melde sig ind i. melder, meldte, har meldt sig ind i.", "a": "08f350518b1ea900", "dur": 4.92}]}, {"zh": "起作用，运转顺利", "note": "动词 [har] · fungerer, fungerede, har fungeret", "segs": [{"id": "g4", "who": "narrator", "da": "at fungere", "say": "at fungere. fungerer, fungerede, har fungeret.", "a": "d110042051ad00a0", "dur": 4.92}]}, {"zh": "放弃", "note": "动词 [har] · giver, gav, har givet op", "segs": [{"id": "g5", "who": "narrator", "da": "at give op", "say": "at give op. giver, gav, har givet op.", "a": "fa4eae1db789eb5c", "dur": 4.88}]}, {"zh": "爱，爱情", "note": "名词 · kærligheden, ingen flertal", "segs": [{"id": "g6", "who": "narrator", "da": "en kærlighed", "say": "en kærlighed. kærligheden, ingen flertal.", "a": "f7d7b6443d132877", "dur": 4.48}]}, {"zh": "男朋友 / 女朋友", "note": "名词 · kæresten, kærester, kæresterne", "segs": [{"id": "g7", "who": "narrator", "da": "en kæreste", "say": "en kæreste. kæresten, kærester, kæresterne.", "a": "61fd728407314d33", "dur": 5.64}]}, {"zh": "伴侣，搭档", "note": "名词 · partneren, partnere, partnerne", "segs": [{"id": "g8", "who": "narrator", "da": "en partner", "say": "en partner. partneren, partnere, partnerne.", "a": "46e69abef6255d40", "dur": 4.04}]}, {"zh": "个人简介，账号主页", "note": "名词 · profilen, profiler, profilerne", "segs": [{"id": "g9", "who": "narrator", "da": "en profil", "say": "en profil. profilen, profiler, profilerne.", "a": "358df7e99f10076f", "dur": 4.52}]}, {"zh": "跑步俱乐部", "note": "名词 · løbeklubben, løbeklubber, løbeklubberne", "segs": [{"id": "g10", "who": "narrator", "da": "en løbeklub", "say": "en løbeklub. løbeklubben, løbeklubber, løbeklubberne.", "a": "db41113d46eb3848", "dur": 5.72}]}, {"zh": "诚实，坦诚", "note": "名词 · ærligheden, ingen flertal", "segs": [{"id": "g11", "who": "narrator", "da": "en ærlighed", "say": "en ærlighed. ærligheden, ingen flertal.", "a": "655c9fa44052bc1d", "dur": 4.28}]}, {"zh": "有耐心的", "note": "形容词 · -t, -e", "segs": [{"id": "g12", "who": "narrator", "da": "tålmodig", "say": "tålmodig.", "a": "8078d24c582b6bb3", "dur": 1.04}]}, {"zh": "不真实的", "note": "形容词 · -t, -e", "segs": [{"id": "g13", "who": "narrator", "da": "usand", "say": "usand.", "a": "1e00bffc5ca8003e", "dur": 1.16}]}, {"zh": "因此", "note": "副词", "segs": [{"id": "g14", "who": "narrator", "da": "derfor", "a": "b90c9fb2a94fc972", "dur": 1.04}]}, {"zh": "尽管如此，还是", "note": "副词", "segs": [{"id": "g15", "who": "narrator", "da": "alligevel", "a": "50aaf442b436d362", "dur": 0.96}]}, {"zh": "遗憾的是", "note": "副词", "segs": [{"id": "g16", "who": "narrator", "da": "desværre", "a": "bef698cae6feaf54", "dur": 0.96}]}, {"zh": "幸运的是", "note": "副词", "segs": [{"id": "g17", "who": "narrator", "da": "heldigvis", "a": "46c201c977e8b043", "dur": 1.16}]}, {"zh": "此外", "note": "副词", "segs": [{"id": "g18", "who": "narrator", "da": "desuden", "a": "08028aad49a0ecb5", "dur": 1.2}]}, {"zh": "否则（不然的话）", "note": "副词", "segs": [{"id": "g19", "who": "narrator", "da": "ellers", "a": "3ecb060aa2b892f2", "dur": 0.76}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "动词 [har]", "da": "at oprette", "zh": "创建，开设（账号/资料）", "forms": "opretter, oprettede, har oprettet"}, {"pos": "动词 [har]", "da": "at slette", "zh": "删除", "forms": "sletter, slettede, har slettet"}, {"pos": "动词 [har]", "da": "at melde sig ind i", "zh": "报名加入（俱乐部/协会）", "forms": "melder, meldte, har meldt sig ind i"}, {"pos": "动词 [har]", "da": "at fungere", "zh": "起作用，运转顺利", "forms": "fungerer, fungerede, har fungeret"}, {"pos": "动词 [har]", "da": "at give op", "zh": "放弃", "forms": "giver, gav, har givet op"}, {"pos": "名词", "da": "en kærlighed", "zh": "爱，爱情", "forms": "kærligheden, ingen flertal"}, {"pos": "名词", "da": "en kæreste", "zh": "男朋友 / 女朋友", "forms": "kæresten, kærester, kæresterne"}, {"pos": "名词", "da": "en partner", "zh": "伴侣，搭档", "forms": "partneren, partnere, partnerne"}, {"pos": "名词", "da": "en profil", "zh": "个人简介，账号主页", "forms": "profilen, profiler, profilerne"}, {"pos": "名词", "da": "en løbeklub", "zh": "跑步俱乐部", "forms": "løbeklubben, løbeklubber, løbeklubberne"}, {"pos": "名词", "da": "en ærlighed", "zh": "诚实，坦诚", "forms": "ærligheden, ingen flertal"}, {"pos": "形容词", "da": "tålmodig / usand", "zh": "有耐心的 / 不真实的", "forms": "tålmodig (-t, -e) / usand (-t, -e"}, {"pos": "副词", "da": "derfor / alligevel", "zh": "因此 / 尽管如此，还是", "forms": "不变"}, {"pos": "副词", "da": "desværre / heldigvis", "zh": "遗憾的是 / 幸运的是", "forms": "不变"}, {"pos": "副词", "da": "desuden / ellers", "zh": "此外 / 否则（不然的话）", "forms": "不变"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "他很想学好丹麦语。因此他每天都看丹麦新闻。", "answer": "Han vil rigtig gerne lære godt dansk. Derfor ser han danske nyheder hver dag."}, {"zh": "虽然天下着雪，他还是骑车去上班了。（用 Alligevel）", "answer": "Det sneede. Alligevel cyklede han på arbejde."}, {"zh": "遗憾的是，我周日没有时间喝咖啡。", "answer": "Desværre har jeg ikke tid til at drikke kaffe på søndag."}, {"zh": "这家咖啡馆又便宜又安静。此外，服务员还很友好。（用 Desuden）", "answer": "Denne café er både billig og rolig. Desuden er tjenerne meget venlige."}, {"zh": "晚上十点前请发消息给我，否则我就睡觉了。（用 ellers）", "answer": "Send mig venligst en besked før klokken ti i aften, ellers går jeg i seng."}]}, {"id": "A", "type": "drill", "title": "练习 A：用六大连接副词填空（derfor, alligevel, desværre, heldigvis, desuden, ellers）", "items": [{"prompt": "Martin ville gerne møde en kæreste. {{_}} downloadede han en app.", "kind": "cloze", "blanks": [["Derfor"]], "explain": "因此"}, {"prompt": "Det øsregnede hele aftenen. {{_}} gik vi ud og spiste sammen.", "kind": "cloze", "blanks": [["Alligevel"]], "explain": "尽管如此，还是"}, {"prompt": "Jeg ville rigtig gerne komme til din fest, men {{_}} skal jeg arbejde på lørdag.", "kind": "cloze", "blanks": [["desværre"]], "explain": "遗憾的是——注意位于 ⟦men⟧ 之后，仍需主谓倒装：⟦men desværre skal jeg...⟧"}, {"prompt": "Bussen kørte allerede fra stoppestedet, men {{_}} nåede jeg den næste ti minutter efter.", "kind": "cloze", "blanks": [["heldigvis"]], "explain": "幸运的是"}, {"prompt": "Lejligheden er både stor og lys. {{_}} ligger den lige ved en dejlig park.", "kind": "cloze", "blanks": [["Desuden"]], "explain": "此外"}, {"prompt": "Du skal tage en varm jakke med, {{_}} fryser du helt sikkert i aften.", "kind": "cloze", "blanks": [["ellers"]], "explain": "否则"}, {"prompt": "Line elskede at løbe, og {{_}} meldte hun sig ind i en lokal løbeklub.", "kind": "cloze", "blanks": [["derfor"]], "explain": "位于 ⟦og⟧ 之后引发倒装：⟦og derfor meldte hun...⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：句首位置转换与逻辑改写（练习 V2 倒装与 fordi/derfor、selvom/alligevel 互换）", "items": [{"prompt": "把副词调到句首：⟦Han blev derfor hjemme i sengen.⟧ → ⟦Derfor...⟧", "kind": "write", "accept": ["Derfor blev han hjemme i sengen."]}, {"prompt": "把副词调到句首：⟦Hun smilte alligevel til alle i lokalet.⟧ → ⟦Alligevel...⟧", "kind": "write", "accept": ["Alligevel smilte hun til alle i lokalet."]}, {"prompt": "把副词调到句首：⟦Vi fik heldigvis to pladser ved vinduet.⟧ → ⟦Heldigvis...⟧", "kind": "write", "accept": ["Heldigvis fik vi to pladser ved vinduet."]}, {"prompt": "把副词调到句首：⟦Han glemte desværre at svare på beskeden.⟧ → ⟦Desværre...⟧", "kind": "write", "accept": ["Desværre glemte han at svare på beskeden."]}, {"prompt": "用 ⟦Derfor⟧ 改写此句：⟦Han købte en ny cykel, fordi den gamle var gået i stykker.⟧ →", "kind": "write", "accept": ["Hans gamle cykel var gået i stykker. Derfor købte han en ny cykel."]}, {"prompt": "用 ⟦Alligevel⟧ 改写此句：⟦Selvom Martin var meget nervøs, snakkede han rigtig godt med Line.⟧ →", "kind": "write", "accept": ["Martin var meget nervøs. Alligevel snakkede han rigtig godt med Line."]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（灵活运用六大连接副词与句首倒装）", "items": [{"prompt": "他很想学好丹麦语。因此他每天都看丹麦新闻。", "kind": "write", "accept": ["Han vil rigtig gerne lære godt dansk. Derfor ser han danske nyheder hver dag."]}, {"prompt": "虽然天下着雪，他还是骑车去上班了。（用 ⟦Alligevel⟧）", "kind": "write", "accept": ["Det sneede. Alligevel cyklede han på arbejde."], "explain": "或 ⟦Selvom det sneede, cyklede han alligevel på arbejde.⟧"}, {"prompt": "遗憾的是，我周日没有时间喝咖啡。", "kind": "write", "accept": ["Desværre har jeg ikke tid til at drikke kaffe på søndag."]}, {"prompt": "这家咖啡馆又便宜又安静。此外，服务员还很友好。（用 ⟦Desuden⟧）", "kind": "write", "accept": ["Denne café er både billig og rolig. Desuden er tjenerne meget venlige."]}, {"prompt": "晚上十点前请发消息给我，否则我就睡觉了。（用 ⟦ellers⟧）", "kind": "write", "accept": ["Send mig venligst en besked før klokken ti i aften, ellers går jeg i seng."]}]}], "clips": {"i danmark bor mange voksne alene men de fleste drømmer om at møde den rigtige partner": "d2636eefd6f2ea72", "martin havde været single i næsten to år og arbejdede mange timer på et kontor derfor oprettede han en profil på en dansk dating-app selvom han egentlig var lidt skeptisk": "b373b0be96db164d", "den første uge svarede ingen på hans beskeder desværre tænkte martin at netdating slet ikke virkede for ham": "bd131f43b6a8f5d1", "giv ikke op så hurtigt ellers møder du jo aldrig nogen sagde hans søster og grinte alligevel besluttede han først at slette sin profil efter weekenden": "a2abefcbfb08ff4c", "dagen efter skrev line pludselig til ham": "d5d5465f7725987b", "de elskede begge at lave mad og løbe lange ture desuden boede de kun fem minutter fra hinanden i odense": "011e85f995ac4202", "før deres første møde på en lille café var martin ret nervøs heldigvis snakkede de uden pause i tre timer og bagefter meldte de sig ind i den samme løbeklub": "076a7548877c8443", "flere og flere danskere bor alene spiser aftensmad alene og drikker morgenkaffen alene": "b392a09912d5a54f", "men mange savner en kæreste og (1) ___ søger de kærligheden på nettet": "d345c6b65a4715a7", "i gamle dage måtte man gå på diskotek eller til fest hvis man ville møde en sød partner": "3495edbdb5988d4c", "men sådan er det ikke længere": "660f338348ad8988", "i dag er netdating blevet meget populært og der findes masser af apps at vælge imellem": "86ba0bc892eedf07", "der er for eksempel apps for ældre mennesker for hundeejere (2) ___ for folk der elsker sport": "b0458d712f135b77", "mange er lidt nervøse før det første møde i virkeligheden (3) ___ tager de afsted til caféen fordi man ikke kan mærke ægte kemi gennem en skærm (4) ___ går snakken rigtig godt over en kop kaffe selvom man skal huske at være tålmodig (5) ___ fungerer det første møde ikke altid — men så kan man bare prøve igen (6) ___ må du ikke skrive usande ting på din profil for ærlighed er vigtigst": "411a904052a9f5b7", "at oprette": "52646512ac9674ab", "at slette": "e8b6553bf1b27ba3", "at melde sig ind i": "08f350518b1ea900", "at fungere": "d110042051ad00a0", "at give op": "fa4eae1db789eb5c", "en kærlighed": "f7d7b6443d132877", "en kæreste": "61fd728407314d33", "en partner": "46e69abef6255d40", "en profil": "358df7e99f10076f", "en løbeklub": "db41113d46eb3848", "en ærlighed": "655c9fa44052bc1d", "tålmodig": "8078d24c582b6bb3", "usand": "1e00bffc5ca8003e", "derfor": "b90c9fb2a94fc972", "alligevel": "50aaf442b436d362", "desværre": "bef698cae6feaf54", "heldigvis": "46c201c977e8b043", "desuden": "08028aad49a0ecb5", "ellers": "3ecb060aa2b892f2"}, "key": "ncd2-L14"}, {"book": "ncd2", "lesson": 15, "title_da": "Det første år i Danmark", "title_zh": "在丹麦的第一年", "grammar": "心理、习惯与适应动词固定搭配（vænne sig til, savne, glæde sig til, være nødt til, det lykkes for nogen at...）· 名词性宾语从句 at...", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Mit første år i Danmark（叙事短文 · 约 145 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "Da jeg flyttede til Danmark sidste efterår, vidste jeg ikke, **at** vinteren kunne være så mørk og blæsende.", "a": "d97dc25d2e81bbe4", "dur": 4.88}, {"id": "a2", "who": "narrator", "da": "I begyndelsen var jeg [[nødt til at købe]] en varm regnjakke, fordi jeg skulle cykle til sprogskolen i regnvejr hver morgen.", "a": "37b8dd3c4c427372", "dur": 6.84}], "zh": "去年秋天我刚搬到丹麦时，并不知道冬天会这么阴暗多风。起初我不得不买了一件厚实的防雨夹克，因为每天早上我都得顶着雨骑车去语言学校。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "De første måneder oplevede jeg et lille kulturchok.", "a": "1b811b545870b2e1", "dur": 3.24}, {"id": "a4", "who": "narrator", "da": "Jeg [[savnede]] min familie og den stærke sol i mit hjemland, og jeg troede ofte, **at** det ville blive umuligt at få danske venner.", "a": "0e3c4e01865212da", "dur": 6.2}, {"id": "a5", "who": "narrator", "da": "Folk virkede søde, men lidt stille på gaden.", "a": "ea0836a0ef6197b9", "dur": 2.96}], "zh": "头几个月我经历了一点小小的文化冲击。我很想念家人和家乡耀眼的阳光，也常常以为在这里几乎不可能交到丹麦朋友。大家看起来都挺友善，但在街上显得比较安静内敛。"}, {"segs": [{"id": "a6", "who": "narrator", "da": "Men langsomt begyndte jeg at [[vænne mig til]] den rolige hverdag — og endda til at cykle i modvind.", "a": "c611d57a63a7e29e", "dur": 5.04}, {"id": "a7", "who": "narrator", "da": "Efter et halvt år **lykkedes det for mig at få** et frivilligt arbejde i en hyggelig genbrugsbutik, hvor jeg øvede mit danske med kunderne.", "a": "f0732de49741a324", "dur": 6.8}], "zh": "不过慢慢地，我开始习惯了这种平静的生活节奏——甚至习惯了逆风骑车。半年后，我成功在一家温馨的二手店找到了一份志愿工作，在那里我和顾客们练习丹麦语。"}, {"segs": [{"id": "a8", "who": "narrator", "da": "I dag føler jeg endelig, **at** jeg hører til her, og jeg [[glæder mig allerede til]] min første lyse danske sommer!", "a": "38bbf020a71cb531", "dur": 5.88}], "zh": "今天，我终于觉得自己真正属于这里了，而且我已经迫不及待期待我在丹麦的第一个明亮夏天！"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Tre udlændinge om det første år i Danmark（对标 DU3 Modul 2 Læsning Opgave 4）", "scene": null, "paras": [{"cue": "Tre personer fortæller（三位外籍人士的自述 A / B / C）", "segs": [{"id": "b1", "who": "narrator", "da": "Elena fra Spanien", "label": "A.", "a": "dedc053d7e51902c", "dur": 1.56}, {"id": "b2", "who": "narrator", "da": "Jeg flyttede til Odense for at bo sammen med min danske kæreste.", "nl": true, "a": "244eb53b260adfff", "dur": 3.52}, {"id": "b3", "who": "narrator", "da": "Det sværeste i starten var mørket om vinteren og de tidlige spisetider!", "a": "382a5c525263e405", "dur": 4.92}, {"id": "b4", "who": "narrator", "da": "I Spanien spiser vi tit aftensmad kl. 21.30, så jeg skulle virkelig [[vænne mig til at spise]] allerede kl. 18.", "a": "88645b6f5afc99fb", "dur": 6.52}, {"id": "b5", "who": "narrator", "da": "Jeg [[savnede]] både solen og det livlige gadeliv.", "a": "db08d2a3327f4d99", "dur": 2.96}, {"id": "b6", "who": "narrator", "da": "Heldigvis meldte jeg mig ind i et lokalt kor, hvor **det lykkedes for mig at få** flere tætte danske venner.", "a": "3811865a13213159", "dur": 5.68}, {"id": "b7", "who": "narrator", "da": "Nu [[glæder jeg mig til]] vores første sommerferie på Fyn.", "a": "b3b85e80b7cb07b6", "dur": 2.92}]}, {"segs": [{"id": "b8", "who": "narrator", "da": "Kenji fra Japan", "label": "B.", "a": "4438b692990426ba", "dur": 1.8}, {"id": "b9", "who": "narrator", "da": "Jeg kom til København på grund af et job som programmør.", "nl": true, "a": "28ff53232fc00a40", "dur": 2.92}, {"id": "b10", "who": "narrator", "da": "På mit kontor taler alle engelsk, så jeg [[var nødt til at øve]] mit danske ude i byen og på sprogskolen.", "a": "7c523b5a3a4e7819", "dur": 5.92}, {"id": "b11", "who": "narrator", "da": "Det var hårdt i begyndelsen, men nu forstår jeg næsten alt og er rigtig glad for mit danske!", "a": "a70053d01be3e76e", "dur": 4.64}, {"id": "b12", "who": "narrator", "da": "Jeg blev også positivt overrasket over det flade hierarki på arbejdet, hvor alle siger du og bruger fornavn med chefen.", "a": "a0fb54bfc7ca29b1", "dur": 6.36}, {"id": "b13", "who": "narrator", "da": "Desuden [[vænnede jeg mig]] hurtigt [[til]] at cykle i regn og blæst.", "a": "1193318a9bd4a75f", "dur": 3.16}]}, {"segs": [{"id": "b14", "who": "narrator", "da": "Sarah fra Canada", "label": "C.", "a": "031e624b96a341e8", "dur": 2.08}, {"id": "b15", "who": "narrator", "da": "Jeg læser en kandidatuddannelse i Aarhus.", "nl": true, "a": "278b32949b8caf31", "dur": 2.72}, {"id": "b16", "who": "narrator", "da": "Mange spørger mig om vejret, men jeg er allerede vant til kulde og sne fra Canada, så den danske vinter generer mig slet ikke!", "a": "6de1bf0b65511e1e", "dur": 6.36}, {"id": "b17", "who": "narrator", "da": "Derimod [[savnede]] jeg mine gamle venner fra Montreal, fordi danskere ikke snakker så meget med fremmede i bussen.", "a": "a81344ba49a282fb", "dur": 5.84}, {"id": "b18", "who": "narrator", "da": "Efter fire måneder begyndte jeg som frivillig på en studiecafé, og der følte jeg mig straks velkommen.", "a": "eed1e2a9351ddb0d", "dur": 5.6}, {"id": "b19", "who": "narrator", "da": "Jeg har endnu ikke købt en cykel, så jeg tager bussen hver dag.", "a": "b129c131d6380ede", "dur": 3.16}], "zh_all": "A. 来自西班牙的埃琳娜：我为了和丹麦男朋友一起生活搬到了欧登塞。起初最难的是冬天的黑暗和超早的吃饭时间！在西班牙我们经常晚上九点半吃晚饭，所以我真的得习惯六点就吃晚饭。我既想念阳光也想念热闹的街头生活。幸好我加入了一个当地合唱团，在那里我成功交到了几位亲密的丹麦朋友。现在我正期待我们在菲英岛的第一个暑假。\nB. 来自日本的健司：我因为一份程序员的工作来到哥本哈根。在办公室大家都说英语，所以我不得不在城市生活和语言学校里练习丹麦语。刚开始很难，但现在我几乎什么都能听懂，也对自己的丹麦语水平很满意！我还对职场上扁平的层级感到惊喜——大家和老板都互相用“你”并直呼名字。此外，我也很快习惯了在风雨中骑车。\nC. 来自加拿大的莎拉：我在奥胡斯读硕士。很多人问我关于天气的事，但我在加拿大早就习惯了寒冷和下雪，所以丹麦的冬天一点也不困扰我！相反，我很想念在蒙特利尔的老朋友，因为丹麦人在公交车上不太和陌生人聊天。四个月后，我在一家学生咖啡馆做起了志愿者，在那里我立刻感到了欢迎。我还没买自行车，所以每天坐公交车。"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "习惯于（某事/做某事）", "note": "动词 [har] · vænner, vænnede, har vænnet sig til", "segs": [{"id": "g1", "who": "narrator", "da": "at vænne sig til", "say": "at vænne sig til. vænner, vænnede, har vænnet sig til.", "a": "ac279670d4e32f74", "dur": 4.88}]}, {"zh": "想念，怀念；缺少（直接接宾语）", "note": "动词 [har] · savner, savnede, har savnet", "segs": [{"id": "g2", "who": "narrator", "da": "at savne", "say": "at savne. savner, savnede, har savnet.", "a": "0d6a9972def6a1c3", "dur": 5.24}]}, {"zh": "期待，盼望", "note": "动词 [har] · glæder, glædede, har glædet sig til", "segs": [{"id": "g3", "who": "narrator", "da": "at glæde sig til", "say": "at glæde sig til. glæder, glædede, har glædet sig til.", "a": "65513ff5111363e0", "dur": 5.36}]}, {"zh": "不得不，必须（后接 at + 原形）", "note": "动词 [har] · er, var, har været nødt til", "segs": [{"id": "g4", "who": "narrator", "da": "at være nødt til", "say": "at være nødt til. er, var, har været nødt til.", "a": "3d4f6aa85efdb89d", "dur": 4.2}]}, {"zh": "成功做到（无人称 det lykkes）", "note": "动词 · lykkes, lykkedes, er lykkedes", "segs": [{"id": "g5", "who": "narrator", "da": "at lykkes", "say": "at lykkes. lykkes, lykkedes, er lykkedes.", "a": "977c0a46ae6c4456", "dur": 4.88}]}, {"zh": "属于；有归属感", "note": "动词 [har] · hører, hørte, har hørt til", "segs": [{"id": "g6", "who": "narrator", "da": "at høre til", "say": "at høre til. hører, hørte, har hørt til.", "a": "6755bb746d673fee", "dur": 4.56}]}, {"zh": "练习，操练", "note": "动词 [har] · øver, øvede, har øvet sig", "segs": [{"id": "g7", "who": "narrator", "da": "at øve sig (i/p "narrator", "da": "frivillig", "say": "frivillig.", "a": "988140ef9024da74", "dur": 0.96}]}, {"zh": "亲密的，紧密的", "note": "形容词 · tæt, tætte", "segs": [{"id": "g17", "who": "narrator", "da": "tæt", "say": "tæt. tæt, tætte.", "a": "3af7354c8d5e7b9f", "dur": 3.2}]}, {"zh": "习惯于……的（være vant til 状态）", "note": "形容词 · vant til (不变)", "segs": [{"id": "g18", "who": "narrator", "da": "vant til", "say": "vant til.", "a": "051699c8ad016335", "dur": 0.88}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "动词 [har]", "da": "at vænne sig til", "zh": "习惯于（某事/做某事）", "forms": "vænner, vænnede, har vænnet sig til"}, {"pos": "动词 [har]", "da": "at savne", "zh": "想念，怀念；缺少（直接接宾语）", "forms": "savner, savnede, har savnet"}, {"pos": "动词 [har]", "da": "at glæde sig til", "zh": "期待，盼望", "forms": "glæder, glædede, har glædet sig til"}, {"pos": "动词 [har]", "da": "at være nødt til", "zh": "不得不，必须（后接 at + 原形）", "forms": "er, var, har været nødt til"}, {"pos": "动词 [er]", "da": "at lykkes", "zh": "成功做到（无人称 det lykkes）", "forms": "lykkes, lykkedes, er lykkedes"}, {"pos": "动词 [har]", "da": "at høre til", "zh": "属于；有归属感", "forms": "hører, hørte, har hørt til"}, {"pos": "动词 [har]", "da": "at øve sig (i/på)", "zh": "练习，操练", "forms": "øver, øvede, har øvet sig"}, {"pos": "动词 [har]", "da": "at overraske", "zh": "使惊讶（blive overrasket over）", "forms": "overrasker, overraskede, har overrasket"}, {"pos": "名词", "da": "et kulturchok", "zh": "文化冲击", "forms": "kulturchokket, kulturchok, kulturchokkene"}, {"pos": "名词", "da": "et regnvejr", "zh": "雨天", "forms": "regnvejret, ingen flertal"}, {"pos": "名词", "da": "en modvind", "zh": "逆风", "forms": "modvinden, ingen flertal"}, {"pos": "名词", "da": "et hierarki", "zh": "等级制度，层级", "forms": "hierarkiet, hierarkier, hierarkierne"}, {"pos": "名词", "da": "en udlænding", "zh": "外国人", "forms": "udlændingen, udlændinge, udlændingene"}, {"pos": "名词", "da": "en genbrugsbutik", "zh": "二手店", "forms": "genbrugsbutikken, genbrugsbutikker, -erne"}, {"pos": "名词", "da": "et netværk", "zh": "人脉网络，社交圈", "forms": "netværket, netværk, netværkene"}, {"pos": "形容词", "da": "frivillig / tæt", "zh": "志愿的 / 亲密的，紧密的", "forms": "frivillig (-t, -e) / tæt (tæt, tætte"}, {"pos": "形容词", "da": "vant til", "zh": "习惯于……的（være vant til 状态）", "forms": "vant til (不变"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "我非常期待今年夏天和朋友们去露营。", "answer": "Jeg glæder mig rigtig meget til at tage på camping med mine venner til sommer."}, {"zh": "起初我不得不每天查很多丹麦语单词。（slå mange danske ord op）", "answer": "I starten var jeg nødt til at slå mange danske ord op hver dag."}, {"zh": "经过六个月的练习，她终于成功通过了 Modul 2 考试！（bestå prøven）", "answer": "Efter seks måneders øvelse lykkedes det endelig for hende at bestå Modul 2-prøven!"}, {"zh": "我们已经习惯了每天骑车去学校。", "answer": "Vi er allerede vant til at cykle i skole hver dag."}]}, {"id": "A", "type": "drill", "title": "练习 A：用正确的主格/反身代词、介词与动词形态填空", "items": [{"prompt": "Jeg glæder {{_}} rigtig meget {{_}} at holde ferie i juli.", "kind": "cloze", "blanks": [["mig"], ["til"]]}, {"prompt": "Det tog tre måneder for ham at vænne {{_}} {{_}} de tidlige aftensmadstider.", "kind": "cloze", "blanks": [["sig"], ["til"]], "explain": "注意这里主语不是 ⟦ham⟧，而是泛指“他”作为动作主体：⟦for ham at vænne sig til⟧"}, {"prompt": "I vintermånederne var vi nødt {{_}} købe varmere cykeltøj.", "kind": "cloze", "blanks": [["til at"]], "explain": "⟦nødt til at + 原形⟧"}, {"prompt": "Efter mange ansøgninger {{_}} (⟦lykkes⟧) det endelig for hende at få en praktikplads sidste uge.", "kind": "cloze", "blanks": [["lykkedes"]], "explain": "⟦sidste uge⟧ 表示过去具体时间，用过去时 ⟦lykkedes⟧"}, {"prompt": "Jeg {{_}} (⟦savner / savner til⟧) virkelig min families hjemmelavede mad.", "kind": "cloze", "blanks": [["savner"]], "explain": "及物动词直接接宾语，不加 ⟦til⟧"}, {"prompt": "Vi glæder {{_}} {{_}} at besøge jer i Aarhus næste måned!", "kind": "cloze", "blanks": [["os"], ["til"]]}, {"prompt": "De er allerede {{_}} (⟦vænne sig til / vant til⟧) det danske vejr, fordi de kommer fra Norge.", "kind": "cloze", "blanks": [["vant til"]], "explain": "系动词 ⟦er⟧ 后面用形容词词组 ⟦vant til⟧ 表示已经习惯的状态"}]}, {"id": "B", "type": "drill", "title": "练习 B：用 at 引导宾语从句完成或改写句子（注意从句副词 ikke / altid / ofte 位置）", "items": [{"prompt": "Jeg troede det. Det var ikke muligt at lære dansk på et år. → ⟦Jeg troede, at...⟧", "kind": "write", "accept": ["Jeg troede, at det ikke var muligt at lære dansk på et år."]}, {"prompt": "Han vidste det ikke. Busserne kører ikke så ofte om søndagen. → ⟦Han vidste ikke, at...⟧", "kind": "write", "accept": ["Han vidste ikke, at busserne ikke kører så ofte om søndagen."]}, {"prompt": "Jeg oplever det. Danskerne er ofte lidt stille i toget. → ⟦Jeg oplever, at...⟧", "kind": "write", "accept": ["Jeg oplever, at danskerne ofte er lidt stille i toget."]}, {"prompt": "Hun føler endelig det. Hun hører nu til i Danmark. → ⟦Hun føler endelig, at...⟧", "kind": "write", "accept": ["Hun føler endelig, at hun nu hører til i Danmark."]}, {"prompt": "Jeg vidste ikke, {{_}} (⟦at / om⟧) vinteren var så mørk i Skandinavien.", "kind": "cloze", "blanks": [["at"]], "explain": "表达已知的客观事实“冬天这么黑”，用 ⟦at⟧"}, {"prompt": "Vi håber, at vores nye nabo {{_}} (⟦ikke larmer / larmer ikke⟧) om aftenen.", "kind": "cloze", "blanks": [["ikke larmer"]], "explain": "⟦at⟧ 从句里否定词 ⟦ikke⟧ 置于动词之前"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹（综合练习五大固定搭配与 at 从句）", "items": [{"prompt": "我非常期待今年夏天和朋友们去露营。", "kind": "write", "accept": ["Jeg glæder mig rigtig meget til at tage på camping med mine venner til sommer."]}, {"prompt": "起初我不得不每天查很多丹麦语单词。（⟦slå mange danske ord op⟧）", "kind": "write", "accept": ["I starten var jeg nødt til at slå mange danske ord op hver dag."]}, {"prompt": "经过六个月的练习，她终于成功通过了 Modul 2 考试！（⟦bestå prøven⟧）", "kind": "write", "accept": ["Efter seks måneders øvelse lykkedes det endelig for hende at bestå Modul 2-prøven!"], "explain": "或 ⟦er det endelig lykkedes...⟧"}, {"prompt": "我们已经习惯了每天骑车去学校。", "kind": "write", "accept": ["Vi er allerede vant til at cykle i skole hver dag."], "explain": "强调状态用 ⟦er vant til⟧；强调渐渐习惯过程则用 ⟦har vænnet os til⟧"}, {"prompt": "我想念和家人在周末一起吃饭，但我觉得我现在已经属于这里了。", "kind": "write", "accept": ["Jeg savner at spise sammen med min familie i weekenden, men jeg føler, at jeg nu hører til her."]}]}], "clips": {"da jeg flyttede til danmark sidste efterår vidste jeg ikke at vinteren kunne være så mørk og blæsende": "d97dc25d2e81bbe4", "i begyndelsen var jeg nødt til at købe en varm regnjakke fordi jeg skulle cykle til sprogskolen i regnvejr hver morgen": "37b8dd3c4c427372", "de første måneder oplevede jeg et lille kulturchok": "1b811b545870b2e1", "jeg savnede min familie og den stærke sol i mit hjemland og jeg troede ofte at det ville blive umuligt at få danske venner": "0e3c4e01865212da", "folk virkede søde men lidt stille på gaden": "ea0836a0ef6197b9", "men langsomt begyndte jeg at vænne mig til den rolige hverdag — og endda til at cykle i modvind": "c611d57a63a7e29e", "efter et halvt år lykkedes det for mig at få et frivilligt arbejde i en hyggelig genbrugsbutik hvor jeg øvede mit danske med kunderne": "f0732de49741a324", "i dag føler jeg endelig at jeg hører til her og jeg glæder mig allerede til min første lyse danske sommer": "38bbf020a71cb531", "elena fra spanien": "dedc053d7e51902c", "jeg flyttede til odense for at bo sammen med min danske kæreste": "244eb53b260adfff", "det sværeste i starten var mørket om vinteren og de tidlige spisetider": "382a5c525263e405", "i spanien spiser vi tit aftensmad kl 2130 så jeg skulle virkelig vænne mig til at spise allerede kl 18": "88645b6f5afc99fb", "jeg savnede både solen og det livlige gadeliv": "db08d2a3327f4d99", "heldigvis meldte jeg mig ind i et lokalt kor hvor det lykkedes for mig at få flere tætte danske venner": "3811865a13213159", "nu glæder jeg mig til vores første sommerferie på fyn": "b3b85e80b7cb07b6", "kenji fra japan": "4438b692990426ba", "jeg kom til københavn på grund af et job som programmør": "28ff53232fc00a40", "på mit kontor taler alle engelsk så jeg var nødt til at øve mit danske ude i byen og på sprogskolen": "7c523b5a3a4e7819", "det var hårdt i begyndelsen men nu forstår jeg næsten alt og er rigtig glad for mit danske": "a70053d01be3e76e", "jeg blev også positivt overrasket over det flade hierarki på arbejdet hvor alle siger du og bruger fornavn med chefen": "a0fb54bfc7ca29b1", "desuden vænnede jeg mig hurtigt til at cykle i regn og blæst": "1193318a9bd4a75f", "sarah fra canada": "031e624b96a341e8", "jeg læser en kandidatuddannelse i aarhus": "278b32949b8caf31", "mange spørger mig om vejret men jeg er allerede vant til kulde og sne fra canada så den danske vinter generer mig slet ikke": "6de1bf0b65511e1e", "derimod savnede jeg mine gamle venner fra montreal fordi danskere ikke snakker så meget med fremmede i bussen": "a81344ba49a282fb", "efter fire måneder begyndte jeg som frivillig på en studiecafé og der følte jeg mig straks velkommen": "eed1e2a9351ddb0d", "jeg har endnu ikke købt en cykel så jeg tager bussen hver dag": "b129c131d6380ede", "at vænne sig til": "ac279670d4e32f74", "at savne": "0d6a9972def6a1c3", "at glæde sig til": "65513ff5111363e0", "at være nødt til": "3d4f6aa85efdb89d", "at lykkes": "977c0a46ae6c4456", "at høre til": "6755bb746d673fee", "at øve sig (i/på)": "702f4c4642b66147", "at overraske": "0cb1f7eb1619422f", "et kulturchok": "096b925c5cef716d", "et regnvejr": "ad8862b795aab0a9", "en modvind": "66ff248f52631287", "et hierarki": "f76126cb794759fa", "en udlænding": "d7ae679960a8e9cd", "en genbrugsbutik": "e5c2d6bf2de0884e", "et netværk": "e6c3c1e5e7aa2f33", "frivillig": "988140ef9024da74", "tæt": "3af7354c8d5e7b9f", "vant til": "051699c8ad016335"}, "key": "ncd2-L15"}, {"book": "ncd2", "lesson": 16, "title_da": "Fællesmiddag og rengøringsdag", "title_zh": "公共晚餐与大扫除日", "grammar": "相互代词 hinanden（互相，所有格 hinandens）vs 反身代词 sig · 共同与轮流表达（skiftes til at, være fælles om, hjælpe hinanden med, hver vores）", "sections": [{"id": "text-tekstA", "type": "text", "kind": "prose", "tab": "Tekst A", "title": "Tekst A：Fællesmiddag og rengøringsdag på gangen（叙事短文 · 约 155 词）", "scene": null, "paras": [{"segs": [{"id": "a1", "who": "narrator", "da": "På mit kollegium bor vi tolv studerende på samme gang.", "a": "d1cc0779917639fd", "dur": 2.84}, {"id": "a2", "who": "narrator", "da": "Vi har hver vores lille værelse, men vi **er fælles om** et stort og lyst køkken.", "a": "cf0df498366e55f1", "dur": 4.36}], "zh": "在我的学生宿舍里，同一条走廊住着十二名学生。我们每个人都有自己的小房间，但我们共用一个又大又明亮的厨房。"}, {"segs": [{"id": "a3", "who": "narrator", "da": "Hver tirsdag aften holder vi fællesmiddag.", "a": "a62f211d95c66579", "dur": 2.4}, {"id": "a4", "who": "narrator", "da": "Vi **skiftes til at** lave mad i par, så man kun skal lave mad for de andre én gang hver sjette uge.", "a": "1fee02c7961503c4", "dur": 4.64}, {"id": "a5", "who": "narrator", "da": "Rundt om det lange spisebord snakker vi, griner og [[hjælper hinanden med]] både lektier og praktiske ting.", "a": "317b750c7edc42fa", "dur": 5.68}, {"id": "a6", "who": "narrator", "da": "Sidste tirsdag hjalp vi for eksempel med at reparere [[hinandens]] cykler i gården.", "a": "708da80be17a0ad3", "dur": 3.48}], "zh": "每周二晚上，我们都会举办公共晚餐。大家两两搭档轮流做饭，所以每六周才需要为大家做一次饭。围坐在长餐桌旁，我们聊天、大笑，还在功课和生活琐事上互相帮忙。比如上周二，我们在院子里一起帮忙修好了彼此的自行车。"}, {"segs": [{"id": "a7", "who": "narrator", "da": "Men om søndagen har vi rengøringsdag, og det giver desværre tit diskussion!", "a": "655d21ce89a7c64a", "dur": 4.44}, {"id": "a8", "who": "narrator", "da": "Nogle gør grundigt rent, mens andre glemmer at tørre komfuret af eller tømme skraldespanden.", "a": "eddca150c275437d", "dur": 5.32}], "zh": "不过到了周日就是大扫除日，遗憾的是这经常引发争论！有些人打扫得很彻底，而另一些人却忘了擦灶台或倒垃圾。"}, {"segs": [{"id": "a9", "who": "narrator", "da": "Sidste søndag blev to beboere faktisk sure på [[hinanden]] på grund af nogle beskidte gryder i vasken.", "a": "795f354b7ea4cefe", "dur": 4.88}, {"id": "a10", "who": "narrator", "da": "Derfor holder hele gangen et hurtigt køkkenmøde i morgen, så vi kan lave en mere retfærdig plan og stadig være glade for at bo tæt på [[hinanden]].", "a": "bb5d1c1ea4eed976", "dur": 6.8}], "zh": "上周日，甚至有两位住户因为水槽里几个脏锅而互相生了气。因此，整条走廊明天要开一个简短的厨房会议，好让大家制定一个更公平的计划，继续开心地住在一起。"}]}, {"id": "text-tekstB", "type": "text", "kind": "prose", "tab": "Tekst B", "title": "Tekst B：Rengøringsplan & gruppechat（对标 DU3 Modul 2 Hverdagsbeskeder）", "scene": null, "paras": [{"cue": "Gruppechat｜Køkken 3B (torsdag aften)", "segs": [{"id": "b1", "who": "Jonas", "da": "Hej alle sammen!", "label": "Jonas", "a": "2846c01fda05bbc0", "dur": 1.12}, {"id": "b2", "who": "Jonas", "da": "Komfuret var desværre helt fedtet i morges, og skraldespanden var fuld.", "a": "b9301122f3b0e87b", "dur": 4.12}, {"id": "b3", "who": "Jonas", "da": "Kan vi ikke tale om det på søndag?", "a": "c661bbec810203e4", "dur": 1.92}, {"id": "b4", "who": "Sofie", "da": "Enig!", "nl": true, "label": "Sofie", "a": "355e89ac027a39ff", "dur": 1.0}, {"id": "b5", "who": "Sofie", "da": "Jeg tror, at problemet er, at folk har travlt alene.", "a": "865538a44171e926", "dur": 3.96}, {"id": "b6", "who": "Sofie", "da": "Hvad med, at vi altid arbejder to og to sammen og [[hjælper hinanden med]] de tunge opgaver?", "a": "af9d1568ce45734a", "dur": 5.04}, {"id": "b7", "who": "Sofie", "da": "Hvis én er syg eller bortrejst, kan man bytte uge med en anden på listen.", "a": "e01f38a3b88c95a2", "dur": 4.44}, {"id": "b8", "who": "Maya", "da": "Rigtig god idé, Sofie!", "nl": true, "label": "Maya", "a": "f3fb5f47e819272a", "dur": 1.8}, {"id": "b9", "who": "Maya", "da": "Så **skiftes vi til at** tage de store ting, og man glemmer ikke sin tur så let.", "a": "54d10fd3666447e8", "dur": 4.32}, {"id": "b10", "who": "Maya", "da": "Skal vi mødes i køkkenet på søndag kl. 19 for at aftale det?", "a": "e03aa0db505e0f19", "dur": 4.32}, {"id": "b11", "who": "Sofie", "da": "Ja! @Emil, kan du også komme kl. 19, og hvilken opgave vil du helst tage i næste uge?", "say": "Ja! Emil, kan du også komme kl. 19, og hvilken opgave vil du helst tage i næste uge?", "nl": true, "label": "Sofie", "a": "9be644dabc63bced", "dur": 6.08}], "zh_all": "第 46–47 周 3B 厨房清洁排班表（周日下午 16:00）：第 46 周灶台烤箱归索菲与埃米尔，地面洗碗归约纳斯与玛雅，垃圾与空瓶归莱尔克与阿里；第 47 周三组顺延轮换。\n群聊｜3B 厨房（周四晚）： 约纳斯：大家好！遗憾的是今天早上灶台全是油腻，垃圾桶也满了。我们周日能聊一下这事吗？ 索菲：同意！我觉得问题在于大家自己一个人时太忙了。不如我们总是两人一组合作，互相帮忙完成重活怎么样？如果谁生病或出门了，可以在表上跟别人换周。 玛雅：索菲这主意真棒！这样我们轮流承担大项工作，也不容易忘记轮到自己。我们周日晚上 19 点在厨房碰头定下来好吗？ 索菲：好！@埃米尔，你 19 点也能来吗？下周你最想负责哪一项？"}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "轮流，交替（做某事）", "note": "动词 [har] · skiftes, skiftedes, har skiftes", "segs": [{"id": "g1", "who": "narrator", "da": "at skiftes (til)", "say": "at skiftes (til). skiftes, skiftedes, har skiftes.", "a": "eff7a11838a9faa4", "dur": 5.04}]}, {"zh": "打扫卫生，做清洁", "note": "动词 [har] · gør, gjorde, har gjort rent", "segs": [{"id": "g2", "who": "narrator", "da": "at gøre rent", "say": "at gøre rent. gør, gjorde, har gjort rent.", "a": "58e96ebbfbd2b2f7", "dur": 5.0}]}, {"zh": "擦干净（桌台、灶台等）", "note": "动词 [har] · tørrer, tørrede, har tørret af", "segs": [{"id": "g3", "who": "narrator", "da": "at tørre af", "say": "at tørre af. tørrer, tørrede, har tørret af.", "a": "6d4e6a6c42b5d0e3", "dur": 4.2}]}, {"zh": "倒空，清空（垃圾桶等）", "note": "动词 [har] · tømmer, tømte, har tømt", "segs": [{"id": "g4", "who": "narrator", "da": "at tømme", "say": "at tømme. tømmer, tømte, har tømt.", "a": "a1d963cd579275f9", "dur": 4.48}]}, {"zh": "交换，调换（班次/周）", "note": "动词 [har] · bytter, byttede, har byttet", "segs": [{"id": "g5", "who": "narrator", "da": "at bytte", "say": "at bytte. bytter, byttede, har byttet.", "a": "e8977ad2068f80e9", "dur": 4.6}]}, {"zh": "提议，建议", "note": "动词 [har] · foreslår, foreslog, har foreslået", "segs": [{"id": "g6", "who": "narrator", "da": "at foreslå", "say": "at foreslå. foreslår, foreslog, har foreslået.", "a": "d0f1edb870b257f7", "dur": 5.16}]}, {"zh": "修理，维修", "note": "动词 [har] · reparerer, reparerede, har repareret", "segs": [{"id": "g7", "who"
