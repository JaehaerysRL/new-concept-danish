· bager, bagte, har bagt", "segs": [{"id": "g12", "who": "narrator", "da": "at bage", "say": "at bage. bager, bagte, har bagt.", "a": "616d27fb2e23e2a5", "dur": 4.56}]}, {"zh": "打包，包装", "note": "动词 · pakker, pakkede, har pakket", "segs": [{"id": "g13", "who": "narrator", "da": "at pakke", "say": "at pakke. pakker, pakkede, har pakket.", "a": "07c2d30df0ad8e0e", "dur": 4.48}]}, {"zh": "使用", "note": "动词 · bruger, brugte, har brugt", "segs": [{"id": "g14", "who": "narrator", "da": "at bruge", "say": "at bruge. bruger, brugte, har brugt.", "a": "6463980b257336f7", "dur": 4.52}]}, {"zh": "关闭（电器、灯）", "note": "动词 · slukker, slukkede, har slukket", "segs": [{"id": "g15", "who": "narrator", "da": "at slukke", "say": "at slukke. slukker, slukkede, har slukket.", "a": "e1131806955bf792", "dur": 4.6}]}, {"zh": "记住，记得", "note": "动词 · husker, huskede, har husket", "segs": [{"id": "g16", "who": "narrator", "da": "at huske", "say": "at huske. husker, huskede, har husket.", "a": "b403d5ebaf8f39e5", "dur": 3.84}]}, {"zh": "需要（否定 behøver ikke at...）", "note": "动词 · behøver, behøvede, har behøvet", "segs": [{"id": "g17", "who": "narrator", "da": "at behøve", "say": "at behøve. behøver, behøvede, har behøvet.", "a": "6062a7d33d20e21c", "dur": 5.32}]}, {"zh": "干净的，清洁的", "note": "形容词 · rent, rene", "segs": [{"id": "g18", "who": "narrator", "da": "ren", "say": "ren. rent, rene.", "a": "f3c120f09a096539", "dur": 3.04}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "代词", "da": "man", "zh": "人们，大家，一个人（泛指）", "forms": "仅作主语；宾格用 en"}, {"pos": "名词", "da": "et bageri", "zh": "面包店", "forms": "bageriet, bagerier, bagerierne"}, {"pos": "名词", "da": "et forklæde", "zh": "围裙", "forms": "forklædet, forklæder, forklæderne"}, {"pos": "名词", "da": "en hånd", "zh": "手（复数变音 hænder！）", "forms": "hånden, hænder, hænderne"}, {"pos": "名词", "da": "en handske", "zh": "手套", "forms": "handsken, handsker, handskerne"}, {"pos": "名词", "da": "et rundstykke", "zh": "（丹麦早餐）小圆面包", "forms": "rundstykket, rundstykker, rundstykkerne"}, {"pos": "名词", "da": "en tang", "zh": "夹子，钳子（复数变音 tænger）", "forms": "tangen, tænger, tængerne"}, {"pos": "名词", "da": "en disk", "zh": "柜台，收银台", "forms": "disken, diske, diskene"}, {"pos": "名词", "da": "en kunde", "zh": "顾客，客户", "forms": "kunden, kunder, kunderne"}, {"pos": "名词", "da": "en mobiltelefon", "zh": "手机（常简称为 en mobil）", "forms": "mobiltelefonen, mobiltelefoner, -ne"}, {"pos": "动词", "da": "at vaske", "zh": "洗（vaske hænder 洗手）", "forms": "vasker, vaskede, har vasket"}, {"pos": "动词", "da": "at bage", "zh": "烘焙，烤", "forms": "bager, bagte, har bagt"}, {"pos": "动词", "da": "at pakke", "zh": "打包，包装", "forms": "pakker, pakkede, har pakket"}, {"pos": "动词", "da": "at bruge", "zh": "使用", "forms": "bruger, brugte, har brugt"}, {"pos": "动词", "da": "at slukke", "zh": "关闭（电器、灯）", "forms": "slukker, slukkede, har slukket"}, {"pos": "动词", "da": "at huske", "zh": "记住，记得", "forms": "husker, huskede, har husket"}, {"pos": "动词", "da": "at behøve", "zh": "需要（否定 behøver ikke at...）", "forms": "behøver, behøvede, har behøvet"}, {"pos": "形容词", "da": "ren", "zh": "干净的，清洁的", "forms": "rent, rene"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "请进厨房，穿上一件干净的围裙！", "answer": "Kom ind i køkkenet, og tag et rent forklæde på!"}, {"zh": "在面包店里，大家必须始终使用夹子或手套。", "answer": "I et bageri skal man altid bruge en tang eller handsker."}, {"zh": "这里绝对不准戴戒指或使用手机。", "answer": "Her må man ikke have ringe på eller bruge mobilen."}, {"zh": "你今天不需要烤面包，只需要帮忙照看柜台。", "answer": "Du behøver ikke at bage brød i dag; du skal bare hjælpe ved disken."}, {"zh": "请关掉手机，记得微笑面对顾客！", "answer": "Vær sød at slukke mobilen, og husk at smile til kunderne!"}]}, {"id": "A", "type": "drill", "title": "练习 A：将下列动词改写为祈使句，并用 Vær sød at... 改写成礼貌指令", "items": [{"prompt": "⟦at pakke de friske rundstykker⟧ → {{_}}", "kind": "cloze", "blanks": [["Pak", "Vær sød at pakke de friske rundstykker!"]], "explain": "双写 k 截掉一个！"}, {"prompt": "⟦at slukke din mobiltelefon⟧ → {{_}}", "kind": "cloze", "blanks": [["Sluk", "Vær sød at slukke din mobiltelefon!"]], "explain": "双写 k 截掉一个！"}, {"prompt": "⟦at lægge mobilen i skabet⟧ → {{_}}", "kind": "cloze", "blanks": [["Læg", "Vær sød at lægge mobilen i skabet!"]], "explain": "双写 g 截掉一个！"}, {"prompt": "⟦at komme ind i køkkenet⟧ → {{_}}", "kind": "cloze", "blanks": [["Kom", "Vær sød at komme ind i køkkenet!"]], "explain": "双写 m 截掉一个！"}, {"prompt": "⟦at bruge rene handsker⟧ → {{_}}", "kind": "cloze", "blanks": [["Brug", "Vær sød at bruge rene handsker!"]]}], "example": "at vaske hænder → Vask hænder! / Vær sød at vaske hænder!"}, {"id": "B", "type": "drill", "title": "练习 B：根据语境选填 man skal、man må ikke 或 man behøver ikke at", "items": [{"prompt": "I et bageri {{_}} altid vaske hænderne, før man starter.", "kind": "cloze", "blanks": [["skal man"]], "explain": "句首地点状语触发 V2 倒装：⟦I et bageri skal man altid...⟧！"}, {"prompt": "Her bag disken {{_}} spise eller drikke kaffe – det er forbudt!", "kind": "cloze", "blanks": [["må man ikke"]], "explain": "严禁规定 + V2 倒装"}, {"prompt": "Som ny medarbejder {{_}} bage brød den første dag; du skal bare hjælpe ved disken.", "kind": "cloze", "blanks": [["behøver man ikke at"]], "explain": "没有必要 + V2 倒装"}, {"prompt": "Når man taler med kunderne, {{_}} altid være venlig og smile.", "kind": "cloze", "blanks": [["skal man"]], "explain": "从句在前触发主句 V2 倒装"}, {"prompt": "I vores kantine {{_}} tage madpakke med, for der er billig frokost.", "kind": "cloze", "blanks": [["behøver man ikke at"]], "explain": "不必自己带午餐盒 + V2 倒装"}, {"prompt": "På arbejdet {{_}} bruge sin private mobiltelefon.", "kind": "cloze", "blanks": [["må man ikke"]], "explain": "禁止上班用私人手机 + V2 倒装"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "请进厨房，穿上一件干净的围裙！", "kind": "write", "accept": ["Kom ind i køkkenet, og tag et rent forklæde på!"]}, {"prompt": "在面包店里，大家必须始终使用夹子或手套。", "kind": "write", "accept": ["I et bageri skal man altid bruge en tang eller handsker."]}, {"prompt": "这里绝对不准戴戒指或使用手机。", "kind": "write", "accept": ["Her må man ikke have ringe på eller bruge mobilen."]}, {"prompt": "你今天不需要烤面包，只需要帮忙照看柜台。", "kind": "write", "accept": ["Du behøver ikke at bage brød i dag; du skal bare hjælpe ved disken."]}, {"prompt": "请关掉手机，记得微笑面对顾客！", "kind": "write", "accept": ["Vær sød at slukke mobilen, og husk at smile til kunderne!"]}]}], "clips": {"velkommen til din første dag lukas kom ind i køkkenet og tag et rent forklæde på": "6c368d1ec288f8ca", "tak mette hvad skal man huske allerførst her i bageriet": "063ae6980f82a310", "vask altid hænderne grundigt først man skal have rent tøj på og man må ikke have ringe eller ur på": "7219831dc3d07968", "forstået behøver jeg så at bage brødet i dag": "73abc0fc9a08c9d0", "nej du behøver ikke at bage endnu vær sød at hjælpe ved disken og pak de friske rundstykker": "cf14d344bacd0375", "selvfølgelig skal man bruge handsker når man pakker brød og kager": "5e022409d3cfe177", "ja brug altid en tang eller handsker og husk at smile venligt til kunderne": "e809a7f6793f6832", "intet problem må man have sin mobiltelefon i lommen": "e17df0cd1231ada6", "nej man må ikke bruge mobilen ved disken vær sød at slukke den og lægge den i skabet skynd dig lidt vi åbner om fem minutter": "72f2188d59ae1e33", "helt i orden jeg slukker den nu og kommer ud med det samme": "ef38bad0b6c305d7", "man": "006ccde349878f65", "et bageri": "b21eef8bbcfbab46", "et forklæde": "a90d0a957e36f023", "en hånd": "9ccf99ffef949e11", "en handske": "be0a4b769fa30d24", "et rundstykke": "ccdadd052c4afcb1", "en tang": "ad23a324f558ab3c", "en disk": "ee9cf5608c396d98", "en kunde": "7a7bf1c82032ea6f", "en mobiltelefon": "47368a4bb0e05fa2", "at vaske": "a5c2bae2c2f0727a", "at bage": "616d27fb2e23e2a5", "at pakke": "07c2d30df0ad8e0e", "at bruge": "6463980b257336f7", "at slukke": "e1131806955bf792", "at huske": "b403d5ebaf8f39e5", "at behøve": "6062a7d33d20e21c", "ren": "f3c120f09a096539"}, "key": "ncd1-L13"}, {"book": "ncd1", "lesson": 14, "title_da": "Frokostpause i kantinen", "title_zh": "食堂的午休时间", "grammar": "人称代词宾格全表（mig, dig, ham, hende, den/det, os, jer, dem）· 喜好与态度评价搭配（kan godt lide, synes godt om, er glad for, er træt af）· 介词后代词格", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "中午十二点半，卢卡斯端着餐盘走进公司食堂（kantinen），在同事玛雅（Maja）对面坐下。两人边吃午饭边聊起食堂菜色、新老板安诺斯（Anders）和部门同事。", "paras": [{"zh": "嗨，玛雅！我可以坐你这儿吗？你觉得今天的午饭怎么样？", "note": "hos dig hos ˈdɑɪ̯（介词 hos 后用宾格 dig，词尾 g 滑成 ɪ̯）；synes ˈsynəs；frokosten ˈfʁɔkʰʌsdən。", "segs": [{"id": "dialog-1", "who": "Lukas", "da": "Hej Maja! Må jeg sidde her hos dig? Hvad synes du om frokosten i dag?", "a": "f3ccf4ebc28d6382", "dur": 4.52}]}, {"zh": "当然可以！我特别喜欢这儿食堂的沙拉，不过我对每周四都一样的汤有点吃腻了。", "note": "kan... lide kʰan... ˈliːˀ（lide 词尾 d 和 e 几乎不发音，读作“利”带喉塞音！）；salaten saˈlæːˀdən；torsdag ˈtʰɒɐ̯ˀsdæ（g 不发音）。", "segs": [{"id": "dialog-2", "who": "Maja", "da": "Ja, selvfølgelig! Jeg kan rigtig godt lide salaten her i kantinen, men jeg er lidt træt af den samme suppe hver torsdag.", "a": "48212bca54658a51", "dur": 7.52}]}, {"zh": "是啊，那汤是有点单调！不过鱼肉很新鲜——我觉得鱼肉挺不错的。", "note": "kedelig ˈkʰeːðəli（软 d，词尾 g 不发音）；fisken ˈfesɡən；synes godt om synəs ˈɡʌd ʌmˀ。", "segs": [{"id": "dialog-3", "who": "Lukas", "da": "Ja, den er lidt kedelig! Men fisken er frisk – jeg synes godt om den.", "a": "b887894e1868fe69", "dur": 4.52}]}, {"zh": "你在新部门其他方面都还顺利吗？你喜欢我们的老板安诺斯吗？", "note": "afdeling ˈɑʊ̯ˌdeːˀleŋ（af- 读 ɑʊ̯，重音在首音节）；glad for ˈɡlað ˈfɒː（glad 末尾软 d 极轻，常弱化至消失）。", "segs": [{"id": "dialog-4", "who": "Maja", "da": "Hvordan går det ellers i din nye afdeling? Er du glad for vores chef, Anders?", "a": "7aa4c59bfe271c46", "dur": 4.92}]}, {"zh": "喜欢，我对他非常满意！每次我向他请教问题，他总是会帮我。", "note": "ham ˈham（非重读时常弱读成 am）；mig ˈmɑɪ̯；spørger ˈsbɶɐ̯ˀ（中间 g 彻底静音！）。", "segs": [{"id": "dialog-5", "who": "Lukas", "da": "Ja, jeg er meget glad for ham! Han hjælper mig altid, når jeg spørger ham om noget.", "a": "e944c4306e59a103", "dur": 3.76}]}, {"zh": "听起来真不错。你认识三楼的同事西格妮吗？你经常跟她聊天吗？", "note": "Kender ˈkʰɛnɐ（-nd- 的 d 不发音）；Signe ˈsiːnə（中间 g 静音并拉长前面的 i！）；tredje ˈtʰʁɛðjə；hende ˈhenə（-nd- 的 d 不发音）。", "segs": [{"id": "dialog-6", "who": "Maja", "da": "Det lyder godt. Kender du også vores kollega Signe fra tredje sal? Taler du tit med hende?", "a": "fe26c1d65c9a4833", "dur": 5.92}]}, {"zh": "认识，她就坐在那边！她人特别好——虽然她语速很快，但我能听懂她的话。", "note": "derovre dɛɐ̯ˈʌʊ̯ɐ；forstår fɒˈsdɔːˀ；hurtigt ˈhuɐ̯di（-igt 中的 g 和 t 不发音！）。", "segs": [{"id": "dialog-7", "who": "Lukas", "da": "Ja, hun sidder derovre! Hun er rigtig sød – jeg forstår hende godt, selvom hun taler hurtigt.", "a": "5fed42cf8484af91", "dur": 4.68}]}, {"zh": "是呀，她非常乐于助人。顺便说一句，安诺斯还经常请我们吃周五蛋糕，我们大家都特别开心！", "note": "os ˈʌs（注意读短促的 ʌs，不是英语的 us）；for resten fʌ ˈʁɛsdən；alle sammen ˈalə ˈsamˀən。", "segs": [{"id": "dialog-8", "who": "Maja", "da": "Ja, hun er meget hjælpsom. Anders giver os for resten tit fredagskage, og vi er alle sammen glade for det!", "a": "2ecb60112c3fabae", "dur": 6.12}]}, {"zh": "太棒了！IT 部门的新同事们今天也和你们一起吃午饭吗？", "note": "Fedt! ˈfed（口语高频感叹词“酷/太棒了”）；kolleger kʰoˈleːɐ（中间 g 不发音！）；jer ˈjɛɐ̯。", "segs": [{"id": "dialog-9", "who": "Lukas", "da": "Fedt! Spiser de nye kolleger fra IT også sammen med jer i dag?", "a": "7c8478fa6c322cc0", "dur": 4.12}]}, {"zh": "不了，他们在开会，所以我们明天才能见到他们。这周五下班后，你要跟我们一起出去聚一下吗？", "note": "møde ˈmøːðə（软 d）；dem ˈdɛm；efter arbejde ɛfdɐ ˈɑːbɑɪ̯ˀdə（软 d）。", "segs": [{"id": "dialog-10", "who": "Maja", "da": "Nej, de sidder i et møde, så vi ser dem først i morgen. Vil du med os ud efter arbejde på fredag?", "a": "483789d07fba36ae", "dur": 5.72}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "我", "note": "代词", "segs": [{"id": "g1", "who": "narrator", "da": "mig", "a": "428ede9c47e67b1b", "dur": 1.12}]}, {"zh": "你", "note": "代词", "segs": [{"id": "g2", "who": "narrator", "da": "dig", "a": "19c877bd833c1644", "dur": 0.92}]}, {"zh": "他", "note": "代词", "segs": [{"id": "g3", "who": "narrator", "da": "ham", "a": "8b1714484ae05546", "dur": 0.88}]}, {"zh": "她（宾格）", "note": "代词", "segs": [{"id": "g4", "who": "narrator", "da": "hende", "a": "379fa4c94698db4c", "dur": 0.92}]}, {"zh": "我们", "note": "代词", "segs": [{"id": "g5", "who": "narrator", "da": "os", "a": "b78c5b2dc14405ef", "dur": 1.0}]}, {"zh": "你们", "note": "代词", "segs": [{"id": "g6", "who": "narrator", "da": "jer", "a": "84a8a3355a0a2496", "dur": 1.04}]}, {"zh": "他们（宾格）", "note": "代词", "segs": [{"id": "g7", "who": "narrator", "da": "dem", "a": "a01918885336b4dd", "dur": 0.68}]}, {"zh": "食堂，餐厅", "note": "名词 · kantinen, kantiner, kantinerne", "segs": [{"id": "g8", "who": "narrator", "da": "en kantine", "say": "en kantine. kantinen, kantiner, kantinerne.", "a": "836b308828a8661b", "dur": 6.12}]}, {"zh": "午休时间", "note": "名词 · frokostpausen, -pauser, -pauserne", "segs": [{"id": "g9", "who": "narrator", "da": "en frokostpause", "say": "en frokostpause.", "a": "5d1f1ebca2405e23", "dur": 1.8}]}, {"zh": "沙拉", "note": "名词 · salaten, salater, salaterne", "segs": [{"id": "g10", "who": "narrator", "da": "en salat", "say": "en salat. salaten, salater, salaterne.", "a": "3d53f3857e4aa5c3", "dur": 4.92}]}, {"zh": "汤", "note": "名词 · suppen, supper, supperne", "segs": [{"id": "g11", "who": "narrator", "da": "en suppe", "say": "en suppe. suppen, supper, supperne.", "a": "9f49d2fc1803c975", "dur": 4.44}]}, {"zh": "老板，主管", "note": "名词 · chefen, chefer, cheferne", "segs": [{"id": "g12", "who": "narrator", "da": "en chef", "say": "en chef. chefen, chefer, cheferne.", "a": "351d7545b71935b0", "dur": 4.28}]}, {"zh": "同事", "note": "名词 · kollegaen, kolleger, kollegerne", "segs": [{"id": "g13", "who": "narrator", "da": "en kollega", "say": "en kollega. kollegaen, kolleger, kollegerne.", "a": "5617196228c37456", "dur": 5.68}]}, {"zh": "部门", "note": "名词 · afdelingen, afdelinger, afdelingerne", "segs": [{"id": "g14", "who": "narrator", "da": "en afdeling", "say": "en afdeling. afdelingen, afdelinger, afdelingerne.", "a": "ee04dd6097417aa9", "dur": 5.16}]}, {"zh": "会议", "note": "名词 · mødet, møder, møderne", "segs": [{"id": "g15", "who": "narrator", "da": "et møde", "say": "et møde. mødet, møder, møderne.", "a": "ca251e215c11e892", "dur": 4.88}]}, {"zh": "觉得，认为（-s 异态动词，现在时不变）", "note": "动词 · synes, syntes, har syntes", "segs": [{"id": "g16", "who": "narrator", "da": "at synes", "say": "at synes. synes, syntes, har syntes.", "a": "e305a50e34468943", "dur": 4.52}]}, {"zh": "询问（spørge om 询问关于……）", "note": "动词 · spørger, spurgte, har spurgt", "segs": [{"id": "g17", "who": "narrator", "da": "at spørge", "say": "at spørge. spørger, spurgte, har spurgt.", "a": "fafb41270fea3013", "dur": 4.76}]}, {"zh": "认识，熟悉（人、地方）", "note": "动词 · kender, kendte, har kendt", "segs": [{"id": "g18", "who": "narrator", "da": "at kende", "say": "at kende. kender, kendte, har kendt.", "a": "72aaae997f59f4cb", "dur": 4.28}]}, {"zh": "理解，听懂", "note": "动词 · forstår, forstod, har forstået", "segs": [{"id": "g19", "who": "narrator", "da": "at forstå", "say": "at forstå. forstår, forstod, har forstået.", "a": "d43fb0bbe5ce4b8b", "dur": 4.36}]}, {"zh": "无聊的，单调的", "note": "形容词 · kedeligt, kedelige", "segs": [{"id": "g20", "who": "narrator", "da": "kedelig", "say": "kedelig. kedeligt, kedelige.", "a": "12cf2eb66ccf2acc", "dur": 3.76}]}, {"zh": "疲倦的/厌烦的；高兴的/满意的", "note": "形容词 · træt, trætte", "segs": [{"id": "g21", "who": "narrator", "da": "træt", "say": "træt. træt, trætte.", "a": "bba0f1e4b292d37c", "dur": 2.48}]}, {"zh": "疲倦的/厌烦的；高兴的/满意的", "note": "形容词 · glad, glade", "segs": [{"id": "g22", "who": "narrator", "da": "glad", "say": "glad. glad, glade.", "a": "b1c45d96f6f0a645", "dur": 3.32}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "代词", "da": "mig / dig / ham / hende", "zh": "我 / 你 / 他 / 她（宾格）", "forms": "宾格人称代词单数"}, {"pos": "代词", "da": "os / jer / dem", "zh": "我们 / 你们 / 他们（宾格）", "forms": "宾格人称代词复数"}, {"pos": "名词", "da": "en kantine", "zh": "食堂，餐厅", "forms": "kantinen, kantiner, kantinerne"}, {"pos": "名词", "da": "en frokostpause", "zh": "午休时间", "forms": "frokostpausen, -pauser, -pauserne"}, {"pos": "名词", "da": "en salat", "zh": "沙拉", "forms": "salaten, salater, salaterne"}, {"pos": "名词", "da": "en suppe", "zh": "汤", "forms": "suppen, supper, supperne"}, {"pos": "名词", "da": "en chef", "zh": "老板，主管", "forms": "chefen, chefer, cheferne"}, {"pos": "名词", "da": "en kollega", "zh": "同事", "forms": "kollegaen, kolleger, kollegerne"}, {"pos": "名词", "da": "en afdeling", "zh": "部门", "forms": "afdelingen, afdelinger, afdelingerne"}, {"pos": "名词", "da": "et møde", "zh": "会议", "forms": "mødet, møder, møderne"}, {"pos": "动词", "da": "at synes", "zh": "觉得，认为（-s 异态动词，现在时不变）", "forms": "synes, syntes, har syntes"}, {"pos": "动词", "da": "at spørge", "zh": "询问（spørge om 询问关于……）", "forms": "spørger, spurgte, har spurgt"}, {"pos": "动词", "da": "at kende", "zh": "认识，熟悉（人、地方）", "forms": "kender, kendte, har kendt"}, {"pos": "动词", "da": "at forstå", "zh": "理解，听懂", "forms": "forstår, forstod, har forstået"}, {"pos": "形容词", "da": "kedelig", "zh": "无聊的，单调的", "forms": "kedeligt, kedelige"}, {"pos": "形容词", "da": "træt / glad", "zh": "疲倦的/厌烦的；高兴的/满意的", "forms": "træt (træt, trætte) / glad (glad, glade"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "我非常喜欢食堂里的沙拉，但我讨厌那道乏味的汤。", "answer": "Jeg kan rigtig godt lide salaten i kantinen, men jeg er træt af den kedelige suppe."}, {"zh": "西格妮语速很快，但我依然很理解她。", "answer": "Signe taler hurtigt, men jeg forstår hende stadig godt."}, {"zh": "安诺斯经常在周五给我们带蛋糕，大家都为此很开心。", "answer": "Anders giver os tit fredagskage, og vi er alle sammen glade for det."}, {"zh": "我们周五下班后要出去，你想和我们一起去吗？", "answer": "Vi går ud efter arbejde på fredag – vil du med os?"}]}, {"id": "A", "type": "drill", "title": "练习 A：用括号中代词或名词对应的正确宾格形式填空", "items": [{"prompt": "Jeg kender godt Signe. Taler du ofte med {{_}}? (⟦hun⟧)", "kind": "cloze", "blanks": [["hende"]], "explain": "介词 ⟦med⟧ 后用宾格"}, {"prompt": "Anders er vores nye chef. Vi er alle sammen glade for {{_}}. (⟦han⟧)", "kind": "cloze", "blanks": [["ham"]], "explain": "介词 ⟦for⟧ 后用宾格"}, {"prompt": "Vi sidder i kantinen nu. Vil du spise frokost sammen med {{_}}? (⟦vi⟧)", "kind": "cloze", "blanks": [["os"]], "explain": "介词 ⟦med⟧ 后用宾格"}, {"prompt": "Kollegerne fra IT er til møde, så jeg ser {{_}} først efter pausen. (⟦de⟧)", "kind": "cloze", "blanks": [["dem"]], "explain": "动词 ⟦ser⟧ 的宾语"}, {"prompt": "Suppen er varm, men jeg kan desværre ikke lide {{_}}. (⟦en suppe⟧)", "kind": "cloze", "blanks": [["den"]], "explain": "回指共性词 ⟦suppen⟧"}, {"prompt": "Har du tid til at hjælpe {{_}} med den nye opgave? (⟦jeg⟧)", "kind": "cloze", "blanks": [["mig"]], "explain": "动词 ⟦hjælpe⟧ 的宾语"}, {"prompt": "Tusind tak for hjælpen – det er meget sødt af {{_}}! (⟦du⟧)", "kind": "cloze", "blanks": [["dig"]], "explain": "介词 ⟦af⟧ 后用宾格"}, {"prompt": "Lukas og Maja, skal jeg sende invitationen til {{_}}? (⟦I⟧)", "kind": "cloze", "blanks": [["jer"]], "explain": "直接向二人对话，介词 ⟦til⟧ 后用 ⟦I⟧ 的宾格 ⟦jer⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：用给定的评价表达按提示造句或改写", "items": [{"prompt": "将肯定句改为否定句：⟦Jeg kan godt lide den samme suppe hver uge.⟧ → {{_}}", "kind": "cloze", "blanks": [["Jeg kan ikke lide den samme suppe hver uge"]], "explain": "否定必须删掉 ⟦godt⟧！"}, {"prompt": "用 ⟦er glad for⟧ 替换：⟦Lukas kan godt lide sit nye arbejde.⟧ → {{_}}", "kind": "cloze", "blanks": [["Lukas er glad for sit nye arbejde"]]}, {"prompt": "用 ⟦er træt af⟧ 表达：“我对每天早起感到厌倦了。”（⟦at stå tidligt op⟧）→ {{_}}", "kind": "cloze", "blanks": [["Jeg er træt af at stå tidligt op hver dag"]]}, {"prompt": "用 ⟦synes godt om⟧ 提问：“你觉得你们的新办公室（⟦kontoret⟧）怎么样 / 你喜欢它吗？” → {{_}}", "kind": "cloze", "blanks": [["Synes du godt om jeres nye kontor", "Hvad synes du om jeres nye kontor"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "我非常喜欢食堂里的沙拉，但我讨厌那道乏味的汤。", "kind": "write", "accept": ["Jeg kan rigtig godt lide salaten i kantinen, men jeg er træt af den kedelige suppe."]}, {"prompt": "你喜欢我们的新老板吗？是的，我对他很满意，他总是帮我。", "kind": "write", "accept": ["Er du glad for vores nye chef? Ja, jeg er meget glad for ham, og han hjælper mig altid."]}, {"prompt": "西格妮语速很快，但我依然很理解她。", "kind": "write", "accept": ["Signe taler hurtigt, men jeg forstår hende stadig godt."]}, {"prompt": "安诺斯经常在周五给我们带蛋糕，大家都为此很开心。", "kind": "write", "accept": ["Anders giver os tit fredagskage, og vi er alle sammen glade for det."]}, {"prompt": "我们周五下班后要出去，你想和我们一起去吗？", "kind": "write", "accept": ["Vi går ud efter arbejde på fredag – vil du med os?"]}]}], "clips": {"hej maja må jeg sidde her hos dig hvad synes du om frokosten i dag": "f3ccf4ebc28d6382", "ja selvfølgelig jeg kan rigtig godt lide salaten her i kantinen men jeg er lidt træt af den samme suppe hver torsdag": "48212bca54658a51", "ja den er lidt kedelig men fisken er frisk – jeg synes godt om den": "b887894e1868fe69", "hvordan går det ellers i din nye afdeling er du glad for vores chef anders": "7aa4c59bfe271c46", "ja jeg er meget glad for ham han hjælper mig altid når jeg spørger ham om noget": "e944c4306e59a103", "det lyder godt kender du også vores kollega signe fra tredje sal taler du tit med hende": "fe26c1d65c9a4833", "ja hun sidder derovre hun er rigtig sød – jeg forstår hende godt selvom hun taler hurtigt": "5fed42cf8484af91", "ja hun er meget hjælpsom anders giver os for resten tit fredagskage og vi er alle sammen glade for det": "2ecb60112c3fabae", "fedt spiser de nye kolleger fra it også sammen med jer i dag": "7c8478fa6c322cc0", "nej de sidder i et møde så vi ser dem først i morgen vil du med os ud efter arbejde på fredag": "483789d07fba36ae", "mig": "428ede9c47e67b1b", "dig": "19c877bd833c1644", "ham": "8b1714484ae05546", "hende": "379fa4c94698db4c", "os": "b78c5b2dc14405ef", "jer": "84a8a3355a0a2496", "dem": "a01918885336b4dd", "en kantine": "836b308828a8661b", "en frokostpause": "5d1f1ebca2405e23", "en salat": "3d53f3857e4aa5c3", "en suppe": "9f49d2fc1803c975", "en chef": "351d7545b71935b0", "en kollega": "5617196228c37456", "en afdeling": "ee04dd6097417aa9", "et møde": "ca251e215c11e892", "at synes": "e305a50e34468943", "at spørge": "fafb41270fea3013", "at kende": "72aaae997f59f4cb", "at forstå": "d43fb0bbe5ce4b8b", "kedelig": "12cf2eb66ccf2acc", "træt": "bba0f1e4b292d37c", "glad": "b1c45d96f6f0a645"}, "key": "ncd1-L14"}, {"book": "ncd1", "lesson": 15, "title_da": "Et studie på universitetet", "title_zh": "在大学读书", "grammar": "五大并列连词（og, men, eller, for, så）· for（正常 SVO 语序）vs fordi（从句语序） · så（“所以”后接 V2 倒装实战规范） · 大学专业、小组作业与语言要求", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "在丹麦某大学的走廊里，丹麦本科生米克尔（Mikkel）遇到了国际研究生萨拉（Sara）。两人聊起了各自的专业课程、英语与丹麦语教学要求、小组作业以及即将到来的考试。", "paras": [{"zh": "嗨，萨拉！你现在是要去听大课，还是去图书馆？", "note": "forelæsning ˈfɒːɐˌlɛːˀsneŋ（重音在最前 for-，软或长 ɛː 带喉塞音）；biblioteket biblioˈtʰeːˀɡəð（重音在 -te-，词尾 -et 读 əð）。", "segs": [{"id": "dialog-1", "who": "Mikkel", "da": "Hej Sara! Skal du til forelæsning nu, eller skal du på biblioteket?", "a": "354d7f7d92b6b1fc", "dur": 3.72}]}, {"zh": "我要去图书馆，因为我们这周有一个很大的小组作业。", "note": "for fʌ（作连词“因为”时轻读短促）；gruppeopgave ˈɡʁubəˌʌbɡæːvə（复合词主重音在最前）。", "segs": [{"id": "dialog-2", "who": "Sara", "da": "Jeg skal på biblioteket, for vi har en stor gruppeopgave i denne uge.", "a": "8ebdde319e1d091a", "dur": 3.76}]}, {"zh": "哦对！对了，你到底是学什么专业的？这学期有几门课？", "note": "egentlig ˈiˀənli（g 和 t 均不发音！注意拼写是 eg-，但读作“依恩利”）；semester seˈmɛsdɐ。", "segs": [{"id": "dialog-3", "who": "Mikkel", "da": "Nå ja! Hvad læser du egentlig, og hvor mange fag har du i dette semester?", "a": "0f1b6352a07036b4", "dur": 4.04}]}, {"zh": "我读经济学，我有三门课，但考试都相当难。", "note": "økonomi økʰonoˈmiːˀ（重音在末尾 -mi）；eksamenerne ɛɡˈsæːmənɐnə；svære ˈsvɛːɐ。", "segs": [{"id": "dialog-4", "who": "Sara", "da": "Jeg læser økonomi, og jeg har tre fag, men eksamenerne er ret svære.", "a": "7136985a89bfbd65", "dur": 5.16}]}, {"zh": "是啊，考试很花时间。你们的课是用丹麦语还是英语授课的？", "note": "kræver ˈkʰʁɛːvɐ；Foregår ˈfɒːɐˌɡɒːˀ（重音在 for-）；undervisningen ˈɔnɐˌviːˀsneŋən（-nd- 的 d 不发音）。", "segs": [{"id": "dialog-5", "who": "Mikkel", "da": "Ja, eksamen kræver meget tid. Foregår undervisningen på dansk eller på engelsk?", "a": "988638f2b239aa0e", "dur": 5.44}]}, {"zh": "课程是用英语讲授的，所以我现在全都能听懂，不过我们也会读一些丹麦语文献。", "note": "forstår fɒˈsdɔːˀ；tekster ˈtʰɛɡsdɐ。注意 så nu forstår jeg... 中，时间副词 nu 触发动词 forstår 排在第 2 位（V2 倒装）！", "segs": [{"id": "dialog-6", "who": "Sara", "da": "Undervisningen foregår på engelsk, så nu forstår jeg det hele godt, men vi læser også nogle danske tekster.", "a": "ab76ce556ead6ee3", "dur": 5.48}]}, {"zh": "你喜欢小组作业吗？在大学里我们经常用这种方式，因为大家可以互相学习。", "note": "gruppearbejde ˈɡʁubəˌɑːbɑɪ̯ˀdə；universitetet univeɐ̯siˈtʰeːˀdəð（重音在 -te-）；hinanden hiˈnanˀən（中间 -nd- 的 d 不发音）。", "segs": [{"id": "dialog-7", "who": "Mikkel", "da": "Kan du godt lide gruppearbejde? På universitetet bruger vi det meget, for man lærer af hinanden.", "a": "efef7e19ed496e8d", "dur": 5.76}]}, {"zh": "喜欢，太棒了！我们每周碰面三次，因为我不想一个人孤零零地啃那些难题。", "note": "mødes ˈmøːðəs（软 d）；for jeg vil ikke... 注意 for 后面是主句语序，所以 ikke 放在动词 vil 之后！", "segs": [{"id": "dialog-8", "who": "Sara", "da": "Ja, det er super! Vi mødes tre gange om ugen, for jeg vil ikke sidde alene med de svære opgaver.", "a": "931aad79f1d16b37", "dur": 5.24}]}, {"zh": "真聪明！那你今天要学习一整个晚上，还是四点就结束自由了？", "note": "hele aftenen ˈheːlə ˈɑfdənən；har du fri hɑ du ˈfʁiːˀ。", "segs": [{"id": "dialog-9", "who": "Mikkel", "da": "Smart! Skal du læse hele aftenen, eller har du fri klokken fire?", "a": "e5cfca77dd0c0753", "dur": 3.44}]}, {"zh": "我们下周一就已经有小测验了，所以我现在必须在晚饭前读完两章！", "note": "prøve ˈpʰʁøːvə；kapitler kʰaˈpʰidlɐ；aftensmad ˈɑfdənsˌmað（软 d 轻弱）。", "segs": [{"id": "dialog-10", "who": "Sara", "da": "Vi har allerede prøve på mandag, så nu skal jeg læse to kapitler inden aftensmad!", "a": "4e5fa3851d9f6238", "dur": 4.92}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "和，并且", "note": "连词", "segs": [{"id": "g1", "who": "narrator", "da": "og", "a": "b4d8c8f45c6fee2f", "dur": 0.84}]}, {"zh": "但是", "note": "连词", "segs": [{"id": "g2", "who": "narrator", "da": "men", "a": "fd9c2e0fb074b82b", "dur": 0.68}]}, {"zh": "或者", "note": "连词", "segs": [{"id": "g3", "who": "narrator", "da": "eller", "a": "4e1f0be04a5edb65", "dur": 0.68}]}, {"zh": "因为（接主句语序）", "note": "连词", "segs": [{"id": "g4", "who": "narrator", "da": "for", "a": "819e09887fbbeae3", "dur": 0.76}]}, {"zh": "所以，于是", "note": "连词", "segs": [{"id": "g5", "who": "narrator", "da": "så", "a": "c9ce45a890ec9be6", "dur": 0.64}]}, {"zh": "学业，大学专业", "note": "名词 · studiet, studier, studierne", "segs": [{"id": "g6", "who": "narrator", "da": "et studie", "say": "et studie. studiet, studier, studierne.", "a": "dd8a0c3a3559427f", "dur": 4.92}]}, {"zh": "大学", "note": "名词 · universitetet, universiteter, -ne", "segs": [{"id": "g7", "who": "narrator", "da": "et universitet", "say": "et universitet.", "a": "512282d6743401cf", "dur": 1.32}]}, {"zh": "大学大课，讲座", "note": "名词 · forelæsningen, forelæsninger, -ne", "segs": [{"id": "g8", "who": "narrator", "da": "en forelæsning", "say": "en forelæsning.", "a": "a9ef77ec390215b1", "dur": 1.6}]}, {"zh": "图书馆", "note": "名词 · biblioteket, biblioteker, bibliotekerne", "segs": [{"id": "g9", "who": "narrator", "da": "et bibliotek", "say": "et bibliotek. biblioteket, biblioteker, bibliotekerne.", "a": "c7d9b5040d5f4a79", "dur": 5.52}]}, {"zh": "小组作业", "note": "名词 · gruppeopgaven, gruppeopgaver, -ne", "segs": [{"id": "g10", "who": "narrator", "da": "en gruppeopgave", "say": "en gruppeopgave.", "a": "3e6ae9203df7748b", "dur": 1.88}]}, {"zh": "学科，课程（单复同形）", "note": "名词 · faget, fag, fagene", "segs": [{"id": "g11", "who": "narrator", "da": "et fag", "say": "et fag. faget, fag, fagene.", "a": "b959a73302ef7b30", "dur": 4.28}]}, {"zh": "学期", "note": "名词 · semestret, semestre, semestrene", "segs": [{"id": "g12", "who": "narrator", "da": "et semester", "say": "et semester. semestret, semestre, semestrene.", "a": "274709b11630d2f9", "dur": 5.2}]}, {"zh": "考 e"}, {"pos": "名词", "da": "en forelæsning", "zh": "大学大课，讲座", "forms": "forelæsningen, forelæsninger, -ne"}, {"pos": "名词", "da": "et bibliotek", "zh": "图书馆", "forms": "biblioteket, biblioteker, bibliotekerne"}, {"pos": "名词", "da": "en gruppeopgave", "zh": "小组作业", "forms": "gruppeopgaven, gruppeopgaver, -ne"}, {"pos": "名词", "da": "et fag", "zh": "学科，课程（单复同形）", "forms": "faget, fag, fagene"}, {"pos": "名词", "da": "et semester", "zh": "学期", "forms": "semestret, semestre, semestrene"}, {"pos": "名词", "da": "en eksamen", "zh": "考试", "forms": "eksamenen, eksamener, eksamenerne"}, {"pos": "名词", "da": "en undervisning", "zh": "教学，授课（不可数）", "forms": "undervisningen, kun ental"}, {"pos": "名词", "da": "et kapitel", "zh": "章节", "forms": "kapitlet, kapitler, kapitlerne"}, {"pos": "动词", "da": "at foregå", "zh": "进行，发生", "forms": "foregår, foregik, har foregået"}, {"pos": "动词", "da": "at kræve", "zh": "要求，需要", "forms": "kræver, krævede, har krævet"}, {"pos": "动词", "da": "at mødes", "zh": "见面，会面（相互 -s 动词）", "forms": "mødes, mødtes, har mødtes"}, {"pos": "形容词", "da": "svær", "zh": "困难的，艰难的", "forms": "svært, svære"}, {"pos": "副词", "da": "egentlig", "zh": "其实，到底，说起来", "forms": "—"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "你今天去听大课，还是去图书馆学习？", "answer": "Skal du til forelæsning i dag, eller skal du læse på biblioteket?"}, {"zh": "我在大学攻读经济学，但课程用英语进行。", "answer": "Jeg læser økonomi på universitetet, men undervisningen foregår på engelsk."}, {"zh": "我们经常做小组作业，因为大家可以互相学习。", "answer": "Vi laver tit gruppeopgaver, for man lærer meget af hinanden."}, {"zh": "我现在不想一个人待在家里，因为家里太安静了。（用 for）", "answer": "Jeg vil ikke sidde alene hjemme nu, for der er for stille."}, {"zh": "我们下周一有考试，所以我现在必须在图书馆读完两章。", "answer": "Vi har eksamen på mandag, så nu skal jeg læse to kapitler på biblioteket."}]}, {"id": "A", "type": "drill", "title": "练习 A：用五大并列连词（og, men, eller, for, så）连接或填空", "items": [{"prompt": "Skal vi læse på biblioteket, {{_}} skal vi arbejde hjemme?", "kind": "cloze", "blanks": [["eller"]], "explain": "二选一提问"}, {"prompt": "Jeg læser tre fag i dette semester, {{_}} jeg har meget travlt.", "kind": "cloze", "blanks": [["så"]], "explain": "引出结果：所以我很忙"}, {"prompt": "Gruppen mødes tre gange om ugen, {{_}} vi vil skrive en god opgave.", "kind": "cloze", "blanks": [["for"]], "explain": "引出原因：因为我们想写好作业"}, {"prompt": "Eksamen er svær, {{_}} vores underviser er rigtig god til at hjælpe os.", "kind": "cloze", "blanks": [["men"]], "explain": "转折：考试难，但是老师很好"}, {"prompt": "Jeg forstår engelsk godt, {{_}} nu skal jeg også lære mere dansk.", "kind": "cloze", "blanks": [["men", "og"]], "explain": "⟦men⟧ 表转折推进更佳：英语懂了，但现在也要多学丹麦语"}, {"prompt": "Sara studerer økonomi, {{_}} hun arbejder også på et bibliotek.", "kind": "cloze", "blanks": [["og"]], "explain": "顺承并列"}]}, {"id": "B", "type": "drill", "title": "练习 B：语序防雷专练（在正确位置填入 ikke 或按 V2 倒装完成句子）", "items": [{"prompt": "（用 ⟦for⟧ 改写，注意 ⟦ikke⟧ 位置）：⟦Jeg går hjem, fordi jeg ikke har tid.⟧ → ⟦Jeg går hjem, for...⟧", "kind": "write", "accept": ["Jeg går hjem, for jeg har ikke tid."], "explain": "⟦for⟧ 后回归主句语序，⟦ikke⟧ 放在动词 ⟦har⟧ 后面！"}, {"prompt": "（用 ⟦så nu⟧ 连接，注意 V2 倒装）：⟦Vi har eksamen på mandag.⟧ + ⟦Jeg læser to kapitler.⟧ →", "kind": "write", "accept": ["Vi har eksamen på mandag, så nu læser jeg to kapitler."], "explain": "⟦nu⟧ 占位，⟦læser⟧ 保持 V2 第二位"}, {"prompt": "（用 ⟦for⟧ 连接）：⟦Jeg kan godt lide gruppearbejde.⟧ + ⟦Jeg vil ikke sidde alene.⟧ →", "kind": "write", "accept": ["Jeg kan godt lide gruppearbejde, for jeg vil ikke sidde alene."]}, {"prompt": "（用 ⟦så i dag⟧ 连接，注意 V2 倒装）：⟦Vejret er dårligt.⟧ + ⟦Vi bliver på biblioteket.⟧ →", "kind": "write", "accept": ["Vejret er dårligt, så i dag bliver vi på biblioteket."]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战", "items": [{"prompt": "你今天去听大课，还是去图书馆学习？", "kind": "write", "accept": ["Skal du til forelæsning i dag, eller skal du læse på biblioteket?"]}, {"prompt": "我在大学攻读经济学，但课程用英语进行。", "kind": "write", "accept": ["Jeg læser økonomi på universitetet, men undervisningen foregår på engelsk."]}, {"prompt": "我们经常做小组作业，因为大家可以互相学习。", "kind": "write", "accept": ["Vi laver tit gruppeopgaver, for man lærer meget af hinanden."]}, {"prompt": "我现在不想一个人待在家里，因为家里太安静了。（用 ⟦for⟧）", "kind": "write", "accept": ["Jeg vil ikke sidde alene hjemme nu, for der er for stille."]}, {"prompt": "我们下周一有考试，所以我现在必须在图书馆读完两章。", "kind": "write", "accept": ["Vi har eksamen på mandag, så nu skal jeg læse to kapitler på biblioteket."]}]}], "clips": {"hej sara skal du til forelæsning nu eller skal du på biblioteket": "354d7f7d92b6b1fc", "jeg skal på biblioteket for vi har en stor gruppeopgave i denne uge": "8ebdde319e1d091a", "nå ja hvad læser du egentlig og hvor mange fag har du i dette semester": "0f1b6352a07036b4", "jeg læser økonomi og jeg har tre fag men eksamenerne er ret svære": "7136985a89bfbd65", "ja eksamen kræver meget tid foregår undervisningen på dansk eller på engelsk": "988638f2b239aa0e", "undervisningen foregår på engelsk så nu forstår jeg det hele godt men vi læser også nogle danske tekster": "ab76ce556ead6ee3", "kan du godt lide gruppearbejde på universitetet bruger vi det meget for man lærer af hinanden": "efef7e19ed496e8d", "ja det er super vi mødes tre gange om ugen for jeg vil ikke sidde alene med de svære opgaver": "931aad79f1d16b37", "smart skal du læse hele aftenen eller har du fri klokken fire": "e5cfca77dd0c0753", "vi har allerede prøve på mandag så nu skal jeg læse to kapitler inden aftensmad": "4e5fa3851d9f6238", "og": "b4d8c8f45c6fee2f", "men": "fd9c2e0fb074b82b", "eller": "4e1f0be04a5edb65", "for": "819e09887fbbeae3", "så": "c9ce45a890ec9be6", "et studie": "dd8a0c3a3559427f", "et universitet": "512282d6743401cf", "en forelæsning": "a9ef77ec390215b1", "et bibliotek": "c7d9b5040d5f4a79", "en gruppeopgave": "3e6ae9203df7748b", "et fag": "b959a73302ef7b30", "et semester": "274709b11630d2f9", "en eksamen": "dcc0b03b48efcdb1", "en undervisning": "00cc15b7f8c676c3", "et kapitel": "e04d1edd8ce9c803", "at foregå": "de2f40563652c908", "at kræve": "6543f592a48d9cdd", "at mødes": "f95be4ba7a87b14d", "svær": "27def98937259b3d", "egentlig": "c9d174e595441783"}, "key": "ncd1-L15"}, {"book": "ncd1", "lesson": 16, "title_da": "Mit arbejde og mine kolleger", "title_zh": "我的工作与同事 [独白]", "grammar": "职业与身份名词零冠词规则（Jeg er ingeniør / studerende）· 时间频率与薪资介词（om dagen, om ugen, om måneden, i timen）· DU3 口试工作专题完整模板", "sections": [{"id": "text-del1", "type": "text", "kind": "prose", "tab": "Del 1", "title": "Del 1：第一人称独白范本（95 词）", "scene": null, "paras": [{"segs": [{"id": "m1-1", "who": "Kursist", "da": "Jeg er **ingeniør**, og min kæreste er **studerende** på universitetet.", "a": "0d1b25af892b3ea1", "dur": 3.36}, {"id": "m1-2", "who": "Kursist", "da": "Jeg arbejder i et stort firma i Aarhus.", "a": "7a4de4978650f618", "dur": 3.24}, {"id": "m1-3", "who": "Kursist", "da": "Mine vigtigste arbejdsopgaver er at skrive programmer, teste nye systemer og holde møder med kunder.", "a": "0a1ada4ec8a98431", "dur": 5.68}], "zh": "我是一名工程师，我的伴侣是一名大学生。我在奥胡斯一家大公司工作。我最重要的工作任务是编写程序、测试新系统以及和客户开会。"}, {"segs": [{"id": "m1-4", "who": "Kursist", "da": "Jeg arbejder fem dage [[om ugen]] fra mandag til fredag, næsten otte timer [[om dagen]].", "a": "2a3caf91b1c19990", "dur": 4.8}, {"id": "m1-5", "who": "Kursist", "da": "Jeg får 260 kroner **i timen**, og vi får løn én gang [[om måneden]].", "a": "b1fca2868d436198", "dur": 4.4}], "zh": "我每周从周一到周五工作五天，每天将近八个小时。我的时薪是 260 克朗，公司每月发一次工资。"}, {"segs": [{"id": "m1-6", "who": "Kursist", "da": "Jeg har fem søde kolleger og en venlig chef.", "a": "1f1e1298634623bf", "dur": 2.8}, {"id": "m1-7", "who": "Kursist", "da": "Vi spiser altid frokost sammen i kantinen i pausen.", "a": "c397bb3b657d4778", "dur": 3.4}, {"id": "m1-8", "who": "Kursist", "da": "Hver morgen cykler jeg tyve minutter til arbejde, for det er både sundt og hurtigt.", "a": "0e8ac61ea95d7d91", "dur": 4.56}], "zh": "我有五位友好的同事和一位亲切的主管。午休时我们总是一起在食堂吃午饭。每天早上我骑二十分钟自行车去上班，因为这样既健康又快捷。"}]}, {"id": "text-del2", "type": "text", "kind": "dialog", "tab": "Del 2", "title": "Del 2：考官追问与高分示范回答（5 轮模拟互动）", "scene": null, "paras": [{"zh": "你说你在奥胡斯担任工程师。你能再多介绍一下你的具体工作任务吗？", "note": "arbejder som ˈɑːbɑɪ̯ˀdɐ sʌm（软 d）；fortælle fɒˈtʰɛlˀə。", "segs": [{"id": "del2-1", "who": "Examinator", "da": "Du siger, at du arbejder som ingeniør i Aarhus. Kan du fortælle lidt mere om dine arbejdsopgaver?", "a": "75fb9d5e9769d3a1", "dur": 5.92}]}, {"zh": "好的，当然！我上午通常编写计算机程序，下午经常和同事或者我们的客户开会。", "note": "om formiddagen ʌm ˈfɒːmeˌdæːˀən（dag 中 g 不发音）。", "segs": [{"id": "del2-2", "who": "Svar", "da": "Ja, selvfølgelig! Jeg skriver computerprogrammer om formiddagen, og om eftermiddagen holder jeg tit møde med mine kolleger eller med vores kunder.", "a": "96c936202d1d2851", "dur": 8.08}]}, {"zh": "你有时候周末或者晚上也需要工作吗？", "note": "nogle gange ˈnoːən ˈɡaŋə（日常语流中 nogle 几乎读同 nogen）。", "segs": [{"id": "del2-3", "who": "Examinator", "da": "Arbejder du nogle gange i weekenden eller om aftenen?", "a": "2c2e04f522c223c6", "dur": 3.12}]}, {"zh": "不，几乎从不！我周末总是休息不上班，所以我有很多时间陪家人和安排业余生活。", "note": "næsten aldrig ˈnɛsdən ˈaldʁi（aldrig 末尾 g 静音）。", "segs": [{"id": "del2-4", "who": "Svar", "da": "Nej, næsten aldrig! Jeg har altid fri i weekenden, så jeg har god tid til min familie og min fritid.", "a": "188fe71edc7fbda2", "dur": 5.4}]}, {"zh": "你每天有多长的休息时间？你们在休息时间里都做些什么？", "note": "Hvor lang pause vɒ ˈlaŋˀ ˈpʰɑʊ̯sə（hvor 的 h 不发音）。", "segs": [{"id": "del2-5", "who": "Examinator", "da": "Hvor lang pause har du om dagen, og hvad laver I i pausen?", "a": "e166779d8631d438", "dur": 3.36}]}, {"zh": "我们十二点有半小时的午休时间。大家一起在食堂吃饭喝咖啡，而且我们在休息时从不聊工作！", "note": "en halv en ˈhalˀ（v 不发音）；tolv ˈtʰʌlˀ（v 不发音！）。", "segs": [{"id": "del2-6", "who": "Svar", "da": "Vi har en halv times frokostpause klokken tolv. Vi spiser sammen i kantinen og drikker kaffe, og vi snakker aldrig om arbejde i pausen!", "a": "b9cd5b460aeeec37", "dur": 7.56}]}, {"zh": "你提到了一位很亲切的上司。你们工作场所的氛围怎么样？", "note": "stemningen ˈsdɛmneŋən；arbejdsplads ˈɑːbɑɪ̯ðsˌpʰlas（plads 中 d 不发音）。", "segs": [{"id": "del2-7", "who": "Examinator", "da": "Du nævner en venlig chef. Hvordan er stemningen på din arbejdsplads?", "a": "008b53f6c2dc2b14", "dur": 3.6}]}, {"zh": "氛围非常轻松融洽。大家都互相帮忙，我们的老板也经常征求我们的意见。", "note": "afslappet ˈɑʊ̯ˌslabəð（af- 读 ɑʊ̯，词尾 -et 读 əð）；meninger ˈmeːneŋɐ。", "segs": [{"id": "del2-8", "who": "Svar", "da": "Stemningen er meget afslappet og god. Alle hjælper hinanden, og vores chef spørger os tit om vores meninger.", "a": "a4396341e309459a", "dur": 5.64}]}, {"zh": "你每天早上骑车去上班。冬天遇到下雨或下雪的时候你也骑车吗？", "note": "vinteren ˈvenˀdɐn；regner ˈʁɑɪ̯nɐ（eg 滑成 ɑɪ̯）；sner ˈsneɐ̯ˀ。", "segs": [{"id": "del2-9", "who": "Examinator", "da": "Du cykler til arbejde hver morgen. Gør du også det om vinteren, når det regner eller sner?", "a": "8016354519bf867c", "dur": 4.6}]}, {"zh": "如果天气特别糟糕，我就坐公交车。公交车就停在我公司正门前，但我还是更喜欢骑自行车！", "note": "vejret ˈvɛɐ̯ˀð（j 不发音，结尾软 d）；foretrækker ˈfɒːɐˌtʰʁɛɡɐ。", "segs": [{"id": "del2-10", "who": "Svar", "da": "Hvis vejret er rigtig dårligt, tager jeg bussen. Den stopper lige foran mit firma, men jeg foretrækker cyklen!", "a": "ddedb268e39dd4b3", "dur": 5.96}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "工程师", "note": "名词 · ingeniøren, ingeniører, ingeniørerne", "segs": [{"id": "g1", "who": "narrator", "da": "en ingeniør", "say": "en ingeniør. ingeniøren, ingeniører, ingeniørerne.", "a": "2b3d66de41647a5f", "dur": 5.2}]}, {"zh": "大学生（分词转名词）", "note": "名词 · den studerende, studerende, de studerende", "segs": [{"id": "g2", "who": "narrator", "da": "en studerende", "say": "en studerende. den studerende, studerende, de studerende.", "a": "fce69ba53b963fc8", "dur": 6.64}]}, {"zh": "护士", "note": "名词 · sygeplejersken, sygeplejersker, -ne", "segs": [{"id": "g3", "who": "narrator", "da": "en sygeplejerske", "say": "en sygeplejerske.", "a": "e88219f41f201387", "dur": 1.48}]}, {"zh": "公司，企业", "note": "名词 · firmaet, firmaer, firmaerne", "segs": [{"id": "g4", "who": "narrator", "da": "et firma", "say": "et firma. firmaet, firmaer, firmaerne.", "a": "35daff38d58bf933", "dur": 5.64}]}, {"zh": "工作任务", "note": "名词 · arbejdsopgaven, arbejdsopgaver, -ne", "segs": [{"id": "g5", "who": "narrator", "da": "en arbejdsopgave", "say": "en arbejdsopgave.", "a": "6a30374293e7681e", "dur": 1.4}]}, {"zh": "工作时间", "note": "名词 · arbejdstiden, arbejdstider, -ne", "segs": [{"id": "g6", "who": "narrator", "da": "en arbejdstid", "say": "en arbejdstid.", "a": "0d7e2b0bfef75c30", "dur": 1.08}]}, {"zh": "小时；课时", "note": "名词 · timen, timer, timerne", "segs": [{"id": "g7", "who": "narrator", "da": "en time", "say": "en time. timen, timer, timerne.", "a": "f7b311cb18863224", "dur": 5.16}]}, {"zh": "工资，薪水", "note": "名词 · lønnen, lønninger, lønningerne", "segs": [{"id": "g8", "who": "narrator", "da": "en løn", "say": "en løn. lønnen, lønninger, lønningerne.", "a": "fa8252e38facbc5f", "dur": 6.24}]}, {"zh": "月（时间单位）", "note": "名词 · måneden, måneder, månederne", "segs": [{"id": "g9", "who": "narrator", "da": "en måned", "say": "en måned. måneden, måneder, månederne.", "a": "4b2341f729b85c2d", "dur": 5.28}]}, {"zh": "休息时间，课间", "note": "名词 · pausen, pauser, pauserne", "segs": [{"id": "g10", "who": "narrator", "da": "en pause", "say": "en pause. pausen, pauser, pauserne.", "a": "b550513dd18b756d", "dur": 4.92}]}, {"zh": "男朋友 / 女朋友，伴侣", "note": "名词 · kæresten, kærester, kæresterne", "segs": [{"id": "g11", "who": "narrator", "da": "en kæreste", "say": "en kæreste. kæresten, kærester, kæresterne.", "a": "61fd728407314d33", "dur": 5.64}]}, {"zh": "挣钱，赚取；服务", "note": "动词 · tjener, tjente, har tjent", "segs": [{"id": "g12", "who": "narrator", "da": "at tjene", "say": "at tjene. tjener, tjente, har tjent.", "a": "fe29d5d31c90afb5", "dur": 4.56}]}, {"zh": "支付，付钱", "note": "动词 · betaler, betalte, har betalt", "segs": [{"id": "g13", "who": "narrator", "da": "at betale", "say": "at betale. betaler, betalte, har betalt.", "a": "27a66dc3feabfb83", "dur": 5.72}]}, {"zh": "测试，检验", "note": "动词 · tester, testede, har testet", "segs": [{"id": "g14", "who": "narrator", "da": "at teste", "say": "at teste. tester, testede, har testet.", "a": "916311be3b6a3148", "dur": 5.0}]}, {"zh": "举办（holde møde / pause）；保持", "note": "动词 · holder, holdt, har holdt", "segs": [{"id": "g15", "who": "narrator", "da": "at holde", "say": "at holde. holder, holdt, har holdt.", "a": "32f89e0fcd013222", "dur": 4.32}]}, {"zh": "骑车（到某地用 er，运动量用 har）", "note": "动词 · cykler, cyklede, er cyklet / har cyklet", "segs": [{"id": "g16", "who": "narrator", "da": "at cykle", "say": "at cykle. cykler, cyklede, er cyklet eller har cyklet.", "a": "d90ae8ce8bd48a17", "dur": 6.08}]}, {"zh": "友好的，亲切的", "note": "形容词 · -t, -e", "segs": [{"id": "g17", "who": "narrator", "da": "venlig", "say": "venlig.", "a": "5f0ac48a1c2a1384", "dur": 1.04}]}, {"zh": "重要的", "note": "形容词 · -t, -e", "segs": [{"id": "g18", "who": "narrator", "da": "vigtig", "say": "vigtig.", "a": "28583edf825dac91", "dur": 1.0}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "名词", "da": "en ingeniør", "zh": "工程师", "forms": "ingeniøren, ingeniører, ingeniørerne"}, {"pos": "名词", "da": "en studerende", "zh": "大学生（分词转名词）", "forms": "den studerende, studerende, de studerende"}, {"pos": "名词", "da": "en sygeplejerske", "zh": "护士", "forms": "sygeplejersken, sygeplejersker, -ne"}, {"pos": "名词", "da": "et firma", "zh": "公司，企业", "forms": "firmaet, firmaer, firmaerne"}, {"pos": "名词", "da": "en arbejdsopgave", "zh": "工作任务", "forms": "arbejdsopgaven, arbejdsopgaver, -ne"}, {"pos": "名词", "da": "en arbejdstid", "zh": "工作时间", "forms": "arbejdstiden, arbejdstider, -ne"}, {"pos": "名词", "da": "en time", "zh": "小时；课时", "forms": "timen, timer, timerne"}, {"pos": "名词", "da": "en løn", "zh": "工资，薪水", "forms": "lønnen, lønninger, lønningerne"}, {"pos": "名词", "da": "en måned", "zh": "月（时间单位）", "forms": "måneden, måneder, månederne"}, {"pos": "名词", "da": "en pause", "zh": "休息时间，课间", "forms": "pausen, pauser, pauserne"}, {"pos": "名词", "da": "en kæreste", "zh": "男朋友 / 女朋友，伴侣", "forms": "kæresten, kærester, kæresterne"}, {"pos": "动词", "da": "at tjene", "zh": "挣钱，赚取；服务", "forms": "tjener, tjente, har tjent"}, {"pos": "动词", "da": "at betale", "zh": "支付，付钱", "forms": "betaler, betalte, har betalt"}, {"pos": "动词", "da": "at teste", "zh": "测试，检验", "forms": "tester, testede, har testet"}, {"pos": "动词", "da": "at holde", "zh": "举办（holde møde / pause）；保持", "forms": "holder, holdt, har holdt"}, {"pos": "动词 [er]", "da": "at cykle", "zh": "骑车（到某地用 er，运动量用 har）", "forms": "cykler, cyklede, er cyklet / har cyklet"}, {"pos": "形容词", "da": "venlig / vigtig", "zh": "友好的，亲切的 / 重要的", "forms": "venlig (-t, -e) / vigtig (-t, -e"}]}, {"id": "order", "type": "order", "title": "语序拼句（由中译丹答案生成）", "instruction": "点击词块，按正确语序拼出句子。", "items": [{"zh": "我是一名工程师，我每周在奥胡斯工作五天。", "answer": "Jeg er ingeniør, og jeg arbejder fem dage om ugen i Aarhus."}, {"zh": "我的老板是一位亲切的女上司，而且我的同事们都很乐于助人。", "answer": "Min chef er en venlig kvinde, og mine kolleger er meget hjælpsomme."}, {"zh": "我们在食堂休息半小时，并且一起吃午饭。", "answer": "Vi holder en halv times pause i kantinen og spiser frokost sammen."}, {"zh": "我每天工作八小时，时薪是 260 克朗。", "answer": "Jeg arbejder otte timer om dagen og får 260 kroner i timen."}, {"zh": "每天早上我骑自行车二十分钟去上班。", "answer": "Hver morgen cykler jeg tyve minutter til arbejde."}]}, {"id": "A", "type": "drill", "title": "练习 A：判断下面职业或身份前面是否需要填 en / et（不需要则填 ×）", "items": [{"prompt": "Min bror er {{_}} læge på et stort hospital i Odense.", "kind": "cloze", "blanks": [["×", "x", "-", "–", "0", "/"]], "explain": "此处不填（输入 × 或 -）；光杆职业 ⟦læge⟧，零冠词"}, {"prompt": "Sofie er {{_}} meget dygtig sygeplejerske.", "kind": "cloze", "blanks": [["en"]], "explain": "前面有形容词 ⟦dygtig⟧ 修饰，必须穿衣加 ⟦en⟧！"}, {"prompt": "Jeg arbejder som {{_}} bager i et lille bageri.", "kind": "cloze", "blanks": [["×", "x", "-", "–", "0", "/"]], "explain": "此处不填（输入 × 或 -）；⟦som + 光杆职业⟧，零冠词"}, {"prompt": "Er din veninde {{_}} studerende på universitetet?", "kind": "cloze", "blanks": [["×", "x", "-", "–", "0", "/"]], "explain": "此处不填（输入 × 或 -）；光杆身份 ⟦studerende⟧，零冠词"}, {"prompt": "Vores nye chef er {{_}} venlig mand fra Jylland.", "kind": "cloze", "blanks": [["en"]], "explain": "带有形容词 ⟦venlig⟧ 且后面接名词 ⟦mand⟧，必须加 ⟦en⟧"}, {"prompt": "Emma vil gerne være {{_}} journalist i Danmark.", "kind": "cloze", "blanks": [["×", "x", "-", "–", "0", "/"]], "explain": "此处不填（输入 × 或 -）；⟦være + 光杆职业⟧，零冠词"}]}, {"id": "B", "type": "drill", "title": "练习 B：选填正确的时间频率与薪资介词（om dagen, om ugen, om måneden, i timen, i en time, om en time）", "items": [{"prompt": "I Danmark arbejder man normalt 37 timer {{_}}.", "kind": "cloze", "blanks": [["om ugen"]], "explain": "每周 37 小时"}, {"prompt": "Lukas tjener 165 kroner {{_}} i bageriet.", "kind": "cloze", "blanks": [["i timen"]], "explain": "时薪必须用 ⟦i timen⟧，不可用 ⟦*om timen⟧！"}, {"prompt": "Jeg drikker altid to kopper kaffe {{_}} – én om morgenen og én efter frokost.", "kind": "cloze", "blanks": [["om dagen"]], "explain": "每天两杯咖啡"}, {"prompt": "Huslejen koster 7.500 kroner {{_}}.", "kind": "cloze", "blanks": [["om måneden"]], "explain": "每月房租"}, {"prompt": "Vi har et vigtigt møde {{_}}, så vi skal skynde os!", "kind": "cloze", "blanks": [["om en time"]], "explain": "“一小时之后”有会议"}, {"prompt": "Hver eftermiddag arbejder jeg alene {{_}} på mit kontor før jeg går hjem.", "kind": "cloze", "blanks": [["i en time"]], "explain": "“持续一小时”的时长"}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战（直接转化为 DU3 口试实用句！）", "items": [{"prompt": "我是一名工程师，我每周在奥胡斯工作五天。", "kind": "write", "accept": ["Jeg er ingeniør, og jeg arbejder fem dage om ugen i Aarhus."]}, {"prompt": "我的老板是一位亲切的女上司，而且我的同事们都很乐于助人。", "kind": "write", "accept": ["Min chef er en venlig kvinde, og mine kolleger er meget hjælpsomme."]}, {"prompt": "我们在食堂休息半小时，并且一起吃午饭。", "kind": "write", "accept": ["Vi holder en halv times pause i kantinen og spiser frokost sammen."]}, {"prompt": "我每天工作八小时，时薪是 260 克朗。", "kind": "write", "accept": ["Jeg arbejder otte timer om dagen og får 260 kroner i timen."]}, {"prompt": "每天早上我骑自行车二十分钟去上班。", "kind": "write", "accept": ["Hver morgen cykler jeg tyve minutter til arbejde."]}]}], "clips": {"jeg er ingeniør og min kæreste er studerende på universitetet": "0d1b25af892b3ea1", "jeg arbejder i et stort firma i aarhus": "7a4de4978650f618", "mine vigtigste arbejdsopgaver er at skrive programmer teste nye systemer og holde møder med kunder": "0a1ada4ec8a98431", "jeg arbejder fem dage om ugen fra mandag til fredag næsten otte timer om dagen": "2a3caf91b1c19990", "jeg får 260 kroner i timen og vi får løn én gang om måneden": "b1fca2868d436198", "jeg har fem søde kolleger og en venlig chef": "1f1e1298634623bf", "vi spiser altid frokost sammen i kantinen i pausen": "c397bb3b657d4778", "hver morgen cykler jeg tyve minutter til arbejde for det er både sundt og hurtigt": "0e8ac61ea95d7d91", "du siger at du arbejder som ingeniør i aarhus kan du fortælle lidt mere om dine arbejdsopgaver": "75fb9d5e9769d3a1", "ja selvfølgelig jeg skriver computerprogrammer om formiddagen og om eftermiddagen holder jeg tit møde med mine kolleger eller med vores kunder": "96c936202d1d2851", "arbejder du nogle gange i weekenden eller om aftenen": "2c2e04f522c223c6", "nej næsten aldrig jeg har altid fri i weekenden så jeg har god tid til min familie og min fritid": "188fe71edc7fbda2", "hvor lang pause har du om dagen og hvad laver i i pausen": "e166779d8631d438", "vi har en halv times frokostpause klokken tolv vi spiser sammen i kantinen og drikker kaffe og vi snakker aldrig om arbejde i pausen": "b9cd5b460aeeec37", "du nævner en venlig chef hvordan er stemningen på din arbejdsplads": "008b53f6c2dc2b14", "stemningen er meget afslappet og god alle hjælper hinanden og vores chef spørger os tit om vores meninger": "a4396341e309459a", "du cykler til arbejde hver morgen gør du også det om vinteren når det regner eller sner": "8016354519bf867c", "hvis vejret er rigtig dårligt tager jeg bussen den stopper lige foran mit firma men jeg foretrækker cyklen": "ddedb268e39dd4b3", "en ingeniør": "2b3d66de41647a5f", "en studerende": "fce69ba53b963fc8", "en sygeplejerske": "e88219f41f201387", "et firma": "35daff38d58bf933", "en arbejdsopgave": "6a30374293e7681e", "en arbejdstid": "0d7e2b0bfef75c30", "en time": "f7b311cb18863224", "en løn": "fa8252e38facbc5f", "en måned": "4b2341f729b85c2d", "en pause": "b550513dd18b756d", "en kæreste": "61fd728407314d33", "at tjene": "fe29d5d31c90afb5", "at betale": "27a66dc3feabfb83", "at teste": "916311be3b6a3148", "at holde": "32f89e0fcd013222", "at cykle": "d90ae8ce8bd48a17", "venlig": "5f0ac48a1c2a1384", "vigtig": "28583edf825dac91"}, "key": "ncd1-L16"}, {"book": "ncd1", "lesson": 17, "title_da": "Et medlemskab i fitnesscentret", "title_zh": "办一张健身房会员卡", "grammar": "价格、折扣与报名固定句型（tilmelde sig, prøve en gang gratis, få rabat） · 不定式标志 at 的使用与省略（情态动词后不加 at；at + 原形作主语/宾语/介词宾语）", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "Emma 来到家附近的健身中心前台，向前台工作人员 Mikkel 咨询月卡价格、学生折扣、免费试课以及运动装备要求。", "paras": [{"zh": "你好！我想了解一下，会员卡每月多少钱。", "note": "medlemskab ˈmɛðlɛmsˌgæːˀb（第一个 d 为软 d ð，重音在首音节）；vil gerne vide ve ˈɡæɐ̯nə ˈviːðə（vil 弱读，d 为软 d）。", "segs": [{"id": "dialog-1", "who": "Emma", "da": "Hej! Jeg vil gerne vide, hvad et medlemskab koster om måneden.", "a": "1f0708df1cd2ddd9", "dur": 3.72}]}, {"zh": "你好！普通会员每月 299 克朗。你是学生吗？如果是的话你可以享受折扣。", "note": "normalt nɒˈmæːˀld；studerende sduˈdeɐ̯ˀnə（重音在第二音节）；få rabat fɔ ʁaˈbad（rabat 重音在第二音节）。", "segs": [{"id": "dialog-2", "who": "Mikkel", "da": "Hej! Et normalt medlemskab koster 299 kroner om måneden. Er du studerende? Så kan du få rabat.", "a": "d4a6a1cf0952ba19", "dur": 6.92}]}, {"zh": "是的，我是学生。我在大学读书。学生折扣价是多少？我能先免费试一次吗？", "note": "studierabat ˈsduːdiəʁaˌbad；prøve ˈpʰʁœːvə（注意圆唇音 œː）；gratis ˈɡʁɑːtis（重音在第一音节，非英语读音）。", "segs": [{"id": "dialog-3", "who": "Emma", "da": "Ja, det er jeg. Jeg læser på universitetet. Hvor meget koster det med studierabat, og kan jeg prøve en gang gratis først?", "a": "ca72f7e54202346a", "dur": 7.36}]}, {"zh": "学生折扣价每月只要 199 克朗。而且可以，明天晚上免费试一节团课完全不花钱。", "note": "helt ˈheːˀld；at prøve ʌ ˈpʰʁœːvə（不定式标志 at 在口语中弱读为 ʌ，千万不要读成 ad）；holdtime ˈhʌlˌtˢiːmə（hold 末尾 d 不发音）。", "segs": [{"id": "dialog-4", "who": "Mikkel", "da": "Med studierabat koster det kun 199 kroner om måneden. Og ja, det er helt gratis at prøve en holdtime i morgen aften.", "a": "7da08e49da39db3c", "dur": 6.44}]}, {"zh": "听起来真棒！我喜欢锻炼，但我不太擅长游泳或举重。有初学者班吗？", "note": "glad for at træne ˈɡlað fʌ ʌ ˈtʰʁɛːnə（for at 连读近乎 fʌ ʌ）；svømme ˈsvømə；tunge ˈtʰoŋə（u 偏 o 音）；begyndere beˈɡønˀɐ。", "segs": [{"id": "dialog-5", "who": "Emma", "da": "Det lyder godt! Jeg er glad for at træne, men jeg er ikke så god til at svømme eller løfte tunge vægte. Er der hold for begyndere?", "a": "f3c33987ff0f889e", "dur": 7.24}]}, {"zh": "当然有！你可以选瑜伽或动感单车，我们的教练非常喜欢帮助新会员。", "note": "vælge ˈvɛlɡə；cykling ˈsyɡleŋ（c 读 s，y 读长圆唇）；medlemmer ˈmɛðˌlɛmˀɐ（软 d ð）。", "segs": [{"id": "dialog-6", "who": "Mikkel", "da": "Ja, selvfølgelig! Du kan vælge yoga eller cykling, og vores trænere elsker at hjælpe nye medlemmer.", "a": "8eae67f1da11f60b", "dur": 6.84}]}, {"zh": "太好了！你们什么时候开门，要穿什么呢？需要带室内运动鞋吗？", "note": "åbent ˈɔːbənd；have på ha ˈpʰɔːˀ（have 在口语中常吞掉 v，只读 ha）；indendørssko ˈenəndɶɐ̯sˌsɡoːˀ（nd 中的 d 不发音）。", "segs": [{"id": "dialog-7", "who": "Emma", "da": "Super! Hvornår har I åbent, og hvad skal man have på? Skal man have indendørssko med?", "a": "4a828f5dcdcbec46", "dur": 5.28}]}, {"zh": "我们每天早上六点到晚上十点开门。你只要穿干净的运动服和室内鞋就行，另外记得带一瓶水和一条毛巾。", "note": "sportstøj ˈsbɒːdsˌtʰɔɪ̯；vandflaske ˈvanˌflasɡə（vand 中 d 不发音）；håndklæde ˈhʌnˌkʰlɛːðə（nd 中 d 不发音，后面的 d 为软 d ð）。", "segs": [{"id": "dialog-8", "who": "Mikkel", "da": "Vi har åbent fra klokken seks til toogtyve hver dag. Du skal bare have rent sportstøj og indendørssko på, og husk at tage en vandflaske og et håndklæde med.", "a": "4a91b9faa70ea359", "dur": 8.48}]}, {"zh": "谢谢这些信息！如果试课后想继续，要怎么报名呢？", "note": "oplysningerne ˈʌbˌlyːˀsneŋɐnə；tilmelder sig ˈtˢelˌmɛlˀɐ sɑɪ̯（ld 中 d 不发音，sig 读 sɑɪ̯）；fortsætte ˈfɒːdˌsɛdə。", "segs": [{"id": "dialog-9", "who": "Emma", "da": "Tak for oplysningerne! Hvordan tilmelder man sig, hvis man vil fortsætte efter prøvetimen?", "a": "3d06ea0bcb269ea4", "dur": 5.36}]}, {"zh": "你可以很方便地在我们的网站上或就在前台这里报名。只记得出示你的学生证就行！", "note": "hjemmeside ˈjɛməˌsiːðə（h 不发音，side 软 d）；receptionen ʁesɛbˈɕoːˀnən（ti 读 ɕ）；studiekort ˈsduːdiəˌkʰɒːd。", "segs": [{"id": "dialog-10", "who": "Mikkel", "da": "Du kan nemt tilmelde dig på vores hjemmeside eller her i receptionen. Husk bare at vise dit studiekort!", "a": "29e49854720b02d3", "dur": 5.68}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "会员资格；会员卡", "note": "名词 · medlemskabet, medlemskaber, medlemskaberne", "segs": [{"id": "g1", "who": "narrator", "da": "et medlemskab", "say": "et medlemskab. medlemskabet, medlemskaber, medlemskaberne.", "a": "2ddb32a51f4fa35f", "dur": 6.04}]}, {"zh": "健身中心（词干 -er 屈折缩合）", "note": "名词 · fitnesscentret, fitnesscentre, fitnesscentrene", "segs": [{"id": "g2", "who": "narrator", "da": "et fitnesscenter", "say": "et fitnesscenter. fitnesscentret, fitnesscentre, fitnesscentrene.", "a": "a8c05253db6f706a", "dur": 5.56}]}, {"zh": "折扣（få studierabat 获学生折扣）", "note": "名词 · rabatten, rabatter, rabatterne", "segs": [{"id": "g3", "who": "narrator", "da": "en rabat", "say": "en rabat. rabatten, rabatter, rabatterne.", "a": "8eb5c0e9c6cb629e", "dur": 4.92}]}, {"zh": "初学者（hold for begyndere 初级班）", "note": "名词 · begynderen, begyndere, begynderne", "segs": [{"id": "g4", "who": "narrator", "da": "en begynder", "say": "en begynder. begynderen, begyndere, begynderne.", "a": "5cb7b07bedf7fbf7", "dur": 5.56}]}, {"zh": "教练", "note": "名词 · træneren, trænere, trænerne", "segs": [{"id": "g5", "who": "narrator", "da": "en træner", "say": "en træner. træneren, trænere, trænerne.", "a": "5bf04129812a1b65", "dur": 5.0}]}, {"zh": "课程班；团队（单复同形）", "note": "名词 · holdet, hold, holdene", "segs": [{"id": "g6", "who" }} hjælpe begyndere.", "kind": "cloze", "blanks": [["at"]], "explain": "实义动词 ⟦elsker⟧ 后接动词必加 ⟦at⟧"}]}, {"id": "B", "type": "drill", "title": "练习 B：用正确的反身代词（mig, dig, sig, os）与搭配词完成句子", "items": [{"prompt": "Hvordan tilmelder man {{_}} til yogaholdet?", "kind": "cloze", "blanks": [["sig"]]}, {"prompt": "Jeg vil gerne tilmelde {{_}} på nettet i aften.", "kind": "cloze", "blanks": [["mig"]]}, {"prompt": "Vi tilmelder {{_}} næste uge, hvis vi kan lide centret.", "kind": "cloze", "blanks": [["os"]]}, {"prompt": "Skal man have rent sportstøj {{_}}, eller må man bare have almindelige sko {{_}}?", "kind": "cloze", "blanks": [["på"], ["på"]]}, {"prompt": "Husk at tage dit håndklæde {{_}} i tasken!", "kind": "cloze", "blanks": [["med"]]}]}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战（直接套用 DU3 考场问句与回答）", "items": [{"prompt": "普通会员费每个月多少钱？学生有折扣吗？", "kind": "write", "accept": ["Hvad koster et normalt medlemskab om måneden? Er der rabat til studerende?"]}, {"prompt": "我能先免费试一节团课吗？", "kind": "write", "accept": ["Kan jeg prøve en holdtime gratis først?"]}, {"prompt": "我很喜欢锻炼，但我不太擅长举重。", "kind": "write", "accept": ["Jeg er meget glad for at træne, men jeg er ikke så god til at løfte tunge vægte."]}, {"prompt": "每天训练前你必须记得带一瓶水和一双室内鞋。", "kind": "write", "accept": ["Før du træner hver dag, skal du huske at tage en vandflaske og indendørssko med."], "explain": "或 ⟦Du skal huske at tage en vandflaske og indendørssko med...⟧"}, {"prompt": "我怎么在网上报名呢？（用泛指代词 ⟦man⟧）", "kind": "write", "accept": ["Hvordan tilmelder man sig på nettet / på hjemmesiden?"]}]}], "clips": {"hej jeg vil gerne vide hvad et medlemskab koster om måneden": "1f0708df1cd2ddd9", "hej et normalt medlemskab koster 299 kroner om måneden er du studerende så kan du få rabat": "d4a6a1cf0952ba19", "ja det er jeg jeg læser på universitetet hvor meget koster det med studierabat og kan jeg prøve en gang gratis først": "ca72f7e54202346a", "med studierabat koster det kun 199 kroner om måneden og ja det er helt gratis at prøve en holdtime i morgen aften": "7da08e49da39db3c", "det lyder godt jeg er glad for at træne men jeg er ikke så god til at svømme eller løfte tunge vægte er der hold for begyndere": "f3c33987ff0f889e", "ja selvfølgelig du kan vælge yoga eller cykling og vores trænere elsker at hjælpe nye medlemmer": "8eae67f1da11f60b", "super hvornår har i åbent og hvad skal man have på skal man have indendørssko med": "4a828f5dcdcbec46", "vi har åbent fra klokken seks til toogtyve hver dag du skal bare have rent sportstøj og indendørssko på og husk at tage en vandflaske og et håndklæde med": "4a91b9faa70ea359", "tak for oplysningerne hvordan tilmelder man sig hvis man vil fortsætte efter prøvetimen": "3d06ea0bcb269ea4", "du kan nemt tilmelde dig på vores hjemmeside eller her i receptionen husk bare at vise dit studiekort": "29e49854720b02d3", "et medlemskab": "2ddb32a51f4fa35f", "et fitnesscenter": "a8c05253db6f706a", "en rabat": "8eb5c0e9c6cb629e", "en begynder": "5cb7b07bedf7fbf7", "en træner": "5bf04129812a1b65", "et hold": "219e5c7c6b3c0bcc", "sportstøj": "0e4288cc8e451a2a", "en vandflaske": "cd230974a67f9f34", "et håndklæde": "eecb49221aa37872", "at tilmelde sig": "491ca6e877d1edd7", "at prøve": "1ea4a51e184978fd", "at træne": "ae137643d7100508", "at svømme": "b177ed5f2f6d498a", "at fortsætte": "747207a918ab540a", "at huske": "b403d5ebaf8f39e5", "gratis": "52ea73836b3ff183", "ren": "f3c120f09a096539", "tung": "a789a9edafae39ab"}, "key": "ncd1-L17"}, {"book": "ncd1", "lesson": 18, "title_da": "Hvad lavede du i weekenden?", "title_zh": "你周末做了什么？", "grammar": "规则动词一般过去时（Datid）：第 1 类（词干 + -ede）与第 2 类（词干 + -te） · 过去时间状语（i går, i aftes, i lørdags, i sidste uge）", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "周一早上在办公室茶水间，Jonas 和 Sofie 一边冲咖啡，一边聊起各自周末做了什么。", "paras": [{"zh": "早安，索菲！你周末过得好吗？你做了些什么？", "note": "lavede ˈlɛːvəðə（词尾 -ede 读作 əðə，注意长元音 ɛː，a 偏“哎”音）；weekenden ˈviːɡˌɛndən（此处 weekend 无后缀）。", "segs": [{"id": "dialog-1", "who": "Jonas", "da": "Godmorgen, Sofie! Havde du en god weekend? Hvad lavede du?", "a": "3c2c40b964fd0fe2", "dur": 2.92}]}, {"zh": "是的，过得很棒，谢谢！上周六我整理了一上午公寓，还洗了衣服。", "note": "i lørdags i ˈlɶɐ̯ˌdæs（dags 中 g 不发音！）；ryddede ˈʁyðəðə（前面 dd 与后面 -ede 里的 d 均为软 d）；vaskede ˈvasɡəðə。", "segs": [{"id": "dialog-2", "who": "Sofie", "da": "Ja, den var dejlig, tak! I lørdags ryddede jeg op i lejligheden og vaskede tøj hele formiddagen.", "a": "6ed0cce7704cbc03", "dur": 6.0}]}, {"zh": "哦，做家务呀！你周末也去锻炼了吗？", "note": "husarbejde ˈhuːsɑːˌbɑɪ̯ˀdə；trænede ˈtʰʁɛːnəðə（长元音 ɛː + 流畅的 əðə 尾音）。", "segs": [{"id": "dialog-3", "who": "Jonas", "da": "Åh, husarbejde! Trænede du også i weekenden?", "a": "65621a466a37b83d", "dur": 3.36}]}, {"zh": "去了，下午我骑车去健身房练了一个小时。之后我去集市买了新鲜蔬菜。", "note": "cyklede ˈsyɡləðə；købte ˈkʰøbdə（第 2 类过去时 -te 读作清不送气 də，ø 变短）；grøntsager ˈɡʁønˌsæːɐ（g 弱化接近脱落）。", "segs": [{"id": "dialog-4", "who": "Sofie", "da": "Ja, om eftermiddagen cyklede jeg ned til fitnesscentret og trænede i en time. Bagefter købte jeg friske grøntsager på markedet.", "a": "0d613da3db4d2bf9", "dur": 7.72}]}, {"zh": "真惬意！那你周六晚上做什么了？", "note": "lørdag aften ˈlɶɐ̯dæ ˈafdən（表示某个具体过去的周六晚上，可用 lørdag aften 或 i lørdags aftes）。", "segs": [{"id": "dialog-5", "who": "Jonas", "da": "Hvor hyggeligt! Hvad lavede du så lørdag aften?", "a": "633c150882a8d551", "dur": 3.32}]}, {"zh": "我去看望了我的父母。我们一起做了美味的饭菜，吃了蛋糕，还聊了好几个小时。你呢？", "note": "besøgte beˈsøɡdə（be- 轻读，søg- 短 ø）；spiste ˈsbisdə（第 2 类 -te，长 i 变短）；snakkede ˈsnaɡəðə。", "segs": [{"id": "dialog-6", "who": "Sofie", "da": "Jeg besøgte mine forældre. Vi lavede god mad sammen, spiste kage og snakkede i flere timer. Hvad med dig?", "a": "f5563037135da8ba", "dur": 6.68}]}, {"zh": "我上周五加班到有点晚，所以上周六就纯粹放松了一下，读了一本很精彩的书。", "note": "arbejdede ˈɑːˌbɑɪ̯ˀdəðə（词干里的 d 为硬 d，最后 -ede 为软 əðə）；i fredags i ˈfʁɛːdæs；slappede af ˈslabəðə ˈæːˀ；læste ˈlɛːsdə（保持长 ɛː）。", "segs": [{"id": "dialog-7", "who": "Jonas", "da": "Jeg arbejdede lidt sent i fredags, så i lørdags slappede jeg bare af og læste en spændende bog.", "a": "8625a4ae261cd3a7", "dur": 4.8}]}, {"zh": "真不错！那你昨天做了什么？你给欧登塞的哥哥打电话了吗？", "note": "i går i ˈɡɒːˀ（长圆唇后元音 + 喉塞音）；ringede ˈʁeŋəðə（ng 读鼻音 ŋ，不读出 g）；Odense ˈoːˀðənsə（软 d + 喉塞音）。", "segs": [{"id": "dialog-8", "who": "Sofie", "da": "Dejligt! Og hvad lavede du i går? Ringede du til din bror i Odense?", "a": "a28ba03694151152", "dur": 4.36}]}, {"zh": "打了，我昨晚给他打的电话，我们聊了快一个小时。后来我开始看一部新剧，结果睡得太晚了！", "note": "i aftes i ˈafdəs（昨天晚上，与 i aften“今晚”区分）；begyndte beˈɡønˀdə（注意喉塞音在 n 上）；seng ˈsɛŋˀ。", "segs": [{"id": "dialog-9", "who": "Jonas", "da": "Ja, jeg ringede til ham i aftes, og vi snakkede i næsten en time. Bagefter begyndte jeg at se en ny serie, så jeg kom alt for sent i seng!", "a": "84b0f09c4da7a19a", "dur": 7.12}]}, {"zh": "哈哈，现在我完全明白你为什么这么困、还要喝这么大一杯咖啡了！", "note": "forstår fɒˈsdɒːˀ；træt ˈtˢʁad；kæmpe ˈkʰɛmbə；kop kaffe kʰʌb ˈkʰafə。", "segs": [{"id": "dialog-10", "who": "Sofie", "da": "Haha, nu forstår jeg godt, hvorfor du er så træt og drikker en kæmpe kop kaffe!", "a": "7edc471a861ff298", "dur": 5.28}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "做，制作（第 1 类 -ede）", "note": "动词 · laver, lavede, har lavet", "segs": [{"id": "g1", "who": "narrator", "da": "at lave", "say": "at lave. laver, lavede, har lavet.", "a": "f8f55ae87d63c3ba", "dur": 4.76}]}, {"zh": "工作（第 1 类 -ede）", "note": "动词 · arbejder, arbejdede, har arbejdet", "segs": [{"id": "g2", "who": "narrator", "da": "at arbejde", "say": "at arbejde. arbejder, arbejdede, har arbejdet.", "a": "635bc87081691fc9", "dur": 5.52}]}, {"zh": "整理，收拾（第 1 类）", "note": "动词 · rydder op, ryddede op, har ryddet op", "segs": [{"id": "g3", "who": "narrator", "da": "at rydde op", "say": "at rydde op. rydder op, ryddede op, har ryddet op.", "a": "8a345509d0bafebf", "dur": 5.0}]}, {"zh": "洗，清洗（第 1 类）", "note": "动词 · vasker, vaskede, har vasket", "segs": [{"id": "g4", "who": "narrator", "da": "at vaske", "say": "at vaske. vasker, vaskede, har vasket.", "a": "a5c2bae2c2f0727a", "dur": 4.12}]}, {"zh": "放松，休息（第 1 类）", "note": "动词 · slapper af, slappede af, har slappet af", "segs": [{"id": "g5", "who": "narrator", "da": "at slappe af", "say": "at slappe af. slapper af, slappede af, har slappet af.", "a": "18b18dbf65e1ebe1", "dur": 5.12}]}, {"zh": "聊天，交谈（第 1 类）", "note": "动词 · snakker, snakkede, har snakket", "segs": [{"id": "g6", "who": "narrator", "da": "at snakke", "say": "at snakke. snakker, snakkede, har snakket.", "a": "ae7bc0336f49743e", "dur": 4.36}]}, {"zh": "打电话；响铃（第 1 类）", "note": "动词 · ringer, ringede, har ringet", "segs": [{"id": "g7", "who": "narrator", "da": "at ringe", "say": "at ringe. ringer, ringede, har ringet.", "a": "ca88ed3b9f489077", "dur": 4.0}]}, {"zh": "买（第 2 类 -te）", "note": "动词 · køber, købte, har købt", "segs": [{"id": "g8", "who": "narrator", "da": "at købe", "say": "at købe. køber, købte, har købt.", "a": "97aa760489966fde", "dur": 4.96}]}, {"zh": "吃（第 2 类 -te）", "note": "动词 · spiser, spiste, har spist", "segs": [{"id": "g9", "who": "narrator", "da": "at spise", "say": "at spise. spiser, spiste, har spist.", "a": "4e0ba3fa40cd91b9", "dur": 5.28}]}, {"zh": "读，阅读（第 2 类 -te）", "note": "动词 · læser, læste, har læst", "segs": [{"id": "g10", "who": "narrator", "da": "at læse", "say": "at læse. læser, læste, har læst.", "a": "2eb098652520448c", "dur": 5.16}]}, {"zh": "拜访；参观（第 2 类 -te）", "note": "动词 · besøger, besøgte, har besøgt", "segs": [{"id": "g11", "who": "narrator", "da": "at besøge", "say": "at besøge. besøger, besøgte, har besøgt.", "a": "75df316366b16f38", "dur": 4.2}]}, {"zh": "开始（第 2 类 -te）", "note": "动词 · begynder, begyndte, er/har begyndt", "segs": [{"id": "g12", "who": "narrator", "da": "at begynde", "say": "at begynde. begynder, begyndte, er eller har begyndt.", "a": "8df252db5f6ecf4b", "dur": 6.0}]}, {"zh": "周末", "note": "名词 · weekenden, weekender, weekenderne", "segs": [{"id": "g13", "who": "narrator", "da": "en weekend", "say": "en weekend. weekenden, weekender, weekenderne.", "a": "a60345b48ea5010c", "dur": 4.84}]}, {"zh": "集市，市场", "note": "名词 · markedet, markeder, markederne", "segs": [{"id": "g14", "who": "narrator", "da": "et marked", "say": "et marked. markedet, markeder, markederne.", "a": "0b02953033741600", "dur": 4.48}]}, {"zh": "蔬菜（常用复数 grøntsager）", "note": "名词 · grøntsagen, grøntsager, grøntsagerne", "segs": [{"id": "g15", "who": "narrator", "da": "en grøntsag", "say": "en grøntsag. grøntsagen, grøntsager, grøntsagerne.", "a": "af7634852dafbb86", "dur": 5.08}]}, {"zh": "父母（常以复数出现）", "note": "名词 · flertal, forældrene", "segs": [{"id": "g16", "who": "narrator", "da": "forældre", "say": "forældre. flertal, forældrene.", "a": "bfc91042afd28744", "dur": 4.24}]}, {"zh": "连续剧；系列", "note": "名词 · serien, serier, serierne", "segs": [{"id": "g17", "who": "narrator", "da": "en serie", "say": "en serie. serien, serier, serierne.", "a": "b0da153e91b0345b", "dur": 4.32}]}, {"zh": "新鲜的", "note": "形容词 · frisk, friske", "segs": [{"id": "g18", "who": "narrator", "da": "frisk", "say": "frisk. frisk, friske.", "a": "40c37e6027b21b9f", "dur": 2.76}]}, {"zh": "巨大的（口语）", "note": "形容词", "segs": [{"id": "g19", "who": "narrator", "da": "kæmpe", "a": "47e81cab3dc51ca5", "dur": 1.04}]}]}, {"id": "gloser", "type": "flashcards", "title": "生词闪卡（Gloser）", "cards": [{"pos": "动词", "da": "at lave", "zh": "做，制作（第 1 类 -ede）", "forms": "laver, lavede, har lavet"}, {"pos": "动词", "da": "at arbejde", "zh": "工作（第 1 类 -ede）", "forms": "arbejder, arbejdede, har arbejdet"}, {"pos": "动词", "da": "at rydde op", "zh": "整理，收拾（第 1 类）", "forms": "rydder op, ryddede op, har ryddet op"}, {"pos": "动词", "da": "at vaske", "zh": "洗，清洗（第 1 类）", "forms": "vasker, vaskede, har vasket"}, {"pos": "动词", "da": "at slappe af", "zh": "放松，休息（第 1 类）", "forms": "slapper af, slappede af, har slappet af"}, {"pos": "动词", "da": "at snakke", "zh": "聊天，交谈（第 1 类）", "forms": "snakker, snakkede, har snakket"}, {"pos": "动词", "da": "at ringe", "zh": "打电话；响铃（第 1 类）", "forms": "ringer, ringede, har ring example": "Jeg spiser kage. (i aftes) → I aftes spiste jeg kage."}, {"id": "C", "type": "drill", "title": "练习 C：中译丹实战（注意时间状语与动词时态）", "items": [{"prompt": "你昨天晚上做了什么？", "kind": "write", "accept": ["Hvad lavede du i aftes?"]}, {"prompt": "上周六我整理了房间并洗了衣服。", "kind": "write", "accept": ["I lørdags ryddede jeg op på værelset og vaskede tøj."]}, {"prompt": "昨天下午我骑车去市中心买了新鲜蔬菜。", "kind": "write", "accept": ["I går eftermiddags cyklede jeg til centrum og købte friske grøntsager."]}, {"prompt": "上周日我们去拜访了朋友，一起吃了蛋糕。", "kind": "write", "accept": ["I søndags besøgte vi vores venner og spiste kage sammen."]}, {"prompt": "上周我给我的哥哥打了电话，然后开始看一部新剧。", "kind": "write", "accept": ["I sidste uge ringede jeg til min bror og begyndte at se en ny serie."]}]}], "clips": {"godmorgen sofie havde du en god weekend hvad lavede du": "3c2c40b964fd0fe2", "ja den var dejlig tak i lørdags ryddede jeg op i lejligheden og vaskede tøj hele formiddagen": "6ed0cce7704cbc03", "åh husarbejde trænede du også i weekenden": "65621a466a37b83d", "ja om eftermiddagen cyklede jeg ned til fitnesscentret og trænede i en time bagefter købte jeg friske grøntsager på markedet": "0d613da3db4d2bf9", "hvor hyggeligt hvad lavede du så lørdag aften": "633c150882a8d551", "jeg besøgte mine forældre vi lavede god mad sammen spiste kage og snakkede i flere timer hvad med dig": "f5563037135da8ba", "jeg arbejdede lidt sent i fredags så i lørdags slappede jeg bare af og læste en spændende bog": "8625a4ae261cd3a7", "dejligt og hvad lavede du i går ringede du til din bror i odense": "a28ba03694151152", "ja jeg ringede til ham i aftes og vi snakkede i næsten en time bagefter begyndte jeg at se en ny serie så jeg kom alt for sent i seng": "84b0f09c4da7a19a", "haha nu forstår jeg godt hvorfor du er så træt og drikker en kæmpe kop kaffe": "7edc471a861ff298", "at lave": "f8f55ae87d63c3ba", "at arbejde": "635bc87081691fc9", "at rydde op": "8a345509d0bafebf", "at vaske": "a5c2bae2c2f0727a", "at slappe af": "18b18dbf65e1ebe1", "at snakke": "ae7bc0336f49743e", "at ringe": "ca88ed3b9f489077", "at købe": "97aa760489966fde", "at spise": "4e0ba3fa40cd91b9", "at læse": "2eb098652520448c", "at besøge": "75df316366b16f38", "at begynde": "8df252db5f6ecf4b", "en weekend": "a60345b48ea5010c", "et marked": "0b02953033741600", "en grøntsag": "af7634852dafbb86", "forældre": "bfc91042afd28744", "en serie": "b0da153e91b0345b", "frisk": "40c37e6027b21b9f", "kæmpe": "47e81cab3dc51ca5"}, "key": "ncd1-L18"}, {"book": "ncd1", "lesson": 19, "title_da": "En tur i supermarkedet", "title_zh": "去一趟超市", "grammar": "20 个最高频不规则动词一般过去时（var, havde, gik, fik, tog, så, kom, gjorde, sagde, gav, fandt, drak, skrev, sad, stod, lå, løb, sov, vidste 等） · 超市购物与计量表达", "sections": [{"id": "text-dialog", "type": "text", "kind": "dialog", "tab": "课文", "title": "Dialog", "scene": "Lukas 从超市购物回家，Maja 一边帮他把东西从袋子里拿出来，一边核对采购清单，结果发现了几件好笑的小插曲。请重点留意对话中出现的不规则动词过去时。", "paras": [{"zh": "嗨，卢卡斯！你刚从超市回来吗？买得怎么样？", "note": "kom ˈkʰʌmˀ（与现在时 kommer 不同，短元音 + 喉塞音）；gik ˈɡiɡ（at gå 的过去时）。", "segs": [{"id": "dialog-1", "who": "Maja", "da": "Hej Lukas! Kom du lige hjem fra supermarkedet? Hvordan gik det?", "a": "f2423eda4240f3e8", "dur": 4.68}]}, {"zh": "是呀！因为下雨，我坐公交过去的。Netto 超市里人特别多。", "note": "tog ˈtʰoːˀ（末尾 g 完全不发音！读作长 oː 带喉塞音）；var ˈvɑː（非重读常弱化为 vɑ）。", "segs": [{"id": "dialog-2", "who": "Lukas", "da": "Ja! Jeg tog bussen derhen, fordi det regnede. Der var rigtig mange mennesker i Netto.", "a": "1caa451d1e0dda6c", "dur": 4.88}]}, {"zh": "清单上的都买齐了吗？我可写了“两升牛奶、一条黑麦面包和六个鸡蛋”哦。", "note": "fandt ˈfanˀd（末尾 t 极轻或近乎不发，核心是喉塞音）；skrev ˈsgʁeʊ̯ˀ（-ev 滑音读 eʊ̯ˀ）；rugbrød ˈʁuˌbʁœðˀ（g 不发音，末尾软 d）。", "segs": [{"id": "dialog-3", "who": "Maja", "da": "Fandt du alt på listen? Jeg skrev jo \"to liter mælk, et rugbrød og seks æg\".", "a": "a805f4fe27e3fde6", "dur": 5.16}]}, {"zh": "差不多！我看到咖啡在打特价，就也拿了一袋咖啡。鸡蛋放在很高的架子上，不过我找了个店员帮我拿。", "note": "så ˈsɔːˀ；tilbud ˈtˢelˌbuð（软 d）；stod ˈsdoːðˀ（常弱化末尾 d 读 ˈsdoːˀ）；fik ˈfeɡ（at få 的过去时）。", "segs": [{"id": "dialog-4", "who": "Lukas", "da": "Næsten! Jeg så et godt tilbud på kaffe, så jeg tog også en pose kaffe. Æggene stod helt oppe på en høj hylde, men jeg fik en medarbejder til at hjælpe mig.", "a": "84d504612c145e08", "dur": 8.76}]}, {"zh": "干得不错！你在收银台一共花了多少钱？", "note": "gav ˈɡæːˀ（末尾 v 在口语中通常脱落！读长音 æːˀ）；ved kassen ve ˈkʰasən（ved 末尾 d 不发音）。", "segs": [{"id": "dialog-5", "who": "Maja", "da": "Godt klaret! Hvor meget gav du for det hele ved kassen?", "a": "6a0ad1a840609066", "dur": 2.92}]}, {"zh": "大概花了两百克朗。收银员说我得花三克朗买个塑料袋，因为我没带自己的袋子。", "note": "sagde ˈsæːə（g 和 d 全不发音，重读几乎读作“塞-厄”）；måtte ˈmʌdə；havde ˈhɛːðə（v 不发音，d 读软 d）。", "segs": [{"id": "dialog-6", "who": "Lukas", "da": "Jeg gav cirka tohundrede kroner. Ekspedienten sagde, at jeg måtte betale tre kroner for en pose, fordi jeg ikke havde min egen taske med.", "a": "b263bc5432adb59d", "dur": 7.72}]}, {"zh": "哈哈，我早知道了，因为你的布袋子一直还躺在客厅的椅子上呢！", "note": "vidste ˈvesdə（d 完全不发音，只读 vesdə）；lå ˈlɔːˀ（at ligge 的过去时）。", "segs": [{"id": "dialog-7", "who": "Maja", "da": "Haha, det vidste jeg godt, for din stoftaske lå stadig på stolen her i stuen!", "a": "73d5ba8aaebe596c", "dur": 5.48}]}, {"zh": "哎呀！而且你知道吗？后来我坐在外面的长椅上喝了罐汽水。突然看表发现已经五点了，我就一路跑回家了！", "note": "sad ˈsaðˀ（短 a + 软 d + 喉塞音）；drak ˈdʁaɡ；pludselig ˈpʰlusli（d 与 -ig 均不发音）；løb ˈløːˀb（长 ø + 喉塞音）。", "segs": [{"id": "dialog-8", "who": "Lukas", "da": "Åh nej! Og ved du hvad? Bagefter sad jeg på en bænk udenfor og drak en sodavand. Pludselig så jeg på uret, at klokken var fem, så jeg løb hele vejen hjem!", "a": "8c5ea4c05b7a3986", "dur": 8.48}]}, {"zh": "可是黄油在哪儿呢？你今天早上不是说我们要买明天的黄油吗？", "note": "smørret ˈsmɶɐ̯ˀð；skulle ˈsgu(lə)（快语流常直接吞掉 -lle 读成 sgu）。", "segs": [{"id": "dialog-9", "who": "Maja", "da": "Men hvor er smørret? Sagde du ikke i morges, at vi skulle købe smør til i morgen?", "a": "5654403bfe7f98fc", "dur": 4.08}]}, {"zh": "哎呀糟了！我给忘了！我还真尽力了，可我就是想快点回家，因为咱们的小狗自己在家睡觉呢。", "note": "gjorde ˈɡjoːɐ（d 不发音，读作“哟-厄”）；ville ˈvi(lə)（常弱读成 vi）；sov ˈsɔʊ̯ˀ（at sove 过去时）。", "segs": [{"id": "dialog-10", "who": "Lukas", "da": "Åh for søren! Det glemte jeg! Jeg gjorde ellers mit bedste, men jeg ville bare hurtigt hjem, fordi vores lille hund sov alene herhjemme.", "a": "b6e514a3c3988823", "dur": 7.4}]}]}, {"id": "text-gloser", "type": "text", "kind": "words", "tab": "生词表", "title": "Gloser（生词表 · 点读）", "scene": null, "paras": [{"zh": "超市", "note": "名词 · supermarkedet, supermarkeder, supermarkederne", "segs": [{"id": "g1", "who": "narrator", "da": "et supermarked", "say": "et supermarked. supermarkedet, supermarkeder, supermarkederne.", "a": "bf2ecedc8d09882e", "dur": 6.04}]}, {"zh": "特价，优惠（på tilbud 在打折）", "note": "名词 · tilbuddet, tilbud, tilbuddene", "segs": [{"id": "g2", "who": "narrator", "da": "et tilbud", "say": "et tilbud. tilbuddet, tilbud, tilbuddene.", "a": "fd8890c4d8c6e5c4", "dur": 5.28}]}, {"zh": "升（容量单位，复数不变）", "note": "名词 · literen, liter, literne", "segs": [{"id": "g3", "who": "narrator", "da": "en liter", "say": "en liter. literen, liter, literne.", "a": "78d396fe6cb235f0", "dur": 4.48}]}, {"zh": "丹麦黑麦面包（单复同形）", "note": "名词 · rugbrødet, rugbrød, rugbrødene", "segs": [{"id": "g4", "who": "narrator", "da": "et rugbrød", "say": "et rugbrød. rugbrødet, rugbrød, rugbrødene.", "a": "e85cc9ebe2aecada", "dur": 5.0}]}, {"zh": "鸡蛋", "note": "名词 · ægget, æg, æggene", "segs": [{"id": "g5", "who": "narrator", "da": "et æg", "say": "et æg. ægget, æg, æggene.", "a": "84eca898c447632f", "dur": 4.48}]}, {"zh": "架子，货架", "note": "名词 · hylden, hylder, hylderne", "segs": [{"id": "g6", "who": "narrator", "da": "en hylde", "say": "en hylde. hylden, hylder, hylderne.", "a": "3b10d2e0cd41325d", "dur": 4.36}]}, {"zh": "收银台；箱子（ved kassen 在收银台）", "note": "名词 · kassen, kasser, kasserne", "segs": [{"id": "g7", "who": "narrator", "da": "en kasse", "say": "en kasse. kassen, kasser, kasserne.", "a": "1104fffdfab68564", "dur": 4.8}]}, {"zh": "店员，收银员", "note": "名词 · ekspedienten, ekspedienter, ekspedienterne", "segs": [{"id": "g8", "who": "narrator", "da": "en ekspedient", "say": "en ekspedient. ekspedienten, ekspedienter, ekspedienterne.",
