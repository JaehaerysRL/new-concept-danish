- id: A
  type: drill
  title: 练习 A：将下列陈述句改写为 (1) 普通是非问句，(2) 带 ikke 的否定疑问句
  items:
  - prompt: ⟦Pladsen er ledig.⟧
    kind: write
    accept:
    - Er pladsen ledig? Er pladsen ikke ledig?
  - prompt: ⟦Du bor i København.⟧
    kind: write
    accept:
    - Bor du i København? Bor du ikke i København?
  - prompt: ⟦Jonas sidder i den forkerte vogn.⟧
    kind: write
    accept:
    - Sidder Jonas i den forkerte vogn? Sidder Jonas ikke i den forkerte vogn?
  - prompt: ⟦Toget stopper på Odense Station.⟧
    kind: write
    accept:
    - Stopper toget på Odense Station? Stopper toget ikke på Odense Station?
  - prompt: ⟦Du skal stå af i Aarhus.⟧
    kind: write
    accept:
    - Skal du stå af i Aarhus? Skal du ikke stå af i Aarhus?
  example: Det er vogn 7. → (1) Er det vogn 7? (2) Er det ikke vogn 7?
- id: B
  type: drill
  title: 练习 B：用 Ja、Nej 或 Jo 搭配简短回答完成对话
  items:
  - prompt: 'A: ⟦Er det din billet?⟧（是的，是我的票。）→ B: {{_}}, {{_}}.'
    kind: cloze
    blanks:
    - - Ja
    - - det er det.
    explain: 肯定问句 → 肯定回答用 ⟦Ja⟧
  - prompt: 'A: ⟦Bor du ikke i Danmark?⟧（不对，我确实住在丹麦！）→ B: {{_}}, {{_}}.'
    kind: cloze
    blanks:
    - - Jo
    - - det gør jeg!
    explain: 否定问句 → 反驳否定用 ⟦Jo⟧；⟦bor⟧ 是实义动词，简答用 ⟦gør⟧
  - prompt: 'A: ⟦Kommer Emma fra Danmark?⟧（不，她不来自丹麦。）→ B: {{_}}, {{_}}.'
    kind: cloze
    blanks:
    - - Nej
    - - det gør hun ikke.
    explain: 肯定问句 → 否定回答用 ⟦Nej⟧；⟦kommer⟧ 用 ⟦gør⟧ 替代
  - prompt: 'A: ⟦Er det ikke den rigtige station?⟧（是的，确实不是那一站。）→ B: {{_}}, {{_}}.'
    kind: cloze
    blanks:
    - - Nej
    - - det er det ikke.
    explain: 否定问句 → 赞同对方的否定“确实不是”，用 ⟦Nej⟧！
  - prompt: 'A: ⟦Skal I stå af her?⟧（是的，我们要在这里下车。）→ B: {{_}}, {{_}}.'
    kind: cloze
    blanks:
    - - Ja
    - - det skal vi.
    explain: ⟦I⟧ 提问“你们”，回答用 ⟦vi⟧“我们”，重复情态动词 ⟦skal⟧
