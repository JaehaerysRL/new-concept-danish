    - - er
    explain: ⟦at være⟧ 现在时不规则变为 ⟦er⟧
  - prompt: Nu {{_}} (⟦at bo⟧) hun i Aarhus og {{_}} (⟦at arbejde⟧) som ingeniør.
    kind: cloze
    blanks:
    - - bor
    - - arbejder
    explain: 元音结尾直接加 ⟦-r⟧
  - prompt: Marco {{_}} (⟦at lære⟧) dansk, og han {{_}} (⟦at tale⟧) allerede lidt dansk.
    kind: cloze
    blanks:
    - - lærer
    - - taler
  - prompt: Hvilke dage {{_}} (⟦at have⟧) I undervisning?
    kind: cloze
    blanks:
    - - har
    explain: ⟦at have⟧ 现在时变为 ⟦har⟧
  - prompt: Jeg {{_}} (⟦at stave⟧) mit efternavn på dansk.
    kind: cloze
    blanks:
    - - staver
