  - zh: 请问，你现在在奥胡斯做什么工作？
    answer: Undskyld, hvad laver du i Aarhus nu?
- id: A
  type: drill
  title: 练习 A：用正确的 hv- 疑问词填空（hvad, hvor, hvem, hvordan, hvilke）
  items:
  - prompt: '{{_}} hedder din lærer på sprogskolen?'
    kind: cloze
    blanks:
    - - Hvad
    explain: 问名字固定用 ⟦Hvad hedder...?⟧，不要受英语“Who/How”影响
  - prompt: '{{_}} bor du i Danmark, og {{_}} kommer du fra?'
    kind: cloze
    blanks:
    - - Hvor
    - - hvor
    explain: 问居住地与来源地均用 ⟦hvor⟧，后者配合句尾 ⟦fra⟧
  - prompt: '{{_}} staver du dit fornavn?'
    kind: cloze
    blanks:
    - - Hvordan
    explain: 问拼写方式“如何拼”
  - prompt: '{{_}} sprog taler I på holdet?'
    kind: cloze
    blanks:
    - - Hvilke
    explain: ⟦sprog⟧ 在此指复数“哪些语言”，配 ⟦hvilke⟧
  - prompt: '{{_}} er ny kursist på modul 1? — Det er Emma og Marco.'
    kind: cloze
    blanks:
    - - Hvem
    explain: 从回答 ⟦Det er Emma og Marco⟧ 可知问人，用 ⟦hvem⟧
- id: B
  type: drill
  title: 练习 B：将括号内的动词变为现在时，注意国籍与职业的零冠词规则
  items:
  - prompt: Emma {{_}} (⟦at komme⟧) fra Kina. Hun {{_}} (⟦at være⟧) kineser.
    kind: cloze
    blanks:
