  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 你叫什么名字，你来自哪个国家？（提示：哪个国家 hvilket land）
    answer: Hvad hedder du, og hvilket land kommer du fra?
  - zh: 我是一名中国人，但我住在丹麦。
    answer: Jeg er kineser, men jeg bor i Danmark.
  - zh: 他在公司当老师，每周二和周四上课。
