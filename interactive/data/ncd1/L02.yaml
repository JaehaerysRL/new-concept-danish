  items:
  - prompt: 你叫什么名字，你来自哪个国家？（提示：哪个国家 ⟦hvilket land⟧）
    kind: write
    accept:
    - Hvad hedder du, og hvilket land kommer du fra?
  - prompt: 我是一名中国人，但我住在丹麦。
    kind: write
