- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 我每天早上总是八点半到公司。
    answer: Jeg møder altid på arbejde klokken halv ni om morgenen.
  - zh: 周一早上我从不喝茶，我只喝咖啡。
    answer: Mandag morgen drikker jeg aldrig te; jeg drikker kun kaffe.
  - zh: 你经常骑车去语言学校吗？（注意 tit 的位置）
    answer: Cykler du tit til sprogskolen?
  - zh: 每天早上安娜洗漱并马上穿好衣服。（用 Om morgenen 开头）
    answer: Om morgenen vasker Anna sig og klæder sig på med det samme.
  - zh: 抓紧时间！你难道今天早上不也赶时间吗？（用 ikke også 提问）
    answer: Skynd dig! Har du ikke også travlt her til morgen?
