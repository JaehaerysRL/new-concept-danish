  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 今天我们不能骑自行车去上班。（用 I dag 开头触发倒装）
    answer: I dag kan vi ikke tage på arbejde på cykel.
  - zh: 坐地铁我们不用换乘。（用 skal ikke）
    answer: Med metroen skal vi ikke skifte.
  - zh: 高峰期大家不应该开车去市中心。
    answer: I myldretiden bør man ikke køre i bil til centrum.
  - zh: 你更想坐火车还是坐地铁？
    answer: Vil du hellere køre med tog eller med metro?
  - zh: 在这里不准免费停车，所以很多人坐公交车。
    answer: Man må ikke parkere gratis her, så mange tager bussen.
