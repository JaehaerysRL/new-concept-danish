  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 在普通的工作日，我七点半起床，然后吃早饭。（用 På en almindelig hverdag...）
    answer: På en almindelig hverdag står jeg op klokken halv otte, og derefter spiser jeg morgenmad.
  - zh: 上午我在语言学校上课，十二点左右我们休午休。
    answer: Om formiddagen går jeg på sprogskole, og ved tolvtiden holder vi pause.
  - zh: 我下午三点半下班，之后去买菜。
    answer: Jeg får fri klokken halv fire, og bagefter handler jeg ind.
  - zh: 晚上我做晚饭，接着看丹麦语书放松一下。（用 Så... 开头）
    answer: Om aftenen laver jeg aftensmad. Så slapper jeg af med en dansk bog.
  - zh: 周末我十点才起床！（用 først 放在动词后）
    answer: I weekenden står jeg først op klokken ti!
