  items:
  - zh: 洗衣机放在浴室里洗手池旁边。
    answer: Vaskemaskinen står ude på badeværelset ved siden af vasken.
  - zh: 我把地毯铺进客厅的桌子下面。
    answer: Jeg lægger gulvtæppet ind i stuen under bordet.
