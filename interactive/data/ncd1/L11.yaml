- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 请问，有人在家吗？我可以向你借一把螺丝刀吗？
    answer: Undskyld, er der nogen hjemme? Må jeg låne en skruetrækker af dig?
  - zh: 真不巧，我家里没有锤子，也没有任何钉子。
    answer: Desværre har jeg ingen hammer og heller ikke nogen søm derhjemme.
  - zh: 你需要一些咖啡吗？我这里还有几块小饼干。
    answer: Vil du have noget kaffe? Jeg har også nogle småkager her.
  - zh: 公共洗衣房今天没有空时段，但明天有一些时间。
    answer: Der er ingen ledige tider i vaskekælderen i dag, men i morgen er der nogle tider.
  - zh: 如果你还需要什么别的，请千万告诉我！
    answer: Sig endelig til, hvis du mangler noget andet!
