  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 我和我妹妹住在奥胡斯一套明亮的公寓里。
    answer: Jeg bor sammen med min lillesøster i en lys lejlighed i Aarhus.
  - zh: 我的房间很小，但我的窗户朝向一座安静的庭院。
    answer: Mit værelse er meget lille, men mine vinduer vender ud mod en rolig gård.
  - zh: 我们分担家务：我负责打扫厨房，她洗她自己的衣服。
    answer: 'Vi deler vores husarbejde: jeg gør køkkenet rent, og hun vasker sit eget tøj.'
  - zh: 我们的邻居和她自己的两条狗住在同一栋楼里。
    answer: Vores nabo bor med sine to hunde i den samme bygning.
  - zh: 她的小狗很可爱，我们经常跟她的狗玩。
    answer: Hendes hunde er meget søde, og vi leger tit med hendes hunde.
