- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 你今天去听大课，还是去图书馆学习？
    answer: Skal du til forelæsning i dag, eller skal du læse på biblioteket?
  - zh: 我在大学攻读经济学，但课程用英语进行。
    answer: Jeg læser økonomi på universitetet, men undervisningen foregår på engelsk.
  - zh: 我们经常做小组作业，因为大家可以互相学习。
    answer: Vi laver tit gruppeopgaver, for man lærer meget af hinanden.
  - zh: 我现在不想一个人待在家里，因为家里太安静了。（用 for）
    answer: Jeg vil ikke sidde alene hjemme nu, for der er for stille.
  - zh: 我们下周一有考试，所以我现在必须在图书馆读完两章。
    answer: Vi har eksamen på mandag, så nu skal jeg læse to kapitler på biblioteket.
