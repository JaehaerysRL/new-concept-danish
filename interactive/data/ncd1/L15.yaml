    explain: ⟦nu⟧ 占位，⟦læser⟧ 保持 V2 第二位
  - prompt: （用 ⟦for⟧ 连接）：⟦Jeg kan godt lide gruppearbejde.⟧ + ⟦Jeg vil ikke sidde alene.⟧ →
