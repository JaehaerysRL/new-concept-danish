    kind: write
    accept:
    - Jeg går hjem, for jeg har ikke tid.
    explain: ⟦for⟧ 后回归主句语序，⟦ikke⟧ 放在动词 ⟦har⟧ 后面！
  - prompt: （用 ⟦så nu⟧ 连接，注意 V2 倒装）：⟦Vi har eksamen på mandag.⟧ + ⟦Jeg læser to kapitler.⟧ →
    kind: write
    accept:
