  items:
  - zh: 我是一名工程师，我每周在奥胡斯工作五天。
    answer: Jeg er ingeniør, og jeg arbejder fem dage om ugen i Aarhus.
  - zh: 我的老板是一位亲切的女上司，而且我的同事们都很乐于助人。
    answer: Min chef er en venlig kvinde, og mine kolleger er meget hjælpsomme.
  - zh: 我们在食堂休息半小时，并且一起吃午饭。
    answer: Vi holder en halv times pause i kantinen og spiser frokost sammen.
  - zh: 我每天工作八小时，时薪是 260 克朗。
    answer: Jeg arbejder otte timer om dagen og får 260 kroner i timen.
  - zh: 每天早上我骑自行车二十分钟去上班。
    answer: Hver morgen cykler jeg tyve minutter til arbejde.
