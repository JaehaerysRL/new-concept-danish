  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 昨天我坐公交去了超市，因为外面在下雨。
    answer: I går tog jeg bussen til supermarkedet, fordi det regnede udenfor.
  - zh: 你在货架上找到那两升牛奶了吗？
    answer: Fandt du de to liter mælk på hylden?
  - zh: 我一共花了 180 克朗，但收银员说我必须买个袋子。
    answer: Jeg gav 180 kroner i alt, men ekspedienten sagde, at jeg måtte købe en pose.
  - zh: 我的书包当时一直躺在椅子上，所以我不知道它不在我身边。
    answer: Min taske lå stadig på stolen, så jeg vidste ikke, at den ikke var med mig.
  - zh: 昨晚我喝了一杯热茶，而且睡了九个小时。
    answer: I aftes drak jeg en kop varm te og sov i ni timer.
