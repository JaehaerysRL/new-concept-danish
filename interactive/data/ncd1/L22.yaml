- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 提前祝你生日快乐！聚会几点开始？
    answer: Tillykke på forhånd! Hvad tid begynder festen?
  - zh: 早上我要烤面包，然后下午我们要去公园散步。
    answer: Om morgenen skal jeg bage boller, og om eftermiddagen skal vi gå en tur i parken.
  - zh: 我非常愿意来，请问我可以带一位朋友一起来吗？
    answer: Jeg vil meget gerne komme! Må jeg tage en ven med?
  - zh: 谢谢你的邀请，但可惜我周六不能来，因为我必须学习。
    answer: Tak for invitationen, men desværre kan jeg ikke komme på lørdag, for jeg skal studere.
