  items:
  - zh: 把时间状语提前到句首（注意 V2 倒装）：Vi ankom til Rom i mandags. → I mandags...
    answer: I mandags ankom vi til Rom.
  - zh: 把句子改为否定完成时（注意 ikke 的位置）：Han har skrevet postkortet. →
    answer: Han har ikke skrevet postkortet.
