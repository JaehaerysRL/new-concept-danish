    explain: ⟦altid⟧ 在动词 ⟦er⟧ 后 → 主句语序
  - prompt: Hvorfor drikker du ikke kaffe? – {{_}} jeg ikke kan sove om natten, hvis jeg drikker kaffe.
    kind: cloze
    blanks:
    - - Fordi
    explain: 回答 ⟦Hvorfor?⟧ 且 ⟦ikke⟧ 在动词 ⟦kan⟧ 前
