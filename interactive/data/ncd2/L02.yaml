  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 查理每天早上五点就醒，因为他不想等早饭。（用 fordi... ikke）
    answer: Charlie vågner klokken fem hver morgen, fordi han ikke vil vente på morgenmad.
  - zh: 你为什么不坐公交车？—— 因为公交车经常晚点！（用 Fordi... ofte 简答）
    answer: Hvorfor tager du ikke bussen? – Fordi bussen ofte kommer for sent!
  - zh: 工作没问题，因为我常常在家办公。（用 for... ofte）
