  - prompt: Vi går tidligt i seng, {{_}} vi skal altid op klokken seks.
    kind: cloze
    blanks:
    - - for
    explain: ⟦altid⟧ 在动词 ⟦skal⟧ 后 → 主句语序
  - prompt: Maja bliver hjemme i aften, {{_}} hun ofte er træt om fredagen.
    kind: cloze
    blanks:
    - - fordi
    explain: ⟦ofte⟧ 在动词 ⟦er⟧ 前 → 从句语序
  - prompt: '{{_}} hunden ikke kan være alene hele dagen, kommer jeg hjem til frokost.'
    kind: cloze
    blanks:
    - - Fordi
    explain: 放句首且 ⟦ikke⟧ 在动词 ⟦kan⟧ 前；⟦for⟧ 绝不能放句首！
  - prompt: Jeg kan godt lide at bo her, {{_}} naboerne er altid så venlige.
    kind: cloze
    blanks:
