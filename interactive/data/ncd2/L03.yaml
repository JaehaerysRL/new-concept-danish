- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 我去过很多场音乐会，但上周五的演出最棒。
    answer: Jeg har været til mange koncerter, men koncerten i fredags var den bedste.
  - zh: 我哥哥一个月前买了两张门票，我们站得离舞台很近。
    answer: Min bror købte to billetter for en måned siden, og vi stod helt tæt på scenen.
  - zh: 乐队演奏了他们最棒的歌，全场观众一起大声合唱。
    answer: Bandet spillede deres bedste sange, og hele publikum sang højt med.
  - zh: 我觉得现场气氛极佳，虽然中途开始下雨了。
    answer: Jeg syntes, at stemningen var helt fantastisk, selvom det begyndte at regne midt under koncerten.
  - zh: 演出结束后，我们去附近一家咖啡馆聊到半夜。
    answer: Bagefter gik vi på en café i nærheden og snakkede indtil midnat.
