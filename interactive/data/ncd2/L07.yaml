- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 我每天骑车上班，为了锻炼身体并省钱。（用 for at）
    answer: Jeg cykler til arbejde hver dag for at få motion og spare penge.
  - zh: 她早上提前十五分钟出门，为了不迟到。（用 for ikke at）
    answer: Hun går hjemmefra femten minutter tidligere om morgenen for ikke at komme for sent.
  - zh: 尽管五月经常刮风下雨，我们还是骑车去办公室。（用 Selvom 放句首）
    answer: Selvom det ofte blæser og regner i maj, cykler vi alligevel ind til kontoret.
  - zh: 即使公司离我家很近，我也想参加这个团队。（用 selvom）
    answer: Selvom arbejdet ligger tæt på mit hjem, vil jeg gerne være med på holdet.
  - zh: 我们报名参加活动，因为我们想赢得一辆新电动自行车。（用 fordi）
    answer: Vi melder os til kampagnen, fordi vi gerne vil vinde en ny elcykel.
