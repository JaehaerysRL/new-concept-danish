  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 当我在客厅看书时，我听见有人在敲门。（banke på døren）
    answer: Mens jeg læste i stuen, hørte jeg nogen banke på døren.
  - zh: 昨晚我看见一辆警车停在邻居门前。
    answer: I går aftes så jeg en politibil standse foran naboens hus.
  - zh: 当孩子们在花园里玩时，爸爸在做晚饭。
    answer: Mens børnene legede i haven, lavede far aftensmad.
  - zh: 他突然感觉到一只小猫在碰他的脚。（røre ved hans fod）
    answer: Han mærkede pludselig en lille kat røre ved sin fod.
  - zh: 当我没注意看的时候，小狗吃掉了我的三明治。（ikke kiggede）
    answer: Mens jeg ikke kiggede, spiste hunden min sandwich.
