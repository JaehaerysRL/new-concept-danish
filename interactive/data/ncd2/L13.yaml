- id: A
  type: drill
  title: 练习 A：填关系代词（判断每空应填 som、der，还是 begge [som/der 皆可]）
  items:
  - prompt: Jeg bor i en lejlighed, {{_}} ligger tæt på stationen.
    kind: cloze
    blanks:
    - - begge
    explain: ⟦som / der⟧ 皆可，后接动词 ⟦ligger⟧，作主语
  - prompt: Værelset, {{_}} jeg lejer hos en familie, er meget stille.
    kind: cloze
    blanks:
    - - som
    explain: 只能用 ⟦som⟧，后接主语 ⟦jeg⟧，作宾语
  - prompt: De har et stort køkken, {{_}} altid er rent og pænt.
    kind: cloze
    blanks:
    - - begge
    explain: ⟦som / der⟧ 皆可，后接副词 + 动词 ⟦altid er⟧，作主语
  - prompt: Familien, {{_}} Hassan bor hos, laver god mad om søndagen.
    kind: cloze
    blanks:
    - - som
    explain: 只能用 ⟦som⟧，后接主语 ⟦Hassan⟧，且搭配句尾介词 ⟦hos⟧
  - prompt: Jeg kender en studerende, {{_}} ikke kan lide at bo på kollegium.
    kind: cloze
    blanks:
    - - begge
    explain: ⟦som / der⟧ 皆可，后接 ⟦ikke kan lide⟧，作主语
  - prompt: Altanen, {{_}} Clara spiser morgenmad på, får masser af sol.
    kind: cloze
    blanks:
    - - som
    explain: 只能用 ⟦som⟧，后接主语 ⟦Clara⟧，搭配句尾介词 ⟦på⟧
  - prompt: Det er en bus, {{_}} kører direkte til universitetet.
    kind: cloze
    blanks:
    - - begge
    explain: ⟦som / der⟧ 皆可，后接动词 ⟦kører⟧，作主语
  - prompt: Den nye sofa, {{_}} vi købte i går, står nu i stuen.
    kind: cloze
    blanks:
    - - som
    explain: 只能用 ⟦som⟧，后接主语 ⟦vi⟧，作宾语
- id: B
  type: drill
  title: 练习 B：用关系从句合并两个句子（第 3–5 题注意句尾介词，第 6 题注意 ikke/aldrig 位置）
  items:
  - prompt: Jeg har en roomie. Hun elsker at lave mad. →
    kind: write
    accept:
    - Jeg har en roomie, der / som elsker at lave mad.
  - prompt: Vi bor i en gammel bygning. Jeg fandt den på nettet. →
    kind: write
    accept:
    - Vi bor i en gammel bygning, som jeg fandt på nettet.
    explain: 去掉重复代词 ⟦den⟧
  - prompt: Det er en sød familie. Jeg lejer et værelse hos dem. → ⟦Det er en sød familie, som...⟧
    kind: write
    accept:
    - Det er en sød familie, som jeg lejer et værelse hos.
    explain: 去掉 ⟦dem⟧，保留介词 ⟦hos⟧
  - prompt: Vi har en stor have. Børnene leger altid i den. → ⟦Vi har en stor have, som...⟧
    kind: write
    accept:
    - Vi har en stor have, som børnene altid leger i.
    explain: 保留介词 ⟦i⟧，且 ⟦altid⟧ 放从句动词前
  - prompt: Jeg har fået en ny cykel. Jeg cykler til arbejde på den. → ⟦Jeg har fået en ny cykel, som...⟧
    kind: write
    accept:
    - Jeg har fået en ny cykel, som jeg cykler til arbejde på.
  - prompt: Han har en nabo. Naboen rydder aldrig op i køkkenet. →
    kind: write
    accept:
    - Han har en nabo, der / som aldrig rydder op i køkkenet.
    explain: 注意 ⟦aldrig⟧ 前置！
