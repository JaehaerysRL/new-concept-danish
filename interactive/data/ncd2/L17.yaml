- id: A
  type: drill
  title: 练习 A：用 sin, sit, sine, hans, hendes 或 deres 填空
  items:
  - prompt: Signe og {{_}} mand, Anders, har fået en datter.
    kind: cloze
    blanks:
    - - hendes
    explain: 并列主语一部分，禁用 ⟦sin⟧
  - prompt: Anders elsker at gå tur med {{_}} lille pige i parken.
    kind: cloze
    blanks:
    - - sin
    explain: ⟦en pige⟧ 共性，回指主语 ⟦Anders⟧
  - prompt: De inviterede {{_}} familie til en hyggelig navnefest.
    kind: cloze
    blanks:
    - - deres
    explain: 主语 ⟦De⟧ 复数，必用 ⟦deres⟧
  - prompt: Man skal huske at tage {{_}} kamera med på ferie.
    kind: cloze
    blanks:
    - - sit
    explain: ⟦man⟧ 为单数泛指主语，⟦et kamera⟧ 为中性 → ⟦sit⟧
  - prompt: Signe savner Freja, når hun sidder på {{_}} kontor.
    kind: cloze
    blanks:
    - - sit
    explain: ⟦et kontor⟧ 中性，回指 ⟦hun⟧
  - prompt: Anders fortalte, at {{_}} forældre allerede har købt gaver.
    kind: cloze
    blanks:
    - - hans
    explain: ⟦at⟧-从句的新主语 ⟦hans forældre⟧，禁用 ⟦sin⟧
  - prompt: Bedsteforældrene tager ofte {{_}} barnebarn med i haven.
    kind: cloze
    blanks:
    - - deres
    explain: 主语 ⟦Bedsteforældrene⟧ 复数 → ⟦deres⟧
  - prompt: Signe pakkede {{_}} ting i tasken, før hun kørte på arbejde.
    kind: cloze
    blanks:
    - - sine
    explain: ⟦ting⟧ 此处为复数，回指 ⟦Signe⟧ → ⟦sine⟧
- id: B
  type: drill
  title: 练习 B：从句与双人物主语判定（圈出唯一正确的代词）
  items:
  - prompt: Maja er træt, fordi (⟦sin / hendes⟧) nye baby vågnede tre gange i nat.
    kind: write
    accept:
    - hendes
    explain: ⟦fordi⟧-从句的新主语
  - prompt: Lukas mødte Peter i byen og så (⟦sit / hans⟧) nye hus for første gang. (指彼得的新房子)
    kind: write
    accept:
    - hans
    explain: 指彼得的房子，而非主语卢卡斯自己的房子
  - prompt: Forældrene var glade, fordi (⟦deres / sine⟧) venner hjalp med maden.
    kind: write
    accept:
    - deres
    explain: 主语 ⟦venner⟧ 且原主语 ⟦Forældrene⟧ 也是复数
  - prompt: Emma ringede til (⟦sin / hendes⟧) bror i Kina for at fortælle nyheden.
    kind: write
    accept:
    - sin
    explain: ⟦en bror⟧ 共性，回指主语 ⟦Emma⟧
  - prompt: Signe spurgte Anders, om han havde fundet (⟦sit / hans⟧) pas i skuffen. (指安德斯自己的护照)
    kind: write
    accept:
    - sit
    explain: 在 ⟦om⟧-从句中，主语变成了 ⟦han⟧（安德斯），指安德斯自己的护照 ⟦et pas⟧，故用 ⟦sit⟧！
  - prompt: Både Jonas og (⟦sin / hans⟧) kæreste vil gerne have et barn næste år.
    kind: write
    accept:
    - hans
    explain: 并列主语部分，不能用 ⟦sin⟧
