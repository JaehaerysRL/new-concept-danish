    answer: Undskyld, kunne vi måske snakke sammen i to minutter?
  - zh: 我想请问一下，下周五我可不可以休一天假？
    answer: Jeg ville gerne spørge, om jeg måtte holde fri næste fredag.
  - zh: 如果您方便的话，我们能不能把会议改到下周一？
