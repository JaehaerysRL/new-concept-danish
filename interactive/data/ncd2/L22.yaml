  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 在丹麦，冬天最难熬的是黑暗，而不是寒冷。
    answer: I Danmark er det mørket, der er sværest om vinteren, og ikke kulden.
  - zh: 正是在一月，很多人最想念阳光。
    answer: Det er især i januar, at mange savner solen mest.
  - zh: 我最喜欢丹麦冬天的，正是家里点蜡烛的 hygge 氛围。
    answer: Det er hyggen med stearinlys derhjemme, som jeg bedst kan lide ved den danske vinter.
  - zh: 是梅特（Mette）每周冬泳三次。（强调主语“是梅特”）
    answer: Det er Mette, der vinterbader tre gange om ugen.
  - zh: 我不是在十二月，而是在二月感到疲惫。（Det er ikke..., men...）
    answer: Det er ikke i december, men i februar, at jeg bliver træt.
