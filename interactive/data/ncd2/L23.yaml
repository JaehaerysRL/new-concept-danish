- id: B
  type: drill
  title: 练习 B：将下列直接引语改为以过去时开头的间接引语（注意连词、时态后移与语序）
  items:
  - prompt: 'Marco sagde til Emma: ”Jeg arbejder ikke på lørdag.” → ⟦Marco sagde til Emma, at...⟧'
    kind: write
    accept:
    - Marco sagde til Emma, at han ikke arbejdede på lørdag.
    explain: ⟦ikke⟧ 前移 + 现在时退一般过去时
  - prompt: 'Emma spurgte Marco: ”Har du allerede fundet en god lejlighed?” → ⟦Emma spurgte Marco, om...⟧'
    kind: write
    accept:
    - Emma spurgte Marco, om han allerede havde fundet en god lejlighed.
    explain: 完成时退过去完成时
  - prompt: 'Marco spurgte Emma: ”Hvordan går det med dit danskstudie?” → ⟦Marco spurgte Emma, hvordan...⟧'
    kind: write
    accept:
    - Marco spurgte Emma, hvordan det gik med hendes danskstudie.
    explain: 注意取消倒装 + ⟦dit⟧ 改 ⟦hendes⟧
  - prompt: 'Sofie fortalte: ”Jeg har købt to gamle stole på markedet.” → ⟦Sofie fortalte, at...⟧'
    kind: write
    accept:
    - Sofie fortalte, at hun havde købt to gamle stole på markedet.
  - prompt: 'Læreren spurgte os: ”Kan I altid forstå danskerne på gaden?” → ⟦Læreren spurgte os, om...⟧'
    kind: write
    accept:
    - Læreren spurgte os, om vi altid kunne forstå danskerne på gaden.
    explain: ⟦altid⟧ 前移 + ⟦kan⟧ 退 ⟦kunne⟧
  - prompt: 'Peter spurgte sin ven: ”Hvad vil du lave næste sommer?” → ⟦Peter spurgte sin ven, hvad...⟧'
    kind: write
    accept:
    - Peter spurgte sin ven, hvad han ville lave næste sommer.
