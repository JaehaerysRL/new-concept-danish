  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 尽管冬天很黑很冷，但我还是很喜欢住在这里。
    answer: Selvom vinteren er mørk og kold, kan jeg stadig rigtig godt lide at bo her.
  - zh: 昨天艾玛问我，为什么我还没去过斯卡恩（Skagen）。
    answer: I går spurgte Emma mig, hvorfor jeg endnu ikke havde været i Skagen.
