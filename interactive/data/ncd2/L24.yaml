- id: A
  type: drill
  title: 练习 A：全册高频易错点综合选填
  items:
  - prompt: Sidste år {{_}} (⟦har jeg boet / boede jeg⟧) i en lille lejlighed i Odense.
    kind: cloze
    blanks:
    - - boede jeg
    explain: ⟦Sidste år⟧ 为已结束过去时间 + V2 倒装
  - prompt: Emma og Sofie er glade for {{_}} (⟦sine / deres⟧) nye naboer.
    kind: cloze
    blanks:
    - - deres
    explain: 复数主语禁止用 ⟦sine⟧
  - prompt: Jeg kan godt lide det nye job, {{_}} (⟦der / som⟧) jeg fandt i sidste måned.
    kind: cloze
    blanks:
    - - som
    explain: 作 ⟦fandt⟧ 的宾语，只能用 ⟦som⟧
  - prompt: '{{_}} (⟦Da / Når⟧) hun flyttede til Danmark, kendte hun ingen mennesker her.'
    kind: cloze
    blanks:
    - - Da
    explain: 过去一次性时间“当她搬来丹麦时”
  - prompt: '{{_}} (⟦Siden / Indtil⟧) i mandags har vi øvet os på indirekte tale i klassen.'
    kind: cloze
    blanks:
    - - Siden
    explain: 配现在完成时“从周一起一直……”
  - prompt: Læreren spurgte mig, {{_}} (⟦om / hvis⟧) jeg havde forberedt mig godt til prøven.
    kind: cloze
    blanks:
    - - om
    explain: 间接是非问句“是否”
  - prompt: Det er især nye ord, {{_}} (⟦som / at⟧) jeg prøver at lære hver dag.
    kind: cloze
    blanks:
    - - som
    explain: 作 ⟦lære⟧ 的宾语，必须用 ⟦som⟧；强调时间或地点状语才用 ⟦at⟧
  - prompt: I efterårsferien kørte de {{_}} (⟦ud / ude⟧) til kysten og sov {{_}} (⟦ind / inde⟧) i et sommerhus.
    kind: cloze
    blanks:
    - - ud
    - - inde
    explain: ⟦kørte ud⟧ 动态去海边；⟦sov inde⟧ 静态在度假屋内睡觉
- id: B
  type: drill
  title: 练习 B：综合语序、转述与 NCD 3 被动热身改写
  items:
  - prompt: 把时间从句提前（注意主句倒装）：⟦Jeg var nervøs, før jeg tog Modul 2-prøven.⟧ → ⟦Før jeg tog Modul 2-prøven,...⟧
    kind: write
    accept:
    - Før jeg tog Modul 2-prøven, var jeg nervøs.
    explain: 从句在句首，主句 V2 倒装
  - prompt: '合并成间接疑问句：⟦Marco spurgte Emma: ”Bor du ikke i Aarhus længere?”⟧ → ⟦Marco spurgte Emma, om...⟧'
    kind: write
    accept:
    - Marco spurgte Emma, om hun ikke boede i Aarhus længere.
    explain: 从句 ⟦ikke⟧ 前移 + 时态后移
  - prompt: 找出并改正错误：⟦Han sagde, at han havde ikke tid til at komme i går.⟧ →
    kind: write
    accept:
    - Han sagde, at han ikke havde tid til at komme i går.
    explain: 从句中 ⟦ikke⟧ 必须在变位动词 ⟦havde⟧ 前面
  - prompt: 改为礼貌过去时请求：⟦Vil du sende mig de nye materialer til Modul 3?⟧ → ⟦Kunne...⟧
    kind: write
    accept:
    - Kunne du måske sende mig de nye materialer til Modul 3?
  - prompt: 【NCD 3 预览】把主动句改成 ⟦-s⟧ 被动句（以 ⟦Dansk⟧ 作主语）：⟦Man taler dansk på arbejdspladsen.⟧ → ⟦Dansk...⟧
    kind: write
    accept:
    - Dansk tales på arbejdspladsen.
    - Der tales dansk på arbejdspladsen.
    explain: ⟦-s⟧ 被动表常规习惯
  - prompt: 【NCD 3 预览】用 ⟦blive⟧ 被动补全句子：⟦Min nye cykel {{_}} (⟦stjæle⟧, 一般过去时被动) i går aftes.⟧
    kind: cloze
    blanks:
    - - blev stjålet
    explain: 具体过去事件用 ⟦blev⟧ + 过去分词
