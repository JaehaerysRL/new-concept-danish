- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 在丹麦企业里，老板通常被直呼其名。
    answer: I danske virksomheder tiltales chefen normalt ved fornavn.
  - zh: 这项任务必须在周一下午四点之前提交。
    answer: Denne opgave skal afleveres inden mandag klokken seksten.
  - zh: 昨天上午召开了一场关于新项目的会议。
    answer: I går formiddags blev der indkaldt til et møde om det nye projekt.
  - zh: 她的建议在会议上被团队认真对待了。
    answer: Hendes forslag blev taget alvorligt af teamet på mødet.
  - zh: 在我们部门，所有重要决定都是大家共同讨论的。
    answer: I vores afdeling diskuteres alle vigtige beslutninger i fællesskab.
  - zh: 幸好办公室的门现在终于修好了（reparere）。
    answer: Heldigvis er døren til kontoret nu endelig repareret.
- id: A
  type: drill
  title: 练习 A：语态手术——按括号提示将主动句改写为指定被动句（有施动者时用 af，无人称用 Der）
  items:
  - prompt: ⟦Man taler både dansk og engelsk i vores afdeling.⟧（改 ⟦-s⟧ 被动，以 ⟦Der⟧ 开头）→
    kind: write
    accept:
    - Der tales både dansk og engelsk i vores afdeling.
    explain: 无人称常态用 ⟦Der + -s⟧ 被动
  - prompt: ⟦Chefen aflyste mødet i går morges.⟧（改 ⟦blive⟧ 过去时被动，保留施动者）→
    kind: write
    accept:
    - Mødet blev aflyst af chefen i går morges.
    explain: 具体过去事件用 ⟦blev + 分词⟧，施动者前用 ⟦af⟧
  - prompt: ⟦Vi skal aflevere rapporten inden fredag.⟧（改情态动词 + ⟦-s⟧ 被动，省略施动者）→
    kind: write
    accept:
    - Rapporten skal afleveres inden fredag.
    explain: 情态动词 ⟦skal⟧ 后接 ⟦-s⟧ 被动原形
  - prompt: ⟦Afdelingen har nu godkendt det nye forslag.⟧（改 ⟦blive⟧ 现在完成时被动）→
    kind: write
    accept:
    - Det nye forslag er nu blevet godkendt af afdelingen.
    explain: 现在完成时被动：⟦er blevet + 分词⟧
  - prompt: ⟦Medarbejderne registrerer altid deres ferie i systemet.⟧（改 ⟦-s⟧ 被动，省略施动者）→
    kind: write
    accept:
    - Ferie registreres altid i systemet.
    explain: 普遍规章制度用 ⟦-s⟧ 被动
  - prompt: ⟦De maler kantinen i denne uge.⟧（改 ⟦blive⟧ 现在进行过程被动）→
    kind: write
    accept:
    - Kantinen bliver malet i denne uge.
    explain: 正在进行的事件过程用 ⟦bliver + 分词⟧
