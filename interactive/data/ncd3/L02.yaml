- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 丹麦没有法定最低工资，这意味着工会扮演着重要的角色。
    answer: Danmark har ingen lovbestemt mindsteløn, hvilket betyder, at fagforeningen spiller en vigtig rolle.
  - zh: 他去年加入了失业保险基金，这给了他很大的安全感。
    answer: Han meldte sig ind i en a-kasse sidste år, hvilket gav ham en stor tryghed.
  - zh: 我收到了一份新合同，里面写明了我的工资和工作时间。（用 hvori）
    answer: Jeg har fået en ny kontrakt, hvori min løn og arbejdstid står.
  - zh: 如果一个人失业了，失业保险基金可以通过救济金提供支持。
    answer: Hvis man bliver arbejdsløs, kan a-kassen støtte med dagpenge.
  - zh: 在签订新合同之前，让工会帮你审核一下是明智的。
    answer: Før man skriver under på en ny kontrakt, er det klogt at lade fagforeningen tjekke den.
  - zh: 我们的团队有十二名成员，其中四名来自国外。（用 hvoraf）
    answer: Vores team har tolv medlemmer, hvoraf fire kommer fra udlandet.
- id: A
  type: drill
  title: 练习 A：B1 句法升格——按要求合并下列句子（注意从句中否定词与副词位置）
  items:
  - prompt: ⟦Virksomheder kan nemt ansætte nye folk. Det gør arbejdsmarkedet fleksibelt.⟧（用 ⟦, hvilket...⟧ 合并）→
    kind: write
    accept:
    - Virksomheder kan nemt ansætte nye folk, hvilket gør arbejdsmarkedet fleksibelt.
  - prompt: ⟦Man får ikke altid dagpenge fra dag ét. Det betyder ofte, at folk sparer penge op.⟧（用 ⟦, hvilket ofte...⟧ 合并）→
    kind: write
    accept:
    - Man får ikke altid dagpenge fra dag ét, hvilket ofte betyder, at folk sparer penge op.
  - prompt: ⟦Jeg har læst kontrakten igennem. Alle mine vilkår står i den.⟧（用 ⟦hvori⟧ 合并）→
    kind: write
    accept:
    - Jeg har læst kontrakten igennem, hvori alle mine vilkår står.
  - prompt: ⟦A-kassen er en forsikring. Man kan sikre sin økonomi med den.⟧（用 ⟦hvormed⟧ 合并）→
    kind: write
    accept:
    - A-kassen er en forsikring, hvormed man kan sikre sin økonomi.
  - prompt: ⟦Der var tyve ansøgere til stillingen. Fem af dem blev inviteret til samtale.⟧（用 ⟦hvoraf⟧ 合并）→
    kind: write
    accept:
    - Der var tyve ansøgere til stillingen, hvoraf fem blev inviteret til samtale.
  - prompt: ⟦Jeg har en gammel kollega. Jeg talte med ham i går.⟧（用口语自然式 ⟦som... med⟧ 合并）→
    kind: write
    accept:
    - Jeg har en gammel kollega, som jeg talte med i går.
