  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 会员数量的增长归因于该俱乐部拥有友好的氛围。
    answer: Stigningen i antallet af medlemmer skyldes, at klubben har en venlig stemning.
  - zh: 由于工作太多，她暂时没有时间参加理事会的工作。
    answer: På grund af for meget arbejde har hun foreløbig ikke tid til at arbejde i bestyrelsen.
  - zh: 在当地社团做志愿者工作往往会带来更强的地方归属感。
    answer: Frivilligt arbejde i en lokal forening fører ofte til et stærkere tilhørsforhold til området.
  - zh: 高昂的房租导致许多年轻人不得不搬到郊区。
    answer: Den høje husleje fører til, at mange unge må flytte ud til forstæderne.
