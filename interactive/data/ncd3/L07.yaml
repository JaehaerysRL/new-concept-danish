- id: B
  type: drill
  title: 练习 B：句型双向转换——按提示翻转因果视角或互换“介词短语 vs 从句”
  items:
  - prompt: 用 ⟦skyldes, at⟧ 改写（结果放前面）：⟦At trænerne arbejder frivilligt, fører til, at priserne er lave.⟧ → ⟦At priserne er lave,...⟧
    kind: write
    accept:
    - At priserne er lave, skyldes, at der er frivillige trænere / frivillige trænere.
  - prompt: 用 ⟦fører til, at⟧ 改写（原因放前面）：⟦De mange nye venner skyldes, at han spiller fodbold.⟧ → ⟦At han spiller fodbold,...⟧
    kind: write
    accept:
    - At han spiller fodbold, fører til, at han har mange nye venner.
  - prompt: 用 ⟦på grund af⟧ + 名词替换 ⟦fordi⟧ 从句：⟦Hun meldte afbud, fordi det regnede kraftigt.⟧ → ⟦Hun meldte afbud...⟧
    kind: write
    accept:
    - Hun meldte afbud på grund af det kraftige regnvejr / regnen.
  - prompt: 把 ⟦På grund af⟧ 短语放到句首（注意 V2 倒装！）：⟦Vi får ikke råd til en ny hal på grund af de høje priser.⟧ → ⟦På grund af de høje priser...⟧
    kind: write
    accept:
    - På grund af de høje priser får vi ikke råd til en ny hal.
    explain: V2 倒装
  - prompt: 用 ⟦fordi⟧ 改写（注意从句副词位置）：⟦Han kom ikke til træning på grund af sin sygdom.⟧ → ⟦Han kom ikke til træning, fordi han...⟧ (⟦ikke var rask / var syg⟧)
    kind: write
    accept:
    - Han kom ikke til træning, fordi han var syg / ikke var rask.
    explain: 注意从句中 ⟦ikke⟧ 在动词前
  - prompt: 纠错改写：⟦Den store interesse skyldes af, at klubben har mange tilbud.⟧ →
    kind: write
    accept:
    - Den store interesse skyldes, at klubben har mange tilbud.
    explain: 删掉多余的 ⟦af⟧
