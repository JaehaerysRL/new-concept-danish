- id: A
  type: drill
  title: 练习 A：语境选词——用 må, kan, kan ikke, bør 或 skulle 填空（注意推测与传闻语义）
  items:
  - prompt: Når han arbejder 60 timer om ugen, {{_}} han være meget træt om aftenen.
    kind: cloze
    blanks:
    - - må
    explain: 每周工作 60 小时，逻辑必然“一定很累”
  - prompt: Det {{_}} passe, at hun allerede har glemt aftalen — hun ringede jo for ti minutter siden! (否定)
    kind: cloze
    blanks:
    - - kan ikke
    explain: 十分钟前才打过电话，“不可能”忘记
  - prompt: Den nye restaurant i midtbyen {{_}} efter sigende have den bedste fisk i byen.
    kind: cloze
    blanks:
    - - skulle / skal
    explain: ⟦skulle efter sigende⟧ 据说/传闻，用过去时 ⟦skulle⟧ 更显客观存疑
  - prompt: Janteloven {{_}} både have positive og negative sider for unge medarbejdere.
    kind: cloze
    blanks:
    - - kan
    explain: 表示客观可能性“可能有正反两面”
  - prompt: Vi {{_}} give nye kolleger mere plads til at fortælle om deres idéer.
    kind: cloze
    blanks:
    - - bør
    explain: 提出合理规范建议“应当”
  - prompt: Hun svarer ikke på telefonen; hun {{_}} allerede være taget hjem fra arbejde.
    kind: cloze
    blanks:
    - - må
    explain: 不接电话，高度推测“一定是已经回家了”
  - prompt: Kulturen på arbejdspladser {{_}} efter sigende have ændret sig meget de sidste ti år.
    kind: cloze
    blanks:
    - - skulle / skal
    explain: 与 ⟦efter sigende⟧ 搭配表示传闻
  - prompt: Du {{_}} ikke prale for meget på dit første jobmøde, hvis du vil skabe et godt indtryk.
    kind: cloze
    blanks:
    - - bør / må
    explain: 劝告/提醒“不应该/不许”
- id: B
  type: drill
  title: 练习 B：语体改写——将下列直接陈述改写为带情态推测或传闻转述的 B1 句子
  items:
  - prompt: 用 ⟦må være⟧ 改写：⟦Jeg er helt sikker på, at det er svært at starte i et nyt land.⟧ → ⟦Det...⟧
    kind: write
    accept:
    - Det må være svært at starte i et nyt land.
  - prompt: 用 ⟦skulle efter sigende være⟧ 改写：⟦Folk siger, at kulturen i København er mere international i dag.⟧ → ⟦Kulturen i København...⟧
    kind: write
    accept:
    - Kulturen i København skulle efter sigende være mere international i dag.
  - prompt: 用 ⟦kan ikke passe⟧ 改写：⟦Det er helt umuligt, at Janteloven er forsvundet fuldstændigt.⟧ → ⟦Det...⟧
    kind: write
    accept:
    - Det kan ikke passe, at Janteloven er forsvundet fuldstændigt.
  - prompt: 用 ⟦må have + 分词⟧ 改写（过去推测）：⟦Jeg er sikker på, at hun har glemt sin paraply på kontoret.⟧ → ⟦Hun...⟧
    kind: write
    accept:
    - Hun må have glemt sin paraply på kontoret.
  - prompt: 用 ⟦kan skabe⟧ 改写：⟦Måske skaber for meget konkurrence stress på arbejdspladsen.⟧ → ⟦For meget konkurrence...⟧
    kind: write
    accept:
    - For meget konkurrence kan skabe stress på arbejdspladsen.
  - prompt: 纠错改写：⟦Det må ikke være rigtigt, at han tjener så mange penge i et studiejob!⟧ →
    kind: write
    accept:
    - Det kan ikke være rigtigt, at han tjener så mange penge i et studiejob!
    explain: 否定推测禁区：必须把 ⟦må ikke⟧ 改为 ⟦kan ikke⟧
