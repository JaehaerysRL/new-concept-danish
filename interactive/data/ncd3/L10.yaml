  title: 练习 B：句型转换——让步互换与对比句合并
  items:
  - prompt: 用 ⟦på trods af⟧ + 名词替换 ⟦selvom⟧ 从句：⟦Selvom det regner meget, går de en tur med barnevognen.⟧ (⟦regnen⟧) → ⟦På trods af...⟧
