- id: B
  type: drill
  title: 练习 B：句型外科手术（合并两句或修正下列病句，注意保留介词与形式宾语 det）
  items:
  - prompt: 合并句子：⟦Jeg regner med det. Min nye kodeviser kommer med posten på fredag.⟧ → ⟦Jeg regner med, at...⟧
    kind: write
    accept:
    - Jeg regner med, at min nye kodeviser kommer med posten på fredag.
  - prompt: 合并句子：⟦Hun er i tvivl om det. Har hun fået en besked i e-Boks?⟧（用 ⟦hvorvidt⟧）→ ⟦Hun er i tvivl om, hvorvidt...⟧
    kind: write
    accept:
    - Hun er i tvivl om, hvorvidt hun har fået en besked i e-Boks.
    explain: 注意一般疑问句语序还原为主语 ⟦hun⟧ 在动词 ⟦har⟧ 前！
  - prompt: 合并句子：⟦Vi sætter stor pris på det. Hvis I kan løse problemet inden weekenden.⟧ → ⟦Vi sætter stor pris...⟧
    kind: write
    accept:
    - Vi sætter stor pris på det, hvis I kan løse problemet inden weekenden.
  - prompt: 纠错改写（漏了介词）：⟦*Jeg er meget glad, at du kunne hjælpe mig med MitID.⟧ →
    kind: write
    accept:
    - Jeg er meget glad for, at du kunne hjælpe mig med MitID.
    explain: ⟦glad for, at...⟧ 不可丢掉介词 ⟦for⟧
  - prompt: 纠错改写（误用 ⟦hvis⟧ 表“是否”）：⟦*Han er i tvivl om, hvis han skal ringe til borgerservice.⟧ →
    kind: write
    accept:
    - Han er i tvivl om, om / hvorvidt han skal ringe til borgerservice.
    explain: 不用 ⟦hvis⟧
  - prompt: 纠错改写（逗号位置与从句否定语序错误）：⟦*De regner, med at systemet virker ikke i nat.⟧ →
    kind: write
    accept:
    - De regner med, at systemet ikke virker i nat.
    explain: 逗号在 ⟦med⟧ 后；从句里 ⟦ikke⟧ 放在动词 ⟦virker⟧ 前
  open: true
