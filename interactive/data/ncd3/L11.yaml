- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 我预计市政厅会在两天内给我回复。
    answer: Jeg regner med, at kommunen svarer mig inden for to dage.
  - zh: 我们非常感激大家能按时查看自己的电子邮箱。
    answer: Vi sætter stor pris på, at alle tjekker deres e-Boks til tiden.
  - zh: 我不确定我是否已经收到了来自银行的信件。
    answer: Jeg er i tvivl om, hvorvidt jeg allerede har fået brevet fra banken.
  - zh: 这完全取决于你在新手机上如何使用这个应用。
    answer: Det kommer helt an på, hvordan du bruger appen på den nye telefon.
  - zh: 如果您能尽快查看我的申请，我将非常感激。（用 på det, hvis）
    answer: Jeg vil sætte stor pris på det, hvis I kan se på min ansøgning snarest.
