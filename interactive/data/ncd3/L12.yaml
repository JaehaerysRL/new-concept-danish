- id: B
  type: drill
  title: 练习 B：句型手术——按要求用 Jo..., desto... 或 lige så... som 合并或改错
  items:
  - prompt: 合并句子：⟦Vi genbruger meget tøj. Vi sparer mange penge.⟧ → ⟦Jo mere tøj vi genbruger, desto...⟧
    kind: write
    accept:
    - Jo mere tøj vi genbruger, desto flere penge sparer vi.
    explain: 后半句触发 V2 倒装 ⟦sparer vi⟧！
  - prompt: 合并句子：⟦Man bor længe i storbyen. Man bruger delingsøkonomi ofte.⟧ → ⟦Jo længere...⟧
    kind: write
    accept:
    - Jo længere tid man bor i storbyen, desto oftere bruger man delingsøkonomi.
  - prompt: 合并句子：⟦Den gamle symaskine er god. Den nye symaskine er også god.⟧ → ⟦Den gamle symaskine er...⟧
    kind: write
    accept:
    - Den gamle symaskine er lige så god som den nye.
  - prompt: 纠错改写（后半句漏了倒装）：⟦*Jo billigere billetten bliver, desto hurtigere vi køber den.⟧ →
    kind: write
    accept:
    - Jo billigere billetten bliver, desto hurtigere køber vi den.
    prefill: '*Jo billigere billetten bliver, desto hurtigere vi køber den.'
    explain: 注意动词 ⟦køber⟧ 必须抢在第 2 位，置于主语 ⟦vi⟧ 之前！
  - prompt: 纠错改写（比较级与可数词错配）：⟦*Jo mere billig trøjen er, desto flere tid sparer jeg.⟧ →
    kind: write
    accept:
    - Jo billigere trøjen er, desto mere tid sparer jeg.
    prefill: '*Jo mere billig trøjen er, desto flere tid sparer jeg.'
    explain: 短形容词用 ⟦-ere⟧，不可数 ⟦tid⟧ 用 ⟦mere⟧
  - prompt: 纠错改写（肯定句缺少 ⟦lige⟧）：⟦*Den brugte frakke er så varm som en ny vinterjakke.⟧ →
    kind: write
    accept:
    - Den brugte frakke er lige så varm som en ny vinterjakke.
    explain: 肯定等比必须有 ⟦lige⟧
  open: true
