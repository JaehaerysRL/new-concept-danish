- id: B
  type: drill
  title: 练习 B：段落句法补全（对标 DU3 Modul 3 Læsning Opgave 3）
  items:
  - prompt: Rundt om København har man i de senere år bygget særlige ”supercykelstier”, som forbinder forstæderne med centrum. (1) {{_}} Derfor vælger stadig flere pendlere nu elcyklen frem for bilen til arbejde. A. Ikke alene er ruterne brede og lige, men de har også færre stop ved lyskryds. B. Ikke alene stierne er smalle, men bilerne kører også alt for hurtigt der. C. Det er især om natten, der ingen mennesker bruger cykelstierne. D. Men desværre er det forbudt at bruge elcykel på de nye stier.
    kind: cloze
    blanks:
    - - A
    explain: 语序唯一正确：⟦Ikke alene er ruterne..., men de har også...⟧；B 项未倒装且语义不符；C 项时间状语误用 ⟦der⟧。
  - prompt: På nogle strækninger er der sat små fodhvilere og luftpumper op langs ruten. (2) {{_}} Det viser, at kommunerne tænker meget over de små detaljer for cyklisterne. A. Alligevel vil pendlerne hellere vente i bilkøen på motorvejen. B. Det er netop sådanne praktiske løsninger, der gør turen meget mere behagelig. C. Derfor har næsten alle borgere solgt deres gamle cykler i år. D. Det er faktisk ikke cyklisterne, at man har bygget pumperne til.
    kind: cloze
    blanks:
    - - B
    explain: ⟦sådanne praktiske løsninger⟧ 回指前句的“脚踏板和打气筒”，且分裂句使用正确；D 项状语/介词结构误用 ⟦at⟧ 且语义荒谬。
  - prompt: Selvom Danmark ofte har blæst og regn om efteråret, fortsætter mange med at pendle på to hjul året rundt. (3) {{_}} Hvis bare tøjet passer til vejret, kommer man hurtigt og frisk frem til kontoret. A. For det er først og fremmest en god vane, som man hurtigt vænner sig til. B. Men derfor lukker alle supercykelstierne allerede i oktober måned. C. Ikke kun regner det altid, men også sner det hver uge om efteråret. D. Det er først i maj, der man kan tage cyklen frem igen.
    kind: cloze
    blanks:
    - - A
    explain: ⟦god vane⟧ 解释为什么风雨无阻；C 项逻辑荒谬，D 项时间状语误用 ⟦der⟧。
