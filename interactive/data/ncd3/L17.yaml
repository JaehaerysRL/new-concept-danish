- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 骑车不仅有利于健康，而且还能减少城市噪音。（用 Ikke alene 放句首）
    answer: Ikke alene er det sundt at cykle, men det mindsker også støjen i byen.
  - zh: 通勤者不仅节省了时间，而且还在路上获得了新鲜空气。
    answer: Ikke alene sparer pendlerne tid, men de får også frisk luft på vejen.
  - zh: 决定大家是否骑车的其实不是天气，而是城市的基础设施。
    answer: Det er faktisk ikke vejret, der afgør, om folk cykler, men derimod byens infrastruktur.
