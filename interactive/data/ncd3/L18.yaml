- id: B
  type: drill
  title: 练习 B：语体升级手术——将口语或“中式/英式直译”句改写为带复合介词的 B1 书面句（注意 V2 倒装）
  items:
  - prompt: 口语句：⟦Når man snakker om prisen, er dansk medicin ikke gratis for voksne.⟧ → ⟦Med hensyn til...⟧
    kind: write
    accept:
    - Med hensyn til prisen er dansk medicin ikke gratis for voksne.
    explain: 注意 V2 倒装 ⟦er dansk medicin⟧
  - prompt: 英语污染改错：⟦I forbindelse med bestillende en tid på nettet fik jeg en fejl.⟧ →
    kind: write
    accept:
    - I forbindelse med at bestille en tid på nettet fik jeg en fejl.
    explain: 或 ⟦I forbindelse med ⟦tidsbestillingen⟧ på nettet...⟧，禁止用 ⟦-ende⟧
  - prompt: 句首倒装合并：⟦Vi læste rapporten. Derefter ændrede vi vores plan.⟧（用 ⟦På baggrund af⟧ 合并）→
    kind: write
    accept:
    - På baggrund af rapporten ændrede vi vores plan.
    explain: 句首介词短语触发主句倒装
  - prompt: 对比改写：⟦Mit nye lægehus er meget bedre, når man sammenligner med det gamle.⟧ → ⟦I forhold til...⟧
    kind: write
    accept:
    - I forhold til mit gamle lægehus er det nye meget bedre.
  - prompt: 从句衔接：⟦I forbindelse med at patienter skal vente længe på operation, bliver de ofte utrygge.⟧（把从句移到句首，注意主句倒装）→
    kind: write
    accept:
    - I forbindelse med, at patienter skal vente længe på operation, bliver de ofte utrygge.
