  items:
  - zh: 与去年相比，这家医院的候诊时间现在短了很多。
    answer: I forhold til sidste år er ventetiden på dette hospital nu blevet meget kortere.
  - zh: 在搬到哥本哈根之际，我收到了一张新的黄色医保卡。
    answer: I forbindelse med min flytning til København modtog jeg et nyt gult sundhedskort.
  - zh: 基于化验结果（prøvesvarene），家庭医生给我开了一张去专科医生的转诊单。
    answer: På baggrund af prøvesvarene gav min praktiserende læge mig en henvisning til en speciallæge.
  - zh: 至于数字医疗服务，丹麦已经比许多国家走得更远。
    answer: Med hensyn til digitale sundhedstilbud er Danmark kommet længere end mange andre lande.
  - zh: 由于医护人员短缺，有时很难很快约到号（at få en tid hurtigt）。
    answer: På grund af mangel på personale er det nogle gange svært at få en tid hurtigt.
