- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 只要大家互相倾听，很多误会就会被很快解决。（省略 hvis + -s 被动）
    answer: Lytter man til hinanden, løses mange misforståelser hurtigt.
  - zh: 与在课堂上相比，在真实职场中说丹麦语需要更大的勇气。（I forhold til）
    answer: I forhold til i klassen kræver det større mod at tale dansk på en rigtig arbejdsplads.
  - zh: 越是在日常生活中使用丹麦语，它就变得越自然。（Jo..., desto...）
    answer: Jo mere man bruger dansk i hverdagen, desto mere naturligt bliver det.
- id: A
  type: drill
  title: 练习 A：NCD 3 八关综合诊错与结构手术（每题找出 1 处典型语法错误并改正，或按要求改写）
  items:
  - prompt: 【被动语态】在办公室每天说丹麦语（改错）：⟦På vores kontor er der talt dansk hver dag.⟧ →
    kind: write
    accept:
    - -s På vores kontor tales der dansk hver dag.
    explain: 表达通用习惯须用；被动 →
  - prompt: 【条件倒装】去掉 ⟦hvis⟧ 改写（注意双倒装）：⟦Hvis du øver dig lidt hver dag, forstår du snart danskerne bedre.⟧ →
    kind: write
    accept:
    - Øver du dig lidt hver dag, forstår du snart danskerne bedre.
    explain: 条件动词放第 1 位，主句也须倒装！
  - prompt: 【整句从句】用 ⟦hvilket⟧ 合并：⟦Jeg har fået et studiejob på en dansk café. Det hjælper mit sprog meget.⟧ →
    kind: write
    accept:
    - Jeg har fået et studiejob på en dansk café, hvilket hjælper mit sprog meget.
    explain: 用逗号 + ⟦hvilket⟧ 取代 ⟦. Det⟧
  - prompt: 【复合介词】改错：⟦I forbindelse med lærende et nyt sprog skal man være tålmodig.⟧ →
    kind: write
    accept:
    - -ende I forbindelse med at lære et nyt sprog...
    explain: 介词后严禁用；或 ⟦I forbindelse med indlæringen af...⟧
  - prompt: 【排比倒装】改错：⟦Ikke alene sproget hjælper dig på arbejdet, men det også giver nye venner.⟧ →
    kind: write
    accept:
    - Ikke alene også Ikke alene hjælper sproget dig på arbejdet, men det giver også nye venner.
    explain: 句首；缺倒装 +；错位 →
  - prompt: 【分词定语】用括号内词的复数定指形式填空：⟦Man skal kende både de skrevne og de {{_}} (uskreven) regler.⟧
    kind: cloze
    blanks:
    - - uskrevne
    explain: 复数定指变化：⟦uskreven → uskrevne⟧
  - prompt: 【对比连词】改错：⟦Her taler vi meget dansk, hvorimod i min gamle afdeling snakkede vi kun engelsk.⟧ →
    kind: write
    accept:
    - hvorimod Her taler vi meget dansk, hvorimod vi i min gamle afdeling kun snakkede engelsk.
    explain: 从句中禁止用主句倒装 →
  - prompt: 【复合名词】合并并确定冠词（⟦en/et⟧）：⟦en uddannelse + et forløb⟧（培训流程）→
    kind: write
    accept:
    - et uddannelsesforløb
    explain: ⟦-else⟧ 结尾加 ⟦fuge-s⟧，右端词 ⟦et forløb⟧ 决定中性 ⟦et⟧
- id: C
  type: drill
  title: 练习 C：中译丹（综合调用全册六大语法支柱）
  items:
  - prompt: 只要大家互相倾听，很多误会就会被很快解决。（省略 ⟦hvis⟧ + ⟦-s⟧ 被动）
    kind: write
    accept:
    - Lytter man til hinanden, løses mange misforståelser hurtigt.
    explain: 或 ⟦...bliver mange misforståelser hurtigt løst.⟧
  - prompt: 在申请新工作之际，学会用丹麦语介绍自己非常重要。（⟦I forbindelse med⟧ + 复合词）
    kind: write
    accept:
    - I forbindelse med at søge et nyt job er det meget vigtigt at kunne præsentere sig selv på dansk.
  - prompt: 我不确定自己是否能听懂丹麦语新闻，这让我有点紧张。（⟦i tvivl om, hvorvidt...⟧ + ⟦hvilket⟧）
    kind: write
    accept:
    - Jeg er i tvivl om, hvorvidt jeg kan forstå de danske nyheder, hvilket gør mig lidt nervøs.
  - prompt: 与在课堂上相比，在真实职场中说丹麦语需要更大的勇气。（⟦I forhold til⟧）
    kind: write
    accept:
    - I forhold til i klassen kræver det større mod at tale dansk på en rigtig arbejdsplads.
  - prompt: 学一门新语言不仅需要时间，而且还能让你更好地理解一个国家的文化。（⟦Ikke alene..., men også...⟧）
    kind: write
    accept:
    - Ikke alene kræver det tid at lære et nyt sprog, men det giver dig også en bedre forståelse af landets kultur.
  - prompt: 越是在日常生活中使用丹麦语，它就变得越自然。（⟦Jo..., desto...⟧）
    kind: write
    accept:
    - Jo mere man bruger dansk i hverdagen, desto mere naturligt bliver det.
