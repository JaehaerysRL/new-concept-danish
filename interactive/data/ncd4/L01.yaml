- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 放心吧，明天他大概不会迟到。（用 nok）
    answer: Bare rolig, i morgen kommer han nok ikke for sent.
  - zh: 我毕竟已经把邮件发给你了呀。（用 jo）
    answer: Jeg har jo allerede sendt mailen til dig.
  - zh: 听说我们的老板下周要去奥胡斯。（用 vist）
    answer: Vores chef skal vist til Aarhus i næste uge.
  - zh: 你当然可以问同事这个问题！（用 da）
    answer: Du kan da sagtens stille din kollega det spørgsmål!
  - zh: 她没来上班，因为她好像生病了。（在从句中用 vist）
    answer: Hun kom ikke på arbejde, fordi hun vist er syg.
  - zh: 他大概是对的，但我们还需要再核对一下数据。（用 nok）
    answer: Han har nok ret, men vi skal lige tjekke tallene igen.
- id: A
  type: drill
  title: 练习 A：语序定位手术——将括号中的情态小品词插入句中唯一准确位置（注意 V2 倒装、轻代词与从句语序）
  items:
  - prompt: ⟦Jeg sagde det til dig i går.⟧（插入 ⟦jo⟧）→
    kind: write
    accept:
    - Jeg sagde det jo til dig i går.
    explain: 轻代词 ⟦det⟧ 必须放在情态小品词 ⟦jo⟧ 前面
  - prompt: ⟦I morgen når hun ikke at sende rapporten.⟧（插入 ⟦nok⟧）→
    kind: write
    accept:
    - I morgen når hun nok ikke at sende rapporten.
    explain: V2 倒装后顺序：动词 + 主语 + ⟦nok⟧ + ⟦ikke⟧
  - prompt: ⟦Hun blev overrasket, fordi hun ikke kendte reglerne.⟧（在从句中插入 ⟦jo⟧）→
    kind: write
    accept:
    - Hun blev overrasket, fordi hun jo ikke kendte reglerne.
    explain: 从句中 ⟦jo⟧ 置于主语后、⟦ikke⟧ 与变位动词前
  - prompt: ⟦De var meget glade for forslaget.⟧（插入 ⟦da⟧ 表温和感叹/反驳）→
    kind: write
    accept:
    - De var da meget glade for forslaget.
    explain: 主句中位于变位动词 ⟦var⟧ 之后
  - prompt: ⟦Direktøren rejser til Berlin på tirsdag.⟧（插入 ⟦vist⟧ 表听说/不确定）→
    kind: write
    accept:
    - Direktøren rejser vist til Berlin på tirsdag.
    explain: 位于第一变位动词 ⟦rejser⟧ 之后
  - prompt: ⟦Han tror, at mødet begynder klokken ti.⟧（在从句中插入 ⟦vist⟧）→
    kind: write
    accept:
    - Han tror, at mødet vist begynder klokken ti.
    explain: ⟦at⟧ 引导从句，⟦vist⟧ 放在变位动词 ⟦begynder⟧ 前面
  - prompt: ⟦Du har glemt din paraply igen.⟧（插入 ⟦da⟧ 温和提醒）→
    kind: write
    accept:
    - Du har da glemt din paraply igen.
    explain: 位于助动词 ⟦har⟧ 之后、过去分词 ⟦glemt⟧ 之前
