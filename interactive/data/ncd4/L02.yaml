- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 我们要不要顺便去咖啡馆喝杯咖啡？（用 lige）
    answer: Skal vi lige tage en kop kaffe på caféen?
  - zh: 说起来，你周末究竟打算做什么？（用 egentlig）
    answer: Hvad skal du egentlig lave i weekenden?
  - zh: 如果你有问题，尽管给我发消息就行。（用 bare）
    answer: Hvis du har spørgsmål, kan du bare sende mig en besked.
  - zh: 这次考试大概不会太难吧？（用 vel）
    answer: Denne eksamen bliver vel ikke alt for svær?
  - zh: 我们可以今天见面，要不然就周四再聊。（用 ellers）
    answer: Vi kan mødes i dag; ellers snakker vi bare på torsdag.
  - zh: 顺便问一下，除此之外你的项目进展得怎么样？（用 ellers）
    answer: Hvordan går det ellers med dit projekt?
- id: A
  type: drill
  title: 练习 A：高情商软化改写——按括号提示用指定小品词软化下列生硬句子（注意语序与 V2 倒装）
  items:
  - prompt: ⟦Send udkastet til mig i dag.⟧（改用 ⟦Kan du lige...⟧ 软化为礼貌请求）→
    kind: write
    accept:
    - Kan du lige sende udkastet til mig i dag?
    explain: 用 ⟦Kan du lige...⟧ 彻底消除命令感
  - prompt: ⟦Hvad arbejder du med nu?⟧（在动词和主语后插入 ⟦egentlig⟧，并改得更柔和）→
    kind: write
    accept:
    - Hvad arbejder du egentlig med nu?
    explain: 在主语 ⟦du⟧ 之后插入 ⟦egentlig⟧
  - prompt: ⟦Hvis du ikke har tid, finder vi en ny dag.⟧（以 ⟦Ellers⟧ 开头改写后半句，注意 V2 倒装）→
    kind: write
    accept:
    - Ellers finder vi bare en ny dag.
    explain: ⟦Ellers⟧ 放句首后动词 ⟦finder⟧ 紧跟占第 2 位
  - prompt: ⟦Du må bruge min computer.⟧（在祈使句或情态句中插入 ⟦bare⟧ 表热情许可）→
    kind: write
    accept:
    - Du må bare bruge min computer.
    explain: 或 ⟦Brug bare min computer!⟧，⟦bare⟧ 传达热情大方
  - prompt: ⟦Du har ikke glemt mødet i morgen?⟧（用句中 ⟦vel⟧ 改写为委婉确认问句）→
    kind: write
    accept:
    - Du har vel ikke glemt mødet i morgen?
    explain: 主句中 ⟦vel⟧ 放在 ⟦ikke⟧ 前面，句末语调上扬
  - prompt: ⟦Hvordan går det med dit nye arbejde?⟧（插入 ⟦ellers⟧ 表示“除此之外最近如何”）→
    kind: write
    accept:
    - Hvordan går det ellers med dit nye arbejde?
    explain: 位于主语 ⟦det⟧ 之后表顺便关切
- id: B
  type: drill
  title: 练习 B：语境选词填空（从 lige, vel, bare, egentlig, ellers 中选填，注意第 6 题双空！）
  items:
  - prompt: Undskyld, kan jeg {{_}} låne din kuglepen et øjeblik?
    kind: cloze
    blanks:
    - - lige
    explain: “稍微借用一下”，降低打扰感
  - prompt: Du skal ikke bekymre dig om regningen — jeg skal {{_}} betale kaffen i dag!（表“尽管让我来就行”）
    kind: cloze
    blanks:
    - - bare
    explain: “放宽心，由我来付吧”
  - prompt: Det bliver {{_}} ikke regnvejr i eftermiddag, gør det?
    kind: cloze
    blanks:
    - - vel
    explain: 反意疑问句寻求安慰确认：“下午大概不会下雨吧？”
  - prompt: Jeg troede, at han boede i Odense, men han kommer {{_}} fra Esbjerg.
    kind: cloze
    blanks:
    - - egentlig
    explain: 点出事实背后的真实情况：“其实来自埃斯比约”
  - prompt: Lad os mødes klokken tre, og {{_}} kan vi altid ringes ved i aften.
    kind: cloze
    blanks:
    - - ellers
    explain: 提供替代方案：“要不然我们也可以晚上通电话”
  - prompt: Vil du {{_}} holde døren et sekund? Du behøver {{_}} ikke at vente på mig bagefter.
    kind: cloze
    blanks:
    - - lige
    - - bare
    explain: 第一空用 ⟦lige⟧ 请求顺手扶一下门；第二空用 ⟦bare⟧ 宽慰对方“你完全不用等我”
