- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 这座新文化中心已成为居民们的核心聚集点。
    answer: Det nye kulturhus er blevet et centralt samlingspunkt for beboerne.
  - zh: 根据多位专家的说法，这项方案将带来可观的开支。
    answer: Ifølge flere eksperter vil dette forslag medføre betydelige udgifter.
  - zh: 对这座老建筑的翻修促进了各代际之间的对话。
    answer: Renoveringen af den gamle bygning har fremmet dialogen mellem generationerne.
  - zh: 市议会下周将商讨地方图书馆的未来。
    answer: Byrådet skal drøfte det lokale biblioteks fremtid i næste uge.
  - zh: 多位市民指出，该街区缺乏面向年轻人的休闲活动项目。
    answer: Flere borgere påpeger, at kvarteret mangler fritidstilbud til de unge.
  - zh: 然而，大多数受访者认为这笔投资是值得的。
    answer: Imidlertid vurderer de fleste adspurgte, at investeringen er pengene værd.
- id: A
  type: drill
  title: 练习 A：语体升级手术——将下列口语采访句改写为紧凑的书面报道句（消除多余代词与口头禅，并按提示浓缩）
  items:
  - prompt: ⟦Det nye bibliotek, det ligger altså lige ved stationen.⟧（消除左移外置与 ⟦altså⟧）→
    kind: write
    accept:
    - Det nye bibliotek ligger tæt på stationen.
    explain: 删去多余复指代词 ⟦det⟧ 与口头禅 ⟦altså⟧
  - prompt: ⟦De unge i byen, de mangler jo ligesom et sted om aftenen.⟧（消除左移外置与填充词）→
    kind: write
    accept:
    - Byens unge mangler et samlingssted om aftenen.
    explain: 删去复指代词 ⟦de⟧ 以及 ⟦jo, ligesom⟧
  - prompt: ⟦Når man renoverer den gamle skole, så koster det mega mange penge.⟧（将从句名词化为 ⟦Renoveringen af...⟧，用 ⟦medføre betydelige udgifter⟧）→
    kind: write
    accept:
    - Renoveringen af den gamle skole medfører betydelige udgifter.
    explain: 将时间从句浓缩为名词短语作主语
  - prompt: ⟦Mange naboer siger, at støjen fra gaden er et ret vildt problem.⟧（用 ⟦Ifølge...⟧ 开头触发倒装，将 ⟦ret vildt⟧ 升级为 ⟦betydeligt⟧）→
    kind: write
    accept:
    - Ifølge mange naboer udgør støjen fra gaden et betydeligt problem.
    explain: ⟦Ifølge...⟧ 放句首触发动词倒装，⟦et betydeligt problem⟧ 取代口语词
  - prompt: ⟦Folk kommer hen og snakker sammen, fordi de gerne vil hjælpe hinanden.⟧（改用书面动词 ⟦drøfter⟧ 或名词 ⟦dialog⟧，并用关系从句连接）→
    kind: write
    accept:
    - Borgerne mødes for at styrke dialogen med andre, som ønsker at hjælpe hinanden.
    explain: 改用书面名词与关系从句衔接
  - prompt: ⟦Projektet var dyrt, men det har jo sådan set givet et godt resultat.⟧（删去口语词并用 ⟦imidlertid⟧ 替代或升级转折）→
    kind: write
    accept:
    - Projektet var dyrt, men har imidlertid givet et positivt resultat.
    explain: 删去口语填充词并用书面转折副词 ⟦imidlertid⟧
  open: true
