- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 我部分同意你的观点，但我们依然需要更多数据。
    answer: Jeg er delvist enig med dig, men vi har stadig brug for flere tal.
  - zh: 这项计划诚然很昂贵，然而尽管如此它却极具长远价值。
    answer: Ganske vist er denne plan meget dyr, men ikke desto mindre har den stor langsigtet værdi.
  - zh: 也许他说得没错，不过我认为我们还是应该等待。
    answer: Det kan godt være, at han har ret, men jeg synes stadig, vi bør vente.
  - zh: 尽管大家意见不合，团队还是保持着礼貌而务实的语气。
    answer: Selvom alle er uenige, bevarer teamet dog en høflig og saglig tone.
  - zh: 在数字化方案这个问题上，我与同事的看法并不一致。
    answer: Jeg er uenig med min kollega i dette spørgsmål om den digitale løsning.
  - zh: 尽管线上会议省时，它们却无法完全替代面对面的交流。
    answer: Selvom onlinemøder sparer tid, kan de ikke helt erstatte den fysiske samtale.
- id: A
  type: drill
  title: 练习 A：高阶让步反驳精准填空（每空填入唯一准确的 1 个丹麦语词）
  items:
  - prompt: '{{_}} vist er hjemmearbejde meget fleksibelt, men vi mister noget af den spontane sparring.'
    kind: cloze
    blanks:
    - - Ganske
    explain: 固定搭配：⟦Ganske vist...⟧“诚然……”
  - prompt: Forslaget lyder spændende, men ikke {{_}} mindre må vi først vurdere de samlede omkostninger.
    kind: cloze
    blanks:
    - - desto
    explain: 固定转折短语：⟦ikke desto mindre⟧“然而尽管如此”
  - prompt: Jeg er desværre uenig {{_}} min chef i, at alle møder nødvendigvis skal være fysiske.
    kind: cloze
    blanks:
    - - med
    explain: 表示“与某人意见不合”必须用介词 ⟦med⟧：⟦uenig med min chef⟧
  - prompt: Vi er kun delvist enige {{_}}, at den nye arbejdsform styrker trivslen for alle medarbejdere.
    kind: cloze
    blanks:
    - - i
    explain: 在具体观点或从句前表示赞同/不赞同，固定用介词 ⟦i⟧
  - prompt: Det kan godt {{_}}, at løsningen tager lidt tid at indføre, men den holder til gengæld længe.
    kind: cloze
    blanks:
    - - være
    explain: 委婉让步开篇句式：⟦Det kan godt være, at...⟧
  - prompt: '{{_}} mange foretrækker at arbejde hjemme om fredagen, mener ledelsen dog, at kontoret er vigtigt.'
    kind: cloze
    blanks:
    - - Selvom
    explain: 引导让步从句，注意后半主句不再加 ⟦men⟧，而用 ⟦dog⟧
  - prompt: Argumentet har en god pointe. Ikke desto mindre {{_}} planen stadig flere alvorlige svagheder. (rumme，现在时)
    kind: cloze
    blanks:
    - - rummer
    explain: ⟦Ikke desto mindre⟧ 放句首触发 V2 倒装，紧接现在时动词 ⟦rummer⟧
- id: B
  type: drill
  title: 练习 B：让步反驳句型升级与语病修正（按括号要求改写，或修正中/英式常见错误）
  items:
  - prompt: 用 ⟦Ganske vist..., men ikke desto mindre...⟧ 合并两句：⟦Kaffemaskinen er dyr. Den skaber et bedre arbejdsmiljø.⟧ →
    kind: write
    accept:
    - Ganske vist er kaffemaskinen dyr, men ikke desto mindre skaber den et bedre arbejdsmiljø.
    explain: 注意两处 V2 倒装：⟦er kaffemaskinen⟧ 与 ⟦skaber den⟧
  - prompt: 消除“虽然……但是”叠加病句：⟦Selvom projektet kræver mange timer, men jeg synes, vi bør gennemføre det.⟧ →
    kind: write
    accept:
    - Selvom projektet kræver mange timer, synes jeg dog, at vi bør gennemføre det.
    explain: 删掉多余的 ⟦men⟧，用倒装及句中 ⟦dog⟧ 或 ⟦alligevel⟧ 呼应
  - prompt: 用 ⟦Det kan godt være, at..., men...⟧ 礼貌反驳下方生硬句子：⟦Din idé er dårlig, for den koster alt for meget.⟧（先承认“这主意有创意”）→
    kind: write
    accept:
    - Det kan godt være, at din idé er kreativ, men den koster desværre alt for meget.
    explain: 先肯定对方创意，再委婉提出费用问题
  - prompt: 修正句首逗号与倒装错误：⟦Ganske vist, planen har sine fordele. Ikke desto mindre, vi bør vente med beslutningen.⟧ →
    kind: write
    accept:
    - Ganske vist har planen sine fordele. Ikke desto mindre bør vi vente med beslutningen.
    explain: 去掉英语式逗号，并保证句首副词后立刻接变位动词
  - prompt: 修正从句语序与介词搭配：⟦Jeg er uenig på dig om, at man kan ikke arbejde effektivt hjemmefra.⟧ →
    kind: write
    accept:
    - Jeg er uenig med dig i, at man ikke kan arbejde effektivt hjemmefra.
    explain: 修正介词 ⟦med / i⟧，并将从句内的 ⟦ikke⟧ 移到 ⟦kan⟧ 前面
  - prompt: 用 ⟦Jeg er kun delvist enig i, at...⟧ 温和改写：⟦Jeg er helt uenig med, at onlinemøder altid er spild af tid.⟧ →
    kind: write
    accept:
    - Jeg er kun delvist enig i, at onlinemøder altid er spild af tid.
    explain: 用温和的部分同意替代全盘否定，并把 ⟦med⟧ 改为 ⟦i⟧
  open: true
