- id: B
  type: drill
  title: 练习 B：习语语境改写与搭配修正（用括号内指定的习语升级平淡句，或修正冻结形态错误）
  items:
  - prompt: 用 ⟦smøge ærmerne op⟧ 改写：⟦Nu må vi begynde at arbejde rigtig hårdt for at blive færdige til tiden.⟧ →
    kind: write
    accept:
    - Nu må vi smøge ærmerne op for at blive færdige til tiden.
    explain: 生动替代泛泛的“努力工作”
  - prompt: 用 ⟦gå som katten om den varme grød⟧ 改写：⟦Han talte hele tiden udenom og nævnte slet ikke det svære emne.⟧ →
    kind: write
    accept:
    - Han gik som katten om den varme grød og nævnte slet ikke det svære emne.
    explain: 注意动词 ⟦gå⟧ 随过去时变为 ⟦gik⟧
  - prompt: 修正习语里的名词词尾错误：⟦Jeg følte, at jeg talte for døve ører, da ingen lyttede til mit forslag.⟧ →
    kind: write
    accept:
    - Jeg følte, at jeg talte for døve øren, da ingen lyttede til mit forslag.
    explain: 必须保留冻结的古复数 ⟦øren⟧
  - prompt: 修正冠词与定指冻结错误：⟦Vi vil ikke købe en kat i sæk, så vi tjekker bilen grundigt først.⟧ →
    kind: write
    accept:
    - Vi vil ikke købe katten i sækken, så vi tjekker bilen grundigt først.
    explain: 两个名词都必须保留定指形式 ⟦katten⟧ 和 ⟦sækken⟧
  - prompt: 用 ⟦et tveægget sværd⟧ 改写：⟦Kunstig intelligens har både store fordele og alvorlige risici for skolerne.⟧ →
    kind: write
    accept:
    - Kunstig intelligens er et tveægget sværd for skolerne.
    explain: 用比喻浓缩“既有利又有弊”
  - prompt: 用 ⟦tage tyren ved hornene⟧ 改写：⟦I morgen tør jeg endelig håndtere det svære problem direkte.⟧ →
    kind: write
    accept:
    - I morgen tager jeg endelig tyren ved hornene.
    explain: 注意句首时间状语触发主句 V2 倒装 ⟦tager jeg⟧
