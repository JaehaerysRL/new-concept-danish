- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 支持者强调，免费助学金使所有年轻人都能安心学习。
    answer: Tilhængere fremhæver, at gratis SU gør det muligt for alle unge at studere i ro.
  - zh: 然而反对者反驳说，这项制度对纳税人来说花费太高。
    answer: Modstandere indvender derimod, at denne ordning koster skatteyderne for mange penge.
  - zh: 批评者主张废除硕士助学金，转而提供免息助学贷款。
    answer: Kritikere argumenterer for at afskaffe kandidat-SU og i stedet tilbyde et rentefrit studielån.
  - zh: 一些人把 SU 视为一种投资，而另一些人却将其视为昂贵的福利派送。
    answer: Nogle betragter SU som en investering, mens andre derimod ser den som en dyr gavebod.
  - zh: 相比之下，支持者指出社会流动性在丹麦起着重要作用。
    answer: Fortalere peger derimod på, at social mobilitet spiller en vigtig rolle i Danmark.
