  - prompt: 从句语序纠错：⟦Kritikere peger på, at man bør ikke give SU til studerende, hvorimod nogle mener derimod, at støtten er nødvendig.⟧（修正两处语序与用词错误）→
    kind: write
    accept:
    - Kritikere peger på, at man ikke bør give SU til studerende, mens nogle derimod mener, at støtten er nødvendig.
    explain: 修正两点：172 从句内 ⟦ikke⟧ 放在情态动词 ⟦bør⟧ 前；173 ⟦hvorimod⟧ 与 ⟦derimod⟧ 语义重复且从句不倒装，改为 ⟦mens... derimod mener⟧
