- id: B
  type: drill
  title: 练习 B：句型升级与纠错（将真实经历转为过去非真实假设，或改用无 hvis 倒装及纠错）
  items:
  - prompt: 将真实过去事实改为过去虚拟句：⟦Vi ændrede ikke mødekulturen. Derfor nåede vi ikke opgaverne.⟧（用 ⟦Hvis vi havde...⟧ 改写）→
    kind: write
    accept:
    - Hvis vi havde ændret mødekulturen, ville vi have nået opgaverne.
    explain: 将过去未做的事情反推为虚拟条件
  - prompt: 省略 ⟦hvis⟧ 改写为高阶倒装：⟦Hvis kommunen havde planlagt vagterne bedre, ville personalet have været gladere.⟧ →
    kind: write
    accept:
    - Havde kommunen planlagt vagterne bedre, ville personalet have været gladere.
    explain: 省略 ⟦hvis⟧，双倒装
  - prompt: 英语污染纠错：⟦Hvis jeg ville have vidst det i går, havde jeg ikke taget overarbejde.⟧ →
    kind: write
    accept:
    - Hvis jeg havde vidst det i går, ville jeg ikke have taget overarbejde.
    prefill: Hvis jeg ville have vidst det i går, havde jeg ikke taget overarbejde.
    explain: ⟦hvis⟧ 从句严禁用 ⟦ville⟧！
  - prompt: 助动词与语序纠错：⟦Hvis forsøget ikke havde blevet en succes, ville ledelsen aldrig have fortsat.⟧（注意 ⟦blive⟧ 搭配的助动词！）→
    kind: write
    accept:
    - Hvis forsøget ikke var blevet en succes, ville ledelsen aldrig have fortsat.
    explain: ⟦blive⟧ 必须用 ⟦var blevet⟧，不能用 ⟦havde blevet⟧
  - prompt: 用情态虚拟 ⟦kunne have⟧ 改写：⟦Uden ekstra personale var det umuligt for os at dække alle nattevagter i fjor.⟧ → ⟦Uden ekstra personale...⟧
    kind: write
    accept:
    - Uden ekstra personale kunne vi ikke have dækket alle nattevagter i fjor.
