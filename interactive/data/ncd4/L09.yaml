  title: 练习 B：句型连接与纠错（合并因果两句，或修正语序与介词错误）
  items:
  - prompt: 用 ⟦Som følge heraf⟧ 放句首合并（注意 V2 倒装）：⟦Lønmodtagere får mindre lyst til overarbejde. Virksomhederne mangler specialister.⟧ →
    kind: write
    accept:
    - Lønmodtagere får mindre lyst til overarbejde. Som følge heraf mangler virksomhederne specialister.
    explain: 句首因果副词触发 V2 倒装
  - prompt: 用 ⟦, hvorved⟧ 合并（注意从句语序）：⟦Staten beskatter de højeste indkomster ekstra. Uligheden vokser ikke så hurtigt.⟧ →
    kind: write
    accept:
    - Staten beskatter de højeste indkomster ekstra, hvorved uligheden ikke vokser så hurtigt.
    explain: ⟦hvorved⟧ 从句内部 ⟦ikke⟧ 放在动词前，不倒装
  - prompt: 介词与副词区分纠错：⟦Som følge heraf det høje skattetryk vælger nogle at flytte til udlandet.⟧ →
    kind: write
    accept:
    - Som følge af det høje skattetryk vælger nogle at flytte til udlandet.
    prefill: Som følge heraf det høje skattetryk vælger nogle at flytte til udlandet.
    explain: 接名词短语必须用 ⟦Som følge af⟧，不能用 ⟦heraf⟧
  - prompt: 从句倒装纠错：⟦Grænsen for topskat blev flyttet op, hvorved kunne flere sygeplejersker beholde hele lønstigningen.⟧ →
    kind: write
    accept:
    - Grænsen for topskat blev flyttet op, hvorved flere sygeplejersker kunne beholde hele lønstigningen.
    prefill: Grænsen for topskat blev flyttet op, hvorved kunne flere sygeplejersker beholde hele lønstigningen.
    explain: 去掉从句里的错误倒装
  - prompt: 用 ⟦Af den grund⟧ 置于句首合并两句（注意删掉英语式逗号并倒装）：⟦De ekstra penge går til hospitaler og skoler. Mange danskere betaler deres skat med glæde.⟧ →
    kind: write
    accept:
    - De ekstra penge går til hospitaler og skoler. Af den grund betaler mange danskere deres skat med glæde.
    explain: 句首无逗号且必须 V2 倒装
