- id: B
  type: drill
  title: 练习 B：语体升级与搭配修正（修正英语直译与冠词/介词错误，或按要求升级句子）
  items:
  - prompt: 修正万能动词与介词错误：⟦Skolen laver høje krav på eleverne om godt dansk.⟧ →
    kind: write
    accept:
    - Skolen stiller høje krav til eleverne om godt dansk.
    explain: 用动词 ⟦stille⟧ 替代误用的 ⟦lave⟧，对象用介词 ⟦til⟧
  - prompt: 修正多余冠词与介词错误：⟦Byrådet skal tage en stilling om det nye integrationsprojekt i næste uge.⟧ →
    kind: write
    accept:
    - Byrådet skal tage stilling til det nye integrationsprojekt i næste uge.
    explain: 去掉多余冠词 ⟦en⟧，介词改用 ⟦til⟧
  - prompt: 修正搭配名词冠词与动词错误：⟦Diskussionen har et præg af mistillid mellem grupperne.⟧ →
    kind: write
    accept:
    - Diskussionen bærer præg af mistillid mellem grupperne.
    explain: 使用固定搭配 ⟦bære præg af⟧，不加冠词 ⟦et⟧
  - prompt: 修正介词搭配错误：⟦Sportsklubber spiller en central rolle på børnenes trivsel i kvarteret.⟧ →
    kind: write
    accept:
    - Sportsklubber spiller en central rolle for børnenes trivsel i kvarteret.
    explain: 介词须用 ⟦for⟧ 或 ⟦i⟧，不能误用 ⟦på⟧
  - prompt: 动宾搭配接从句升级（用 ⟦stille krav om, at...⟧ 合并）：⟦Staten siger, at man skal lære dansk hurtigt.⟧ →
    kind: write
    accept:
    - Staten stiller krav om, at man lærer dansk hurtigt.
    explain: 利用介词 ⟦om⟧ 连接 ⟦at⟧ 从句
  - prompt: 动宾搭配接从句升级（用 ⟦tage stilling til, hvordan...⟧ 改写）：⟦Virksomhederne må tænke over, hvordan de ansætter flere udlændinge.⟧ →
    kind: write
    accept:
    - Virksomhederne må tage stilling til, hvordan de ansætter flere udlændinge.
    explain: 利用介词 ⟦til⟧ 连接疑问词从句
  open: true
