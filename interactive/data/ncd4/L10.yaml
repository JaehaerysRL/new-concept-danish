- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 语言和工作对成功融入起着决定性作用。
    answer: Sprog og arbejde spiller en afgørende rolle for en vellykket integration.
  - zh: 政府应当对地方机构提出更加明确的要求。
    answer: Regeringen bør stille tydeligere krav til de lokale institutioner.
  - zh: 社会共同体必须决定如何帮助新邻居建立社交网络。
    answer: Fællesskabet skal tage stilling til, hvordan vi hjælper nye naboer med et netværk.
  - zh: 遗憾的是，关于融入的辩论往往带有强烈的偏见色彩。
    answer: Debatten om integration bærer desværre ofte præg af stærke fordomme.
  - zh: 每位公民都可以通过志愿工作为社区作出贡献。
    answer: Enhver borger kan bidrage til lokalsamfundet gennem frivilligt arbejde.
  - zh: 我们既要享有权利，也应当为自己的生活承担责任。
    answer: Vi skal både have rettigheder og tage ansvar for vores eget liv.
