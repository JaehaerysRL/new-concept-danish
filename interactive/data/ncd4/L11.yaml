- id: B
  type: drill
  title: 练习 B：句型浓缩手术（将下列口语化的 når / hvis / efter at / at 从句改写为正式名词短语，注意 V2 倒装）
  items:
  - prompt: ⟦Når man anvender digitale hjælpemidler, bliver lektierne mere overskuelige.⟧ → ⟦Ved...⟧
    kind: write
    accept:
    - Ved anvendelse af digitale hjælpemidler bliver lektierne mere overskuelige.
    explain: 介词短语放句首，主句维持 V2 倒装 ⟦bliver lektierne⟧
  - prompt: ⟦Efter at skolerne har indført nye regler, er der mindre snyd til prøverne.⟧ → ⟦Efter...⟧
    kind: write
    accept:
    - Efter indførelsen af nye regler er der mindre snyd til prøverne.
    explain: 将整个时间从句浓缩为 ⟦Efter + 名词化 + af⟧
  - prompt: ⟦Når læreren vurderer opgaven, lægger hun vægt på elevens egne ideer.⟧ → ⟦Ved lærerens...⟧
    kind: write
    accept:
    - Ved lærerens vurdering af opgaven lægger hun vægt på elevens egne ideer.
    explain: 保留原主语时使用所有格 ⟦lærerens⟧
  - prompt: ⟦Mens eleverne udarbejder projektet, må de gerne søge inspiration på nettet.⟧ → ⟦Under...⟧
    kind: write
    accept:
    - Under udarbejdelsen af projektet må eleverne gerne søge inspiration på nettet.
    explain: ⟦mens man udarbejder⟧ 浓缩为 ⟦Under udarbejdelsen af⟧
  - prompt: ⟦At man forbyder AI fuldstændigt, løser ikke problemet på lang sigt.⟧ → ⟦Et totalt forbud mod...⟧
    kind: write
    accept:
    - Et totalt forbud mod AI løser ikke problemet på lang sigt.
    explain: 把 ⟦At man forbyder...⟧ 转为干净利落的名词短语作主语
  - prompt: ⟦Hvis man kombinerer skriftligt arbejde med en mundtlig samtale, kan man teste elevens viden bedre.⟧ → ⟦Ved en kombination af...⟧
    kind: write
    accept:
    - Ved en kombination af skriftligt arbejde og en mundtlig samtale kan man teste elevens viden bedre.
    explain: 双名词并用
  open: true
