- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 通过使用人工智能力量，学生能获得快速的帮助。（用 Ved anvendelse af...）
    answer: Ved anvendelse af kunstig intelligens kan elever få hurtig hjælp.
  - zh: 在新规则引入之后，考试变得更加公平了。（用 Efter indførelsen af...）
    answer: Efter indførelsen af de nye regler er eksamen blevet mere retfærdig.
  - zh: 公正地评估书面作业对老师来说非常重要。（用 En retfærdig vurdering af...）
    answer: En retfærdig vurdering af skriftlige opgaver er meget vigtig for læreren.
  - zh: 人工智能的快速发展对丹麦学校提出了新的要求。
    answer: Den hurtige udvikling af kunstig intelligens stiller nye krav til danske skoler.
  - zh: 全面禁止新工具无法取代对批判性思考的训练。（用 Et forbud...）
    answer: Et totalt forbud mod nye værktøjer kan ikke erstatte træning i kritisk tænkning.
  - zh: 在准备演讲期间，学生应当理解所有重要概念。（用 Under forberedelsen af...）
    answer: Under forberedelsen af fremlæggelsen bør eleverne forstå alle vigtige begreber.
