- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 除非成年人设定清晰的边界，否则孩子会花太多时间在屏幕上。
    answer: Børn bruger for meget tid på skærme, medmindre voksne sætter tydelige rammer.
  - zh: 只要大家按时熄灯，手机就可以放在客厅里。
    answer: Telefonerne må ligge i stuen, forudsat at alle slukker lyset til tiden.
  - zh: 倘若学校推行无手机政策，课间气氛就会变得更安静。
    answer: Såfremt skolen indfører en mobilfri politik, bliver stemningen i frikvartererne mere rolig.
  - zh: 社交媒体只有在补充现实友谊的限度内才是有益的。
    answer: Sociale medier er kun gavnlige, i det omfang de supplerer virkelige venskaber.
  - zh: 前提是孩子没有忘记睡觉，适度玩游戏并非问题。（用 Forudsat at...）
    answer: Forudsat at barnet ikke glemmer at sove, er lidt spil ikke noget problem.
  - zh: 除非所有家长都支持这项规定，否则很难执行它。
    answer: Det er svært at håndhæve reglen, medmindre alle forældre bakker op om den.
- id: A
  type: drill
  title: 练习 A：语境逻辑选填（从 medmindre, forudsat at, såfremt, i det omfang, ikke 中选择最恰当的词填空）
  items:
  - prompt: Skærme i skolen kan være et godt værktøj, {{_}} de bruges til faglige opgaver og ikke til spil.
    kind: cloze
    blanks:
    - - forudsat at
    explain: 设定积极前提：只要用于学科任务而非游戏
  - prompt: Børn under 13 år bør ikke oprette profiler på sociale medier, {{_}} forældrene giver en udtrykkelig tilladelse.
    kind: cloze
    blanks:
    - - medmindre
    explain: 除非家长明确许可
  - prompt: '{{_}} kommunen ønsker bedre trivsel i klasserne, må den støtte fælles fritidstilbud efter skole.'
    kind: cloze
    blanks:
    - - Såfremt
    explain: 市政政策层面的正式条件“倘若”
  - prompt: Mobiler kan være tilladt i pausen, {{_}} eleverne {{_}} filmer hinanden uden samtykke.
    kind: cloze
    blanks:
    - - forudsat at
    - - ikke
    explain: 条件从句内否定词 ⟦ikke⟧ 必须置于动词 ⟦filmer⟧ 之前
  - prompt: Ingen aftale om skærmtid virker i praksis, {{_}} de voksne selv lægger telefonen væk ved middagsbordet.
    kind: cloze
    blanks:
    - - medmindre
    explain: 除非成年人自己也放下手机
  - prompt: '{{_}} sociale medier styrker eksisterende venskaber, kan de spille en positiv rolle for unge.'
    kind: cloze
    blanks:
    - - I det omfang
    explain: 从程度与限度上界定：在能增进既有友谊的限度内
  - prompt: Eleverne må bruge tablets i gruppearbejdet, {{_}} læreren har godkendt appen på forhånd.
    kind: cloze
    blanks:
    - - forudsat at
    explain: 前提是老师已提前批准该应用
  - prompt: '{{_}} nye regler træder i kraft efter sommerferien, skal alle familier informeres i god tid.'
    kind: cloze
    blanks:
    - - Såfremt
    explain: 正式书面/规章场景：倘若新规在暑假后生效
- id: B
  type: drill
  title: 练习 B：句型升级与纠错手术（按括号要求改写条件句或修正语法错误，注意从句语序与主句 V2 倒装）
  items:
  - prompt: 用 ⟦medmindre⟧ 改写：⟦Et forbud hjælper ikke, hvis techfirmaerne ikke ændrer deres algoritmer.⟧ →
    kind: write
    accept:
    - Et forbud hjælper ikke, medmindre techfirmaerne ændrer deres algoritmer.
    explain: 去掉冗余的 ⟦ikke⟧，用 ⟦medmindre⟧ 表达“除非”
  - prompt: 用 ⟦forudsat at⟧ 置句首合并（注意倒装）：⟦Børn sover nok om natten. Så påvirker skærmtid ikke deres energi i skolen.⟧ →
    kind: write
    accept:
    - Forudsat at børn sover nok om natten, påvirker skærmtid ikke deres energi i skolen.
    explain: 从句置首，主句动词 ⟦påvirker⟧ 紧跟逗号之后形成 V2 倒装
  - prompt: 升级为正式书面语 ⟦såfremt⟧（放句首）：⟦Hvis alle forældre i klassen bliver enige, kan vi vente med smartphones til 6. klasse.⟧ →
    kind: write
    accept:
    - Såfremt alle forældre i klassen bliver enige, kan vi vente med smartphones til 6. klasse.
    explain: 正式连词替代 ⟦hvis⟧
  - prompt: 用 ⟦i det omfang⟧ 精准限定范围：⟦Digitale medier er nyttige, men kun så længe de støtter børns kreativitet.⟧ →
    kind: write
    accept:
    - Digitale medier er nyttige, i det omfang de støtter børns kreativitet.
    explain: 精准体现“在……限度内”
  - prompt: 纠错改写（双重否定错误）：⟦Familien ser ikke film sammen, medmindre alle ikke har tid om aftenen.⟧ →
    kind: write
    accept:
    - Familien ser ikke film sammen, medmindre alle har tid om aftenen.
    prefill: Familien ser ikke film sammen, medmindre alle ikke har tid om aftenen.
    explain: 删去从句中多余的 ⟦ikke⟧，消除双重否定错误
  - prompt: 纠错改写（句首条件从句后缺 V2 倒装及 ⟦ikke⟧ 位置错误）：⟦Forudsat at forældrene snakker ikke i telefon ved bordet, børnene lærer hurtigt gode vaner.⟧ →
    kind: write
    accept:
    - Forudsat at forældrene ikke snakker i telefon ved bordet, lærer børnene hurtigt gode vaner.
    explain: 从句中 ⟦ikke⟧ 放在动词前，主句执行 V2 倒装 ⟦lærer børnene⟧
  open: true
