- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 社会必须在安全感与个人隐私之间进行权衡。（用 afveje... over for）
    answer: Samfundet skal afveje tryghed over for det personlige privatliv.
  - zh: 更多的监控绝不能以牺牲基本自由为代价。（用 ske på bekostning af）
    answer: Mere overvågning må aldrig ske på bekostning af den grundlæggende frihed.
  - zh: 我们绝不能在公民的数据保护上作出妥协。（用 gå på kompromis med）
    answer: Vi må aldrig gå på kompromis med databeskyttelsen for borgerne.
  - zh: 对一些人来说，夜间车站上的安全感分量更重。（用 veje tungere）
    answer: For nogle mennesker vejer trygheden på mørke stationer tungere om aftenen.
  - zh: 问题是，这些优势是否真的抵得过对隐私的干预。（用 opveje）
    answer: Spørgsmålet er, om fordelene virkelig opvejer indgrebet i privatlivet.
  - zh: 在公共空间里，清晰的数据保留边界是必要的。
    answer: I det offentlige rum er klare grænser for opbevaring af data nødvendige.
