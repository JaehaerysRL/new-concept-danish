- id: B
  type: drill
  title: 练习 B：句型重构手术（用本课指定的价值权衡句型，将下列简单对立句升级为成熟思辨句）
  items:
  - prompt: 用 ⟦afveje A over for B⟧ 改写：⟦Samfundet skal både tænke på tryghed og på privatliv.⟧ →
    kind: write
    accept:
    - Samfundet er nødt til at afveje hensynet til tryghed over for hensynet til privatliv.
    explain: 用 ⟦afveje... over for⟧ 替换简单并列
  - prompt: 用 ⟦ske på bekostning af⟧ 改写：⟦Vi vil have mere sikkerhed, men det må ikke ødelægge vores frihed.⟧ →
    kind: write
    accept:
    - Ønsket om mere sikkerhed må ikke ske på bekostning af vores frihed.
    explain: 以“以牺牲……为代价”整合对比两句
  - prompt: 用 ⟦gå på kompromis med⟧ 改写：⟦Staten må ikke acceptere lavere standarder for borgernes retssikkerhed.⟧ →
    kind: write
    accept:
    - Staten må aldrig gå på kompromis med borgernes retssikkerhed.
  - prompt: 用 ⟦veje tungere end⟧ 改写：⟦For kritikere er privatlivet vigtigere end muligheden for at fange flere tyve.⟧ →
    kind: write
    accept:
    - For kritikere vejer privatlivet tungere end muligheden for at fange flere tyve.
  - prompt: 合并让步与底线（⟦Selvom..., må... ikke ske på bekostning af...⟧）：⟦Kameraer hjælper med opklaringen. De må ikke fjerne tilliden i samfundet.⟧ →
    kind: write
    accept:
    - Selvom kameraer hjælper med opklaringen, må overvågning ikke ske på bekostning af tilliden i samfundet.
    explain: 从句置首后主句维持 V2 倒装 ⟦må overvågning⟧
  - prompt: 纠错改写（两处介词错误）：⟦Vi bør afveje tryghed med privatliv og ikke gå på kompromis om friheden.⟧ →
    kind: write
    accept:
    - Vi bør afveje tryghed over for privatliv og ikke gå på kompromis med friheden.
    explain: 修正 ⟦*med⟧ 为 ⟦over for⟧，修正 ⟦*om⟧ 为 ⟦med⟧
