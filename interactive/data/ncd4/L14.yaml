- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 人们丢弃了太多仍然可以修理的电子产品。
    answer: Man kasserer alt for mange elektroniske varer, som stadig kan repareres.
  - zh: 这项由政府通过的新法律要求生产商提供备件。
    answer: Den nye lov, som regeringen har vedtaget, kræver reservedele fra producenterne.
  - zh: 在许多丹麦城市，志愿者们正在赋予旧物品新的生命。
    answer: I mange danske byer giver frivillige nu gamle ting nyt liv.
  - zh: 有时候维修旧设备甚至比买一台新机器更便宜。
    answer: Nogle gange er det endda billigere at reparere et gammelt apparat end at købe nyt.
  - zh: 延长产品的寿命对地球的资源非常重要。
    answer: At forlænge produkters levetid er meget vigtigt for jordens ressourcer.
  - zh: 迅速增长的电子垃圾量是一个常被忽视的问题。
    answer: Den hurtigt voksende mængde elektronikaffald er et ofte overset problem.
