- id: B
  type: drill
  title: 练习 B：语体“拆弹”与互转手术（1–4 题将正式前置长定语改写为自然的 som/der 关系从句；5–6 题修正病句或逆向压缩）
  items:
  - prompt: 拆解为自然从句：⟦Den af EU vedtagne lovgivning skal beskytte miljøet.⟧ →
    kind: write
    accept:
    - Den lovgivning, som EU har vedtaget, skal beskytte miljøet.
    explain: 将前置被动短语还原为日常自然的 ⟦som⟧ 关系从句
  - prompt: 拆解为自然从句：⟦De af forbrugerne kasserede telefoner indeholder værdifulde materialer.⟧ →
    kind: write
    accept:
    - De telefoner, som forbrugerne har kasseret, indeholder værdifulde materialer.
    explain: ⟦af forbrugerne⟧ 还原为关系从句主语
  - prompt: 拆解为自然从句：⟦Det af reklamerne skabte forbrugspres påvirker især unge.⟧ →
    kind: write
    accept:
    - Det forbrugspres, som reklamerne har skabt, påvirker især unge.
  - prompt: 拆解为自然从句：⟦Den hurtigt voksende genbrugsbevægelse ændrer vores indkøbsvaner.⟧ →
    kind: write
    accept:
    - Den genbrugsbevægelse, der vokser hurtigt, ændrer vores indkøbsvaner.
    explain: 现在分词拆解为主动进行式关系从句
  - prompt: 纠错改写（分词未变位与语序错误）：⟦Den af regeringen fremlagt plan skal skabe flere grønne arbejdspladser.⟧ →
    kind: write
    accept:
    - Den af regeringen fremlagte plan skal skabe flere grønne arbejdspladser.
    explain: 定指结构 ⟦Den... plan⟧ 后，分词必须加 ⟦-e⟧ 变为 ⟦fremlagte⟧
  - prompt: 压缩为书面长定语：⟦De regler, som kommunen har vedtaget, træder i kraft til januar.⟧ →
    kind: write
    accept:
    - De af kommunen vedtagne regler træder i kraft til januar.
    explain: 将关系从句压缩为正式书面前置长定语
  open: true
