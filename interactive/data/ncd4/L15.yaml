- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 我们应当始终对网上来历不明的说法提出质疑。（用 sætte spørgsmålstegn ved）
    answer: Vi bør altid sætte spørgsmålstegn ved anonyme påstande på nettet.
  - zh: 年轻人需要学会对社交媒体上的新闻保持批判态度。（用 forholde sig kritisk til）
    answer: Unge skal lære at forholde sig kritisk til nyheder på sociale medier.
  - zh: 独立的报道有助于让公共讨论变得更有层次。（用 nuancere debatten）
    answer: Uafhængig journalistik hjælper med at nuancere den offentlige debat.
  - zh: 在核查信源之前，绝不能轻信耸人听闻的标题。（用 tage... for gode varer）
    answer: Man må aldrig tage dramatiske overskrifter for gode varer før kildekritik.
  - zh: 算法往往会强化我们自己的偏见，并制造信息茧房。
    answer: Algoritmer bekræfter ofte vores egne fordomme og skaber lukkede ekkokamre.
  - zh: 学会区分事实与个人观点是现代公民的重要能力。
    answer: At skille fakta fra personlige holdninger er en vigtig evne for borgere.
- id: A
  type: drill
  title: 练习 A：介词与批判性思维核心词选填（从 ved, til, sig, fra, for, nuancere, fordomme, efterprøve 中选出最恰当的词）
  items:
  - prompt: Læserne bør altid sætte spørgsmålstegn {{_}} anonyme påstande på sociale medier.
    kind: cloze
    blanks:
    - - ved
    explain: 固定介词：⟦sætte spørgsmålstegn ved⟧
  - prompt: Som borger i et demokrati skal man lære at forholde {{_}} kritisk {{_}} nyhedsdækningen.
    kind: cloze
    blanks:
    - - sig
    - - til
    explain: 反身代词 ⟦sig⟧ 呼应泛指主语 ⟦man⟧，介词固定为 ⟦til⟧
  - prompt: En grundig baggrundsartikel kan være med til at {{_}} debatten om kunstig intelligens.
    kind: cloze
    blanks:
    - - nuancere
    explain: ⟦at nuancere debatten⟧ 使讨论更全面深入
  - prompt: Man må aldrig tage dramatiske overskrifter {{_}} gode varer uden at tjekke kilden.
    kind: cloze
    blanks:
    - - for
    explain: 习语：⟦tage noget for gode varer⟧ 轻信
  - prompt: Algoritmer viser os ofte historier, der blot bekræfter vores egne {{_}}.
    kind: cloze
    blanks:
    - - fordomme
    explain: 复数形式双写 ⟦m⟧：⟦egne fordomme⟧
  - prompt: Kildekritik handler blandt andet om at skille dokumenterede fakta {{_}} personlige holdninger.
    kind: cloze
    blanks:
    - - fra
    explain: 固定搭配：⟦skille A fra B⟧ 把 A 从 B 中区分开
  - prompt: Dygtige journalister bruger tid på at {{_}} oplysninger hos flere uafhængige kilder.
    kind: cloze
    blanks:
    - - efterprøve
    explain: ⟦at efterprøve oplysninger⟧ 核查核实信息
  - prompt: Jeg sætter spørgsmålstegn {{_}}, hvorvidt korte videoklip kan erstatte rigtige aviser.
    kind: cloze
    blanks:
    - - ved
    explain: 接 ⟦hvorvidt⟧ 从句前仍必须保留介词 ⟦ved⟧！
- id: B
  type: drill
  title: 练习 B：思辨表达升级手术（用本课批判性思维表达改写下列口语化简单句，或修正语法错误）
  items:
  - prompt: 用 ⟦sætte spørgsmålstegn ved, om...⟧ 升级：⟦Jeg tror ikke på, at denne video viser hele sandheden.⟧ →
    kind: write
    accept:
    - Jeg sætter spørgsmålstegn ved, om denne video viser hele sandheden.
    explain: 用 ⟦ved, om...⟧ 升级客观质疑
  - prompt: 用 ⟦forholde sig kritisk til⟧ 升级：⟦Unge bør ikke bare tro på alt, hvad de ser på deres feed.⟧ →
    kind: write
    accept:
    - Unge bør forholde sig kritisk til alt, hvad de ser på deres feed.
    explain: 准确使用反身代词 ⟦sig⟧ 与介词 ⟦til⟧
  - prompt: 用 ⟦nuancere debatten⟧ 升级：⟦Vi har brug for artikler, som viser både fordele og ulemper i diskussionen.⟧ →
    kind: write
    accept:
    - Vi har brug for artikler, som nuancerer debatten.
    explain: 用凝练动词 ⟦nuancere⟧ 替代松散描述
  - prompt: 用 ⟦tage noget for gode varer⟧ 改写：⟦Du må ikke acceptere en overskrift uden at tjekke den først.⟧ →
    kind: write
    accept:
    - Du må ikke tage en overskrift for gode varer uden at tjekke den først.
    explain: 地道习语替换
  - prompt: 纠错改写（漏了反身代词与介词错误）：⟦Mange borgere forholder kritisk om de hurtige nyheder i ekkokamre.⟧ →
    kind: write
    accept:
    - Mange borgere forholder sig kritisk til de hurtige nyheder i ekkokamre.
    explain: 补齐反身代词 ⟦sig⟧，并将错介词 ⟦om⟧ 改为 ⟦til⟧
  - prompt: 纠错改写（介词错误与误用 ⟦hvis⟧）：⟦Eksperten sætter spørgsmålstegn på, hvis algoritmer kan være helt neutrale.⟧ →
    kind: write
    accept:
    - Eksperten sætter spørgsmålstegn ved, hvorvidt algoritmer kan være helt neutrale.
    explain: 介词 ⟦ved⟧ + 表达“是否”必须用 ⟦hvorvidt⟧ 或 ⟦om⟧，不可用 ⟦hvis⟧
  open: true
