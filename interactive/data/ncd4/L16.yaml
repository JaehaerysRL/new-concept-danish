- id: B
  type: drill
  title: 练习 B：语体升级与病句改错（将单一武断句升级为严谨的多重归因句，或修正介词/语态错误）
  items:
  - prompt: 【纠错改写】⟦Problemet bliver skyldes for meget pres i skolen.⟧ →
    kind: write
    accept:
    - Problemet skyldes for meget pres i skolen.
    prefill: Problemet bliver skyldes for meget pres i skolen.
    explain: ⟦skyldes⟧ 本身已是被动含义，绝不可与 ⟦bliver⟧ 连用
  - prompt: 【纠错改写】⟦Hvad er den største årsag for den stigende stress blandt unge?⟧ →
    kind: write
    accept:
    - Hvad er den største årsag til den stigende stress blandt unge?
    prefill: Hvad er den største årsag for den stigende stress blandt unge?
    explain: 名词 ⟦årsag⟧ 后固定搭配介词 ⟦til⟧
  - prompt: 【纠错改写】⟦Forskerne siger, at søvnmangel hænger tæt sammen til sociale medier.⟧ →
    kind: write
    accept:
    - Forskerne siger, at søvnmangel hænger tæt sammen med sociale medier.
    prefill: Forskerne siger, at søvnmangel hænger tæt sammen til sociale medier.
    explain: 固定搭配是 ⟦hænge sammen med⟧，不能用 ⟦til⟧
  - prompt: 【升级改写】用 ⟦kan ikke forklares ud fra én enkelt årsag⟧ 升级：⟦Det er ikke kun én ting, der skaber krisen.⟧ →
    kind: write
    accept:
    - Krisen kan ikke forklares ud fra én enkelt årsag.
    explain: 用更紧凑凝练的被动归因短语取代松散分裂句
  - prompt: 【升级改写】用 ⟦en kombination af⟧ 合并两句：⟦Stressen kommer fra karakterpres. Den kommer også fra søvnmangel.⟧ → ⟦Stressen skyldes...⟧
    kind: write
    accept:
    - Stressen skyldes en kombination af karakterpres og søvnmangel.
    explain: 用 ⟦skyldes en kombination af A og B⟧ 合并多重原因
  - prompt: 【升级改写】用 ⟦kan i høj grad tilskrives⟧ 改写被动归因：⟦Perfektionskulturen forklarer en stor del af presset.⟧ → ⟦En stor del af presset...⟧
    kind: write
    accept:
    - En stor del af presset kan i høj grad tilskrives perfektionskulturen.
    explain: 利用被动归因凸显主体对象
