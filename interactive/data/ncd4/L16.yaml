    answer: Mange elevers stress skyldes en kombination af flere forskellige faktorer.
  - zh: 年轻人的不安全感在很大程度上可以归因于完美主义文化。
    answer: Unges usikkerhed kan i høj grad tilskrives en udbredt perfektionskultur.
  - zh: 两个现象同时出现并不意味着其中一个直接导致了另一个。
    answer: At to fænomener optræder samtidig, betyder ikke, at det ene forårsager det andet.
