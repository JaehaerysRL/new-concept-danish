- id: B
  type: drill
  title: 练习 B：语体升级与病句改错（修正英语直译动词、介词或语序错误，或按要求改写）
  items:
  - prompt: 【纠错改写】⟦De politiske partier lavede endelig et kompromis i går aftes.⟧ →
    kind: write
    accept:
    - De politiske partier opnåede endelig et kompromis i går aftes.
    prefill: De politiske partier lavede endelig et kompromis i går aftes.
    explain: 表示“达成妥协”须用 ⟦opnå⟧ 或 ⟦indgå⟧，忌用 ⟦*lave⟧
  - prompt: 【纠错改写】⟦Regeringen vil putte en ny afgift til alle virksomheder, der udleder meget CO2.⟧ →
    kind: write
    accept:
    - Regeringen vil pålægge alle virksomheder, der udleder meget CO2, en ny afgift.
    prefill: Regeringen vil putte en ny afgift til alle virksomheder, der udleder meget CO2.
    explain: 或用 ⟦en ny CO2-afgift⟧，固定动词为 ⟦pålægge [对象] [税费]⟧，不用 ⟦*putte... til⟧
  - prompt: 【纠错改写】⟦Forudsat at staten yder støtte, landmændene kan investere i nye maskiner.⟧ →
    kind: write
    accept:
    - Forudsat at staten yder støtte, kan landmændene investere i nye maskiner.
    prefill: Forudsat at staten yder støtte, landmændene kan investere i nye maskiner.
    explain: 前提从句置于句首时，主句必须发生 V2 倒装：⟦kan landmændene⟧
  - prompt: 【纠错改写】⟦Klimamålene bliver ikke nået, medmindre strammer politikerne lovgivningen.⟧ →
    kind: write
    accept:
    - Klimamålene bliver ikke nået, medmindre politikerne strammer lovgivningen.
    prefill: Klimamålene bliver ikke nået, medmindre strammer politikerne lovgivningen.
    explain: ⟦medmindre⟧ 引导从句，内部维持“主语 + 动词”不倒装语序
  - prompt: 【升级改写】用 ⟦bør⟧ + ⟦-s⟧ 被动改写为客观策论句：⟦Man skal stramme reglerne nu.⟧ → ⟦Lovgivningen...⟧
    kind: write
    accept:
    - Lovgivningen bør strammes nu.
    explain: 用情态动词 + ⟦-s⟧ 被动使策论表达更客观正式
  - prompt: 【升级改写】用 ⟦nå til enighed om⟧ 升级句子：⟦Alle partier sagde ja til den samme klimaplan.⟧ →
    kind: write
    accept:
    - Alle partier nåede til enighed om den samme klimaplan.
    explain: 使用政治高频搭配 ⟦nå til enighed om⟧
