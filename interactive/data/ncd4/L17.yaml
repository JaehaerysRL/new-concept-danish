- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 政府必须在不久的将来启动针对农业的具体举措。
    answer: Regeringen skal i den nærmeste fremtid iværksætte konkrete tiltag inden for landbruget.
  - zh: 环保组织要求议会进一步收紧现行的气候立法。
    answer: Miljøorganisationer kræver, at Folketinget strammer den nuværende klimalovgivning yderligere.
  - zh: 各政党经过漫长谈判后终于达成了一项广泛协议。
    answer: Partierne indgik endelig et bredt forlig efter lange forhandlinger.
  - zh: 只要国家提供经济支持，许多农民都愿意推进绿色转型。
    answer: Forudsat at staten yder økonomisk støtte, vil mange landmænd gerne omstille.
  - zh: 如果不设立公平的过渡期安排，我们很难达成妥协。
    answer: Vi kan næppe opnå et kompromis, medmindre vi skaber en fair overgangsordning.
  - zh: 对碳排放征税可能会影响部分乡村地区的就业岗位。（用 afgift）
    answer: En afgift på udledningen kan true visse arbejdspladser i landdistrikterne.
