- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 近年来，哥本哈根接待了越来越多的国际游客。
    answer: I de senere år har København modtaget stadig flere internationale turister.
  - zh: 一方面，旅游业显著提高了餐厅和博物馆的营业额。
    answer: På den ene side øger turismen omsætningen markant i restauranter og museer.
  - zh: 另一方面，大规模的短租挤压了市中心的住房市场。
    answer: På den anden side presser den omfattende korttidsudlejning boligmarkedet i centrum.
  - zh: 问题在于，这一发展究竟是一种福音还是一种负担。
    answer: Spørgsmålet er, om denne udvikling er en velsignelse eller en byrde.
  - zh: 市政府应当调控增长，而不是全面禁止游客。
    answer: Kommunen bør regulere væksten i stedet for at forbyde turister helt.
  - zh: 总而言之，我们必须兼顾经济增长与居民的生活质量。
    answer: Alt i alt skal vi afbalancere økonomisk vækst og beboernes livskvalitet.
