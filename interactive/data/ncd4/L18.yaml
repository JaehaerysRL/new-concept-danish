    - På den ene side skaber turismen mange arbejdspladser for unge i hovedstaden.
    prefill: På den ene side, turismen skaber mange arbejdspladser for unge i hovedstaden.
    explain: 去掉英语式逗号，且句首路标触发 V2 倒装：⟦skaber turismen⟧
  - prompt: 【纠错改写】⟦Den omfattende korttidsudlejning presser på boligmarkedet i centrum.⟧ →
    kind: write
    accept:
    - Den omfattende korttidsudlejning presser boligmarkedet i centrum.
    prefill: Den omfattende korttidsudlejning presser på boligmarkedet i centrum.
    explain: 动词 ⟦presse⟧ 直接接宾语，不用加介词 ⟦på⟧
  - prompt: 【纠错改写】⟦Alt i alt, byen har brug for en mere bæredygtig turisme i fremtiden.⟧ →
    kind: write
    accept:
    - Alt i alt har byen brug for en mere bæredygtig turisme i fremtiden.
    prefill: Alt i alt, byen har brug for en mere bæredygtig turisme i fremtiden.
    explain: 去掉逗号并实行 V2 倒装：⟦har byen⟧
  - prompt: 【纠错改写】⟦De mange krydstogtgæster slider meget byrummet i sommermånederne.⟧ →
    kind: write
    accept:
    - De mange krydstogtgæster slider meget på byrummet i sommermånederne.
    prefill: De mange krydstogtgæster slider meget byrummet i sommermånederne.
    explain: 动词 ⟦slide⟧ 表达“损耗某物”必须保留介词 ⟦på⟧
  - prompt: 【升级改写】用 ⟦ikke..., men i stedet...⟧ 合并为平衡建议句：⟦Politikerne skal ikke stoppe turismen. De skal kontrollere korttidsudlejning.⟧ →
    kind: write
    accept:
    - Politikerne bør ikke stoppe turismen, men i stedet regulere korttidsudlejningen.
    explain: 用 ⟦ikke..., men i stedet...⟧ 构建有分寸的替代方案
  - prompt: 【升级改写】用 ⟦Spørgsmålet er, om... en velsignelse eller en byrde⟧ 引出背景悬念：⟦Mange diskuterer, om turismen er god eller dårlig for København.⟧ →
    kind: write
    accept:
    - Spørgsmålet er, om turismen er en velsignelse eller en byrde for København.
    explain: 用双刃剑标准疑问句优雅开启论题
