- id: B
  type: drill
  title: 练习 B：语序纠错与四段式句型升级（修正路标语序或介词错误，或按提示改写）
  items:
  - prompt: 【纠错改写】⟦På den ene side, turismen skaber mange arbejdspladser for unge i hovedstaden.⟧ →
