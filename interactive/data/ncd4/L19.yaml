- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 毫无疑问的是，良好的英语能力对丹麦来说是一项优势。
    answer: Det står uden for enhver tvivl, at gode engelskkundskaber er en styrke for Danmark.
  - zh: 然而问题在于，这是否会在长期内削弱丹麦语专业术语。
    answer: Spørgsmålet er imidlertid, hvorvidt dette på længere sigt kan svække danske fagtermer.
  - zh: 这也引发了关于所有公民是否仍能参与讨论的问题。
    answer: Det rejser også spørgsmålet om, hvorvidt alle borgere fortsat kan deltage i debatten.
  - zh: 正是通过在工作中使用丹麦语，新同事才会感到归属感。
    answer: Det er netop ved at tale dansk på arbejdet, at nye kolleger føler sig hjemme.
  - zh: 再怎么强调语域流失对科研产生的影响也不为过。
    answer: Det kan ikke understreges nok, hvordan domænetab påvirker dansk forskning.
  - zh: 在丹麦大学里，越来越多专业完全使用英语授课。
    answer: På danske universiteter undervises stadig flere uddannelser udelukkende på engelsk.
- id: A
  type: drill
  title: 练习 A：设问推进与强调句关键结构填空（每空填入最准确的 1 个丹麦语词）
  items:
  - prompt: Det står {{_}} for enhver tvivl, at stærke engelskkundskaber gavner dansk erhvervsliv.
    kind: cloze
    blanks:
    - - uden
    explain: 固定强调表达：⟦Det står uden for enhver tvivl, at...⟧ 毫无疑问……
  - prompt: Spørgsmålet er {{_}}, hvorvidt dansk mister vigtige fagtermer på universiteterne.
    kind: cloze
    blanks:
    - - imidlertid
    explain: 设问推进句中的核心转折副词，位于系动词 ⟦er⟧ 之后
  - prompt: Det rejser spørgsmålet {{_}}, om alle borgere fortsat kan følge med i den offentlige debat.
    kind: cloze
    blanks:
    - - om
    explain: 固定搭配：⟦rejse spørgsmålet om, om / hvorvidt...⟧
  - prompt: Det er netop gennem det fælles sprog, {{_}} man opbygger dybere tillid mellem kolleger.
    kind: cloze
    blanks:
    - - at
    explain: 强调方式状语 ⟦gennem det fælles sprog⟧ 时，分裂句连接词须用 ⟦at⟧
  - prompt: Det er først og fremmest unge på sociale medier, {{_}} bruger mange engelske låneord.
    kind: cloze
    blanks:
    - - der
      - som
    explain: 强调主语 ⟦unge⟧ 时，关系代词可用 ⟦der⟧ 或 ⟦som⟧
  - prompt: Det kan ikke {{_}} nok, at sprog hænger uløseligt sammen med kultur.
    kind: cloze
    blanks:
    - - understreges
    explain: 强调句型：⟦Det kan ikke understreges nok, at...⟧ 再怎么强调也不为过
  - prompt: Mange forskere er i tvivl om, {{_}} engelsksprogede uddannelser på sigt skader dansk videnskab.
    kind: cloze
    blanks:
    - - hvorvidt
      - om
    explain: 表示“是否”，位于介词 ⟦om⟧ 之后，书面语首选 ⟦hvorvidt⟧
- id: B
  type: drill
  title: 练习 B：设问改写与强调句纠错手术（修正英语直译、分裂句连接词或语序错误，或按要求升级）
  items:
  - prompt: 【纠错改写】⟦Spørgsmålet er imidlertid, hvis dansk kan overleve som videnskabssprog.⟧ →
    kind: write
    accept:
    - Spørgsmålet er imidlertid, hvorvidt dansk kan overleve som videnskabssprog.
    prefill: Spørgsmålet er imidlertid, hvis dansk kan overleve som videnskabssprog.
    explain: 表示“是否”必须用 ⟦hvorvidt⟧ 或 ⟦om⟧，绝不能用条件连词 ⟦hvis⟧
  - prompt: 【纠错改写】⟦Det står udenfor enhver tvivl, at internationale studerende beriger universitetet.⟧ →
    kind: write
    accept:
    - Det står uden for enhver tvivl, at internationale studerende beriger universitetet.
    prefill: Det står udenfor enhver tvivl, at internationale studerende beriger universitetet.
    explain: 此处 ⟦uden for⟧ 后面接名词短语，必须拆开写成两个词
  - prompt: 【纠错改写】⟦Det er netop på arbejdspladsen, der man lærer de uskrevne kulturelle regler.⟧ →
    kind: write
    accept:
    - Det er netop på arbejdspladsen, at man lærer de uskrevne kulturelle regler.
    prefill: Det er netop på arbejdspladsen, der man lærer de uskrevne kulturelle regler.
    explain: 被强调的 ⟦på arbejdspladsen⟧ 是地点状语，连接词应用 ⟦at⟧ 而非 ⟦der⟧
  - prompt: 【纠错改写】⟦Spørgsmålet er, hvorvidt kan vi bevare både dansk og engelsk i undervisningen.⟧ →
    kind: write
    accept:
    - Spørgsmålet er, hvorvidt vi kan bevare både dansk og engelsk i undervisningen.
    prefill: Spørgsmålet er, hvorvidt kan vi bevare både dansk og engelsk i undervisningen.
    explain: ⟦hvorvidt⟧ 引导间接疑问从句，内部必须保持“主语 + 动词”不倒装语序
  - prompt: 【升级改写】用 ⟦Det står uden for enhver tvivl, at...⟧ 升级平淡句：⟦Det er helt sikkert, at engelsk er et vigtigt arbejdssprog.⟧ →
    kind: write
    accept:
    - Det står uden for enhver tvivl, at engelsk er et vigtigt arbejdssprog.
    explain: 用权威强调框架提升书面说服力
  - prompt: 【升级改写】用 ⟦Spørgsmålet er imidlertid, hvorvidt...⟧ 引出转折追问：⟦Men vi ved ikke, om koncernsproget skal være engelsk i alle møder.⟧ →
    kind: write
    accept:
    - Spørgsmålet er imidlertid, hvorvidt koncernsproget bør være engelsk i alle møder.
    explain: 用设问推进句优雅引导下文辩论
