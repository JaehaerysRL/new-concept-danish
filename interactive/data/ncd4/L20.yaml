- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 尽管该项目花费巨大，但从长远来看仍然值得投资。
    answer: Ganske vist koster projektet meget, men ikke desto mindre er det værd at investere.
  - zh: 然而问题在于，免费的公交车票是否能真正吸引驾车者。
    answer: Spørgsmålet er imidlertid, hvorvidt gratis busbilletter virkelig kan tiltrække bilister.
  - zh: 毫无疑问的是，我们必须在环境保护和财政预算之间做出权衡。
    answer: Det står uden for enhver tvivl, at vi skal afveje miljø og økonomi.
  - zh: 除非同时增加发车班次，否则许多通勤者依然会选择开车。
    answer: Mange pendlere vælger stadig bilen, medmindre antallet af afgange samtidig øges.
  - zh: 城市中心车流减少，从而使空气质量和安全感都得到提升。
    answer: Trafikken i centrum falder, hvorved både luftkvaliteten og trygheden bliver bedre.
  - zh: 只要各党派能达成广泛协议，这座城市就能实现更绿色的未来。
    answer: Forudsat at partierne indgår et bredt forlig, kan byen sikre en grønnere fremtid.
