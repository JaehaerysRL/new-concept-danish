- id: B
  type: drill
  title: 练习 B：第四册六大语法支柱综合纠错与升级（修正典型考场病句，或按提示改写）
  items:
  - prompt: 【小品词与从句语序纠错】⟦Han sagde, at ordningen virker jo ikke uden flere afgange om aftenen.⟧ →
    kind: write
    accept:
    - Han sagde, at ordningen jo ikke virker uden flere afgange om aftenen.
    prefill: Han sagde, at ordningen virker jo ikke uden flere afgange om aftenen.
    explain: 在 ⟦at⟧ 从句中，情态小品词 ⟦jo⟧ 与否定词 ⟦ikke⟧ 均须位于变位动词 ⟦virker⟧ 之前
  - prompt: 【让步倒装纠错】⟦Ganske vist projektet er dyrt, men ikke desto mindre det kan betale sig på sigt.⟧ →
    kind: write
    accept:
    - Ganske vist er projektet dyrt, men ikke desto mindre kan det betale sig på sigt.
    prefill: Ganske vist projektet er dyrt, men ikke desto mindre det kan betale sig på sigt.
    explain: 句首 ⟦Ganske vist⟧ 与转折后的 ⟦ikke desto mindre⟧ 都必须触发 V2 倒装
  - prompt: 【因果连词与倒装纠错】⟦Billetpriserne falder, hvorved vælger flere pendlere bussen i hverdagen.⟧ →
    kind: write
    accept:
    - Billetpriserne falder, hvorved flere pendlere vælger bussen i hverdagen.
    prefill: Billetpriserne falder, hvorved vælger flere pendlere bussen i hverdagen.
    explain: ⟦hvorved⟧ 引导从句，内部维持“主语 + 动词”不倒装语序
  - prompt: 【条件与双重否定纠错】⟦Pendlere skifter ikke til toget, medmindre afgangene ikke bliver mere pålidelige.⟧ →
    kind: write
    accept:
    - Pendlere skifter ikke til toget, medmindre afgangene bliver mere pålidelige.
    prefill: Pendlere skifter ikke til toget, medmindre afgangene ikke bliver mere pålidelige.
    explain: ⟦medmindre⟧ 本身已含否定意味，从句内须删去多余的 ⟦ikke⟧
  - prompt: 【名词化与 V2 升级】用 ⟦Ved indførelsen af⟧ 浓缩句首从句：⟦Når man indfører gratis bybusser, falder antallet af biler i centrum.⟧ →
    kind: write
    accept:
    - Ved indførelsen af gratis bybusser falder antallet af biler i centrum.
    explain: 介词名词化短语放句首，后面主句发生 V2 倒装 ⟦falder antallet⟧
  - prompt: 【虚拟推演升级】改写为过去非真实虚拟句：⟦Kommunen investerede ikke i metroen i tide, så trængslen voksede.⟧（用 ⟦Hvis kommunen havde..., ville trængslen ikke være...⟧）→
    kind: write
    accept:
    - Hvis kommunen havde investeret i metroen i tide, ville trængslen ikke være vokset.
    explain: 注意变化动词 ⟦vokse⟧ 在结果句中须用 ⟦ville... være vokset⟧
