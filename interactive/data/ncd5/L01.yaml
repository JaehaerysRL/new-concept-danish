- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 2005 年，老年人口占总人口的 15.1%。
    answer: I 2005 udgjorde ældregruppen en andel på 15,1 procent af hele befolkningen.
  - zh: 两个年龄组之间存在着显著的差距。
    answer: Der findes en markant forskel mellem de to aldersgrupper.
  - zh: 2025 年，老年人口占比将超过儿童及青少年。
    answer: I 2025 overstiger andelen af ældre antallet af børn og unge.
  - zh: 在 2035 年达到峰值后，该增长曲线将逐渐趋平。
    answer: Efter at væksten topper i 2035, flader kurven gradvist ud.
  - zh: 随着平均寿命稳步上升，社会面临着越来越高的抚养比。
    answer: Når levealderen stiger støt, står samfundet over for en voksende forsørgerbyrde.
  - zh: 更高的退休年龄和新技术投资可以缓冲公共财政面临的压力。
    answer: En højere pensionsalder og investeringer i ny teknologi kan afbøde presset på økonomien.
