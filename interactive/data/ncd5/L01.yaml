- id: B
  type: drill
  title: 练习 B：图表表达升级与典型考场病句修正（按括号要求改写或纠错）
  items:
  - prompt: 【纠错】修正助动词、英语小数点与变化介词：⟦Fra 2005 til 2025 har andelen af ældre steget til 21.2 procent, hvilket er en stigning af 6,1 procent.⟧ →
    kind: write
    accept:
    - Fra 2005 til 2025 er andelen af ældre steget til 21,2 procent, hvilket er en stigning på 6,1 procentpoint.
    prefill: Fra 2005 til 2025 har andelen af ældre steget til 21.2 procent, hvilket er en stigning af 6,1 procent.
    explain: ⟦stige⟧ 用助动词 ⟦er⟧，小数用逗号，名词后幅度用 ⟦på⟧ 且单位为 ⟦procentpoint⟧
  - prompt: 【纠错】修正句首时间短语逗号与 V2 倒装：⟦Mellem 2035 og 2045, væksten flader langsomt ud.⟧ →
    kind: write
    accept:
    - Mellem 2035 og 2045 flader væksten langsomt ud.
    prefill: Mellem 2035 og 2045, væksten flader langsomt ud.
    explain: 去掉句首状语后的英语式逗号，保持 V2 动词 ⟦flader⟧ 紧跟第二位
  - prompt: 【纠错】修正 ⟦mellem / af⟧ 搭配错误：⟦Der er en stor forskel imellem den offentlige og den private sektor på omkring tolv procent.⟧（请改写为精确书面对比句）→
    kind: write
    accept:
    - Der er en markant forskel på omkring tolv procentpoint mellem den offentlige og den private sektor.
    explain: 使用 ⟦en markant forskel på X procentpoint mellem A og B⟧ 使表述更严谨
  - prompt: 【升级】用 ⟦udgøre en andel på⟧ 替换平淡表达：⟦65-årige og ældre er 21,2 procent af alle danskere i 2025.⟧ →
    kind: write
    accept:
    - I 2025 udgør borgere på 65 år og derover en andel på 21,2 procent af alle danskere.
    explain: 用 ⟦udgøre en andel på⟧ 替换平淡系动词 ⟦er⟧
  - prompt: 【升级】用 ⟦overstige⟧ 合并对比两项数据：⟦I 2025 er der 21,2 procent ældre, men kun 19,1 procent børn og unge.⟧ →
    kind: write
    accept:
    - I 2025 overstiger andelen af ældre med 21,2 procent for første gang andelen af børn og unge på 19,1 procent.
    explain: 以动词 ⟦overstige⟧ 一句话精准概括曲线交叉点
  - prompt: 【升级】用 ⟦toppe i... hvorefter... flade ud⟧ 重组句子：⟦Tilvæksten er størst i 2035, og bagefter bliver den næsten den samme.⟧ →
    kind: write
    accept:
    - Tilvæksten topper i 2035, hvorefter kurven gradvist flader ud.
    explain: 利用 ⟦toppe i + hvorefter + flade ud⟧ 形成高级句法衔接
  open: true
