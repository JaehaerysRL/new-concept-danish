- id: B
  type: drill
  title: 练习 B：图表评论句型升级与语法纠错（按括号要求改写或纠错）
  items:
  - prompt: 【纠错】修正 ⟦skyldes⟧ 的多余介词与英语式逗号：⟦Overordnet set, forskellen skyldes af traditionelle kønsroller.⟧ →
    kind: write
    accept:
    - Overordnet set skyldes forskellen traditionelle kønsroller.
    explain: 去掉英语式逗号并遵循 V2 倒装，同时删去 ⟦skyldes⟧ 后多余的介词 ⟦af⟧
  - prompt: 【纠错】修正 ⟦fordi⟧ 与名词短语误用：⟦Mange pædagoger arbejder på deltid fordi det store arbejdspres.⟧ →
    kind: write
    accept:
    - Mange pædagoger arbejder på deltid på grund af det store arbejdspres.
    explain: 名词短语前必须用介词短语 ⟦på grund af⟧，而非连词 ⟦fordi⟧
  - prompt: 【纠错】修正目的状语前置时的主句 V2 倒装：⟦For at modvirke nedslidning kommunerne må forbedre arbejdsmiljøet.⟧ →
    kind: write
    accept:
    - For at modvirke nedslidning må kommunerne forbedre arbejdsmiljøet.
    prefill: For at modvirke nedslidning kommunerne må forbedre arbejdsmiljøet.
    explain: 目的不定式放句首时，主句发生 V2 倒装，情态动词 ⟦må⟧ 置于主语 ⟦kommunerne⟧ 前
  - prompt: 【升级】用 ⟦kendetegnes ved⟧ 升级 Step 1 宏观概括句：⟦Fra 2010 til 2024 er udviklingen sådan, at kønsgabet bliver mindre.⟧ →
    kind: write
    accept:
    - Fra 2010 til 2024 kendetegnes udviklingen ved et gradvist mindre kønsgab.
    explain: 用 ⟦kendetegnes ved⟧ 将口语化描述升格为学术概括句
  - prompt: 【升级】用 ⟦forklares delvist ved⟧ 改写 Step 2 归因句：⟦Det er også på grund af vagtplanerne i plejen, at så mange arbejder deltid.⟧ →
    kind: write
    accept:
    - Dette forklares delvist ved vagtplanerne i plejesektoren.
    explain: 用 C1 被动因果句式取代冗长的分裂句
  - prompt: 【升级】用 ⟦På længere sigt indebærer dette, at...⟧ 改写 Step 3 后果句：⟦Hvis folk arbejder deltid i mange år, får de mindre i pension senere.⟧ →
    kind: write
    accept:
    - På længere sigt indebærer mange års deltid en mindre pensionsopsparing.
    explain: 将 ⟦hvis⟧ 条件句凝练为“时间视角 + ⟦indebære⟧ + 抽象名词短语”
