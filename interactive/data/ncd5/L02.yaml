- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 总体而言，2024 年男女之间的差距已明显缩小。
    answer: Overordnet set er forskellen mellem kønnene mindsket tydeligt i 2024.
  - zh: 这些数字清晰地折射出公共部门与私营部门之间的反差。
    answer: Tallene afspejler en klar kontrast mellem den offentlige og den private sektor.
  - zh: 这一失衡部分可以用按性别分流的劳动力市场来解释。
    answer: Denne skævhed forklares delvist ved et kønsopdelt arbejdsmarked.
  - zh: 选择兼职与家庭内部的照料任务分配紧密相连。
    answer: Valget af deltid hænger tæt sammen med fordelingen af omsorgsopgaver i familien.
  - zh: 从长远来看，多年的兼职工作意味着更低的养老金储蓄。
    answer: På længere sigt indebærer mange års deltid en lavere pensionsopsparing.
  - zh: 为了扭转这种不平等，政府既需要改善人员配置，也需要创造更灵活的排班表。
    answer: For at modvirke uligheden kræves både bedre normeringer og mere fleksible vagtplaner.
