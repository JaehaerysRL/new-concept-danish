  items:
  - prompt: 【纠错】修正英语逗号与 V2 倒装错误：⟦Paradoksalt nok, manglen på billige boliger bliver værre i grønne bydele.⟧ →
    kind: write
    accept:
    - Paradoksalt nok bliver manglen på billige boliger værre i grønne bydele.
    prefill: Paradoksalt nok, manglen på billige boliger bliver værre i grønne bydele.
    explain: 删去英语式逗号，并保证变位动词 ⟦bliver⟧ 紧跟在 ⟦Paradoksalt nok⟧ 之后
  - prompt: 【纠错】修正 ⟦jo...desto...⟧ 的主从句语序与占位词：⟦Jo flere dyre lejligheder bygges i centrum, desto færre lærere kan bo nær skolen.⟧ →
    kind: write
    accept:
    - Jo flere dyre lejligheder der bygges i centrum, desto færre lærere kan bo nær skolen.
    explain: 前句加入主语占位词 ⟦der⟧；后句将 ⟦desto færre lærere⟧ 视为句首成分，紧接倒装动词 ⟦kan⟧
  - prompt: 【纠错】修正介词短语错用：⟦Byen vokser hurtigt på bekostningen for den sociale mangfoldighed.⟧ →
