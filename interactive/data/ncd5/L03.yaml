  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 令人悖论的是，成功的老旧街区改造有时会削弱城市的社会多样性。
    answer: Paradoksalt nok kan en vellykket byfornyelse svække byens sociale mangfoldighed.
  - zh: 市中心建得越多高价公寓，外围市镇承受的通勤压力就越大。
    answer: Jo flere dyre lejligheder der bygges i centrum, desto større bliver pendlerpresset i oplandskommunerne.
  - zh: 奢华住房项目常常是以牺牲平价福利住房为代价推进的。
    answer: Luksusprojekter gennemføres ofte på bekostning af billige almene boliger.
  - zh: 当富裕买家接管一个街区时，就会启动一种自我强化效应。
    answer: Når velstillede købere overtager et kvarter, sættes en selvforstærkende effekt i gang.
  - zh: 城市规划必须将经济增长与公共交通结合起来，才能遏制社会隔离。
    answer: Byplanlægningen skal kombinere vækst med offentlig transport for at bremse segregeringen.
