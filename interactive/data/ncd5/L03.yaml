    explain: 严格遵守“前从句不倒装、后主句 ⟦bruger de⟧ 倒装”
  - prompt: 【升级】用 ⟦sætte en selvforstærkende effekt i gang⟧ 浓缩说明：⟦Når et kvarter bliver populært, stiger priserne, og det gør kvarteret endnu mere eksklusivt.⟧ →
