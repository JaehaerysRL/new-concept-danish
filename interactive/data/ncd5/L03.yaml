    - Byen vokser hurtigt på bekostning af den sociale mangfoldighed.
    prefill: Byen vokser hurtigt på bekostningen for den sociale mangfoldighed.
    explain: 固定为单数无冠词 ⟦på bekostning af⟧
  - prompt: 【升级】用 ⟦I takt med at...⟧ 合并两句：⟦Byerne investerer i nye metrostationer. Samtidig stiger huslejen hurtigt.⟧ →
    kind: write
    accept:
    - I takt med at byerne investerer i nye metrostationer, stiger huslejen hurtigt.
    explain: 以 ⟦I takt med at...⟧ 体现发展同步性，并注意主句 V2 倒装 ⟦stiger huslejen⟧
  - prompt: 【升级】用 ⟦Jo..., desto...⟧ 重写因果递进句：⟦Hvis borgere flytter længere væk fra jobbet, bruger de mere tid på daglig transport.⟧ →
    kind: write
    accept:
