- id: B
  type: drill
  title: 练习 B：抽象句式升华与语法排雷（将口语描述升级为 C1 社会学评论或修正错句）
  items:
  - prompt: 【纠错】修正形容词定冠词变形与介词漏用：⟦Det institutionaliseret foreningsliv vidner en stærk kultur på kryds af generationer.⟧ →
    kind: write
    accept:
    - Det institutionaliserede foreningsliv vidner om en stærk kultur på tværs af generationer.
    explain: 定冠词后分词形容词加 ⟦-ede⟧；补齐 ⟦vidne om⟧ 的介词 ⟦om⟧；将英语式 ⟦på kryds af⟧ 改为 ⟦på tværs af⟧
  - prompt: 【纠错】修正固定短语冠词与动词变位：⟦I lys af travle hverdage fornyer lokale klubber nu deres frivillighed.⟧ →
    kind: write
    accept:
    - I lyset af travle hverdage fornyr lokale klubber nu deres frivillighed.
    explain: 必须使用定冠词形态 ⟦I lyset af⟧；动词 ⟦at forny⟧ 的现在时拼写为 ⟦fornyr⟧
  - prompt: 【纠错】修正 ⟦på tværs af⟧ 与复数搭配：⟦De nye løbeklubber har lave tærskel og åbner for fællesskab tværs af sociale skel.⟧ →
    kind: write
    accept:
    - De nye løbeklubber har lave tærskler og åbner for fællesskab på tværs af sociale skel.
    explain: 可数名词用复数 ⟦lave tærskler⟧；完整介词短语为 ⟦på tværs af⟧
  - prompt: 【升级】用抽象名词 ⟦Kommercialiseringen af fritiden⟧ 改写：⟦Når private firmaer tjener flere penge på vores fritid, bliver det sværere for fattige børn at være med.⟧ →
    kind: write
    accept:
    - Kommercialiseringen af fritiden risikerer at skabe nye sociale skel for udsatte børn.
    explain: 以抽象名词短语作主语取代 ⟦når⟧ 口语条件句，大幅提升语体
  - prompt: 【升级】用 ⟦Set i et bredere perspektiv vidner... om...⟧ 升华日常观察：⟦Flere folk træner alene med musik i ørerne, og det viser, at samfundet er blevet mere individuelt.⟧ →
    kind: write
    accept:
    - Set i et bredere perspektiv vidner de individuelle træningsvaner om en stigende individualisering i samfundet.
    explain: 使用固定升华框架把具体观察转化为社会趋势判断
  - prompt: 【升级】串联 Unit 1：用 ⟦I lyset af + V2 倒装⟧ 合并原因与结果：⟦Befolkningen ældes og folk pendler langt, så frivillige foreninger mangler hjælpere.⟧ →
    kind: write
    accept:
    - I lyset af en aldrende befolkning og længere pendling kæmper frivillige foreninger for at rekruttere hjælpere.
    explain: 将前置条件融合为 ⟦I lyset af...⟧ 并确保主句动词 ⟦kæmper⟧ 遵循 V2 倒装
  open: true
