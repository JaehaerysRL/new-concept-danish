- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 从更广阔的视角来看，健身热潮折射出日益增强的个人主义化。
    answer: Set i et bredere perspektiv vidner fitnessbølgen om en stigende individualisering.
  - zh: 传统社团在跨越代际和社会鸿沟方面一直发挥着重要作用。
    answer: Traditionelle foreninger har spillet en vigtig rolle på tværs af generationer og sociale skel.
  - zh: 鉴于大城市漫长的通勤时间，许多人更偏爱低约束性的社群。
    answer: I lyset af lange pendlertider i storbyerne foretrækker mange uforpligtende fællesskaber.
  - zh: 休闲领域的商业化可能在长远上削弱地方的社会凝聚力。
    answer: Kommercialiseringen af fritiden kan på længere sigt undergrave den lokale sammenhængskraft.
  - zh: 许多年轻人认为传统社团结构过于制度化且门槛过高。
    answer: Mange unge oplever traditionelle foreningsstrukturer som alt for institutionaliserede og med høje tærskler.
  - zh: 如果传统协会能够革新自身组织形式，它们依然能够吸引志愿参与者。
    answer: Hvis traditionelle foreninger fornyr deres organisering, kan de stadig tiltrække frivillige deltagere.
