- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 在丹麦，说一个结果“不算太糟”往往意味着高度认可。
    answer: I Danmark betyder det ofte stor anerkendelse, når man kalder et resultat for ikke helt dårligt.
  - zh: 当局将该项目的延误轻描淡写地称为“一次小幅调整”。
    answer: Myndighederne nedtonede projektets forsinkelse som en mindre justering.
  - zh: 这个提案算不上毫无问题，因为它忽视了高昂的成本。
    answer: Dette forslag er ikke ligefrem uproblematisk, fordi det overser de høje omkostninger.
  - zh: 如果只按照字面意思理解这种反讽，人们就很容易误判批评的严重性。
    answer: Hvis man tager denne ironi for pålydende, undervurderer man let alvoren i kritikken.
  - zh: 我恐怕很难将这场仓促达成的政治妥协称之为一次胜利。
    answer: Dette hastige politiske kompromis kan vist næppe kaldes en sejr.
  - zh: 当低调陈述沦为遮盖失职的烟幕时，它便不再迷人。
    answer: Når underdrivelsen bliver et tågeslør over svigt, mister den sin charme.
- id: A
  type: drill
  title: 练习 A：低调陈述与否定反语高频搭配填空（每空填入最准确的 1 个丹麦语词）
  items:
  - prompt: Efter den vellykkede fremlæggelse sagde chefen tørt, at resultatet da var ikke {{_}} dårligt.
    kind: cloze
    blanks:
    - - helt
    explain: 高频低调褒奖固定搭配：⟦ikke helt dårligt⟧ 不算太糟，实为不错
  - prompt: Når et milliardprojekt overskrider budgettet med halvdelen, kan det vist {{_}} kaldes en triumf.
    kind: cloze
    blanks:
    - - næppe
    explain: 冷峻反讽搭配：⟦vist næppe kaldes en triumf⟧ 恐怕很难称作胜利
  - prompt: Kommentatoren påpegede, at ministerens nye reformforslag ikke {{_}} er uproblematisk.
    kind: cloze
    blanks:
    - - ligefrem
    explain: 强化委婉否定：⟦ikke ligefrem uproblematisk⟧ 算不上完全没问题
  - prompt: Projektet var langt {{_}} ringe; tværtimod høstede det stor anerkendelse i branchen.
    kind: cloze
    blanks:
    - - fra
    explain: 反语赞赏搭配：⟦langt fra ringe⟧ 远谈不上差劲
  - prompt: For udlændinge kan danskernes skjulte koder virke en {{_}} udfordrende at afkode i starten.
    kind: cloze
    blanks:
    - - smule
    explain: 程度弱化短语：⟦en smule udfordrende⟧ 有点棘手/具挑战性
  - prompt: Man bør aldrig tage en dansk underdrivelse helt {{_}} pålydende uden at se på konteksten.
    kind: cloze
    blanks:
    - - for
    explain: 固定搭配：⟦at tage noget for pålydende⟧ 照字面意思全盘当真
  - prompt: Rapporten antyder diplomatisk, at den nuværende løsning rummer et {{_}} forbedringspotentiale.
    kind: cloze
    blanks:
    - - vist
    explain: 中性名词 ⟦et forbedringspotentiale⟧ 前须用中性定语 ⟦et vist⟧
  - prompt: Det ville naturligvis være en {{_}} ubehageligt, hvis politikerne pludselig skulle tale helt uden omsvøb.
    kind: cloze
    blanks:
    - - kende
    explain: 书面风格度弱化副词：⟦en kende ubehageligt⟧ 有那么一丁点不自在
- id: B
  type: drill
  title: 练习 B：低调反语纠错与修辞升级（修正语序与否定错误，或将直白句升级为地道丹麦式反语）
  items:
  - prompt: 【否定叠加纠错】⟦Den nye aftale kan vist næppe ikke løse hele krisen på arbejdsmarkedet.⟧ →
    kind: write
    accept:
    - Den nye aftale kan vist næppe løse hele krisen på arbejdsmarkedet.
    prefill: Den nye aftale kan vist næppe ikke løse hele krisen på arbejdsmarkedet.
    explain: ⟦næppe⟧ 本身已表否定，须删去多余的 ⟦ikke⟧
  - prompt: 【从句语序纠错】⟦Hun understregede, at forslaget er ikke ligefrem uproblematisk for kommunerne.⟧ →
    kind: write
    accept:
    - Hun understregede, at forslaget ikke ligefrem er uproblematisk for kommunerne.
    prefill: Hun understregede, at forslaget er ikke ligefrem uproblematisk for kommunerne.
    explain: 在 ⟦at⟧ 引导的从句中，中场否定模块 ⟦ikke ligefrem⟧ 须置于变位动词 ⟦er⟧ 之前
  - prompt: 【词性一致纠错】⟦Direktøren mente, at afdelingen havde en vist forbedringspotentiale på det digitale område.⟧ →
    kind: write
    accept:
    - Direktøren mente, at afdelingen havde et vist forbedringspotentiale på det digitale område.
    prefill: Direktøren mente, at afdelingen havde en vist forbedringspotentiale på det digitale område.
    explain: 中心词 ⟦potentiale⟧ 为中性 ⟦et⟧-名词，故须配中性词形 ⟦et vist⟧
  - prompt: 【低调褒奖升级】用 litote 改写过满的赞美：⟦Koncerten var helt fantastisk, og musikerne spillede fremragende.⟧（用 ⟦ikke uden kvalitet⟧ 与 ⟦langt fra ringe⟧ 改写）→
    kind: write
    accept:
    - Koncerten var bestemt ikke uden kvalitet, og musikerne leverede en præstation, der var langt fra ringe.
    explain: 用双否曲言法替代浮夸的最高级，更贴合丹麦乐评格调
  - prompt: 【冷峻反讽升级】把直白批评升级为丹麦专栏式反语：⟦Ministerens plan var en total fiasko.⟧（用 ⟦kan vist næppe kaldes en triumf⟧ 改写）→
    kind: write
    accept:
    - Ministerens plan kan vist næppe kaldes en triumf.
    explain: 借 ⟦vist næppe⟧ 将直接抨击转为冷静尖锐的专栏式反讽
  - prompt: 【职场委婉批评升级】把生硬否定改写为丹麦主管式反馈：⟦Dit udkast har mange fejl og er ikke klart til mødet.⟧（用 ⟦en smule udfordrende⟧ 或 ⟦et vist forbedringspotentiale⟧ 改写）→
    kind: write
    accept:
    - Dit udkast er en smule udfordrende at gå ind i endnu og rummer nok et vist forbedringspotentiale før mødet.
    explain: 利用 ⟦en smule⟧ 与 ⟦et vist⟧ 委婉传达大修需求，同时保留同事体面
  open: true
