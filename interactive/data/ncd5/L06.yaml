- id: B
  type: drill
  title: 练习 B：社论语序纠错与句式升格（修正从句语序、介词及 V2 错误，或升级为 C1 社论句式）
  items:
  - prompt: 【主语从句语序纠错】⟦Hvorvidt vil regeringen prioritere skattelettelser i år, står endnu hen i det uvisse.⟧ →
    kind: write
    accept:
    - Hvorvidt regeringen vil prioritere skattelettelser i år, står endnu hen i det uvisse.
    prefill: Hvorvidt vil regeringen prioritere skattelettelser i år, står endnu hen i det uvisse.
    explain: ⟦Hvorvidt⟧ 引导的间接疑问从句内部须维持“主语 + 动词”不倒装语序
  - prompt: 【让步从句后 V2 纠错】⟦Uanset hvordan man vender og drejer det, vi kan ikke undgå svære prioriteringer.⟧ →
    kind: write
    accept:
    - Uanset hvordan man vender og drejer det, kan vi ikke undgå svære prioriteringer.
    prefill: Uanset hvordan man vender og drejer det, vi kan ikke undgå svære prioriteringer.
    explain: 前置让步从句占据前场，主句须紧跟变位动词 ⟦kan⟧ 实现 V2 倒装
  - prompt: 【介词与从句语序纠错】⟦Det ændrer imidlertid ikke på den kendsgerning, at stiger udgifterne til sundhed hvert år.⟧ →
    kind: write
    accept:
    - Det ændrer imidlertid ikke ved den kendsgerning, at udgifterne til sundhed stiger hvert år.
    prefill: Det ændrer imidlertid ikke på den kendsgerning, at stiger udgifterne til sundhed hvert år.
    explain: 固定搭配介词为 ⟦ved⟧，且 ⟦at⟧ 从句内须恢复“主语 + 动词”不倒装语序
  - prompt: 【B1 升格为 C1 社论悬置句】用 ⟦Hvorvidt..., står hen i det uvisse⟧ 升级：⟦Vi ved ikke endnu, om flere arbejdstimer kan betale hele regningen.⟧ →
    kind: write
    accept:
    - Hvorvidt flere arbejdstimer kan betale hele regningen, står fortsat hen i det uvisse.
    explain: 用社论悬置句取代平铺直叙的 ⟦Vi ved ikke⟧，瞬间提升客观权威感
  - prompt: 【B1 升格为 C1 强让步反问】用 ⟦Bevares,... Men spørgsmålet forbliver,...⟧ 升级：⟦Selvom kortere ventelister er gode, ved vi stadig ikke, hvor pengene skal komme fra.⟧ →
    kind: write
    accept:
    - Bevares, kortere ventelister er et vigtigt mål. Men spørgsmålet forbliver, hvor pengene skal komme fra.
    explain: 用“诚然退让 + 核心追问”拆分长句，增强社论节奏与锋芒
  - prompt: 【B2 升格为 C1 事实锚定】用 ⟦Det ændrer imidlertid ikke ved den kendsgerning, at...⟧ 升级：⟦Selvom råderummet er steget, er det stadig sandt, at befolkningen ældes.⟧ →
    kind: write
    accept:
    - Det ændrer imidlertid ikke ved den kendsgerning, at befolkningen bliver ældre, selvom råderummet er steget.
    explain: 用不可动摇的事实锚定句强化论证重心
  open: true
