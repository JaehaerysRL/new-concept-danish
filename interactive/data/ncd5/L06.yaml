- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 政府是否能达成一项广泛协议，目前仍处于未知之数。
    answer: Hvorvidt regeringen kan indgå en bred aftale, står stadig hen i det uvisse.
  - zh: 无论怎么权衡推敲，社会都必须面对艰难的优先次序抉择。
    answer: Uanset hvordan man vender og drejer det, må samfundet foretage svære prioriteringer.
  - zh: 诚然，减税可以刺激经济增长，但问题依然在于谁来照料老年人。
    answer: Bevares, skattelettelser kan styrke væksten, men spørgsmålet forbliver, hvem der skal passe de ældre.
  - zh: 然而，这改变不了劳动力供给正在逐年萎缩的事实。
    answer: Det ændrer imidlertid ikke ved den kendsgerning, at arbejdsudbuddet falder år for år.
  - zh: 短视的竞选空头支票长远来看会掏空民众对社会契约的信任。
    answer: Kortsigtet valgflæsk udhuler på længere sigt borgernes tillid til vores fælles samfundskontrakt.
  - zh: 一场成熟的辩论要求政治家们敢于做出清晰取舍，而不是回避问题。
    answer: En moden debat kræver, at politikerne tør prioritere frem for at undgå svære valg.
