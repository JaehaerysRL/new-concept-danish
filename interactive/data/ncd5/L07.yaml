- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 报告冷静地指出，到 2040 年人口压力将会加剧。
    answer: Rapporten konstaterer tørt, at det demografiske pres vil vokse frem mod 2040.
  - zh: 批评者宣称，这些模型建立在脱离现实的假设之上。
    answer: Kritikerne hævder, at disse modeller hviler på urealistiske antagelser.
  - zh: 研究人员通过最新数据证实，早期干预能够拯救生命。
    answer: Forskerne dokumenterer med nye data, at en tidlig indsats redder menneskeliv.
  - zh: 没有任何政治人物能够假装拥有所有现成的答案。
    answer: Ingen politiker kan foregive at sidde inde med alle de færdige svar.
  - zh: 委员会强调，最终的价值抉择必须由选民来决定。
    answer: Kommissionen understreger, at de endelige værdivalg skal træffes af vælgerne.
  - zh: 在辩论中，反对者甚至声称该项改革将摧毁地方社区。
    answer: I debatten påstår modstanderne ligefrem, at reformen vil ødelægge de lokale samfund.
- id: A
  type: drill
  title: 练习 A：引述动词立场光谱精准填空（根据语境中立、质疑或认同立场，每空填入 1 个最准确的动词变位形式）
  items:
  - prompt: Ekspertkommissionen {{_}} tørt i sin rapport, at udgifterne til ældrepleje stiger frem mod 2035.
    kind: cloze
    blanks:
    - - konstaterer
    explain: 与客观冷峻副词 ⟦tørt⟧ 搭配，表冷静确认客观预测趋势
  - prompt: Modstanderne {{_}} desuden i debatten, at længere afstande skaber utryghed for familier i landdistrikterne.
    kind: cloze
    blanks:
    - - anfører
    explain: 中立引述辩论一方所列举的具体理由
  - prompt: De nye forskningsdata {{_}} utvetydigt, at specialiserede afdelinger giver højere overlevelse.
    kind: cloze
    blanks:
    - - dokumenterer
    explain: 与实证主语 ⟦forskningsdata⟧ 及 ⟦utvetydigt⟧ 搭配，表扎实证实
  - prompt: Regeringens kritikere {{_}} ligefrem, at kommissionen bevidst har skjult ubehagelige beregninger.
    kind: cloze
    blanks:
    - - påstår
    explain: 搭配语气强烈的 ⟦ligefrem⟧，带有明显质疑色彩
  - prompt: Ingen seriøs økonom kan {{_}} at have fundet en løsning helt uden omkostninger for samfundet.
    kind: cloze
    blanks:
    - - foregive
    explain: 与 ⟦at have fundet⟧ 搭配，表“假装/佯称”
  - prompt: Rapporten slår i sin konklusion {{_}}, at reformer er nødvendige inden for de næste fem år.
    kind: cloze
    blanks:
    - - fast
    explain: 可分动词固定结构：⟦at slå fast⟧ 明确断定
  - prompt: Formanden {{_}}, at eksperter kun bør levere det faglige grundlag og ikke træffe politiske værdivalg.
    kind: cloze
    blanks:
    - - understreger
    explain: 搭配权威主体 ⟦Formanden⟧，表着重强调立场
  - prompt: Flere borgmestre {{_}}, at de centrale modeller ikke tager højde for lokale forhold.
    kind: cloze
    blanks:
    - - hævder
    explain: 市长们提出但仍有争议的主张，作者保持中立微距
- id: B
  type: drill
  title: 练习 B：信源句法纠错与立场切换改写（修正 ifølge 语病与语序，或按指定立场重写引述）
  items:
  - prompt: 【经典介词语病纠错】⟦Ifølge den nye rapport dokumenterer, at borgernes tillid til eksperter er høj.⟧ →
    kind: write
    accept:
    - Ifølge den nye rapport er borgernes tillid til eksperter høj.
    - Den nye rapport dokumenterer, at borgernes tillid til eksperter er høj.
    prefill: Ifølge den nye rapport dokumenterer, at borgernes tillid til eksperter er høj.
    explain: 介词 ⟦Ifølge⟧ 绝不能后接引述动词 ⟦dokumenterer⟧
  - prompt: 【插叙 V2 倒装纠错】⟦”Vi må respektere det folkelige mandat,” kommissionens formand understregede i går.⟧ →
    kind: write
    accept:
    - ”Vi må respektere det folkelige mandat,” understregede kommissionens formand i går.
    prefill: ”Vi må respektere det folkelige mandat,” kommissionens formand understregede i går.
    explain: 引语前置时，后面的归属插叙必须遵守 V2 倒装：动词 ⟦understregede⟧ 在主语前
  - prompt: 【立场误用纠错】作者明显认同研究结论，请改掉不妥的质疑动词：⟦Forskningen påstår tydeligt, at tidlig indsats forebygger alvorlige sygdomme.⟧ →
    kind: write
    accept:
    - Forskningen dokumenterer tydeligt, at tidlig indsats forebygger alvorlige sygdomme.
    prefill: Forskningen påstår tydeligt, at tidlig indsats forebygger alvorlige sygdomme.
    explain: 说话人明显赞同研究结论时，须用认同实证词 ⟦dokumenterer⟧ 或 ⟦slår fast⟧，不能用表怀疑的 ⟦påstår⟧
  - prompt: 【中立 → 质疑保持距离】将平淡句改为表达说话人对反对派怀疑的引述：⟦Oppositionen siger, at planen intet koster.⟧（用 ⟦hævde⟧ 或 ⟦påstå⟧ 改写）→
    kind: write
    accept:
    - Oppositionen hævder, at planen intet koster.
    - Oppositionen påstår, at planen slet ikke koster noget.
    explain: 改用 ⟦hævde / påstå⟧ 标示保持距离或质疑
  - prompt: 【主动 → 被动客观摘要体】改写为报告摘要常用的无人称被动结构：⟦Rapporten påpeger, at mange kommuner mangler speciallæger.⟧（用 ⟦I rapporten påpeges det, at...⟧ 改写）→
    kind: write
    accept:
    - I rapporten påpeges det, at mange kommuner mangler speciallæger.
    explain: 利用形式主语 ⟦det⟧ 与 ⟦-s⟧ 被动形成高度紧凑客观的学术转述
  - prompt: 【普通引述 → 权威实证强调】升级为强有力论断：⟦Tallene viser meget klart, at uddannelse mindsker uligheden.⟧（用 ⟦dokumentere⟧ 或 ⟦slå fast⟧ 改写）→
    kind: write
    accept:
    - Tallene dokumenterer utvetydigt, at uddannelse mindsker uligheden.
    - Tallene slår fast, at uddannelse mindsker uligheden.
    explain: 升级为实证强调动词
  open: true
