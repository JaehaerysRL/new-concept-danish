  items:
  - prompt: Når hverdagsmaden pludselig gøres til et bevis på, {{_}} man bekymrer sig om klimaet, opstår der let konflikter.
    kind: cloze
    blanks:
    - - hvorvidt
      - om
    explain: 接在介词 ⟦på⟧ 之后引导间接疑问从句，书面首选 ⟦hvorvidt⟧
  - prompt: Selvom de fleste borgere udmærket ved, at vores vaner må ændres, {{_}} mange en dyb skepsis over for moralske pegefingre.
    kind: cloze
    blanks:
    - - nærer
    explain: 前置让步从句 ⟦Selvom...⟧ 占据前场，主句须 V2 倒装：动词 ⟦nærer⟧ 居首
  - prompt: Hvis politikerne tør skabe rammer, {{_}} gør bæredygtige valg billigere, kan samtalen igen blive saglig.
    kind: cloze
    blanks:
    - - der
      - som
    explain: 引导定语从句并在从句中作主语，修饰复数名词 ⟦rammer⟧
  - prompt: Indkøbskurven – som tidligere blot afspejlede smag og økonomi – {{_}} i dag ofte gjort til et politisk symbol.
    kind: cloze
    blanks:
    - - bliver
      - er
    explain: 注意遮住 ⟦–... –⟧ 插入语后，主语 ⟦Indkøbskurven⟧ 后紧接唯一变位动词
  - prompt: Det afgørende er, at vi lærer at skelne {{_}} nødvendige reformer og unødig udskamning af naboer.
    kind: cloze
    blanks:
    - - mellem
    explain: 固定动词搭配：⟦at skelne mellem A og B⟧ 区分 A 与 B
  - prompt: Mad har – uanset hvor meget vi savner en ubekymret fortid – {{_}} været gennemsyret af kulturelle normer.
    kind: cloze
    blanks:
    - - altid
    explain: 助动词 ⟦har⟧ 放在 ⟦–... –⟧ 之前，实义分词 ⟦været⟧ 之前保留中场副词 ⟦altid⟧
  - prompt: Klimavenlige kampagner, der {{_}} tager hensyn til almindelige familiers hverdag, skaber ofte mere irritation end handling.
    kind: cloze
    blanks:
    - - ikke
      - sjældent
    explain: 在关系从句 ⟦der... tager⟧ 内，否定或频度副词必须位于变位动词之前
  - prompt: En politik, som primært bygger på individuel skyld og skam, svækker netop den brede opbakning, {{_}} omstillingen kræver.
    kind: cloze
    blanks:
    - - som
    explain: 此处关系代词在从句中作动词 ⟦kræver⟧ 的宾语，必须用 ⟦som⟧，不可用只作主语的 ⟦der⟧！
- id: B
  type: drill
  title: 练习 B：长句拓扑纠错与三层复合句组装升格（修正语序与插入语断裂，或将短句合成为流畅长句）
  items:
  - prompt: 【长前置从句 V2 纠错】⟦Når en traditionel ret pludselig bliver gjort til et moralsk spørgsmål, mange borgere føler sig uretfærdigt dømt.⟧ →
    kind: write
    accept:
    - Når en traditionel ret pludselig bliver gjort til et moralsk spørgsmål, føler mange borgere sig uretfærdigt dømt.
    prefill: Når en traditionel ret pludselig bliver gjort til et moralsk spørgsmål, mange borgere føler sig uretfærdigt dømt.
    explain: 长从句位于句首时，主句必须 V2 倒装：⟦føler mange borgere sig...⟧
  - prompt: 【插入语后主句语序与重词纠错】⟦Klimadebatten har – selvom formålet jo er rigtig godt – har ofte glemt almindelige familiers vilkår.⟧ →
    kind: write
    accept:
    - Klimadebatten har – selvom formålet jo er rigtig godt – ofte glemt almindelige familiers vilkår.
    prefill: Klimadebatten har – selvom formålet jo er rigtig godt – har ofte glemt almindelige familiers vilkår.
    explain: 删除 ⟦–... –⟧ 后方重复出现的助动词 ⟦har⟧，并用“拇指遮盖法”验证主干通顺
  - prompt: 【第三层从句中场副词纠错】⟦Hun understregede, at man ikke må tro, at forbrugerne ændrer ikke vaner uden politiske rammer.⟧ →
    kind: write
    accept:
    - Hun understregede, at man ikke må tro, at forbrugerne ikke ændrer vaner uden politiske rammer.
    prefill: Hun understregede, at man ikke må tro, at forbrugerne ændrer ikke vaner uden politiske rammer.
    explain: 在最内层的 ⟦at⟧ 从句中，⟦ikke⟧ 依然必须放在变位动词 ⟦ændrer⟧ 之前
  - prompt: 【三层嵌套组装升级】将下列零散信息合成为一句带 ⟦–... –⟧ 的流畅 C1 长句（用 ⟦Når..., opstår der...⟧ 起句）：⟦Folk spiser aftensmad. Aftensmaden var tidligere helt privat. Samtidig kritiserer medierne kødforbruget. Derfor opstår der en følelsesladet kulturkamp.⟧ →
    kind: write
    accept:
    - Når aftensmaden – som tidligere var et helt privat anliggende – bliver mødt med kritik af kødforbruget, opstår der let en følelsesladet kulturkamp.
    explain: 将补充背景装入 ⟦–... –⟧ 定语从句，从句结束后主句干脆利落地实现 ⟦opstår der⟧ 倒装
  - prompt: 【插入语嵌入与节奏重组】将让步从句作为 ⟦–... –⟧ 插入语嵌入主句中轴：⟦Klimaskam løser sjældent strukturelle problemer. Mange aktivister mener ellers, at skyldfølelse skaber hurtig handling.⟧ →
    kind: write
    accept:
    - Klimaskam løser – uanset at mange aktivister tror, at skyldfølelse skaber hurtig handling – sjældent de strukturelle problemer.
    explain: 主句 ⟦Klimaskam løser sjældent...⟧ 中轴跨越插入语稳健连接
  - prompt: 【长短句节奏微调】先用一个 6 词以内短句定调，再用复合句解释理由：⟦Maden er aldrig neutral, fordi den afspejler vores historie, vores værdier og den måde, som vi ønsker at indrette samfundet på.⟧ →
    kind: write
    accept:
    - Maden er aldrig neutral. Den afspejler nemlig både vores historie, vores værdier og den måde, hvorpå vi ønsker at indrette samfundet.
    prefill: Maden er aldrig neutral, fordi den afspejler vores historie, vores værdier og den måde, som vi ønsker at indrette samfundet på.
    explain: 先立 4 词短句敲钟，再用多层结构句展开阐释，达成高级散文节奏
  open: true
