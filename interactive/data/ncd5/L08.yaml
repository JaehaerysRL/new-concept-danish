- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 当日常饮食变成道德问题时，餐桌旁便会产生强烈的情绪张力。
    answer: Når hverdagsmaden bliver et moralsk spørgsmål, opstår der stærke følelser ved middagsbordet.
  - zh: 尽管大家都知道习惯必须改变，但许多人依然反感道德说教。
    answer: Selvom alle ved, at vanerne må ændres, afviser mange stadig moralske pegefingre.
  - zh: 如果政府让绿色食物更便宜，人们就会更容易做出可持续选择。
    answer: Hvis staten gør grøn mad billigere, vælger borgerne lettere bæredygtige alternativer i hverdagen.
  - zh: 我们必须区分必要的社会转型与对普通家庭的不必要羞辱。
    answer: Vi må skelne mellem nødvendig omstilling og unødig udskamning af almindelige familier.
  - zh: 研究表明，制造无力感的气候羞耻往往会削弱公众对改革的支持。
    answer: Forskning dokumenterer, at klimaskam, som skaber afmagt, ofte svækker den folkelige opbakning.
  - zh: 食物从来不只是卡路里，因为它同时承载着记忆与个人自主权。
    answer: Mad er aldrig blot kalorier, fordi den også rummer erindringer og personlig autonomi.
