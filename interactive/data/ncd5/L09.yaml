- id: B
  type: drill
  title: 练习 B：C1 句法纠错与辩证语体升级（修正错词/语序，或按提示升级句子）
  items:
  - prompt: 【形近词与搭配纠错】⟦Lovgiverne prøver at lave en hårfager grænse mellem kritik og chikane.⟧ →
    kind: write
    accept:
    - Lovgiverne prøver at trække en hårfin grænse mellem kritik og chikane.
    prefill: Lovgiverne prøver at lave en hårfager grænse mellem kritik og chikane.
    explain: 改用正确搭配动词 ⟦trække⟧，并将错词 ⟦hårfager⟧ 修正为 ⟦hårfin⟧
  - prompt: 【句首副词 V2 倒装纠错】⟦Principielt set, alle holdninger bør kunne ytres frit, men i praksis folk føler sig truet.⟧ →
    kind: write
    accept:
    - Principielt set bør alle holdninger kunne ytres frit, men i praksis føler folk sig truet.
    prefill: Principielt set, alle holdninger bør kunne ytres frit, men i praksis folk føler sig truet.
    explain: 删去句首副词后多余逗号，并在两部分主句中严格执行 V2 动词提前倒装
  - prompt: 【介词接口纠错】⟦Kommunen skal balancere hensynet om borgernes tryghed overfor ytringsfriheden.⟧ →
    kind: write
    accept:
    - Kommunen skal balancere hensynet til borgernes tryghed over for ytringsfriheden.
    prefill: Kommunen skal balancere hensynet om borgernes tryghed overfor ytringsfriheden.
    explain: ⟦hensynet⟧ 固定接 ⟦til⟧，对比项前用分写的 ⟦over for⟧
  - prompt: 【省略 ⟦hvis⟧ 被动条件升级】用省略 ⟦hvis⟧ 的对称句式改写：⟦Hvis grænsen bliver trukket for bredt, bliver sårbare grupper svigtet.⟧ →
    kind: write
    accept:
    - Trækkes grænsen for bredt, svigtes sårbare grupper.
    explain: 用省略 ⟦hvis⟧ 的 ⟦-s⟧ 被动倒装，形成对称凝练的法理表达
  - prompt: 【名词化与权威表达升级】用 ⟦på en ukuelig principfasthed⟧ 升级：⟦Vi skal stå meget fast på vores principper, når vi forsvarer friheden.⟧ →
    kind: write
    accept:
    - Forsvaret for friheden hviler på en ukuelig principfasthed.
    explain: 以抽象名词化短语替换平淡动词短语，显著提升 C1 书面语感
  - prompt: 【双轨辩证连接升级】将两句合并为 ⟦Principielt set... i praksis... imidlertid...⟧ 句式：⟦Ytringsfriheden gælder for alle i teorien. Mange forskere tier i virkeligheden på grund af digital chikane.⟧ →
    kind: write
    accept:
    - Principielt set gælder ytringsfriheden for alle, men i praksis tier mange forskere imidlertid på grund af digital chikane.
    explain: 运用双轨辩证副词与 ⟦imidlertid⟧ 构建紧扣张力的复合长句
  open: true
