  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 原则上，公民应当有权在不受审查的情况下表达不受欢迎的观点。
    answer: Principielt set bør borgerne have ret til at ytre upopulære holdninger uden censur.
  - zh: 然而在实践中，社交平台上的匿名骚扰正威胁着社会凝聚力。
    answer: I praksis truer anonym chikane på sociale medier imidlertid samfundets sammenhængskraft.
  - zh: 法治国家必须在尖锐批评与非法威胁之间划出极其微妙的界线。
    answer: Retsstaten må trække en hårfin grænse mellem skarp kritik og ulovlige trusler.
  - zh: 我们应当在个人言论自由的考量与弱势群体的尊严之间求得平衡。
    answer: Vi bør balancere hensynet til individets ytringsfrihed over for sårbare gruppers værdighed.
  - zh: 一方面需要坚定不移的原则立场，另一方面也需要数字自律。
    answer: På den ene side kræves der ukuelig principfasthed, på den anden side digital selvjustits.
  - zh: 倘若界线划得过窄，公开辩论中的必要分歧就会遭到扼杀。
    answer: Trækkes grænsen for snævert, kvæles den nødvendige uenighed i den offentlige debat.
