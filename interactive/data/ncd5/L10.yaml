- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 日常生活是从何时起变成一项必须不断优化的工程的？
    answer: Hvornår blev hverdagen til et projekt, som man hele tiden skal optimere?
  - zh: 我们今天体验到的，归根结底究竟是自由还是一种隐蔽的强迫？
    answer: Er det i grunden frihed eller en subtil form for tvang, vi oplever?
  - zh: 这一概念不仅涵盖高分要求，也涵盖持续不断的自我剥削。
    answer: Begrebet dækker ikke blot over høje karakterkrav, men også over konstant selvudnyttelse.
  - zh: 悖论在于，外部指令已被现代人的自愿自我优化所取代。
    answer: Paradokset består i, at ydre pligter er blevet erstattet af frivillig selvoptimering.
  - zh: 剥开表层就会发现，对完美生活的追逐反而滋生出慢性不足感。
    answer: Når man skræller overfladen væk, nærer jagten på perfektion en kronisk utilstrækkelighed.
  - zh: 当任何休息都必须被证明是合理的，人们便失去了当下的喘息空间。
    answer: Hvis enhver pause skal retfærdiggøres, mister vi vores nødvendige åndehul i nuet.
