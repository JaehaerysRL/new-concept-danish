- id: B
  type: drill
  title: 练习 B：哲学思辨句法纠错与修辞升级（修正搭配/语序错误，或按提示升级）
  items:
  - prompt: 【悖论介词纠错】⟦Paradokset består af, at vi har mere fritid, men føler os mere stressede end før.⟧ →
    kind: write
    accept:
    - Paradokset består i, at vi har mere fritid, men føler os mere stressede end før.
    prefill: Paradokset består af, at vi har mere fritid, men føler os mere stressede end før.
    explain: 阐述“悖论在于……”须用 ⟦bestå i⟧，不可误用 ⟦bestå af⟧
  - prompt: 【助动词与从句语序纠错】⟦Artiklen forklarer, at der har opstået en ny form for selvudnyttelse blandt studerende.⟧ →
    kind: write
    accept:
    - Artiklen forklarer, at der er opstået en ny form for selvudnyttelse blandt studerende.
    prefill: Artiklen forklarer, at der har opstået en ny form for selvudnyttelse blandt studerende.
    explain: ⟦opstå⟧ 属状态变化动词，完成时必须搭配助动词 ⟦er⟧
  - prompt: 【对称介词与平行纠错】⟦Udbrændthed dækker ikke blot over træthed i kroppen, men også en følelse af manglende værdi.⟧ →
    kind: write
    accept:
    - Udbrændthed dækker ikke blot over træthed i kroppen, men også over en følelse af manglende værdi.
    prefill: Udbrændthed dækker ikke blot over træthed i kroppen, men også en følelse af manglende værdi.
    explain: 注意 ⟦ikke blot... men også...⟧ 并列两个名词短语时须对称复现介词 ⟦over⟧
  - prompt: 【前置时间从句 V2 纠错】⟦Når man skræller de polerede billeder væk, det viser sig, at mange kæmper med angst.⟧ →
    kind: write
    accept:
    - Når man skræller de polerede billeder væk, viser det sig, at mange kæmper med angst.
    prefill: Når man skræller de polerede billeder væk, det viser sig, at mange kæmper med angst.
    explain: 前置从句占第 1 位，主句变位动词 ⟦viser⟧ 必须紧跟实现 V2 倒装
  - prompt: 【连续设问修辞升级】将平淡陈述改写为“⟦Hvornår blev...⟧”修辞设问：⟦Vores fritid er desværre blevet til en slags arbejde, hvor man skal optimere sin sundhed.⟧ →
    kind: write
    accept:
    - Hvornår blev vores fritid reduceret til et arbejde, hvor man skal optimere sin sundhed?
    explain: 借助连续设问将平淡叙述升级为尖锐哲学追问
  - prompt: 【概念对照升级】用 ⟦I modsætning til... er... præget af...⟧ 整合句意：⟦Disciplinsamfundet brugte ydre forbud. Præstationssamfundet bruger indre selvoptimering.⟧ →
    kind: write
    accept:
    - I modsætning til disciplinsamfundet, der brugte ydre forbud, er præstationssamfundet præget af indre selvoptimering.
    explain: 运用 ⟦I modsætning til⟧ 与关系从句完成概念对照拆解
  open: true
