- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 在关于公立学校的讨论中，我们必须严格区分学业培训与全人教养。
    answer: I debatten om folkeskolen må vi skelne klart mellem uddannelse og dannelse.
  - zh: 如果说学业教育指向具体技能，全人教养则关乎人的道德判断力。
    answer: Hvor uddannelse retter sig mod konkrete færdigheder, handler dannelse om etisk dømmekraft.
  - zh: 外在的安全规则本身并不会自动在课堂上创造内在的安心感。
    answer: Ydre regler om sikkerhed skaber ikke i sig selv indre tryghed i klassen.
  - zh: 国家社会可以通过法律，但有凝聚力的共同体却产生于日常相处之中。
    answer: Samfundet vedtager love, men et stærkt fællesskab opstår gennem dagligt samvær.
  - zh: 学科能力与全人教养不应被摆成对立面，因为二者其实互为前提。
    answer: Faglighed og dannelse bør ikke stilles op som modsætninger, da de forudsætter hinanden.
  - zh: 在哈尔·科赫的精神中，民主首先是一种必须从小练习的日常对话。
    answer: I Hal Kochs ånd er demokrati først og fremmest en samtale, som skal øves.
