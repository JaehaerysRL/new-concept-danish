- id: B
  type: drill
  title: 练习 B：文化概念辨析纠错与 C1 句法升级（修正误用/语序，或按提示合并）
  items:
  - prompt: 【文化概念误用纠错】⟦Når eleverne ikke bliver latterliggjort for fejl, oplever de stor sikkerhed i undervisningen.⟧ →
    kind: write
    accept:
    - Når eleverne ikke bliver latterliggjort for fejl, oplever de stor tryghed i undervisningen.
    prefill: Når eleverne ikke bliver latterliggjort for fejl, oplever de stor sikkerhed i undervisningen.
    explain: 心理层面安心不怕出错必须用 ⟦tryghed⟧，不可误用 ⟦sikkerhed⟧
  - prompt: 【对比从句 V2 倒装纠错】⟦Hvor samfundet udgør den juridiske ramme, et fællesskab bygger på frivillig tillid.⟧ →
    kind: write
    accept:
    - Hvor samfundet udgør den juridiske ramme, bygger et fællesskab på frivillig tillid.
    prefill: Hvor samfundet udgør den juridiske ramme, et fællesskab bygger på frivillig tillid.
    explain: ⟦Hvor⟧-对比从句置于句首时，主句变位动词 ⟦bygger⟧ 须触发 V2 倒装
  - prompt: 【动词搭配与介词纠错】⟦Vi bør ikke skelne faglighed fra dannelse, og heller ikke blande dem med hinanden.⟧ →
    kind: write
    accept:
    - Vi bør skelne mellem faglighed og dannelse, men heller ikke blande dem sammen.
    prefill: Vi bør ikke skelne faglighed fra dannelse, og heller ikke blande dem med hinanden.
    explain: “区分”固定搭配 ⟦skelne mellem A og B⟧；“混淆”用 ⟦blande A og B sammen⟧
  - prompt: 【不规则过去完成时纠错】⟦Hal Kochs demokratiopfattelse har altid forudsattet en aktiv samtale mellem borgerne.⟧ →
    kind: write
    accept:
    - Hal Kochs demokratiopfattelse har altid forudsat en aktiv samtale mellem borgerne.
    prefill: Hal Kochs demokratiopfattelse har altid forudsattet en aktiv samtale mellem borgerne.
    explain: 不规则过去分词作 ⟦forudsat⟧，不加 ⟦-tet⟧
  - prompt: 【对比句型合并升级】用 ⟦Hvor... retter sig mod..., handler... om...⟧ 合并：⟦Uddannelse retter sig mod arbejdsmarkedet. Dannelse handler om etisk dømmekraft.⟧ →
    kind: write
    accept:
    - Hvor uddannelse retter sig mod arbejdsmarkedet, handler dannelse om etisk dømmekraft.
    explain: 借助 ⟦Hvor..., handler...⟧ 构建严密概念界定句并正确倒装
  - prompt: 【破除二元对立升级】用 ⟦stille... op som modsætninger⟧ 与 ⟦forudsætte hinanden⟧ 改写：⟦Politikere siger tit, at test og dannelse ikke passer sammen, men de har brug for hinanden.⟧ →
    kind: write
    accept:
    - Politikere stiller ofte test og dannelse op som modsætninger, selvom de faktisk forudsætter hinanden.
    explain: 以固定短语替代口语化表述，突出“互为前提”的辩证力
  open: true
