  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 人工智能在诊断中的应用引发了关于隐私保护的根本性伦理困境。
    answer: Brugen af kunstig intelligens i diagnostik rejser fundamentale etiske dilemmaer om privatlivet.
  - zh: 哪怕出于善意的基因干预，也可能为将人类性状商品化开创先例。
    answer: Selv velmente genetiske indgreb kan skabe præcedens for at gøre menneskelige egenskaber til varer.
  - zh: 许多伦理学家警告，社会正在走上一条带来难以预料后果的滑坡。
    answer: Mange etikere advarer om, at samfundet bevæger sig ud ad en farlig glidebane.
  - zh: 技术发展得越快，立法者及时出手干预的需求就越迫切。
    answer: Jo hurtigere teknologien udvikler sig, desto stærkere bliver behovet for lovgivning i tide.
  - zh: 除非我们尽早划定具有约束力的法律界线，否则医疗团结互助将瓦解。
    answer: Medmindre vi sætter bindende juridiske grænser snart, smuldrer solidariteten i sundhedsvæsenet.
  - zh: 面对未来的基因医学，我们必须追问自己究竟把边界划在哪里。
    answer: Over for fremtidens genmedicin må vi spørge os selv, hvor vi sætter grænsen.
