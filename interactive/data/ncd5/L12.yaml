- id: B
  type: drill
  title: 练习 B：C1 伦理句法纠错与推演升级（修正语序/搭配错误，或按提示升级）
  items:
  - prompt: 【⟦Jo..., desto...⟧ 倒装纠错】⟦Jo hurtigere teknologien vokser, desto sværere det bliver at regulere den.⟧ →
    kind: write
    accept:
    - Jo hurtigere teknologien vokser, desto sværere bliver det at regulere den.
    explain: ⟦desto⟧-主句部分在比较级短语后必须触发 V2 倒装，将动词 ⟦bliver⟧ 置于主语 ⟦det⟧ 之前
  - prompt: 【先例搭配与冠词纠错】⟦Dette forslag kan lave en præcedens til kommerciel brug af fostres DNA.⟧ →
    kind: write
    accept:
    - Dette forslag kan skabe præcedens for kommerciel brug af fostres DNA.
    prefill: Dette forslag kan lave en præcedens til kommerciel brug af fostres DNA.
    explain: 用动词 ⟦skabe⟧ 替代 ⟦lave⟧，去掉多余不定冠词 ⟦en⟧，并将介词改用 ⟦for⟧
  - prompt: 【助动词与过去分词纠错】⟦Mange etiske eksperter frygter, at grænsen mellem helbredelse og optimering allerede har skredet.⟧ →
    kind: write
    accept:
    - Mange etiske eksperter frygter, at grænsen mellem helbredelse og optimering allerede er skredet.
    prefill: Mange etiske eksperter frygter, at grænsen mellem helbredelse og optimering allerede har skredet.
    explain: 状态变化动词 ⟦at skride⟧ 的完成时必须使用助动词 ⟦er⟧
  - prompt: 【核心动词搭配纠错】⟦Ny medicinsk teknologi laver mange etiske dilemmaer og får uoverskuelig konsekvenser.⟧ →
    kind: write
    accept:
    - Ny medicinsk teknologi rejser mange etiske dilemmaer og får uoverskuelige konsekvenser.
    prefill: Ny medicinsk teknologi laver mange etiske dilemmaer og får uoverskuelig konsekvenser.
    explain: 改用固定搭配动词 ⟦rejser⟧，并将复数形容词 ⟦uoverskuelige⟧ 补全词尾 ⟦-e⟧
  - prompt: 【两难推演升级】用 ⟦i behandlingens tjeneste... men skabe præcedens for...⟧ 改写：⟦Genredigering er god til at kurere sygdom, men kan også føre til designerbørn.⟧ →
    kind: write
    accept:
    - Genredigering bør kun bruges i behandlingens tjeneste, da kommercielle tilbud ellers kan skabe præcedens for designerbørn.
    explain: 运用课内高级名词短语与先例搭配完成论证升级
  - prompt: 【递进警示升级】用 ⟦Jo..., desto...⟧ 合并：⟦Algoritmerne bliver klogere. Det bliver også mere presserende at beskytte patientens selvbestemmelse.⟧ →
    kind: write
    accept:
    - Jo klogere algoritmerne bliver, desto mere presserende bliver det at beskytte patientens selvbestemmelse.
    explain: 用 ⟦Jo..., desto...⟧ 严格按“前不倒装、后必倒装”规范合并
  open: true
