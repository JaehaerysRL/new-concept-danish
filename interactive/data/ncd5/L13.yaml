- id: B
  type: drill
  title: 练习 B：文学评论句式纠错与 C1 凝练升级（修正语法与搭配错误，或按要求改写）
  items:
  - prompt: 【语序纠错】⟦Ved nærmere eftersyn, eventyret er ikke blot en sød fortælling for børn.⟧ →
    kind: write
    accept:
    - Ved nærmere eftersyn er eventyret ikke blot en sød fortælling for børn.
    prefill: Ved nærmere eftersyn, eventyret er ikke blot en sød fortælling for børn.
    explain: 去掉英语式逗号，且句首状语触发主句 V2 倒装：⟦er eventyret⟧
  - prompt: 【搭配纠错】⟦Litteraturforskere fortolker ofte værket til en skarp allegori af det borgerlige samfund.⟧ →
    kind: write
    accept:
    - Litteraturforskere fortolker ofte værket som en skarp allegori over det borgerlige samfund.
    prefill: Litteraturforskere fortolker ofte værket til en skarp allegori af det borgerlige samfund.
    explain: 搭配修正：⟦fortolke som⟧ 与 ⟦allegori over / på⟧
  - prompt: 【复数词形纠错】⟦H.C. Andersen skrev mange berømte eventyrer, som stadig diskuteres i dag.⟧ →
    kind: write
    accept:
    - H.C. Andersen skrev mange berømte eventyr, som stadig diskuteres i dag.
    prefill: H.C. Andersen skrev mange berømte eventyrer, som stadig diskuteres i dag.
    explain: 中性名词 ⟦et eventyr⟧ 单复同形，⟦eventyrer⟧ 意为“冒险家”
  - prompt: 【表里对比升级】用 ⟦Ved første øjekast... Ved nærmere eftersyn...⟧ 改写：⟦Historien virker først meget enkel, men senere opdager man, at den kritiserer samfundet.⟧ →
    kind: write
    accept:
    - Ved første øjekast virker historien meget enkel, men ved nærmere eftersyn kritiserer den samfundet.
    explain: 运用“乍看……细看……”标准对照结构提升思辨层次
  - prompt: 【否定升级】用 ⟦Snarere end blot at være... læses værket som...⟧ 改写：⟦Skyggen er ikke kun en uhyggelig historie; den handler i høj grad om tomme facader.⟧ →
    kind: write
    accept:
    - Snarere end blot at være en uhyggelig historie læses Skyggen som en allegori over tomme facader.
    explain: 用 ⟦Snarere end blot at...⟧ 实现表里定性升级
  - prompt: 【潜台词提炼】用 ⟦Under den tilsyneladende... gemmer der sig...⟧ 改写：⟦Teksten ser harmløs ud, men den indeholder faktisk en bitter kritik af snobberi.⟧ →
    kind: write
    accept:
    - Under den tilsyneladende harmløse form gemmer der sig en bitter kritik af snobberi.
    explain: 用形式主语存现结构突出潜台词焦点
  open: true
