- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 在看似天真的表层之下，这些童话隐藏着尖锐的潜台词。
    answer: Under den tilsyneladende uskyldige overflade gemmer disse eventyr en skarp undertekst.
  - zh: 经仔细审视，该文本实际上是一出关于虚荣心的辛辣阶级讽刺。
    answer: Ved nærmere eftersyn er teksten faktisk en bidende klassesatire over forfængelighed.
  - zh: 这部作品不应只被读作儿童故事，而应被视为一则现代寓言。
    answer: Dette værk bør ikke kun læses som børnelitteratur, men som en moderne allegori.
  - zh: 安徒生的文本暴露了人们在面对权力时的集体自欺。
    answer: Andersens tekst udstiller menneskers kollektive selvbedrag i mødet med magten.
  - zh: 他的许多故事都折射出十九世纪僵化的社会等级。
    answer: Mange af hans historier afspejler de stive sociale skel i 1800-tallet.
  - zh: 只有能够看穿双关多义的读者，才能领会作者的艺术深度。
    answer: Kun den læser, der kan gennemskue tvetydigheden, forstår forfatterens kunstneriske dybde.
