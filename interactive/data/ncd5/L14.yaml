- id: B
  type: drill
  title: 练习 B：高阶书面连接句纠错与升级（修正从句语序、V2 或用词错误，或按提示整合升级）
  items:
  - prompt: 【从句语序纠错】⟦Småstater må ofte indgå alliancer, idet kan de sjældent klare sikkerheden alene.⟧ →
    kind: write
    accept:
    - Småstater må ofte indgå alliancer, idet de sjældent kan klare sikkerheden alene.
    prefill: Småstater må ofte indgå alliancer, idet kan de sjældent klare sikkerheden alene.
    explain: ⟦idet⟧ 引导从句，主语 ⟦de⟧ 在前，副词 ⟦sjældent⟧ 站在动词 ⟦kan⟧ 前
  - prompt: 【句首倒装纠错】⟦Desuagtet, Danmark har længe været en loyal partner i det europæiske miljøsamarbejde.⟧ →
    kind: write
    accept:
    - Desuagtet har Danmark længe været en loyal partner i det europæiske miljøsamarbejde.
    prefill: Desuagtet, Danmark har længe været en loyal partner i det europæiske miljøsamarbejde.
    explain: 去掉逗号，⟦Desuagtet⟧ 置句首立即触发 V2 倒装 ⟦har Danmark⟧
  - prompt: 【词形与语序纠错】⟦Vi må undersøge, i hvilket udstrækning påvirker europæiske regler dansk erhvervsliv.⟧ →
    kind: write
    accept:
    - Vi må undersøge, i hvilken udstrækning europæiske regler påvirker dansk erhvervsliv.
    prefill: Vi må undersøge, i hvilket udstrækning påvirker europæiske regler dansk erhvervsliv.
    explain: 共性名词用 ⟦hvilken⟧，且间接疑问从句内部维持主语 + 动词不倒装
  - prompt: 【因果升级】用 ⟦eftersom⟧ 合并两句：⟦Danmark har få naturlige råstoffer. Landet er dybt afhængigt af global handel.⟧ →
    kind: write
    accept:
    - Danmark er dybt afhængigt af global handel, eftersom landet har få naturlige råstoffer.
    explain: 用正式因果连词 ⟦eftersom⟧ 整合因果逻辑
  - prompt: 【手段结果升级】用 ⟦, hvormed⟧ 合并两句：⟦Vælgerne fjernede forsvarsforbeholdet i 2022. Dermed fik Danmark en ny rolle i Europa.⟧ →
    kind: write
    accept:
    - Vælgerne fjernede forsvarsforbeholdet i 2022, hvormed Danmark fik en ny rolle i Europa.
    explain: 用 ⟦, hvormed⟧ 顺滑承接结果，从句不倒装
  - prompt: 【归属列举升级】用 ⟦, herunder⟧ 浓缩句子：⟦Politikerne diskuterede flere danske forbehold, og de talte blandt andet om euroen og retsområdet.⟧ →
    kind: write
    accept:
    - Politikerne diskuterede flere danske forbehold, herunder euroen og retsområdet.
    explain: 用 ⟦herunder⟧ 精炼替换冗长并列句
  open: true
