- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 丹麦依赖开放贸易，因为这个小国几乎没有自然资源。
    answer: Danmark er afhængigt af åben handel, eftersom det lille land næsten ingen råstoffer har.
  - zh: 选民们争论过，这是否会削弱国家的民主自决权。
    answer: Vælgerne diskuterede, hvorvidt dette ville svække landets demokratiske selvbestemmelse.
  - zh: 关键问题在于，我们在多大程度上愿意让渡主权。
    answer: Det centrale spørgsmål er, i hvilken udstrækning vi vil afgive suverænitet.
  - zh: 历史带来了疑虑，尽管如此，丹麦在实践中仍然忠实遵守欧洲规则。
    answer: Historien skabte skepsis; desuagtet følger Danmark i praksis loyalt de europæiske regler.
  - zh: 该国出口多种商品，其中包括绿色能源和医药产品。
    answer: Landet eksporterer mange varer, herunder grøn energi og medicinske produkter.
  - zh: 政府通过了新协议，从而加强了自身的国际影响力。
    answer: Regeringen vedtog en ny aftale, hvormed den styrkede sin internationale indflydelse.
