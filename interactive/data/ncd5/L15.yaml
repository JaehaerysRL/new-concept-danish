- id: B
  type: drill
  title: 练习 B：Syntese 语序纠错与双源句型合并手术（修正错误，或将 A、B 两方观点合成为一句 C1 综合对比句）
  items:
  - prompt: 【V2 倒装纠错】⟦Hvor Kilde A understreger institutionel tillid, Kilde B peger på kulturel konformitet og Jantelov.⟧ →
    kind: write
    accept:
    - Hvor Kilde A understreger institutionel tillid, peger Kilde B på kulturel konformitet og Jantelov.
    prefill: Hvor Kilde A understreger institutionel tillid, Kilde B peger på kulturel konformitet og Jantelov.
    explain: 句首 ⟦Hvor⟧ 从句整体占第 1 位，主句动词 ⟦peger⟧ 必须 V2 倒装
  - prompt: 【搭配与倒装纠错】⟦På trods af deres uenighed om målingerne, de to forfattere tager et alvorligt blik på stress.⟧ →
    kind: write
    accept:
    - På trods af deres uenighed om målingerne deler de to forfattere en bekymring for stress.
    prefill: På trods af deres uenighed om målingerne, de to forfattere tager et alvorligt blik på stress.
    explain: 去掉逗号并实行 V2 倒装；同时注意搭配为 ⟦dele en bekymring / anlægge et kritisk blik⟧
  - prompt: 【交叉对比合成】用 ⟦Hvor Kilde A fremhæver..., anlægger Kilde B et markant mere kritisk perspektiv, idet...⟧ 合并：Kilde A 强调免费医疗与教育消除焦虑；Kilde B 指出完美条件反而让失败被视为个人过错。→
    kind: write
    accept:
    - Hvor Kilde A fremhæver, at gratis velfærd fjerner utryghed, anlægger Kilde B et markant mere kritisk perspektiv, idet perfekte rammer får mistrivsel til at føles som en individuel fiasko.
    prefill: Hvor Kilde A fremhæver..., anlægger Kilde B et markant mere kritisk perspektiv, idet...
    explain: 交叉对比句型精确合成
  - prompt: 【反驳质疑合成】用 ⟦I modsætning til Kilde A's tolkning anfægter Kilde B..., idet...⟧ 合并：Kilde A 认为高分反映持久生活满意度；Kilde B 认为问卷测出的只是感恩的义务感。→
    kind: write
    accept:
    - I modsætning til Kilde A's tolkning anfægter Kilde B selve målemetoden, idet spørgeskemaer måske snarere måler pligtfølelse end ægte trivsel.
    prefill: I modsætning til Kilde A's tolkning anfægter Kilde B..., idet...
    explain: 聚焦方法论分歧
  - prompt: 【隐性共识提炼】用 ⟦På trods af denne uenighed deler de to tekster den opfattelse, at...⟧ 合成两篇均承认“部分群体仍面临压力与心理脆弱”。→
    kind: write
    accept:
    - På trods af denne uenighed deler de to tekster den opfattelse, at psykisk sårbarhed fortsat udgør en alvorlig udfordring.
    prefill: På trods af denne uenighed deler de to tekster den opfattelse, at...
    explain: 精准提炼隐性共识
  - prompt: 【综合权衡收束】用 ⟦Sammenholdes de to kilder, bliver det tydeligt, at...⟧ 归结物质保障无法自动消除孤独感。→
    kind: write
    accept:
    - Sammenholdes de to kilder, bliver det tydeligt, at materiel tryghed ikke automatisk fjerner menneskelig ensomhed.
    prefill: Sammenholdes de to kilder, bliver det tydeligt, at...
    explain: 对比收束句型
  open: true
