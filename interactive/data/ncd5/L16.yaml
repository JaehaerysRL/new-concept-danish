    explain: 不定式短语作主语，句式凝练庄重
  - prompt: 【哲思反转升级】用 ⟦Snarere end at... bør man...⟧ 改写：⟦Vi skal ikke være kede af uoversættelige ord, men lytte bedre til kulturen.⟧ →
