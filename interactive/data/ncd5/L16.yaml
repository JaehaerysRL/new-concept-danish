- id: order
  type: order
  title: 语序拼句（由中译丹答案生成）
  instruction: 点击词块，按正确语序拼出句子。
  items:
  - zh: 起初，一门新语言往往不过是一件实用工具。
    answer: I begyndelsen er et nyt sprog sjældent andet end et praktisk redskab.
  - zh: 生活在两种语言之间并不意味着一种语言必须取代另一种语言。
    answer: At leve på to sprog betyder ikke, at det ene skal erstatte det andet.
  - zh: 母语承载着童年记忆，而心语则开辟了一片新的自由空间。
    answer: Hvor modersmålet bærer barndommens minder, åbner hjertesproget et nyt rum for frihed.
  - zh: 不可译的词语邀请我们更加深入地倾听另一种文化。
    answer: De uoversættelige ord inviterer os til at lytte dybere til en anden kultur.
  - zh: 在一门新语言中找到家园并不要求我们抹去自己的过去。
    answer: At finde hjem i et nyt sprog kræver ikke, at man sletter sin fortid.
  - zh: 当两个世界在一个声音中相遇时，每一个词都成为一座桥梁。
    answer: Når to verdener mødes i én stemme, bliver hvert eneste ord en bro.
