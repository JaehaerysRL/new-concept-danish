  - prompt: 【不定式主语凝练】用 ⟦At finde hjem i et nyt sprog kræver ikke, at...⟧ 改写：⟦Hvis du vil føle dig hjemme på dansk, behøver du ikke glemme din accent.⟧ →
    kind: write
